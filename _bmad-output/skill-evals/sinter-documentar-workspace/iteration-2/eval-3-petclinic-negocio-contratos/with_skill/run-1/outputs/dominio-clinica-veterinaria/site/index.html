<script>
const D = {"nome": "Clínica Veterinária", "paginas": [{"arquivo": "1-negocio.md", "nome": "Negócio", "resumo": "cadastro de uma clínica veterinária — donos, pets, veterinários e o histórico de visitas de cada pet — com um assistente de IA que responde perguntas e cadastra dono/pet por conversa. Não há agendamento com confirmação, cobrança nem prontuário clínico.", "texto": "# Negócio: Clínica Veterinária\n\n> **Em resumo:** cadastro de uma clínica veterinária — donos, pets, veterinários e o histórico de\n> visitas de cada pet — com um assistente de IA que responde perguntas e cadastra dono/pet por\n> conversa. Não há agendamento com confirmação, cobrança nem prontuário clínico.\n\n## Nesta página\n| Seção | Em uma linha |\n|---|---|\n| [Em uma frase](#em-uma-frase) | O que é, para quem, por quê |\n| [Por que existe](#por-que-existe) | O valor que entrega |\n| [Faz / Não faz / Não sabemos](#faz--não-faz--não-sabemos) | A fronteira do domínio |\n| [A parede do domínio](#a-parede-do-domínio) | Do cadastro do dono ao histórico de visitas |\n| [Jornadas principais](#jornadas-principais) | As 5 jornadas do domínio |\n| [Quem orquestra](#quem-orquestra) | Nada centraliza — chamadas diretas ou agregação pontual |\n| [Regras que mandam](#regras-que-mandam) | As 5 regras mais visíveis no código |\n| [Entra e sai](#entra-e-sai) | Com quem o domínio troca informação |\n| [Linguagem](#linguagem) | Os termos do domínio |\n| [Indicadores](#indicadores) | Como saber que vai bem |\n\n## Em uma frase\nManter o cadastro de donos, pets e veterinários de uma clínica veterinária, registrar o\nhistórico de visitas de cada pet, e oferecer um assistente de IA que consulta e atualiza esses\ndados por meio de conversa em linguagem natural.\n\n## Por que existe\nClassificação: **core** *(a confirmar — o repositório é publicamente descrito como aplicação de\nexemplo/demonstração da Spring, não uma clínica real; tratamos aqui como se fosse o domínio de\nnegócio real, como pedido)*. O valor é dar a uma clínica uma visão única de \"quem é esse dono\",\n\"quais pets ele tem\" e \"o que já aconteceu com cada pet\", reduzindo a necessidade de planilhas ou\npapel — e permitir que essa consulta seja feita por conversa (assistente de IA) além de telas.\n\n## Faz / Não faz / Não sabemos\n| Faz | Não faz | Não sabemos |\n|---|---|---|\n| Cadastra donos e seus pets | Agendamento com confirmação/conflito de horário | Se há front-end de agendamento em outro repositório |\n| Registra histórico de visitas (data + descrição) | Cobrança, pagamento, convênio pet | Se há autenticação/login de usuário |\n| Mantém cadastro de veterinários e especialidades | Prontuário clínico (diagnóstico, receita, exames) | Se há papel de \"recepção\" distinto de \"veterinário\" |\n| Responde perguntas e age via chatbot de IA | Notificação ao dono (e-mail/SMS) | Regra real por trás dos tipos de pet aceitos pela IA |\n| Agrega a \"ficha\" do dono com pets e visitas | Estoque de insumos/medicamentos | Dono/responsável de cada serviço (sem `CODEOWNERS`) |\n\n## A parede do domínio\n| # | 🟨 Quem | 🟦 Faz | 🟧 Acontece | 🟪 Regra ou reação |\n|---|---|---|---|---|\n| 1 | Recepção/dono | Cadastra o dono | Dono cadastrado | Nome, endereço, cidade e telefone obrigatórios; telefone só números, até 12 dígitos |\n| 2 | Recepção/dono | Cadastra um pet para o dono | Pet cadastrado | Precisa de um dono já existente; nome do pet obrigatório |\n| 3 | Clínica/veterinário | Registra a visita de um pet | Visita registrada | Descrição livre até 8192 caracteres; sem checagem de que o pet existe |\n| 4 | Dono/recepção | Abre a ficha do dono | Ficha exibida (dono + pets + visitas) | Se o histórico de visitas não responder a tempo, mostra os pets sem histórico em vez de falhar |\n| 5 | Dono/recepção | Consulta a lista de veterinários | Lista exibida (pode vir de cache) | — |\n| 6 | Usuário | Pergunta ou pede uma ação ao assistente de IA | Resposta gerada, e opcionalmente dono/pet criado | O assistente só executa as 4 ações que tem disponíveis; se não souber responder, deve dizer isso e perguntar de volta |\n\n🟥 **Dúvidas:** não há evento de \"visita cancelada\" ou \"dono removido\" — o domínio não modela exclusão nem cancelamento, só criação e atualização. Não está claro quem, na operação real da clínica, dispara cada passo (recepcionista humano? o próprio tutor pelo site? só o assistente de IA?) — o código não distingue papéis de usuário.\n\n## Jornadas principais\n| Jornada | Em uma linha | Link |\n|---|---|---|\n| Cadastrar dono e pet | Recepção registra um novo dono e seus pets | [4-jornadas.md](4-jornadas.md#cadastrar-dono-e-pet) |\n| Registrar uma visita | Clínica registra o atendimento de um pet | [4-jornadas.md](4-jornadas.md#registrar-uma-visita) |\n| Consultar a ficha do dono | Ver o dono com pets e histórico de visitas | [4-jornadas.md](4-jornadas.md#consultar-a-ficha-do-dono) |\n| Consultar veterinários | Ver a equipe clínica e especialidades | [4-jornadas.md](4-jornadas.md#consultar-veterinários) |\n| Conversar com o assistente de IA | Perguntar ou pedir ações em linguagem natural | [4-jornadas.md](4-jornadas.md#conversar-com-o-assistente-de-ia) |\n\n## Quem orquestra\n| Jornada | Quem manda | Como |\n|---|---|---|\n| Cadastrar dono e pet | Ninguém — chamadas diretas e sequenciais | Cliente (front-end ou IA) decide a ordem |\n| Registrar uma visita | Ninguém — chamada direta | — |\n| Consultar a ficha do dono | `api-gateway` | Agregação pontual (fan-out): busca dono, depois visitas, com circuit breaker |\n| Consultar veterinários | Ninguém — chamada direta (proxy) | — |\n| Conversar com o assistente de IA | O próprio modelo de IA (tool calling) | O LLM decide, a cada mensagem, qual das 4 ações chamar |\n\nNão existe um motor de processo (BPM/Step Functions/Temporal) nem coreografia por eventos neste domínio — ver [2-arquitetura.md](2-arquitetura.md#estilo-de-integração).\n\n## Regras que mandam\n| Regra | Valor atual |\n|---|---|\n| Telefone do dono | Só dígitos, até 12 caracteres, obrigatório |\n| Nome do pet | Obrigatório, mínimo 1 caractere |\n| Descrição da visita | Até 8192 caracteres |\n| Tipos de pet aceitos pela IA | 1=cat, 2=dog, 3=lizard, 4=snake, 5=bird, 6=hamster *(a confirmar)* |\n| Memória de conversa do assistente de IA | Mantém as últimas 10 mensagens de contexto |\n\n## Entra e sai\n| Direção | O quê | Com quem |\n|---|---|---|\n| Entra | Cadastro de dono/pet, registro de visita, perguntas em linguagem natural | Front-end (AngularJS no api-gateway), usuário do chat |\n| Sai | Ficha do dono, lista de veterinários, respostas do assistente | Front-end, usuário do chat |\n| Sai | Perguntas/comandos em linguagem natural | 🩷 OpenAI ou Azure OpenAI (provedor de LLM externo) |\n| Entra | Configuração de todos os serviços | 🩷 Repositório Git externo `spring-petclinic-microservices-config` |\n| Sai | Traces e métricas técnicas | 🩷 Zipkin, Prometheus, Grafana |\n\nNão há troca com outros domínios de negócio (faturamento, estoque, laboratório) neste repositório.\n\n## Linguagem\n| Termo | Definição |\n|---|---|\n| Dono (Owner) | Pessoa responsável por um ou mais pets; tem nome, endereço, cidade e telefone |\n| Pet | Animal de um dono, com nome, data de nascimento e um tipo |\n| Tipo de pet (PetType) | Categoria do animal (cat, dog, lizard, snake, bird, hamster, ...) |\n| Visita (Visit) | Registro histórico de um atendimento a um pet, com data e descrição livre |\n| Veterinário (Vet) | Profissional da clínica, com uma ou mais especialidades |\n| Especialidade (Specialty) | Área de atuação de um veterinário (ex.: dentistry) |\n| Ficha do dono | Visão agregada do dono com seus pets e o histórico de visitas de cada um |\n| Assistente de IA | Chatbot que responde perguntas e executa ações (listar donos/veterinários, cadastrar dono/pet) via linguagem natural |\n\n## Indicadores\n*(a confirmar — não há indicadores de negócio explícitos no código)*. O que existe são métricas\ntécnicas de volume/latência de chamadas (`@Timed petclinic.owner`, `petclinic.pet`,\n`petclinic.visit`, expostas via Micrometer/Prometheus/Grafana) — não indicadores de negócio como\n\"taxa de retorno de donos\" ou \"tempo médio até a primeira visita\". Proposta de indicadores a\nvalidar com o negócio: número de donos/pets cadastrados por período, número de visitas\nregistradas por período, uso do assistente de IA (mensagens/ações por período).\n\n**Fontes:** entidades e controllers de `customers-service`, `visits-service`, `vets-service` (regras de validação, campos obrigatórios); `PetclinicChatClient.java` e `PetclinicTools.java` (comportamento e limites do assistente de IA); `ApiGatewayController.java` (agregação da ficha do dono); `README.md` (descrição geral do projeto como demonstração Spring). Classificação do domínio (core/suporte/genérico), donos por papel e indicadores de negócio são deduções ou perguntas, marcadas *(a confirmar)* — não estão escritos em nenhum documento de negócio no repositório.\n", "secoes": [{"titulo": "Em uma frase", "slug": "em-uma-frase", "subs": []}, {"titulo": "Por que existe", "slug": "por-que-existe", "subs": []}, {"titulo": "Faz / Não faz / Não sabemos", "slug": "faz--não-faz--não-sabemos", "subs": []}, {"titulo": "A parede do domínio", "slug": "a-parede-do-domínio", "subs": []}, {"titulo": "Jornadas principais", "slug": "jornadas-principais", "subs": []}, {"titulo": "Quem orquestra", "slug": "quem-orquestra", "subs": []}, {"titulo": "Regras que mandam", "slug": "regras-que-mandam", "subs": []}, {"titulo": "Entra e sai", "slug": "entra-e-sai", "subs": []}, {"titulo": "Linguagem", "slug": "linguagem", "subs": []}, {"titulo": "Indicadores", "slug": "indicadores", "subs": []}]}, {"arquivo": "2-arquitetura.md", "nome": "Arquitetura", "resumo": "microsserviços Spring Cloud — um serviço por subdomínio (donos/pets, visitas, veterinários, IA), um gateway de borda que agrega e roteia, três serviços de plataforma (config, descoberta, admin). Tudo síncrono via REST; sem fila, evento ou orquestrador.", "texto": "# Arquitetura: Clínica Veterinária\n\n> **Em resumo:** microsserviços Spring Cloud — um serviço por subdomínio (donos/pets, visitas,\n> veterinários, IA), um gateway de borda que agrega e roteia, três serviços de plataforma\n> (config, descoberta, admin). Tudo síncrono via REST; sem fila, evento ou orquestrador.\n\n## Nesta página\n| Seção | Em uma linha |\n|---|---|\n| [Contexto](#contexto) | O domínio como caixa, quem entra e quem sai |\n| [Subdomínios](#subdomínios) | Os 6 subdomínios e quais serviços cobrem cada um |\n| [Mapa dos serviços](#mapa-dos-serviços) | Quem chama quem |\n| [Estilo de integração](#estilo-de-integração) | Só síncrono, sem orquestrador dedicado |\n| [Decisões que moldam](#decisões-que-moldam) | Por que é assim |\n| [Riscos técnicos](#riscos-técnicos) | O que quebra junto |\n\n## Contexto\n\n```mermaid\nflowchart LR\n  Dono((Dono do pet)) --> DOM[Domínio Clínica Veterinária]\n  Recepcao((Recepção/clínica)) --> DOM\n  DOM --> LLM[[\"OpenAI / Azure OpenAI\"]]\n  DOM --> GITCFG[[\"Repo Git de configuração\"]]\n  DOM --> OBS[[\"Zipkin / Prometheus / Grafana\"]]\n```\n\nO domínio não conversa hoje com outros domínios de negócio externos (não há integração com faturamento, laboratório, estoque, etc. neste repositório) — só com o front-end embutido, um provedor de LLM e a infraestrutura de plataforma/observabilidade.\n\n## Subdomínios\n\n| Subdomínio | Responsabilidade | Serviços |\n|---|---|---|\n| Cadastro | Dono do pet e seus pets (fonte de verdade) | `customers-service` |\n| Atendimento | Histórico de visitas de cada pet | `visits-service` |\n| Equipe clínica | Veterinários e especialidades | `vets-service` |\n| Assistente de IA | Chat em linguagem natural sobre o domínio, com ações | `genai-service` |\n| Borda | Front-end, roteamento e agregação para quem consome | `api-gateway` |\n| Plataforma | Configuração, descoberta e observabilidade operacional | `config-server`, `discovery-server`, `admin-server` |\n\n## Mapa dos serviços\n\n```mermaid\nflowchart LR\n  subgraph Borda\n    GW[api-gateway]\n  end\n  subgraph Cadastro\n    CS[customers-service]\n  end\n  subgraph Atendimento\n    VS[visits-service]\n  end\n  subgraph \"Equipe clínica\"\n    VT[vets-service]\n  end\n  subgraph \"Assistente de IA\"\n    GEN[genai-service]\n  end\n  subgraph Plataforma\n    CFG[config-server]\n    DISC[discovery-server]\n    ADM[admin-server]\n  end\n\n  GW --> CS\n  GW --> VS\n  GW -->|proxy| VT\n  GW -->|proxy, circuit breaker| GEN\n  GEN --> CS\n  GEN -->|1x na subida| VT\n  GEN --> LLM[[\"OpenAI / Azure OpenAI\"]]\n  CS -.registra/descobre.-> DISC\n  VS -.registra/descobre.-> DISC\n  VT -.registra/descobre.-> DISC\n  GEN -.registra/descobre.-> DISC\n  GW -.registra/descobre.-> DISC\n  CS -.config.-> CFG\n  VS -.config.-> CFG\n  VT -.config.-> CFG\n  GEN -.config.-> CFG\n  GW -.config.-> CFG\n  ADM -.monitora via.-> DISC\n```\n\n`visits-service` e `vets-service` não chamam nenhum outro serviço de negócio — são \"folhas\" do grafo, só respondem.\n\n## Estilo de integração\n\n| Estilo | Onde | Observação |\n|---|---|---|\n| Síncrono REST | Todas as chamadas entre serviços | Via `WebClient`/`RestClient`/`RestTemplate` balanceados por nome (Eureka), ou proxy do Spring Cloud Gateway |\n| Agregação pontual (fan-out) | `api-gateway.getOwnerDetails` | Busca `customers-service` e depois `visits-service` em paralelo, junta e devolve; não é uma saga (sem compensação, só fallback de dados vazios) |\n| Tool calling (LLM decide a chamada) | `genai-service` | O LLM escolhe, em tempo de execução, qual função Java chamar (`PetclinicTools`) com base no pedido do usuário |\n| Assíncrono/eventos | Nenhum | Não há Kafka, SQS/SNS, RabbitMQ nem qualquer publish/subscribe no repositório |\n| Orquestração de processo (BPM/Step Functions/Temporal) | Nenhum | Não há `.bpmn`, `.asl.json`, nem dependência de Camunda/Temporal/Step Functions |\n\nNão há coreografia por eventos nem orquestrador dedicado: cada jornada é uma cadeia curta de chamadas síncronas decidida pelo próprio código do serviço que inicia a chamada (`api-gateway` ou `genai-service`) — ver [4-jornadas.md](4-jornadas.md).\n\n## Decisões que moldam\n\n| Decisão | Efeito | Link |\n|---|---|---|\n| Um banco lógico por serviço (mesmo nome `petclinic`, tabelas diferentes) | Isolamento de dados por serviço, mas nomeação do banco pode confundir operação (ver risco abaixo) | [6-referencia.md](6-referencia.md#decisões) |\n| Configuração centralizada num repositório Git externo | Serviços não têm segredo/porta hardcoded no código, mas a doc real de configuração vive fora deste repo | [6-referencia.md](6-referencia.md#decisões) |\n| Chat de IA chama `customers-service` direto (não via gateway) | Menor latência e acoplamento simples, mas rota de escrita adicional fora do proxy central | [6-referencia.md](6-referencia.md#decisões) |\n| Circuit breaker isola falha de `visits-service` na ficha do dono | Ficha do dono nunca falha por causa do histórico de visitas, mas pode esconder indisponibilidade | [6-referencia.md](6-referencia.md#decisões) |\n\n## Riscos técnicos\n\n- **Ficha do dono \"mente\" sobre visitas ausentes:** se `visits-service` estiver fora ou lento, `api-gateway` devolve a ficha com visitas vazias em vez de erro — visualmente igual a \"pet sem histórico\" (ver [4-jornadas.md](4-jornadas.md#consultar-a-ficha-do-dono)).\n- **`genai-service` pode criar dados sem validação de negócio equivalente ao front-end:** a ferramenta `addPetToOwner` aceita qualquer `typeId` inteiro; a lista de tipos válidos só existe como texto de instrução para o LLM, não como validação no `customers-service`.\n- **Sem transação entre visits-service e customers-service:** uma visita pode ser registrada para um `petId` que não existe (bancos separados, sem checagem cruzada).\n- **Banco MySQL compartilhado com o mesmo nome (`petclinic`) por três serviços:** se apontados para a mesma instância MySQL, `customers-service`, `vets-service` e `visits-service` usam o mesmo banco lógico (tabelas diferentes, sem colisão hoje, mas rompe o isolamento típico de \"um banco por serviço\") *(a confirmar se em produção cada serviço aponta para uma instância própria)*.\n- **Cache de veterinários pode atrasar a visão de mudanças:** `@Cacheable(\"vets\")` sem TTL visível neste repositório.\n- **Sem observabilidade de negócio, só técnica:** métricas existentes (`@Timed petclinic.owner/pet/visit`) medem volume/latência de chamadas, não indicadores de negócio (ver [1-negocio.md](1-negocio.md#indicadores)).\n\n**Fontes:** `docker-compose.yml` e `*/src/main/resources/application.yml` (rotas do gateway, dependências entre serviços); `ApiGatewayController.java`, `CustomersServiceClient.java`, `VisitsServiceClient.java` (agregação e circuit breaker); `AIDataProvider.java`, `PetclinicTools.java` (chamada direta do genai-service ao customers-service); `db/mysql/schema.sql` dos três serviços (mesmo nome de banco); busca no repositório por `*.bpmn`, `*.asl.json`, filas/tópicos (nenhum encontrado).\n", "secoes": [{"titulo": "Contexto", "slug": "contexto", "subs": []}, {"titulo": "Subdomínios", "slug": "subdomínios", "subs": []}, {"titulo": "Mapa dos serviços", "slug": "mapa-dos-serviços", "subs": []}, {"titulo": "Estilo de integração", "slug": "estilo-de-integração", "subs": []}, {"titulo": "Decisões que moldam", "slug": "decisões-que-moldam", "subs": []}, {"titulo": "Riscos técnicos", "slug": "riscos-técnicos", "subs": []}]}, {"arquivo": "3-servicos.md", "nome": "Serviços", "resumo": "8 serviços Spring Boot. Quatro carregam o negócio (donos/pets, visitas, veterinários, chatbot de IA), um é a borda (api-gateway), três são plataforma (config, descoberta, admin). Comunicação só síncrona via REST/HTTP — sem fila nem eventos.", "texto": "# Serviços: Clínica Veterinária\n\n> **Em resumo:** 8 serviços Spring Boot. Quatro carregam o negócio (donos/pets, visitas,\n> veterinários, chatbot de IA), um é a borda (api-gateway), três são plataforma (config,\n> descoberta, admin). Comunicação só síncrona via REST/HTTP — sem fila nem eventos.\n\n## Nesta página\n| Serviço | Subdomínio | Em uma linha |\n|---|---|---|\n| [customers-service](#customers-service) | Cadastro | Dono do pet e seus pets: CRUD completo |\n| [visits-service](#visits-service) | Atendimento | Registra e lista visitas de um pet |\n| [vets-service](#vets-service) | Equipe clínica | Lista veterinários e suas especialidades (com cache) |\n| [genai-service](#genai-service) | Assistente de IA | Chatbot que consulta e cria dados via tool calling |\n| [api-gateway](#api-gateway) | Borda | Roteia o front-end e agrega dono + visitas |\n| [config-server](#config-server) | Plataforma | Configuração centralizada vinda de um repo Git |\n| [discovery-server](#discovery-server) | Plataforma | Registro de serviços (Eureka) |\n| [admin-server](#admin-server) | Plataforma | Painel de saúde/observabilidade (Spring Boot Admin) |\n\n---\n\n## customers-service\n> **Em resumo:** dono do sistema de registro de donos (`Owner`) e pets (`Pet`); é a fonte de\n> verdade que os outros serviços (gateway e IA) consultam para saber quem é o dono e quais pets ele tem.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Cadastro | *(a confirmar, sem CODEOWNERS no repo)* | Java 17, Spring Boot, Spring Data JPA, HSQLDB/MySQL | `spring-petclinic-customers-service/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `POST /owners` | API REST (JSON) | Cria um dono (`OwnerRequest` → `Owner`), retorna 201 |\n| `GET /owners/{ownerId}` | API REST | Busca um dono por id (com seus pets) |\n| `GET /owners` | API REST | Lista todos os donos |\n| `PUT /owners/{ownerId}` | API REST | Atualiza dados de um dono, retorna 204; 404 se não existir |\n| `GET /petTypes` | API REST | Lista os tipos de pet cadastrados (cat, dog, ...) |\n| `POST /owners/{ownerId}/pets` | API REST | Cria um pet para o dono, retorna 201; 404 se dono não existir |\n| `PUT /owners/*/pets/{petId}` | API REST | Atualiza um pet existente, retorna 204 |\n| `GET /owners/*/pets/{petId}` | API REST | Busca detalhe de um pet (inclui tipo) |\n\n### Consome\nNão chama nenhum outro serviço do domínio; é consumido por `api-gateway` e por `genai-service`.\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `OwnerResource` | Requisições REST em `/owners` | CRUD de dono, validação `@Valid` (campos obrigatórios) |\n| `PetResource` | Requisições REST em `/owners/*/pets`, `/petTypes` | CRUD de pet e listagem de tipos |\n| `OwnerEntityMapper` | Chamado pelo `OwnerResource` | Copia campos de `OwnerRequest` para a entidade `Owner` |\n| `ResourceNotFoundException` | Dono/pet não encontrado | Responde HTTP 404 (`@ResponseStatus`) |\n\n### Dados\n```mermaid\nerDiagram\n  OWNERS ||--o{ PETS : tem\n  TYPES ||--o{ PETS : classifica\n  OWNERS {\n    int id PK\n    string first_name\n    string last_name\n    string address\n    string city\n    string telephone\n  }\n  PETS {\n    int id PK\n    string name\n    date birth_date\n    int type_id FK\n    int owner_id FK\n  }\n  TYPES {\n    int id PK\n    string name\n  }\n```\nSem máquina de estados: dono e pet são registros de cadastro (criado/atualizado), sem status de ciclo de vida.\n\n### Quando falha\n- Validação (`@NotBlank`, `@Digits(integer=12)` no telefone) rejeita a requisição antes de chegar ao banco (HTTP 400 do Spring, implícito).\n- Dono ou pet inexistente → `ResourceNotFoundException` → HTTP 404.\n- Sem timeout/retry configurado no próprio serviço; quem chama (api-gateway) é que aplica circuit breaker.\n- Dependência `chaos-monkey-spring-boot` permite injetar falhas propositalmente com o perfil `chaos-monkey` (só em ambiente local de teste).\n\n### Infra que usa\n[Banco HSQLDB (padrão) / MySQL (opcional)](5-infraestrutura.md#recursos), [discovery-server](5-infraestrutura.md#recursos), [config-server](5-infraestrutura.md#recursos).\n\n---\n\n## visits-service\n> **Em resumo:** registra o histórico de visitas de um pet (data + descrição). Não sabe quem é o\n> dono nem o tipo do pet — só guarda o `petId`.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Atendimento | *(a confirmar)* | Java 17, Spring Boot, Spring Data JPA, HSQLDB/MySQL | `spring-petclinic-visits-service/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `POST /owners/*/pets/{petId}/visits` | API REST | Cria uma visita para um pet, retorna 201 |\n| `GET /owners/*/pets/{petId}/visits` | API REST | Lista visitas de um pet |\n| `GET /pets/visits?petId=1&petId=2` | API REST | Lista visitas de vários pets de uma vez (usado pelo gateway) |\n\n### Consome\nNão chama nenhum outro serviço.\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `VisitResource` | Requisições REST | Cria/lista visitas; monta o `record Visits` para respostas em lote |\n\n### Dados\n```mermaid\nerDiagram\n  VISITS {\n    int id PK\n    date visit_date\n    string description\n    int pet_id \"FK logica para PETS (outro serviço/DB)\"\n  }\n```\n`pet_id` não tem `FOREIGN KEY` para a tabela `pets` do customers-service (bancos separados) — é uma referência lógica entre serviços, não de banco. Sem estado (visita não tem status \"confirmada/cancelada\"), é só um registro histórico.\n\n### Quando falha\n- `@Size(max = 8192)` na descrição rejeita textos maiores.\n- Sem validação de que `petId` realmente existe em customers-service — o serviço aceita qualquer inteiro.\n- Sem timeout/retry próprio; o `api-gateway` isola falha desta chamada com circuit breaker ao montar a ficha do dono (ver [4-jornadas.md](4-jornadas.md)).\n\n### Infra que usa\n[Banco HSQLDB (padrão) / MySQL (opcional)](5-infraestrutura.md#recursos), [discovery-server](5-infraestrutura.md#recursos), [config-server](5-infraestrutura.md#recursos).\n\n---\n\n## vets-service\n> **Em resumo:** cadastro de veterinários e suas especialidades; lista é cacheada em memória\n> (`@Cacheable(\"vets\")`) porque muda pouco e é lida com frequência.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Equipe clínica | *(a confirmar)* | Java 17, Spring Boot, Spring Data JPA, HSQLDB/MySQL, Caffeine (cache) | `spring-petclinic-vets-service/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `GET /vets` | API REST | Lista todos os veterinários com suas especialidades (resposta cacheada) |\n\n### Consome\nNão chama nenhum outro serviço.\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `VetResource` | `GET /vets` | Retorna a lista, usando o cache Spring (`CacheConfig`) |\n| `VetsProperties` | Config | Propriedades específicas do serviço *(conteúdo não detalhado)* |\n\n### Dados\n```mermaid\nerDiagram\n  VETS ||--o{ VET_SPECIALTIES : tem\n  SPECIALTIES ||--o{ VET_SPECIALTIES : classifica\n  VETS {\n    int id PK\n    string first_name\n    string last_name\n  }\n  SPECIALTIES {\n    int id PK\n    string name\n  }\n  VET_SPECIALTIES {\n    int vet_id FK\n    int specialty_id FK\n  }\n```\nSem estado de ciclo de vida (não há \"vet ativo/inativo\" no modelo).\n\n### Quando falha\n- Sem endpoints de escrita: risco de falha é só leitura indisponível.\n- Cache (`@Cacheable(\"vets\")`) implica que uma mudança no banco pode não aparecer imediatamente no `GET /vets` até o cache expirar/for limpo — TTL real de cache está no config-server externo *(a confirmar)*.\n- `chaos-monkey-spring-boot` também presente aqui para testes de resiliência.\n\n### Infra que usa\n[Banco HSQLDB (padrão) / MySQL (opcional)](5-infraestrutura.md#recursos), cache em memória (Caffeine), [discovery-server](5-infraestrutura.md#recursos), [config-server](5-infraestrutura.md#recursos).\n\n---\n\n## genai-service\n> **Em resumo:** expõe um chatbot (Spring AI) que responde perguntas sobre donos, pets e\n> veterinários e pode criar donos/pets por conta própria, chamando `customers-service`\n> diretamente e usando uma base vetorial pré-carregada dos veterinários para busca semântica.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Assistente de IA | *(a confirmar)* | Java 17, Spring Boot, Spring AI (OpenAI/Azure OpenAI), Vector Store, HSQLDB | `spring-petclinic-genai-service/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `POST /chatclient` | API REST (corpo texto livre) | Envia uma pergunta/comando em linguagem natural ao assistente e recebe a resposta |\n\n### Consome\n| Serviço | Contrato | Tipo |\n|---|---|---|\n| customers-service | `GET /owners`, `POST /owners`, `POST /owners/{id}/pets` | API (via `DiscoveryClient` + `RestClient`, resolve o host pelo Eureka) |\n| vets-service | `GET /vets` | API (chamada única na subida, para popular a base vetorial) |\n| OpenAI / Azure OpenAI 🩷 | Chat completions + tool calling | API externa (modelo `gpt-4o-mini` por padrão, ou `gpt-4o`/Azure) |\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `PetclinicChatClient` | `POST /chatclient` | Monta o prompt do sistema, injeta memória de conversa (últimas 10 mensagens) e chama o LLM |\n| `PetclinicTools` | Chamado pelo LLM (tool calling) | Expõe 4 ferramentas: `listOwners`, `addOwnerToPetclinic`, `listVets`, `addPetToOwner` |\n| `AIDataProvider` | Chamado pelas tools | Faz as chamadas HTTP reais a customers-service e a busca por similaridade na base vetorial |\n| `VectorStoreController` | Subida da aplicação (`ApplicationStartedEvent`) | Carrega `vectorstore.json` do classpath se existir; senão busca `GET /vets` e gera embeddings na hora |\n\n### Dados\nNão tem tabelas de negócio próprias além do suporte técnico do Spring AI (memória de chat, HSQLDB usado só como suporte de infraestrutura do framework, não para entidades do domínio). A base vetorial (`VectorStore`) guarda documentos derivados dos veterinários de `vets-service`, usada só para busca semântica em `listVets`.\n\nRegras de negócio observadas no código do assistente (candidatas a regra de negócio real do domínio, marcadas para confirmação):\n- Tipos de pet aceitos pela ferramenta `addPetToOwner`: 1=cat, 2=dog, 3=lizard, 4=snake, 5=bird, 6=hamster *(a confirmar se é regra fixa do negócio ou só documentação da tool)*.\n- Busca de veterinários retorna até 20 resultados com filtro, ou até 50 sem filtro (`topK`).\n\n### Quando falha\n- Falha ao chamar o LLM é capturada em `PetclinicChatClient.exchange` e devolve a mensagem \"Chat is currently unavailable. Please try again later.\" (sem propagar erro 500 ao usuário).\n- `api-gateway` também protege a rota `/api/genai/**` com um circuit breaker próprio (`genaiCircuitBreaker`) que cai no mesmo `/fallback`.\n- Erros ao processar JSON na tool `listVets` são logados e retornam lista vazia em vez de falhar.\n\n### Infra que usa\n[discovery-server](5-infraestrutura.md#recursos), [config-server](5-infraestrutura.md#recursos), [OpenAI/Azure OpenAI](5-infraestrutura.md#recursos), banco HSQLDB local (suporte, não domínio).\n\n---\n\n## api-gateway\n> **Em resumo:** porta de entrada única: serve o front-end AngularJS estático, roteia\n> `/api/**` para os serviços de negócio e é o único ponto que agrega dados de dois serviços\n> (dono + visitas) numa mesma resposta.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Borda | *(a confirmar)* | Java 17, Spring Cloud Gateway (WebFlux), Resilience4j, AngularJS (front-end embutido) | `spring-petclinic-api-gateway/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `GET /` e estáticos | Web | Serve o front-end AngularJS (`static/index.html` e assets) |\n| `GET /api/gateway/owners/{ownerId}` | API REST | Agrega dono (customers-service) + visitas de cada pet (visits-service) numa resposta só |\n| `/api/vet/**` → `vets-service` (strip 2) | Proxy REST | Repassa para `GET /vets` |\n| `/api/visit/**` → `visits-service` (strip 2) | Proxy REST | Repassa para os endpoints de visita |\n| `/api/customer/**` → `customers-service` (strip 2) | Proxy REST | Repassa para os endpoints de dono/pet |\n| `/api/genai/**` → `genai-service` (strip 2, com circuit breaker próprio) | Proxy REST | Repassa para `/chatclient` |\n| `POST /fallback` | API REST | Resposta padrão quando um circuit breaker abre |\n\n### Consome\n| Serviço | Contrato | Tipo |\n|---|---|---|\n| customers-service | `GET /owners/{ownerId}` | API (via `WebClient` balanceado por nome de serviço Eureka) |\n| visits-service | `GET /pets/visits?petId=...` | API (mesma forma) |\n| vets-service, genai-service | Proxy transparente via Spring Cloud Gateway | API |\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `ApiGatewayController` | `GET /api/gateway/owners/{id}` | Busca o dono, depois busca visitas de todos os pets dele em paralelo, protegido por circuit breaker `getOwnerDetails` |\n| `CustomersServiceClient` / `VisitsServiceClient` | Chamado pelo controller acima | Encapsulam as chamadas HTTP reativas (`WebClient`) |\n| `FallbackController` | Circuit breaker aberto (rota do gateway ou `getOwnerDetails`) | Retorna 503 com mensagem genérica |\n| `defaultCustomizer` (`ApiGatewayApplication`) | Config do Resilience4j | Timeout padrão de 10s para os circuit breakers reativos |\n\n### Dados\nNão tem banco próprio; os DTOs (`OwnerDetails`, `PetDetails`, `VisitDetails`, `Visits`, `PetType`) são só formas de transporte que espelham os modelos de customers-service e visits-service.\n\n### Quando falha\n- Se `visits-service` falhar/estourar timeout ao montar a ficha do dono, o circuit breaker `getOwnerDetails` devolve lista de visitas vazia (`emptyVisitsForPets`) — o dono aparece, mas sem histórico de visitas, sem erro visível.\n- Rotas `/api/**` têm filtro `CircuitBreaker` padrão com `fallbackUri: forward:/fallback` e uma retentativa (`Retry`, 1 tentativa) para respostas `SERVICE_UNAVAILABLE` em `POST`.\n- Rota do genai-service tem circuit breaker dedicado (`genaiCircuitBreaker`).\n\n### Infra que usa\n[discovery-server](5-infraestrutura.md#recursos), [config-server](5-infraestrutura.md#recursos).\n\n---\n\n## config-server\n> **Em resumo:** entrega configuração centralizada a todos os outros serviços na subida, lendo de\n> um repositório Git externo (ou de um diretório local no perfil `native`).\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Plataforma | *(a confirmar)* | Java 17, Spring Cloud Config Server | `spring-petclinic-config-server/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| Endpoints padrão do Spring Cloud Config (`/{application}/{profile}`, etc.) | API REST *(a confirmar caminhos exatos, vem do framework)* | Serve o `application.yml`/`.properties` de cada serviço por nome+perfil |\n\n### Consome\n| Serviço/Sistema | Contrato | Tipo |\n|---|---|---|\n| Repositório Git `spring-petclinic-microservices-config` 🩷 | Git clone/pull | Externo |\n\n### Por dentro\nSó a configuração declarada em `application.yml` (URI do Git, `default-label: main`, e um perfil `native` que lê de `${GIT_REPO}` local em vez de clonar).\n\n### Dados\nSem banco.\n\n### Quando falha\nOs demais serviços importam a config como `optional:configserver:...` — ou seja, se o config-server estiver fora do ar, a subida não é bloqueada (mas os serviços podem faltar configurações esperadas) *(comportamento exato de fallback não testado, dedução da palavra `optional`)*.\n\n### Infra que usa\nRepositório Git externo (ver [5-infraestrutura.md](5-infraestrutura.md#recursos)).\n\n---\n\n## discovery-server\n> **Em resumo:** registro de serviços via Eureka; todo serviço de aplicação se registra aqui e\n> descobre os outros pelo nome lógico (`lb://customers-service`, etc.).\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Plataforma | *(a confirmar)* | Java 17, Spring Cloud Netflix Eureka Server | `spring-petclinic-discovery-server/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| Dashboard/API Eureka (`/eureka/**`, painel em `:8761`) | API/Web *(framework, não customizado no código)* | Registro e descoberta de instâncias |\n\n### Consome\nNenhum outro serviço do domínio; é consumido por todos.\n\n### Por dentro\n`DiscoveryServerApplication` com `@EnableEurekaServer` — sem customização adicional.\n\n### Dados\nSem banco (registro fica em memória do próprio Eureka).\n\n### Quando falha\nServiços não conseguem se descobrir; chamadas via `lb://` ou `DiscoveryClient` (gateway, genai-service) param de encontrar instâncias saudáveis. `docker-compose.yml` só sobe os demais serviços após `discovery-server` reportar `service_healthy`.\n\n### Infra que usa\nNenhuma dependência externa além de si mesmo.\n\n---\n\n## admin-server\n> **Em resumo:** painel de operação (Spring Boot Admin) para visualizar saúde e métricas dos\n> outros serviços registrados no Eureka.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Plataforma | *(a confirmar)* | Java 17, Spring Boot Admin Server, Jolokia | `spring-petclinic-admin-server/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| Painel Spring Boot Admin (`:9090`) | Web | Visualização de saúde/métricas/logs dos serviços descobertos via Eureka |\n\n### Consome\nDescobre e monitora os demais serviços de aplicação via Eureka (não é uma chamada de contrato de negócio, é infraestrutura de observabilidade).\n\n### Por dentro\n`SpringBootAdminApplication` com `@EnableAdminServer` + `@EnableDiscoveryClient` — sem customização adicional.\n\n### Dados\nSem banco.\n\n### Quando falha\nPerda do painel de observabilidade; não afeta o funcionamento dos demais serviços (é só leitura de status).\n\n### Infra que usa\n[discovery-server](5-infraestrutura.md#recursos), [config-server](5-infraestrutura.md#recursos).\n\n**Fontes:** controllers e clientes lidos diretamente (`OwnerResource.java`, `PetResource.java`, `VisitResource.java`, `VetResource.java`, `ApiGatewayController.java`, `CustomersServiceClient.java`, `VisitsServiceClient.java`, `FallbackController.java`, `PetclinicChatClient.java`, `PetclinicTools.java`, `AIDataProvider.java`, `VectorStoreController.java`); entidades JPA (`Owner.java`, `Pet.java`, `PetType.java`, `Visit.java`, `Vet.java`, `Specialty.java`); `db/mysql/schema.sql` de cada serviço; `application.yml` de cada módulo (rotas do gateway, perfis, cache, IA); `*Application.java` (anotações `@Enable*`); `pom.xml` de cada módulo (stack e dependências). Sem OpenAPI/AsyncAPI no repositório — contratos documentados a partir do código dos controllers.\n", "secoes": [{"titulo": "customers-service", "slug": "customers-service", "subs": [{"titulo": "Expõe", "slug": "expõe"}, {"titulo": "Consome", "slug": "consome"}, {"titulo": "Por dentro", "slug": "por-dentro"}, {"titulo": "Dados", "slug": "dados"}, {"titulo": "Quando falha", "slug": "quando-falha"}, {"titulo": "Infra que usa", "slug": "infra-que-usa"}]}, {"titulo": "visits-service", "slug": "visits-service", "subs": [{"titulo": "Expõe", "slug": "expõe"}, {"titulo": "Consome", "slug": "consome"}, {"titulo": "Por dentro", "slug": "por-dentro"}, {"titulo": "Dados", "slug": "dados"}, {"titulo": "Quando falha", "slug": "quando-falha"}, {"titulo": "Infra que usa", "slug": "infra-que-usa"}]}, {"titulo": "vets-service", "slug": "vets-service", "subs": [{"titulo": "Expõe", "slug": "expõe"}, {"titulo": "Consome", "slug": "consome"}, {"titulo": "Por dentro", "slug": "por-dentro"}, {"titulo": "Dados", "slug": "dados"}, {"titulo": "Quando falha", "slug": "quando-falha"}, {"titulo": "Infra que usa", "slug": "infra-que-usa"}]}, {"titulo": "genai-service", "slug": "genai-service", "subs": [{"titulo": "Expõe", "slug": "expõe"}, {"titulo": "Consome", "slug": "consome"}, {"titulo": "Por dentro", "slug": "por-dentro"}, {"titulo": "Dados", "slug": "dados"}, {"titulo": "Quando falha", "slug": "quando-falha"}, {"titulo": "Infra que usa", "slug": "infra-que-usa"}]}, {"titulo": "api-gateway", "slug": "api-gateway", "subs": [{"titulo": "Expõe", "slug": "expõe"}, {"titulo": "Consome", "slug": "consome"}, {"titulo": "Por dentro", "slug": "por-dentro"}, {"titulo": "Dados", "slug": "dados"}, {"titulo": "Quando falha", "slug": "quando-falha"}, {"titulo": "Infra que usa", "slug": "infra-que-usa"}]}, {"titulo": "config-server", "slug": "config-server", "subs": [{"titulo": "Expõe", "slug": "expõe"}, {"titulo": "Consome", "slug": "consome"}, {"titulo": "Por dentro", "slug": "por-dentro"}, {"titulo": "Dados", "slug": "dados"}, {"titulo": "Quando falha", "slug": "quando-falha"}, {"titulo": "Infra que usa", "slug": "infra-que-usa"}]}, {"titulo": "discovery-server", "slug": "discovery-server", "subs": [{"titulo": "Expõe", "slug": "expõe"}, {"titulo": "Consome", "slug": "consome"}, {"titulo": "Por dentro", "slug": "por-dentro"}, {"titulo": "Dados", "slug": "dados"}, {"titulo": "Quando falha", "slug": "quando-falha"}, {"titulo": "Infra que usa", "slug": "infra-que-usa"}]}, {"titulo": "admin-server", "slug": "admin-server", "subs": [{"titulo": "Expõe", "slug": "expõe"}, {"titulo": "Consome", "slug": "consome"}, {"titulo": "Por dentro", "slug": "por-dentro"}, {"titulo": "Dados", "slug": "dados"}, {"titulo": "Quando falha", "slug": "quando-falha"}, {"titulo": "Infra que usa", "slug": "infra-que-usa"}]}]}, {"arquivo": "4-jornadas.md", "nome": "Jornadas", "resumo": "5 jornadas, todas síncronas via REST. Sem orquestrador único: cada jornada é uma chamada direta a um serviço, ou uma agregação pontual do `api-gateway` (junta dois serviços, com circuit breaker).", "texto": "# Jornadas: Clínica Veterinária\n\n> **Em resumo:** 5 jornadas, todas síncronas via REST. Sem orquestrador único: cada jornada é uma\n> chamada direta a um serviço, ou uma agregação pontual do `api-gateway` (junta dois serviços,\n> com circuit breaker).\n\n## Nesta página\n| Jornada | Em uma linha | Quem orquestra |\n|---|---|---|\n| [Cadastrar dono e pet](#cadastrar-dono-e-pet) | Recepção registra um novo dono e seus pets | Sem orquestrador — chamada direta ao customers-service |\n| [Registrar uma visita](#registrar-uma-visita) | Clínica registra o atendimento de um pet | Sem orquestrador — chamada direta ao visits-service |\n| [Consultar a ficha do dono](#consultar-a-ficha-do-dono) | Ver o dono com seus pets e o histórico de visitas de cada um | `api-gateway` agrega customers-service + visits-service |\n| [Consultar veterinários](#consultar-veterinários) | Ver a equipe clínica e suas especialidades | Sem orquestrador — chamada direta ao vets-service (cacheada) |\n| [Conversar com o assistente de IA](#conversar-com-o-assistente-de-ia) | Perguntar ou pedir ações em linguagem natural | `genai-service` decide (tool calling) quais chamadas fazer |\n\n---\n\n## Cadastrar dono e pet\n> **Em resumo:** a recepção (ou o próprio front-end) cria o dono e, na sequência, adiciona um ou\n> mais pets a ele. Cada pet pertence a exatamente um dono.\n\n**Em linguagem de negócio:**\n| # | 🟨 Quem | 🟦 Faz | 🟧 Acontece | 🟪 Regra ou reação |\n|---|---|---|---|---|\n| 1 | Recepção/dono | Preenche dados do dono (nome, endereço, cidade, telefone) | Dono cadastrado | Nome, endereço, cidade e telefone são obrigatórios; telefone só números, até 12 dígitos |\n| 2 | Recepção/dono | Escolhe o tipo do pet e preenche nome e data de nascimento | Pet cadastrado, associado ao dono | Pet precisa de um dono já existente; nome do pet não pode ser vazio |\n\n**Quem orquestra:** ninguém — são duas chamadas independentes e sequenciais ao `customers-service` (`POST /owners`, depois `POST /owners/{ownerId}/pets`), decididas pelo cliente (front-end ou o assistente de IA).\n\n**Passo a passo técnico:**\n```mermaid\nsequenceDiagram\n  participant Cliente\n  participant CS as customers-service\n  Cliente->>CS: POST /owners {dados do dono}\n  CS-->>Cliente: 201 Owner criado\n  Cliente->>CS: POST /owners/{ownerId}/pets {nome, tipo, nascimento}\n  alt dono existe\n    CS-->>Cliente: 201 Pet criado\n  else dono não existe\n    CS-->>Cliente: 404 Owner not found\n  end\n```\n\n**Regras e dúvidas:** não há transação única cobrindo dono+pet — se a segunda chamada falhar, o dono já existe sem pet (aceitável no modelo atual, mas sem compensação). 🟥 Não está claro se existe uma tela/fluxo que impeça cadastrar pet sem ownerId válido no front-end antes de chamar a API *(a confirmar)*.\n\n---\n\n## Registrar uma visita\n> **Em resumo:** a clínica registra que um pet foi atendido, com data e descrição livre; não há\n> conceito de agendamento prévio com confirmação — é um registro histórico do atendimento.\n\n**Em linguagem de negócio:**\n| # | 🟨 Quem | 🟦 Faz | 🟧 Acontece | 🟪 Regra ou reação |\n|---|---|---|---|---|\n| 1 | Clínica/veterinário | Registra a visita de um pet (data + descrição) | Visita registrada | Descrição até 8192 caracteres; `petId` é só um número, sem checagem de existência |\n\n**Quem orquestra:** ninguém — chamada direta ao `visits-service`.\n\n**Passo a passo técnico:**\n```mermaid\nsequenceDiagram\n  participant Cliente\n  participant VS as visits-service\n  Cliente->>VS: POST /owners/*/pets/{petId}/visits {date, description}\n  VS-->>Cliente: 201 Visit criada\n  Cliente->>VS: GET /owners/*/pets/{petId}/visits\n  VS-->>Cliente: 200 lista de visitas do pet\n```\n\n**Regras e dúvidas:** 🟥 `visits-service` não valida que o `petId` existe em `customers-service` (bancos separados, sem chamada cruzada) — é possível registrar uma visita para um pet inexistente. Não há status da visita (agendada/realizada/cancelada), só a existência do registro.\n\n---\n\n## Consultar a ficha do dono\n> **Em resumo:** a jornada mais \"orquestrada\" do domínio — o `api-gateway` busca o dono e, em\n> paralelo, as visitas de todos os pets dele, juntando tudo numa única resposta para o front-end.\n> Se as visitas falharem, a ficha aparece mesmo assim, só que sem histórico.\n\n**Em linguagem de negócio:**\n| # | 🟨 Quem | 🟦 Faz | 🟧 Acontece | 🟪 Regra ou reação |\n|---|---|---|---|---|\n| 1 | Dono/recepção | Abre a ficha de um dono | Ficha exibida com dono, pets e visitas de cada pet | Se o histórico de visitas não puder ser buscado a tempo, a ficha mostra os pets sem visitas em vez de falhar |\n\n**Quem orquestra:** `api-gateway` (`ApiGatewayController.getOwnerDetails`) — busca síncrona em `customers-service`, depois busca em paralelo (reativo) em `visits-service`, protegida por um circuit breaker (`getOwnerDetails`).\n\n**Passo a passo técnico:**\n```mermaid\nsequenceDiagram\n  participant Front as Front-end\n  participant GW as api-gateway\n  participant CS as customers-service\n  participant VS as visits-service\n  Front->>GW: GET /api/gateway/owners/{ownerId}\n  GW->>CS: GET /owners/{ownerId}\n  CS-->>GW: 200 Owner + pets\n  GW->>VS: GET /pets/visits?petId=...(todos os pets)\n  alt visits-service responde a tempo\n    VS-->>GW: 200 visitas\n    GW-->>Front: 200 Owner + pets + visitas\n  else timeout ou erro (circuit breaker aberto)\n    GW-->>Front: 200 Owner + pets, visitas vazias\n  end\n```\n\n**Regras e dúvidas:** o timeout do circuit breaker reativo padrão é 10s (`ApiGatewayApplication.defaultCustomizer`). 🟥 Não há indicação visual ao usuário de que as visitas podem estar faltando por falha técnica — a resposta é indistinguível de \"pet sem visitas\".\n\n---\n\n## Consultar veterinários\n> **Em resumo:** lista simples da equipe clínica e suas especialidades; a resposta é cacheada em\n> memória no `vets-service`, então uma mudança recente pode não aparecer de imediato.\n\n**Em linguagem de negócio:**\n| # | 🟨 Quem | 🟦 Faz | 🟧 Acontece | 🟪 Regra ou reação |\n|---|---|---|---|---|\n| 1 | Dono/recepção | Consulta a lista de veterinários | Lista exibida com nome e especialidades | Resposta pode vir do cache (`@Cacheable(\"vets\")`) |\n\n**Quem orquestra:** ninguém — chamada direta (via `api-gateway` como proxy transparente `/api/vet/**`) ao `vets-service`.\n\n**Passo a passo técnico:**\n```mermaid\nsequenceDiagram\n  participant Front as Front-end\n  participant GW as api-gateway\n  participant VT as vets-service\n  Front->>GW: GET /api/vet/vets\n  GW->>VT: GET /vets (proxy, StripPrefix=2)\n  VT-->>GW: 200 lista (do cache, se disponível)\n  GW-->>Front: 200 lista\n```\n\n**Regras e dúvidas:** 🟥 TTL/política de invalidação do cache não está no código deste repositório (provável configuração externa no config-server) *(a confirmar)*.\n\n---\n\n## Conversar com o assistente de IA\n> **Em resumo:** o usuário manda uma mensagem em linguagem natural; o `genai-service` decide, via\n> tool calling do LLM, se precisa listar donos, listar veterinários (busca semântica), ou criar\n> dono/pet — chamando `customers-service` diretamente, sem passar pelo `api-gateway`.\n\n**Em linguagem de negócio:**\n| # | 🟨 Quem | 🟦 Faz | 🟧 Acontece | 🟪 Regra ou reação |\n|---|---|---|---|---|\n| 1 | Usuário | Envia uma pergunta ou pedido em texto livre | Pergunta recebida | Mantém memória das últimas 10 mensagens da conversa |\n| 2 | Assistente de IA | Decide se precisa de dados (lista de donos, veterinários) ou de uma ação (criar dono/pet) | Ferramenta certa é chamada | Só usa as 4 ferramentas expostas em `PetclinicTools` |\n| 3 | Assistente de IA | Responde com base no resultado da ferramenta (ou direto, se não precisar de dados) | Resposta enviada ao usuário | Se não souber a resposta, deve dizer que não sabe e perguntar de volta (instrução do prompt de sistema) |\n\n**Quem orquestra:** o próprio LLM decide a sequência de chamadas via tool calling (não há um fluxo fixo programado); `genai-service` é o único componente que fala com `customers-service` nessa jornada, resolvendo o endereço por `DiscoveryClient` (Eureka) em vez de passar pelo `api-gateway`.\n\n**Passo a passo técnico:**\n```mermaid\nsequenceDiagram\n  participant Front as Front-end/Cliente\n  participant GEN as genai-service\n  participant LLM as OpenAI/Azure OpenAI\n  participant CS as customers-service\n  Front->>GEN: POST /chatclient {pergunta}\n  GEN->>LLM: prompt + histórico + ferramentas disponíveis\n  alt LLM decide chamar uma ferramenta\n    LLM-->>GEN: pedido de tool call (ex.: addPetToOwner)\n    GEN->>CS: POST /owners/{ownerId}/pets\n    CS-->>GEN: 201 Pet criado (ou 404)\n    GEN->>LLM: resultado da ferramenta\n    LLM-->>GEN: resposta final em texto\n  else LLM responde direto\n    LLM-->>GEN: resposta em texto\n  end\n  GEN-->>Front: 200 resposta\n  Note over GEN: Se o LLM ou a chamada falhar,<br/>responde \"Chat is currently unavailable.\"\n```\n\n**Regras e dúvidas:** a lista de tipos de pet aceitos pela ferramenta (1=cat...6=hamster) está descrita só no texto da ferramenta para o LLM seguir — 🟥 não há validação server-side que barre um `typeId` fora dessa lista antes de chamar `customers-service`. A rota do gateway `/api/genai/**` tem seu próprio circuit breaker (`genaiCircuitBreaker`), mas o chat também pode ser acessado direto na porta do `genai-service` sem passar pelo gateway *(a confirmar qual caminho o front-end realmente usa)*.\n\n**Fontes:** `ApiGatewayController.java`, `CustomersServiceClient.java`, `VisitsServiceClient.java`, `FallbackController.java`, `ApiGatewayApplication.java` (timeout do circuit breaker), `application.yml` do api-gateway (rotas, retry, circuit breaker do genai); `OwnerResource.java`, `PetResource.java`, `VisitResource.java`, `VetResource.java`; `PetclinicChatClient.java`, `PetclinicTools.java`, `AIDataProvider.java` (fluxo do chatbot e tool calling); `VetsServiceApplication`/`CacheConfig` (cache de vets, mencionado no serviço). Sequências reconstruídas a partir do código (não há diagramas de sequência nem OpenAPI no repositório).\n", "secoes": [{"titulo": "Cadastrar dono e pet", "slug": "cadastrar-dono-e-pet", "subs": []}, {"titulo": "Registrar uma visita", "slug": "registrar-uma-visita", "subs": []}, {"titulo": "Consultar a ficha do dono", "slug": "consultar-a-ficha-do-dono", "subs": []}, {"titulo": "Consultar veterinários", "slug": "consultar-veterinários", "subs": []}, {"titulo": "Conversar com o assistente de IA", "slug": "conversar-com-o-assistente-de-ia", "subs": []}]}, {"arquivo": "5-infraestrutura.md", "nome": "Infraestrutura", "resumo": "aplicações Spring Boot independentes, registradas num Eureka (`discovery-server`) e configuradas por um Config Server que busca valores num repositório Git externo. Sobe local via `docker-compose.yml` ou `mvnw`/`run_all.sh`; sem Terraform, Kubernetes ou CloudFormation.", "texto": "# Infraestrutura: Clínica Veterinária\n\n> **Em resumo:** aplicações Spring Boot independentes, registradas num Eureka (`discovery-server`)\n> e configuradas por um Config Server que busca valores num repositório Git externo. Sobe local\n> via `docker-compose.yml` ou `mvnw`/`run_all.sh`; sem Terraform, Kubernetes ou CloudFormation.\n\n## Nesta página\n| Seção | Em uma linha |\n|---|---|\n| [Ambientes](#ambientes) | Local (IDE/Maven), Docker Compose; produção não está neste repo |\n| [Recursos](#recursos) | Bancos, registro de serviços, config, observabilidade, IA externa |\n| [Implantação](#implantação) | Como o Docker Compose liga tudo |\n\n## Ambientes\n\n| Ambiente | Como sobe | Diferenças |\n|---|---|---|\n| Local (IDE/Maven) | `../mvnw spring-boot:run` em cada módulo, ou `./scripts/run_all.sh` | Banco HSQLDB em memória (perfil padrão); Config e Discovery Server precisam subir primeiro |\n| Local com chaos | `./scripts/run_all.sh --chaos-monkey` | Ativa o perfil `chaos-monkey` (Chaos Monkey for Spring Boot) em customers/vets/visits-service |\n| Docker Compose | `docker compose up` (imagens construídas com `./mvnw clean install -P buildDocker` ou baixadas de `springcommunity/*` no Docker Hub) | Perfil Spring `docker`; serviços se aguardam por `depends_on`/`healthcheck` |\n| MySQL opcional | Perfil Spring `mysql` em customers/vets/visits-service + `docker run mysql:8.4.5 ...` | Troca HSQLDB por MySQL persistente; schema/dados vêm de `db/mysql/{schema,data}.sql` |\n| Produção real | *(a confirmar)* | Não há manifesto de nuvem (Terraform/K8s/CloudFormation) neste repositório; só existem imagens Docker publicadas em `springcommunity/*` no Docker Hub |\n\n🟥 **Dúvida:** como e onde este domínio roda em produção (nuvem, orquestrador, quantas réplicas) não está no código — só o empacotamento Docker.\n\n## Recursos\n\n| Recurso | Tipo | Tecnologia | Quem usa | Definido em |\n|---|---|---|---|---|\n| `discovery-server` | Registro de serviços | Eureka Server (Spring Cloud Netflix) | Todos os serviços de aplicação se registram/consultam | `spring-petclinic-discovery-server/` |\n| `config-server` | Configuração centralizada | Spring Cloud Config Server | Todos os serviços importam config na subida (`optional:configserver:...`) | `spring-petclinic-config-server/`, aponta para o repositório Git externo `spring-petclinic-microservices-config` |\n| Banco HSQLDB (padrão) | Banco em memória, um por serviço | HSQLDB | customers-service, vets-service, visits-service, genai-service | `*/src/main/resources/db/hsqldb/{schema,data}.sql` |\n| Banco MySQL (opcional) | Banco relacional persistente | MySQL 8.4.x, driver `mysql-connector-j` | customers-service, vets-service, visits-service (perfil `mysql`) | `*/src/main/resources/db/mysql/{schema,data}.sql` |\n| `admin-server` | Observabilidade operacional | Spring Boot Admin | Painel de saúde/métricas dos outros serviços via Eureka | `spring-petclinic-admin-server/` |\n| `tracing-server` | Rastreamento distribuído | Zipkin (`openzipkin/zipkin`) | Todos os serviços (dependência `spring-boot-starter-zipkin`) publicam traces | `docker-compose.yml` |\n| `prometheus-server` | Métricas | Prometheus | Coleta métricas Micrometer dos serviços | `docker/prometheus/prometheus.yml` |\n| `grafana-server` | Dashboards | Grafana | Visualiza métricas do Prometheus (dashboard `Spring Petclinic Metrics`) | `docker/grafana/` |\n| OpenAI / Azure OpenAI | LLM externo 🩷 | API de chat da OpenAI ou Azure OpenAI | genai-service (chat + tool calling) | `spring-petclinic-genai-service/src/main/resources/application.yml` (chaves via env `OPENAI_API_KEY`/`AZURE_OPENAI_*`, **não copiadas aqui**) |\n| Repositório Git de configuração | Fonte de config externa 🩷 | GitHub `spring-petclinic/spring-petclinic-microservices-config` | config-server | `spring-petclinic-config-server/src/main/resources/application.yml` |\n\n🟥 **Dúvida:** os valores reais de configuração por ambiente (portas de produção, timeouts de resiliência específicos, credenciais de banco) vivem no repositório externo `spring-petclinic-microservices-config`, fora deste repo — não foi possível confirmar o conteúdo dele.\n\n**Segredo encontrado (só localização, valor não copiado):** `spring-petclinic-genai-service/src/main/resources/application.yml` referencia as variáveis de ambiente `OPENAI_API_KEY`, `AZURE_OPENAI_KEY`, `AZURE_OPENAI_ENDPOINT` (linhas 9, 17-18, 25); `docker-compose.yml` as repassa como variáveis de ambiente do container `genai-service`.\n\n## Implantação\n\n```mermaid\nflowchart TB\n  subgraph compose[\"docker-compose.yml (local)\"]\n    CFG[config-server :8888] --> DISC[discovery-server :8761]\n    DISC --> CUST[customers-service :8081]\n    DISC --> VIS[visits-service :8082]\n    DISC --> VET[vets-service :8083]\n    DISC --> GEN[genai-service :8084]\n    DISC --> GW[api-gateway :8080]\n    DISC --> ADM[admin-server :9090]\n    GEN --> LLM[[\"OpenAI / Azure OpenAI\"]]\n    ZIP[tracing-server / Zipkin :9411]\n    PROM[prometheus-server :9091] --> GRAF[grafana-server :3030]\n  end\n```\n\nOrdem de subida (via `depends_on` + `healthcheck` no `docker-compose.yml`): `config-server` saudável → `discovery-server` saudável → todos os demais serviços de aplicação. `tracing-server`, `prometheus-server` e `grafana-server` não têm dependência declarada.\n\n**Fontes:** `docker-compose.yml` (serviços, portas, healthchecks, memória); `docker/Dockerfile`, `docker/grafana/`, `docker/prometheus/prometheus.yml`; `*/src/main/resources/application.yml` de cada serviço (import do config server, perfil `docker`); `spring-petclinic-config-server/src/main/resources/application.yml` (URI do repo Git); `README.md` (instruções de start local, MySQL, Grafana/Prometheus, Chaos Monkey); `*/pom.xml` (dependência `chaos-monkey-spring-boot` em customers/vets/visits-service). Ausência de Terraform/K8s/CloudFormation verificada por busca no repositório.\n", "secoes": [{"titulo": "Ambientes", "slug": "ambientes", "subs": []}, {"titulo": "Recursos", "slug": "recursos", "subs": []}, {"titulo": "Implantação", "slug": "implantação", "subs": []}]}, {"arquivo": "6-referencia.md", "nome": "Referência", "resumo": "glossário, regras, decisões reconstruídas, padrões de código, como rodar localmente e as dúvidas em aberto por papel — para quem vai mexer no código ou decidir sobre ele sem reler tudo.", "texto": "# Referência: Clínica Veterinária\n\n> **Em resumo:** glossário, regras, decisões reconstruídas, padrões de código, como rodar\n> localmente e as dúvidas em aberto por papel — para quem vai mexer no código ou decidir sobre\n> ele sem reler tudo.\n\n## Nesta página\n| Seção | Em uma linha |\n|---|---|\n| [Glossário](#glossário) | Os termos, em uma linha cada |\n| [Regras de negócio](#regras-de-negócio) | Regra, valor, onde está |\n| [Decisões](#decisões) | Por que o desenho é assim (reconstruídas, sem ADR no repo) |\n| [Padrões](#padrões) | Como o código é construído |\n| [Como começar](#como-começar) | Rodar local, testar, as mudanças mais comuns |\n| [Dúvidas e perguntas](#dúvidas-e-perguntas) | O que ficou em aberto, por papel |\n\n## Glossário\n| Termo | Definição |\n|---|---|\n| Owner (Dono) | Pessoa responsável por pets; entidade em `customers-service` |\n| Pet | Animal de um dono; entidade em `customers-service` |\n| PetType | Categoria do pet (cat, dog, ...); entidade em `customers-service` |\n| Visit | Registro de atendimento a um pet; entidade em `visits-service` |\n| Vet | Veterinário; entidade em `vets-service` |\n| Specialty | Especialidade de um veterinário; entidade em `vets-service` |\n| Tool calling | Mecanismo do LLM (Spring AI) para chamar funções Java durante a conversa |\n| Circuit breaker | Padrão de resiliência (Resilience4j) que corta uma chamada instável e usa um caminho alternativo |\n| Eureka | Registro de serviços (Spring Cloud Netflix) usado para descoberta por nome |\n| Config Server | Serviço que entrega configuração centralizada, lida de um repositório Git |\n\n## Regras de negócio\n| Regra | Valor atual | Onde está implementada |\n|---|---|---|\n| Campos obrigatórios do dono | firstName, lastName, address, city, telephone | `Owner.java`, `OwnerRequest.java` (`@NotBlank`) |\n| Formato do telefone | Só dígitos, até 12 caracteres | `OwnerRequest.java`, `PetclinicTools.java` (`@Digits(fraction=0, integer=12)`) |\n| Nome do pet obrigatório | Mínimo 1 caractere | `PetRequest.java` (`@Size(min=1)`) |\n| Tamanho da descrição da visita | Até 8192 caracteres | `Visit.java` (`@Size(max=8192)`) |\n| Tipos de pet aceitos pelo assistente de IA | 1=cat, 2=dog, 3=lizard, 4=snake, 5=bird, 6=hamster | `PetclinicTools.java` (descrição da tool `addPetToOwner`) |\n| Memória de conversa do chatbot | Últimas 10 mensagens | `PetclinicChatClient.java` (`MessageChatMemoryAdvisor.order(10)`) |\n| Timeout do circuit breaker do gateway | 10 segundos | `ApiGatewayApplication.java` (`TimeLimiterConfig`) |\n| Retry do gateway em rotas `/api/**` | 1 tentativa, só para `POST` com resposta `SERVICE_UNAVAILABLE` | `spring-petclinic-api-gateway/src/main/resources/application.yml` |\n| Cache da lista de veterinários | Cache nomeado `vets` (Caffeine) | `vets-service` `application.yml` (`spring.cache.cache-names: vets`), `VetResource.java` (`@Cacheable`) |\n\n## Decisões\n*(reconstruídas a partir do código; não há pasta `docs/adr` nem `decisions/` no repositório)*\n\n| Contexto | Escolha | Consequência |\n|---|---|---|\n| Cada subdomínio de negócio precisava evoluir e escalar de forma independente | Um serviço Spring Boot por subdomínio (customers, visits, vets, genai), descobertos via Eureka | Chamadas entre serviços viram rede (latência, falha parcial); precisa de circuit breaker (ver `api-gateway`) |\n| Front-end precisa de uma única origem de dados (dono + visitas) numa tela | `api-gateway` agrega no lado do servidor em vez de o front-end chamar dois serviços | Um ponto a mais de falha, mitigado com circuit breaker + fallback de dados vazios |\n| Assistente de IA precisa de dados atualizados de donos/pets | `genai-service` chama `customers-service` direto via Eureka, sem passar pelo `api-gateway` | Caminho de escrita adicional fora do proxy central; exige que `genai-service` conheça o contrato de `customers-service` diretamente |\n| Configuração não deveria ficar hardcoded em cada serviço | Config Server buscando de um repositório Git externo | Config real de produção não está neste repositório — quem consultar precisa acessar `spring-petclinic-microservices-config` |\n| Consultar veterinários é uma leitura frequente e de baixa mudança | Cache em memória (`@Cacheable(\"vets\")`) | Atraso possível entre mudança no banco e reflexo na API |\n\n## Padrões\n- **Camadas por serviço:** `model` (entidades JPA + repositórios), `web` (controllers REST + DTOs de request), seguindo o pacote `org.springframework.samples.petclinic.<serviço>`.\n- **Banco:** HSQLDB em memória por padrão (perfil default), MySQL via perfil `mysql`; scripts em `src/main/resources/db/{hsqldb,mysql}/{schema,data}.sql`.\n- **Métricas:** anotação `@Timed` do Micrometer em cada controller principal (`petclinic.owner`, `petclinic.pet`, `petclinic.visit`), expostas via Actuator/Prometheus.\n- **Resiliência:** `spring-cloud-starter-circuitbreaker-reactor-resilience4j` no gateway e no genai-service; `chaos-monkey-spring-boot` em customers/vets/visits-service para testes de falha controlada.\n- **Rastreamento:** `spring-boot-starter-zipkin` em todos os serviços de aplicação, relatando ao `tracing-server` (Zipkin).\n- **Build:** Maven multi-módulo (`pom.xml` raiz + um módulo por serviço), Java 17, imagens Docker via perfil Maven `buildDocker`.\n\n## Como começar\n**Rodar localmente:**\n1. Subir `config-server` e `discovery-server` primeiro (`../mvnw spring-boot:run` em cada um, ou usar `./scripts/run_all.sh`).\n2. Subir os demais serviços (`customers`, `visits`, `vets`, `genai`, `api-gateway`, `admin`).\n3. Acessar o front-end em `http://localhost:8080/`; Eureka em `:8761`; Admin em `:9090`; Zipkin em `:9411`.\n4. Alternativa: `docker compose up` depois de construir as imagens com `./mvnw clean install -P buildDocker` (ou usar as imagens publicadas em `springcommunity/*`).\n\n**Testes:** cada módulo tem seus próprios testes (`spring-boot-starter-test`, `spring-boot-starter-webmvc-test`/`webflux-test`); rodar via `../mvnw test` no módulo desejado. Há um plano de carga JMeter em `spring-petclinic-api-gateway/src/test/jmeter/petclinic_test_plan.jmx`.\n\n**Onde fica cada coisa:**\n- Regras de dono/pet → `spring-petclinic-customers-service/.../web/` e `.../model/`.\n- Regras de visita → `spring-petclinic-visits-service/.../web/` e `.../model/`.\n- Regras de veterinário → `spring-petclinic-vets-service/.../web/` e `.../model/`.\n- Comportamento do chatbot e das ações da IA → `spring-petclinic-genai-service/.../PetclinicChatClient.java`, `PetclinicTools.java`, `AIDataProvider.java`.\n- Roteamento e agregação de borda → `spring-petclinic-api-gateway/.../application.yml` e `.../ApiGatewayController.java`.\n\n**As 3 mudanças mais comuns (dedução a partir da estrutura do código):**\n1. Adicionar um campo ao dono/pet → entidade JPA + DTO de request/response + migração do `schema.sql` (hsqldb e mysql) no `customers-service`.\n2. Adicionar uma nova ferramenta ao assistente de IA → método `@Tool` em `PetclinicTools.java` + método correspondente em `AIDataProvider.java`.\n3. Expor um novo agregador na borda → método no `ApiGatewayController` + cliente `WebClient` correspondente + rota em `application.yml` se for proxy simples.\n\n**Como publicar:** `./mvnw clean install -P buildDocker` gera as imagens; `scripts/tagImages.sh` e `scripts/pushImages.sh` publicam num registro Docker configurado via `REPOSITORY_PREFIX` *(a confirmar pipeline de CI/CD real de produção — só há o workflow `maven-build.yml` do GitHub Actions citado no badge do README para build/teste)*.\n\n## Dúvidas e perguntas\n\n**Segredos encontrados (só localização, valor não copiado):**\n- `spring-petclinic-genai-service/src/main/resources/application.yml` (linhas 9, 17, 18, 25): variáveis `OPENAI_API_KEY`, `AZURE_OPENAI_KEY`, `AZURE_OPENAI_ENDPOINT`.\n- `docker-compose.yml` (serviço `genai-service`): repassa as mesmas variáveis ao container.\n\n**Conflitos entre fontes:** nenhum encontrado — a lacuna principal é que a config real (portas, timeouts, credenciais) fica no repositório externo `spring-petclinic-microservices-config`.\n\n**Perguntas por papel:**\n- **PM/negócio:** este domínio deve ganhar agendamento com confirmação de horário e cobrança, ou isso fica fora de escopo permanentemente? Quais indicadores de negócio importam (retenção de donos, volume de visitas, uso do assistente de IA)? Existe distinção de papéis de usuário (recepção vs. veterinário vs. dono) a modelar?\n- **Arquiteto:** o `genai-service` deveria continuar chamando `customers-service` direto, ou passar a sempre passar pelo `api-gateway` por consistência de observabilidade/segurança? Em produção, os bancos MySQL de `customers-service`, `vets-service` e `visits-service` são instâncias separadas ou compartilham a mesma instância (mesmo nome de banco `petclinic`)?\n- **Tech lead:** qual é o TTL real do cache de veterinários? Qual o comportamento real do `config: import: optional:configserver:...` quando o Config Server está fora do ar (a app sobe com quais defaults)? Existe CI/CD de deploy automatizado além do workflow de build/teste do GitHub Actions?\n\n**Fontes:** consolidação das fontes citadas em `1-negocio.md`, `2-arquitetura.md`, `3-servicos.md`, `4-jornadas.md` e `5-infraestrutura.md`; busca adicional por `CODEOWNERS`, `docs/adr`, `decisions/` (nenhum encontrado); `pom.xml` raiz e de cada módulo (dependências e plugins de build/publicação); `scripts/pushImages.sh`, `scripts/tagImages.sh`, `README.md` (processo de publicação de imagens).\n", "secoes": [{"titulo": "Glossário", "slug": "glossário", "subs": []}, {"titulo": "Regras de negócio", "slug": "regras-de-negócio", "subs": []}, {"titulo": "Decisões", "slug": "decisões", "subs": []}, {"titulo": "Padrões", "slug": "padrões", "subs": []}, {"titulo": "Como começar", "slug": "como-começar", "subs": []}, {"titulo": "Dúvidas e perguntas", "slug": "dúvidas-e-perguntas", "subs": []}]}], "mapa": "flowchart LR\n  subgraph n_g_Cadastro[\"Cadastro\"]\n    n_customers_service[\"customers-service\"]\n  end\n  subgraph n_g_Atendimento[\"Atendimento\"]\n    n_visits_service[\"visits-service\"]\n  end\n  subgraph n_g_Equipe_cl_nica[\"Equipe clínica\"]\n    n_vets_service[\"vets-service\"]\n  end\n  subgraph n_g_Assistente_de_IA[\"Assistente de IA\"]\n    n_genai_service[\"genai-service\"]\n  end\n  subgraph n_g_Borda[\"Borda\"]\n    n_api_gateway[\"api-gateway\"]\n  end\n  subgraph n_g_Plataforma[\"Plataforma\"]\n    n_config_server[\"config-server\"]\n    n_discovery_server[\"discovery-server\"]\n    n_admin_server[\"admin-server\"]\n  end\n  n_genai_service -->|\"GET /owners, POST /owners,\"| n_customers_service\n  n_genai_service -->|\"GET /vets\"| n_vets_service\n  n_OpenAI___Azure_OpenAI__([\"OpenAI / Azure OpenAI 🩷\"])\n  n_genai_service -->|\"Chat completions + tool ca\"| n_OpenAI___Azure_OpenAI__\n  n_api_gateway -->|\"GET /owners/{ownerId}\"| n_customers_service\n  n_api_gateway -->|\"GET /pets/visits?petId=...\"| n_visits_service\n  n_api_gateway -->|\"Proxy transparente via Spr\"| n_vets_service\n  n_Reposit_rio_Git_spring_petclinic_microservices_config__([\"Repositório Git spring-petclinic\"])\n  n_config_server -->|\"Git clone/pull\"| n_Reposit_rio_Git_spring_petclinic_microservices_config__", "cartao": "# Clínica Veterinária\n\n> cadastro de uma clínica veterinária — donos, pets, veterinários e o histórico de visitas de cada pet — com um assistente de IA que responde perguntas e cadastra dono/pet por conversa. Não há agendamento com confirmação, cobrança nem prontuário clínico.\n\nDocumentação em 6 páginas. Leia este cartão primeiro; abra só a seção de que precisar. Resumos de tudo em `llm/resumos.md`; ligações em `llm/grafo.json`.\n\n## Fronteira\n- **Faz:** Cadastra donos e seus pets; Registra histórico de visitas (data + descrição); Mantém cadastro de veterinários e especialidades; Responde perguntas e age via chatbot de IA; Agrega a \"ficha\" do dono com pets e visitas\n- **Não faz:** Agendamento com confirmação/conflito de horário; Cobrança, pagamento, convênio pet; Prontuário clínico (diagnóstico, receita, exames); Notificação ao dono (e-mail/SMS); Estoque de insumos/medicamentos\n- **Não sabemos:** Se há front-end de agendamento em outro repositório; Se há autenticação/login de usuário; Se há papel de \"recepção\" distinto de \"veterinário\"; Regra real por trás dos tipos de pet aceitos pela IA; Dono/responsável de cada serviço (sem CODEOWNERS)\n\n## Serviços\n- [customers-service](3-servicos.md#customers-service): Cadastro — Dono do pet e seus pets: CRUD completo\n- [visits-service](3-servicos.md#visits-service): Atendimento — Registra e lista visitas de um pet\n- [vets-service](3-servicos.md#vets-service): Equipe clínica — Lista veterinários e suas especialidades (com cache)\n- [genai-service](3-servicos.md#genai-service): Assistente de IA — Chatbot que consulta e cria dados via tool calling\n- [api-gateway](3-servicos.md#api-gateway): Borda — Roteia o front-end e agrega dono + visitas\n- [config-server](3-servicos.md#config-server): Plataforma — Configuração centralizada vinda de um repo Git\n- [discovery-server](3-servicos.md#discovery-server): Plataforma — Registro de serviços (Eureka)\n- [admin-server](3-servicos.md#admin-server): Plataforma — Painel de saúde/observabilidade (Spring Boot Admin)\n\n## Jornadas\n- [Cadastrar dono e pet](4-jornadas.md#cadastrar-dono-e-pet): Recepç c-microservices-config\n- Sai — Traces e métricas técnicas — 🩷 Zipkin, Prometheus, Grafana\n\n## Ainda não se sabe\n- Segredos encontrados (só localização, valor não copiado):\n- spring-petclinic-genai-service/src/main/resources/application.yml (linhas 9, 17, 18, 25): variáveis OPENAI_API_KEY, AZURE_OPENAI_KEY, AZURE…\n- docker-compose.yml (serviço genai-service): repassa as mesmas variáveis ao container.\n- Conflitos entre fontes: nenhum encontrado — a lacuna principal é que a config real (portas, timeouts, credenciais) fica no repositório exte…\n\n## Onde procurar\n- [Negócio](1-negocio.md): cadastro de uma clínica veterinária — donos, pets, veterinários e o histórico de visitas de cada pet — com um assistente de IA que responde…\n- [Arquitetura](2-arquitetura.md): microsserviços Spring Cloud — um serviço por subdomínio (donos/pets, visitas, veterinários, IA), um gateway de borda que agrega e roteia, t…\n- [Serviços](3-servicos.md): 8 serviços Spring Boot. Quatro carregam o negócio (donos/pets, visitas, veterinários, chatbot de IA), um é a borda (api-gateway), três são …\n- [Jornadas](4-jornadas.md): 5 jornadas, todas síncronas via REST. Sem orquestrador único: cada jornada é uma chamada direta a um serviço, ou uma agregação pontual do `…\n\n## Optional\n- [Infraestrutura](5-infraestrutura.md): aplicações Spring Boot independentes, registradas num Eureka (`discovery-server`) e configuradas por um Config Server que busca valores num…\n- [Referência](6-referencia.md): glossário, regras, decisões reconstruídas, padrões de código, como rodar localmente e as dúvidas em aberto por papel — para quem vai mexer …\n"};

function arvore(){
  let h = '';
  for (const p of D.paginas) {
    h += `<details class="pag" data-p="${p.arquivo}"><summary><a class="no" href="#" data-p="${p.arquivo}"><span class="seta">▶</span>${esc(p.nome)}<span class="n">${p.secoes.length}</span></a></summary><div class="nivel2">`;
    for (const s of p.secoes) {
      if (s.subs.length) {
        h += `<details data-busca="${esc((s.titulo + ' ' + s.subs.map(x=>x.titulo).join(' ')).toLowerCase())}"><summary><a class="no" href="#" data-p="${p.arquivo}" data-a="${s.slug}"><span class="seta">▶</span>${esc(s.titulo)}</a></summary><div class="nivel3">`;
        for (const t of s.subs) h += `<a class="no" href="#" data-p="${p.arquivo}" data-a="${t.slug}" data-pai="${s.slug}"><span class="vazio"></span>${esc(t.titulo)}</a>`;
        h += `</div></details>`;
      } else h += `<a class="no" href="#" data-p="${p.arquivo}" data-a="${s.slug}" data-busca="${esc(s.titulo.toLowerCase())}"><span class="vazio"></span>${esc(s.titulo)}</a>`;
    }
    h += `</div></details>`;
  }
  if (D.cartao) h += `<details class="pag" data-p="_ia"><summary><a class="no" href="#" data-p="_ia"><span class="seta">▶</span>Para IA<span class="n">1</span></a></summary><div class="nivel2"><a class="no" href="#" data-p="_ia"><span class="vazio"></span>Cartão do domínio</a></div></details>`;
  const nav = document.getElementById('arvore'); nav.innerHTML = h;
  nav.querySelectorAll('a.no').forEach(a => a.onclick = e => { e.preventDefault(); mostrar(a.dataset.p, a.dataset.a || null); });
}
function parede(table){
  const ths = [...table.querySelectorAll('th')].map(t => t.textContent);
  if (!ths.some(t => t.includes('🟧'))) return;
  const idx = k => ths.findIndex(t => t.includes(k));
  const cols = {ator: idx('🟨'), cmd: idx('🟦'), evt: idx('🟧'), pol: idx('🟪')};
  const w = document.createElement('div'); w.className = 'wall';
  [...table.querySelectorAll('tbody tr')].forEach((tr, i) => {
    const td = [...tr.children].map(c => c.innerHTML);
    let h = `<div class="step"><div class="num">${i+1}</div>`;
    for (const [k, j] of Object.entries(cols)) if (j >= 0 && td[j] && td[j].replace(/<[^>]+>/g,'').trim() && td[j].trim() !== '—') h += `<div class="note ${k}">${td[j]}</div>`;
    w.innerHTML += h + '</div>';
  });
  const leg = document.createElement('div'); leg.className = 'legend';
  leg.innerHTML = '<span style="--c:#FFE9A8">Quem</span><span style="--c:#B9D3FF">Faz</span><span style="--c:#FFB36B">Acontece</span><span style="--c:#DCC4F7">Regra ou reação</span>';
  table.replaceWith(leg); leg.after(w);
}
async function mostrar(arq, ancora, forcar){
  const doc = document.getElementById('doc');
  if (arq !== atual || forcar) {
    atual = arq;
    if (arq === '_ia') {
      doc.innerHTML = `<h1>Para IA</h1><blockquote><p>O que um agente lê primeiro: ~${Math.round(D.cartao.length/4)} tokens. Resumos completos em <code>llm/resumos.md</code>; ligações em <code>llm/grafo.json</code>.</p></blockquote><div class="card"><pre>${esc(D.cartao)}</pre></div>`;
    } else {
      const p = D.paginas.find(x => x.arquivo === arq);
      doc.innerHTML = marked.parse(p.texto.replace(/^## Nesta p[áa]gina[\s\S]*?(?=^## )/m, ''));
      doc.querySelectorAll('h2, h3').forEach(h => h.id = slug(h.textContent));
      doc.querySelectorAll('table').forEach(parede);
      if (arq === '2-arquitetura.md' && D.mapa) {
        const alvo = [...doc.querySelectorAll('h2')].find(h => /mapa/i.test(h.textContent));
        const box = document.createElement('div'); box.innerHTML = '<p class="gen">Mapa gerado a partir das tabelas "Consome" de Serviços</p><div class="mermaid"></div>';
        box.querySelector('.mermaid').textContent = D.mapa;
        if (alvo) alvo.after(box); else doc.append(box);
      }
      doc.querySelectorAll('pre > code.language-mermaid').forEach(c => { const d = document.createElement('div'); d.className = 'mermaid'; d.textContent = c.textContent; c.parentElement.replaceWith(d); });
      try { await mermaid.run({nodes: doc.querySelectorAll('.mermaid')}); } catch(e){ console.warn(e); }
      observar();
    }
  }
  document.querySelectorAll('details.pag').forEach(d => d.open = d.dataset.p === arq || (d.open && !!document.getElementById('q').value));
  if (ancora) { const el = document.getElementById(ancora); if (el) el.scrollIntoView(); } else window.scrollTo(0, 0);
  marcar(arq, ancora);
}
function marcar(arq, ancora){
  document.querySelectorAll('#arvore a.no').forEach(a => a.classList.remove('ativo'));
  const sel = ancora ? `#arvore a.no[data-p="${arq}"][data-a="${ancora}"]` : `#arvore details.pag[data-p="${arq}"] > summary a.no`;
  const a = document.querySelector(sel); if (!a) return;
  a.classList.add('ativo');
  let d = a.closest('details'); while (d) { d.open = true; d = d.parentElement.closest('details'); }
  const pg = D.paginas.find(x => x.arquivo === arq);
  const partes = [pg ? pg.nome : 'Para IA'];
  if (ancora && a.dataset.pai) { const pai = document.querySelector(`#arvore a.no[data-p="${arq}"][data-a="${a.dataset.pai}"]`); if (pai) partes.push(pai.textContent.trim()); }
  if (ancora) partes.push(a.textContent.trim());
  document.getElementById('trilha').textContent = partes.join('  ›  ');
}
let obs;
function observar(){
  if (obs) obs.disconnect();
  obs = new IntersectionObserver(es => { const vis = es.filter(e => e.isIntersecting); if (vis.length) marcar(atual, vis[0].target.id); }, {rootMargin:'0px 0px -75% 0px'});
  document.querySelectorAll('#doc h2, #doc h3').forEach(h => obs.observe(h));
}
document.getElementById('q').oninput = e => {
  const f = e.target.value.toLowerCase().trim();
  document.querySelectorAll('#arvore [data-busca]').forEach(el => { const ok = !f || el.dataset.busca.includes(f); el.style.display = ok ? '' : 'none'; if (f && ok && el.tagName === 'DETAILS') el.open = true; });
  document.querySelectorAll('#arvore .nivel3 a.no').forEach(a => { if (f) { const ok = a.textContent.toLowerCase().includes(f) || a.closest('details').dataset.busca.split(' ')[0].includes(f); a.style.display = ok || a.closest('details').dataset.busca.includes(f) ? '' : 'none'; } else a.style.display = ''; });
  if (f) document.querySelectorAll('details.pag').forEach(d => d.open = !![...d.querySelectorAll('[data-busca]')].some(x => x.style.display !== 'none'));
};
