<script>
const D = {"nome": "Online Boutique", "paginas": [{"arquivo": "1-negocio.md", "nome": "Negócio", "resumo": "loja online de decoração e vestuário onde qualquer visitante, sem cadastro, navega o catálogo, monta um carrinho e finaliza a compra informando endereço e cartão. A loja precifica na moeda escolhida, cobra, organiza o envio e confirma por email, em um só passo. Existe como vitrine de referência para construir e-commerce em microsserviços, não para vender de verdade *(a confirmar — ver \"Por que existe\")*.", "texto": "# Negócio: Online Boutique\n\n> **Em resumo:** loja online de decoração e vestuário onde qualquer visitante, sem cadastro,\n> navega o catálogo, monta um carrinho e finaliza a compra informando endereço e cartão. A loja\n> precifica na moeda escolhida, cobra, organiza o envio e confirma por email, em um só passo.\n> Existe como vitrine de referência para construir e-commerce em microsserviços, não para vender\n> de verdade *(a confirmar — ver \"Por que existe\")*.\n\n## Nesta página\n\n| Seção |\n|---|\n| [Em uma frase](#em-uma-frase) |\n| [Por que existe](#por-que-existe) |\n| [Faz / Não faz / Não sabemos](#faz--não-faz--não-sabemos) |\n| [A parede do domínio](#a-parede-do-domínio) |\n| [Jornadas principais](#jornadas-principais) |\n| [Quem orquestra](#quem-orquestra) |\n| [Regras que mandam](#regras-que-mandam) |\n| [Entra e sai](#entra-e-sai) |\n| [Linguagem](#linguagem) |\n| [Indicadores](#indicadores) |\n\n## Em uma frase\nPermitir que qualquer visitante navegue por um catálogo de produtos, monte um carrinho e finalize\na compra em um único fluxo — sem login, sem cadastro, do jeito mais simples possível.\n\n## Por que existe\nServe como aplicação de referência: mostra, de ponta a ponta, como uma loja com vários serviços\nindependentes pode ser construída e operada em Kubernetes. O próprio repositório declara isso\nexplicitamente (`docs/purpose.md`): a prioridade é demonstrar tecnologia de nuvem (Kubernetes,\nobservabilidade, malha de serviço) de forma acessível, e qualquer mudança que complique a jornada\nde compra do usuário iniciante é desencorajada. Classificação: **domínio de suporte/genérico** para\nquem o usa como está — não existe para gerar receita real *(a confirmar com quem mantém o\nrepositório, caso o uso pretendido seja outro)*.\n\n## Faz / Não faz / Não sabemos\n| Faz | Não faz | Não sabemos |\n|---|---|---|\n| Mostra e busca catálogo de produtos | Login ou conta de cliente | Se há plano de autenticação |\n| Monta carrinho por sessão (cookie) | Gestão de estoque | Se a falta de estoque é intencional |\n| Cobra, calcula frete e confirma o pedido em um fluxo só | Cobrança e frete reais (simulados) | Se algum dia plugam gateway/transportadora reais |\n| Converte preços entre moedas | Câmbio em tempo real (README sugere, código não faz) | Por que README e código divergem |\n| Sugere produtos e anúncios | Histórico ou \"meus pedidos\" | Se o pedido é descartado de propósito |\n\n## A parede do domínio\n| # | 🟨 Quem | 🟦 Faz | 🟧 Acontece | 🟪 Regra ou reação |\n|---|---|---|---|---|\n| 1 | Cliente | Abre a loja | Sessão iniciada | Sem login; identidade é só um cookie |\n| 2 | Cliente | Navega, busca e escolhe um produto | Produto visualizado | Recomendações e anúncio aparecem junto |\n| 3 | Cliente | Adiciona o produto ao carrinho | Item adicionado ao carrinho | Sem checagem de estoque |\n| 4 | Cliente | Informa endereço, email e cartão e confirma | Pedido solicitado | Formulário validado antes de prosseguir |\n| 5 | Loja | Calcula o preço total na moeda do cliente (produtos + frete) | Preço do pedido calculado | Frete é fixo (US$ 8.99 se houver item, senão zero) |\n| 6 | Loja | Cobra o cartão informado | Pagamento aprovado *ou* recusado | Só aceita Visa/Mastercard não vencido |\n| 7 | Loja | Despacha o pedido | Pedido enviado (rastreio gerado) | Só acontece se o pagamento foi aprovado |\n| 8 | Loja | Esvazia o carrinho e avisa o cliente por email | Pedido confirmado | Falha no aviso não desfaz a compra |\n\n🟥 Consulte as [dúvidas de contexto na Referência](6-referencia.md#dúvidas-de-contexto).\n\n## Jornadas principais\n| Jornada | Em uma linha | Link |\n|---|---|---|\n| Comprar um produto | Do carrinho ao pedido confirmado, cobrança e envio inclusos | [4-jornadas.md#comprar-um-produto](4-jornadas.md#comprar-um-produto) |\n| Navegar e montar o carrinho | Ver, buscar e adicionar produtos ao carrinho | [4-jornadas.md#navegar-e-montar-o-carrinho](4-jornadas.md#navegar-e-montar-o-carrinho) |\n| Pedir ajuda ao assistente de compras | Sugestão de produtos a partir de uma foto (opcional) | [4-jornadas.md#pedir-ajuda-ao-assistente-de-compras-opcional](4-jornadas.md#pedir-ajuda-ao-assistente-de-compras-opcional) |\n\n## Quem orquestra\n| Jornada | Quem manda | Como |\n|---|---|---|\n| Comprar um produto | Um serviço orquestrador (`checkoutservice`) | Chama carrinho, catálogo, câmbio, frete, pagamento e email em sequência, dentro da mesma requisição — sem motor de processo nem fila |\n| Navegar e montar o carrinho | Ninguém — coreografia simples | Cada tela do site busca só o que precisa, sem fluxo maior por trás |\n| Pedir ajuda ao assistente | O próprio assistente (`shoppingassistantservice`) | Chama IA generativa e busca de produtos por conta própria, sem envolver o resto do domínio |\n\n## Regras que mandam\nOs limites e exceções desta perspectiva estão consolidados na [Referência](6-referencia.md#regras-de-negócio); consulte também as [dúvidas](6-referencia.md#dúvidas-e-perguntas).\n\n## Entra e sai\n| Direção | O quê | Com quem |\n|---|---|---|\n| Entra | Navegação, escolha de produtos, dados de endereço/cartão | Cliente (navegador) |\n| Entra | Tráfego sintético para testes/demo | 🩷 `loadgenerator` |\n| Sai | Preço final, confirmação do pedido, rastreio | Cliente (navegador) |\n| Sai *(opcional)* | Foto do ambiente e pergunta | 🩷 Gemini (Google AI) — só se o assistente estiver habilitado |\n| Sai *(opcional)* | Métricas, traces e profiling | 🩷 Google Cloud Operations — só se habilitado |\n\nEste domínio não troca dado com nenhum outro domínio de negócio externo ao repositório: todos os\n\"parceiros\" (pagamento, frete, email) são simulados internamente (ver `3-servicos.md`).\n\n## Linguagem\nOs termos têm uma definição única na [Referência](6-referencia.md#glossário); consulte também as [dúvidas](6-referencia.md#dúvidas-e-perguntas).\n\n## Indicadores\nNenhum indicador de negócio (conversão, ticket médio, taxa de abandono) foi encontrado no\nrepositório — é esperado, já que o próprio domínio não persiste pedidos *(a confirmar com quem\ndecide o produto; hoje o indicador mais próximo é operacional: latência/erros por serviço, via\ntracing e profiling opcionais)*.\n\n**Fontes:** `docs/purpose.md`, `docs/product-requirements.md`, `README.md`,\n`src/loadgenerator/locustfile.py` (jornada do cliente simulada), `src/checkoutservice/main.go`,\n`src/paymentservice/charge.js`, `src/shippingservice/quote.go` — deduções de negócio marcadas\n*(a confirmar)* porque o repositório é um projeto de demonstração técnica, não um produto real com\ndonos de negócio declarados.\n", "secoes": [{"titulo": "Em uma frase", "slug": "em-uma-frase", "subs": []}, {"titulo": "Por que existe", "slug": "por-que-existe", "subs": []}, {"titulo": "Faz / Não faz / Não sabemos", "slug": "faz--não-faz--não-sabemos", "subs": []}, {"titulo": "A parede do domínio", "slug": "a-parede-do-domínio", "subs": []}, {"titulo": "Jornadas principais", "slug": "jornadas-principais", "subs": []}, {"titulo": "Quem orquestra", "slug": "quem-orquestra", "subs": []}, {"titulo": "Regras que mandam", "slug": "regras-que-mandam", "subs": []}, {"titulo": "Entra e sai", "slug": "entra-e-sai", "subs": []}, {"titulo": "Linguagem", "slug": "linguagem", "subs": []}, {"titulo": "Indicadores", "slug": "indicadores", "subs": []}]}, {"arquivo": "2-arquitetura.md", "nome": "Arquitetura", "resumo": "11 microsserviços poliglotas (Go, Java, Node.js, Python, C#) que conversam quase exclusivamente por gRPC síncrono, definidos em um único contrato compartilhado (`protos/demo.proto`). Não há barramento de eventos nem fila — a única \"orquestração\" é o `checkoutservice`, que chama os demais em sequência dentro de uma requisição. O `frontend` é o único ponto de entrada externo; tudo mais é interno ao cluster.", "texto": "# Arquitetura: Online Boutique\n\n> **Em resumo:** 11 microsserviços poliglotas (Go, Java, Node.js, Python, C#) que conversam quase\n> exclusivamente por gRPC síncrono, definidos em um único contrato compartilhado\n> (`protos/demo.proto`). Não há barramento de eventos nem fila — a única \"orquestração\" é o\n> `checkoutservice`, que chama os demais em sequência dentro de uma requisição. O `frontend` é o\n> único ponto de entrada externo; tudo mais é interno ao cluster.\n\n## Nesta página\n\n| Seção |\n|---|\n| [Contexto](#contexto) |\n| [Subdomínios](#subdomínios) |\n| [Mapa dos serviços](#mapa-dos-serviços) |\n| [Estilo de integração](#estilo-de-integração) |\n| [Decisões que moldam](#decisões-que-moldam) |\n| [Riscos técnicos](#riscos-técnicos) |\n\n## Contexto\n\n```mermaid\nflowchart LR\n  Cliente((Cliente\\nnavegador)) --> OB[Online Boutique]\n  LG[loadgenerator\\ntráfego sintético] --> OB\n  OB -->|opcional| Gemini[[Gemini - Google AI]]\n  OB -->|opcional| AlloyDB[(AlloyDB\\nvetores/catálogo/carrinho)]\n  OB -->|opcional| Spanner[(Cloud Spanner\\ncarrinho)]\n  OB -->|opcional| Memorystore[(Memorystore\\ncarrinho)]\n  OB -.->|observabilidade opcional| GCPOps[Google Cloud Operations]\n```\n\nNão há sistema de pagamento, transportadora ou provedor de email reais — `paymentservice`,\n`shippingservice` e `emailservice` são mocks internos ao domínio (ver `3-servicos.md`).\n\n## Subdomínios\n\n| Subdomínio | Responsabilidade | Serviços |\n|---|---|---|\n| Experiência do cliente | Servir o site, agregar dados dos demais subdomínios | `frontend` |\n| Carrinho | Guardar os itens escolhidos por sessão | `cartservice` |\n| Catálogo | Listar, buscar e detalhar produtos | `productcatalogservice` |\n| Precificação | Converter valores entre moedas | `currencyservice` |\n| Frete | Cotar e \"despachar\" o pedido | `shippingservice` |\n| Checkout | Orquestrar a compra ponta a ponta | `checkoutservice` |\n| Pagamento | Validar e \"cobrar\" o cartão | `paymentservice` |\n| Notificação | Confirmar o pedido por email | `emailservice` |\n| Descoberta | Sugerir produtos/anúncios ao cliente | `recommendationservice`, `adservice`, `shoppingassistantservice` (opcional) |\n| Suporte (fora do negócio) | Gerar tráfego de teste | `loadgenerator` |\n\n## Mapa dos serviços\n\n<!-- MAPA-PRINCIPAL -->\n\nRelações de dependência declaradas em [Serviços](3-servicos.md); a seta parte do consumidor e aponta para seu fornecedor. O rótulo distingue chamada, evento, dado, callback e inicialização. Componentes opcionais e inativos conservam seu estado.\n\n`checkoutservice` orquestra a compra; frontend, recommendationservice e assistente também consomem dependências, conforme o mapa.\n\n## Estilo de integração\n\n- **Síncrono, sempre.** Todo o domínio fala gRPC (contrato único em `protos/demo.proto`), com uma\n  exceção: `frontend` → `shoppingassistantservice` é HTTP simples (POST JSON), não gRPC.\n- **Sem eventos, sem filas.** Não há producer/consumer de mensageria em nenhum serviço — cada\n  chamada espera resposta antes de seguir.\n- **Orquestração centralizada em um serviço, não em um motor de processo.** O `checkoutservice`\n  concentra toda a lógica da sequência de compra em código Go dentro de `PlaceOrder` — não há Step\n  Functions, Camunda, Temporal nem qualquer BOAT. Todo o resto é coreografia trivial: o `frontend`\n  chama cada serviço que precisa, sem compor um fluxo maior.\n- **Timeouts pontuais.** Só `adservice` tem timeout explícito no chamador (100 ms, no `frontend`).\n  Os demais não mostraram timeout/retry configurado nos trechos lidos *(a confirmar)*.\n\n## Decisões que moldam\n\n| Decisão | Efeito |\n|---|---|\n| Um único `.proto` compartilhado para todos os serviços ([`6-referencia.md`](6-referencia.md#decisões)) | Contrato compartilhado reduz divergências entre serviços, mas acopla o build de todos a um gerador comum |\n| Nenhum serviço mock (pagamento, frete, email) chama sistema externo real | Domínio é 100% autocontido — ótimo para demo, mas não reflete uma loja real em produção |\n| `checkoutservice` orquestra por código, sem persistir o pedido | Compra é \"fire and forget\": não há como consultar um pedido depois de feito |\n| Infra gerenciada (Spanner/AlloyDB/Memorystore/Istio) é sempre opt-in via Kustomize | Reduz a complexidade e o custo do caminho padrão (`docs/product-requirements.md`), mas quem quer produção real precisa montar isso à mão |\n\n## Riscos técnicos\n\n- **Cobrança sem estorno:** se `ShipOrder` falhar depois de `Charge` ter sido aprovado, o cliente é\n  cobrado e o pedido não se completa — não existe compensação (ver `4-jornadas.md` →\n  \"Comprar um produto\").\n- **Carrinho sem persistência por padrão:** `redis-cart` usa `emptyDir`; um restart do pod apaga\n  todos os carrinhos em andamento (ver `5-infraestrutura.md`).\n- **Sem estoque nem limite de quantidade:** nada no código impede adicionar mais itens do que\n  \"existe\" — não há conceito de estoque no domínio *(a confirmar)*.\n- **Taxas de câmbio desatualizadas:** `currencyservice` usa uma tabela fixa embutida na imagem, não\n  busca cotações reais apesar do que o `README.md` do repositório sugere (ver `6-referencia.md` →\n  Dúvidas e perguntas).\n- **Acoplamento síncrono em cadeia:** como tudo é gRPC bloqueante, uma lentidão em qualquer serviço\n  do checkout (ex.: `paymentservice`) atrasa a resposta inteira ao cliente; não há circuit breaker\n  visível no código lido.\n\n**Fontes:** `protos/demo.proto`, `src/checkoutservice/main.go`, `src/frontend/rpc.go` e\n`handlers.go`, `docs/product-requirements.md`, `docs/purpose.md`, `README.md` do repositório,\n`kustomize/components/*` (para as integrações opcionais). Donos por subdomínio e SLA/timeouts não\ndocumentados explicitamente ficam *(a confirmar)*.\n", "secoes": [{"titulo": "Contexto", "slug": "contexto", "subs": []}, {"titulo": "Subdomínios", "slug": "subdomínios", "subs": []}, {"titulo": "Mapa dos serviços", "slug": "mapa-dos-serviços", "subs": []}, {"titulo": "Estilo de integração", "slug": "estilo-de-integração", "subs": []}, {"titulo": "Decisões que moldam", "slug": "decisões-que-moldam", "subs": []}, {"titulo": "Riscos técnicos", "slug": "riscos-técnicos", "subs": []}]}, {"arquivo": "3-servicos.md", "nome": "Serviços", "resumo": "11 microsserviços (mais um 12º opcional, o assistente de compras) conversam quase só por gRPC síncrono, seguindo os contratos únicos de `protos/demo.proto`. Não há fila nem barramento de eventos: tudo é chamada-resposta. O `checkoutservice` orquestra a compra; o frontend compõe telas e o recommendationservice consulta o catálogo.", "texto": "# Serviços: Online Boutique\n\n> **Em resumo:** 11 microsserviços (mais um 12º opcional, o assistente de compras) conversam quase\n> só por gRPC síncrono, seguindo os contratos únicos de `protos/demo.proto`. Não há fila nem\n> barramento de eventos: tudo é chamada-resposta. O `checkoutservice` orquestra a compra; o frontend compõe telas e o recommendationservice consulta o catálogo.\n\n## Nesta página\n\n| Seção |\n|---|\n| [frontend](#frontend) |\n| [cartservice](#cartservice) |\n| [productcatalogservice](#productcatalogservice) |\n| [currencyservice](#currencyservice) |\n| [shippingservice](#shippingservice) |\n| [checkoutservice](#checkoutservice) |\n| [paymentservice](#paymentservice) |\n| [emailservice](#emailservice) |\n| [recommendationservice](#recommendationservice) |\n| [adservice](#adservice) |\n| [shoppingassistantservice (opcional)](#shoppingassistantservice-opcional) |\n| [loadgenerator](#loadgenerator) |\n\n## frontend\n\n**ID:** `frontend`\n**Estado:** ativo\n> **Em resumo:** único serviço com porta HTTP pública; monta as páginas do site e chama todos os\n> outros serviços via gRPC (e o assistente via HTTP) para montar cada tela.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Experiência do cliente | *(a confirmar, ver CODEOWNERS: time único para o repo)* | Go, `gorilla/mux`, templates HTML | `src/frontend/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `GET /` | HTTP | Home: lista de produtos, moedas, carrinho atual |\n| `GET /product/{id}` | HTTP | Detalhe do produto + recomendações + anúncio |\n| `GET /cart`, `POST /cart`, `POST /cart/empty` | HTTP | Ver, adicionar e esvaziar o carrinho |\n| `POST /setCurrency` | HTTP | Troca a moeda de exibição |\n| `POST /cart/checkout` | HTTP | Dispara a compra (chama `checkoutservice`) |\n| `GET /logout` | HTTP | Encerra a sessão (novo `shop_session-id`) |\n| `POST /bot` | HTTP | Encaminha pergunta ao `shoppingassistantservice` (se habilitado) |\n| `GET /_healthz` | HTTP | Liveness/readiness |\n\n### Consome\n| Serviço | Contrato | Tipo | Transporte |\n|---|---|---|---|\n| productcatalogservice | `ListProducts`, `GetProduct` | chama_api | gRPC |\n| currencyservice | `GetSupportedCurrencies`, `Convert` | chama_api | gRPC |\n| cartservice | `GetCart`, `AddItem`, `EmptyCart` | chama_api | gRPC |\n| recommendationservice | `ListRecommendations` | chama_api | gRPC |\n| shippingservice | `GetQuote` | chama_api | gRPC |\n| checkoutservice | `PlaceOrder` | chama_api | gRPC |\n| adservice | `GetAds` (timeout de 100 ms) | chama_api | gRPC |\n| shoppingassistantservice | `POST /` | chama_api | HTTP (não gRPC — chamada direta com `http.NewRequest`) |\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `handlers.go` | rotas HTTP | Lê/valida formulário, chama os serviços, renderiza template |\n| `rpc.go` | chamado pelos handlers | Centraliza as chamadas gRPC a cada serviço dependente |\n| `middleware.go` | todo request | Gera/lê cookie `shop_session-id`, injeta logger e request-id no contexto |\n| `validator/validator.go` | `POST /cart/checkout` | Valida os campos do formulário de pagamento/endereço antes de chamar o checkout |\n\n### Dados\nNão persiste nada: sessão do usuário é um cookie (`shop_session-id`), sem sessão no servidor.\n\n### Quando falha\nFalhas obrigatórias viram HTTP 500 (`renderHTTPError`). Anúncios (`getAd`, timeout de 100 ms) e recomendações têm tratamento best-effort; a tela pode continuar sem esses complementos. Sem retentativas\nnem circuit breaker aparentes no código *(a confirmar)*.\n\n### Infra que usa\n`Deployment`/`Service` `frontend` + `frontend-external` (LoadBalancer) — ver `5-infraestrutura.md`.\n\n**Fontes:** `src/frontend/handlers.go`, `rpc.go`, `main.go`, `middleware.go`, `kubernetes-manifests/frontend.yaml`.\n\n---\n\n## cartservice\n\n**ID:** `cartservice`\n**Estado:** ativo\n> **Em resumo:** guarda e devolve os itens do carrinho de cada usuário; se não houver Redis\n> configurado, usa um armazenamento em memória do próprio processo (perde tudo ao reiniciar).\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Carrinho | *(a confirmar)* | C# / .NET, gRPC | `src/cartservice/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `AddItem(user_id, item)` | gRPC | Adiciona item ao carrinho do usuário |\n| `GetCart(user_id)` | gRPC | Retorna os itens do carrinho |\n| `EmptyCart(user_id)` | gRPC | Esvazia o carrinho (usado pelo checkout após a compra) |\n\n### Consome\nNenhum outro serviço do domínio — só o próprio armazenamento (Redis).\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `services/CartService.cs` | chamada gRPC | Implementa os 3 métodos acima |\n| `cartstore/RedisCartStore.cs` | padrão, se `REDIS_ADDR` setado | Lê/escreve carrinho serializado no Redis |\n| `cartstore/SpannerCartStore.cs` | componente Kustomize `spanner` | Alternativa gerenciada ao Redis |\n| `cartstore/AlloyDBCartStore.cs` | componente Kustomize `alloydb` | Alternativa gerenciada ao Redis (busca senha no Secret Manager) |\n\n### Dados\nEntidade única: `Cart { user_id, items[] { product_id, quantity } }`. Sem histórico — é sempre o\nestado atual do carrinho.\n\n### Quando falha\nSe o Redis cair, as chamadas de carrinho falham e o `frontend`/`checkoutservice` propagam erro 500\nao usuário. Sem fila de retry nem fallback.\n\n### Infra que usa\n`Deployment`/`Service` `cartservice` + `redis-cart` (`emptyDir`, **sem persistência em disco** —\num restart do pod do Redis apaga todos os carrinhos). Ver `5-infraestrutura.md`.\n\n**Fontes:** `src/cartservice/src/services/CartService.cs`, `Startup.cs`,\n`src/cartservice/src/cartstore/*.cs`, `kubernetes-manifests/cartservice.yaml`.\n\n---\n\n## productcatalogservice\n\n**ID:** `productcatalogservice`\n**Estado:** ativo\n> **Em resumo:** fonte da verdade sobre os produtos; por padrão lê um JSON estático embutido na\n> imagem, sem escrita — é só leitura.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Catálogo | *(a confirmar)* | Go, gRPC | `src/productcatalogservice/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `ListProducts(Empty)` | gRPC | Lista todos os produtos |\n| `GetProduct(id)` | gRPC | Detalhe de um produto |\n| `SearchProducts(query)` | gRPC | Busca por nome/descrição (substring, case-insensitive) |\n\n### Consome\nNenhum outro serviço do domínio.\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `catalog_loader.go` | toda chamada (ou 1x se `reloadCatalog=false`) | Carrega `products.json` local, ou AlloyDB se `ALLOYDB_CLUSTER_NAME` setado |\n| `product_catalog.go` | chamada gRPC | Implementa `ListProducts`/`GetProduct`/`SearchProducts` sobre o catálogo carregado |\n| `EXTRA_LATENCY` (env) | toda chamada | Injeta atraso artificial configurável — usado para demonstrar latência em observabilidade |\n\n### Dados\n`Product { id, name, description, picture, price_usd, categories[] }`. Fonte: `products.json`\n(catálogo fixo de ~9 produtos) ou tabela AlloyDB equivalente *(a confirmar: schema exato da tabela AlloyDB)*.\n\n### Quando falha\n`GetProduct` retorna gRPC `NotFound` se o id não existir; sem isso, erros de leitura do arquivo\nderrubam a resposta (catálogo vazio).\n\n### Infra que usa\n`Deployment`/`Service` `productcatalogservice`; opcionalmente AlloyDB (componente Kustomize\n`alloydb`). Ver `5-infraestrutura.md`.\n\n**Fontes:** `src/productcatalogservice/product_catalog.go`, `catalog_loader.go`, `products.json`,\n`kubernetes-manifests/productcatalogservice.yaml`.\n\n---\n\n## currencyservice\n\n**ID:** `currencyservice`\n**Estado:** ativo\n> **Em resumo:** converte valores entre moedas usando uma tabela de taxas fixa embutida na\n> imagem — apesar do README dizer que usa \"valores reais do Banco Central Europeu\", o código lê um\n> arquivo JSON estático, não busca nada em tempo real.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Precificação | *(a confirmar)* | Node.js, gRPC | `src/currencyservice/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `GetSupportedCurrencies(Empty)` | gRPC | Lista de códigos de moeda suportados |\n| `Convert(from, to_code)` | gRPC | Converte um `Money` para outra moeda |\n\n### Consome\nNenhum outro serviço do domínio.\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `server.js` → `_getCurrencyData` | toda chamada | Lê `data/currency_conversion.json` (taxas fixas em relação a EUR) |\n| conversão | `Convert` | Passa pela taxa EUR como pivô: `origem → EUR → destino` |\n\n### Dados\nTabela estática de taxas (arquivo, não banco). Sem estado por usuário.\n\n### Quando falha\nMoeda não suportada gera erro gRPC; não há atualização de taxas em produção, então valores ficam\ndesatualizados com o tempo *(a confirmar se isso é intencional para a demo)*.\n\n### Infra que usa\n`Deployment`/`Service` `currencyservice`. Ver `5-infraestrutura.md`.\n\n**Fontes:** `src/currencyservice/server.js` (função `_getCurrencyData`),\n`src/currencyservice/data/currency_conversion.json`, README do repositório (contradiz o código —\nregistrado em `6-referencia.md`).\n\n---\n\n## shippingservice\n\n**ID:** `shippingservice`\n**Estado:** ativo\n> **Em resumo:** calcula uma cotação de frete fixa e gera um código de rastreio aleatório — não\n> existe integração real com transportadora.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Frete | *(a confirmar)* | Go, gRPC | `src/shippingservice/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `GetQuote(address, items)` | gRPC | Retorna custo de frete estimado |\n| `ShipOrder(address, items)` | gRPC | \"Despacha\" o pedido e devolve um `tracking_id` |\n\n### Consome\nNenhum outro serviço do domínio.\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `quote.go` | `GetQuote` | Regra fixa: US$ 8.99 se o carrinho tiver ao menos 1 item, senão US$ 0 |\n| `tracker.go` | `ShipOrder` | Gera um `tracking_id` aleatório (mock, não integra transportadora) |\n\n### Dados\nSem persistência — cálculo puro por requisição.\n\n### Quando falha\nSem casos de erro relevantes no código (função determinística sem I/O externo).\n\n### Infra que usa\n`Deployment`/`Service` `shippingservice`. Ver `5-infraestrutura.md`.\n\n**Fontes:** `src/shippingservice/quote.go`, `tracker.go`, `kubernetes-manifests/shippingservice.yaml`.\n\n---\n\n## checkoutservice\n\n**ID:** `checkoutservice`\n**Estado:** ativo\n> **Em resumo:** o orquestrador da compra. Recebe o pedido do `frontend` e, em uma única chamada\n> síncrona, busca o carrinho, precifica em moeda local, cota o frete, cobra o cartão, despacha o\n> envio, esvazia o carrinho e dispara o email de confirmação.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Checkout | *(a confirmar)* | Go, gRPC | `src/checkoutservice/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `PlaceOrder(user_id, user_currency, address, email, credit_card)` | gRPC | Orquestra a compra sem compensação automática |\n\n### Consome\n| Serviço | Contrato | Tipo | Transporte |\n|---|---|---|---|\n| cartservice | `GetCart`, `EmptyCart` | chama_api | gRPC |\n| productcatalogservice | `GetProduct` | chama_api | gRPC |\n| currencyservice | `Convert` | chama_api | gRPC |\n| shippingservice | `GetQuote`, `ShipOrder` | chama_api | gRPC |\n| paymentservice | `Charge` | chama_api | gRPC |\n| emailservice | `SendOrderConfirmation` | chama_api | gRPC |\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `PlaceOrder` (`main.go`) | chamada gRPC do frontend | Passo a passo descrito em `4-jornadas.md` |\n| `prepareOrderItemsAndShippingQuoteFromCart` | dentro de `PlaceOrder` | Busca carrinho, converte preços, cota frete |\n| `chargeCard` / `shipOrder` / `sendOrderConfirmation` | dentro de `PlaceOrder` | Chamam pagamento, envio e email, nessa ordem |\n\n### Dados\nNão persiste o pedido — gera um `order_id` (UUID) na hora e devolve o `OrderResult` completo na\nresposta; não há tabela de pedidos *(a confirmar: pedido não fica em lugar nenhum após a resposta)*.\n\n### Quando falha\n- Falha ao buscar carrinho, converter moeda ou cotar frete → erro `Internal`, nada é cobrado.\n- Falha ao cobrar o cartão (`chargeCard`) → erro `Internal`, pedido não avança (frete e email não\n  acontecem).\n- Falha no envio (`shipOrder`) **depois de já ter cobrado** → erro `Unavailable`; **não há\n  estorno automático** no código — risco relevante (ver `2-arquitetura.md` → Riscos técnicos).\n- Falha ao esvaziar o carrinho ou ao enviar o email → é **ignorada** (log apenas); o pedido é\n  considerado concluído mesmo assim.\n\n### Infra que usa\n`Deployment`/`Service` `checkoutservice`. Ver `5-infraestrutura.md`.\n\n**Fontes:** `src/checkoutservice/main.go` (função `PlaceOrder` e auxiliares, lidas por completo).\n\n---\n\n## paymentservice\n\n**ID:** `paymentservice`\n**Estado:** ativo\n> **Em resumo:** valida o cartão (formato, bandeira, validade) e devolve um ID de transação\n> aleatório — não cobra nada de verdade, não há gateway de pagamento real.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Pagamento | *(a confirmar)* | Node.js, gRPC | `src/paymentservice/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `Charge(amount, credit_card)` | gRPC | \"Cobra\" o cartão e devolve `transaction_id` |\n\n### Consome\nNenhum outro serviço do domínio.\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `charge.js` | `Charge` | Valida número via `simple-card-validator`; aceita só Visa/Mastercard; valida vencimento no mês atual ou posterior (R02 na Referência); gera `transaction_id` com `uuidv4()` |\n\n### Dados\nSem persistência — nenhuma transação é guardada em nenhum lugar.\n\n### Quando falha\nLança `InvalidCreditCard`, `UnacceptedCreditCard` (bandeira não aceita) ou `ExpiredCreditCard`\n(cartão vencido) — o `checkoutservice` propaga isso como falha e interrompe a compra após a cotação de frete e antes do envio do pedido/email.\n\n### Infra que usa\n`Deployment`/`Service` `paymentservice`. Ver `5-infraestrutura.md`.\n\n**Fontes:** `src/paymentservice/charge.js` (lido por completo).\n\n---\n\n## emailservice\n\n**ID:** `emailservice`\n**Estado:** ativo\n> **Em resumo:** renderiza um HTML de confirmação de pedido com Jinja2 e loga que \"enviaria\" o\n> email — não há envio real (sem SMTP/SendGrid configurado no código lido).\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Notificação | *(a confirmar)* | Python, gRPC | `src/emailservice/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `SendOrderConfirmation(email, order)` | gRPC | Renderiza e \"envia\" a confirmação do pedido |\n\n### Consome\nNenhum outro serviço do domínio.\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `email_server.py` | `SendOrderConfirmation` | Carrega template `templates/confirmation.html` (Jinja2) e renderiza com os dados do pedido |\n\n### Dados\nSem persistência.\n\n### Quando falha\nErro de template (`TemplateError`) é capturado e logado; o `checkoutservice` trata qualquer falha\naqui como não bloqueante (só loga um aviso, o pedido segue \"concluído\" para o cliente).\n\n### Infra que usa\n`Deployment`/`Service` `emailservice` (porta serviço 5000 → container 8080). Ver `5-infraestrutura.md`.\n\n**Fontes:** `src/emailservice/email_server.py`, `email_client.py`,\n`kubernetes-manifests/emailservice.yaml`.\n\n---\n\n## recommendationservice\n\n**ID:** `recommendationservice`\n**Estado:** ativo\n> **Em resumo:** sugere até 5 produtos do catálogo escolhidos aleatoriamente, excluindo os que já\n> estão no carrinho — não é um motor de recomendação real (sem histórico, sem afinidade).\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Descoberta | *(a confirmar)* | Python, gRPC | `src/recommendationservice/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `ListRecommendations(user_id, product_ids)` | gRPC | Devolve até 5 ids de produto que não estão em `product_ids` |\n\n### Consome\n| Serviço | Contrato | Tipo | Transporte |\n|---|---|---|---|\n| productcatalogservice | `ListProducts` | chama_api | gRPC |\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `recommendation_server.py` → `ListRecommendations` | chamada gRPC | Busca todos os produtos, remove os já no carrinho, sorteia até 5 (`random.sample`) |\n\n### Dados\nSem persistência, sem uso real de `user_id` na lógica de seleção.\n\n### Quando falha\nSe `productcatalogservice` estiver fora, a chamada propaga erro; o `frontend` trata isso deixando\na home/checkout sem a seção de recomendados.\n\n### Infra que usa\n`Deployment`/`Service` `recommendationservice`. Ver `5-infraestrutura.md`.\n\n**Fontes:** `src/recommendationservice/recommendation_server.py` (função `ListRecommendations`).\n\n---\n\n## adservice\n\n**ID:** `adservice`\n**Estado:** ativo\n> **Em resumo:** devolve anúncios de texto estáticos, escolhidos por palavra-chave de categoria ou\n> aleatoriamente — mapa de anúncios fixo no código, sem targeting real.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Descoberta | *(a confirmar)* | Java, gRPC | `src/adservice/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `GetAds(context_keys[])` | gRPC | Até 2 anúncios relacionados às categorias informadas, ou aleatórios |\n\n### Consome\nNenhum outro serviço do domínio.\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `AdService.java` → `createAdsMap` | inicialização | Monta mapa fixo categoria → anúncios (clothing, accessories, footwear, hair, decor, kitchen) |\n| `getAds` | chamada gRPC | Busca por categoria; se vazio, sorteia 2 anúncios quaisquer |\n\n### Dados\nMapa estático em memória, sem persistência.\n\n### Quando falha\nChamado pelo `frontend` com timeout de 100 ms; se falhar ou estourar o tempo, a página segue sem\nanúncio (erro é apenas logado no frontend).\n\n### Infra que usa\n`Deployment`/`Service` `adservice`. Ver `5-infraestrutura.md`.\n\n**Fontes:** `src/adservice/.../AdService.java` (lido por completo).\n\n---\n\n## shoppingassistantservice (opcional)\n\n**ID:** `shoppingassistantservice`\n**Estado:** opcional\n> **Em resumo:** assistente de compras com IA generativa — recebe uma foto de um ambiente, usa\n> Gemini para descrever o estilo, busca produtos parecidos por similaridade vetorial no AlloyDB e\n> pede ao Gemini uma recomendação final. Só existe quando o componente Kustomize\n> `shopping-assistant` é aplicado; não faz parte do deploy padrão.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Descoberta | *(a confirmar)* | Python/Flask, LangChain + Gemini + AlloyDB | `src/shoppingassistantservice/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `POST /` | HTTP | Recebe `{message, image}`, devolve `{content}` com a recomendação em texto |\n\n### Consome\n| Serviço | Contrato | Tipo | Transporte |\n|---|---|---|---|\n| Gemini (`gemini-1.5-flash`, Google AI) 🩷 | API de chat/visão | chama_api | HTTP (via SDK `langchain_google_genai`) |\n| AlloyDB 🩷 | busca vetorial (`AlloyDBVectorStore`) | acessa_dado | SQL/vetor |\n| Secret Manager 🩷 | leitura da senha do AlloyDB | chama_api | API |\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `talkToGemini` (`shoppingassistantservice.py`) | `POST /` | 1) Descreve a imagem com Gemini; 2) busca produtos similares no AlloyDB; 3) pede recomendação final ao Gemini com a lista de produtos |\n\n### Dados\nTabela vetorial no AlloyDB com `id, name, categories, description` e embedding\n(`models/embedding-001`) — populada fora deste serviço *(a confirmar: script/processo de carga dos embeddings)*.\n\n### Quando falha\nSem tratamento de erro visível no handler (`talkToGemini`) — qualquer exceção do Gemini ou do\nAlloyDB provavelmente vira erro 500 não tratado *(a confirmar)*. No `frontend`, o handler\n`chatBotHandler` retorna 500 se a chamada HTTP falhar ou o corpo não for o JSON esperado.\n\n### Infra que usa\n`Deployment`/`Service` `shoppingassistantservice` (só quando o componente Kustomize é aplicado) +\nAlloyDB gerenciado + credencial `GOOGLE_API_KEY` (placeholder no manifesto, precisa ser preenchida\nantes do deploy — ver `6-referencia.md`). Ver `5-infraestrutura.md`.\n\n**Fontes:** `src/shoppingassistantservice/shoppingassistantservice.py` (lido por completo),\n`kustomize/components/shopping-assistant/shoppingassistantservice.yaml`,\n`kustomize/components/shopping-assistant/README.md`, `src/frontend/handlers.go` (`chatBotHandler`).\n\n---\n\n## loadgenerator\n\n**ID:** `loadgenerator`\n**Estado:** ativo\n> **Em resumo:** não faz parte do domínio de negócio — é uma ferramenta de suporte que simula\n> clientes reais navegando, comprando e saindo, usada para gerar carga e tráfego de demonstração.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Suporte (fora do domínio de negócio) | *(a confirmar)* | Python/Locust | `src/loadgenerator/` |\n\n### Consome\n| Serviço | Contrato | Tipo | Transporte |\n|---|---|---|---|\n| frontend | `/`, `/setCurrency`, `/product/{id}`, `/cart`, `/cart/checkout`, `/logout` | chama_api | HTTP |\n\n### Por dentro\n`locustfile.py` define os pesos das ações simuladas: navegar (10x), ver carrinho (3x), trocar\nmoeda (2x), adicionar ao carrinho (2x), finalizar compra (1x), abrir a home (1x). Um init-container\nespera o `frontend` responder 200 antes de começar.\n\n### Infra que usa\n`Deployment` `loadgenerator` (sem `Service`, não recebe tráfego). Pode ser removido via componente\nKustomize `without-loadgenerator`. Ver `5-infraestrutura.md`.\n\n**Fontes:** `src/loadgenerator/locustfile.py`, `kubernetes-manifests/loadgenerator.yaml`.\n", "secoes": [{"titulo": "frontend", "slug": "frontend", "subs": [{"titulo": "Expõe", "slug": "frontend--expõe"}, {"titulo": "Consome", "slug": "frontend--consome"}, {"titulo": "Por dentro", "slug": "frontend--por-dentro"}, {"titulo": "Dados", "slug": "frontend--dados"}, {"titulo": "Quando falha", "slug": "frontend--quando-falha"}, {"titulo": "Infra que usa", "slug": "frontend--infra-que-usa"}]}, {"titulo": "cartservice", "slug": "cartservice", "subs": [{"titulo": "Expõe", "slug": "cartservice--expõe"}, {"titulo": "Consome", "slug": "cartservice--consome"}, {"titulo": "Por dentro", "slug": "cartservice--por-dentro"}, {"titulo": "Dados", "slug": "cartservice--dados"}, {"titulo": "Quando falha", "slug": "cartservice--quando-falha"}, {"titulo": "Infra que usa", "slug": "cartservice--infra-que-usa"}]}, {"titulo": "productcatalogservice", "slug": "productcatalogservice", "subs": [{"titulo": "Expõe", "slug": "productcatalogservice--expõe"}, {"titulo": "Consome", "slug": "productcatalogservice--consome"}, {"titulo": "Por dentro", "slug": "productcatalogservice--por-dentro"}, {"titulo": "Dados", "slug": "productcatalogservice--dados"}, {"titulo": "Quando falha", "slug": "productcatalogservice--quando-falha"}, {"titulo": "Infra que usa", "slug": "productcatalogservice--infra-que-usa"}]}, {"titulo": "currencyservice", "slug": "currencyservice", "subs": [{"titulo": "Expõe", "slug": "currencyservice--expõe"}, {"titulo": "Consome", "slug": "currencyservice--consome"}, {"titulo": "Por dentro", "slug": "currencyservice--por-dentro"}, {"titulo": "Dados", "slug": "currencyservice--dados"}, {"titulo": "Quando falha", "slug": "currencyservice--quando-falha"}, {"titulo": "Infra que usa", "slug": "currencyservice--infra-que-usa"}]}, {"titulo": "shippingservice", "slug": "shippingservice", "subs": [{"titulo": "Expõe", "slug": "shippingservice--expõe"}, {"titulo": "Consome", "slug": "shippingservice--consome"}, {"titulo": "Por dentro", "slug": "shippingservice--por-dentro"}, {"titulo": "Dados", "slug": "shippingservice--dados"}, {"titulo": "Quando falha", "slug": "shippingservice--quando-falha"}, {"titulo": "Infra que usa", "slug": "shippingservice--infra-que-usa"}]}, {"titulo": "checkoutservice", "slug": "checkoutservice", "subs": [{"titulo": "Expõe", "slug": "checkoutservice--expõe"}, {"titulo": "Consome", "slug": "checkoutservice--consome"}, {"titulo": "Por dentro", "slug": "checkoutservice--por-dentro"}, {"titulo": "Dados", "slug": "checkoutservice--dados"}, {"titulo": "Quando falha", "slug": "checkoutservice--quando-falha"}, {"titulo": "Infra que usa", "slug": "checkoutservice--infra-que-usa"}]}, {"titulo": "paymentservice", "slug": "paymentservice", "subs": [{"titulo": "Expõe", "slug": "paymentservice--expõe"}, {"titulo": "Consome", "slug": "paymentservice--consome"}, {"titulo": "Por dentro", "slug": "paymentservice--por-dentro"}, {"titulo": "Dados", "slug": "paymentservice--dados"}, {"titulo": "Quando falha", "slug": "paymentservice--quando-falha"}, {"titulo": "Infra que usa", "slug": "paymentservice--infra-que-usa"}]}, {"titulo": "emailservice", "slug": "emailservice", "subs": [{"titulo": "Expõe", "slug": "emailservice--expõe"}, {"titulo": "Consome", "slug": "emailservice--consome"}, {"titulo": "Por dentro", "slug": "emailservice--por-dentro"}, {"titulo": "Dados", "slug": "emailservice--dados"}, {"titulo": "Quando falha", "slug": "emailservice--quando-falha"}, {"titulo": "Infra que usa", "slug": "emailservice--infra-que-usa"}]}, {"titulo": "recommendationservice", "slug": "recommendationservice", "subs": [{"titulo": "Expõe", "slug": "recommendationservice--expõe"}, {"titulo": "Consome", "slug": "recommendationservice--consome"}, {"titulo": "Por dentro", "slug": "recommendationservice--por-dentro"}, {"titulo": "Dados", "slug": "recommendationservice--dados"}, {"titulo": "Quando falha", "slug": "recommendationservice--quando-falha"}, {"titulo": "Infra que usa", "slug": "recommendationservice--infra-que-usa"}]}, {"titulo": "adservice", "slug": "adservice", "subs": [{"titulo": "Expõe", "slug": "adservice--expõe"}, {"titulo": "Consome", "slug": "adservice--consome"}, {"titulo": "Por dentro", "slug": "adservice--por-dentro"}, {"titulo": "Dados", "slug": "adservice--dados"}, {"titulo": "Quando falha", "slug": "adservice--quando-falha"}, {"titulo": "Infra que usa", "slug": "adservice--infra-que-usa"}]}, {"titulo": "shoppingassistantservice (opcional)", "slug": "shoppingassistantservice-opcional", "subs": [{"titulo": "Expõe", "slug": "shoppingassistantservice-opcional--expõe"}, {"titulo": "Consome", "slug": "shoppingassistantservice-opcional--consome"}, {"titulo": "Por dentro", "slug": "shoppingassistantservice-opcional--por-dentro"}, {"titulo": "Dados", "slug": "shoppingassistantservice-opcional--dados"}, {"titulo": "Quando falha", "slug": "shoppingassistantservice-opcional--quando-falha"}, {"titulo": "Infra que usa", "slug": "shoppingassistantservice-opcional--infra-que-usa"}]}, {"titulo": "loadgenerator", "slug": "loadgenerator", "subs": [{"titulo": "Consome", "slug": "loadgenerator--consome"}, {"titulo": "Por dentro", "slug": "loadgenerator--por-dentro"}, {"titulo": "Infra que usa", "slug": "loadgenerator--infra-que-usa"}]}]}, {"arquivo": "4-jornadas.md", "nome": "Jornadas", "resumo": "a jornada central é a compra: o cliente navega sem login, monta um carrinho e fecha o pedido em uma única chamada síncrona orquestrada pelo `checkoutservice` (cobra, envia e notifica em sequência, sem fila). Há também a navegação/descoberta (home, catálogo, recomendação, anúncio) e, opcionalmente, um assistente de compras com IA. Nenhuma jornada usa um motor de processo — o checkout é orquestrado em código e as demais telas compõem chamadas HTTP/gRPC.", "texto": "# Jornadas: Online Boutique\n\n> **Em resumo:** a jornada central é a compra: o cliente navega sem login, monta um carrinho e\n> fecha o pedido em uma única chamada síncrona orquestrada pelo `checkoutservice` (cobra, envia e\n> notifica em sequência, sem fila). Há também a navegação/descoberta (home, catálogo, recomendação,\n> anúncio) e, opcionalmente, um assistente de compras com IA. Nenhuma jornada usa um motor de\n> processo — o checkout é orquestrado em código e as demais telas compõem chamadas HTTP/gRPC.\n\n## Nesta página\n\n| Seção |\n|---|\n| [Comprar um produto](#comprar-um-produto) |\n| [Navegar e montar o carrinho](#navegar-e-montar-o-carrinho) |\n| [Pedir ajuda ao assistente de compras (opcional)](#pedir-ajuda-ao-assistente-de-compras-opcional) |\n\n## Comprar um produto\n\n**Participantes:** `frontend`, `checkoutservice`, `cartservice`, `productcatalogservice`, `currencyservice`, `shippingservice`, `paymentservice`, `emailservice`, `recommendationservice`\n> **Em resumo:** o cliente preenche endereço e cartão na tela de checkout; uma única chamada\n> gRPC ao `checkoutservice` busca o carrinho, precifica em moeda local, cobra o cartão, despacha o\n> frete, esvazia o carrinho e dispara o email — tudo antes de responder ao navegador.\n\n### Em linguagem de negócio\n| # | 🟨 Quem | 🟦 Faz | 🟧 Acontece | 🟪 Regra ou reação |\n|---|---|---|---|---|\n| 1 | Cliente | Preenche endereço, email e cartão e confirma a compra | Pedido solicitado | Formulário validado no frontend antes de seguir |\n| 2 | Loja | Busca o carrinho do cliente e converte os preços para a moeda escolhida | Preço do pedido calculado | Inclui o frete já convertido |\n| 3 | Loja | Cobra o valor total no cartão informado | Pagamento aprovado *ou* recusado | Só aceita Visa/Mastercard com validade no mês atual ou posterior |\n| 4 | Loja | Despacha o pedido para o endereço informado | Pedido enviado (rastreio gerado) | Só ocorre se o pagamento foi aprovado |\n| 5 | Loja | Esvazia o carrinho e envia o email de confirmação | Pedido confirmado ao cliente | Falha aqui não desfaz a compra |\n\n🟥 Consulte as [dúvidas de contexto na Referência](6-referencia.md#dúvidas-de-contexto).\n\n### Quem orquestra\n`checkoutservice.PlaceOrder` chama, em sequência e de forma síncrona (dentro da mesma requisição\ngRPC recebida do `frontend`): `cartservice`, `productcatalogservice`, `currencyservice`,\n`shippingservice`, `paymentservice`, `cartservice` de novo (esvaziar) e `emailservice`. É uma sequência\norquestrada por código, sem compensação, não por um motor de processo nem por eventos.\n\n### Passo a passo técnico\n```mermaid\nsequenceDiagram\n  participant Cliente\n  participant FE as frontend\n  participant CO as checkoutservice\n  participant CART as cartservice\n  participant PC as productcatalogservice\n  participant CUR as currencyservice\n  participant SHIP as shippingservice\n  participant PAY as paymentservice\n  participant EMAIL as emailservice\n\n  Cliente->>FE: POST /cart/checkout (endereço, email, cartão)\n  FE->>FE: valida formulário\n  FE->>CO: PlaceOrder(user_id, moeda, endereço, email, cartão)\n  CO->>CART: GetCart(user_id)\n  CART-->>CO: itens do carrinho\n  CO->>PC: GetProduct(id) (por item)\n  PC-->>CO: preço em USD\n  CO->>CUR: Convert(preço, moeda do cliente)\n  CUR-->>CO: preço convertido\n  CO->>SHIP: GetQuote(endereço, itens)\n  SHIP-->>CO: custo de frete (USD)\n  CO->>CUR: Convert(frete, moeda do cliente)\n  CUR-->>CO: frete convertido\n  alt cartão válido\n    CO->>PAY: Charge(total, cartão)\n    PAY-->>CO: transaction_id\n    CO->>SHIP: ShipOrder(endereço, itens)\n    SHIP-->>CO: tracking_id\n    CO->>CART: EmptyCart(user_id)\n    CO->>EMAIL: SendOrderConfirmation(email, pedido)\n    CO-->>FE: PlaceOrderResponse (pedido completo)\n    FE-->>Cliente: página \"pedido confirmado\" + recomendações\n  else cartão inválido, vencido ou bandeira não aceita\n    PAY-->>CO: erro (InvalidCreditCard / UnacceptedCreditCard / ExpiredCreditCard)\n    CO-->>FE: erro Internal\n    FE-->>Cliente: HTTP 500 — compra não efetuada, nada foi cobrado\n  else frete falha depois do pagamento aprovado\n    PAY-->>CO: transaction_id (cobrança OK)\n    CO->>SHIP: ShipOrder(...)\n    SHIP-->>CO: erro\n    CO-->>FE: erro Unavailable\n    FE-->>Cliente: HTTP 500 — cliente já foi cobrado, sem estorno automático\n  end\n```\n\nApós a resposta, o `frontend` ainda busca recomendações (`getRecommendations`) para mostrar na tela\nde pedido confirmado — isso é best-effort e não bloqueia a exibição do pedido.\n\n### Regras e dúvidas\nOs limites e exceções desta perspectiva estão consolidados na [Referência](6-referencia.md#regras-de-negócio); consulte também as [dúvidas](6-referencia.md#dúvidas-e-perguntas).\n\n**Fontes:** `src/checkoutservice/main.go` (função `PlaceOrder` e auxiliares),\n`src/frontend/handlers.go` (`placeOrderHandler`), `src/paymentservice/charge.js`,\n`src/shippingservice/quote.go`, `protos/demo.proto`.\n\n---\n\n## Navegar e montar o carrinho\n\n**Participantes:** `frontend`, `productcatalogservice`, `currencyservice`, `cartservice`, `recommendationservice`, `adservice`\n> **Em resumo:** da home ao carrinho, cada tela busca só o que precisa conforme o handler da tela — sem\n> orquestrador, sem estado de sessão no servidor além do cookie `shop_session-id`.\n\n### Em linguagem de negócio\n| # | 🟨 Quem | 🟦 Faz | 🟧 Acontece | 🟪 Regra ou reação |\n|---|---|---|---|---|\n| 1 | Cliente | Abre a loja | Sessão iniciada (cookie gerado) | Sem cadastro nem login |\n| 2 | Cliente | Vê produtos ou entra no detalhe de um item | Produto visualizado | Anúncio e recomendações exibidos como complemento |\n| 3 | Cliente | Adiciona item(s) ao carrinho | Item adicionado ao carrinho | Carrinho é por sessão (`user_id` = id da sessão) |\n| 4 | Cliente | Troca a moeda de exibição | Preços recalculados | Não altera o carrinho, só a exibição |\n\n### Quem orquestra\nNinguém — o `frontend` chama cada serviço dependente diretamente por handler HTTP, sem uma saga.\n\n### Passo a passo técnico\n```mermaid\nsequenceDiagram\n  participant Cliente\n  participant FE as frontend\n  participant PC as productcatalogservice\n  participant CUR as currencyservice\n  participant CART as cartservice\n  participant REC as recommendationservice\n  participant AD as adservice\n\n  Cliente->>FE: GET /\n  FE->>CUR: GetSupportedCurrencies\n  FE->>PC: ListProducts\n  FE->>CART: GetCart(session_id)\n  FE->>CUR: Convert (preço de cada produto)\n  FE-->>Cliente: home renderizada\n\n  Cliente->>FE: GET /product/{id}\n  FE->>PC: GetProduct(id)\n  FE->>REC: ListRecommendations(session_id, [id])\n  FE->>AD: GetAds(categorias) (timeout 100ms)\n  FE-->>Cliente: página do produto\n\n  Cliente->>FE: POST /cart {product_id, quantity}\n  FE->>CART: AddItem(session_id, item)\n  FE-->>Cliente: redireciona para /cart\n```\n\n### Regras e dúvidas\nOs limites e exceções desta perspectiva estão consolidados na [Referência](6-referencia.md#regras-de-negócio); consulte também as [dúvidas](6-referencia.md#dúvidas-e-perguntas).\n\n**Fontes:** `src/frontend/handlers.go` (`homeHandler`, `productHandler`, `addToCartHandler`),\n`src/frontend/rpc.go`.\n\n---\n\n## Pedir ajuda ao assistente de compras (opcional)\n\n**Participantes:** `frontend`, `shoppingassistantservice`\n> **Em resumo:** só existe quando o componente Kustomize `shopping-assistant` está habilitado.\n> Cliente envia uma foto do ambiente; o assistente descreve o estilo com Gemini, busca produtos\n> parecidos por similaridade vetorial e devolve uma recomendação em texto.\n\n### Em linguagem de negócio\n| # | 🟨 Quem | 🟦 Faz | 🟧 Acontece | 🟪 Regra ou reação |\n|---|---|---|---|---|\n| 1 | Cliente | Envia foto do ambiente + pergunta | Pedido de sugestão recebido | Só disponível se `ENABLE_ASSISTANT=true` |\n| 2 | Loja | Descreve o estilo da foto e busca produtos parecidos | Produtos candidatos encontrados | Busca por similaridade, não por regra fixa |\n| 3 | Loja | Monta uma recomendação em texto com até 3 produtos | Sugestão entregue ao cliente | — |\n\n### Quem orquestra\n`shoppingassistantservice` — chama o Gemini duas vezes (descrever imagem, gerar recomendação) e o\nAlloyDB uma vez (busca vetorial), com entrada pelo frontend e sem outro serviço de negócio durante a recomendação.\n\n### Passo a passo técnico\n```mermaid\nsequenceDiagram\n  participant Cliente\n  participant FE as frontend\n  participant SA as shoppingassistantservice\n  participant Gemini\n  participant AlloyDB\n\n  Cliente->>FE: POST /bot {message, image}\n  FE->>SA: POST / (repassa o corpo)\n  SA->>Gemini: descreva o estilo da imagem\n  Gemini-->>SA: descrição do ambiente\n  SA->>AlloyDB: busca por similaridade (descrição + pergunta)\n  AlloyDB-->>SA: produtos candidatos\n  SA->>Gemini: recomende produtos do catálogo com base na descrição\n  Gemini-->>SA: texto com recomendação + ids\n  SA-->>FE: {content}\n  FE-->>Cliente: resposta do assistente\n```\n\n### Regras e dúvidas\nOs limites e exceções desta perspectiva estão consolidados na [Referência](6-referencia.md#regras-de-negócio); consulte também as [dúvidas](6-referencia.md#dúvidas-e-perguntas).\n\n**Fontes:** `src/shoppingassistantservice/shoppingassistantservice.py`,\n`src/frontend/handlers.go` (`chatBotHandler`),\n`kustomize/components/shopping-assistant/README.md`.\n", "secoes": [{"titulo": "Comprar um produto", "slug": "comprar-um-produto", "subs": [{"titulo": "Em linguagem de negócio", "slug": "comprar-um-produto--em-linguagem-de-negócio"}, {"titulo": "Quem orquestra", "slug": "comprar-um-produto--quem-orquestra"}, {"titulo": "Passo a passo técnico", "slug": "comprar-um-produto--passo-a-passo-técnico"}, {"titulo": "Regras e dúvidas", "slug": "comprar-um-produto--regras-e-dúvidas"}]}, {"titulo": "Navegar e montar o carrinho", "slug": "navegar-e-montar-o-carrinho", "subs": [{"titulo": "Em linguagem de negócio", "slug": "navegar-e-montar-o-carrinho--em-linguagem-de-negócio"}, {"titulo": "Quem orquestra", "slug": "navegar-e-montar-o-carrinho--quem-orquestra"}, {"titulo": "Passo a passo técnico", "slug": "navegar-e-montar-o-carrinho--passo-a-passo-técnico"}, {"titulo": "Regras e dúvidas", "slug": "navegar-e-montar-o-carrinho--regras-e-dúvidas"}]}, {"titulo": "Pedir ajuda ao assistente de compras (opcional)", "slug": "pedir-ajuda-ao-assistente-de-compras-opcional", "subs": [{"titulo": "Em linguagem de negócio", "slug": "pedir-ajuda-ao-assistente-de-compras-opcional--em-linguagem-de-negócio"}, {"titulo": "Quem orquestra", "slug": "pedir-ajuda-ao-assistente-de-compras-opcional--quem-orquestra"}, {"titulo": "Passo a passo técnico", "slug": "pedir-ajuda-ao-assistente-de-compras-opcional--passo-a-passo-técnico"}, {"titulo": "Regras e dúvidas", "slug": "pedir-ajuda-ao-assistente-de-compras-opcional--regras-e-dúvidas"}]}]}, {"arquivo": "5-infraestrutura.md", "nome": "Infraestrutura", "resumo": "roda em qualquer cluster Kubernetes (o \"golden path\" é um `kind` local ou GKE Autopilot via Terraform). Cada serviço é um `Deployment` + `Service` ClusterIP simples, sem banco gerenciado por padrão: carrinho fica em um Redis dentro do próprio cluster (`emptyDir`, sem persistência) e catálogo é um arquivo JSON embutido na imagem. Variações (Spanner, AlloyDB, Memorystore, Istio, políticas de rede) existem como componentes opcionais do Kustomize, nunca ligados por padrão — é uma regra de produto do repositório (ver `docs/product-requirements.md`).", "texto": "# Infraestrutura: Online Boutique\n\n> **Em resumo:** roda em qualquer cluster Kubernetes (o \"golden path\" é um `kind` local ou GKE\n> Autopilot via Terraform). Cada serviço é um `Deployment` + `Service` ClusterIP simples, sem\n> banco gerenciado por padrão: carrinho fica em um Redis dentro do próprio cluster (`emptyDir`,\n> sem persistência) e catálogo é um arquivo JSON embutido na imagem. Variações (Spanner, AlloyDB,\n> Memorystore, Istio, políticas de rede) existem como componentes opcionais do Kustomize, nunca\n> ligados por padrão — é uma regra de produto do repositório (ver `docs/product-requirements.md`).\n\n## Nesta página\n\n| Seção |\n|---|\n| [Ambientes](#ambientes) |\n| [Recursos](#recursos) |\n| [Implantação](#implantação) |\n\n## Ambientes\n\n| Ambiente | Como sobe | Diferença |\n|---|---|---|\n| Local (dev) | `skaffold dev` (`skaffold.yaml`) ou `kubectl apply -f release/kubernetes-manifests.yaml` em `kind`/minikube | Sem tracing/profiler; imagens buildadas localmente |\n| GKE (quickstart oficial) | `gcloud container clusters create-auto` + `kubectl apply -f release/kubernetes-manifests.yaml` | Cluster Autopilot; manifests padrão do diretório `kubernetes-manifests/` |\n| GKE via Terraform | `terraform/main.tf` cria o cluster Autopilot e aplica `kubectl apply -k <filepath_manifest>` | Provisiona cluster + habilita APIs do Google Cloud (`container`, `monitoring`, `cloudtrace`, `cloudprofiler`, `redis` se `memorystore=true`) |\n| Variações (Kustomize) | `kustomize/components/*` combinados via `kustomize/kustomization.yaml` | Ver tabela de componentes abaixo |\n| Cloud Build | `cloudbuild.yaml` | Build e push das imagens de cada serviço em CI *(a confirmar: qual gatilho aciona)* |\n\n**Componentes Kustomize disponíveis** (opt-in, nunca no default): `alloydb`, `spanner`, `memorystore`\n(bancos gerenciados para o `cartservice`/`productcatalogservice` no lugar do Redis/arquivo local),\n`service-mesh-istio` (Istio/Cloud Service Mesh + `istio-manifests/`), `network-policies`\n(`NetworkPolicy` por Deployment), `non-public-frontend` (remove o LoadBalancer público),\n`single-shared-session`, `google-cloud-operations` (tracing/profiling), `shopping-assistant`\n(adiciona o `shoppingassistantservice`, ver `4-jornadas.md`), `cymbal-branding`,\n`custom-base-url`, `container-images-registry/tag/tag-suffix`, `without-loadgenerator`.\n\nHá também um `helm-chart/` equivalente aos manifests base, para quem prefere Helm.\n\n## Recursos\n\n| Recurso | Tipo | Tecnologia | Quem usa | Definido em |\n|---|---|---|---|---|\n| `frontend` | Deployment + Service (ClusterIP) + Service `frontend-external` (LoadBalancer) | Go, container porta 8080 | Ponto de entrada do site | `kubernetes-manifests/frontend.yaml` |\n| `cartservice` | Deployment + Service | C#/.NET, gRPC porta 7070 | Carrinho | `kubernetes-manifests/cartservice.yaml` |\n| `redis-cart` | Deployment + Service | `redis:alpine`, porta 6379, volume `emptyDir` (efêmero) | `cartservice` | `kubernetes-manifests/cartservice.yaml` |\n| `productcatalogservice` | Deployment + Service | Go, gRPC porta 3550 | Catálogo | `kubernetes-manifests/productcatalogservice.yaml` |\n| `currencyservice` | Deployment + Service | Node.js, gRPC porta 7000 | Conversão de moeda | `kubernetes-manifests/currencyservice.yaml` |\n| `paymentservice` | Deployment + Service | Node.js, gRPC porta 50051 | Cobrança (mock) | `kubernetes-manifests/paymentservice.yaml` |\n| `shippingservice` | Deployment + Service | Go, gRPC porta 50051 | Frete (mock) | `kubernetes-manifests/shippingservice.yaml` |\n| `emailservice` | Deployment + Service (porta serviço 5000 → container 8080) | Python, gRPC | Email de confirmação (mock) | `kubernetes-manifests/emailservice.yaml` |\n| `checkoutservice` | Deployment + Service | Go, gRPC porta 5050 | Orquestra a compra | `kubernetes-manifests/checkoutservice.yaml` |\n| `recommendationservice` | Deployment + Service | Python, gRPC porta 8080 | Recomendações | `kubernetes-manifests/recommendationservice.yaml` |\n| `adservice` | Deployment + Service | Java, gRPC porta 9555 | Anúncios contextuais | `kubernetes-manifests/adservice.yaml` |\n| `loadgenerator` | Deployment (sem Service) | Python/Locust | Gera tráfego sintético contra `frontend` | `kubernetes-manifests/loadgenerator.yaml` |\n| `shoppingassistantservice` *(opcional)* | Deployment + Service, HTTP porta 8080 | Python/Flask + Gemini (`langchain_google_genai`) + AlloyDB (RAG) | `frontend` (rota `/bot`) quando `ENABLE_ASSISTANT=true` | `kustomize/components/shopping-assistant/shoppingassistantservice.yaml` |\n| GKE Autopilot cluster | `google_container_cluster` | GKE | Todo o domínio | `terraform/main.tf` |\n| APIs do Google Cloud | `module.enable_google_apis` | `container`, `monitoring`, `cloudtrace`, `cloudprofiler`, (+`redis` se Memorystore) | Observabilidade/infra | `terraform/main.tf` |\n\nTodos os serviços rodam com `runAsNonRoot`, `readOnlyRootFilesystem` (exceto o\n`shoppingassistantservice`) e sem `allowPrivilegeEscalation` — postura de segurança padrão do\nrepositório, não específica de um serviço.\n\nRequests/limits de CPU e memória são pequenos (na casa de 100–300m CPU e 64–450Mi memória),\nconsistente com o objetivo de demo leve (`docs/purpose.md`), não com uma carga de produção real\n*(a confirmar)*.\n\n## Implantação\n\n```mermaid\nflowchart TB\n  subgraph cluster[\"Cluster Kubernetes (kind local ou GKE Autopilot)\"]\n    FE[frontend :8080] \n    EXT[\"frontend-external (LoadBalancer)\"] --> FE\n    LG[loadgenerator] -->|HTTP interno frontend:80| FE\n    FE --> CART[cartservice :7070]\n    CART --> REDIS[(redis-cart :6379\\nemptyDir)]\n    FE --> PC[productcatalogservice :3550]\n    FE --> CUR[currencyservice :7000]\n    FE --> REC[recommendationservice :8080]\n    REC --> PC\n    FE --> SHIP[shippingservice :50051]\n    FE --> AD[adservice :9555]\n    FE --> CO[checkoutservice :5050]\n    CO --> CART\n    CO --> PC\n    CO --> CUR\n    CO --> SHIP\n    CO --> PAY[paymentservice :50051]\n    CO --> EMAIL[emailservice :5000]\n  end\n```\n\nVariação com assistente de compras (componente `shopping-assistant`, requer AlloyDB + Gemini fora do cluster):\n\n```mermaid\nflowchart LR\n  FE[frontend] -->|HTTP POST /bot| SA[shoppingassistantservice :8080]\n  SA -->|RAG| ALLOYDB[(AlloyDB\\nvetores de produtos)]\n  SA -->|API| GEMINI[[Gemini - Google AI]]\n```\n\n**Fontes:** `kubernetes-manifests/*.yaml` (Deployments/Services/env/probes/resources lidos\nliteralmente), `terraform/main.tf` e `terraform/variables.tf`, `kustomize/kustomization.yaml` e\n`kustomize/components/*/README.md`, `docs/product-requirements.md`, `helm-chart/` (equivalente,\nnão detalhado por página própria), `skaffold.yaml` e `cloudbuild.yaml` (citados, não aprofundados).\nO gatilho exato do Cloud Build e o dimensionamento para carga real de produção ficam *(a confirmar)*.\n", "secoes": [{"titulo": "Ambientes", "slug": "ambientes", "subs": []}, {"titulo": "Recursos", "slug": "recursos", "subs": []}, {"titulo": "Implantação", "slug": "implantação", "subs": []}]}, {"arquivo": "6-referencia.md", "nome": "Referência", "resumo": "glossário, regras e decisões consolidadas das outras páginas, mais um guia rápido para rodar o projeto localmente e uma lista de dúvidas por papel — a maior parte delas existe porque este é um repositório de demonstração técnica (não um produto com donos de negócio declarados), então informações de negócio muitas vezes precisam ser confirmadas com quem mantém o repositório.", "texto": "# Referência: Online Boutique\n\n> **Em resumo:** glossário, regras e decisões consolidadas das outras páginas, mais um guia rápido\n> para rodar o projeto localmente e uma lista de dúvidas por papel — a maior parte delas existe\n> porque este é um repositório de demonstração técnica (não um produto com donos de negócio\n> declarados), então informações de negócio muitas vezes precisam ser confirmadas com quem mantém\n> o repositório.\n\n## Nesta página\n\n| Seção |\n|---|\n| [Glossário](#glossário) |\n| [Regras de negócio](#regras-de-negócio) |\n| [Decisões](#decisões) |\n| [Padrões](#padrões) |\n| [Como começar](#como-começar) |\n| [Dúvidas e perguntas](#dúvidas-e-perguntas) |\n| [Dúvidas de contexto](#dúvidas-de-contexto) |\n| [Perguntas para decisão](#perguntas-para-decisão) |\n| [Evidências da revisão v3](#evidências-da-revisão-v3) |\n\n## Glossário\n| Termo | Definição |\n|---|---|\n| `user_id` / sessão | Identificador do cliente, gerado como cookie `shop_session-id`, sem cadastro |\n| `Money` | Tipo comum (`currency_code`, `units`, `nanos`) usado em todo o `.proto` para valores monetários |\n| `OrderResult` | Estrutura devolvida pelo checkout: id do pedido, rastreio, frete, endereço e itens |\n| `ExtraLatency` | Atraso artificial configurável no `productcatalogservice`, usado para demonstrar observabilidade |\n| Componente Kustomize | Pedaço opcional de configuração (`kustomize/components/*`) que soma-se ao deploy padrão |\n| BOAT | Categoria de motor de processo de negócio (Camunda, Pega, Appian...) — **não usada** neste domínio |\n| Golden user journey | Termo do próprio repositório (`docs/product-requirements.md`) para a jornada mínima que sempre precisa funcionar: visitar, adicionar ao carrinho, checkout pré-preenchido, concluir |\n| Carrinho | Lista de produtos e quantidades que um cliente pretende comprar, associada à sessão |\n| Pedido | O resultado de uma compra concluída: itens, frete, endereço e rastreio — existe só na resposta, não é guardado |\n| Cotação de frete | Valor estimado de envio, calculado antes da compra ser confirmada |\n| Moeda de exibição | A moeda em que os preços aparecem para o cliente, independente da moeda de cobrança |\n| Recomendação | Produtos sugeridos ao cliente, sorteados entre os que não estão no carrinho |\n\n## Regras de negócio\n| ID | Regra | Valor atual | Onde está implementada |\n|---|---|---|---|\n| R01 | Bandeiras de cartão aceitas | Visa e Mastercard | `src/paymentservice/charge.js` |\n| R02 | Cartão vencido é recusado | Validade ≥ mês/ano atual (o mês atual é aceito) | `src/paymentservice/charge.js` |\n| R03 | Custo de frete | US$ 8.99 fixo (US$ 0 se carrinho vazio) | `src/shippingservice/quote.go` |\n| R04 | Timeout de anúncio | 100 ms | `src/frontend/rpc.go` (`getAd`) |\n| R05 | Máximo de recomendações mostradas | 4 (na home/produto) / 5 (retornadas pelo serviço) | `src/frontend/rpc.go` / `src/recommendationservice/recommendation_server.py` |\n| R06 | Máximo de anúncios por resposta | 2 | `src/adservice/.../AdService.java` (`MAX_ADS_TO_SERVE`) |\n| R07 | Falha ao esvaziar carrinho ou enviar email | Não bloqueia o pedido (apenas logada) | `src/checkoutservice/main.go` (`PlaceOrder`, após envio) |\n| R08 | Identidade do cliente | Um cookie de sessão — não existe conta nem senha | `src/frontend/middleware.go` (`shop_session-id`) |\n\n## Decisões\nNenhum ADR formal foi encontrado (`docs/adr` ou `decisions/` não existem no repositório). As\ndecisões abaixo foram **reconstruídas** a partir do código e da documentação existente:\n\n| Contexto | Escolha | Consequência |\n|---|---|---|\n| Preservar a \"golden user journey\" para iniciantes em Kubernetes (`docs/product-requirements.md`) | Nenhuma integração gerenciada (banco externo, service mesh, IA) entra no deploy padrão | Tudo isso vira componente opcional do Kustomize, nunca ligado por padrão |\n| Um único contrato gRPC compartilhado (`protos/demo.proto`) | Todos os serviços geram seu client/server a partir do mesmo `.proto` (`genproto.sh` em cada serviço) | Contrato compartilhado reduz divergências, mas qualquer mudança no `.proto` exige regenerar código em todas as linguagens |\n| Serviços mock para pagamento, frete e email | Sem integração externa real nesses três | Domínio 100% autocontido, seguro para rodar em qualquer lugar sem custo/risco externo |\n| Checkout orquestrado em código, não em eventos | `checkoutservice.PlaceOrder` faz tudo em uma chamada síncrona | Simples de entender e depurar; sem compensação automática se um passo falhar depois de outro ter sucedido |\n\n## Padrões\n- **Um serviço por linguagem \"canônica\" da tecnologia que demonstra**: Go para serviços simples,\n  Node.js para os dois de I/O leve (`currencyservice`, `paymentservice`), Python para os que usam\n  bibliotecas de ML/IA (`recommendationservice`, `emailservice`, `shoppingassistantservice`), C#\n  para `cartservice`, Java para `adservice` — decisão pedagógica do repositório, não técnica\n  *(a confirmar)*.\n- **Health check gRPC padrão** (`grpc.health.v1`) em todos os serviços gRPC, usado pelas probes do\n  Kubernetes.\n- **Toggle por variável de ambiente** para tracing/profiler (`ENABLE_TRACING`, `DISABLE_PROFILER`)\n  em quase todos os serviços.\n- **Guia oficial para adicionar um serviço novo**: `docs/adding-new-microservice.md` (não lido em\n  detalhe nesta rodada — consultar diretamente antes de propor um serviço novo).\n\n## Como começar\n- **Rodar localmente:** `skaffold dev` (usa `skaffold.yaml`) sobre um cluster local (`kind`/\n  minikube) ou `kubectl apply -f release/kubernetes-manifests.yaml` num cluster já existente. Guia\n  completo em `docs/development-guide.md` e `docs/cloudshell-tutorial.md`.\n- **Testes:** cada serviço tem os seus (ex.: `product_catalog_test.go`,\n  `shippingservice_test.go`) — rodar com a ferramenta nativa da linguagem (`go test`, etc.); não há\n  um runner único para todo o domínio *(a confirmar)*.\n- **Onde fica cada coisa:**\n  - Contrato entre serviços: `protos/demo.proto`\n  - Código de cada serviço: `src/<nome-do-serviço>/`\n  - Deploy padrão: `kubernetes-manifests/`\n  - Variações de deploy: `kustomize/components/*`\n  - Terraform (cluster GKE): `terraform/`\n  - Documentação do próprio repositório: `docs/`\n- **As 3 mudanças mais comuns** (dedução a partir da estrutura do repo, não de um histórico de\n  commits analisado):\n  1. Alterar um serviço existente → mudar o código em `src/<serviço>/`, regenerar proto se o\n     contrato mudou (`genproto.sh` de cada serviço), atualizar o `Deployment` correspondente em\n     `kubernetes-manifests/` se a env/porta mudar.\n  2. Adicionar um serviço novo → seguir `docs/adding-new-microservice.md`.\n  3. Adicionar uma variação de infraestrutura → criar um novo componente em\n     `kustomize/components/`, com seu próprio `README.md`, seguindo o padrão dos existentes.\n- **Como publicar:** `cloudbuild.yaml` builda e publica as imagens; `release/` guarda os manifests\n  \"prontos\" para consumo direto (`release/kubernetes-manifests.yaml`) — o gatilho exato de CI/CD\n  não foi confirmado nesta rodada.\n\n## Dúvidas e perguntas\n\n**Conflitos entre fontes:**\n- `README.md` do repositório diz que o `currencyservice` \"usa valores reais buscados do Banco\n  Central Europeu\"; o código (`src/currencyservice/server.js` + `data/currency_conversion.json`)\n  lê uma tabela estática embutida na imagem, sem chamada externa. Registrado também em\n  `3-servicos.md` e `2-arquitetura.md`.\n\n**Segredos (só localização, nenhum valor copiado):**\n- `kustomize/components/shopping-assistant/shoppingassistantservice.yaml` linha ~51: variável\n  `GOOGLE_API_KEY` com valor placeholder `GOOGLE_API_KEY_VAL` — precisa ser preenchida por quem\n  fizer o deploy desse componente; não é uma chave real vazada, mas fica registrado o local.\n- `src/cartservice/src/cartstore/AlloyDBCartStore.cs` e\n  `src/shoppingassistantservice/shoppingassistantservice.py`: senha do AlloyDB é buscada em tempo\n  de execução via Google Secret Manager (`ALLOYDB_SECRET_NAME`), nunca aparece em texto no\n  repositório.\n\nAs questões por papel estão reunidas em [Perguntas para decisão](#perguntas-para-decisão).\n\n**Fontes:** todas as páginas anteriores deste domínio; `.github/CODEOWNERS`;\n`docs/adding-new-microservice.md`, `docs/development-guide.md`, `docs/cloudshell-tutorial.md`\n(citados, não lidos por completo nesta rodada).\n\n## Dúvidas de contexto\n\nA política de compensação e a persistência do pedido aguardam decisão (Q04/Q06). A function parede(table){
  const ths = [...table.querySelectorAll('th')].map(t => t.textContent);
  if (!ths.some(t => t.includes('🟧'))) return;
  const idx = k => ths.findIndex(t => t.includes(k));
  const cols = {ator: idx('🟨'), cmd: idx('🟦'), evt: idx('🟧'), pol: idx('🟪')};
  const w = document.createElement('div'); w.className = 'wall';
  [...table.querySelectorAll('tbody tr')].forEach((tr, i) => {
    const td = [...tr.children].map(c => c.innerHTML);
    let h = `<div class="step"><div class="num">${i+1}</div>`;
    for (const [k, j] of Object.entries(cols)) if (j >= 0 && td[j] && td[j].replace(/<[^>]+>/g,'').trim() && td[j].trim() !== '—') h += `<div class="note ${k}">${td[j]}</div>`;
    w.innerHTML += h + '</div>';
  });
  const leg = document.createElement('div'); leg.className = 'legend';
  leg.innerHTML = '<span style="--c:#FFE9A8">Quem</span><span style="--c:#B9D3FF">Faz</span><span style="--c:#FFB36B">Acontece</span><span style="--c:#DCC4F7">Regra ou reação</span>';
  table.replaceWith(leg); leg.after(w);
}

  if (ancora) partes.push(a.textContent.trim());
  document.getElementById('trilha').textContent = partes.join('  ›  ');
}
let obs;
function observar(){
  if (obs) obs.disconnect();
  obs = new IntersectionObserver(es => { const vis = es.filter(e => e.isIntersecting); if (vis.length) marcar(atual, vis[0].target.dataset.anchor); }, {rootMargin:'0px 0px -75% 0px'});
  document.querySelectorAll('#doc h2, #doc h3').forEach(h => obs.observe(h));
}
document.getElementById('q').oninput = e => {
  const f = e.target.value.toLowerCase().trim();
  document.querySelectorAll('#arvore [data-busca]').forEach(el => { const ok = !f || el.dataset.busca.includes(f); el.style.display = ok ? '' : 'none'; if (f && ok && el.tagName === 'DETAILS') el.open = true; });
  document.querySelectorAll('#arvore .nivel3 a.no').forEach(a => { if (f) { const ok = a.textContent.toLowerCase().includes(f) || a.closest('details').dataset.busca.split(' ')[0].includes(f); a.style.display = ok || a.closest('details').dataset.busca.includes(f) ? '' : 'none'; } else a.style.display = ''; });
  if (f) document.querySelectorAll('details.pag').forEach(d => d.open = !![...d.querySelectorAll('[data-busca]')].some(x => x.style.display !== 'none'));
};
function abrirHash(){
  const [file, anchor] = location.hash.slice(1).split('#');
  const decoded = decodeURIComponent(file || '');
  mostrar(D.paginas.some(p => p.arquivo === decoded) ? decoded : D.paginas[0].arquivo, anchor ? decodeURIComponent(anchor) : null);
}
aplicaTema(); arvore(); abrirHash(); window.addEventListener('hashchange', abrirHash);
