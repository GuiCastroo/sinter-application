const F = {"dominio-online-boutique/README.md": "---\nid: dom-online-boutique\nkind: domain\nsubject: domain:online-boutique\ncamada: 2\nstatus: proposed\nrealiza: []\nrealizado-por: [sub-catalogo-e-descoberta, sub-carrinho-e-sessao, sub-checkout-e-pagamento, sub-assistente-de-compras]\nprovenance:\n  - source: repo:microservices-demo\n    locator: README.md#L1-L30\n    version: 38e7348\n    extraction: extracted\n  - source: repo:microservices-demo\n    locator: src/#L1-L14\n    version: 38e7348\n    extraction: extracted\n---\n\n# Domínio Online Boutique\n\nLoja de e-commerce cloud-native de demonstração (Google Cloud): o cliente navega por um catálogo de produtos, monta um carrinho, informa endereço e cartão de crédito e finaliza uma compra. O domínio cobre a jornada completa de compra self-service, sem necessidade de login/cadastro. `[extracted, README.md#L15-L18]`\n\n## Fronteiras\n\n- **Dentro:** catálogo de produtos, carrinho de compras, conversão de moeda, cotação e execução de frete (mock), cobrança de cartão (mock), envio de confirmação por e-mail (mock), recomendações e anúncios contextuais, assistente de compras conversacional (opcional, baseado em IA generativa).\n- **Fora:** gestão de estoque/fulfillment real, autenticação/identidade de cliente (não existe login), gateway de pagamento real (o `paymentservice` é um mock que não se conecta a nenhuma adquirente), CRM, backoffice financeiro/contábil. `[inferred — não há nenhum sistema desse tipo no repositório]`\n- Todo o domínio roda em um único cluster Kubernetes; não há integração de saída documentada com sistemas de negócio externos (ERP, adquirente de cartão, transportadora real). `[extracted — ausência de clientes HTTP/SDK externos fora do próprio cluster nos 12 serviços]`\n\n## Dono\n\nNão identificado no repositório (não há `CODEOWNERS` nem seção de propriedade por serviço). `[a confirmar com o PM/tech lead]`\n\n## Subdomínios\n\n| Subdomínio | Responsabilidade | Sistemas |\n|---|---|---|\n| [Catálogo e Descoberta](./subdominios/catalogo-e-descoberta.md) | Expor produtos, buscar, recomendar e anunciar | productcatalogservice, recommendationservice, adservice |\n| [Carrinho e Sessão](./subdominios/carrinho-e-sessao.md) | Identificar o visitante e manter o carrinho entre requisições | frontend (sessão), cartservice |\n| [Checkout e Pagamento](./subdominios/checkout-e-pagamento.md) | Converter moeda, cobrar, expedir e confirmar o pedido | checkoutservice, paymentservice, shippingservice, emailservice, currencyservice |\n| [Assistente de Compras](./subdominios/assistente-de-compras.md) | Responder perguntas do cliente sobre o catálogo usando IA generativa (recurso opcional) | shoppingassistantservice |\n\nO `frontend` participa de todos os subdomínios como porta de entrada HTTP; está descrito com detalhe em [sistemas/frontend](./sistemas/frontend/ficha.md).\n\n## Contexto\n\n```mermaid\nflowchart LR\n  Cliente((Cliente via navegador))\n  LoadGen[loadgenerator - tráfego sintético]\n  Frontend[[frontend]]\n  Domínio{{Domínio Online Boutique}}\n\n  Cliente -->|HTTP| Frontend\n  LoadGen -->|HTTP, simula usuários| Frontend\n  Frontend --- Domínio\n\n  Domínio -->|E-mail mock, não envia de verdade| EmailExterno[(Provedor de e-mail)]\n  Domínio -->|Cotação ECB mock, taxas fixas embutidas| TaxasExternas[(Fonte de câmbio)]\n  Domínio -->|Charge mock, não liquida de verdade| Adquirente[(Adquirente de cartão)]\n  Domínio -.->|opcional: Gemini + AlloyDB| IA[(Google AI / Vertex)]\n```\n`[extracted, arquitetura sincrona confirmada em src/*/main.* — nenhum serviço externo é chamado de fato; \"e-mail\", \"câmbio\" e \"adquirente\" são simulados em memória — ver componentes de emailservice, currencyservice e paymentservice]`\n\n## Eventos de domínio\n\nNão há mensageria assíncrona (fila, tópico ou barramento de eventos) neste domínio: toda comunicação entre sistemas é síncrona via gRPC. Ver [eventos/README.md](./eventos/README.md) para a evidência completa. `[extracted]`\n\n## Como ler este repositório\n\n- Comunicação entre serviços (gRPC, quem chama quem): ver [subdominios/](./subdominios/) e as fichas em [sistemas/*/ficha.md](./sistemas/) (seções \"Expõe\"/\"Consome\"), com o contrato completo em [sistemas/contrato-grpc-hipstershop.md](./sistemas/contrato-grpc-hipstershop.md).\n- Infraestrutura Kubernetes: ver [infraestrutura/](./infraestrutura/).\n- Fluxo de compra passo a passo: ver [fluxos/compra-do-cliente.md](./fluxos/compra-do-cliente.md) (visão de negócio) e [fluxos/compra-do-cliente.sequencia.md](./fluxos/compra-do-cliente.sequencia.md) (sequência técnica completa).\n- Relatório de cobertura, conflitos e perguntas em aberto: [RELATORIO.md](./RELATORIO.md).\n", "dominio-online-boutique/capacidades/assistir-compra-com-ia.md": "---\nid: cap-assistir-compra-com-ia\nkind: capability\nsubject: capability:assistir-compra-com-ia\ncamada: 1\nstatus: proposed\nrealiza: []\nrealizado-por: [sub-assistente-de-compras]\nprovenance:\n  - source: repo:microservices-demo\n    locator: src/shoppingassistantservice/shoppingassistantservice.py#L1-L60\n    version: 38e7348\n    extraction: inferred\n  - source: repo:microservices-demo\n    locator: kustomize/components/shopping-assistant/kustomization.yaml#L1-L30\n    version: 38e7348\n    extraction: extracted\n---\n\n# Assistir a compra com IA (recurso opcional)\n\nA empresa pode oferecer um assistente conversacional que sugere produtos do catálogo a partir de uma pergunta em linguagem natural do cliente (ex.: \"o que você recomenda para decorar minha sala?\"). É um recurso opt-in: só existe quando o componente `kustomize/components/shopping-assistant` é aplicado e a env `ENABLE_ASSISTANT=true` está ligada no frontend. `[extracted — flag e componente kustomize condicionais; a natureza \"capacidade de negócio\" é inferred]`\n\n## Fluxos que a realizam\n- Sem fluxo macro dedicado documentado; tecnicamente é uma chamada HTTP isolada `frontend → shoppingassistantservice` (ver [ficha do sistema](../sistemas/shoppingassistantservice/ficha.md)).\n\n## Sistemas envolvidos\n- frontend — endpoint `/bot` e página `/assistant`, habilitados por flag\n- shoppingassistantservice — busca por similaridade vetorial no catálogo (AlloyDB) e gera a resposta com um modelo Gemini (`ChatGoogleGenerativeAI`)\n", "dominio-online-boutique/capacidades/descobrir-e-recomendar-produtos.md": "---\nid: cap-descobrir-e-recomendar-produtos\nkind: capability\nsubject: capability:descobrir-e-recomendar-produtos\ncamada: 1\nstatus: proposed\nrealiza: []\nrealizado-por: [sub-catalogo-e-descoberta]\nprovenance:\n  - source: repo:microservices-demo\n    locator: src/recommendationservice/recommendation_server.py#L70-L86\n    version: 38e7348\n    extraction: inferred\n---\n\n# Descobrir e recomendar produtos\n\nA empresa consegue guiar o cliente até produtos relevantes: por navegação/busca no catálogo, por recomendações associadas ao que já está no carrinho e por anúncios contextuais nas páginas. `[inferred]`\n\n## Fluxos que a realizam\n- Sem fluxo macro dedicado hoje — a descoberta ocorre embutida na navegação e é reforçada na etapa de confirmação do pedido, dentro de [Compra do cliente](../fluxos/compra-do-cliente.md).\n\n## Sistemas envolvidos\n- productcatalogservice — lista e busca produtos\n- recommendationservice — recomenda produtos a partir do carrinho atual (hoje: seleção aleatória entre os demais produtos, não personalização real — ver [regra](../regras-de-negocio/recomendacao-nao-e-personalizada.md))\n- adservice — anúncios por categoria/contexto\n", "dominio-online-boutique/capacidades/vender-produtos-online.md": "---\nid: cap-vender-produtos-online\nkind: capability\nsubject: capability:vender-produtos-online\ncamada: 1\nstatus: proposed\nrealiza: []\nrealizado-por: [sub-catalogo-e-descoberta, sub-carrinho-e-sessao, sub-checkout-e-pagamento]\nprovenance:\n  - source: repo:microservices-demo\n    locator: README.md#L15-L18\n    version: 38e7348\n    extraction: inferred\n---\n\n# Vender produtos online\n\nA empresa consegue vender produtos diretamente ao consumidor final por um site self-service, sem exigir cadastro: o visitante navega, monta um carrinho, escolhe a moeda de exibição, informa endereço e cartão e recebe a confirmação do pedido. `[inferred a partir do comportamento observado no frontend e no checkoutservice — confirmar com o PM se esta é a capacidade de negócio como a empresa a nomeia]`\n\n## Fluxos que a realizam\n- [Compra do cliente](../fluxos/compra-do-cliente.md)\n\n## Sistemas envolvidos\n- frontend — vitrine, sessão do visitante e formulário de checkout\n- productcatalogservice — catálogo de produtos\n- cartservice — carrinho de compras\n- currencyservice — conversão de preços para a moeda escolhida\n- checkoutservice — orquestra a finalização do pedido\n- paymentservice — cobrança (mock)\n- shippingservice — cotação e expedição (mock)\n- emailservice — confirmação por e-mail (mock)\n", "dominio-online-boutique/eventos/README.md": "---\nid: dom-online-boutique-eventos\nkind: domain\nsubject: domain:online-boutique:eventos\ncamada: 2\nstatus: proposed\nrealiza: [dom-online-boutique]\nrealizado-por: []\nprovenance:\n  - source: repo:microservices-demo\n    locator: \"grep -ril 'kafka|pubsub|rabbitmq|amqp|sqs|sns' src/ --include=*.go --include=*.py --include=*.js --include=*.cs --include=*.java (sem resultados)\"\n    version: 38e7348\n    extraction: extracted\n  - source: repo:microservices-demo\n    locator: protos/demo.proto#L1-L263\n    version: 38e7348\n    extraction: extracted\n---\n\n# Eventos de domínio\n\nEste domínio **não publica nem consome eventos assíncronos**. Foi buscado por bibliotecas e padrões de mensageria (Kafka, Pub/Sub, RabbitMQ/AMQP, SQS, SNS) em todo o código-fonte dos 12 serviços e não foi encontrado nenhum produtor ou consumidor — apenas menções incidentais em `go.sum`/`package-lock.json` (dependências transitivas de bibliotecas de nuvem, não usadas para mensageria). `[extracted]`\n\nToda a integração entre sistemas é **síncrona, ponto a ponto, via gRPC**, definida em um único arquivo de contrato: [`protos/demo.proto`](../sistemas/contrato-grpc-hipstershop.md). Não existe, portanto, tabela de \"Evento | Produtor | Consumidores | Contrato\" para preencher — cada chamada é uma requisição-resposta RPC documentada na ficha de cada sistema (seções \"Expõe\"/\"Consome\") e nas sequências em [fluxos/](../fluxos/).\n\n## Implicação para o negócio\n\nComo não há barramento de eventos, não existe hoje um jeito de outro sistema (ex.: um ERP, um data warehouse) \"escutar\" pedidos concluídos sem chamar diretamente o `checkoutservice` ou fazer polling. Isso é uma limitação arquitetural a registrar caso o domínio precise notificar sistemas externos no futuro. `[inferred]`\n", "dominio-online-boutique/fluxos/compra-do-cliente.md": "---\nid: flow-compra-do-cliente\nkind: flow\nsubject: flow:compra-do-cliente\ncamada: 1\nstatus: proposed\nrealiza: [cap-vender-produtos-online]\nrealizado-por: [flow-compra-do-cliente-sequencia]\nprovenance:\n  - source: repo:microservices-demo\n    locator: src/frontend/handlers.go#L59-L575\n    version: 38e7348\n    extraction: inferred\n  - source: repo:microservices-demo\n    locator: src/loadgenerator/locustfile.py#L1-L90\n    version: 38e7348\n    extraction: extracted\n---\n\n# Compra do cliente\n\nObjetivo: permitir que um visitante, sem se cadastrar, transforme o interesse em produtos em um pedido pago, com frete cotado e e-mail de confirmação — do primeiro clique na loja até a tela de \"pedido confirmado\". `[inferred a partir do comportamento do frontend/checkoutservice; a intenção de negócio deve ser validada com o PM]`\n\n## Atores\n\n- **Cliente** — visitante da loja; não se autentica, é identificado por um cookie de sessão gerado automaticamente. `[extracted, src/frontend/middleware.go#L87-L107]`\n- **Loja** — o conjunto de sistemas do domínio, tratado aqui como um único ator de negócio (o detalhe de quem-fala-com-quem está na sequência técnica).\n- **Tráfego de teste** — o `loadgenerator` simula este mesmo fluxo automaticamente em ambientes de carga/demo, seguindo os mesmos passos de um cliente real. `[extracted, src/loadgenerator/locustfile.py#L44-L86]`\n\n## Etapas\n\n| # | Etapa | Ator | Decisão ou resultado | Técnica |\n|---|---|---|---|---|\n| 1 | Entra na loja e recebe uma sessão | Cliente | Cookie de sessão é criado se não existir | [passo 1](./compra-do-cliente.sequencia.md#passo-1-entrada-e-sessão) |\n| 2 | Navega a vitrine e abre produtos | Cliente | Vê preço já convertido para a moeda escolhida | [passo 2](./compra-do-cliente.sequencia.md#passo-2-vitrine-e-preço) |\n| 3 | Adiciona um ou mais produtos ao carrinho | Cliente | Carrinho persistido, associado à sessão | [passo 3](./compra-do-cliente.sequencia.md#passo-3-adicionar-ao-carrinho) |\n| 4 | Revisa o carrinho | Cliente | Vê itens, preços convertidos e recomendações relacionadas | [passo 4](./compra-do-cliente.sequencia.md#passo-4-revisar-carrinho) |\n| 5 | Preenche endereço de entrega e dados do cartão e confirma | Cliente | Formulário validado no frontend antes de seguir | [passo 5](./compra-do-cliente.sequencia.md#passo-5-envio-do-formulário-de-checkout) |\n| 6 | Loja monta o pedido a partir do carrinho | Loja | Busca cada item no catálogo e converte cada preço para a moeda do cliente | [passo 6](./compra-do-cliente.sequencia.md#passo-6-montagem-do-pedido) |\n| 7 | Loja cota e converte o frete | Loja | Cotação calculada e convertida para a moeda do cliente | [passo 7](./compra-do-cliente.sequencia.md#passo-7-cotação-de-frete) |\n| 8 | Loja cobra o cartão | Loja | **Se a cobrança falhar (cartão inválido, bandeira não aceita ou vencido) o pedido inteiro falha aqui** — não há oferecer outro meio de pagamento nesta versão | [passo 8](./compra-do-cliente.sequencia.md#passo-8-cobrança) |\n| 9 | Loja expede o pedido | Loja | Gera código de rastreio (mock) | [passo 9](./compra-do-cliente.sequencia.md#passo-9-expedição) |\n| 10 | Loja esvazia o carrinho do cliente | Loja | Efeito colateral; **se falhar, o erro é apenas logado e o pedido é confirmado do mesmo jeito** | [passo 10](./compra-do-cliente.sequencia.md#passo-10-esvaziar-carrinho) |\n| 11 | Loja envia e-mail de confirmação | Loja | Mock: não envia e-mail de verdade; **se falhar, o erro é apenas logado e o pedido é confirmado do mesmo jeito** | [passo 11](./compra-do-cliente.sequencia.md#passo-11-confirmação-por-e-mail) |\n| 12 | Cliente vê a confirmação do pedido | Cliente | Tela final com itens, total pago e recomendações | [passo 12](./compra-do-cliente.sequencia.md#passo-12-resposta-ao-cliente) |\n\n## Diagrama\n\n```mermaid\nflowchart LR\n  subgraph Cliente\n    A[Entra na loja] --> B[Navega produtos]\n    B --> C[Adiciona ao carrinho]\n    C --> D[Revisa carrinho]\n    D --> E[Preenche endereço e cartão]\n  end\n  subgraph Loja\n    E --> F[Monta o pedido e cota o frete]\n    F --> G{Cobrança aprovada?}\n    G -- sim --> H[Expede, esvazia carrinho, envia e-mail]\n    G -- não --> X[Pedido falha - erro exibido ao cliente]\n    H --> I[Confirma pedido]\n  end\n  subgraph Cliente2[Cliente]\n    I --> J[Vê confirmação e recomendações]\n  end\n```\n\n## Indicadores\n\nNenhum indicador de negócio (taxa de conversão, ticket médio, abandono de carrinho) está instrumentado no código além de logs técnicos e tracing OpenTelemetry — não há métricas de negócio expostas. `[extracted — ausência de client de métricas de negócio; a confirmar com o PM se existem fora do repositório]`\n\n## Regras que governam\n- [Bandeiras de cartão aceitas](../regras-de-negocio/bandeiras-de-cartao-aceitas.md)\n- [Cartão não pode estar vencido](../regras-de-negocio/cartao-nao-pode-estar-vencido.md)\n- [Sessão sem login](../regras-de-negocio/sessao-sem-login.md)\n- [Moedas suportadas para exibição](../regras-de-negocio/moedas-suportadas.md)\n- [Falhas de expedição e e-mail não revertem o pedido](../regras-de-negocio/falha-pos-cobranca-nao-reverte-pedido.md)\n", "dominio-online-boutique/fluxos/compra-do-cliente.sequencia.md": "---\nid: flow-compra-do-cliente-sequencia\nkind: flow\nsubject: flow:compra-do-cliente:sequencia\ncamada: 3\nstatus: proposed\nrealiza: [flow-compra-do-cliente]\nrealizado-por: [sys-frontend, sys-cartservice, sys-productcatalogservice, sys-currencyservice, sys-checkoutservice, sys-paymentservice, sys-shippingservice, sys-emailservice, sys-recommendationservice]\nprovenance:\n  - source: repo:microservices-demo\n    locator: src/frontend/handlers.go#L59-L340\n    version: 38e7348\n    extraction: extracted\n  - source: repo:microservices-demo\n    locator: src/checkoutservice/main.go#L237-L394\n    version: 38e7348\n    extraction: extracted\n---\n\n# Compra do cliente: sequência técnica\n\nRealiza as etapas do [fluxo macro](./compra-do-cliente.md). Todas as chamadas entre sistemas são **gRPC síncronas**; a única chamada HTTP é do navegador para o `frontend`. Todos os endereços vêm de variáveis de ambiente do Deployment de cada serviço (ex.: `CART_SERVICE_ADDR=cartservice:7070`), fixadas nos manifestos Kubernetes. `[extracted, kubernetes-manifests/*.yaml]`\n\n## Diagrama 1 — Navegação e carrinho (passos 1 a 4)\n\n```mermaid\nsequenceDiagram\n  actor Cliente\n  participant FE as frontend\n  participant PC as productcatalogservice\n  participant CU as currencyservice\n  participant CT as cartservice\n  participant RC as recommendationservice\n\n  Cliente->>FE: GET / (sem cookie)\n  FE-->>Cliente: 200 + Set-Cookie shop_session-id=<uuid>\n  Cliente->>FE: GET /product/{id}\n  FE->>PC: GetProduct(id)\n  PC-->>FE: Product(price_usd, ...)\n  FE->>CU: Convert(price_usd -> moeda da sessão)\n  CU-->>FE: Money convertido\n  FE-->>Cliente: página do produto com preço convertido\n\n  Cliente->>FE: POST /cart {product_id, quantity}\n  FE->>CT: AddItem(session_id, product_id, quantity)\n  CT-->>FE: Empty (ok)\n  FE-->>Cliente: redireciona para /cart\n\n  Cliente->>FE: GET /cart\n  FE->>CT: GetCart(session_id)\n  CT-->>FE: Cart(items)\n  FE->>PC: GetProduct(id) para cada item\n  FE->>CU: Convert(...) para cada item\n  FE->>RC: ListRecommendations(session_id, product_ids do carrinho)\n  RC-->>FE: até N ids recomendados\n  FE->>PC: GetProduct(id) para cada recomendado\n  FE-->>Cliente: página do carrinho + recomendações (máx. 4)\n```\n`[extracted, src/frontend/handlers.go#L59-L318; src/frontend/rpc.go#L30-L117]`\n\n## Diagrama 2 — Checkout (passos 5 a 12)\n\n```mermaid\nsequenceDiagram\n  actor Cliente\n  participant FE as frontend\n  participant CO as checkoutservice\n  participant CT as cartservice\n  participant PC as productcatalogservice\n  participant CU as currencyservice\n  participant SH as shippingservice\n  participant PAY as paymentservice\n  participant EM as emailservice\n\n  Cliente->>FE: POST /cart/checkout (email, endereço, dados do cartão)\n  FE->>FE: valida payload (validator.PlaceOrderPayload)\n  alt payload inválido\n    FE-->>Cliente: 422 Unprocessable Entity\n  else payload válido\n    FE->>CO: PlaceOrder(user_id, user_currency, address, email, credit_card)\n    CO->>CT: GetCart(user_id)\n    CT-->>CO: itens do carrinho\n    loop cada item do carrinho\n      CO->>PC: GetProduct(product_id)\n      PC-->>CO: Product(price_usd)\n      CO->>CU: Convert(price_usd -> user_currency)\n      CU-->>CO: preço convertido\n    end\n    CO->>SH: GetQuote(address, items)\n    SH-->>CO: cost_usd (cotação mock por quantidade de itens)\n    CO->>CU: Convert(cost_usd -> user_currency)\n    CU-->>CO: frete convertido\n    CO->>PAY: Charge(total, credit_card)\n    alt cartão inválido, bandeira não aceita ou vencido\n      PAY-->>CO: erro (400)\n      CO-->>FE: Internal - \"failed to charge the card\"\n      FE-->>Cliente: 500 - erro ao completar o pedido (pedido NÃO é criado)\n    else cobrança aprovada\n      PAY-->>CO: transaction_id (uuid mock)\n      CO->>SH: ShipOrder(address, items)\n      SH-->>CO: tracking_id (mock)\n      CO->>CT: EmptyCart(user_id)\n      Note over CO,CT: se EmptyCart falhar, o erro é ignorado (best-effort)\n      CO->>EM: SendOrderConfirmation(email, order)\n      Note over CO,EM: se o e-mail falhar, o erro só é logado - não afeta a resposta\n      CO-->>FE: PlaceOrderResponse(order_id, tracking_id, items, shipping_cost)\n      FE-->>Cliente: 200 - página \"pedido confirmado\" + recomendações\n    end\n  end\n```\n`[extracted, src/checkoutservice/main.go#L237-L394; src/frontend/handlers.go#L320-L400]`\n\n## Passos\n\n### Passo 1: Entrada e sessão\nO navegador acessa `GET /`. O middleware do `frontend` lê o cookie `shop_session-id`; se ausente, gera um UUID e grava o cookie com validade de 48h (`cookieMaxAge = 60*60*48`). Esse valor é o `user_id`/`session_id` usado por todos os serviços a partir daqui — não há cadastro nem login. `[extracted, src/frontend/middleware.go#L87-L107; src/frontend/main.go#L41-L45]`\n\n### Passo 2: Vitrine e preço\nPara a home (`GET /`) e a página de produto (`GET /product/{id}`), o `frontend` busca produtos em `productcatalogservice.ListProducts`/`GetProduct` e converte cada `Money` para a moeda atual da sessão via `currencyservice.Convert`. A home também busca um anúncio contextual (`adservice.GetAds`) com timeout de 100 ms. `[extracted, src/frontend/handlers.go#L59-L210; src/frontend/rpc.go#L119-L124]`\n\n### Passo 3: Adicionar ao carrinho\n`POST /cart` chama `cartservice.AddItem(user_id, product_id, quantity)`. O `cartservice` lê o carrinho serializado (protobuf) do Redis (`redis-cart:6379`), soma a quantidade se o produto já existir, e regrava. `[extracted, src/frontend/handlers.go#L211-L238; src/cartservice/src/cartstore/RedisCartStore.cs#L32-L64]`\n\n### Passo 4: Revisar carrinho\n`GET /cart` busca o carrinho (`cartservice.GetCart`), resolve cada item no catálogo, converte os preços e busca recomendações (`recommendationservice.ListRecommendations`), que por sua vez são resolvidas de volta no catálogo. O `frontend` corta a lista de recomendações em no máximo 4 itens para caber na UI. `[extracted, src/frontend/handlers.go#L251-L318; src/frontend/rpc.go#L99-L117]`\n\n### Passo 5: Envio do formulário de checkout\n`POST /cart/checkout` traz e-mail, endereço (rua, cidade, estado, país, CEP) e dados do cartão (número, mês/ano de expiração, CVV). O `frontend` valida o payload (`validator.PlaceOrderPayload.Validate()`) **antes** de chamar o `checkoutservice`; falha aqui retorna 422 sem nenhuma chamada de rede adicional. `[extracted, src/frontend/handlers.go#L320-L352]`\n\n### Passo 6: Montagem do pedido\nO `checkoutservice.PlaceOrder` gera um `order_id` (UUID) e chama `cartservice.GetCart`. Para cada item, busca o produto no `productcatalogservice` e converte seu preço para a moeda do cliente via `currencyservice.Convert`, montando a lista de `OrderItem`. `[extracted, src/checkoutservice/main.go#L237-L260, #L296-L318]`\n\n### Passo 7: Cotação de frete\n`shippingservice.GetQuote` calcula um valor determinístico a partir da contagem total de itens (não depende do endereço de fato, embora o endereço seja passado no contrato). O resultado em USD é convertido para a moeda do cliente. `[extracted, src/shippingservice/main.go#L118-L138; src/checkoutservice/main.go#L279-L295]`\n\n### Passo 8: Cobrança\n`paymentservice.Charge` valida o número do cartão com `simple-card-validator`, aceita **somente Visa e MasterCard**, verifica que a expiração é no futuro e devolve um `transaction_id` aleatório — nenhuma cobrança real ocorre. Qualquer uma dessas validações falhando lança um erro que o `checkoutservice` propaga como falha da chamada `PlaceOrder` inteira. **Não existe fluxo de \"tentar outro cartão\" nesta versão** — a interação termina em erro para o cliente. `[extracted, src/paymentservice/charge.js#L61-L86; src/checkoutservice/main.go#L262-L266]`\n\n### Passo 9: Expedição\nSomente após a cobrança ser aprovada, `shippingservice.ShipOrder` é chamado e devolve um `tracking_id` mock (hash determinístico, não um código de rastreio real). `[extracted, src/shippingservice/main.go#L140-L154; src/checkoutservice/main.go#L268-L271]`\n\n### Passo 10: Esvaziar carrinho\n`cartservice.EmptyCart` é chamado para o `user_id`. O `checkoutservice` **descarta o erro** dessa chamada (`_ = cs.emptyUserCart(...)`) — se falhar, o carrinho pode continuar com os itens já comprados, mas o pedido é confirmado do mesmo jeito. `[extracted, src/checkoutservice/main.go#L273-L275]`\n\n### Passo 11: Confirmação por e-mail\n`emailservice.SendOrderConfirmation` é chamado com o resultado do pedido. O serviço apenas loga o \"envio\" (ou, em modo real, usa SendGrid se configurado) — é best-effort: o erro é logado como `Warn` e **não** interrompe a resposta ao cliente. `[extracted, src/checkoutservice/main.go#L277-L282; src/emailservice/email_server.py#L62-L109]`\n\n### Passo 12: Resposta ao cliente\nO `checkoutservice` devolve `PlaceOrderResponse` com o pedido completo. O `frontend` soma o total pago (itens + frete), busca recomendações adicionais e renderiza a página de confirmação. `[extracted, src/frontend/handlers.go#L354-L400]`\n\n## Caminho de erro (consolidado)\n\n| Chamada | Se falhar | Efeito no pedido |\n|---|---|---|\n| `cartservice.GetCart` | Erro retornado ao cliente (500) | Pedido não é criado |\n| `productcatalogservice.GetProduct` (por item) | Erro retornado ao cliente (500) | Pedido não é criado |\n| `currencyservice.Convert` (preço ou frete) | Erro retornado ao cliente (500) | Pedido não é criado |\n| `shippingservice.GetQuote` | Erro retornado ao cliente (500) | Pedido não é criado |\n| `paymentservice.Charge` | Erro retornado ao cliente (500) | **Pedido não é criado** — mas se o mock realmente cobrasse, isso seria uma cobrança sem pedido; risco a validar |\n| `shippingservice.ShipOrder` | Erro retornado ao cliente (503 Unavailable) | Cartão já foi cobrado; pedido não é criado — **inconsistência potencial: cliente pago sem pedido registrado** `[inferred — risco de negócio a confirmar]` |\n| `cartservice.EmptyCart` | Ignorado (log implícito via erro descartado) | Pedido é confirmado normalmente |\n| `emailservice.SendOrderConfirmation` | Logado como aviso | Pedido é confirmado normalmente |\n\nTodas as chamadas gRPC usam `grpc.NewClient` sem timeout nem retry explícitos por chamada (exceto `adservice`, que tem timeout de 100 ms no frontend) — na ausência de configuração de timeout/circuit breaker, o comportamento padrão do gRPC (bloqueante, sem deadline) se aplica. `[extracted — nenhuma chamada `context.WithTimeout` encontrada nos clients gRPC do checkoutservice, exceto no chooseAd do frontend]`\n", "dominio-online-boutique/mapa/relacoes-com-outros-dominios.md": "---\nid: dom-online-boutique-relacoes\nkind: domain\nsubject: domain:online-boutique:relacoes\ncamada: 2\nstatus: proposed\nrealiza: [dom-online-boutique]\nrealizado-por: []\nprovenance:\n  - source: repo:microservices-demo\n    locator: README.md#L1-L30\n    version: 38e7348\n    extraction: inferred\n---\n\n# Relações com outros domínios\n\nO repositório documenta um único domínio autocontido (demo de referência); não há outro domínio de negócio (ex.: \"Estoque\", \"Contabilidade\", \"Marketing\") no mesmo repositório ou citado em documentação para relacionar. `[inferred — repositório é um monorepo de demonstração isolado]`\n\nAs únicas fronteiras externas observadas são técnicas, não de domínio de negócio:\n\n| Fronteira externa | Natureza | Sistema que a implementa |\n|---|---|---|\n| Envio de e-mail | Simulado (loga e retorna sucesso; não integra provedor real) | [emailservice](../sistemas/emailservice/ficha.md) |\n| Cobrança de cartão | Simulado (valida formato/bandeira/validade e devolve um UUID como \"transação\") | [paymentservice](../sistemas/paymentservice/ficha.md) |\n| Cotação de câmbio | Dados estáticos embutidos (`currency_conversion.json`, rotulado como vindo do Banco Central Europeu) | [currencyservice](../sistemas/currencyservice/ficha.md) |\n| Frete | Simulado (cálculo determinístico por quantidade de itens; não integra transportadora) | [shippingservice](../sistemas/shippingservice/ficha.md) |\n| Assistente de compras (IA) | Real, se habilitado: usa Gemini (Google Generative AI) e AlloyDB como vector store | [shoppingassistantservice](../sistemas/shoppingassistantservice/ficha.md) |\n\n## Pergunta em aberto\n\nSe este domínio for integrado a outros domínios de negócio da empresa (ex.: um domínio real de Pagamentos ou de Logística), qual será o mecanismo de integração — chamada síncrona adicional ou introdução de um barramento de eventos? Hoje nada no código sustenta essa integração. `[pergunta para arquiteto]`\n", "dominio-online-boutique/subdominios/assistente-de-compras.md": "---\nid: sub-assistente-de-compras\nkind: subdomain\nsubject: subdomain:assistente-de-compras\ncamada: 3\nstatus: proposed\nrealiza: [dom-online-boutique, cap-assistir-compra-com-ia]\nrealizado-por: [sys-shoppingassistantservice]\nprovenance:\n  - source: repo:microservices-demo\n    locator: kustomize/components/shopping-assistant/kustomization.yaml#L1-L40\n    version: 38e7348\n    extraction: extracted\n---\n\n# Subdomínio Assistente de Compras\n\nRecurso opcional (desligado por padrão) que responde perguntas em linguagem natural sobre o catálogo usando busca vetorial + um modelo de linguagem generativo. `[extracted]`\n\n## Sistemas\n\n| Sistema | Papel |\n|---|---|\n| [shoppingassistantservice](../sistemas/shoppingassistantservice/ficha.md) | Recebe a pergunta, busca produtos similares em um vetor armazenado no AlloyDB e gera a resposta com Gemini |\n\n## Fluxos executados aqui\n\nSem sequência dedicada nesta rodada de documentação — a chamada é isolada (`frontend POST /bot → shoppingassistantservice`), sem orquestração com os demais subdomínios. `[extracted]`\n\n## Ativação\n\nSó existe quando:\n1. o overlay Kustomize `kustomize/components/shopping-assistant` é aplicado (adiciona o Deployment do serviço e liga `ENABLE_ASSISTANT=true` no frontend); e\n2. as variáveis `PROJECT_ID`, `REGION`, `ALLOYDB_*` estão configuradas.\n\n`[extracted, kustomize/components/shopping-assistant/kustomization.yaml]`\n", "dominio-online-boutique/subdominios/carrinho-e-sessao.md": "---\nid: sub-carrinho-e-sessao\nkind: subdomain\nsubject: subdomain:carrinho-e-sessao\ncamada: 3\nstatus: proposed\nrealiza: [dom-online-boutique, cap-vender-produtos-online]\nrealizado-por: [sys-frontend, sys-cartservice]\nprovenance:\n  - source: repo:microservices-demo\n    locator: src/frontend/middleware.go#L80-L110\n    version: 38e7348\n    extraction: extracted\n---\n\n# Subdomínio Carrinho e Sessão\n\nIdentifica o visitante sem exigir cadastro e mantém o carrinho de compras entre requisições, mesmo sem estado no navegador além de um cookie. `[extracted]`\n\n## Sistemas\n\n| Sistema | Papel |\n|---|---|\n| [frontend](../sistemas/frontend/ficha.md) | Gera e propaga o `session_id` (cookie `shop_session-id`); usa esse id como `user_id` em todas as chamadas downstream |\n| [cartservice](../sistemas/cartservice/ficha.md) | Persiste o carrinho por `user_id`; suporta três backends de dados intercambiáveis (Redis, Cloud Spanner, AlloyDB) |\n\n## Fluxos executados aqui\n- [Compra do cliente](../fluxos/compra-do-cliente.sequencia.md) — passos 1, 3, 4 e 10\n\n## Ponto de atenção\n\nO `user_id` é literalmente o valor do cookie de sessão — não há verificação de identidade. Um cliente que limpa cookies ou troca de dispositivo perde o carrinho e \"vira\" outro usuário. `[inferred a partir da ausência de login]`\n", "dominio-online-boutique/subdominios/catalogo-e-descoberta.md": "---\nid: sub-catalogo-e-descoberta\nkind: subdomain\nsubject: subdomain:catalogo-e-descoberta\ncamada: 3\nstatus: proposed\nrealiza: [dom-online-boutique, cap-descobrir-e-recomendar-produtos]\nrealizado-por: [sys-productcatalogservice, sys-recommendationservice, sys-adservice]\nprovenance:\n  - source: repo:microservices-demo\n    locator: src/productcatalogservice/server.go#L1-L60\n    version: 38e7348\n    extraction: extracted\n---\n\n# Subdomínio Catálogo e Descoberta\n\nResponsável por manter e expor o catálogo de produtos e por ajudar o cliente a descobrir itens além do que ele já procurou (recomendações e anúncios). `[extracted a partir das responsabilidades de cada serviço]`\n\n## Sistemas\n\n| Sistema | Papel |\n|---|---|\n| [productcatalogservice](../sistemas/productcatalogservice/ficha.md) | Fonte de verdade dos produtos (catálogo estático em JSON), busca e detalhe |\n| [recommendationservice](../sistemas/recommendationservice/ficha.md) | Sugere produtos a partir dos itens do carrinho |\n| [adservice](../sistemas/adservice/ficha.md) | Anúncios de texto por categoria/contexto |\n\n## Fluxos executados aqui\n\nNão há fluxo macro dedicado; este subdomínio é consumido dentro de [Compra do cliente](../fluxos/compra-do-cliente.sequencia.md) (passos 2 e 4) e por qualquer página que liste produtos.\n\n## Observação\n\nNenhum dos três sistemas escreve dados — todos são consultas. Não há cache dedicado documentado no código (o catálogo é lido do arquivo JSON a cada `ListProducts`, salvo cache em memória — ver [ficha do productcatalogservice](../sistemas/productcatalogservice/ficha.md)). `[extracted]`\n", "dominio-online-boutique/subdominios/checkout-e-pagamento.md": "---\nid: sub-checkout-e-pagamento\nkind: subdomain\nsubject: subdomain:checkout-e-pagamento\ncamada: 3\nstatus: proposed\nrealiza: [dom-online-boutique, cap-vender-produtos-online]\nrealizado-por: [sys-checkoutservice, sys-paymentservice, sys-shippingservice, sys-emailservice, sys-currencyservice]\nprovenance:\n  - source: repo:microservices-demo\n    locator: src/checkoutservice/main.go#L67-L84\n    version: 38e7348\n    extraction: extracted\n---\n\n# Subdomínio Checkout e Pagamento\n\nOrquestra a finalização do pedido: reúne o carrinho, precifica na moeda do cliente, cota e executa o frete, cobra o cartão e confirma por e-mail. `[extracted]`\n\n## Sistemas\n\n| Sistema | Papel |\n|---|---|\n| [checkoutservice](../sistemas/checkoutservice/ficha.md) | Orquestrador central — único ponto que fala com cart, catálogo, câmbio, frete, pagamento e e-mail |\n| [paymentservice](../sistemas/paymentservice/ficha.md) | Valida e \"cobra\" o cartão (mock) |\n| [shippingservice](../sistemas/shippingservice/ficha.md) | Cota e \"executa\" o frete (mock) |\n| [emailservice](../sistemas/emailservice/ficha.md) | Envia (mock) a confirmação do pedido |\n| [currencyservice](../sistemas/currencyservice/ficha.md) | Converte todos os valores monetários para a moeda do cliente |\n\n## Fluxos executados aqui\n- [Compra do cliente](../fluxos/compra-do-cliente.sequencia.md) — passos 5 a 12 (o núcleo do subdomínio)\n\n## Como o fluxo vira engenharia\n\nO `checkoutservice` é a única porta de entrada deste subdomínio (`PlaceOrder`); nenhum outro sistema do domínio chama `paymentservice`, `shippingservice` ou `emailservice` diretamente. Isso o torna o ponto único de falha e de regra de negócio do checkout. `[extracted — nenhum outro cliente gRPC para paymentservice/shippingservice/emailservice encontrado além do checkoutservice]`\n"};
mermaid.initialize({startOnLoad:false, theme:'default'});
const nav = document.getElementById('nav'), doc = document.getElementById('doc');
const keys = Object.keys(F).sort((a,b)=> (a.includes('RELATORIO')?-1:0) - (b.includes('RELATORIO')?-1:0) || a.localeCompare(b));
async function show(k){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.k===k));
  let t = F[k], fm = '';
  const m = t.match(/^---\n([\s\S]*?)\n---\n?/);
  if (m) { fm = '<div class="fm">'+m[1].replace(/</g,'&lt;')+'</div>'; t = t.slice(m[0].length); }
  let h = marked.parse(t);
  h = h.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g, (_, c) => '<div class="mermaid">'+c+'</div>');
  doc.innerHTML = '<p style="color:var(--muted);font-size:12px">'+k+'</p>' + fm + h;
  doc.querySelectorAll('.mermaid').forEach(el => { el.textContent = el.textContent.replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&'); });
  try { await mermaid.run({nodes: doc.querySelectorAll('.mermaid')}); } catch(e) { console.warn(e); }
}
keys.forEach(k => { const a = document.createElement('a'); a.href='#'; a.textContent=k; a.dataset.k=k; a.onclick=e=>{e.preventDefault();show(k)}; nav.appendChild(a); });
show(keys[0]);
