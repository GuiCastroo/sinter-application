<script>
const F = {"01-visao-geral-e-servicos.md": "# 1. Visão Geral do Domínio\n\n## 1.1 O que é\n\n**Online Boutique** é uma loja virtual de demonstração (e-commerce) usada pelo\nGoogle para mostrar modernização de aplicações em Kubernetes/GKE. O domínio de\nnegócio é simples e clássico de e-commerce: navegar catálogo, ver detalhes de\nproduto, adicionar ao carrinho, calcular frete/moeda, finalizar a compra\n(checkout), pagar, enviar e confirmar por e-mail. Não há criação de conta,\nlogin ou histórico de pedidos — cada visitante recebe um `session_id` anônimo\nvia cookie e esse identificador é a única \"identidade\" do usuário no sistema.\n\n## 1.2 Catálogo de microsserviços\n\nO domínio é implementado por **11 microsserviços de negócio** + 1 serviço de\ncarga sintética, cada um em uma linguagem diferente (propositalmente, para\ndemonstrar poliglotismo), todos se comunicando por **gRPC** usando um único\ncontrato compartilhado (`protos/demo.proto`).\n\n| Serviço | Linguagem | Porta interna | Responsabilidade | Dependências de saída (gRPC) |\n|---|---|---|---|---|\n| `frontend` | Go | 8080 (HTTP) | Serve o site (HTML server-side), é o único serviço com Service `LoadBalancer`/ingress público; gera `session_id` por cookie | productcatalog, currency, cart, recommendation, shipping, checkout, ad, shoppingassistant (HTTP) |\n| `cartservice` | C# (.NET) | 7070 | Guarda os itens do carrinho por `user_id` | Redis (`redis-cart:6379`) ou Spanner/AlloyDB conforme variante |\n| `productcatalogservice` | Go | 3550 | Lista, busca e retorna produtos a partir de um JSON estático embarcado | nenhuma |\n| `currencyservice` | Node.js | 7000 | Converte valores monetários entre moedas usando taxas fixas carregadas de um JSON (referência: BCE); é o serviço de **maior QPS** | nenhuma |\n| `paymentservice` | Node.js | 50051 | \"Cobra\" um cartão de crédito (mock, não integra gateway real); valida número, bandeira (só aceita VISA/Mastercard) e validade | nenhuma |\n| `shippingservice` | Go | 50051 | Calcula cotação de frete e \"envia\" o pedido gerando um `tracking_id` (mock) | nenhuma |\n| `emailservice` | Python | 8080 (interno 5000 no manifest) | Envia (mock/log) e-mail de confirmação de pedido | nenhuma |\n| `checkoutservice` | Go | 5050 | **Orquestrador do checkout**: busca carrinho, calcula preços, cobra pagamento, despacha envio, esvazia carrinho, dispara e-mail | cart, productcatalog, currency, shipping, payment, email |\n| `recommendationservice` | Python | 8080 | Recomenda produtos a partir dos itens já vistos/no carrinho | productcatalog |\n| `adservice` | Java | 9555 | Retorna anúncios textuais contextuais a partir de palavras-chave (categoria do produto) | nenhuma |\n| `shoppingassistantservice` | Python (Flask) | 80 | Assistente de compras com IA generativa (Gemini via LangChain) sobre um vetor de produtos no AlloyDB (feature opcional) | AlloyDB, Gemini API (Google GenAI) |\n| `loadgenerator` | Python/Locust | — | Não é serviço de negócio: simula usuários reais navegando/comprando, usado para gerar tráfego de teste/demo | frontend (HTTP) |\n\nFonte: tabela de serviços do `README.md` da raiz, cruzada com\n`kubernetes-manifests/*.yaml` (portas e variáveis de ambiente reais) e o\ncódigo-fonte de cada serviço.\n\n## 1.3 Papéis arquiteturais\n\n- **Borda (edge):** `frontend` é o único ponto de entrada. Não existe API\n  Gateway dedicado nem BFF separado — o próprio frontend em Go faz o papel de\n  BFF, chamando os demais serviços via gRPC e renderizando HTML\n  server-side (`html/template`).\n- **Orquestrador de processo de negócio:** `checkoutservice` é o único\n  serviço que orquestra uma transação de negócio de ponta a ponta (o\n  checkout). Ele não tem estado próprio; cada chamada `PlaceOrder` é\n  stateless e delega tudo a outros serviços.\n- **Serviços de domínio \"puro\"/utilitário:** `productcatalogservice`,\n  `currencyservice`, `shippingservice`, `paymentservice`, `adservice` — sem\n  dependências de outros serviços internos, cada um resolve uma\n  responsabilidade única e é fácil de testar isoladamente.\n- **Serviço com estado (stateful):** `cartservice` é o único serviço de\n  negócio com armazenamento persistente (Redis por padrão; Spanner ou AlloyDB\n  como alternativas via Kustomize, ver documento 3).\n- **Serviço de IA/experimental:** `shoppingassistantservice`, habilitado por\n  flag (`ENABLE_ASSISTANT`), plugado à parte (feature opcional, não faz\n  parte do fluxo padrão de checkout).\n- **Geração de carga:** `loadgenerator` não participa do domínio de negócio;\n  é uma ferramenta de teste que bate no `frontend` como um usuário real (ver\n  `src/loadgenerator/locustfile.py`), útil como documentação viva do\n  comportamento esperado do cliente (ver documento 4).\n\n## 1.4 Modelo de dados compartilhado (contrato único)\n\nTodos os serviços compilam o mesmo arquivo `protos/demo.proto` (pacote\n`hipstershop`) para gerar seus stubs gRPC em cada linguagem. As principais\nentidades de domínio, todas definidas nesse único contrato, são:\n\n- `Product` (id, name, description, picture, `price_usd: Money`, categories)\n- `Money` (currency_code ISO-4217, units, nanos — sem uso de `float`)\n- `CartItem` / `Cart` (user_id + lista de CartItem)\n- `Address` (street_address, city, state, country, zip_code)\n- `CreditCardInfo` (number, cvv, mês/ano de expiração)\n- `OrderItem` (CartItem + Money cost) e `OrderResult` (order_id,\n  shipping_tracking_id, shipping_cost, shipping_address, items)\n- `Ad` (redirect_url, text)\n\nNão existe um \"serviço de pedidos\" com persistência própria: o `OrderResult`\né construído em memória pelo `checkoutservice` a cada `PlaceOrder` e nunca é\nsalvo em banco — o pedido \"existe\" apenas na resposta HTTP e no e-mail de\nconfirmação enviado.\n\n## 1.5 O que este domínio NÃO tem (limites explícitos)\n\n- Sem autenticação/login de usuário — identidade = cookie de sessão anônimo.\n- Sem histórico de pedidos, sem tabela/DB de \"orders\".\n- Sem mensageria assíncrona (fila, pub/sub, eventos) entre os 11 serviços —\n  toda comunicação de negócio é **síncrona request/response via gRPC**\n  (ver documento 2).\n- Sem gateway de pagamento real, sem transportadora real — `paymentservice`\n  e `shippingservice` são mocks determinísticos.\n- Sem retries/circuit breaker explícitos no código de aplicação — a\n  resiliência de rede, quando presente, vem da malha de serviço (Istio),\n  não do código Go/C#/Python/Java em si (ver documento 2, seção de\n  resiliência).\n", "02-comunicacao-entre-servicos.md": "# 2. Como os Serviços se Falam\n\n## 2.1 Protocolo: gRPC + protobuf, ponto a ponto, síncrono\n\nToda comunicação **entre** microsserviços de negócio é feita por **chamadas\ngRPC síncronas** (request/response), usando um único arquivo de contrato:\n`protos/demo.proto` (pacote `hipstershop`). Cada serviço compila esse mesmo\n`.proto` para a sua linguagem (Go, C#, Node.js, Python, Java) e gera um\nstub cliente e um esqueleto servidor. Não existe barramento de eventos,\nfila (Kafka/RabbitMQ/PubSub) ou webhook entre os serviços — se um serviço\ndownstream está fora do ar, a chamada gRPC falha e o erro sobe na pilha de\nchamadas até o `frontend`.\n\nA única exceção é o **`frontend`**, que fala **HTTP/HTML** com o navegador do\nusuário (é o único serviço \"web\" tradicional) e também expõe um endpoint\n`/bot` (`chatBotHandler`) que faz uma chamada **HTTP** (não gRPC) para o\n`shoppingassistantservice`, que roda como um servidor Flask.\n\n## 2.2 Descoberta de serviço: DNS interno do Kubernetes\n\nNão há service mesh de descoberta dinâmica nem service registry — a\n\"descoberta\" é feita via **variáveis de ambiente com nomes de Service do\nKubernetes**, resolvidos por DNS interno do cluster (`<service>.<namespace>.svc.cluster.local`,\nabreviado para `<service>:<porta>` dentro do mesmo namespace). Cada Deployment\nrecebe o endereço dos serviços de quem depende hard-coded no manifest, por\nexemplo (`kubernetes-manifests/checkoutservice.yaml`):\n\n```yaml\nenv:\n- name: PRODUCT_CATALOG_SERVICE_ADDR\n  value: \"productcatalogservice:3550\"\n- name: SHIPPING_SERVICE_ADDR\n  value: \"shippingservice:50051\"\n- name: PAYMENT_SERVICE_ADDR\n  value: \"paymentservice:50051\"\n- name: EMAIL_SERVICE_ADDR\n  value: \"emailservice:5000\"\n- name: CURRENCY_SERVICE_ADDR\n  value: \"currencyservice:7000\"\n- name: CART_SERVICE_ADDR\n  value: \"cartservice:7070\"\n```\n\nCada serviço Go/C#/Python lê essas variáveis no start-up (`mustMapEnv`) e\nabre uma conexão gRPC persistente (`grpc.NewClient`, insegura/sem TLS de\naplicação — TLS mTLS fica a cargo do Istio quando habilitado) para cada\ndependência, mantida durante todo o ciclo de vida do pod.\n\n## 2.3 Mapa de comunicação (quem chama quem)\n\n```mermaid\ngraph LR\n    subgraph Edge\n        FE[frontend :8080 HTTP]\n    end\n    subgraph \"Serviços de domínio (gRPC)\"\n        CART[cartservice :7070]\n        CAT[productcatalogservice :3550]\n        CUR[currencyservice :7000]\n        SHIP[shippingservice :50051]\n        PAY[paymentservice :50051]\n        MAIL[emailservice :5000]\n        CO[checkoutservice :5050]\n        REC[recommendationservice :8080]\n        AD[adservice :9555]\n    end\n    ASSIST[shoppingassistantservice :80 HTTP/Flask]\n    REDIS[(redis-cart :6379)]\n    ALLOYDB[(AlloyDB - vetor de produtos)]\n    LG[loadgenerator] -->|HTTP| FE\n\n    FE -->|GetCart/AddItem/EmptyCart| CART\n    FE -->|ListProducts/GetProduct/SearchProducts| CAT\n    FE -->|Convert/GetSupportedCurrencies| CUR\n    FE -->|GetQuote| SHIP\n    FE -->|PlaceOrder| CO\n    FE -->|ListRecommendations| REC\n    FE -->|GetAds| AD\n    FE -->|HTTP POST /bot| ASSIST\n\n    CO -->|GetCart/EmptyCart| CART\n    CO -->|GetProduct| CAT\n    CO -->|Convert| CUR\n    CO -->|GetQuote/ShipOrder| SHIP\n    CO -->|Charge| PAY\n    CO -->|SendOrderConfirmation| MAIL\n\n    REC -->|ListProducts| CAT\n    CART --> REDIS\n    ASSIST --> ALLOYDB\n```\n\nObservações sobre o grafo:\n\n- `checkoutservice` é o único serviço que **também é cliente** de outros\n  cinco serviços (cart, catálogo, moeda, frete, pagamento, e-mail) — ele\n  concentra toda a complexidade de orquestração da compra.\n- `productcatalogservice`, `currencyservice`, `paymentservice`,\n  `shippingservice`, `adservice`, `emailservice` são **folhas** no grafo:\n  não chamam ninguém, só respondem. Isso os torna fáceis de escalar\n  independentemente e sem risco de dependência cíclica.\n- `recommendationservice` tem uma única dependência de saída\n  (`productcatalogservice.ListProducts`), usada para montar a lista de\n  produtos candidatos a recomendar.\n- Não existe chamada `checkoutservice → recommendationservice` nem\n  `checkoutservice → adservice`: recomendações e anúncios são só uma\n  preocupação de apresentação do `frontend`, nunca do processo de compra em\n  si.\n\n## 2.4 Contratos por serviço (RPCs expostos)\n\nExtraído diretamente de `protos/demo.proto`:\n\n| Serviço | RPC | Request → Response |\n|---|---|---|\n| CartService | `AddItem` | `AddItemRequest{user_id, CartItem{product_id, quantity}}` → `Empty` |\n| | `GetCart` | `GetCartRequest{user_id}` → `Cart{user_id, items[]}` |\n| | `EmptyCart` | `EmptyCartRequest{user_id}` → `Empty` |\n| ProductCatalogService | `ListProducts` | `Empty` → `ListProductsResponse{products[]}` |\n| | `GetProduct` | `GetProductRequest{id}` → `Product` |\n| | `SearchProducts` | `SearchProductsRequest{query}` → `SearchProductsResponse{results[]}` |\n| RecommendationService | `ListRecommendations` | `{user_id, product_ids[]}` → `{product_ids[]}` |\n| ShippingService | `GetQuote` | `{address, items[]}` → `{cost_usd: Money}` |\n| | `ShipOrder` | `{address, items[]}` → `{tracking_id}` |\n| CurrencyService | `GetSupportedCurrencies` | `Empty` → `{currency_codes[]}` |\n| | `Convert` | `{from: Money, to_code}` → `Money` |\n| PaymentService | `Charge` | `{amount: Money, credit_card}` → `{transaction_id}` |\n| EmailService | `SendOrderConfirmation` | `{email, order: OrderResult}` → `Empty` |\n| CheckoutService | `PlaceOrder` | `{user_id, user_currency, address, email, credit_card}` → `{order: OrderResult}` |\n| AdService | `GetAds` | `{context_keys[]}` → `{ads[]}` |\n\nTodos os serviços gRPC também implementam o **protocolo de health check\npadrão** (`grpc.health.v1.Health` — `protos/grpc/health/v1/health.proto`),\nusado pelas *probes* de liveness/readiness do Kubernetes (ver documento 3).\n\n## 2.5 Resiliência (e sua ausência)\n\n- **No código de aplicação:** não há retries, timeouts customizados,\n  circuit breakers ou fallback explícitos nas chamadas gRPC dos serviços\n  (ex.: `checkoutservice.chargeCard`, `quoteShipping` simplesmente propagam o\n  erro do gRPC como `status.Errorf(codes.Internal, ...)`). Uma falha em\n  qualquer serviço-folha durante `PlaceOrder` derruba o checkout inteiro\n  — a única exceção deliberada é o envio de e-mail: se\n  `sendOrderConfirmation` falhar, o erro é apenas logado (`log.Warnf`) e o\n  pedido é considerado concluído mesmo assim.\n- **Tracing distribuído:** todos os serviços Go instrumentam gRPC com\n  OpenTelemetry (`otelgrpc`), propagando contexto de trace via\n  `ENABLE_TRACING=1` e exportando para um `COLLECTOR_SERVICE_ADDR` (padrão:\n  OpenTelemetry Collector), permitindo correlacionar uma compra através de\n  todos os serviços envolvidos.\n- **Na malha de serviço (opcional):** quando o componente Kustomize\n  `service-mesh-istio` está habilitado, o Istio injeta sidecars Envoy em\n  cada pod, que then podem fornecer mTLS, retries e circuit breaking de\n  forma transparente — mas isso é infraestrutura, não está no código dos\n  serviços (ver documento 3, seção Istio).\n", "03-infraestrutura-kubernetes.md": "# 3. Infraestrutura no Kubernetes\n\n## 3.1 Formas de implantar (3 caminhos, mesmo destino)\n\nO repositório oferece três caminhos equivalentes para colocar os 11+1\nserviços no ar, todos apontando para o mesmo conjunto de imagens de\ncontainer:\n\n1. **Manifests YAML \"crus\"** em `kubernetes-manifests/*.yaml` — um\n   Deployment + Service + ServiceAccount por serviço, prontos para\n   `kubectl apply -f ./release/kubernetes-manifests.yaml` (arquivo\n   consolidado versionado em `release/`).\n2. **Kustomize** (`kustomize/base` + `kustomize/components/*`) — a mesma\n   base, mas componível: permite ligar/desligar variantes (Spanner em vez de\n   Redis, Istio, network policies, branding etc.) via *overlays* sem editar\n   os YAMLs base.\n3. **Helm chart** (`helm-chart/`) — mesmo conjunto de recursos, parametrizado\n   por `values.yaml` (imagem/tag por serviço, réplicas, recursos, feature\n   flags), com `NOTES.txt` pós-instalação.\n\nO **Skaffold** (`skaffold.yaml`, `apiVersion: skaffold/v3`) amarra tudo:\nbuilda as 11 imagens (uma por diretório em `src/*`, com Docker/BuildKit,\nmulti-arch `linux/amd64` + `linux/arm64`, tag = git commit) e implanta via\n`manifests.kustomize.paths: [kubernetes-manifests]` + `deploy.kubectl`.\n`cloudbuild.yaml` usa esse mesmo Skaffold em CI para build/push de imagens.\n\n## 3.2 Anatomia de um serviço (padrão repetido 9x)\n\nCada serviço de negócio segue exatamente o mesmo template de manifest\n(`kubernetes-manifests/<service>.yaml`), ilustrado aqui pelo\n`checkoutservice`:\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: checkoutservice\nspec:\n  selector: {matchLabels: {app: checkoutservice}}\n  template:\n    spec:\n      serviceAccountName: checkoutservice     # SA dedicada por serviço\n      securityContext:\n        fsGroup: 1000\n        runAsGroup: 1000\n        runAsNonRoot: true                    # nunca roda como root\n        runAsUser: 1000\n      containers:\n        - name: server\n          securityContext:\n            allowPrivilegeEscalation: false\n            capabilities: {drop: [ALL]}       # capabilities Linux zeradas\n            privileged: false\n            readOnlyRootFilesystem: true      # FS raiz somente leitura\n          image: checkoutservice\n          ports: [{containerPort: 5050}]\n          readinessProbe: {grpc: {port: 5050}}   # health check gRPC nativo\n          livenessProbe:  {grpc: {port: 5050}}\n          env: [...]                              # endereços das dependências\n          resources:\n            requests: {cpu: 100m, memory: 64Mi}\n            limits:   {cpu: 200m, memory: 128Mi}\n---\napiVersion: v1\nkind: Service\nmetadata: {name: checkoutservice}\nspec:\n  type: ClusterIP\n  ports: [{name: grpc, port: 5050, targetPort: 5050}]\n---\napiVersion: v1\nkind: ServiceAccount\nmetadata: {name: checkoutservice}\n```\n\nPontos notáveis do padrão de segurança/operação, repetidos em todos os\n11 serviços:\n\n- **Postura de segurança \"hardened\" por padrão:** `runAsNonRoot`,\n  `readOnlyRootFilesystem: true`, `capabilities.drop: [ALL]`,\n  `allowPrivilegeEscalation: false` — sem exceções.\n- **Probes usando o protocolo gRPC nativo do Kubernetes** (`readinessProbe.grpc`)\n  para os serviços gRPC — dependem do `grpc.health.v1.Health` que cada\n  serviço registra (`healthpb.RegisterHealthServer`). O `frontend`, por ser\n  HTTP, usa `httpGet` em `/_healthz` com um cookie especial\n  (`shop_session-id=x-readiness-probe` / `x-liveness-probe`).\n  Ver `kubernetes-manifests/frontend.yaml` linhas 50-65.\n- **Requests/limits pequenos e consistentes** (tipicamente 100m/64Mi de\n  request e 200m/128Mi de limit) — desenhado para caber facilmente em\n  clusters pequenos/GKE Autopilot.\n  `cartservice` pede mais memória de start (`memory: 128Mi` no manifest) por\n  causa do cliente Redis/.NET.\n- **ServiceAccount dedicada por Deployment** — pré-requisito para aplicar\n  Workload Identity (GCP) ou RBAC granular por serviço depois.\n- **`Service` sempre `ClusterIP`** (não exposto fora do cluster), exceto:\n\n## 3.3 As duas exceções à regra: Redis e o Frontend público\n\n- **`redis-cart`** (dentro de `kubernetes-manifests/cartservice.yaml`): um\n  segundo Deployment no mesmo arquivo, rodando a imagem oficial\n  `redis:alpine`, porta `6379`, com um `volumeMount` (`redis-data`) — é o\n  único componente com estado de disco no cluster por padrão. `cartservice`\n  aponta para ele via env `REDIS_ADDR=redis-cart:6379`.\n- **`frontend`** expõe **dois** Services:\n  - `frontend` (ClusterIP, porta 80 → 8080) — usado internamente por\n    Istio/loadgenerator.\n  - `frontend-external` — tipo `LoadBalancer`, é o **único ponto de entrada\n    público** do domínio inteiro. Todo tráfego de usuário externo entra por\n    aqui (ou pelo Istio Gateway, se habilitado — ver 3.5).\n\n## 3.4 Kustomize: base + componentes opcionais\n\n`kustomize/base/kustomization.yaml` referencia os 11 manifests padrão (os\nmesmos de `kubernetes-manifests/`, porém como base componível). Sobre essa\nbase, `kustomize/components/` oferece **componentes plugáveis** (cada um com\nseu próprio README explicando o trade-off), usados via\n`kubectl apply -k` com `components: [...]` na kustomization do usuário:\n\n| Componente | O que muda |\n|---|---|\n| `spanner` | Troca a persistência do carrinho de Redis para **Cloud Spanner** (`SpannerCartStore.cs`) |\n| `alloydb` | Troca a persistência do carrinho para **AlloyDB** (`AlloyDBCartStore.cs`); também usado pelo `shoppingassistantservice` como vector store |\n| `memorystore` | Usa **Memorystore (Redis gerenciado)** em vez do Redis rodando como pod no cluster |\n| `service-mesh-istio` | Injeta os manifests de `istio-manifests/` (Gateway, VirtualServices, ServiceEntries) |\n| `network-policies` | Adiciona `NetworkPolicy` por serviço + uma política **deny-all** de base (Zero Trust de rede: só o tráfego explicitamente listado passa) |\n| `non-public-frontend` | Remove o `frontend-external` (LoadBalancer), forçando acesso só via port-forward/mesh |\n| `single-shared-session` | Fixa um `session_id` único para todos os visitantes (útil para demos determinísticas) |\n| `shopping-assistant` | Ativa o `shoppingassistantservice` (Deployment próprio + flag `ENABLE_ASSISTANT`) |\n| `cymbal-branding` | Reskin visual (marca fictícia \"Cymbal\") |\n| `custom-base-url` | Serve a aplicação sob um path base customizado |\n| `without-loadgenerator` | Remove o Deployment de `loadgenerator` via patch (`delete-loadgenerator.patch.yaml`) |\n| `container-images-registry` / `-tag` / `-tag-suffix` | Trocam o registro/tag das imagens de container |\n\nIsso mostra que a persistência do carrinho (Redis/Spanner/AlloyDB/Memorystore)\né um **detalhe de infraestrutura plugável**, não algo hard-coded no domínio —\n`cartservice` só enxerga a interface `ICartStore` (`src/cartservice/src/cartstore/ICartStore.cs`)\ne o Kustomize decide qual implementação concreta é injetada por variável de\nambiente/manifest.\n\n## 3.5 Istio (malha de serviço opcional)\n\nQuando o componente `service-mesh-istio` é aplicado, `istio-manifests/`\nadiciona três recursos `networking.istio.io/v1alpha3`:\n\n- **`Gateway` (`frontend-gateway`)** — expõe a porta 80/HTTP no\n  ingress-gateway padrão do Istio (`istio: ingressgateway`) para qualquer\n  host (`\"*\"`).\n- **`VirtualService` (`frontend-ingress`)** — roteia todo tráfego do\n  Gateway acima para o Service `frontend:80`.\n- **`VirtualService` (`frontend`)** — roteamento interno para\n  `frontend.default.svc.cluster.local:80` (permite futura configuração de\n  canary/traffic-splitting no próprio serviço).\n- **`ServiceEntry` (`allow-egress-googleapis`, `allow-egress-google-metadata`)**\n  — como o Istio por padrão bloqueia egress não declarado, essas entradas\n  liberam explicitamente saída para `*.googleapis.com`,\n  `accounts.google.com` e o metadata server do GCE\n  (`169.254.169.254` / `metadata.google.internal`), necessários para\n  Workload Identity e chamadas a APIs do Google Cloud (profiler, tracing,\n  Spanner/AlloyDB, Gemini).\n\nCom Istio ativo, cada pod ganha um sidecar Envoy — é aí que mTLS entre\nserviços, retries e circuit breaking passam a existir de fato (o código dos\nserviços, como visto no documento 2, não implementa nada disso sozinho).\n\n## 3.6 Provisionamento de cluster (Terraform)\n\n`terraform/main.tf` provisiona a infraestrutura **fora** do Kubernetes,\nnecessária para rodar o cluster:\n\n- Habilita APIs do Google Cloud (`container`, `monitoring`, `cloudtrace`,\n  `cloudprofiler`, e opcionalmente `redis.googleapis.com` se\n  `var.memorystore=true`).\n- Cria o cluster **GKE em modo Autopilot** (`google_container_cluster`,\n  `enable_autopilot = true`) — sem gestão manual de node pools.\n- Busca credenciais do cluster via módulo `gcloud`.\n- Roda `kubectl apply -k ${var.filepath_manifest} -n ${var.namespace}`\n  como um `null_resource.apply_deployment` — ou seja, o próprio Terraform\n  invoca o Kustomize/kubectl para aplicar os manifests descritos acima.\n- `memorystore.tf` cuida da instância gerenciada de Redis quando essa\n  variante está habilitada.\n\nOu seja: **Terraform cria o cluster GKE + dependências gerenciadas do GCP**;\n**Kustomize/Helm/kubectl aplicam os workloads dentro dele**. São duas\ncamadas independentes, conectadas pelo `null_resource` acima.\n\n## 3.7 Resumo da topologia de infraestrutura\n\n```mermaid\ngraph TB\n    subgraph \"Google Cloud (Terraform)\"\n        GKE[GKE Autopilot Cluster]\n        MS[(Memorystore Redis - opcional)]\n        SPANNER[(Cloud Spanner - opcional)]\n        ALLOYDB[(AlloyDB - opcional)]\n    end\n    subgraph \"Namespace default (Kustomize/Helm)\"\n        ISTIO[Istio ingress-gateway - opcional]\n        FE_EXT[Service frontend-external :LoadBalancer]\n        NETPOL[NetworkPolicies - opcional, deny-all + allow-list]\n        subgraph \"11 Deployments + ServiceAccounts\"\n            SVCS[frontend, cartservice, checkoutservice,\\nproductcatalogservice, currencyservice,\\npaymentservice, shippingservice, emailservice,\\nrecommendationservice, adservice,\\nshoppingassistantservice]\n        end\n        REDIS_POD[(Deployment redis-cart)]\n        LG2[Deployment loadgenerator]\n    end\n    GKE --> ISTIO\n    GKE --> FE_EXT\n    GKE --> SVCS\n    GKE --> REDIS_POD\n    GKE --> LG2\n    SVCS -.-> MS\n    SVCS -.-> SPANNER\n    SVCS -.-> ALLOYDB\n    Internet((Usuário/navegador)) --> ISTIO\n    Internet --> FE_EXT\n```\n", "04-fluxo-de-compra.md": "# 4. Fluxo de Compra do Cliente — Passo a Passo\n\nEste documento descreve o caminho completo de um cliente, da primeira\nvisita ao site até o recebimento do e-mail de confirmação do pedido,\napontando a linha de código exata responsável por cada etapa. As rotas HTTP\ncitadas são registradas em `src/frontend/main.go` (linhas 150-163); os\nhandlers estão em `src/frontend/handlers.go`.\n\n## 4.1 Passo 0 — Sessão anônima (acontece em toda requisição)\n\nAntes de qualquer rota, o middleware `ensureSessionID`\n(`src/frontend/middleware.go`) roda em toda requisição:\n\n- Se o navegador não enviar o cookie `shop_session-id`, o frontend gera um\n  novo UUID e o define como cookie (validade de longo prazo).\n- Esse `session_id` **é** o `user_id` usado em todas as chamadas gRPC\n  subsequentes (carrinho, recomendações, checkout). Não há cadastro nem\n  login — a \"conta\" do cliente é só esse cookie.\n\n## 4.2 Passo 1 — Home page (`GET /`)\n\nHandler: `homeHandler` (`handlers.go:59`).\n\n1. `fe.getCurrencies()` → gRPC `CurrencyService.GetSupportedCurrencies` —\n   popula o seletor de moeda.\n2. `fe.getProducts()` → gRPC `ProductCatalogService.ListProducts` — lista\n   completa de produtos do catálogo (vem de um JSON estático embarcado no\n   `productcatalogservice`).\n3. `fe.getCart(session_id)` → gRPC `CartService.GetCart` — só para exibir o\n   contador de itens no carrinho no cabeçalho.\n4. Para cada produto: `fe.convertCurrency()` → gRPC\n   `CurrencyService.Convert` — converte o preço USD do catálogo para a\n   moeda atualmente selecionada pelo cliente.\n5. `fe.chooseAd()` → gRPC `AdService.GetAds` — busca um anúncio contextual\n   (sem palavras-chave nesta página, contexto vazio).\n6. Renderiza o template `home` com produtos, moedas e tamanho do carrinho.\n\n## 4.3 Passo 2 — Trocar moeda (`POST /setCurrency`)\n\nHandler: `setCurrencyHandler`. Grava a moeda escolhida em outro cookie\n(`shop_currency`); não chama nenhum serviço de backend diretamente — a\nconversão de fato só acontece nas próximas páginas renderizadas (todas leem\n`currentCurrency(r)` do cookie).\n\n## 4.4 Passo 3 — Ver detalhe de um produto (`GET /product/{id}`)\n\nHandler: `productHandler` (`handlers.go:144`).\n\n1. `fe.getProduct(id)` → gRPC `ProductCatalogService.GetProduct`.\n2. `fe.getCurrencies()` e `fe.getCart()` (mesmo que na home).\n3. `fe.convertCurrency()` — preço do produto na moeda do cliente.\n4. `fe.getRecommendations(session_id, [id])` → gRPC\n   `RecommendationService.ListRecommendations`, que por sua vez chama\n   `ProductCatalogService.ListProducts` internamente e filtra produtos\n   diferentes do atual (falha aqui é tolerada — só gera um warning de log,\n   nunca quebra a página).\n5. `fe.chooseAd(categorias_do_produto)` → gRPC `AdService.GetAds`, agora\n   com as categorias do produto como `context_keys` — é assim que o anúncio\n   fica \"relacionado\" ao produto visto.\n6. (Opcional) Se um serviço de *packaging* HTTP externo estiver configurado\n   via `PACKAGING_SERVICE_URL`, busca peso/dimensões — feature opcional,\n   não crítica.\n7. Renderiza o template `product`.\n\n## 4.5 Passo 4 — Adicionar ao carrinho (`POST /cart`)\n\nHandler: `addToCartHandler` (`handlers.go:211`).\n\n1. Valida `quantity`/`product_id` (`validator.AddToCartPayload.Validate()`).\n2. `fe.getProduct(product_id)` → confirma que o produto existe\n   (`ProductCatalogService.GetProduct`).\n3. `fe.insertCart(session_id, product_id, quantity)` → gRPC\n   `CartService.AddItem` — o `cartservice` grava o item no Redis (chave =\n   `session_id`/`user_id`).\n4. Responde com **redirect 302** para `/cart`.\n\n## 4.6 Passo 5 — Ver carrinho (`GET /cart`)\n\nHandler: `viewCartHandler` (`handlers.go:251`).\n\n1. `fe.getCurrencies()`.\n2. `fe.getCart(session_id)` → gRPC `CartService.GetCart` — lista real de\n   itens no carrinho.\n3. `fe.getRecommendations(session_id, ids_do_carrinho)` — recomendações\n   baseadas em **todos** os itens já no carrinho (não crítico).\n4. `fe.getShippingQuote(cart, moeda)` → gRPC `ShippingService.GetQuote` —\n   cotação de frete estimada a partir da quantidade de itens (mock:\n   `shippingservice/quote.go` retorna `$0` se não houver itens ou\n   `$8.99` fixo caso contrário).\n5. Para cada item do carrinho: busca produto + converte preço + multiplica\n   pela quantidade (`money.MultiplySlow`).\n6. Soma tudo (`money.Sum`) incluindo o frete → `total_cost`.\n7. Renderiza o template `cart` com o formulário de checkout (endereço +\n   cartão de crédito) embutido na própria página.\n\n## 4.7 Passo 6 — Finalizar a compra (`POST /cart/checkout`) — o núcleo do domínio\n\nHandler: `placeOrderHandler` (`handlers.go:320`). É aqui que o cliente\nsubmete endereço de entrega + dados de cartão de crédito.\n\n1. O frontend monta um único `PlaceOrderRequest` (user_id = session_id,\n   moeda atual, endereço, e-mail, dados do cartão) e chama **uma única\n   RPC**: `CheckoutService.PlaceOrder`. A partir daqui, toda a orquestração\n   sai do `frontend` e passa a viver inteiramente dentro do\n   `checkoutservice` (`src/checkoutservice/main.go`, função `PlaceOrder`).\n\nDentro de `checkoutservice.PlaceOrder`, na ordem exata em que o código\nexecuta:\n\n```mermaid\nsequenceDiagram\n    participant U as Cliente (navegador)\n    participant FE as frontend\n    participant CO as checkoutservice\n    participant CART as cartservice (Redis)\n    participant CAT as productcatalogservice\n    participant CUR as currencyservice\n    participant SHIP as shippingservice\n    participant PAY as paymentservice\n    participant MAIL as emailservice\n\n    U->>FE: POST /cart/checkout (endereço + cartão)\n    FE->>CO: gRPC PlaceOrder(user_id, currency, address, email, credit_card)\n    CO->>CO: gera order_id (UUID)\n    CO->>CART: GetCart(user_id)\n    CART-->>CO: itens do carrinho\n    loop para cada item do carrinho\n        CO->>CAT: GetProduct(product_id)\n        CAT-->>CO: produto + preço USD\n        CO->>CUR: Convert(preço, user_currency)\n        CUR-->>CO: preço convertido\n    end\n    CO->>SHIP: GetQuote(address, itens)\n    SHIP-->>CO: frete em USD\n    CO->>CUR: Convert(frete, user_currency)\n    CUR-->>CO: frete convertido\n    CO->>CO: soma total = frete + Σ(preço x quantidade)\n    CO->>PAY: Charge(total, credit_card)\n    PAY-->>CO: transaction_id\n    CO->>SHIP: ShipOrder(address, itens)\n    SHIP-->>CO: tracking_id\n    CO->>CART: EmptyCart(user_id)\n    CART-->>CO: ok\n    CO->>MAIL: SendOrderConfirmation(email, order)\n    MAIL-->>CO: ok (falha aqui só gera warning, não aborta o pedido)\n    CO-->>FE: PlaceOrderResponse(OrderResult completo)\n    FE-->>U: página \"order\" com resumo do pedido\n```\n\nDetalhamento fiel ao código (`checkoutservice/main.go`):\n\n1. **Gera o `order_id`** — `uuid.NewUUID()`. É o único identificador do\n   pedido; não é persistido em nenhum banco.\n2. **`prepareOrderItemsAndShippingQuoteFromCart`**, que por sua vez:\n   a. `getUserCart` → `CartService.GetCart(user_id)`.\n   b. `prepOrderItems` → para **cada item do carrinho**, chama\n      `ProductCatalogService.GetProduct(product_id)` e depois\n      `CurrencyService.Convert(preço_usd, user_currency)` — ou seja, N\n      itens no carrinho = N chamadas a `productcatalogservice` + N\n      chamadas a `currencyservice`, feitas sequencialmente.\n   c. `quoteShipping` → `ShippingService.GetQuote(address, itens)` (em\n      USD).\n   d. `convertCurrency` do frete de USD para a moeda do usuário.\n3. **Calcula o total** somando frete + (preço unitário x quantidade) de\n   cada item, usando o pacote `money` (aritmética decimal exata baseada em\n   `units`/`nanos`, evitando ponto flutuante).\n4. **Cobra o cartão** — `chargeCard` → `PaymentService.Charge(total, credit_card)`.\n   No `paymentservice` (`src/paymentservice/charge.js`), a validação real\n   acontece:\n   - Número do cartão validado por `simple-card-validator`.\n   - Só aceita bandeiras **VISA** ou **Mastercard** (`UnacceptedCreditCard`\n     para qualquer outra).\n   - Verifica se a validade (mês/ano) já não expirou\n     (`ExpiredCreditCard`).\n   - Se tudo passar, gera um `transaction_id` aleatório (UUID) — **não há\n     gateway de pagamento real, é 100% mock**, mas os erros de validação\n     são reais e podem derrubar o checkout (o frontend devolve HTTP 500\n     ao cliente se a cobrança falhar).\n5. **Se a cobrança passou**, despacha o envio — `shipOrder` →\n   `ShippingService.ShipOrder(address, itens)`, que gera um `tracking_id`\n   pseudo-aleatório (`shippingservice/tracker.go`) — também mock, sem\n   transportadora real.\n6. **Esvazia o carrinho** — `emptyUserCart` → `CartService.EmptyCart(user_id)`.\n   Nota de comportamento: o código ignora explicitamente o erro dessa\n   chamada (`_ = cs.emptyUserCart(...)`) — mesmo que falhe, o pedido segue\n   como concluído.\n7. **Monta o `OrderResult`** (order_id, tracking_id, frete, endereço,\n   itens com custo) — esta struct nunca é salva em disco/banco; existe só\n   na resposta desta chamada e no corpo do e-mail do próximo passo.\n8. **Envia e-mail de confirmação** — `sendOrderConfirmation` →\n   `EmailService.SendOrderConfirmation(email, order)`. Se falhar, o erro é\n   **apenas logado como warning** — o pedido é considerado bem-sucedido\n   mesmo sem e-mail confirmado (única etapa do fluxo com esse tratamento\n   tolerante a falha; todas as outras chamadas gRPC, se falharem, abortam\n   o `PlaceOrder` inteiro com `codes.Internal`/`codes.Unavailable`).\n9. Retorna `PlaceOrderResponse{Order: orderResult}` ao frontend.\n\n## 4.8 Passo 7 — Página de confirmação\n\nDe volta no `frontend` (`placeOrderHandler`, após a RPC retornar):\n\n1. Busca novas recomendações (`getRecommendations`, sem produto de\n   referência) para incentivar uma nova compra.\n2. Recalcula o total pago somando frete + itens do `OrderResult` retornado\n   (para exibição — o valor \"oficial\" cobrado já veio do\n   `checkoutservice`).\n3. Renderiza o template `order` com o resumo: `order_id`, `tracking_id`,\n   endereço de entrega, itens comprados e total pago.\n\nA partir daqui o cliente pode continuar navegando (carrinho já está vazio)\nou sair (`GET /logout`, que apenas invalida o cookie de sessão).\n\n## 4.9 Onde uma falha interrompe a compra\n\n| Etapa | O que acontece se falhar |\n|---|---|\n| `CartService.GetCart` | Checkout aborta (`codes.Internal`) |\n| `ProductCatalogService.GetProduct` (por item) | Checkout aborta |\n| `CurrencyService.Convert` (preço ou frete) | Checkout aborta |\n| `ShippingService.GetQuote` | Checkout aborta |\n| `PaymentService.Charge` | Checkout aborta — cliente vê erro 500, nada é cobrado de fato pois é mock, mas a experiência falha |\n| `ShippingService.ShipOrder` | Checkout aborta **mesmo já tendo cobrado o cartão** (`codes.Unavailable`) — no código atual não há estorno/compensação, é uma falha de consistência conhecida deste app de demonstração |\n| `CartService.EmptyCart` | Ignorado silenciosamente — pedido segue como sucesso, carrinho pode continuar populado |\n| `EmailService.SendOrderConfirmation` | Ignorado (log de warning) — pedido segue como sucesso |\n\nEsse último ponto é relevante para quem for usar este repositório como\nreferência: **não existe transação distribuída nem saga de compensação** —\nse o pagamento for aprovado e o frete falhar, o cliente é cobrado (no mock)\nsem receber confirmação de pedido bem-sucedida.\n\n## 4.10 Fluxo simulado por tráfego sintético\n\nO `loadgenerator` (`src/loadgenerator/locustfile.py`) formaliza esse mesmo\nfluxo como comportamento de usuário simulado, com pesos relativos de\nfrequência por ação (`tasks` do Locust):\n\n`index` (peso 1) → `setCurrency` (peso 2) → `browseProduct` (peso 10) →\n`addToCart` (peso 2) → `viewCart` (peso 3) → `checkout` (peso 1), com\n`logout` disponível também. Ou seja, o próprio repositório documenta,\nem forma executável, que navegar produtos é ~10x mais comum que finalizar\numa compra — uma boa referência de proporção de tráfego esperado por etapa\ndo funil.\n", "README.md": "# Documentação de Domínio — Online Boutique (microservices-demo)\n\nEste conjunto de documentos descreve o domínio completo do repositório\n`microservices-demo` (Online Boutique, demo de e-commerce da Google), com base\nem leitura direta do código-fonte, dos manifests Kubernetes, do Helm chart, do\nTerraform e do Skaffold presentes no repositório.\n\nRepositório analisado (somente leitura):\n`/Users/guilhermesilvacastro/harness_corp/_bmad-output/skill-evals/sinter-documentar-workspace/fixtures/microservices-demo`\n\n## Índice\n\n1. [01-visao-geral-e-servicos.md](./01-visao-geral-e-servicos.md)\n   Visão geral do domínio, catálogo dos 11 microsserviços, linguagens,\n   responsabilidades e mapa de dependências.\n2. [02-comunicacao-entre-servicos.md](./02-comunicacao-entre-servicos.md)\n   Como os serviços conversam entre si: protocolo (gRPC/protobuf), contratos\n   (`protos/demo.proto`), endereços internos, diagrama de dependências e\n   padrões de resiliência (ou a falta deles).\n3. [03-infraestrutura-kubernetes.md](./03-infraestrutura-kubernetes.md)\n   A infraestrutura Kubernetes: Deployments, Services, probes, segurança,\n   Kustomize (base + componentes opcionais), Istio, Helm chart, Terraform e\n   pipeline Skaffold/CI.\n4. [04-fluxo-de-compra.md](./04-fluxo-de-compra.md)\n   O fluxo de compra do cliente passo a passo, da primeira visita à página\n   inicial até o e-mail de confirmação do pedido, com diagrama de sequência\n   e os pontos exatos do código onde cada etapa acontece.\n\n## Como este material foi produzido\n\nLeitura manual e direta dos seguintes artefatos do repositório (sem uso de\nferramenta de geração automática de documentação):\n\n- `README.md` (raiz) — descrição oficial da arquitetura.\n- `protos/demo.proto` — contrato gRPC único, compartilhado por todos os\n  serviços.\n- `src/checkoutservice/main.go` — orquestração completa do pedido.\n- `src/frontend/main.go` e `src/frontend/handlers.go` — rotas HTTP e chamadas\n  gRPC de saída do frontend.\n- `src/cartservice/src/Startup.cs` e `cartstore/*.cs` — persistência do\n  carrinho (Redis/Spanner/AlloyDB).\n- `src/paymentservice/charge.js`, `src/shippingservice/*.go`,\n  `src/recommendationservice/recommendation_server.py`,\n  `src/adservice/src/main/java/hipstershop/AdService.java`,\n  `src/shoppingassistantservice/shoppingassistantservice.py`.\n- `kubernetes-manifests/*.yaml` — manifests \"batteries-included\" (Deployment,\n  Service, ServiceAccount por serviço).\n- `kustomize/base` e `kustomize/components/*` — variantes de infraestrutura\n  (Spanner, AlloyDB, Memorystore, Istio, network policies, etc.).\n- `istio-manifests/*.yaml` — Gateway, VirtualServices e ServiceEntries.\n- `helm-chart/` — chart Helm equivalente aos manifests kustomize.\n- `terraform/` — provisionamento do cluster GKE e Memorystore no Google Cloud.\n- `skaffold.yaml` e `cloudbuild.yaml` — build/deploy multi-serviço e CI.\n- `src/loadgenerator/locustfile.py` — simulação do comportamento real do\n  cliente, usada para validar o fluxo de compra descrito no documento 4.\n"};
