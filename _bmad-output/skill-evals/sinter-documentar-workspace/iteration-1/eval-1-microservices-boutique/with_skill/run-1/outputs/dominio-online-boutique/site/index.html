e sistemas é síncrona via gRPC. Ver [eventos/README.md](./eventos/README.md) para a evidência completa. `[extracted]`\n\n## Como ler este repositório\n\n- Comunicação entre serviços (gRPC, quem chama quem): ver [subdominios/](./subdominios/) e as fichas em [sistemas/*/ficha.md](./sistemas/) (seções \"Expõe\"/\"Consome\"), com o contrato completo em [sistemas/README.md](./sistemas/README.md).\n- Infraestrutura Kubernetes: ver [infraestrutura/](./infraestrutura/).\n- Fluxo de compra passo a passo: ver [fluxos/compra-do-cliente.md](./fluxos/compra-do-cliente.md) (visão de negócio) e [fluxos/compra-do-cliente.sequencia.md](./fluxos/compra-do-cliente.sequencia.md) (sequência técnica completa).\n- Relatório de cobertura, conflitos e perguntas em aberto: [RELATORIO.md](./RELATORIO.md).\n"}, {"id": "cap-assistir-compra-com-ia", "kind": "capability", "camada": 1, "status": "proposed", "titulo": "Assistir a compra com IA (recurso opcional)", "resumo": "A empresa pode oferecer um assistente conversacional que sugere produtos do catálogo a partir de uma pergunta em linguagem natural do cliente (ex.: \"o que você recomenda para decorar minha sala?\"). É um recurso opt-in: só existe quando o co", "caminho": "capacidades/assistir-compra-com-ia.md", "realiza": [], "realizado_por": ["sub-assistente-de-compras"], "extracoes": ["inferred", "extracted"], "conflito": false, "corpo": "\n# Assistir a compra com IA (recurso opcional)\n\nA empresa pode oferecer um assistente conversacional que sugere produtos do catálogo a partir de uma pergunta em linguagem natural do cliente (ex.: \"o que você recomenda para decorar minha sala?\"). É um recurso opt-in: só existe quando o componente `kustomize/components/shopping-assistant` é aplicado e a env `ENABLE_ASSISTANT=true` está ligada no frontend. `[extracted — flag e componente kustomize condicionais; a natureza \"capacidade de negócio\" é inferred]`\n\n## Fluxos que a realizam\n- Sem fluxo macro dedicado documentado; tecnicamente é uma chamada  por que 3 backends de carrinho) não estão documentadas formalmente — o que está registrado nas fichas de sistema e nos padrões é inferido do próprio código. `[extracted — busca sem resultados]`\n\nSe a equipe mantiver ADRs em outro lugar (wiki, Google Docs), esse conteúdo não foi encontrado e deveria ser trazido para cá. `[pergunta para o arquiteto]`\n"}, {"id": "dom-online-boutique-eventos", "kind": "domain", "camada": 2, "status": "proposed", "titulo": "Eventos de domínio", "resumo": "Este domínio **não publica nem consome eventos assíncronos**. Foi buscado por bibliotecas e padrões de mensageria (Kafka, Pub/Sub, RabbitMQ/AMQP, SQS, SNS) em todo o código-fonte dos 12 serviços e não foi encontrado nenhum produtor ou consu", "caminho": "eventos/README.md", "realiza": ["dom-online-boutique"], "realizado_por": [], "extracoes": ["extracted", "extracted"], "conflito": false, "corpo": "\n# Eventos de domínio\n\nEste domínio **não publica nem consome eventos assíncronos**. Foi buscado por bibliotecas e padrões de mensageria (Kafka, Pub/Sub, RabbitMQ/AMQP, SQS, SNS) em todo o código-fonte dos 12 serviços e não foi encontrado nenhum produtor ou consumidor — apenas menções incidentais em `go.sum`/`package-lock.json` (dependências transitivas de bibliotecas de nuvem, não usadas para mensageria). `[extracted]`\n\nToda a integração entre sistemas é **síncrona, ponto a ponto, via gRPC**, definida em um único arquivo de contrato (`protos/demo.proto` no repositório-fonte), resumido em [sistemas/README.md](../sistemas/README.md). Não existe, portanto, tabela de \"Evento | Produtor | Consumidores | Contrato\" para preencher — cada chamada é uma requisição-resposta RPC documentada na ficha de cada sistema (seções \"Expõe\"/\"Consome\") e nas sequências em [fluxos/](../fluxos/).\n\n## Implicação para o negócio\n\nComo não há barramento de eventos, não existe hoje um jeito de outro sistema (ex.: um ERP, um data warehouse) \"escutar\" pedidos concluídos sem chamar diretamente o `checkoutservice` ou fazer polling. Isso é uma limitação arquitetural a registrar caso o domínio precise notificar sistemas externos no futuro. `[inferred]`\n"}, {"id": "flow-compra-do-cliente", "kind": "flow", "camada": 1, "status": "proposed", "titulo": "Compra do cliente", "resumo": "Objetivo: permitir que um visitante, sem se cadastrar, transforme o interesse em produtos em um pedido pago, com frete cotado e e-mail de confirmação — do primeiro clique na loja até a tela de \"pedido confirmado\". `[inferred a partir do com", "caminho": "fluxos/compra-do-cliente.md", "realiza": ["cap-vender-produtos-online"], "realizado_por": ["flow-compra-do-cliente-sequencia"], "extracoes": ["inferred", "extracted"], "conflito": false, "corpo": "\n# Compra do cliente\n\nObjetivo: permitir que um visitante, sem se cadastrar, transforme o interesse em produtos em um pedido pago, com frete cotado e e-mail de confirmação — do primeiro clique na loja até a tela de \"pedido confirmado\". `[inferred a partir do comportamento do frontend/checkoutservice; a intenção de negócio deve ser validada com o PM]`\n\n## Atores\n\n- **Cliente** — visitante da loja; não se autentica, é identificado por um cookie de sessão gerado automaticamente. `[extracted, src/frontend/middleware.go#L87-L107]`\n- **Loja** — o conjunto de sistemas do domínio, tratado aqui como um único ator de negócio (o detalhe de quem-fala-com-quem está na sequência técnica).\n- **Tráfego de teste** — o `loadgenerator` simula este mesmo fluxo automaticamente em ambientes de carga/demo, seguindo os mesmos passos de um cliente real. `[extracted, src/loadgenerator/locustfile.py#L44-L86]`\n\n## Etapas\n\n| # | Etapa | Ator | Decisão ou resultado | Técnica |\n|---|---|---|---|---|\n| 1 | Entra na loja e recebe uma sessão | Cliente | Cookie de sessão é criado se não existir | [passo 1](./compra-do-cliente.sequencia.md#passo-1-entrada-e-sessão) |\n| 2 | Navega a vitrine e abre produtos | Cliente | Vê preço já convertido para a moeda escolhida | [passo 2](./compra-do-cliente.sequencia.md#passo-2-vitrine-e-preço) |\n| 3 | Adiciona um ou mais produtos ao carrinho | Cliente | Carrinho persistido, associado à sessão | [passo 3](./compra-do-cliente.sequencia.md#passo-3-adicionar-ao-carrinho) |\n| 4 | Revisa o carrinho | Cliente | Vê itens, preços convertidos e recomendações relacionadas | [passo 4](./compra-do-cliente.sequencia.md#passo-4-revisar-carrinho) |\n| 5 | Preenche endereço de entrega e dados do cartão e confirma | Cliente | Formulário validado no frontend antes de seguir | [passo 5](./compra-do-cliente.sequencia.md#passo-5-envio-do-formulário-de-checkout) |\n| 6 | Loja monta o pedido a partir do carrinho | Loja | Busca cada item no catálogo e converte cada preço para a moeda do cliente | [passo 6](./compra-do-cliente.sequencia.md#passo-6-montagem-do-pedido) |\n| 7 | Loja cota e converte o frete | Loja | Cotação calculada e convertida para a moeda do cliente | [passo 7](./compra-do-cliente.sequencia.md#passo-7-cotação-de-frete) |\n| 8 | Loja cobra o cartão | Loja | **Se a cobrança falhar (cartão inválido, bandeira não aceita ou vencido) o pedido inteiro falha aqui** — não há oferecer outro meio de pagamento nesta versão | [passo 8](./compra-do-cliente.sequencia.md#passo-8-cobrança) |\n| 9 | Loja expede o pedido | Loja | Gera código de rastreio (mock) | [passo 9](./compra-do-cliente.sequencia.md#passo-9-expedição) |\n| 10 | Loja esvazia o carrinho do cliente | Loja | Efeito colateral; **se falhar, o erro é apenas logado e o pedido é confirmado do mesmo jeito** | [passo 10](./compra-do-cliente.sequencia.md#passo-10-esvaziar-carrinho) |\n| 11 | Loja envia e-mail de confirmação | Loja | Mock: não envia e-mail de verdade; **se falhar, o erro é apenas logado e o pedido é confirmado do mesmo jeito** | [passo 11](./compra-do-cliente.sequencia.md#passo-11-confirmação-por-e-mail) |\n| 12 | Cliente vê a confirmação do pedido | Cliente | Tela final com itens, total pago e recomendações | [passo 12](./compra-do-cliente.sequencia.md#passo-12-resposta-ao-cliente) |\n\n## Diagrama\n\n```mermaid\nflowchart LR\n  subgraph Cliente\n    A[Entra na loja] --> B[Navega produtos]\n    B --> C[Adiciona ao carrinho]\n    C --> D[Revisa carrinho]\n    D --> E[Preenche endereço e cartão]\n  end\n  subgraph Loja\n    E --> F[Monta o pedido e cota o frete]\n    F --> G{Cobrança aprovada?}\n    G -- sim --> H[Expede, esvazia carrinho, envia e-mail]\n    G -- não --> X[Pedido falha - erro exibido ao cliente]\n    H --> I[Confirma pedido]\n  end\n  subgraph Cliente2[Cliente]\n    I --> J[Vê confirmação e recomendações]\n  end\n```\n\n## Indicadores\n\nNenhum indicador de negócio (taxa de conversão, ticket médio, abandono de carrinho) está instrumentado no código além de logs técnicos e tracing OpenTelemetry — não há métricas de negócio expostas. `[extracted — ausência de client de métricas de negócio; a confirmar com o PM se existem fora do repositório]`\n\n## Regras que governam\n- [Bandeiras de cartão aceitas](../regras-de-negocio/bandeiras-de-cartao-aceitas.md)\n- [Cartão não pode estar vencido](../regras-de-negocio/cartao-nao-pode-estar-vencido.md)\n- [Sessão sem login](../regras-de-negocio/sessao-sem-login.md)\n- [Moedas suportadas para exibição](../regras-de-negocio/moedas-suportadas.md)\n- [Falhas de expedição e e-mail não revertem o pedido](../regras-de-negocio/falha-pos-cobranca-nao-reverte-pedido.md)\n"}, {"id": "flow-compra-do-cliente-sequencia", "kind": "flow", "camada": 3, "status": "proposed", "titulo": "Compra do cliente: sequência técnica", "resumo": "Realiza as etapas do [fluxo macro](./compra-do-cliente.md). Todas as chamadas entre sistemas são **gRPC síncronas**; a única chamada HTTP é do navegador para o `frontend`. Todos os endereços vêm de variáveis de ambiente do Deployment de cad", "caminho": "fluxos/compra-do-cliente.sequencia.md", "realiza": ["flow-compra-do-cliente"], "realizado_por": ["sys-frontend", "sys-cartservice", "sys-productcatalogservice", "sys-currencyservice", "sys-checkoutservice", "sys-paymentservice", "sys-shippingservice", "sys-emailservice", "sys-recommendationservice"], "extracoes": ["extracted", "extracted"], "conflito": false, "corpo": "\n# Compra do cliente: sequência técnica\n\nRealiza as etapas do [fluxo macro](./compra-do-cliente.md). Todas as chamadas entre sistemas são **gRPC síncronas**; a única chamada HTTP é do navegador para o `frontend`. Todos os endereços vêm de variáveis de ambiente do Deployment de cada serviço (ex.: `CART_SERVICE_ADDR=cartservice:7070`), fixadas nos manifestos Kubernetes. `[extracted, kubernetes-manifests/*.yaml]`\n\n## Diagrama 1 — Navegação e carrinho (passos 1 a 4)\n\n```mermaid\nsequenceDiagram\n  actor Cliente\n  participant FE as frontend\n  participant PC as productcatalogservice\n  participant CU as currencyservice\n  participant CT as cartservice\n  participant RC as recommendationservice\n\n  Cliente->>FE: GET / (sem cookie)\n  FE-->>Cliente: 200 + Set-Cookie shop_session-id=<uuid>\n  Cliente->>FE: GET /product/{id}\n  FE->>PC: GetProduct(id)\n  PC-->>FE: Product(price_usd, ...)\n  FE->>CU: Convert(price_usd -> moeda da sessão)\n  CU-->>FE: Money convertido\n  FE-->>Cliente: página do produto com preço convertido\n\n  Cliente->>FE: POST /cart {product_id, quantity}\n  FE->>CT: AddItem(session_id, product_id, quantity)\n  CT-->>FE: Empty (ok)\n  FE-->>Cliente: redireciona para /cart\n\n  Cliente->>FE: GET /cart\n  FE->>CT: GetCart(session_id)\n  CT-->>FE: Cart(items)\n  FE->>PC: GetProduct(id) para cada item\n  FE->>CU: Convert(...) para cada item\n  FE->>RC: ListRecommendations(session_id, product_ids do carrinho)\n  RC-->>FE: até N ids recomendados\n  FE->>PC: GetProduct(id) para cada recomendado\n  FE-->>Cliente: página do carrinho + recomendações (máx. 4)\n```\n`[extracted, src/frontend/handlers.go#L59-L318; src/frontend/rpc.go#L30-L117]`\n\n## Diagrama 2 — Checkout (passos 5 a 12)\n\n```mermaid\nsequenceDiagram\n  actor Cliente\n  participant FE as frontend\n  participant CO as checkoutservice\n  participant CT as cartservice\n  participant PC as productcatalogservice\n  participant CU as currencyservice\n  participant SH as shippingservice\n  participant PAY as paymentservice\n  participant EM as emailservice\n\n  Cliente->>FE: POST /cart/checkout (email, endereço, dados do cartão)\n  FE->>FE: valida payload (validator.PlaceOrderPayload)\n  alt payload inválido\n    FE-->>Cliente: 422 Unprocessable Entity\n  else payload válido\n    FE->>CO: PlaceOrder(user_id, user_currency, address, email, credit_card)\n    CO->>CT: GetCart(user_id)\n    CT-->>CO: itens do carrinho\n    loop cada item do carrinho\n      CO->>PC: GetProduct(product_id)\n      PC-->>CO: Product(price_usd)\n      CO->>CU: Convert(price_usd -> user_currency)\n      CU-->>CO: preço convertido\n    end\n    CO->>SH: GetQuote(address, items)\n    SH-->>CO: cost_usd (cotação mock por quantidade de itens)\n    CO->>CU: Convert(cost_usd -> user_currency)\n    CU-->>CO: frete convertido\n    CO->>PAY: Charge(total, credit_card)\n    alt cartão inválido, bandeira não aceita ou vencido\n      PAY-->>CO: erro (400)\n      CO-->>FE: Internal - \"failed to charge the card\"\n      FE-->>Cliente: 500 - erro ao completar o pedido (pedido NÃO é criado)\n    else cobrança aprovada\n      PAY-->>CO: transaction_id (uuid mock)\n      CO->>SH: ShipOrder(address, items)\n      SH-->>CO: tracking_id (mock)\n      CO->>CT: EmptyCart(user_id)\n      Note over CO,CT: se EmptyCart falhar, o erro é ignorado (best-effort)\n      CO->>EM: SendOrderConfirmation(email, order)\n      Note over CO,EM: se o e-mail falhar, o erro só é logado - não afeta a resposta\n      CO-->>FE: PlaceOrderResponse(order_id, tracking_id, items, shipping_cost)\n      FE-->>Cliente: 200 - página \"pedido confirmado\" + recomendações\n    end\n  end\n```\n`[extracted, src/checkoutservice/main.go#L237-L394; src/frontend/handlers.go#L320-L400]`\n\n## Passos\n\n### Passo 1: Entrada e sessão\nO navegador acessa `GET /`. O middleware do `frontend` lê o cookie `shop_session-id`; se ausente, gera um UUID e grava o cookie com validade de 48h (`cookieMaxAge = 60*60*48`). Esse valor é o `user_id`/`session_id` usado por todos os serviços a partir daqui — não há cadastro nem login. `[extracted, src/frontend/middleware.go#L87-L107; src/frontend/main.go#L41-L45]`\n\n### Passo 2: Vitrine e preço\nPara a home (`GET /`) e a página de produto (`GET /product/{id}`), o `frontend` busca produtos em `productcatalogservice.ListProducts`/`GetProduct` e converte cada `Money` para a moeda atual da sessão via `currencyservice.Convert`. A home também busca um anúncio contextual (`adservice.GetAds`) com timeout de 100 ms. `[extracted, src/frontend/handlers.go#L59-L210; src/frontend/rpc.go#L119-L124]`\n\n### Passo 3: Adicionar ao carrinho\n`POST /cart` chama `cartservice.AddItem(user_id, product_id, quantity)`. O `cartservice` lê o carrinho serializado (protobuf) do Redis (`redis-cart:6379`), soma a quantidade se o produto já existir, e regrava. `[extracted, src/frontend/handlers.go#L211-L238; src/cartservice/src/cartstore/RedisCartStore.cs#L32-L64]`\n\n### Passo 4: Revisar carrinho\n`GET /cart` busca o carrinho (`cartservice.GetCart`), resolve cada item no catálogo, converte os preços e busca recomendações (`recommendationservice.ListRecommendations`), que por sua vez são resolvidas de volta no catálogo. O `frontend` corta a lista de recomendações em no máximo 4 itens para caber na UI. `[extracted, src/frontend/handlers.go#L251-L318; src/frontend/rpc.go#L99-L117]`\n\n### Passo 5: Envio do formulário de checkout\n`POST /cart/checkout` traz e-mail, endereço (rua, cidade, estado, país, CEP) e dados do cartão (número, mês/ano de expiração, CVV). O `frontend` valida o payload (`validator.PlaceOrderPayload.Validate()`) **antes** de chamar o `checkoutservice`; falha aqui retorna 422 sem nenhuma chamada de rede adicional. `[extracted, src/frontend/handlers.go#L320-L352]`\n\n### Passo 6: Montagem do pedido\nO `checkoutservice.PlaceOrder` gera um `order_id` (UUID) e chama `cartservice.GetCart`. Para cada item, busca o produto no `productcatalogservice` e converte seu preço para a moeda do cliente via `currencyservice.Convert`, montando a lista de `OrderItem`. `[extracted, src/checkoutservice/main.go#L237-L260, #L296-L318]`\n\n### Passo 7: Cotação de frete\n`shippingservice.GetQuote` calcula um valor determinístico a partir da contagem total de itens (não depende do endereço de fato, embora o endereço seja passado no contrato). O resultado em USD é convertido para a moeda do cliente. `[extracted, src/shippingservice/main.go#L118-L138; src/checkoutservice/main.go#L279-L295]`\n\n### Passo 8: Cobrança\n`paymentservice.Charge` valida o número do cartão com `simple-card-validator`, aceita **somente Visa e MasterCard**, verifica que a expiração é no futuro e devolve um `transaction_id` aleatório — nenhuma cobrança real ocorre. Qualquer uma dessas validações falhando lança um erro que o `checkoutservice` propaga como falha da chamada `PlaceOrder` inteira. **Não existe fluxo de \"tentar outro cartão\" nesta versão** — a interação termina em erro para o cliente. `[extracted, src/paymentservice/charge.js#L61-L86; src/checkoutservice/main.go#L262-L266]`\n\n### Passo 9: Expedição\nSomente após a cobrança ser aprovada, `shippingservice.ShipOrder` é chamado e devolve um `tracking_id` mock (hash determinístico, não um código de rastreio real). `[extracted, src/shippingservice/main.go#L140-L154; src/checkoutservice/main.go#L268-L271]`\n\n### Passo 10: Esvaziar carrinho\n`cartservice.EmptyCart` é chamado para o `user_id`. O `checkoutservice` **descarta o erro** dessa chamada (`_ = cs.emptyUserCart(...)`) — se falhar, o carrinho pode continuar com os itens já comprados, mas o pedido é confirmado do mesmo jeito. `[extracted, src/checkoutservice/main.go#L273-L275]`\n\n### Passo 11: Confirmação por e-mail\n`emailservice.SendOrderConfirmation` é chamado com o resultado do pedido. O serviço apenas loga o \"envio\" (ou, em modo real, usa SendGrid se configurado) — é best-effort: o erro é logado como `Warn` e **não** interrompe a resposta ao cliente. `[extracted, src/checkoutservice/main.go#L277-L282; src/emailservice/email_server.py#L62-L109]`\n\n### Passo 12: Resposta ao cliente\nO `checkoutservice` devolve `PlaceOrderResponse` com o pedido completo. O `frontend` soma o total pago (itens + frete), busca recomendações adicionais e renderiza a página de confirmação. `[extracted, src/frontend/handlers.go#L354-L400]`\n\n## Caminho de erro (consolidado)\n\n| Chamada | Se falhar | Efeito no pedido |\n|---|---|---|\n| `cartservice.GetCart` | Erro retornado ao cliente (500) | Pedido não é criado |\n| `productcatalogservice.GetProduct` (por item) | Erro retornado ao cliente (500) | Pedido não é criado |\n| `currencyservice.Convert` (preço ou frete) | Erro retornado ao cliente (500) | Pedido não é criado |\n| `shippingservice.GetQuote` | Erro retornado ao cliente (500) | Pedido não é criado |\n| `paymentservice.Charge` | Erro retornado ao cliente (500) | **Pedido não é criado** — mas se o mock realmente cobrasse, isso seria uma cobrança sem pedido; risco a validar |\n| `shippingservice.ShipOrder` | Erro retornado ao cliente (503 Unavailable) | Cartão já foi cobrado; pedido não é criado — **inconsistência potencial: cliente pago sem pedido registrado** `[inferred — risco de negócio a confirmar]` |\n| `cartservice.EmptyCart` | Ignorado (log implícito via erro descartado) | Pedido é confirmado normalmente |\n| `emailservice.SendOrderConfirmation` | Logado como aviso | Pedido é confirmado normalmente |\n\nTodas as chamadas gRPC usam `grpc.NewClient` sem timeout nem retry explícitos por chamada (exceto `adservice`, que tem timeout de 100 ms no frontend) — na ausência de configuração de timeout/circuit breaker, o comportamento padrão do gRPC (bloqueante, sem deadline) se aplica. `[extracted — nenhuma chamada `context.WithTimeout` encontrada nos clients gRPC do checkoutservice, exceto no chooseAd do frontend]`\n"}, {"id": "term-cotacao-de-frete", "kind": "term", "camada": 0, "status": "proposed", "titulo": "Cotação de frete", "resumo": "Valor em USD devolvido por `shippingservice.GetQuote`, calculado apenas a partir da contagem total de itens do carrinho — o endereço de entrega é recebido no contrato mas não influencia o cálculo neste mock.", "caminho": "glossario/cotacao-de-frete.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Cotação de frete\n\nValor em USD devolvido por `shippingservice.GetQuote`, calculado apenas a partir da contagem total de itens do carrinho — o endereço de entrega é recebido no contrato mas não influencia o cálculo neste mock.\n\nNão confundir com: \"expedição\"/\"ShipOrder\" (a ação de despachar, que gera o código de rastreio; é uma chamada separada, feita depois da cobrança aprovada).\n"}, {"id": "term-moeda-de-exibicao", "kind": "term", "camada": 0, "status": "proposed", "titulo": "Moeda de exibição", "resumo": "Código ISO 4217 (ex.: `USD`, `EUR`, `BRL`) escolhido pelo cliente via `POST /setCurrency` e guardado no cookie `shop_currency`. Todo preço mostrado — e o total cobrado no checkout — é convertido para esta moeda a partir do preço-base em USD", "caminho": "glossario/moeda-de-exibicao.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Moeda de exibição\n\nCódigo ISO 4217 (ex.: `USD`, `EUR`, `BRL`) escolhido pelo cliente via `POST /setCurrency` e guardado no cookie `shop_currency`. Todo preço mostrado — e o total cobrado no checkout — é convertido para esta moeda a partir do preço-base em USD do catálogo.\n\nNão confundir com: a moeda em que o catálogo é definido internamente (sempre USD, campo `price_usd` de `Product`).\n"}, {"id": "term-pedido", "kind": "term", "camada": 0, "status": "proposed", "titulo": "Pedido (OrderResult)", "resumo": "Resultado devolvido por `checkoutservice.PlaceOrder`: id do pedido, itens com preço convertido, custo e endereço de frete, e código de rastreio. **Não é persistido em nenhum banco** — existe apenas na resposta da chamada e na tela de confir", "caminho": "glossario/pedido.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Pedido (OrderResult)\n\nResultado devolvido por `checkoutservice.PlaceOrder`: id do pedido, itens com preço convertido, custo e endereço de frete, e código de rastreio. **Não é persistido em nenhum banco** — existe apenas na resposta da chamada e na tela de confirmação exibida ao cliente.\n\nNão confundir com: \"carrinho\" (existe antes do checkout e é apagado depois dele); \"transação\" (é o retorno do `paymentservice`, um simples UUID, não o pedido inteiro).\n"}, {"id": "term-sessao", "kind": "term", "camada": 0, "status": "proposed", "titulo": "Sessão", "resumo": "Identificador único (UUID) atribuído automaticamente a cada visitante da loja no primeiro acesso, guardado no cookie `shop_session-id`. É o mesmo valor usado como `user_id` em `cartservice` e `checkoutservice` — não representa uma conta de ", "caminho": "glossario/sessao.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Sessão\n\nIdentificador único (UUID) atribuído automaticamente a cada visitante da loja no primeiro acesso, guardado no cookie `shop_session-id`. É o mesmo valor usado como `user_id` em `cartservice` e `checkoutservice` — não representa uma conta de cliente cadastrada.\n\nNão confundir com: \"usuário\" ou \"conta\" (não existem no domínio); \"carrinho\" (é o dado associado à sessão, não a sessão em si).\n"}, {"id": "env-producao-gke", "kind": "environment", "camada": 6, "status": "proposed", "titulo": "Ambiente padrão (base Kubernetes / GKE Autopilot)", "resumo": "Configuração de referência do repositório: um único namespace, 11 Deployments + Services de aplicação, mais o Redis in-cluster. Sem overlay aplicado, este é o comportamento: backend de carrinho = Redis in-cluster, sem malha Istio, sem assis", "caminho": "infraestrutura/ambientes/producao-gke.md", "realiza": ["dom-online-boutique"], "realizado_por": ["res-gke-autopilot", "res-redis-cart"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Ambiente padrão (base Kubernetes / GKE Autopilot)\n\nConfiguração de referência do repositório: um único namespace, 11 Deployments + Services de aplicação, mais o Redis in-cluster. Sem overlay aplicado, este é o comportamento: backend de carrinho = Redis in-cluster, sem malha Istio, sem assistente de IA, com `loadgenerator` ativo. `[extracted, kubernetes-manifests/kustomization.yaml]`\n\n## Implantação\n\n```mermaid\nflowchart TB\n  subgraph gke[\"Cluster GKE Autopilot\"]\n    subgraph ns[\"namespace default\"]\n      FE[frontend :8080] \n      CO[checkoutservice :5050]\n      CT[cartservice :7070]\n      PC[productcatalogservice :3550]\n      CU[currencyservice :7000]\n      PAY[paymentservice :50051]\n      SH[shippingservice :50051]\n      EM[emailservice :5000-8080]\n      RC[recommendationservice :8080]\n      AD[adservice :9555]\n      LG[loadgenerator]\n      REDIS[(redis-cart :6379 - emptyDir)]\n    end\n  end\n  Cliente((Cliente)) -->|LoadBalancer :80| FE\n  LG --> FE\n  CT --> REDIS\n```\n`[extracted, kubernetes-manifests/*.yaml — portas e nomes de Service extraídos de cada manifesto]`\n\n## Segurança de container (aplicada a todos os Deployments)\n`runAsNonRoot`, `runAsUser/Group 1000`, `readOnlyRootFilesystem: true`, `allowPrivilegeEscalation: false`, `capabilities.drop: [ALL]` — ver [padrão de segurança de containers](../../padroes/seguranca-de-containers.md). `[extracted, presente em todos os `kubernetes-manifests/*.yaml`]`\n\n## Probes\nTodo serviço gRPC usa `readinessProbe`/`livenessProbe` do tipo `grpc` na própria porta do serviço (recurso nativo do Kubernetes ≥ 1.24, sem sidecar de grpc_health_probe). O `frontend` usa `httpGet /_healthz`. `[extracted]`\n"}, {"id": "env-variantes-kustomize", "kind": "environment", "camada": 6, "status": "proposed", "titulo": "Variantes de implantação (componentes Kustomize)", "resumo": "O mesmo conjunto de manifestos base pode ser combinado com \"componentes\" Kustomize (`kustomize/components/*`) para trocar comportamento sem alterar código. Cada linha abaixo é independente e combinável (exceto os 3 backends de carrinho, mut", "caminho": "infraestrutura/ambientes/variantes-kustomize.md", "realiza": ["dom-online-boutique"], "realizado_por": ["res-memorystore-redis", "res-spanner-cartservice", "res-alloydb", "res-service-mesh-istio"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Variantes de implantação (componentes Kustomize)\n\nO mesmo conjunto de manifestos base pode ser combinado com \"componentes\" Kustomize (`kustomize/components/*`) para trocar comportamento sem alterar código. Cada linha abaixo é independente e combinável (exceto os 3 backends de carrinho, mutuamente exclusivos). `[extracted, kustomize/components/*/kustomization.yaml]`\n\n| Componente | Efeito |\n|---|---|\n| `memorystore` | Troca `redis-cart` in-cluster por [Memorystore gerenciado](../recursos/memorystore-redis.md); único provisionado pelo Terraform deste repo |\n| `spanner` | Troca o backend do cartservice para [Cloud Spanner](../recursos/spanner-cartservice.md) (instância externa assumida) |\n| `alloydb` | Troca o backend do cartservice para [AlloyDB](../recursos/alloydb.md) (instância externa assumida) |\n| `shopping-assistant` | Adiciona o Deployment do `shoppingassistantservice` e liga `ENABLE_ASSISTANT=true` no frontend |\n| `service-mesh-istio` | Adiciona Gateway/VirtualService Istio e regra de egress para `*.googleapis.com` |\n| `cymbal-branding` | Reskin visual do frontend (variável `CYMBAL_BRANDING=true`) — sem impacto funcional |\n| `non-public-frontend` | Remove o Service `LoadBalancer` externo do frontend (torna a loja acessível só de dentro do cluster) |\n| `network-policies` | Adiciona uma `NetworkPolicy` por serviço restringindo tráfego leste-oeste |\n| `without-loadgenerator` | Remove o Deployment do `loadgenerator` |\n| `single-shared-session` | Fixa uma única sessão compartilhada (útil para demos/testes, não para produção real) |\n| `google-cloud-operations` | Integra logging/tracing/profiling gerenciado do Google Cloud |\n| `container-images-registry` / `-tag` / `-tag-suffix` / `custom-base-url` | Parâmetros de build/publicação de imagem, não afetam comportamento de negócio |\n\n## Diferenças-chave entre ambientes\n\n- **Persistência do carrinho**: só é duradoura fora do padrão (`memorystore`, `spanner` ou `alloydb`); no padrão, um restart do pod `redis-cart` apaga todos os carrinhos ativos (`emptyDir`).\n- **Exposição pública**: padrão usa `Service` `LoadBalancer`; `non-public-frontend` e/ou `service-mesh-istio` mudam esse caminho.\n- **Recurso de IA**: só existe com `shopping-assistant` + AlloyDB configurado.\n\n## Pergunta em aberto\nQual combinação destes componentes representa o ambiente de **produção real** da empresa (se este repositório for adaptado além da demo)? O repositório, por si, não declara uma combinação \"canônica\" de produção. `[pergunta para arquiteto/infra]`\n"}, {"id": "res-alloydb", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "AlloyDB", "resumo": "Assim como o Spanner, não é provisionado pelo Terraform deste repositório — o overlay assume uma instância AlloyDB já existente. `[extracted]`", "caminho": "infraestrutura/recursos/alloydb.md", "realiza": ["sys-cartservice", "sys-shoppingassistantservice"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# AlloyDB\n\n| Campo | Valor |\n|---|---|\n| Tipo | banco (Postgres-compatível gerenciado) |\n| Tecnologia | Google Cloud AlloyDB |\n| Ambientes | Opcional — overlays `kustomize/components/alloydb` (cartservice) e `kustomize/components/shopping-assistant` (vetor de produtos) |\n| Definido em | `kustomize/components/alloydb/kustomization.yaml`; consumido em código por `src/cartservice/src/cartstore/AlloyDBCartStore.cs` e `src/shoppingassistantservice/shoppingassistantservice.py#L26-L60` |\n\n## Usado por\n- cartservice — como terceiro backend possível de carrinho (`ALLOYDB_PRIMARY_IP`)\n- shoppingassistantservice — como vector store de embeddings de produto (`AlloyDBVectorStore`), com a senha buscada no [Secret Manager](./secret-manager.md)\n\n## Observação\nAssim como o Spanner, não é provisionado pelo Terraform deste repositório — o overlay assume uma instância AlloyDB já existente. `[extracted]`\n"}, {"id": "res-gke-autopilot", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "Cluster GKE Autopilot", "resumo": "O Terraform, além de criar o cluster, habilita as APIs do Google Cloud necessárias (`container`, `monitoring`, `cloudtrace`, `cloudprofiler`, e `redis` se `var.memorystore=true`) e aplica os manifestos via `kubectl apply -k ${var.filepath_m", "caminho": "infraestrutura/recursos/gke-autopilot-cluster.md", "realiza": ["dom-online-boutique"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Cluster GKE Autopilot\n\n| Campo | Valor |\n|---|---|\n| Tipo | cluster Kubernetes |\n| Tecnologia | Google Kubernetes Engine, modo Autopilot (`enable_autopilot = true`) |\n| Ambientes | Provisionamento de referência (`terraform apply`), nome e região vêm de `var.name`/`var.region` |\n| Definido em | `terraform/main.tf#L40-L60`, variáveis em `terraform/variables.tf` |\n\n## Usado por\n- Todos os 12 sistemas do domínio — é o único cluster onde tudo roda.\n\n## Provisionamento\n\nO Terraform, além de criar o cluster, habilita as APIs do Google Cloud necessárias (`container`, `monitoring`, `cloudtrace`, `cloudprofiler`, e `redis` se `var.memorystore=true`) e aplica os manifestos via `kubectl apply -k ${var.filepath_manifest}` (Kustomize), esperando os pods ficarem prontos. `[extracted, terraform/main.tf#L16-L98]`\n"}, {"id": "res-memorystore-redis", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "Memorystore (Redis gerenciado)", "resumo": "Esta é a única alternativa aos três backends do `cartservice` que é efetivamente **provisionada por este próprio Terraform**; Spanner e AlloyDB (ver [res-spanner-cartservice](./spanner-cartservice.md), [res-alloydb](./alloydb.md)) são assum", "caminho": "infraestrutura/recursos/memorystore-redis.md", "realiza": ["sys-cartservice"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Memorystore (Redis gerenciado)\n\n| Campo | Valor |\n|---|---|\n| Tipo | banco (cache gerenciado) |\n| Tecnologia | Google Cloud Memorystore for Redis 7.0, 1 GB |\n| Ambientes | Opcional — só é criado se a variável Terraform `memorystore = true`; substitui o `redis-cart` in-cluster |\n| Definido em | `terraform/memorystore.tf` (`google_redis_instance.redis-cart`) |\n\n## Usado por\n- cartservice — quando o overlay `kustomize/components/memorystore` está ativo, que substitui `REDIS_ADDR` pelo host:porta real da instância (o Terraform reescreve o `kustomization.yaml` do componente via `sed`, trocando o placeholder `REDIS_CONNECTION_STRING`). `[extracted, terraform/memorystore.tf#L32-L45]`\n\n## Observação\nEsta é a única alternativa aos três backends do `cartservice` que é efetivamente **provisionada por este próprio Terraform**; Spanner e AlloyDB (ver [res-spanner-cartservice](./spanner-cartservice.md), [res-alloydb](./alloydb.md)) são assumidos como já existentes/providos fora deste repositório.\n"}, {"id": "res-redis-cart", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "redis-cart", "resumo": "O volume é `emptyDir` — **não sobrevive a um restart do pod**; o carrinho é efetivamente descartável/não durável neste ambiente padrão. `[extracted]`", "caminho": "infraestrutura/recursos/redis-cart.md", "realiza": ["sys-cartservice"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# redis-cart\n\n| Campo | Valor |\n|---|---|\n| Tipo | banco (cache in-memory) |\n| Tecnologia | Redis (imagem `redis:alpine`, container `redis` no mesmo manifesto do `cartservice`) |\n| Ambientes | Padrão em todos os ambientes que usam a base do `kubernetes-manifests/` sem overlay; removido pelos overlays `memorystore`, `spanner` e `alloydb` |\n| Definido em | `kubernetes-manifests/cartservice.yaml` (Deployment `redis-cart`, Service `redis-cart:6379`, volume `emptyDir` chamado `redis-data`) |\n\n## Usado por\n- cartservice — leitura e escrita do carrinho (`REDIS_ADDR=redis-cart:6379`)\n\n## Observação\nO volume é `emptyDir` — **não sobrevive a um restart do pod**; o carrinho é efetivamente descartável/não durável neste ambiente padrão. `[extracted]`\n"}, {"id": "res-secret-manager", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "Secret Manager (segredo do AlloyDB)", "resumo": "Nenhum valor de segredo foi copiado para esta documentação — apenas o nome da variável que aponta para ele (`ALLOYDB_SECRET_NAME`), conforme registrado no [RELATORIO.md](../../RELATORIO.md).", "caminho": "infraestrutura/recursos/secret-manager.md", "realiza": ["sys-shoppingassistantservice"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Secret Manager (segredo do AlloyDB)\n\n| Campo | Valor |\n|---|---|\n| Tipo | segredo (não é banco/fila, mas registrado aqui por ser um recurso de infra citado no código) |\n| Tecnologia | Google Secret Manager |\n| Ambientes | Só quando `shoppingassistantservice` está habilitado |\n| Definido em | Nome do segredo vem da env `ALLOYDB_SECRET_NAME`; valor buscado em runtime via `secretmanager_v1.SecretManagerServiceClient` |\n\n## Usado por\n- shoppingassistantservice — senha do usuário `postgres` do AlloyDB\n\n## Achado de segurança\nNenhum valor de segredo foi copiado para esta documentação — apenas o nome da variável que aponta para ele (`ALLOYDB_SECRET_NAME`), conforme registrado no [RELATORIO.md](../../RELATORIO.md).\n"}, {"id": "res-service-mesh-istio", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "Malha de serviço (Istio / Cloud Service Mesh)", "resumo": "Este é um caminho de rede **alternativo**, não cumulativo por padrão, ao `Service` `frontend-external` (`LoadBalancer`) já definido em `kubernetes-manifests/frontend.yaml`. Qual dos dois é usado em produção depende de qual conjunto de manif", "caminho": "infraestrutura/recursos/service-mesh-istio.md", "realiza": ["sys-frontend"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Malha de serviço (Istio / Cloud Service Mesh)\n\n| Campo | Valor |\n|---|---|\n| Tipo | gateway / malha de serviço |\n| Tecnologia | Istio (`networking.istio.io/v1alpha3`) — Gateway + VirtualService |\n| Ambientes | Opcional — pasta `istio-manifests/` aplicada à parte, e/ou overlay `kustomize/components/service-mesh-istio` |\n| Definido em | `istio-manifests/frontend-gateway.yaml` (Gateway `frontend-gateway` na porta 80, VirtualService `frontend-ingress` roteando tudo para o serviço `frontend`), `istio-manifests/allow-egress-googleapis.yaml` |\n\n## Usado por\n- frontend — recebe o tráfego externo através deste Gateway em vez do `Service` `LoadBalancer` padrão\n- Todos os serviços, indiretamente, via anotação `sidecar.istio.io/rewriteAppHTTPProbers: \"true\"` presente no manifesto do `frontend` `[extracted, kubernetes-manifests/frontend.yaml#L28-L29]`\n\n## Observação\nEste é um caminho de rede **alternativo**, não cumulativo por padrão, ao `Service` `frontend-external` (`LoadBalancer`) já definido em `kubernetes-manifests/frontend.yaml`. Qual dos dois é usado em produção depende de qual conjunto de manifestos foi aplicado — não está explícito no repositório qual é o padrão real de produção. `[inferred — pergunta para o time de infra]`\n"}, {"id": "res-spanner-cartservice", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "Cloud Spanner (backend alternativo do cartservice)", "resumo": "**Este componente Kustomize não cria a instância Spanner** — ele só aponta o serviço para uma instância que precisa existir previamente (o placeholder `SPANNER_DB_USER_GSA_ID` precisa ser preenchido manualmente). Não há Terraform correspond", "caminho": "infraestrutura/recursos/spanner-cartservice.md", "realiza": ["sys-cartservice"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Cloud Spanner (backend alternativo do cartservice)\n\n| Campo | Valor |\n|---|---|\n| Tipo | banco (relacional distribuído) |\n| Tecnologia | Google Cloud Spanner |\n| Ambientes | Opcional — overlay `kustomize/components/spanner` |\n| Definido em | `kustomize/components/spanner/kustomization.yaml` (troca env `REDIS_ADDR` por `SPANNER_PROJECT`/`SPANNER_CONNECTION_STRING`, remove o Deployment/Service `redis-cart`, anota a ServiceAccount do `cartservice` com Workload Identity para uma conta de serviço do GCP) |\n\n## Usado por\n- cartservice — via `SpannerCartStore.cs`\n\n## Observação\n**Este componente Kustomize não cria a instância Spanner** — ele só aponta o serviço para uma instância que precisa existir previamente (o placeholder `SPANNER_DB_USER_GSA_ID` precisa ser preenchido manualmente). Não há Terraform correspondente neste repositório. `[extracted — ausência de recurso `google_spanner_*` em terraform/]`\n"}, {"id": "dom-online-boutique-relacoes", "kind": "domain", "camada": 2, "status": "proposed", "titulo": "Relações com outros domínios", "resumo": "O repositório documenta um único domínio autocontido (demo de referência); não há outro domínio de negócio (ex.: \"Estoque\", \"Contabilidade\", \"Marketing\") no mesmo repositório ou citado em documentação para relacionar. `[inferred — repositór", "caminho": "mapa/relacoes-com-outros-dominios.md", "realiza": ["dom-online-boutique"], "realizado_por": [], "extracoes": ["inferred"], "conflito": false, "corpo": "\n# Relações com outros domínios\n\nO repositório documenta um único domínio autocontido (demo de referência); não há outro domínio de negócio (ex.: \"Estoque\", \"Contabilidade\", \"Marketing\") no mesmo repositório ou citado em documentação para relacionar. `[inferred — repositório é um monorepo de demonstração isolado]`\n\nAs únicas fronteiras externas observadas são técnicas, não de domínio de negócio:\n\n| Fronteira externa | Natureza | Sistema que a implementa |\n|---|---|---|\n| Envio de e-mail | Simulado (loga e retorna sucesso; não integra provedor real) | [emailservice](../sistemas/emailservice/ficha.md) |\n| Cobrança de cartão | Simulado (valida formato/bandeira/validade e devolve um UUID como \"transação\") | [paymentservice](../sistemas/paymentservice/ficha.md) |\n| Cotação de câmbio | Dados estáticos embutidos (`currency_conversion.json`, rotulado como vindo do Banco Central Europeu) | [currencyservice](../sistemas/currencyservice/ficha.md) |\n| Frete | Simulado (cálculo determinístico por quantidade de itens; não integra transportadora) | [shippingservice](../sistemas/shippingservice/ficha.md) |\n| Assistente de compras (IA) | Real, se habilitado: usa Gemini (Google Generative AI) e AlloyDB como vector store | [shoppingassistantservice](../sistemas/shoppingassistantservice/ficha.md) |\n\n## Pergunta em aberto\n\nSe este domínio for integrado a outros domínios de negócio da empresa (ex.: um domínio real de Pagamentos ou de Logística), qual será o mecanismo de integração — chamada síncrona adicional ou introdução de um barramento de eventos? Hoje nada no código sustenta essa integração. `[pergunta para arquiteto]`\n"}, {"id": "std-comunicacao-sincrona-grpc", "kind": "standard", "camada": 0, "status": "proposed", "titulo": "Comunicação síncrona via gRPC, um contrato compartilhado", "resumo": "Todo sistema interno do domínio (exceto o `shoppingassistantservice`, HTTP/Flask) implementa um serviço gRPC gerado a partir do mesmo arquivo `protos/demo.proto`, versionado uma vez no monorepo e copiado (`genproto/`) para cada linguagem. N", "caminho": "padroes/comunicacao-sincrona-grpc.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Comunicação síncrona via gRPC, um contrato compartilhado\n\nTodo sistema interno do domínio (exceto o `shoppingassistantservice`, HTTP/Flask) implementa um serviço gRPC gerado a partir do mesmo arquivo `protos/demo.proto`, versionado uma vez no monorepo e copiado (`genproto/`) para cada linguagem. Não há mensageria assíncrona (ver [eventos/README.md](../eventos/README.md)) — toda dependência entre sistemas é uma chamada bloqueante requisição-resposta.\n\n## Exemplo\n`checkoutservice` chama `pb.NewPaymentServiceClient(cs.paymentSvcConn).Charge(ctx, &pb.ChargeRequest{...})` — o mesmo padrão (`pb.New<Serviço>Client(conn).<Método>(ctx, &pb.<Request>{...})`) se repete em todos os clients gRPC do domínio, em todas as linguagens.\n\n## Onde se aplica\nTodas as chamadas entre `frontend`, `checkoutservice`, `cartservice`, `productcatalogservice`, `currencyservice`, `recommendationservice`, `adservice`, `shippingservice`, `paymentservice`, `emailservice`.\n"}, {"id": "std-healthcheck-grpc", "kind": "standard", "camada": 0, "status": "proposed", "titulo": "Health check padrão gRPC", "resumo": "Todo serviço gRPC do domínio registra o serviço padrão `grpc.health.v1.Health` (`Check`/`Watch`), consumido pelas probes nativas `readinessProbe.grpc`/`livenessProbe.grpc` do Kubernetes — sem sidecar externo de health check. Na maioria dos ", "caminho": "padroes/healthcheck-grpc.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Health check padrão gRPC\n\nTodo serviço gRPC do domínio registra o serviço padrão `grpc.health.v1.Health` (`Check`/`Watch`), consumido pelas probes nativas `readinessProbe.grpc`/`livenessProbe.grpc` do Kubernetes — sem sidecar externo de health check. Na maioria dos serviços, `Check` sempre devolve `SERVING` sem de fato testar as dependências (bancos, outros serviços).\n\n## Exemplo\n```go\nfunc (cs *checkoutService) Check(ctx context.Context, req *healthpb.HealthCheckRequest) (*healthpb.HealthCheckResponse, error) {\n\treturn &healthpb.HealthCheckResponse{Status: healthpb.HealthCheckResponse_SERVING}, nil\n}\n```\n\n## Onde se aplica\nTodos os serviços gRPC Go/Node/Python/C#/Java do domínio.\n"}, {"id": "std-seguranca-de-containers", "kind": "standard", "camada": 0, "status": "proposed", "titulo": "Segurança de containers (baseline Kubernetes)", "resumo": "Todo `Deployment` do domínio define o mesmo `securityContext` restritivo, tanto no pod quanto no container: `runAsNonRoot: true`, `runAsUser`/`runAsGroup: 1000`, `fsGroup: 1000`, `readOnlyRootFilesystem: true`, `allowPrivilegeEscalation: fa", "caminho": "padroes/seguranca-de-containers.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Segurança de containers (baseline Kubernetes)\n\nTodo `Deployment` do domínio define o mesmo `securityContext` restritivo, tanto no pod quanto no container: `runAsNonRoot: true`, `runAsUser`/`runAsGroup: 1000`, `fsGroup: 1000`, `readOnlyRootFilesystem: true`, `allowPrivilegeEscalation: false`, `privileged: false`, `capabilities.drop: [ALL]`. Cada serviço também tem sua própria `ServiceAccount` dedicada (mesmo nome do serviço).\n\n## Exemplo\n```yaml\nsecurityContext:\n  allowPrivilegeEscalation: false\n  capabilities:\n    drop: [ALL]\n  privileged: false\n  readOnlyRootFilesystem: true\n```\n\n## Onde se aplica\nTodos os 12 manifestos em `kubernetes-manifests/*.yaml`.\n"}, {"id": "rule-bandeiras-de-cartao-aceitas", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "Bandeiras de cartão aceitas", "resumo": "Somente cartões **Visa** e **MasterCard** são aceitos. Qualquer outra bandeira identificada (ex.: American Express, Diners Club) é rejeitada com a mensagem \"Sorry, we cannot process {bandeira} credit cards. Only VISA or MasterCard is accept", "caminho": "regras-de-negocio/bandeiras-de-cartao-aceitas.md", "realiza": [], "realizado_por": ["cmp-paymentservice-charge"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Bandeiras de cartão aceitas\n\nSomente cartões **Visa** e **MasterCard** são aceitos. Qualquer outra bandeira identificada (ex.: American Express, Diners Club) é rejeitada com a mensagem \"Sorry, we cannot process {bandeira} credit cards. Only VISA or MasterCard is accepted.\" `[extracted]`\n\n## Onde está implementada\n- `src/paymentservice/charge.js` (classe `UnacceptedCreditCard`, função `charge`)\n"}, {"id": "rule-cartao-nao-pode-estar-vencido", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "Cartão não pode estar vencido", "resumo": "A cobrança só é aceita se `ano_expiração*12 + mês_expiração >= ano_atual*12 + mês_atual`; caso contrário a cobrança é recusada com `ExpiredCreditCard`. `[extracted]`", "caminho": "regras-de-negocio/cartao-nao-pode-estar-vencido.md", "realiza": [], "realizado_por": ["cmp-paymentservice-charge"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Cartão não pode estar vencido\n\nA cobrança só é aceita se `ano_expiração*12 + mês_expiração >= ano_atual*12 + mês_atual`; caso contrário a cobrança é recusada com `ExpiredCreditCard`. `[extracted]`\n\n## Onde está implementada\n- `src/paymentservice/charge.js#L76-L80`\n"}, {"id": "rule-falha-pos-cobranca-nao-reverte-pedido", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "Falhas após a cobrança não revertem o pedido (nem sempre bloqueiam)", "resumo": "Depois que `paymentservice.Charge` é aprovado:", "caminho": "regras-de-negocio/falha-pos-cobranca-nao-reverte-pedido.md", "realiza": [], "realizado_por": ["cmp-checkoutservice-placeorder"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Falhas após a cobrança não revertem o pedido (nem sempre bloqueiam)\n\nDepois que `paymentservice.Charge` é aprovado:\n- se `EmptyCart` falhar, o erro é descartado (`_ = cs.emptyUserCart(...)`) e o pedido segue confirmado;\n- se `SendOrderConfirmation` falhar, o erro é logado como aviso e o pedido segue confirmado;\n- **mas** se `ShipOrder` falhar, o `PlaceOrder` inteiro retorna erro ao cliente (`codes.Unavailable`) — mesmo com o cartão já cobrado e sem nenhum estorno automático.\n\nNão existe compensação/saga: nenhuma chamada de estorno ao `paymentservice` acontece em nenhum desses casos de erro. `[extracted]`\n\n## Onde está implementada\n- `src/checkoutservice/main.go#L262-L282`\n\n## Conflito\nNão há conflito de fontes aqui — é um comportamento único e claro no código. Está registrado como regra por ser uma decisão de negócio implícita e arriscada (cliente pode pagar e não ter pedido caso o frete falhe), a validar com o PM/tech lead.\n"}, {"id": "rule-limite-de-anuncios-servidos", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "Limite de anúncios servidos", "resumo": "No máximo `MAX_ADS_TO_SERVE = 2` anúncios são devolvidos por chamada, tanto no caso de correspondência por categoria quanto no fallback aleatório. O `frontend` chama esse serviço com timeout de 100 ms e ignora silenciosamente qualquer falha", "caminho": "regras-de-negocio/limite-de-anuncios-servidos.md", "realiza": [], "realizado_por": ["sys-adservice"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Limite de anúncios servidos\n\nNo máximo `MAX_ADS_TO_SERVE = 2` anúncios são devolvidos por chamada, tanto no caso de correspondência por categoria quanto no fallback aleatório. O `frontend` chama esse serviço com timeout de 100 ms e ignora silenciosamente qualquer falha/estouro de tempo. `[extracted]`\n\n## Onde está implementada\n- `src/adservice/src/main/java/hipstershop/AdService.java#L46`\n- `src/frontend/rpc.go#L119-L124` (timeout de 100 ms)\n"}, {"id": "rule-moedas-suportadas", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "Moedas suportadas para exibição", "resumo": "O `currencyservice` conhece um conjunto de códigos de moeda (arquivo `data/currency_conversion.json`), mas o `frontend` filtra essa lista por uma whitelist própria (`whitelistedCurrencies`) antes de oferecer ao cliente — ou seja, a moeda te", "caminho": "regras-de-negocio/moedas-suportadas.md", "realiza": [], "realizado_por": ["cmp-frontend-handlers", "sys-currencyservice"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Moedas suportadas para exibição\n\nO `currencyservice` conhece um conjunto de códigos de moeda (arquivo `data/currency_conversion.json`), mas o `frontend` filtra essa lista por uma whitelist própria (`whitelistedCurrencies`) antes de oferecer ao cliente — ou seja, a moeda tem que estar presente nas duas listas para aparecer no seletor. `[extracted]`\n\n## Onde está implementada\n- `src/frontend/rpc.go#L30-L41` (filtro `whitelistedCurrencies`)\n- `src/currencyservice/data/currency_conversion.json` (fonte dos códigos e taxas)\n\n## Conflito\nO `README.md` do repositório (raiz, tabela de arquitetura) descreve o `currencyservice` como usando \"real values fetched from European Central Bank\" (em tempo real). O código (`src/currencyservice/server.js#L106-L115`) carrega um arquivo JSON estático embutido na imagem, sem nenhuma chamada de rede em runtime. `conflito: true` — duas fontes dizem coisas diferentes:\n- **Fonte A (README.md#L14, extracted):** conversão usa valores reais buscados do BCE.\n- **Fonte B (src/currencyservice/server.js#L106-L172, extracted):** conversão é 100% local, a partir de um arquivo estático versionado no repositório; não há client HTTP no serviço.\n\nProvável explicação: o arquivo é gerado/atualizado manualmente de tempos em tempos a partir do BCE, e o README descreve a *origem* dos dados, não o comportamento em runtime — mas isso não está confirmado. `[pergunta para o tech lead do currencyservice]`\n"}, {"id": "rule-recomendacao-nao-e-personalizada", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "Recomendação não é personalizada", "resumo": "Apesar do nome, o `recommendationservice` não usa histórico de compras, similaridade de produto nem qualquer modelo — ele sorteia aleatoriamente até um número fixo de produtos do catálogo que ainda não estão no carrinho (`random.sample`). O", "caminho": "regras-de-negocio/recomendacao-nao-e-personalizada.md", "realiza": [], "realizado_por": ["sys-recommendationservice"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Recomendação não é personalizada\n\nApesar do nome, o `recommendationservice` não usa histórico de compras, similaridade de produto nem qualquer modelo — ele sorteia aleatoriamente até um número fixo de produtos do catálogo que ainda não estão no carrinho (`random.sample`). O `frontend` corta o resultado para no máximo 4 itens exibidos. `[extracted]`\n\n## Onde está implementada\n- `src/recommendationservice/recommendation_server.py#L70-L86`\n- `src/frontend/rpc.go#L99-L117` (corte para 4 itens)\n"}, {"id": "rule-sessao-sem-login", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "Sessão sem login", "resumo": "A loja não exige cadastro nem autenticação. Ao primeiro acesso, um `session_id` (UUID) é gerado e gravado num cookie (`shop_session-id`, validade de 48h); esse id é usado como `user_id` em todo o domínio (carrinho, checkout). Perder o cooki", "caminho": "regras-de-negocio/sessao-sem-login.md", "realiza": [], "realizado_por": ["cmp-frontend-handlers"], "extracoes": ["extracted", "extracted"], "conflito": false, "corpo": "\n# Sessão sem login\n\nA loja não exige cadastro nem autenticação. Ao primeiro acesso, um `session_id` (UUID) é gerado e gravado num cookie (`shop_session-id`, validade de 48h); esse id é usado como `user_id` em todo o domínio (carrinho, checkout). Perder o cookie é perder a identidade — não há recuperação de conta. `[extracted]`\n\n## Onde está implementada\n- `src/frontend/middleware.go#L87-L107`\n- `src/frontend/main.go#L41-L45`\n"}, {"id": "sys-indice", "kind": "system", "camada": 4, "status": "proposed", "titulo": "Sistemas do domínio e contrato gRPC comum", "resumo": "Todos os sistemas do domínio (exceto o `shoppingassistantservice`, que expõe HTTP/Flask, e o `frontend`, que expõe HTTP para o navegador) implementam um serviço gRPC definido em um único arquivo compartilhado no repositório-fonte: `protos/d", "caminho": "sistemas/README.md", "realiza": ["dom-online-boutique"], "realizado_por": ["sys-frontend", "sys-cartservice", "sys-productcatalogservice", "sys-currencyservice", "sys-paymentservice", "sys-shippingservice", "sys-emailservice", "sys-checkoutservice", "sys-recommendationservice", "sys-adservice", "sys-shoppingassistantservice", "sys-loadgenerator"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Sistemas do domínio e contrato gRPC comum\n\nTodos os sistemas do domínio (exceto o `shoppingassistantservice`, que expõe HTTP/Flask, e o `frontend`, que expõe HTTP para o navegador) implementam um serviço gRPC definido em um único arquivo compartilhado no repositório-fonte: `protos/demo.proto` (pacote `hipstershop`). Cada serviço Go/Node/Python/C#/Java gera seu próprio stub a partir do mesmo `.proto` (cópias em `src/<serviço>/genproto/`). `[extracted]`\n\nTodos os serviços gRPC também implementam o health check padrão (`grpc.health.v1.Health`), usado pelas probes de `readiness`/`liveness` do Kubernetes. `[extracted, kubernetes-manifests/*.yaml — todas usam `readinessProbe.grpc.port`]`\n\n## Índice de sistemas\n\n| Sistema | Subdomínio | Stack | Expõe (RPC/HTTP) |\n|---|---|---|---|\n| [frontend](./frontend/ficha.md) | Carrinho e Sessão | Go | HTTP (páginas + `/bot`) |\n| [cartservice](./cartservice/ficha.md) | Carrinho e Sessão | C# / .NET | `CartService` |\n| [productcatalogservice](./productcatalogservice/ficha.md) | Catálogo e Descoberta | Go | `ProductCatalogService` |\n| [recommendationservice](./recommendationservice/ficha.md) | Catálogo e Descoberta | Python | `RecommendationService` |\n| [adservice](./adservice/ficha.md) | Catálogo e Descoberta | Java | `AdService` |\n| [currencyservice](./currencyservice/ficha.md) | Checkout e Pagamento | Node.js | `CurrencyService` |\n| [checkoutservice](./checkoutservice/ficha.md) | Checkout e Pagamento | Go | `CheckoutService` |\n| [paymentservice](./paymentservice/ficha.md) | Checkout e Pagamento | Node.js | `PaymentService` |\n| [shippingservice](./shippingservice/ficha.md) | Checkout e Pagamento | Go | `ShippingService` |\n| [emailservice](./emailservice/ficha.md) | Checkout e Pagamento | Python | `EmailService` |\n| [shoppingassistantservice](./shoppingassistantservice/ficha.md) | Assistente de Compras | Python (Flask) | HTTP `/` (chat) |\n| [loadgenerator](./loadgenerator/ficha.md) | (ferramenta de teste, não é subdomínio de negócio) | Python (Locust) | — (é cliente, não expõe nada) |\n\n## Contrato gRPC — serviços e métodos\n\n| Serviço | Método | Requisição → Resposta | Linhas em `demo.proto` |\n|---|---|---|---|\n| CartService | AddItem, GetCart, EmptyCart | `AddItemRequest→Empty`, `GetCartRequest→Cart`, `EmptyCartRequest→Empty` | L23-L52 |\n| RecommendationService | ListRecommendations | `ListRecommendationsRequest→ListRecommendationsResponse` | L56-L67 |\n| ProductCatalogService | ListProducts, GetProduct, SearchProducts | `Empty→ListProductsResponse`, `GetProductRequest→Product`, `SearchProductsRequest→SearchProductsResponse` | L71-L103 |\n| ShippingService | GetQuote, ShipOrder | `GetQuoteRequest→GetQuoteResponse`, `ShipOrderRequest→ShipOrderResponse` | L107-L136 |\n| CurrencyService | GetSupportedCurrencies, Convert | `Empty→GetSupportedCurrenciesResponse`, `CurrencyConversionRequest→Money` | L140-L173 |\n| PaymentService | Charge | `ChargeRequest→ChargeResponse` | L177-L195 |\n| EmailService | SendOrderConfirmation | `SendOrderConfirmationRequest→Empty` | L199-L220 |\n| CheckoutService | PlaceOrder | `PlaceOrderRequest→PlaceOrderResponse` | L224-L239 |\n| AdService | GetAds | `AdRequest→AdResponse` | L243-L263 |\n\n`[extracted, protos/demo.proto]`. Todas as mensagens usam o tipo comum `Money` (código de moeda ISO 4217 + unidades + nanos, L146-L161) e `Address`/`CartItem` compartilhados entre serviços.\n\n## Quem chama quem (visão consolidada)\n\n```mermaid\nflowchart LR\n  FE[frontend] --> PC[productcatalogservice]\n  FE --> CU[currencyservice]\n  FE --> CT[cartservice]\n  FE --> RC[recommendationservice]\n  FE --> AD[adservice]\n  FE --> CO[checkoutservice]\n  FE -.opcional.-> SA[shoppingassistantservice]\n\n  CO --> CT\n  CO --> PC\n  CO --> CU\n  CO --> SH[shippingservice]\n  CO --> PAY[paymentservice]\n  CO --> EM[emailservice]\n\n  LG[loadgenerator] -->|HTTP| FE\n```\n`[extracted — construído a partir dos `mustMapEnv`/clients de cada `main.*` e das envs `*_SERVICE_ADDR` nos manifestos Kubernetes]`\n\nNenhum sistema chama o `frontend` de volta, e nenhum sistema além do `checkoutservice` chama `paymentservice`, `shippingservice` ou `emailservice` — o `checkoutservice` é o único orquestrador do domínio.\n"}, {"id": "sys-adservice", "kind": "system", "camada": 4, "status": "proposed", "titulo": "adservice", "resumo": "Devolve anúncios de texto associados a categorias de produto (contexto da página atual). `[extracted, README.md#L35]`", "caminho": "sistemas/adservice/ficha.md", "realiza": ["sub-catalogo-e-descoberta"], "realizado_por": ["cmp-adservice-grpc"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# adservice\n\nDevolve anúncios de texto associados a categorias de produto (contexto da página atual). `[extracted, README.md#L35]`\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Catálogo e Descoberta |\n| Dono | Não identificado `[a confirmar]` |\n| Stack | Java |\n| Repositório | `src/adservice/` |\n| Criticidade | Baixa — frontend chama com timeout de 100 ms e ignora falha `[extracted, src/frontend/rpc.go#L119-L124]` |\n\n## Expõe\n\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `AdService.GetAds` | gRPC | Se `context_keys` bater com uma categoria conhecida, devolve os anúncios daquela categoria; senão devolve até `MAX_ADS_TO_SERVE = 2` anúncios aleatórios |\n\n`[extracted, protos/demo.proto#L243-L263; src/adservice/src/main/java/hipstershop/AdService.java#L46, #L101-L132]`\n\n## Consome\n- Nenhum outro sistema — catálogo de anúncios embutido em memória no próprio serviço.\n\n## Regra de negócio\nVer [limite de anúncios servidos](../../regras-de-negocio/limite-de-anuncios-servidos.md).\n"}, {"id": "sys-cartservice", "kind": "system", "camada": 4, "status": "proposed", "titulo": "cartservice", "resumo": "Guarda o carrinho de compras por `user_id` (o cookie de sessão do frontend) e o devolve sob demanda. `[extracted, README.md#L28]`", "caminho": "sistemas/cartservice/ficha.md", "realiza": ["sub-carrinho-e-sessao"], "realizado_por": ["cmp-cartservice-grpc", "res-redis-cart", "res-spanner-cartservice", "res-alloydb"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# cartservice\n\nGuarda o carrinho de compras por `user_id` (o cookie de sessão do frontend) e o devolve sob demanda. `[extracted, README.md#L28]`\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Carrinho e Sessão |\n| Dono | Não identificado `[a confirmar]` |\n| Stack | C# / .NET, `Microsoft.Extensions.Caching.Distributed` |\n| Repositório | `src/cartservice/` |\n| Criticidade | Alta — sem carrinho não há checkout `[inferred]` |\n\n## Contêineres\n\nO backend de armazenamento é escolhido em runtime por variável de ambiente (`Startup.cs`), sem trocar código do serviço:\n\n```mermaid\nflowchart LR\n  API[CartService gRPC :7070] --> Escolha{Backend configurado}\n  Escolha -- padrão / REDIS_ADDR --> Redis[(Redis)]\n  Escolha -- SPANNER_CONNECTION_STRING --> Spanner[(Cloud Spanner)]\n  Escolha -- ALLOYDB_PRIMARY_IP --> AlloyDB[(AlloyDB)]\n```\n`[extracted, src/cartservice/src/Startup.cs#L25-L58]`\n\nNo manifesto Kubernetes padrão do repositório, o backend ativo é sempre **Redis** (`REDIS_ADDR=redis-cart:6379`); Spanner e AlloyDB só entram via overlays Kustomize (`kustomize/components/spanner`, `kustomize/components/alloydb`). `[extracted, kubernetes-manifests/cartservice.yaml]`\n\n## Expõe\n\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `CartService.AddItem` | gRPC | Adiciona item (soma quantidade se já existir) |\n| `CartService.GetCart` | gRPC | Devolve o carrinho do usuário (vazio se não existir) |\n| `CartService.EmptyCart` | gRPC | Zera o carrinho |\n\n`[extracted, protos/demo.proto#L23-L52]`\n\n## Consome\n- Nenhum outro sistema do domínio — apenas o banco configurado (Redis/Spanner/AlloyDB).\n\n## Dados\n\n```mermaid\nerDiagram\n  CART ||--o{ CART_ITEM : contem\n  CART {\n    string user_id\n  }\n  CART_ITEM {\n    string product_id\n    int32 quantity\n  }\n```\nSerializado como protobuf binário, chave = `user_id`. `[extracted, src/cartservice/src/cartstore/RedisCartStore.cs#L32-L64]`\n\n## Estados\n\nSem máquina de estados — o carrinho é sobrescrito por completo a cada escrita (não há versão/histórico).\n\n## Qualidade\n\n- Se o cache/banco estiver inacessível, o serviço lança `RpcException(FailedPrecondition)` — o `checkoutservice` propaga isso como falha 500 ao cliente. `[extracted, src/cartservice/src/cartstore/RedisCartStore.cs#L58-L64]`\n"}, {"id": "cmp-checkoutservice-placeorder", "kind": "component", "camada": 5, "status": "proposed", "titulo": "PlaceOrder", "resumo": "Endpoint gRPC único do `checkoutservice`; orquestra todo o passo a passo do checkout (ver [sequência técnica completa](../../../fluxos/compra-do-cliente.sequencia.md)).", "caminho": "sistemas/checkoutservice/componentes/place-order.md", "realiza": ["sys-checkoutservice"], "realizado_por": ["res-nenhum-recurso-proprio"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# PlaceOrder\n\nEndpoint gRPC único do `checkoutservice`; orquestra todo o passo a passo do checkout (ver [sequência técnica completa](../../../fluxos/compra-do-cliente.sequencia.md)).\n\n| Campo | Valor |\n|---|---|\n| Tipo | endpoint gRPC |\n| Gatilho | chamada `CheckoutService.PlaceOrder` (do `frontend`) |\n| Entrada | `PlaceOrderRequest` (user_id, user_currency, address, email, credit_card) |\n| Saída | `PlaceOrderResponse` (OrderResult) ou erro gRPC |\n| Timeout / memória / concorrência | Sem timeout de handler configurado; requests `cpu: 100m/limit 200m`, `memory: 64Mi/limit 128Mi` no pod `[extracted, kubernetes-manifests/checkoutservice.yaml#L64-L69]` |\n\n## Dependências\n- cartservice — GetCart, EmptyCart\n- productcatalogservice — GetProduct (um por item do carrinho)\n- currencyservice — Convert (um por item + um para o frete)\n- shippingservice — GetQuote, ShipOrder\n- paymentservice — Charge\n\n## Erros e retentativas\nSem retentativa em nenhuma chamada. Erros de `GetCart`, `GetProduct`, `Convert` ou `GetQuote` abortam com `codes.Internal` antes de qualquer cobrança. Erro em `Charge` aborta com `codes.Internal` (o pedido nunca chega a existir). Erro em `ShipOrder` **após** a cobrança aborta com `codes.Unavailable` — nesse ponto o cartão já foi debitado e nenhum pedido é registrado (ver risco em [RELATORIO.md](../../../RELATORIO.md)). Erros de `EmptyCart` e `SendOrderConfirmation` são descartados/logados e não abortam a resposta. `[extracted, src/checkoutservice/main.go#L241-L283]`\n"}, {"id": "sys-checkoutservice", "kind": "system", "camada": 4, "status": "proposed", "titulo": "checkoutservice", "resumo": "Orquestrador da finalização do pedido: é o único sistema do domínio que fala com `paymentservice`, `shippingservice` e `emailservice`. `[extracted]`", "caminho": "sistemas/checkoutservice/ficha.md", "realiza": ["sub-checkout-e-pagamento"], "realizado_por": ["cmp-checkoutservice-placeorder"], "extracoes": ["extracted", "extracted"], "conflito": false, "corpo": "\n# checkoutservice\n\nOrquestrador da finalização do pedido: é o único sistema do domínio que fala com `paymentservice`, `shippingservice` e `emailservice`. `[extracted]`\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Checkout e Pagamento |\n| Dono | Não identificado `[a confirmar]` |\n| Stack | Go, gRPC, OpenTelemetry |\n| Repositório | `src/checkoutservice/` |\n| Criticidade | Alta — é o caminho crítico de receita `[inferred]` |\n\n## Contêineres\n\n```mermaid\nflowchart LR\n  subgraph checkoutservice[pod checkoutservice :5050]\n    PO[PlaceOrder]\n  end\n  PO --> CT[(cartservice)]\n  PO --> PC[(productcatalogservice)]\n  PO --> CU[(currencyservice)]\n  PO --> SH[(shippingservice)]\n  PO --> PAY[(paymentservice)]\n  PO --> EM[(emailservice)]\n```\n`[extracted, src/checkoutservice/main.go#L237-L394]`\n\n## Expõe\n\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `CheckoutService.PlaceOrder` | gRPC (porta 5050) | Ver [componente PlaceOrder](./componentes/place-order.md) |\n| `grpc.health.v1.Health` | gRPC | Sempre `SERVING` (não valida as 6 dependências) `[extracted, src/checkoutservice/main.go#L245-L251]` |\n\n## Consome\n\n| Sistema | Contrato | Tipo |\n|---|---|---|\n| cartservice | GetCart, EmptyCart | gRPC |\n| productcatalogservice | GetProduct | gRPC |\n| currencyservice | Convert | gRPC |\n| shippingservice | GetQuote, ShipOrder | gRPC |\n| paymentservice | Charge | gRPC |\n| emailservice | SendOrderConfirmation | gRPC |\n\n## Dados\n\n`OrderResult` (não persistido — devolvido na resposta e depois descartado; **não há tabela nem log de pedidos**, ver [pergunta em aberto](../../RELATORIO.md)):\n\n```mermaid\nerDiagram\n  ORDER_RESULT ||--o{ ORDER_ITEM : contem\n  ORDER_RESULT {\n    string order_id\n    string shipping_tracking_id\n    Money shipping_cost\n    Address shipping_address\n  }\n  ORDER_ITEM {\n    CartItem item\n    Money cost\n  }\n```\n`[extracted, protos/demo.proto#L203-L220]`\n\n## Estados\n\nNão há máquina de estados do pedido — `PlaceOrder` é uma chamada única, síncrona, tudo-ou-nada até o ponto da cobrança (ver caminho de erro na [sequência técnica](../../fluxos/compra-do-cliente.sequencia.md#caminho-de-erro-consolidado)).\n\n## Qualidade\n\n- Todas as conexões gRPC de saída são estabelecidas uma vez no boot (`mustConnGRPC`), sem retry se o serviço de destino cair depois. `[extracted, src/checkoutservice/main.go#L109-L120]`\n- Falha em `EmptyCart` e em `SendOrderConfirmation` é absorvida (não propaga erro ao cliente) — ver [regra](../../regras-de-negocio/falha-pos-cobranca-nao-reverte-pedido.md).\n- Falha em `ShipOrder` **depois** da cobrança aprovada retorna erro ao cliente sem estorno — risco de negócio a validar.\n"}, {"id": "sys-currencyservice", "kind": "system", "camada": 4, "status": "proposed", "titulo": "currencyservice", "resumo": "Converte um valor monetário de uma moeda para outra. É o serviço de maior QPS do domínio segundo o README (chamado a cada preço exibido ou calculado). `[extracted, README.md#L30]`", "caminho": "sistemas/currencyservice/ficha.md", "realiza": ["sub-checkout-e-pagamento", "sub-catalogo-e-descoberta"], "realizado_por": ["cmp-currencyservice-grpc"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# currencyservice\n\nConverte um valor monetário de uma moeda para outra. É o serviço de maior QPS do domínio segundo o README (chamado a cada preço exibido ou calculado). `[extracted, README.md#L30]`\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Checkout e Pagamento (usado também por Catálogo/Frontend) |\n| Dono | Não identificado `[a confirmar]` |\n| Stack | Node.js |\n| Repositório | `src/currencyservice/` |\n| Criticidade | Alta — quase toda tela e o checkout dependem dele `[inferred]` |\n\n## Contêineres\n\n```mermaid\nflowchart LR\n  API[CurrencyService gRPC :7000] --> JSON[[data/currency_conversion.json]]\n```\n`[extracted, src/currencyservice/server.js#L106-L115]`\n\n## Expõe\n\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `CurrencyService.GetSupportedCurrencies` | gRPC | Lista códigos ISO 4217 suportados |\n| `CurrencyService.Convert` | gRPC | Converte `Money` de uma moeda para outra usando EUR como moeda-pivô |\n\n`[extracted, protos/demo.proto#L140-L173; src/currencyservice/server.js#L138-L172]`\n\n## Consome\n- Nenhum outro sistema; dados de câmbio são estáticos, embutidos no arquivo `data/currency_conversion.json` — rotulado no README do projeto como originado do Banco Central Europeu, mas **não há chamada em runtime a nenhuma API externa** — são taxas fixas do momento em que o arquivo foi gerado. `[extracted — nenhum client HTTP encontrado em server.js; README.md#L14 afirma \"Uses real values fetched from European Central Bank\", o que é uma imprecisão/desatualização do README frente ao código atual — ver conflito registrado]`\n\n## Dados\nTabela estática moeda → fator de conversão relativo ao EUR (arquivo JSON, não um banco).\n\n## Qualidade\n- Conversão feita em memória, sem I/O de rede — resposta rápida e sem dependência externa em runtime.\n"}, {"id": "sys-emailservice", "kind": "system", "camada": 4, "status": "proposed", "titulo": "emailservice", "resumo": "Envia (mock, por padrão) o e-mail de confirmação do pedido. `[extracted, README.md#L32]`", "caminho": "sistemas/emailservice/ficha.md", "realiza": ["sub-checkout-e-pagamento"], "realizado_por": ["cmp-emailservice-grpc"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# emailservice\n\nEnvia (mock, por padrão) o e-mail de confirmação do pedido. `[extracted, README.md#L32]`\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Checkout e Pagamento |\n| Dono | Não identificado `[a confirmar]` |\n| Stack | Python |\n| Repositório | `src/emailservice/` |\n| Criticidade | Baixa — falha aqui não impede o pedido (ver [regra](../../regras-de-negocio/falha-pos-cobranca-nao-reverte-pedido.md)) `[extracted, src/checkoutservice/main.go#L277-L282]` |\n\n## Expõe\n\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `EmailService.SendOrderConfirmation` | gRPC | Recebe e-mail + `OrderResult`; em modo padrão (`dummy_mode`) só loga; se configurado, usa a API do SendGrid |\n\n`[extracted, protos/demo.proto#L199-L220; src/emailservice/email_server.py#L86-L118]`\n\n## Consome\n- Nenhum outro sistema do domínio; opcionalmente a API externa do SendGrid, se configurada (fora do escopo padrão do repositório). `[extracted]`\n\n## Qualidade\n- Chamada é best-effort do ponto de vista do `checkoutservice` — erro é logado como aviso, nunca falha o pedido.\n"}, {"id": "sys-frontend", "kind": "system", "camada": 4, "status": "proposed", "titulo": "frontend", "resumo": "Servidor HTTP que renderiza a vitrine, o carrinho e o checkout; é a única porta de entrada do domínio para o navegador e para o `loadgenerator`. Não persiste nada por conta própria — é um agregador que chama os demais serviços via gRPC. `[e", "caminho": "sistemas/frontend/ficha.md", "realiza": ["sub-carrinho-e-sessao"], "realizado_por": ["cmp-frontend-handlers"], "extracoes": ["extracted", "extracted"], "conflito": false, "corpo": "\n# frontend\n\nServidor HTTP que renderiza a vitrine, o carrinho e o checkout; é a única porta de entrada do domínio para o navegador e para o `loadgenerator`. Não persiste nada por conta própria — é um agregador que chama os demais serviços via gRPC. `[extracted]`\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Carrinho e Sessão (ponto de entrada de todos os subdomínios) |\n| Dono | Não identificado no repositório `[a confirmar]` |\n| Stack | Go, `gorilla/mux`, templates HTML server-side |\n| Repositório | `src/frontend/` (monorepo) |\n| Criticidade | Alta — ponto único de entrada; sem ele nenhum fluxo de negócio funciona `[inferred]` |\n\n## Contêineres\n\n```mermaid\nflowchart LR\n  subgraph frontend[pod frontend]\n    MW[middleware: sessão + moeda + log + tracing]\n    H[handlers HTTP]\n    RPC[clientes gRPC]\n    MW --> H --> RPC\n  end\n  Nav((Navegador)) -->|HTTP 8080| MW\n  RPC --> PC[(productcatalogservice)]\n  RPC --> CU[(currencyservice)]\n  RPC --> CT[(cartservice)]\n  RPC --> RC[(recommendationservice)]\n  RPC --> AD[(adservice)]\n  RPC --> CO[(checkoutservice)]\n  RPC -.opcional.-> SA[(shoppingassistantservice via HTTP)]\n```\n`[extracted, src/frontend/main.go#L91-L163]`\n\n## Expõe\n\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `GET /` | HTTP | Home: lista produtos + moeda + anúncio |\n| `GET /product/{id}` | HTTP | Detalhe do produto + recomendações |\n| `GET /cart`, `POST /cart`, `POST /cart/empty` | HTTP | Ver, adicionar e esvaziar carrinho |\n| `POST /setCurrency` | HTTP | Troca a moeda de exibição (cookie `shop_currency`) |\n| `POST /cart/checkout` | HTTP | Finaliza o pedido (ver [fluxo de compra](../../fluxos/compra-do-cliente.sequencia.md)) |\n| `GET /logout` | HTTP | Invalida o cookie de sessão |\n| `GET /assistant`, `POST /bot` | HTTP | UI e endpoint do assistente de compras (só ativo com `ENABLE_ASSISTANT=true`) |\n| `GET /_healthz` | HTTP | Liveness/readiness (sempre \"ok\", não checa dependências) |\n\n`[extracted, src/frontend/main.go#L150-L163]`\n\n## Consome\n\n| Sistema | Contrato | Tipo |\n|---|---|---|\n| productcatalogservice | ListProducts, GetProduct, SearchProducts | gRPC |\n| currencyservice | GetSupportedCurrencies, Convert | gRPC |\n| cartservice | AddItem, GetCart, EmptyCart | gRPC |\n| recommendationservice | ListRecommendations | gRPC |\n| adservice | GetAds (timeout 100 ms) | gRPC |\n| checkoutservice | PlaceOrder | gRPC |\n| shoppingassistantservice | POST / (chat) | HTTP (opcional) |\n\n`[extracted, src/frontend/rpc.go]`\n\n## Dados\n\nNão há modelo de dados persistente próprio; o estado do visitante vive em dois cookies: `shop_session-id` (uuid, 48h) e `shop_currency`. `[extracted, src/frontend/main.go#L41-L45]`\n\n## Qualidade\n\n- `GetAds` tem timeout de 100 ms (`context.WithTimeout`) — se estourar, a home segue sem anúncio. `[extracted, src/frontend/rpc.go#L119-L121]`\n- Conexões gRPC para os demais serviços não têm timeout/retry configurado (`grpc.NewClient` simples). `[extracted]`\n- `/_healthz` não valida dependências — só confirma que o processo HTTP está de pé; probes de readiness/liveness do Kubernetes usam esse endpoint com um cookie fixo. `[extracted, kubernetes-manifests/frontend.yaml#L46-L58]`\n"}, {"id": "sys-loadgenerator", "kind": "system", "camada": 4, "status": "proposed", "titulo": "loadgenerator", "resumo": "Ferramenta de teste/demo (Locust) que simula clientes reais navegando e comprando na loja continuamente. Não faz parte do domínio de negócio — é infraestrutura de teste/demonstração. `[extracted, README.md#L36]`", "caminho": "sistemas/loadgenerator/ficha.md", "realiza": [], "realizado_por": ["cmp-loadgenerator-locust"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# loadgenerator\n\nFerramenta de teste/demo (Locust) que simula clientes reais navegando e comprando na loja continuamente. Não faz parte do domínio de negócio — é infraestrutura de teste/demonstração. `[extracted, README.md#L36]`\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Nenhum (ferramenta de suporte, atravessa todos) |\n| Dono | Não identificado `[a confirmar]` |\n| Stack | Python / Locust |\n| Repositório | `src/loadgenerator/` |\n| Criticidade | Nenhuma para produção real — existe para gerar tráfego de demonstração `[inferred]` |\n\n## Expõe\n- Nada; é um cliente HTTP.\n\n## Consome\n- `frontend` via HTTP (`FRONTEND_ADDR=frontend:80`), executando literalmente os mesmos passos do [fluxo de compra do cliente](../../fluxos/compra-do-cliente.md): home → trocar moeda → navegar produto → adicionar ao carrinho → ver carrinho → esvaziar carrinho → checkout → logout, com pesos de frequência distintos por tarefa. `[extracted, src/loadgenerator/locustfile.py#L44-L90]`\n\n## Observação\nPode ser removido do deployment via o overlay Kustomize `kustomize/components/without-loadgenerator`. `[extracted]`\n"}, {"id": "cmp-paymentservice-charge", "kind": "component", "camada": 5, "status": "proposed", "titulo": "Charge", "resumo": "Sem retentativa. Três validações, nesta ordem, cada uma lança uma exceção que vira erro gRPC:", "caminho": "sistemas/paymentservice/componentes/charge.md", "realiza": ["sys-paymentservice"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Charge\n\n| Campo | Valor |\n|---|---|\n| Tipo | endpoint gRPC |\n| Gatilho | chamada `PaymentService.Charge` (só o `checkoutservice` chama) |\n| Entrada | `amount: Money`, `credit_card: CreditCardInfo` |\n| Saída | `transaction_id` (uuid v4 aleatório) ou erro |\n| Timeout / memória / concorrência | Não configurado explicitamente no código; pod sem limites de CPU/memória customizados além do padrão do manifesto `[extracted, kubernetes-manifests/paymentservice.yaml]` |\n\n## Dependências\n- Nenhuma (biblioteca `simple-card-validator`, em processo).\n\n## Erros e retentativas\nSem retentativa. Três validações, nesta ordem, cada uma lança uma exceção que vira erro gRPC:\n1. `InvalidCreditCard` — número não passa no algoritmo de Luhn/formato.\n2. `UnacceptedCreditCard` — bandeira diferente de Visa/MasterCard (ex.: Amex, Diners).\n3. `ExpiredCreditCard` — `ano*12+mês` do cartão é anterior ao mês atual.\n\nNenhuma fila de mensagens mortas — é uma chamada síncrona simples. `[extracted, src/paymentservice/charge.js#L30-L86]`\n"}, {"id": "sys-paymentservice", "kind": "system", "camada": 4, "status": "proposed", "titulo": "paymentservice", "resumo": "Valida os dados de um cartão de crédito e simula a cobrança, devolvendo um id de transação. **Não há integração real com nenhuma adquirente/processadora** — nenhum valor é de fato debitado. `[extracted]`", "caminho": "sistemas/paymentservice/ficha.md", "realiza": ["sub-checkout-e-pagamento"], "realizado_por": ["cmp-paymentservice-charge"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# paymentservice\n\nValida os dados de um cartão de crédito e simula a cobrança, devolvendo um id de transação. **Não há integração real com nenhuma adquirente/processadora** — nenhum valor é de fato debitado. `[extracted]`\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Checkout e Pagamento |\n| Dono | Não identificado `[a confirmar]` |\n| Stack | Node.js, `simple-card-validator`, `uuid` |\n| Repositório | `src/paymentservice/` |\n| Criticidade | Alta — bloqueia o pedido se falhar `[inferred]` |\n\n## Expõe\
