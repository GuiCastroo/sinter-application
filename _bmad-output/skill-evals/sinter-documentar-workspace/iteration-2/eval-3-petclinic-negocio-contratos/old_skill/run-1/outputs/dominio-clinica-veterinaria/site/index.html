addPetToOwner` do `genai-service`). Retorna `201 Created`.\n\n## Exemplo\n```json\n// POST /owners/1/pets\n{ \"name\": \"Rex\", \"birthDate\": \"2022-01-10\", \"typeId\": 2 }\n// -> 201\n{ \"id\": 15, \"name\": \"Rex\", \"birthDate\": \"2022-01-10\", \"type\": {\"id\":2,\"name\":\"dog\"} }\n```\n"}, {"id": "ctr-customers-put-owner", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "PUT /owners/{ownerId}", "resumo": "Atualiza os dados de um tutor existente. Retorna `204 No Content`. Lança `ResourceNotFoundException` (caminho de erro) se `ownerId` não existir.", "caminho": "sistemas/customers-service/contratos/ctr-customers-put-owner.md", "realiza": ["cap-cadastro-clientes-pets"], "realizado_por": ["cmp-customers-owner-api"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# PUT /owners/{ownerId}\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `api-gateway` (frontend AngularJS, tela de edição de tutor) |\n| Especificação | sem OpenAPI; extraído de `OwnerResource.updateOwner` |\n\nAtualiza os dados de um tutor existente. Retorna `204 No Content`. Lança `ResourceNotFoundException` (caminho de erro) se `ownerId` não existir.\n\n## Exemplo\n```json\n// PUT /owners/1\n{ \"firstName\": \"George\", \"lastName\": \"Franklin\", \"address\": \"110 W. Liberty St.\", \"city\": \"Madison\", \"telephone\": \"6085551023\" }\n// -> 204 No Content\n```\n"}, {"id": "ctr-customers-put-pet", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "PUT /owners/*/pets/{petId}", "resumo": "Atualiza nome, data de nascimento e tipo de um pet existente. O `ownerId` no path é ignorado (`*`) — o pet é localizado só por `petId`, presente também no corpo (`PetRequest.id`). Retorna `204 No Content`.", "caminho": "sistemas/customers-service/contratos/ctr-customers-put-pet.md", "realiza": ["cap-cadastro-clientes-pets"], "realizado_por": ["cmp-customers-pet-api"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# PUT /owners/*/pets/{petId}\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `api-gateway` (formulário de edição de pet) |\n| Especificação | sem OpenAPI; extraído de `PetResource.processUpdateForm` |\n\nAtualiza nome, data de nascimento e tipo de um pet existente. O `ownerId` no path é ignorado (`*`) — o pet é localizado só por `petId`, presente também no corpo (`PetRequest.id`). Retorna `204 No Content`.\n\n## Exemplo\n```json\n// PUT /owners/1/pets/15\n{ \"id\": 15, \"name\": \"Rex\", \"birthDate\": \"2022-01-10\", \"typeId\": 2 }\n// -> 204 No Content\n```\n"}, {"id": "sys-customers-service", "kind": "system", "camada": 4, "status": "proposed", "titulo": "customers-service", "resumo": "Mantém o cadastro de tutores (owners) e de seus pets, incluindo os tipos de pet disponíveis (cat, dog, lizard, snake, bird, hamster).", "caminho": "sistemas/customers-service/ficha.md", "realiza": ["sub-cadastro", "cap-cadastro-clientes-pets"], "realizado_por": ["cmp-customers-owner-api", "cmp-customers-pet-api", "res-hsqldb-embedded", "res-mysql-customers"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# customers-service\nMantém o cadastro de tutores (owners) e de seus pets, incluindo os tipos de pet disponíveis (cat, dog, lizard, snake, bird, hamster).\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | [Cadastro de Clientes e Pets](../../subdominios/sub-cadastro.md) |\n| Dono | não informado (sem `CODEOWNERS` no repositório) — a confirmar |\n| Stack | Java 17+, Spring Boot 4.0.1, Spring Cloud (Eureka Client, Config Client), Spring Data JPA |\n| Repositório | `spring-petclinic-customers-service/` (módulo Maven deste monorepo) |\n| Criticidade | alta (inferido — é a fonte de verdade de owners/pets, usada pelo `api-gateway`, `visits-service` (referência de `pet_id`) e `genai-service`); valor de SLA não confirmado |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph customers-service\n    API[REST API: OwnerResource + PetResource]\n    MAP[OwnerEntityMapper]\n    API --> MAP\n    MAP --> REPO[(JPA Repositories)]\n  end\n  REPO --> DB[(banco: owners, pets, types)]\n  EUREKA[[discovery-server]] -.registra/descobre.-> API\n  CFG[[config-server]] -.configuração.-> API\n```\n\n## Expõe\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `POST /owners` | API REST | [ctr-customers-post-owners](contratos/ctr-customers-post-owners.md) |\n| `GET /owners/{ownerId}` | API REST | [ctr-customers-get-owner](contratos/ctr-customers-get-owner.md) |\n| `GET /owners` | API REST | [ctr-customers-get-owners](contratos/ctr-customers-get-owners.md) |\n| `PUT /owners/{ownerId}` | API REST | [ctr-customers-put-owner](contratos/ctr-customers-put-owner.md) |\n| `GET /petTypes` | API REST | [ctr-customers-get-pettypes](contratos/ctr-customers-get-pettypes.md) |\n| `POST /owners/{ownerId}/pets` | API REST | [ctr-customers-post-pet](contratos/ctr-customers-post-pet.md) |\n| `PUT /owners/*/pets/{petId}` | API REST | [ctr-customers-put-pet](contratos/ctr-customers-put-pet.md) |\n| `GET /owners/*/pets/{petId}` | API REST | [ctr-customers-get-pet](contratos/ctr-customers-get-pet.md) |\n\nNão há OpenAPI/Swagger neste repositório para este serviço — os contratos abaixo foram extraídos diretamente dos controllers (`extracted`).\n\n## Consome\n| Sistema | Contrato | Tipo |\n|---|---|---|\n| discovery-server | registro/descoberta Eureka | infraestrutura |\n| config-server | propriedades externas (`optional:configserver:...`) | infraestrutura |\n\nEste serviço não chama nenhum outro sistema de negócio — é uma folha na topologia de chamadas síncronas.\n\n## Dados\n```mermaid\nerDiagram\n  OWNER ||--o{ PET : possui\n  PET_TYPE ||--o{ PET : classifica\n  OWNER {\n    int id PK\n    string first_name\n    string last_name\n    string address\n    string city\n    string telephone\n  }\n  PET {\n    int id PK\n    string name\n    date birth_date\n    int type_id FK\n    int owner_id FK\n  }\n  PET_TYPE {\n    int id PK\n    string name\n  }\n```\nFonte: `src/main/resources/db/mysql/schema.sql` (tabelas `owners`, `pets`, `types`) e entidades JPA `Owner`, `Pet`, `PetType`. `pets.owner_id` e `pets.type_id` têm `FOREIGN KEY` no MySQL. Tipos de pet são dados de referência carregados por `data.sql` (ex.: cat, dog, lizard, snake, bird, hamster — confirmado também pela descrição da tool `addPetToOwner` do `genai-service`).\n\n## Qualidade\n- Validação de entrada: `@NotBlank` em nome/endereço/cidade/telefone do owner; `@Digits(fraction=0, integer=12)` no telefone (até 12 dígitos, sem fração); `@Min(1)` em ids de path; `@Size(min=1)` no nome do pet.\n- `ResourceNotFoundException` (não mostrado aqui em detalhe) é lançada quando owner ou pet não existem — mapeada presumivelmente para HTTP 404 (`inferred`, o handler de exceção não foi localizado nas fontes lidas).\n- Métricas: todos os endpoints são anotados com `@Timed(\"petclinic.owner\")` / `@Timed(\"petclinic.pet\")` (Micrometer).\n- Sem timeout, retry ou circuit breaker configurado neste serviço (ele é sempre o lado \"servidor\" das chamadas síncronas do domínio).\n"}, {"id": "cmp-discovery-server-app", "kind": "component", "camada": 5, "status": "proposed", "titulo": "DiscoveryServerApplication", "resumo": "", "caminho": "sistemas/discovery-server/componentes/cmp-discovery-server-app.md", "realiza": ["sys-discovery-server"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# DiscoveryServerApplication\n| Campo | Valor |\n|---|---|\n| Tipo | endpoint (servidor Eureka) |\n| Gatilho | HTTP, heartbeats de registro dos demais serviços |\n| Entrada | registro/renovação de instância (nome do serviço, host, porta) |\n| Saída | lista de instâncias vivas por nome de serviço |\n| Timeout / memória / concorrência | padrões do Eureka (não sobrescritos nas fontes lidas) |\n\n## Dependências\n- `config-server` (import opcional de configuração)\n\n## Erros e retentativas\n- Comportamento padrão do Eureka (auto-preservação, expiração de lease); nada customizado identificado nas fontes lidas.\n"}, {"id": "sys-discovery-server", "kind": "system", "camada": 4, "status": "proposed", "titulo": "discovery-server", "resumo": "Registro de serviços (Netflix Eureka). Não implementa capacidade de negócio — é infraestrutura de plataforma que permite aos demais sistemas se encontrarem por nome lógico (`lb://customers-service`, etc.).", "caminho": "sistemas/discovery-server/ficha.md", "realiza": ["sub-plataforma"], "realizado_por": ["cmp-discovery-server-app"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# discovery-server\nRegistro de serviços (Netflix Eureka). Não implementa capacidade de negócio — é infraestrutura de plataforma que permite aos demais sistemas se encontrarem por nome lógico (`lb://customers-service`, etc.).\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | [Plataforma](../../subdominios/sub-plataforma.md) |\n| Dono | não informado — a confirmar |\n| Stack | Java 17+, Spring Boot 4.0.1, Spring Cloud Netflix Eureka Server |\n| Repositório | `spring-petclinic-discovery-server/` |\n| Criticidade | crítica (inferido — sem ele, `api-gateway` e `genai-service` não conseguem resolver os demais serviços por nome) |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph discovery-server\n    EUR[Eureka Server :8761]\n  end\n  CUST[customers-service] -.registra.-> EUR\n  VET[vets-service] -.registra.-> EUR\n  VIS[visits-service] -.registra.-> EUR\n  GEN[genai-service] -.registra.-> EUR\n  GW[api-gateway] -.consulta.-> EUR\n```\n\n## Expõe\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| Dashboard/API Eureka (`/eureka/**`) | API REST (padrão do framework) | não documentado neste repositório |\n\n## Dados\nNão possui banco; mantém em memória o registro de instâncias vivas.\n\n## Qualidade\n- Health check via `curl -f http://discovery-server:8761`, depende de `config-server` saudável antes de subir.\n"}, {"id": "cmp-genai-chat-api", "kind": "component", "camada": 5, "status": "proposed", "titulo": "PetclinicChatClient", "resumo": "Endpoint que recebe a pergunta do usuário em texto livre e a repassa ao LLM configurado, com um prompt de sistema fixo e ferramentas (`PetclinicTools`) que o modelo pode invocar.", "caminho": "sistemas/genai-service/componentes/cmp-genai-chat-api.md", "realiza": ["sys-genai-service"], "realizado_por": ["cmp-genai-tools"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# PetclinicChatClient\nEndpoint que recebe a pergunta do usuário em texto livre e a repassa ao LLM configurado, com um prompt de sistema fixo e ferramentas (`PetclinicTools`) que o modelo pode invocar.\n\n| Campo | Valor |\n|---|---|\n| Tipo | endpoint (controller reativo) |\n| Gatilho | HTTP POST `/chatclient` |\n| Entrada | corpo `String` (a pergunta do usuário, texto livre) |\n| Saída | `String` (resposta do assistente) |\n| Timeout / memória / concorrência | não configurado explicitamente; depende do timeout do provedor de LLM (não encontrado nas fontes) |\n\n## Dependências\n- `PetclinicTools` (`@Tool`s: `listOwners`, `addOwnerToPetclinic`, `listVets`, `addPetToOwner`)\n- `ChatMemory` (contexto de até 10 mensagens anteriores)\n- Provedor de LLM externo (Azure OpenAI ou OpenAI, conforme configuração)\n\n## Erros e retentativas\n- Qualquer exceção na chamada ao LLM é capturada e vira a resposta fixa \"Chat is currently unavailable. Please try again later.\" (não propaga erro HTTP 5xx ao chamador).\n"}, {"id": "cmp-genai-tools", "kind": "component", "camada": 5, "status": "proposed", "titulo": "PetclinicTools / AIDataProvider", "resumo": "Conjunto de \"ferramentas\" (`@Tool`) que o LLM pode chamar durante a conversa, e o provedor que de fato executa essas chamadas contra os serviços de negócio.", "caminho": "sistemas/genai-service/componentes/cmp-genai-tools.md", "realiza": ["sys-genai-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# PetclinicTools / AIDataProvider\nConjunto de \"ferramentas\" (`@Tool`) que o LLM pode chamar durante a conversa, e o provedor que de fato executa essas chamadas contra os serviços de negócio.\n\n| Campo | Valor |\n|---|---|\n| Tipo | worker (function-calling invocado pelo LLM, não pelo usuário diretamente) |\n| Gatilho | decisão do LLM durante o processamento de um prompt (`ChatClient.defaultTools`) |\n| Entrada | argumentos estruturados que o LLM extrai da pergunta do usuário |\n| Saída | dados estruturados (lista de owners, vets, pet criado, owner criado) devolvidos ao LLM para compor a resposta final |\n| Timeout / memória / concorrência | não configurado explicitamente |\n\n## Dependências\n- `customers-service`, via `DiscoveryClient.getInstances(\"customers-service\")` + `RestClient` (chamadas síncronas bloqueantes: `GET /owners`, `POST /owners`, `POST /owners/{ownerId}/pets`)\n- `VectorStore` — busca semântica de veterinários (`listVets`), com `topK=20` (com filtro) ou `topK=50` (sem filtro)\n\n## Erros e retentativas\n- `listVets` captura `JacksonException` na serialização do filtro e retorna lista vazia em vez de propagar erro.\n- Demais tools não têm tratamento de erro específico identificado — falhas de rede em `AIDataProvider` propagam para `PetclinicChatClient`, que por sua vez cai na resposta fixa de indisponibilidade.\n"}, {"id": "cmp-genai-vectorstore-loader", "kind": "component", "camada": 5, "status": "proposed", "titulo": "VectorStoreController", "resumo": "Carrega os dados dos veterinários no vector store em memória, para permitir busca semântica pela tool `listVets`.", "caminho": "sistemas/genai-service/componentes/cmp-genai-vectorstore-loader.md", "realiza": ["sys-genai-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# VectorStoreController\nCarrega os dados dos veterinários no vector store em memória, para permitir busca semântica pela tool `listVets`.\n\n| Campo | Valor |\n|---|---|\n| Tipo | worker (listener de evento de startup) |\n| Gatilho | evento `ApplicationStartedEvent` (na subida do serviço) |\n| Entrada | arquivo `vectorstore.json` (classpath), se existir; caso contrário, resposta de `GET /vets` do `vets-service` |\n| Saída | `VectorStore` populado em memória; opcionalmente grava um novo `vectorstore.json` em arquivo temporário local |\n| Timeout / memória / concorrência | bloqueante (`.block()` na chamada reativa a `vets-service`) — roda uma única vez no startup |\n\n## Dependências\n- `vets-service` (`GET /vets`, via `WebClient` com `http://vets-service/`, resolvido por `lb://` + Eureka) — só é chamado se `vectorstore.json` não existir no classpath\n- Sistema de arquivos local (grava arquivo temporário com permissões restritas `rwx------`)\n\n## Erros e retentativas\n- Sem tratamento de retry; se `vets-service` estiver indisponível no exato momento do startup e não houver `vectorstore.json`, o carregamento falha (comportamento de propagação não detalhado nas fontes lidas — **inferido**, a confirmar).\n"}, {"id": "ctr-genai-post-chatclient", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "POST /chatclient", "resumo": "Recebe uma pergunta em texto livre e devolve a resposta do assistente virtual, já com eventuais ações executadas (ex.: cadastro de owner/pet) via *tool calling*.", "caminho": "sistemas/genai-service/contratos/ctr-genai-post-chatclient.md", "realiza": ["cap-atendimento-inteligente"], "realizado_por": ["cmp-genai-chat-api"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# POST /chatclient\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona do ponto de vista do cliente) |\n| Produtor | `genai-service` |\n| Consumidores | `api-gateway` (rota `/api/genai/**`), frontend AngularJS (`scripts/genai/chat.js`) |\n| Especificação | sem OpenAPI/AsyncAPI; extraído de `PetclinicChatClient.exchange` |\n\nRecebe uma pergunta em texto livre e devolve a resposta do assistente virtual, já com eventuais ações executadas (ex.: cadastro de owner/pet) via *tool calling*.\n\n## Exemplo\n```\n// POST /chatclient\n\"Quantos donos de pets estão cadastrados?\"\n// -> 200\n\"Atualmente há 10 tutores cadastrados na clínica.\"\n```\n"}, {"id": "sys-genai-service", "kind": "system", "camada": 4, "status": "proposed", "titulo": "genai-service", "resumo": "Assistente virtual (chatbot) baseado em LLM que responde perguntas e executa ações sobre owners, pets e vets em nome do usuário, usando Spring AI.", "caminho": "sistemas/genai-service/ficha.md", "realiza": ["sub-atendimento-digital", "cap-atendimento-inteligente"], "realizado_por": ["cmp-genai-chat-api", "cmp-genai-tools", "cmp-genai-vectorstore-loader"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# genai-service\nAssistente virtual (chatbot) baseado em LLM que responde perguntas e executa ações sobre owners, pets e vets em nome do usuário, usando Spring AI.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | [Atendimento Digital](../../subdominios/sub-atendimento-digital.md) |\n| Dono | não informado — a confirmar |\n| Stack | Java 17+, Spring Boot 4.0.1 (reativo), Spring AI (`ChatClient`, `VectorStore`), Spring Cloud (Eureka Client, Config Client, LoadBalancer) |\n| Repositório | `spring-petclinic-genai-service/` |\n| Criticidade | baixa/média (inferido — funcionalidade adicional de atendimento; sua indisponibilidade tem fallback dedicado no `api-gateway`) |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph genai-service\n    CHAT[PetclinicChatClient]\n    TOOLS[PetclinicTools]\n    PROV[AIDataProvider]\n    VS[(VectorStore em memória)]\n    LOADER[VectorStoreController]\n  end\n  CHAT --> TOOLS\n  TOOLS --> PROV\n  PROV --> VS\n  LOADER --> VS\n  PROV -->|REST via Eureka| CUST[customers-service]\n  LOADER -->|REST via Eureka, no startup| VET[vets-service]\n  CHAT -->|prompt/completion| LLM[[Provedor LLM: Azure OpenAI ou OpenAI]]\n```\n\n## Expõe\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `POST /chatclient` | API REST | [ctr-genai-post-chatclient](contratos/ctr-genai-post-chatclient.md) |\n\n## Consome\n| Sistema | Contrato | Tipo |\n|---|---|---|\n| `customers-service` | `GET /owners`, `POST /owners`, `POST /owners/{ownerId}/pets` | API REST síncrona, via `DiscoveryClient` + `RestClient` |\n| `vets-service` | `GET /vets` | API REST síncrona, via `WebClient`, apenas no `ApplicationStartedEvent` (carga do vector store) |\n| provedor de LLM externo (Azure OpenAI ou OpenAI) | Chat Completions | API REST externa |\n| discovery-server | registro/descoberta Eureka | infraestrutura |\n| config-server | propriedades externas | infraestrutura |\n\n## Dados\nNão possui banco próprio. Mantém em memória:\n- **Vector store** (`SimpleVectorStore`, biblioteca Spring AI): embeddings dos veterinários, usados para busca semântica pela tool `listVets`. Pré-carregado de `src/main/resources/vectorstore.json` quando o arquivo existe (evita custo de reprocessar embeddings); caso contrário, é reconstruído a partir de `GET /vets` no `vets-service` a cada subida (`VectorStoreController`).\n- **Memória de conversa** (`ChatMemory`, injetada em `PetclinicChatClient`) — mantém contexto de até as últimas 10 mensagens (`.order(10)` no `MessageChatMemoryAdvisor`); implementação e persistência não detalhadas nas fontes lidas (**inferido**: provavelmente em memória, perdida a cada restart).\n\n## Qualidade\n- Segredos: `AZURE_OPENAI_KEY`, `OPENAI_API_KEY` são lidos de variáveis de ambiente (`application.yml`) — **não copiados aqui**, ver RELATORIO.md.\n- Erros do `ChatClient` (chamada ao LLM) são capturados em `PetclinicChatClient.exchange` e retornam a mensagem \"Chat is currently unavailable. Please try again later.\" em vez de propagar exceção.\n- Rota do `api-gateway` para este serviço (`/api/genai/**`) tem um circuit breaker nomeado (`genaiCircuitBreaker`) além do padrão, sinalizando maior expectativa de falha/latência deste serviço (chamada a LLM externo).\n- Modelo padrão: `gpt-4o` (Azure) ou `gpt-4o-mini` (OpenAI), `temperature: 0.7`.\n"}, {"id": "cmp-vets-vet-api", "kind": "component", "camada": 5, "status": "proposed", "titulo": "VetResource", "resumo": "Endpoint REST único que lista veterinários com suas especialidades.", "caminho": "sistemas/vets-service/componentes/cmp-vets-vet-api.md", "realiza": ["sys-vets-service"], "realizado_por": ["res-hsqldb-embedded", "res-mysql-vets"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# VetResource\nEndpoint REST único que lista veterinários com suas especialidades.\n\n| Campo | Valor |\n|---|---|\n| Tipo | endpoint (controller Spring MVC) |\n| Gatilho | HTTP GET `/vets` |\n| Entrada | nenhuma (sem parâmetros) |\n| Saída | lista de `Vet` (JSON), cada um com suas `specialties` |\n| Timeout / memória / concorrência | não configurado explicitamente |\n\n## Dependências\n- `VetRepository` (Spring Data JPA)\n- Cache Spring (`@Cacheable(\"vets\")`), ativo apenas no perfil `production`\n\n## Erros e retentativas\n- Nenhum tratamento de erro específico identificado neste componente; falhas de banco propagam como erro 5xx padrão do Spring.\n"}, {"id": "ctr-vets-get-vets", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "GET /vets", "resumo": "Retorna a lista completa de veterinários com suas especialidades. Resposta cacheada em produção (`@Cacheable(\"vets\")`).", "caminho": "sistemas/vets-service/contratos/ctr-vets-get-vets.md", "realiza": ["cap-gestao-corpo-clinico"], "realizado_por": ["cmp-vets-vet-api"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# GET /vets\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `vets-service` |\n| Consumidores | `api-gateway` (rota `/api/vet/**`, tela de lista de veterinários), `genai-service` (`VectorStoreController` no startup, para popular o vector store de RAG) |\n| Especificação | sem OpenAPI; extraído de `VetResource.showResourcesVetList` |\n\nRetorna a lista completa de veterinários com suas especialidades. Resposta cacheada em produção (`@Cacheable(\"vets\")`).\n\n## Exemplo\n```json\n// GET /vets -> 200\n[ { \"id\": 1, \"firstName\": \"James\", \"lastName\": \"Carter\", \"specialties\": [] },\n  { \"id\": 2, \"firstName\": \"Helen\", \"lastName\": \"Leary\", \"specialties\": [ {\"id\":1,\"name\":\"radiology\"} ] } ]\n```\n"}, {"id": "sys-vets-service", "kind": "system", "camada": 4, "status": "proposed", "titulo": "vets-service", "resumo": "Mantém o cadastro de veterinários e suas especialidades. É um serviço somente leitura do ponto de vista da API (não expõe criação/edição de veterinários).", "caminho": "sistemas/vets-service/ficha.md", "realiza": ["sub-corpo-clinico", "cap-gestao-corpo-clinico"], "realizado_por": ["cmp-vets-vet-api", "res-hsqldb-embedded", "res-mysql-vets"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# vets-service\nMantém o cadastro de veterinários e suas especialidades. É um serviço somente leitura do ponto de vista da API (não expõe criação/edição de veterinários).\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | [Corpo Clínico](../../subdominios/sub-corpo-clinico.md) |\n| Dono | não informado — a confirmar |\n| Stack | Java 17+, Spring Boot 4.0.1, Spring Cloud (Eureka Client, Config Client), Spring Data JPA, Spring Cache |\n| Repositório | `spring-petclinic-vets-service/` |\n| Criticidade | média (inferido — consultado pelo `api-gateway`/frontend e pelo `genai-service`, mas os dados são estáticos e cacheados) |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph vets-service\n    API[REST API: VetResource] --> CACHE[[cache \"vets\"]]\n    CACHE --> REPO[(VetRepository)]\n  end\n  REPO --> DB[(banco: vets, specialties, vet_specialties)]\n```\n\n## Expõe\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `GET /vets` | API REST | [ctr-vets-get-vets](contratos/ctr-vets-get-vets.md) |\n\n## Consome\n| Sistema | Contrato | Tipo |\n|---|---|---|\n| discovery-server | registro/descoberta Eureka | infraestrutura |\n| config-server | propriedades externas | infraestrutura |\n\n## Dados\n```mermaid\nerDiagram\n  VET ||--o{ VET_SPECIALTY : tem\n  SPECIALTY ||--o{ VET_SPECIALTY : classifica\n  VET {\n    int id PK\n    string first_name\n    string last_name\n  }\n  SPECIALTY {\n    int id PK\n    string name\n  }\n  VET_SPECIALTY {\n    int vet_id FK\n    int specialty_id FK\n  }\n```\nFonte: `db/mysql/schema.sql` (tabelas `vets`, `specialties`, `vet_specialties` — tabela de junção many-to-many com `UNIQUE(vet_id, specialty_id)`) e entidades `Vet`, `Specialty`.\n\n## Qualidade\n- `GET /vets` é anotado `@Cacheable(\"vets\")`; o cache só é habilitado no perfil `production` (`CacheConfig`, `@Profile(\"production\")`) e é definido em `application.yml` (`spring.cache.cache-names: vets`) — em testes o cache fica desabilitado.\n- Sem timeout/retry configurado neste serviço (é sempre o lado servidor).\n- Sem paginação nem filtro no endpoint — retorna sempre a lista completa.\n"}, {"id": "cmp-visits-visit-api", "kind": "component", "camada": 5, "status": "proposed", "titulo": "VisitResource", "resumo": "Endpoint REST para criar e consultar visitas (consultas veterinárias) de um pet.", "caminho": "sistemas/visits-service/componentes/cmp-visits-visit-api.md", "realiza": ["sys-visits-service"], "realizado_por": ["res-hsqldb-embedded", "res-mysql-visits"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# VisitResource\nEndpoint REST para criar e consultar visitas (consultas veterinárias) de um pet.\n\n| Campo | Valor |\n|---|---|\n| Tipo | endpoint (controller Spring MVC) |\n| Gatilho | HTTP, rotas `owners/*/pets/{petId}/visits` e `pets/visits` |\n| Entrada | corpo `Visit` (JSON) na criação; `petId` de path ou lista `petId` em query string |\n| Saída | `Visit` criada, lista de `Visit`, ou `Visits` (wrapper `items`) na consulta em lote |\n| Timeout / memória / concorrência | não configurado explicitamente |\n\n## Dependências\n- `VisitRepository` (Spring Data JPA) — métodos `findByPetId` e `findByPetIdIn`\n\n## Erros e retentativas\n- Nenhum tratamento de exceção específico identificado; falhas de validação (`@Valid`) retornam 400 pelo handler padrão do Spring.\n- Sem fila de mensagens mortas.\n"}, {"id": "ctr-visits-get-visits-batch", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "GET pets/visits", "resumo": "Consulta em lote: recebe uma lista de `petId` na query string (`?petId=1&petId=2...`, unidos por vírgula pelo cliente) e retorna todas as visitas desses pets, agrupadas no envelope `{ \"items\": [...] }`. É a chamada usada pelo fluxo [Consult", "caminho": "sistemas/visits-service/contratos/ctr-visits-get-visits-batch.md", "realiza": ["cap-registro-consultas"], "realizado_por": ["cmp-visits-visit-api"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# GET pets/visits\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `visits-service` |\n| Consumidores | `api-gateway` (`VisitsServiceClient.getVisitsForPets`, chamada em lote no fluxo de agregação de dados do tutor) |\n| Especificação | sem OpenAPI; extraído de `VisitResource.read(List<Integer> petIds)` |\n\nConsulta em lote: recebe uma lista de `petId` na query string (`?petId=1&petId=2...`, unidos por vírgula pelo cliente) e retorna todas as visitas desses pets, agrupadas no envelope `{ \"items\": [...] }`. É a chamada usada pelo fluxo [Consulta de histórico do tutor](../../../fluxos/flow-consulta-historico-tutor.md) para evitar N chamadas (uma por pet).\n\n## Exemplo\n```json\n// GET pets/visits?petId=15,16 -> 200\n{ \"items\": [ { \"id\": 42, \"date\": \"2026-09-20\", \"description\": \"Vacina antirrábica\", \"petId\": 15 } ] }\n```\n"}, {"id": "ctr-visits-get-visits-by-pet", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "GET owners/*/pets/{petId}/visits", "resumo": "Lista as visitas de um único pet.", "caminho": "sistemas/visits-service/contratos/ctr-visits-get-visits-by-pet.md", "realiza": ["cap-registro-consultas"], "realizado_por": ["cmp-visits-visit-api"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# GET owners/*/pets/{petId}/visits\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `visits-service` |\n| Consumidores | `api-gateway` (tela de histórico de visitas de um pet específico) |\n| Especificação | sem OpenAPI; extraído de `VisitResource.read(int petId)` |\n\nLista as visitas de um único pet.\n\n## Exemplo\n```json\n// GET owners/1/pets/15/visits -> 200\n[ { \"id\": 42, \"date\": \"2026-09-20\", \"description\": \"Vacina antirrábica\", \"petId\": 15 } ]\n```\n"}, {"id": "ctr-visits-post-visit", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "POST owners/*/pets/{petId}/visits", "resumo": "Registra uma nova visita para um pet. O `petId` do path sobrescreve o campo do corpo (`visit.setPetId(petId)`). Retorna `201 Created`.", "caminho": "sistemas/visits-service/contratos/ctr-visits-post-visit.md", "realiza": ["cap-registro-consultas"], "realizado_por": ["cmp-visits-visit-api"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# POST owners/*/pets/{petId}/visits\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `visits-service` |\n| Consumidores | `api-gateway` (rota `/api/visit/**`, tela de registro de visita) |\n| Especificação | sem OpenAPI; extraído de `VisitResource.create` |\n\nRegistra uma nova visita para um pet. O `petId` do path sobrescreve o campo do corpo (`visit.setPetId(petId)`). Retorna `201 Created`.\n\n## Exemplo\n```json\n// POST owners/1/pets/15/visits\n{ \"date\": \"2026-09-20\", \"description\": \"Vacina antirrábica\" }\n// -> 201\n{ \"id\": 42, \"date\": \"2026-09-20\", \"description\": \"Vacina antirrábica\", \"petId\": 15 }\n```\n"}, {"id": "sys-visits-service", "kind": "system", "camada": 4, "status": "proposed", "titulo": "visits-service", "resumo": "Registra e consulta as visitas (consultas veterinárias) de cada pet.", "caminho": "sistemas/visits-service/ficha.md", "realiza": ["sub-consultas", "cap-registro-consultas"], "realizado_por": ["cmp-visits-visit-api", "res-hsqldb-embedded", "res-mysql-visits"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# visits-service\nRegistra e consulta as visitas (consultas veterinárias) de cada pet.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | [Consultas](../../subdominios/sub-consultas.md) |\n| Dono | não informado — a confirmar |\n| Stack | Java 17+, Spring Boot 4.0.1, Spring Cloud (Eureka Client, Config Client), Spring Data JPA |\n| Repositório | `spring-petclinic-visits-service/` |\n| Criticidade | alta (inferido — é a fonte de verdade do histórico clínico) |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph visits-service\n    API[REST API: VisitResource] --> REPO[(VisitRepository)]\n  end\n  REPO --> DB[(banco: visits)]\n```\n\n## Expõe\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `POST owners/*/pets/{petId}/visits` | API REST | [ctr-visits-post-visit](contratos/ctr-visits-post-visit.md) |\n| `GET owners/*/pets/{petId}/visits` | API REST | [ctr-visits-get-visits-by-pet](contratos/ctr-visits-get-visits-by-pet.md) |\n| `GET pets/visits` | API REST | [ctr-visits-get-visits-batch](contratos/ctr-visits-get-visits-batch.md) |\n\n## Consome\n| Sistema | Contrato | Tipo |\n|---|---|---|\n| discovery-server | registro/descoberta Eureka | infraestrutura |\n| config-server | propriedades externas | infraestrutura |\n\n`visits-service` **não chama** `customers-service` para validar se o `petId` recebido existe de fato — grava o `pet_id` sem verificação cruzada (`inferred` a partir da ausência de qualquer `WebClient`/`RestClient` no código deste serviço). A consistência entre pet e visita é responsabilidade de quem chama (o `api-gateway`, indiretamente).\n\n## Dados\n```mermaid\nerDiagram\n  VISIT {\n    int id PK\n    int pet_id \"FK logica para pets.id (customers-service)\"\n    date visit_date\n    string description\n  }\n```\nFonte: `db/mysql/schema.sql` (tabela `visits`, com `FOREIGN KEY (pet_id) REFERENCES pets(id)` — mas `pets` vive fisicamente no banco do `customers-service`; ver nota em `res-mysql-visits`). `description` é limitado a 8192 caracteres (`@Size(max = 8192)`).\n\n## Qualidade\n- `@Min(1)` no `petId` de path.\n- `@Size(max = 8192)` na descrição da visita.\n- Métricas: `@Timed(\"petclinic.visit\")`.\n- Sem timeout/retry configurado neste serviço (lado servidor).\n"}, {"id": "sub-atendimento-digital", "kind": "subdomain", "camada": 3, "status": "proposed", "titulo": "Subdomínio Atendimento Digital", "resumo": "Concentra os canais pelos quais tutores e equipe da clínica interagem com o sistema: a tela web (via `api-gateway`) e o assistente virtual (via `genai-service`). Não guarda dado mestre — agrega e orquestra os subdomínios de Cadastro, Corpo ", "caminho": "subdominios/sub-atendimento-digital.md", "realiza": ["dom-clinica-veterinaria"], "realizado_por": ["sys-api-gateway", "sys-genai-service"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Subdomínio Atendimento Digital\nConcentra os canais pelos quais tutores e equipe da clínica interagem com o sistema: a tela web (via `api-gateway`) e o assistente virtual (via `genai-service`). Não guarda dado mestre — agrega e orquestra os subdomínios de Cadastro, Corpo Clínico e Consultas.\n\n## Sistemas\n| Sistema | Papel |\n|---|---|\n| [api-gateway](../sistemas/api-gateway/ficha.md) | porta de entrada única; serve o frontend e roteia/agrega chamadas |\n| [genai-service](../sistemas/genai-service/ficha.md) | assistente virtual com IA generativa, com ações sobre owners/pets/vets |\n\n## Fluxos executados aqui\n- [Consulta de histórico do tutor](../fluxos/flow-consulta-historico-tutor.sequencia.md) — o passo de agregação/orquestração acontece aqui\n- [Atendimento via assistente virtual](../fluxos/flow-atendimento-assistente-virtual.sequencia.md) — executado inteiramente dentro deste subdomínio (com chamadas de saída para Cadastro e Corpo Clínico)\n"}, {"id": "sub-cadastro", "kind": "subdomain", "camada": 3, "status": "proposed", "titulo": "Subdomínio Cadastro de Clientes e Pets", "resumo": "Mantém o cadastro mestre de tutores e seus pets — é a fonte de verdade referenciada por todos os demais subdomínios (consultas referenciam `pet_id`; o assistente virtual lê e escreve owners/pets).", "caminho": "subdominios/sub-cadastro.md", "realiza": ["dom-clinica-veterinaria"], "realizado_por": ["sys-customers-service"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Subdomínio Cadastro de Clientes e Pets\nMantém o cadastro mestre de tutores e seus pets — é a fonte de verdade referenciada por todos os demais subdomínios (consultas referenciam `pet_id`; o assistente virtual lê e escreve owners/pets).\n\n## Sistemas\n| Sistema | Papel |\n|---|---|\n| [customers-service](../sistemas/customers-service/ficha.md) | único sistema do subdomínio; expõe CRUD de owners e pets, e leitura de tipos de pet |\n\n## Fluxos executados aqui\n- [Cadastro de tutor e pet](../fluxos/flow-cadastro-tutor-pet.sequencia.md) — executado inteiramente dentro deste subdomínio\n- [Consulta de histórico do tutor](../fluxos/flow-consulta-historico-tutor.sequencia.md) — este subdomínio fornece o passo de leitura do owner/pets\n"}, {"id": "sub-consultas", "kind": "subdomain", "camada": 3, "status": "proposed", "titulo": "Subdomínio Consultas", "resumo": "Registra e consulta o histórico de visitas (consultas veterinárias) de cada pet.", "caminho": "subdominios/sub-consultas.md", "realiza": ["dom-clinica-veterinaria"], "realizado_por": ["sys-visits-service"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Subdomínio Consultas\nRegistra e consulta o histórico de visitas (consultas veterinárias) de cada pet.\n\n## Sistemas\n| Sistema | Papel |\n|---|---|\n| [visits-service](../sistemas/visits-service/ficha.md) | único sistema do subdomínio; expõe registro e consulta de visitas |\n\n## Fluxos executados aqui\n- [Registro de consulta veterinária](../fluxos/flow-registro-consulta.sequencia.md) — executado inteiramente dentro deste subdomínio\n- [Consulta de histórico do tutor](../fluxos/flow-consulta-historico-tutor.sequencia.md) — este subdomínio fornece o passo de leitura das visitas\n"}, {"id": "sub-corpo-clinico", "kind": "subdomain", "camada": 3, "status": "proposed", "titulo": "Subdomínio Corpo Clínico", "resumo": "Mantém o cadastro (somente leitura via API) de veterinários e suas especialidades.", "caminho": "subdominios/sub-corpo-clinico.md", "realiza": ["dom-clinica-veterinaria"], "realizado_por": ["sys-vets-service"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Subdomínio Corpo Clínico\nMantém o cadastro (somente leitura via API) de veterinários e suas especialidades.\n\n## Sistemas\n| Sistema | Papel |\n|---|---|\n| [vets-service](../sistemas/vets-service/ficha.md) | único sistema do subdomínio; expõe a lista de veterinários e especialidades |\n\n## Fluxos executados aqui\nNenhum fluxo de negócio de ponta a ponta tem seu passo principal aqui — o `vets-service` é consultado como dado de apoio pelo `api-gateway` (tela de veterinários) e pelo `genai-service` (busca semântica de veterinários). Não há fluxo macro dedicado a \"gerir corpo clínico\" documentado nesta versão — **pergunta ao PM** (ver RELATORIO.md): existe um fluxo de contratação/cadastro de veterinário que não está neste código?\n"}, {"id": "sub-plataforma", "kind": "subdomain", "camada": 3, "status": "proposed", "titulo": "Subdomínio Plataforma", "resumo": "Serviços de suporte técnico (configuração centralizada, service discovery, administração e observabilidade) que sustentam todos os demais subdomínios, mas não implementam nenhuma capacidade de negócio da clínica veterinária.", "caminho": "subdominios/sub-plataforma.md", "realiza": ["dom-clinica-veterinaria"], "realizado_por": ["sys-config-server", "sys-discovery-server", "sys-admin-server"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Subdomínio Plataforma\nServiços de suporte técnico (configuração centralizada, service discovery, administração e observabilidade) que sustentam todos os demais subdomínios, mas não implementam nenhuma capacidade de negócio da clínica veterinária.\n\n## Sistemas\n| Sistema | Papel |\n|---|---|\n| [config-server](../sistemas/config-server/ficha.md) | configuração centralizada, ponto de partida obrigatório da subida |\n| [discovery-server](../sistemas/discovery-server/ficha.md) | registro/descoberta de serviços (Eureka) |\n| [admin-server](../sistemas/admin-server/ficha.md) | console de observabilidade (opcional) |\n\nZipkin (`res-tracing-server`), Grafana e Prometheus (`res-grafana-prometheus`) também pertencem a este subdomínio, mas são tratados como recursos de infraestrutura (não têm código-fonte próprio neste repositório).\n\n## Fluxos executados aqui\nNenhum fluxo de negócio tem passo principal aqui — este subdomínio é atravessado implicitamente por todos os fluxos (toda chamada entre sistemas depende de `discovery-server` para resolver o endereço, e toda subida de serviço depende de `config-server`).\n"}], "relatorio": "# Relatório de documentação — Domínio Clínica Veterinária\n\nGerado a partir do repositório `spring-petclinic-microservices` (commit `aefaf7fa9eb0ab911a24c346ca0e4dc5837251c7`, 2026-09-23), lido em modo somente leitura em `.../fixtures/spring-petclinic-microservices`. Nenhum arquivo da fonte foi alterado.\n\nFoco pedido: **capacidades de negócio, contratos das APIs e modelo de dados de cada serviço** — as camadas de infraestrutura e plataforma foram documentadas de forma mais enxuta, o suficiente para manter a rastreabilidade completa (capacidade → fluxo → sequência → sistema → componente → recurso).\n\n## Itens por camada\n\n| Camada | Tipo | Quantidade | `extracted` | `inferred` |\n|---|---|---|---|---|\n| 1. Negócio | capacidade | 5 | 0 | 5 |\n| 1. Negócio | fluxo macro | 4 | 0 | 4 |\n| 2. Domínio | domínio (README) | 1 | 0 | 1 (síntese) |\n| 3. Subdomínio | subdomínio | 5 | 5 (estrutura) | — |\n| 3. Subdomínio | sequência técnica | 4 | 4 | 0 |\n| 4. Sistema | ficha de sistema | 8 | 8 | — |\n| 4. Sistema | contrato de API | 15 | 15 | 0 |\n| 5. Componente | componente | 12 | 12 | 0 |\n| 6. Infraestrutura | recurso | 6 | 4 | 2 (topologia de banco em produção) |\n| 6. Infraestrutura | ambiente | 2 | 2 | 0 |\n| Transversal | termo (glossário) | 4 | 4 | 0 |\n| Transversal | regra de negócio | 5 | 5 | 0 (1 com conflito registrado) |\n| Transversal | padrão | 2 | 2 | 0 |\n| Transversal | decisão (ADR) | 0 | — | — |\n| **Total** | | **73 arquivos** | | |\n\nA camada de negócio (capacidades e fluxos macro) é, como esperado, majoritariamente `inferred` — não havia brief de negócio, PRD ou backlog no repositório; as capacidades foram propostas a partir do que os sistemas realmente fazem no código.\n\n## Conflitos encontrados\n\n1. **`reg-tipos-de-pet`** — o `customers-service` não rejeita um `typeId` inexistente ao criar/atualizar um pet (`ifPresent` silencioso), enquanto a expectativa de negócio implícita é que todo pet tenha um tipo válido dentre os 6 cadastrados. Pode ser bug ou comportamento aceito — **a confirmar com o time de desenvolvimento**.\n2. **`reg-degradacao-visitas`** — o `api-gateway` trata a falha de `visits-service` com fallback gracioso (lista vazia), mas não trata a falha de `customers-service` no mesmo endpoint de agregação. Assimetria não explicada no código.\n3. **`res-mysql-visits`** — a FK `visits.pet_id → pets.id` só pode ser garantida pelo banco se ambas as tabelas estiverem no mesmo schema MySQL; em uma topologia de \"um banco por serviço\" (mais provável em microsserviços), a integridade passaria a depender só da aplicação. A topologia real de bancos em produção não está neste repositório.\n\n## Segredos encontrados (só localização, sem valores)\n\n- `spring-petclinic-genai-service/src/main/resources/application.yml` — referencia as variáveis de ambiente `AZURE_OPENAI_KEY`, `AZURE_OPENAI_ENDPOINT` e `OPENAI_API_KEY` (esta última com default `demo`, não sensível). Nenhum valor de chave foi lido ou copiado; apenas o nome da variável e o arquivo.\n- `docker-compose.yml` — repassa as mesmas três variáveis de ambiente ao container `genai-service` (`environment:`), sem valores fixos no arquivo.\n\nNenhuma outra credencial, token ou string de conexão foi encontrada nos arquivos lidos.\n\n## Lacunas relevantes (não é bug, é ausência de evidência)\n\n- **Nenhum ADR, brief de negócio ou documento de arquitetura** foi encontrado no repositório (a pasta `docs/` só contém imagens). Por isso, a pasta `decisoes/` não foi criada — não havia decisão real para documentar, e nenhuma foi inventada.\n- **Nenhum evento assíncrono** (fila, tópico, webhook) existe neste código — toda comunicação é HTTP síncrona via Eureka. Registrado explicitamente no `README.md` do domínio.\n- **A configuração real de banco de dados em produção** (MySQL: host, credenciais, uma instância por serviço ou compartilhada) vive num repositório Git externo (`spring-petclinic-microservices-config`), referenciado pelo `config-server` mas fora do escopo lido.\n- **Dono/CODEOWNERS**: nenhum dos 8 sistemas tem dono formalmente identificado no repositório.\n- **Portas de negócio em produção**: `docker-compose.yml` fixa portas (8081–8084, 8080, 8761, 8888, 9090), mas os `application.yml` dos serviços de negócio não têm `server.port` explícito — a porta efetiva fora do compose local não está confirmada.\n\n## Perguntas para as pessoas\n\n**Para o PM / dono do produto:**\n1. As capacidades propostas (`cap-cadastro-clientes-pets`, `cap-gestao-corpo-clinico`, `cap-registro-consultas`, `cap-atendimento-omnicanal`, `cap-atendimento-inteligente`) refletem como o negócio pensa esse domínio, ou faltam capacidades reais (agendamento, faturamento, prontuário clínico) que simplesmente não têm código ainda?\n2. Existe um fluxo de cadastro/gestão do corpo clínico (contratar/editar veterinário) que não está neste repositório?\n3. Quais indicadores de negócio importam para cada fluxo (volume, tempo de atendimento, taxa de uso do assistente virtual)? Nenhum foi encontrado no código.\n\n**Para o arquiteto:**\n4. A topologia real de banco de dados em produção é um MySQL por serviço (`customers`, `vets`, `visits` separados) ou uma instância compartilhada? Isso muda a análise de acoplamento e a regra de FK `visits.pet_id → pets.id`.\n5. A assimetria no `ApiGatewayController` (fallback só para `visits-service`, não para `customers-service`) é intencional?\n6. Existe algum outro domínio (fora deste repositório) que consome ou é consumido por este? O contexto de domínio ficou \"isolado\" por falta de evidência, não necessariamente porque é isolado de fato.\n\n**Para o tech lead / dev:**\n7. `customers-service` permite salvar um pet com `typeId` inválido sem erro (o tipo simplesmente fica nulo) — é o comportamento esperado?\n8. Qual é o timeout efetivo do circuit breaker do `api-gateway` (`getOwnerDetails` e o do Resilience4j nas rotas)? Não encontrado em `application.yml`.\n9. Onde a `ChatMemory` do `genai-service` é persistida (em memória do processo, Redis, banco)? Não identificado nas fontes lidas.\n\n## Estrutura gerada\n\n```\ndominio-clinica-veterinaria/\n  README.md\n  capacidades/            (5)\n  fluxos/                 (4 fluxos macro + 4 sequências técnicas)\n  subdominios/            (5)\n  sistemas/\n    customers-service/    (ficha + 2 componentes + 8 contratos)\n    vets-service/         (ficha + 1 componente + 1 contrato)\n    visits-service/       (ficha + 1 componente + 3 contratos)\n    api-gateway/          (ficha + 2 componentes + 2 contratos)\n    genai-service/        (ficha + 3 componentes + 1 contrato)\n    config-server/        (ficha + 1 componente)\n    discovery-server/     (ficha + 1 componente)\n    admin-server/         (ficha + 1 componente)\n  infraestrutura/\n    recursos/             (6)\n    ambientes/            (2)\n  glossario/              (4)\n  regras-de-negocio/      (5)\n  padroes/                (2)\n  RELATORIO.md\n```\n\nTodos os itens nascem com `status: proposed`. Cabe a uma pessoa (PM para negócio/domínio, arquiteto/tech lead para sistema/infra) revisar e promover para `approved`.\n", "camadas": {"1": "Negócio", "2": "Domínio", "3": "Subdomínio", "4": "Sistema", "5": "Componente", "6": "Infraestrutura", "0": "Transversal"}, "mapa": "flowchart LR\n  subgraph n_Plataforma[\"Plataforma\"]\n    n_sys_admin_server[\"admin-server\"]\n    n_sys_config_server[\"config-server\"]\n    n_sys_discovery_server[\"discovery-server\"]\n  end\n  subgraph n_Atendimento_Digital[\"Atendimento Digital\"]\n    n_sys_api_gateway[\"api-gateway\"]\n    n_sys_genai_service[\"genai-service\"]\n  end\n  subgraph n_Cadastro_de_Clientes_e_Pets[\"Cadastro de Clientes e Pets\"]\n    n_sys_customers_service[\"customers-service\"]\n  end\n  subgraph n_Corpo_Cl_nico[\"Corpo Clínico\"]\n    n_sys_vets_service[\"vets-service\"]\n  end\n  subgraph n_Consultas[\"Consultas\"]\n    n_sys_visits_service[\"visits-service\"]\n  end\n  n_sys_api_gateway -->|\"ctr-customers-get-owner e de\"| n_sys_customers_service\n  n_sys_api_gateway -->|\"ctr-visits-get-visits-batch \"| n_sys_visits_service\n  n_sys_api_gateway -->|\"ctr-vets-get-vets\"| n_sys_vets_service\n  n_sys_api_gateway -->|\"POST /api/genai/chatclient (\"| n_sys_genai_service\n  n_sys_api_gateway -->|\"registro/descoberta Eureka\"| n_sys_discovery_server\n  n_sys_api_gateway -->|\"propriedades externas\"| n_sys_config_server\n  n_sys_customers_service -->|\"registro/descoberta Eureka\"| n_sys_discovery_server\n  n_sys_customers_service -->|\"propriedades externas (optio\"| n_sys_config_server\n  n_sys_genai_service -->|\"GET /owners, POST /owners, P\"| n_sys_customers_service\n  n_sys_genai_service -->|\"GET /vets\"| n_sys_vets_service\n  n_ext_provedor_de_LLM_externo__Azure_OpenAI_ou_OpenAI_([\"provedor de LLM externo (Azure\"])\n  n_sys_genai_service -->|\"Chat Completions\"| n_ext_provedor_de_LLM_externo__Azure_OpenAI_ou_OpenAI_\n  n_sys_genai_service -->|\"registro/descoberta Eureka\"| n_sys_discovery_server\n  n_sys_genai_service -->|\"propriedades externas\"| n_sys_config_server\n  n_sys_vets_service -->|\"registro/descoberta Eureka\"| n_sys_discovery_server\n  n_sys_vets_service -->|\"propriedades externas\"| n_sys_config_server\n  n_sys_visits_service -->|\"registro/descoberta Eureka\"| n_sys_discovery_server\n  n_sys_visits_service -->|\"propriedades externas\"| n_sys_config_server"};
mermaid.initialize({startOnLoad:false, securityLevel:'loose', theme:'base', themeVariables:{fontFamily:'Avenir Next, Helvetica Neue, sans-serif', primaryColor:'#E6ECEF', primaryBorderColor:'#5A626A', primaryTextColor:'#1D2433', lineColor:'#5A626A', clusterBkg:'#F4F5F7', clusterBorder:'#9DA3A8', edgeLabelBackground:'#FFFFFF', tertiaryColor:'#F4F5F7', actorBkg:'#E6ECEF', actorBorder:'#5A626A', noteBkgColor:'#FFF6DA'}});
