const D = {"nome": "Serverlesspresso", "itens": [{"id": "dom-serverlesspresso", "kind": "domain", "camada": 2, "status": "proposed", "titulo": "Domínio Serverlesspresso", "resumo": "Serverlesspresso é o backend serverless de um estande de café pop-up (mostrado pela primeira vez no AWS re:Invent 2021): recebe o pedido de bebida de um cliente via QR code, orquestra o ciclo de vida do pedido até a entrega pelo barista e m", "caminho": "README.md", "realiza": ["cap-vender-cafe-sob-demanda"], "realizado_por": ["sub-nucleo-e-identidade", "sub-configuracao-da-loja", "sub-pedido", "sub-extensoes"], "extracoes": ["extracted", "inferred"], "conflito": false, "corpo": "# Domínio Serverlesspresso\nServerlesspresso é o backend serverless de um estande de café pop-up (mostrado pela primeira vez no AWS re:Invent 2021): recebe o pedido de bebida de um cliente via QR code, orquestra o ciclo de vida do pedido até a entrega pelo barista e mantém três apps de front-end (cliente, barista, admin/config — não incluídos neste repositório) atualizados em tempo real via AWS IoT Core.\n\n## Fronteiras\n- **Dentro:** autenticação do cliente (Cognito, sem senha, via SMS), emissão e validação de tokens/QR code, verificação de capacidade e horário de funcionamento da loja, orquestração do pedido (Step Functions), armazenamento do pedido e do cardápio (DynamoDB), notificação em tempo real (IoT Core), página de \"jornada do pedido\" (HTML gerado e publicado em S3/CloudFront), métricas operacionais e extensões desacopladas (event player, robô de pedidos, persistência de métricas, tempo médio de espera).\n- **Fora:** os três aplicativos de front-end (cliente, barista, admin) — mencionados no README raiz como \"not included\"; pagamento (não há cobrança no fluxo, é um evento promocional); fabricação física da bebida (feita por um humano ou por um robô simulado na extensão `OrderRobotExtension`).\n\n## Dono\nNão identificado no código. **Pergunta para o PM/tech lead:** quem é o time dono deste domínio hoje (o repositório é um sample da AWS, `aws-samples/serverless-coffee`, mantido originalmente pelo time de Developer Advocacy da AWS)?\n\n## Subdomínios\n| Subdomínio | Responsabilidade | Sistemas |\n|---|---|---|\n| [Núcleo e identidade](./subdominios/nucleo-e-identidade.md) | Bus de eventos, autenticação sem senha do cliente, endpoint IoT | sys-nucleo-serverlesspresso |\n| [Configuração da loja](./subdominios/configuracao-da-loja.md) | Cardápio, horário/capacidade da loja, \"loja aberta/fechada\" | sys-config-service |\n| [Pedido](./subdominios/pedido.md) | Do QR code ao pedido entregue: validação, orquestração, gestão de estado, contagem, notificação e jornada do pedido | sys-validator-service, sys-order-processing-service, sys-order-manager-service, sys-counting-service, sys-publisher-service, sys-order-journey-service, sys-metrics-service |\n| [Extensões](./subdominios/extensoes.md) | Add-ons desacoplados que só escutam eventos do bus, sem acesso aos recursos do core | sys-ext-event-player, sys-ext-order-robot, sys-ext-persist-metrics-dynamodb, sys-ext-wait-times |\n\n## Contexto\n```mermaid\nflowchart LR\n  Cliente((App Cliente))\n  Barista((App Barista))\n  Admin((App Admin))\n  SP[Domínio Serverlesspresso]\n  IoT[[AWS IoT Core - MQTT]]\n\n  Cliente -- HTTP API / QR code --> SP\n  Barista -- REST API --> SP\n  Admin -- REST API --> SP\n  SP -- eventos em tempo real --> IoT\n  IoT -- assina tópicos --> Cliente\n  IoT -- assina tópicos --> Barista\n  IoT -- assina tópicos --> Admin\n```\nOs três apps de front-end não estão neste repositório (ver README.md raiz); a fronteira do domínio documentado aqui é o backend.\n\n## Eventos de domínio\nTodos os eventos trafegam no barramento `Serverlesspresso` (EventBridge custom bus), `source: awsserverlessda.serverlesspresso`. Contrato técnico completo de cada evento em `sistemas/<sistema-produtor>/contratos/`.\n\n| Evento (detail-type) | Produtor | Consumidores | Contrato |\n|---|---|---|---|\n| `Validator.NewOrder` | validator-service | order-processing-service (inicia o SFN), metrics-service, order-journey-service, publisher-service | [validator-new-order](./sistemas/validator-service/contratos/validator-new-order.md) |\n| `OrderProcessor.WorkflowStarted` | order-processing-service | order-manager-service, order-journey-service, publisher-service | [order-processor-workflow-started](./sistemas/order-processing-service/contratos/order-processor-workflow-started.md) |\n| `OrderProcessor.WaitingCompletion` | order-processing-service | order-manager-service, order-journey-service, publisher-service, extensão wait-times | [order-processor-waiting-completion](./sistemas/order-processing-service/contratos/order-processor-waiting-completion.md) |\n| `OrderProcessor.OrderTimeOut` | order-processing-service | metrics-service, order-journey-service, publisher-service | [order-processor-order-timeout](./sistemas/order-processing-service/contratos/order-processor-order-timeout.md) |\n| `OrderProcessor.ShopUnavailable` | order-processing-service | order-journey-service, publisher-service | (inferred; sem consumidor dedicado encontrado no código — ver RELATORIO.md) |\n| `OrderProcessor.orderFinished` | order-processing-service | order-journey-service (gera a página HTML da jornada), extensão wait-times, publisher-service | [order-processor-order-finished](./sistemas/order-processing-service/contratos/order-processor-order-finished.md) |\n| `OrderManager.WaitingCompletion` | order-manager-service | metrics-service, publisher-service, order-journey-service, extensão persist-metrics-dynamodb, extensão wait-times | [order-manager-waiting-completion](./sistemas/order-manager-service/contratos/order-manager-waiting-completion.md) |\n| `OrderManager.Order{eventId}-COMPLETED` / `...-CANCELLED` | order-manager-service | order-journey-service (usa para escolher a imagem do diagrama), publisher-service | [order-manager-order-state-changed](./sistemas/order-manager-service/contratos/order-manager-order-state-changed.md) |\n| `OrderManager.MakeOrder` | order-manager-service | publisher-service, order-journey-service | [order-manager-make-order](./sistemas/order-manager-service/contratos/order-manager-make-order.md) |\n| `ConfigService.ConfigChanged` | config-service | publisher-service, order-journey-service | [config-service-config-changed](./sistemas/config-service/contratos/config-service-config-changed.md) |\n\nEste domínio não usa pastas separadas `mapa/` e `eventos/`: o diagrama de contexto e a tabela de eventos já estão completos aqui, e o contrato técnico de cada evento vive junto do sistema que o produz — ver nota em `RELATORIO.md`.\n"}, {"id": "cap-vender-cafe-sob-demanda", "kind": "capability", "camada": 1, "status": "proposed", "titulo": "Vender café sob demanda em um evento pop-up", "resumo": "A empresa consegue operar um balcão de café pop-up onde o cliente pede pelo celular via QR code, entra numa fila com capacidade limitada, e acompanha o pedido até a entrega pelo barista, sem uso de caixa registradora ou app dedicado de paga", "caminho": "capacidades/vender-cafe-sob-demanda.md", "realiza": [], "realizado_por": ["flow-pedido-de-cafe", "sub-pedido", "sub-configuracao-da-loja"], "extracoes": ["inferred"], "conflito": false, "corpo": "# Vender café sob demanda em um evento pop-up\nA empresa consegue operar um balcão de café pop-up onde o cliente pede pelo celular via QR code, entra numa fila com capacidade limitada, e acompanha o pedido até a entrega pelo barista, sem uso de caixa registradora ou app dedicado de pagamento.\n\nCapacidade proposta a partir do que o código implementa (fila com capacidade, cardápio configurável, validação de token); **não confirmado com PM** — não há documento de negócio no repositório.\n\n## Fluxos que a realizam\n- [Pedido de café](../fluxos/pedido-de-cafe.md)\n\n## Sistemas envolvidos\n- validator-service — emite e valida o token/QR code do cliente\n- config-service — mantém o cardápio e o estado aberto/fechado da loja\n- order-processing-service — controla capacidade da fila e orquestra o pedido de ponta a ponta\n- order-manager-service — guarda o estado do pedido e atende as ações do barista\n- publisher-service — leva o estado do pedido em tempo real para os apps\n- order-journey-service — monta o resumo/jornada do pedido ao final\n"}, {"id": "dec-001-integracoes-diretas-sem-lambda-glue", "kind": "decision", "camada": 0, "status": "proposed", "titulo": "ADR-001 Preferir integrações diretas de serviço a \"lambdas de cola\" (proposto, sem documento original)", "resumo": "Status: proposta (inferida do código; **não existe ADR no repositório** — este documento é uma reconstrução, marcado `inferred`) — Data: desconhecida", "caminho": "decisoes/ADR-001-integracoes-diretas-sem-lambda-glue.md", "realiza": [], "realizado_por": ["sys-order-manager-service", "sys-config-service", "sys-order-processing-service", "sys-order-journey-service"], "extracoes": ["inferred"], "conflito": false, "corpo": "# ADR-001 Preferir integrações diretas de serviço a \"lambdas de cola\" (proposto, sem documento original)\nStatus: proposta (inferida do código; **não existe ADR no repositório** — este documento é uma reconstrução, marcado `inferred`) — Data: desconhecida\n\n## Contexto\nVárias rotas de API (`GET/PUT /orders`, `GET/PUT /config`, `PUT /store`) e vários passos das duas state machines (leitura/escrita no DynamoDB, `PutEvents`, `SendTaskSuccess`) são implementados como integrações diretas do API Gateway ou do Step Functions com o serviço AWS de destino, via VTL ou `Resource: arn:aws:states:::<serviço>:<ação>`, sem uma função Lambda no meio.\n\n## Opções consideradas\n- Lambda entre a API/o SFN e o serviço AWS (padrão mais comum, mais fácil de testar/depurar)\n- Integração direta (menos código, menos cold start, mas lógica de mapeamento fica em VTL/ASL, mais difícil de testar unitariamente)\n\n## Decisão\nO código mostra a opção por integração direta na maior parte dos casos \"CRUD simples\" (ver arquivos em `provenance`), reservando lambdas para lógica de negócio real (`sanitize-order`, `generate-html`, os 3 publishers).\n\n## Consequências\n- Menos lambdas para manter, potencialmente menor custo/latência\n- Lógica de mapeamento de request/response fica em VTL (API Gateway) ou ASL (Step Functions), mais difícil de testar isoladamente e sem tipagem\n- Erros de integração aparecem como erros genéricos do API Gateway, sem tratamento customizado (ver componentes `rest-api-orders`, `rest-api-config`)\n\n**Esta é uma reconstrução do padrão observado, não uma decisão documentada — perguntar ao arquiteto se isso foi deliberado e se deve continuar sendo seguido.**\n"}, {"id": "flow-pedido-de-cafe", "kind": "flow", "camada": 1, "status": "proposed", "titulo": "Pedido de café", "resumo": "Do momento em que o cliente escaneia o QR code no balcão até o barista entregar (ou cancelar) a bebida, mantendo o cliente informado em tempo real.", "caminho": "fluxos/pedido-de-cafe.md", "realiza": ["cap-vender-cafe-sob-demanda"], "realizado_por": ["flow-pedido-de-cafe-sequencia"], "extracoes": ["inferred"], "conflito": false, "corpo": "# Pedido de café\nDo momento em que o cliente escaneia o QR code no balcão até o barista entregar (ou cancelar) a bebida, mantendo o cliente informado em tempo real.\n\n## Atores\n- **Cliente** — pede a bebida pelo celular\n- **Loja** (sistema automatizado: capacidade, cardápio, fila) — decide se aceita o pedido\n- **Barista** — prepara e conclui ou cancela o pedido\n\n## Etapas\n| # | Etapa | Ator | Decisão ou resultado | Técnica |\n|---|---|---|---|---|\n| 1 | Cliente pede um código de acesso ao abrir o app | Cliente | — | [passo 1](./pedido-de-cafe.sequencia.md#passo-1) |\n| 2 | Cliente escaneia o QR code físico do balcão e confirma | Cliente | Token válido? Ainda há tokens disponíveis na janela de tempo? | [passo 2](./pedido-de-cafe.sequencia.md#passo-2) |\n| 3 | Loja verifica se está aberta e se há vaga na fila | Loja | Loja aberta? Fila com capacidade livre? | [passo 3](./pedido-de-cafe.sequencia.md#passo-3) |\n| 4 | Cliente monta e envia o pedido de bebida | Cliente | O pedido está no cardápio vigente? | [passo 4](./pedido-de-cafe.sequencia.md#passo-4) |\n| 5 | Pedido recebe um número e entra na fila do barista | Loja | — | [passo 5](./pedido-de-cafe.sequencia.md#passo-5) |\n| 6 | Barista reivindica, prepara e conclui (ou cancela) o pedido | Barista | Concluído ou cancelado? | [passo 6](./pedido-de-cafe.sequencia.md#passo-6) |\n| 7 | Cliente acompanha o status em tempo real e vê a jornada do pedido ao final | Cliente / Loja | — | [passo 7](./pedido-de-cafe.sequencia.md#passo-7) |\n\n## Diagrama\n```mermaid\nflowchart LR\n  subgraph Cliente\n    A[Pede código de acesso] --> B[Escaneia QR code do balcão]\n  end\n  subgraph Loja\n    B --> C{Loja aberta e<br/>com capacidade?}\n    C -- não --> X[Pedido recusado]\n    C -- sim --> D[Aguarda o cliente montar o pedido]\n  end\n  subgraph Cliente2[Cliente]\n    D --> E[Monta e envia o pedido]\n  end\n  subgraph Loja2[Loja]\n    E --> F{Pedido está<br/>no cardápio?}\n    F -- não --> Y[Pedido rejeitado]\n    F -- sim --> G[Pedido numerado, entra na fila]\n  end\n  subgraph Barista\n    G --> H[Reivindica o pedido]\n    H --> I{Concluído ou<br/>cancelado?}\n  end\n  I -- concluído --> J[Cliente recebe a bebida e a jornada do pedido]\n  I -- cancelado --> K[Cliente é avisado do cancelamento]\n```\n\n## Indicadores\n- Tempo médio entre pedido e entrega (a confirmar com o PM)\n- Taxa de cancelamento de pedidos (a confirmar com o PM)\n- Pedidos por barista / por janela de tempo (a confirmar com o PM)\n- Utilização da capacidade máxima da fila (a confirmar com o PM)\n\n## Regras que governam\n- [Limite de tokens por janela de tempo](../regras-de-negocio/limite-de-tokens-por-janela.md)\n- [Capacidade máxima de pedidos simultâneos](../regras-de-negocio/capacidade-maxima-concorrente.md)\n- [Timeout do cliente para enviar o pedido](../regras-de-negocio/timeout-cliente-envio-pedido.md)\n- [Timeout do barista para concluir o pedido](../regras-de-negocio/timeout-barista-preparo.md)\n"}, {"id": "flow-pedido-de-cafe-sequencia", "kind": "flow", "camada": 3, "status": "proposed", "titulo": "Pedido de café: sequência técnica", "resumo": "Realiza as etapas do [fluxo macro](./pedido-de-cafe.md). Dois Step Functions cooperam via **EventBridge (assíncrono)** e **Task Tokens (`waitForTaskToken` / `SendTaskSuccess`)**: `order-processor-state-machine` fica \"pausado\" esperando o cl", "caminho": "fluxos/pedido-de-cafe.sequencia.md", "realiza": ["flow-pedido-de-cafe"], "realizado_por": ["sys-validator-service", "sys-order-processing-service", "sys-order-manager-service", "sys-config-service", "sys-publisher-service", "sys-order-journey-service", "sys-counting-service"], "extracoes": ["extracted", "extracted", "extracted"], "conflito": false, "corpo": "# Pedido de café: sequência técnica\nRealiza as etapas do [fluxo macro](./pedido-de-cafe.md). Dois Step Functions cooperam via **EventBridge (assíncrono)** e **Task Tokens (`waitForTaskToken` / `SendTaskSuccess`)**: `order-processor-state-machine` fica \"pausado\" esperando o cliente e depois o barista, e é acordado pelo `order-manager-state-machine` guardando/recuperando o token no DynamoDB.\n\n## Diagrama\n```mermaid\nsequenceDiagram\n  participant Cliente\n  participant VAL as validator-service\n  participant Bus as EventBridge (Serverlesspresso)\n  participant OPS as order-processing-service (SFN)\n  participant OMS as order-manager-service (SFN + API)\n  participant OT as OrderTable (DynamoDB)\n  participant Pub as publisher-service (IoT)\n  participant Barista\n\n  Cliente->>VAL: GET /qr-code (pede token da janela atual)\n  VAL-->>Cliente: 200 {bucket, código, validade}\n  Cliente->>VAL: POST /qr-code (escaneia QR do balcão, token)\n  alt token inválido ou sem tokens na janela\n    VAL-->>Cliente: 400 \"Invalid code\" / \"No tokens remaining\"\n  else token válido\n    VAL-)Bus: Validator.NewOrder {orderId, userId, eventId}\n    Bus-)OPS: inicia execução (regra EventBridge -> SFN)\n    OPS->>OPS: GetItem config-table (loja aberta?)\n    alt loja fechada OU fila cheia (ListExecutions >= 20)\n      OPS-)Bus: OrderProcessor.ShopUnavailable\n    else loja aberta e com capacidade\n      OPS-)Bus: OrderProcessor.WorkflowStarted (waitForTaskToken, timeout 5 min)\n      Bus-)OMS: dispara lambda workflowStarted\n      OMS->>OT: PutItem orders/{orderId} (TaskToken, ORDERSTATE=CREATED)\n      Cliente->>OMS: PUT /orders/{id} (monta e envia a bebida)\n      OMS->>OMS: GetItem config-table (cardápio) + Lambda sanitizeOrder\n      alt bebida/modificador fora do cardápio\n        OMS-->>OMS: Succeed (pedido descartado, sem aviso ao SFN)\n      else pedido válido\n        OMS->>OT: UpdateItem (grava drinkOrder, recupera TaskToken)\n        OMS->>OPS: SendTaskSuccess (retoma o SFN do cliente)\n        OPS->>OPS: UpdateItem counting-table (gera orderNumber)\n        OPS-)Bus: OrderProcessor.WaitingCompletion (waitForTaskToken, timeout 15 min)\n        Bus-)OMS: dispara lambda waitingCompletion\n        OMS->>OT: UpdateItem (grava orderNumber + novo TaskToken)\n        OMS-)Bus: OrderManager.WaitingCompletion\n        Bus-)Pub: republica no tópico IoT do usuário e do admin\n        Barista->>OMS: PUT /orders/{id}?action=make (reivindica)\n        OMS-)Bus: OrderManager.MakeOrder\n        Barista->>OMS: PUT /orders/{id}?action=complete|cancel\n        OMS->>OT: UpdateItem ORDERSTATE=COMPLETED|CANCELLED\n        OMS-)Bus: OrderManager.Order{state}\n        OMS->>OPS: SendTaskSuccess (retoma o SFN do barista)\n        OPS-)Bus: OrderProcessor.orderFinished\n        Bus-)Pub: republica estado final\n      end\n    end\n  end\n```\n\n## Passos\n### Passo 1\n`validator-service` — `GET /qr-code` (HTTP API, Cognito JWT, exige grupo `admin`). Gera/recupera um \"bucket\" de tokens por janela de 5 minutos (`serverlesspresso-validator` DynamoDB), com `availableTokens` vindo do cardápio do evento (`ConfigTable.drinksPerBarcode`). Fonte: `backends/9-validator/code/getCode.js`.\n\n### Passo 2\nCliente envia `POST /qr-code {eventId, token}`. `verifyCode.js` confere o token contra o bucket da janela atual, decrementa `availableTokens` e, se válido, publica `Validator.NewOrder` no bus com um novo `orderId` (`nanoid()`) e o `userId` (`sub` do JWT Cognito). Fonte: `backends/9-validator/code/verifyCode.js`.\n\n### Passo 3\nUma regra do EventBridge (`detail-type: Validator.NewOrder`) aciona **diretamente** a state machine `order-processor-state-machine` (sem lambda intermediária). Ela busca `config-table` para saber se a loja está aberta (`GetStore.Item.storeOpen.BOOL`) e, se sim, chama `ListExecutions` na própria state machine para checar se já existem 20 execuções `RUNNING` (capacidade máxima hardcoded). Se a loja estiver fechada ou a fila cheia, emite `OrderProcessor.ShopUnavailable` e termina. Fonte: `backends/4-order-processing/statemachine/op.asl.json`.\n\n### Passo 4\nCom capacidade livre, o SFN emite `OrderProcessor.WorkflowStarted` com `events:putEvents.waitForTaskToken` (heartbeat 300 s = 5 min) e fica pausado. O evento aciona a lambda `workflowStarted` do `order-manager-service`, que grava o pedido (`PK=orders`, `SK=orderId`, `TaskToken`, `ORDERSTATE={eventId}-CREATED`) em `serverlesspresso-order-table`. O cliente então chama `PUT /orders/{id}` (API Gateway → Step Functions `StartExecution` **direto**, sem lambda) na `order-manager-state-machine`, que busca o cardápio, invoca a lambda `sanitizeOrder` para validar bebida/modificadores e, se válido, grava o pedido e retoma o SFN do cliente com `SendTaskSuccess`. Se o cliente não enviar em 5 minutos, o `Catch` de `States.Timeout` dispara `OrderProcessor.OrderTimeOut` e o pedido morre.\n\n### Passo 5\nDe volta no `order-processing-service`, a state machine incrementa `IDvalue` em `serverlesspresso-counting-table` (contador de pedidos do evento) e emite `OrderProcessor.WaitingCompletion` (novo `waitForTaskToken`, heartbeat 900 s = 15 min). A lambda `waitingCompletion` do `order-manager-service` grava o novo `TaskToken` e o `orderNumber` no pedido e publica `OrderManager.WaitingCompletion` com os dados completos (inclusive `drinkOrder`) — esse é o evento que o `publisher-service`, o `order-journey-service`, o `metrics-service` e as extensões `wait-times`/`persist-metrics` consomem.\n\n### Passo 6\nO barista age via `PUT /orders/{id}?action=make|unmake|complete|cancel` (mesma rota direta API Gateway → Step Functions, mas nesta chamada quem inicia é a `order-manager-state-machine` na \"outra ponta\": ela decide a ação pelo campo `action`). `make`/`unmake` gravam `baristaUserId` e emitem `OrderManager.MakeOrder`; `complete`/`cancel` gravam `ORDERSTATE` e emitem `OrderManager.Order{eventId}-COMPLETED` ou `...-CANCELLED`, e então chamam `SendTaskSuccess` no `TaskToken` guardado no passo 5, retomando o `order-processing-service`.\n\n### Passo 7\nO `order-processing-service`, retomado, sempre emite `OrderProcessor.orderFinished` (o ASL não distingue conclusão de cancelamento nesse ponto — ver conflito em `RELATORIO.md`). Esse evento aciona a state machine do `order-journey-service`, que consulta todos os eventos daquele `orderId` em `OrderJourneyEventsTable`, invoca a lambda `GenerateHtml` para montar uma página de linha do tempo e salva o HTML em S3 (servido via CloudFront). Em paralelo, o `publisher-service` republica cada evento do fluxo nos tópicos MQTT do IoT Core para os apps de cliente, barista e admin em tempo real.\n\n### Caminho de erro\n- **Token inválido ou esgotado (passo 2):** `verifyCode.js` retorna 400 sem publicar evento; nada entra no fluxo.\n- **Loja fechada ou fila cheia (passo 3):** `OrderProcessor.ShopUnavailable`; não há lambda consumidor identificado no código para esse evento — ver pergunta em `RELATORIO.md`.\n- **Cliente não envia o pedido em 5 min (passo 4):** `Catch States.Timeout` → `OrderProcessor.OrderTimeOut`; a lambda `OrderTimedOut` do order-manager marca `ORDERSTATE={eventId}-CANCELLED` com o motivo.\n- **Bebida fora do cardápio (passo 4):** a state machine do order-manager termina em `Succeed` sem gravar nem notificar o cliente — o SFN do order-processing continua esperando até estourar o timeout de 5 min. **Comportamento provavelmente não intencional** — ver pergunta em `RELATORIO.md`.\n- **Barista não conclui em 15 min (passo 6):** `Catch States.Timeout` → `OrderProcessor.OrderTimeOut` novamente, mesma lambda `OrderTimedOut`.\n- **Lambda `Sanitize order` indisponível:** `Retry` de até 6 tentativas (backoff x2, 2 s inicial) antes de propagar o erro.\n"}, {"id": "term-barista", "kind": "term", "camada": 0, "status": "proposed", "titulo": "Barista", "resumo": "Ator humano (ou simulado pela extensão `OrderRobotExtension`/`backends/5-order-manager/robot/`) que reivindica (`make`/`unmake`), prepara e conclui (`complete`) ou cancela (`cancel`) um pedido através da mesma rota `PUT /orders/{id}` usada ", "caminho": "glossario/barista.md", "realiza": [], "realizado_por": [], "extracoes": ["inferred"], "conflito": false, "corpo": "# Barista\nAtor humano (ou simulado pela extensão `OrderRobotExtension`/`backends/5-order-manager/robot/`) que reivindica (`make`/`unmake`), prepara e conclui (`complete`) ou cancela (`cancel`) um pedido através da mesma rota `PUT /orders/{id}` usada pelo cliente, diferenciado pelo campo `action` e por seu `baristaUserId`.\n\nNão confundir com: \"Cliente\" (quem faz o pedido), \"robot\" (flag booleana no registro do pedido que indica se ele foi originado por um robô de teste, não pelo app real).\n"}, {"id": "term-bucket-de-tokens", "kind": "term", "camada": 0, "status": "proposed", "titulo": "Bucket (de tokens)", "resumo": "Registro em `serverlesspresso-validator` que representa uma janela de tempo fixa (5 minutos, `TIME_INTERVAL`) durante a qual um único código (`last_code`) é válido e um número limitado de bebidas (`availableTokens`, vindo do cardápio) pode ", "caminho": "glossario/bucket-de-tokens.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# Bucket (de tokens)\nRegistro em `serverlesspresso-validator` que representa uma janela de tempo fixa (5 minutos, `TIME_INTERVAL`) durante a qual um único código (`last_code`) é válido e um número limitado de bebidas (`availableTokens`, vindo do cardápio) pode ser resgatado. \"Bucket\" aqui não é um S3 bucket — é um termo de \"time bucketing\"/janela deslizante.\n\nNão confundir com: `JourneyBucket` (esse sim um bucket S3, do `order-journey-service`).\n"}, {"id": "term-eventid", "kind": "term", "camada": 0, "status": "proposed", "titulo": "eventId", "resumo": "Identificador do \"evento pop-up\" físico (ex.: um dia específico do balcão em um re:Invent ou conferência). É a partição usada em quase todas as tabelas (`config-{eventId}`, `orderID-{eventId}`) e no nome dos tópicos IoT — permite que várias", "caminho": "glossario/eventid.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# eventId\nIdentificador do \"evento pop-up\" físico (ex.: um dia específico do balcão em um re:Invent ou conferência). É a partição usada em quase todas as tabelas (`config-{eventId}`, `orderID-{eventId}`) e no nome dos tópicos IoT — permite que várias edições do Serverlesspresso rodem sobre a mesma infraestrutura sem se misturar.\n\nNão confundir com: `orderId` (identifica um pedido individual), `EventBridge event` (a mensagem que trafega no barramento, chamada de \"evento\" no sentido de arquitetura orientada a eventos).\n"}, {"id": "term-task-token", "kind": "term", "camada": 0, "status": "proposed", "titulo": "Task Token", "resumo": "Identificador opaco que o AWS Step Functions gera quando uma execução usa o padrão `waitForTaskToken`. O `order-processing-service` gera um token, o `order-manager-service` guarda esse token no DynamoDB (campo `TaskToken` do pedido) e, quan", "caminho": "glossario/task-token.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# Task Token\nIdentificador opaco que o AWS Step Functions gera quando uma execução usa o padrão `waitForTaskToken`. O `order-processing-service` gera um token, o `order-manager-service` guarda esse token no DynamoDB (campo `TaskToken` do pedido) e, quando a ação humana correspondente acontece (cliente envia o pedido, barista conclui), chama `SendTaskSuccess` com o token para \"acordar\" a execução pausada.\n\nNão confundir com: o \"código\"/token de 6 dígitos do login por SMS (ver `create-auth-challenge`), nem com o token do QR code do balcão (ver componente `verify-qr-code`).\n"}, {"id": "env-consolidado-01-appcore", "kind": "environment", "camada": 6, "status": "proposed", "titulo": "Ambiente \"consolidado\" (pilha 01-appCore)", "resumo": "Segunda e última pilha do caminho de implantação documentado no README raiz (\"Install microservices\"). Reúne, em um único `template.yaml`, os recursos de **config-service, validator-service, order-processing-service, order-manager-service, ", "caminho": "infraestrutura/ambientes/consolidado-01-appcore.md", "realiza": ["sys-config-service", "sys-validator-service", "sys-order-processing-service", "sys-order-manager-service", "sys-publisher-service", "sys-order-journey-service", "sys-counting-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# Ambiente \"consolidado\" (pilha 01-appCore)\nSegunda e última pilha do caminho de implantação documentado no README raiz (\"Install microservices\"). Reúne, em um único `template.yaml`, os recursos de **config-service, validator-service, order-processing-service, order-manager-service, publisher-service, order-journey-service** e a tabela de contagem — todos com `CodeUri` apontando de volta para `../backends/<n>-*/`. É este o ambiente que efetivamente implementa o [fluxo de pedido de café](../../fluxos/pedido-de-cafe.sequencia.md) segundo o caminho de instalação oficial.\n\n## Implantação\n```mermaid\nflowchart TB\n  subgraph appcore[\"Pilha serverlesspresso (01-appCore), região us-east-1\"]\n    CFG[config-service]\n    VAL[validator-service]\n    OPS[order-processing-service]\n    OMS[order-manager-service]\n    PUB[publisher-service]\n    OJ[order-journey-service]\n  end\n  CORE[00-baseCore] -->|SSM: bus ARN, user pool| appcore\n  VAL -->|Validator.NewOrder| OPS\n  OPS -->|WorkflowStarted, WaitingCompletion| OMS\n  OMS -->|SendTaskSuccess| OPS\n  OPS -->|orderFinished| OJ\n  PUB -.assina todos os eventos.-> appcore\n```\n**Nota:** `metrics-service` (backends/7) **não** está incluído neste `template.yaml` — ver `modulos-standalone-backends.md`.\n"}, {"id": "env-core-00-basecore", "kind": "environment", "camada": 6, "status": "proposed", "titulo": "Ambiente \"core\" (pilha 00-baseCore)", "resumo": "Primeira pilha a ser implantada (README raiz, seção \"Installing the backend\"), sempre na região `us-east-1` por instrução do README. Cria o bus de eventos, o Cognito e o endpoint IoT, e publica os identificadores desses recursos em **AWS Sy", "caminho": "infraestrutura/ambientes/core-00-basecore.md", "realiza": ["sys-nucleo-serverlesspresso"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# Ambiente \"core\" (pilha 00-baseCore)\nPrimeira pilha a ser implantada (README raiz, seção \"Installing the backend\"), sempre na região `us-east-1` por instrução do README. Cria o bus de eventos, o Cognito e o endpoint IoT, e publica os identificadores desses recursos em **AWS Systems Manager Parameter Store** (`/Serverlesspresso/core/*`) para as pilhas seguintes consumirem via `AWS::SSM::Parameter::Value<String>`.\n\n## Implantação\n```mermaid\nflowchart TB\n  subgraph core[\"Pilha serverlesspresso-core (00-baseCore)\"]\n    BUS[[EventBridge Serverlesspresso]]\n    UP[Cognito User Pool]\n    IOT[(IoT Core endpoint)]\n  end\n  core -->|outputs| SSM[(SSM Parameter Store<br/>/Serverlesspresso/core/*)]\n  SSM --> APPCORE[01-appCore]\n  SSM --> STANDALONE[\"Módulos standalone<br/>(7-metrics, 8-order-journey, 9-validator)\"]\n```\n"}, {"id": "env-modulos-standalone-backends", "kind": "environment", "camada": 6, "status": "proposed", "titulo": "Ambiente \"módulos standalone\" (backends/*/template.yaml)", "resumo": "**Achado, não instrução oficial de deploy.** Além da pilha consolidada `01-appCore`, três diretórios de `backends/` têm o **seu próprio** `template.yaml`, completo e implantável isoladamente, lendo os parâmetros do core via SSM (`AWS::SSM::", "caminho": "infraestrutura/ambientes/modulos-standalone-backends.md", "realiza": ["sys-metrics-service", "sys-order-journey-service", "sys-validator-service"], "realizado_por": [], "extracoes": ["inferred"], "conflito": false, "corpo": "# Ambiente \"módulos standalone\" (backends/*/template.yaml)\n**Achado, não instrução oficial de deploy.** Além da pilha consolidada `01-appCore`, três diretórios de `backends/` têm o **seu próprio** `template.yaml`, completo e implantável isoladamente, lendo os parâmetros do core via SSM (`AWS::SSM::Parameter::Value<String>`, ex. `/Serverlesspresso/core/eventbusname`):\n- `backends/7-metrics-service/template.yaml`\n- `backends/8-order-journey/template.yaml`\n- `backends/9-validator/template.yaml`\n\nO README raiz **não menciona** implantar esses templates separadamente — só instrui `00-baseCore` + `01-appCore`. A leitura mais provável (não confirmada) é que estes são os módulos incrementais do workshop (cada um implantado isoladamente durante uma etapa do tutorial em workshop.serverlesscoffee.com) e que `01-appCore` é a versão \"tudo junto\" montada depois. Isso implica que, dependendo de qual caminho um time realmente segue, **duas topologias diferentes e não totalmente equivalentes coexistem no repositório** (ex.: `validator-service` standalone usa HTTP API + JWT authorizer manual, enquanto a versão em `01-appCore` usa REST API + Cognito User Pools authorizer).\n\n## Implantação\n```mermaid\nflowchart TB\n  CORE[00-baseCore] -->|SSM params| M7[7-metrics-service]\n  CORE -->|SSM params| M8[8-order-journey]\n  CORE -->|SSM params| M9[9-validator]\n```\n\n**Pergunta para o tech lead:** qual topologia está de fato em produção/uso — só `01-appCore`, ou os módulos standalone substituindo partes dela? (ver `RELATORIO.md`)\n"}, {"id": "res-ddb-config-table", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "DynamoDB \"serverlesspresso-config-table\"", "resumo": "", "caminho": "infraestrutura/recursos/res-ddb-config-table.md", "realiza": ["sys-config-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# DynamoDB \"serverlesspresso-config-table\"\n| Campo | Valor |\n|---|---|\n| Tipo | banco |\n| Tecnologia | Amazon DynamoDB, `PAY_PER_REQUEST`, Streams (`NEW_AND_OLD_IMAGES`) |\n| Ambientes | consolidado (01-appCore) |\n| Definido em | `01-appCore/template.yaml` |\n\n## Usado por\n- config-service (`config-changed` lê o stream; API REST lê/escreve direto)\n- validator-service (lê `drinksPerBarcode`)\n- order-processing-service (lê `storeOpen`)\n- order-manager-service (lê o cardápio)\n- fill-databases-custom-resource (popula na criação/atualização da pilha)\n"}, {"id": "res-ddb-counting-table", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "DynamoDB \"serverlesspresso-counting-table\"", "resumo": "", "caminho": "infraestrutura/recursos/res-ddb-counting-table.md", "realiza": ["sys-counting-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# DynamoDB \"serverlesspresso-counting-table\"\n| Campo | Valor |\n|---|---|\n| Tipo | banco |\n| Tecnologia | Amazon DynamoDB, `PAY_PER_REQUEST` |\n| Ambientes | consolidado (01-appCore) |\n| Definido em | `01-appCore/template.yaml` |\n\n## Usado por\n- order-processing-service (`Generate Order Number` — `UpdateItem` direto, incrementa `IDvalue`)\n- fill-databases-custom-resource (popula na criação/atualização da pilha)\n- counting-service (código órfão `getOrderId.js`/`resetOrderId.js` referencia esta tabela mas não está implantado — ver ficha do sistema)\n"}, {"id": "res-ddb-order-journey-events-table", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "DynamoDB \"OrderJourneyEventsTable\"", "resumo": "", "caminho": "infraestrutura/recursos/res-ddb-order-journey-events-table.md", "realiza": ["sys-order-journey-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# DynamoDB \"OrderJourneyEventsTable\"\n| Campo | Valor |\n|---|---|\n| Tipo | banco (log de eventos) |\n| Tecnologia | Amazon DynamoDB, `PAY_PER_REQUEST`, Streams (`NEW_AND_OLD_IMAGES`, sem consumidor do stream identificado) |\n| Ambientes | consolidado (01-appCore) |\n| Definido em | `01-appCore/template.yaml` |\n\n## Usado por\n- order-journey-service (grava todo evento do domínio; consulta ao montar a página HTML)\n"}, {"id": "res-ddb-order-table", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "DynamoDB \"serverlesspresso-order-table\"", "resumo": "", "caminho": "infraestrutura/recursos/res-ddb-order-table.md", "realiza": ["sys-order-manager-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# DynamoDB \"serverlesspresso-order-table\"\n| Campo | Valor |\n|---|---|\n| Tipo | banco |\n| Tecnologia | Amazon DynamoDB, `PAY_PER_REQUEST`, Streams (`NEW_AND_OLD_IMAGES`), LSI `LSI-timestamp`, GSIs `GSI-status` e `GSI-userId` |\n| Ambientes | consolidado (01-appCore) |\n| Definido em | `01-appCore/template.yaml` |\n\n## Usado por\n- order-manager-service (lambdas `workflow-started`, `waiting-completion`, `order-timed-out`, state machine, API REST — leitura e escrita)\n"}, {"id": "res-ddb-validator-table", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "DynamoDB \"serverlesspresso-validator\"", "resumo": "", "caminho": "infraestrutura/recursos/res-ddb-validator-table.md", "realiza": ["sys-validator-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# DynamoDB \"serverlesspresso-validator\"\n| Campo | Valor |\n|---|---|\n| Tipo | banco |\n| Tecnologia | Amazon DynamoDB, `PAY_PER_REQUEST`, Streams (`NEW_AND_OLD_IMAGES`, sem consumidor do stream identificado) |\n| Ambientes | consolidado (01-appCore); no template standalone (`backends/9-validator/template.yaml`) o mesmo papel é cumprido por uma tabela chamada `ApplicationTable` |\n| Definido em | `01-appCore/template.yaml` |\n\n## Usado por\n- validator-service (`get-qr-code`, `verify-qr-code`)\n"}, {"id": "res-event-bus-serverlesspresso", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "EventBridge bus \"Serverlesspresso\"", "resumo": "", "caminho": "infraestrutura/recursos/res-event-bus-serverlesspresso.md", "realiza": ["sys-nucleo-serverlesspresso"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# EventBridge bus \"Serverlesspresso\"\n| Campo | Valor |\n|---|---|\n| Tipo | tópico (barramento de eventos) |\n| Tecnologia | Amazon EventBridge (custom event bus) |\n| Ambientes | core (00-baseCore); recriado também nos templates standalone de `extensions/EventPlayer` (mesmo nome — risco de colisão, ver RELATORIO.md) |\n| Definido em | `00-baseCore/template.yaml` |\n\n## Usado por\n- Todos os sistemas do domínio publicam e/ou consomem eventos neste bus (`source: awsserverlessda.serverlesspresso`)\n- Uma regra (`LogsRule`) encaminha todos os eventos do source para um CloudWatch Log Group, para depuração\n"}, {"id": "res-http-api-validator", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "API Gateway do validator-service", "resumo": "", "caminho": "infraestrutura/recursos/res-http-api-validator.md", "realiza": ["sys-validator-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# API Gateway do validator-service\n| Campo | Valor |\n|---|---|\n| Tipo | gateway |\n| Tecnologia | Na pilha consolidada (01-appCore): API Gateway **REST** (`RESTApiValidatorService`) com autorização Cognito User Pools. No template standalone (`backends/9-validator/template.yaml`): API Gateway **HTTP** (`MyAdminApi`) com autorizador JWT do Cognito configurado manualmente (issuer/audience) — **duas tecnologias de API diferentes para o mesmo serviço**, ver `RELATORIO.md` |\n| Ambientes | consolidado (01-appCore) e módulo standalone (backends/9-validator) |\n| Definido em | `01-appCore/template.yaml`; `backends/9-validator/template.yaml` |\n\n## Usado por\n- validator-service (`get-qr-code`, `verify-qr-code`)\n"}, {"id": "res-identity-pool-cognito", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "Cognito Identity Pool \"ServerlesspressoIdentityPool\"", "resumo": "", "caminho": "infraestrutura/recursos/res-identity-pool-cognito.md", "realiza": ["sys-nucleo-serverlesspresso"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# Cognito Identity Pool \"ServerlesspressoIdentityPool\"\n| Campo | Valor |\n|---|---|\n| Tipo | banco de identidade (credenciais federadas AWS) |\n| Tecnologia | Amazon Cognito Identity Pool, permite identidades não-autenticadas (`AllowUnauthenticatedIdentities: true`) |\n| Ambientes | core (00-baseCore) |\n| Definido em | `00-baseCore/template.yaml` |\n\n## Usado por\n- Apps de front-end (fora deste repositório) — obtêm credenciais AWS temporárias para conectar direto no AWS IoT Core (`iot:Connect`, `iot:Subscribe`, `iot:Receive`) via os papéis `CognitoAuthorizedRole`/`CognitoUnAuthorizedRole`\n"}, {"id": "res-iot-core-realtime", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "AWS IoT Core (realtime messaging)", "resumo": "", "caminho": "infraestrutura/recursos/res-iot-core-realtime.md", "realiza": ["sys-nucleo-serverlesspresso"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# AWS IoT Core (realtime messaging)\n| Campo | Valor |\n|---|---|\n| Tipo | cluster/serviço de mensageria (MQTT) |\n| Tecnologia | AWS IoT Core (`AWS::IoT::Thing` + endpoint de dados descoberto via Custom Resource) |\n| Ambientes | core (00-baseCore); endpoint publicado via SSM/Output para o `publisher-service` |\n| Definido em | `00-baseCore/template.yaml` |\n\n## Usado por\n- publisher-service (as 3 lambdas publicam mensagens nos tópicos `serverlesspresso-admin-*`, `serverlesspresso-user-*`, `serverlesspresso-config-*`)\n- Apps de front-end (assinam os tópicos via Identity Pool)\n"}, {"id": "res-journey-bucket-s3", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "S3 bucket \"serverlesspresso-order-journey-{region}-{accountId}\"", "resumo": "", "caminho": "infraestrutura/recursos/res-journey-bucket-s3.md", "realiza": ["sys-order-journey-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# S3 bucket \"serverlesspresso-order-journey-{region}-{accountId}\"\n| Campo | Valor |\n|---|---|\n| Tipo | bucket |\n| Tecnologia | Amazon S3, servido via CloudFront (não público diretamente) |\n| Ambientes | consolidado (01-appCore) |\n| Definido em | `01-appCore/template.yaml` |\n\n## Usado por\n- order-journey-service (`Save to S3` grava o HTML com `Acl: public-read`; `generate-html` referencia assets estáticos hospedados neste mesmo bucket, com nome de bucket **hardcoded** de uma implantação de exemplo — ver `RELATORIO.md`)\n"}, {"id": "res-journey-cloudfront", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "CloudFront \"JourneyCloudFront\"", "resumo": "", "caminho": "infraestrutura/recursos/res-journey-cloudfront.md", "realiza": ["sys-order-journey-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# CloudFront \"JourneyCloudFront\"\n| Campo | Valor |\n|---|---|\n| Tipo | cluster/CDN |\n| Tecnologia | Amazon CloudFront, origem S3 via Origin Access Identity, `DefaultTTL: 5` segundos |\n| Ambientes | consolidado (01-appCore) |\n| Definido em | `01-appCore/template.yaml` |\n\n## Usado por\n- order-journey-service (serve a página HTML final ao cliente)\n"}, {"id": "res-metrics-queue-sqs", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "SQS \"MetricsQueue\"", "resumo": "", "caminho": "infraestrutura/recursos/res-metrics-queue-sqs.md", "realiza": ["sys-ext-persist-metrics-dynamodb"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# SQS \"MetricsQueue\"\n| Campo | Valor |\n|---|---|\n| Tipo | fila |\n| Tecnologia | Amazon SQS, `SqsManagedSseEnabled: true`, `VisibilityTimeout: 30s` |\n| Ambientes | extensão `PersistOrderMetricsToDynamoDB` (independente) |\n| Definido em | `extensions/PersistOrderMetricsToDynamoDB/template.yaml` |\n\n## Usado por\n- extensao-persist-metrics-dynamodb (`publishMetric` lambda consome via `EventSourceMapping`)\n"}, {"id": "res-metrics-table-dynamodb", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "DynamoDB \"serverlesspresso-metrics-table\"", "resumo": "", "caminho": "infraestrutura/recursos/res-metrics-table-dynamodb.md", "realiza": ["sys-ext-persist-metrics-dynamodb"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# DynamoDB \"serverlesspresso-metrics-table\"\n| Campo | Valor |\n|---|---|\n| Tipo | banco |\n| Tecnologia | Amazon DynamoDB, capacidade **provisionada** (5 RCU / 5 WCU) — diferente do `PAY_PER_REQUEST` usado no restante do domínio |\n| Ambientes | extensão `PersistOrderMetricsToDynamoDB` (independente) |\n| Definido em | `extensions/PersistOrderMetricsToDynamoDB/template.yaml` |\n\n## Usado por\n- extensao-persist-metrics-dynamodb (`publishMetric` lambda)\n"}, {"id": "res-rest-api-config", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "API Gateway REST \"ServerlesspressoConfigServiceRestApi\"", "resumo": "", "caminho": "infraestrutura/recursos/res-rest-api-config.md", "realiza": ["sys-config-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# API Gateway REST \"ServerlesspressoConfigServiceRestApi\"\n| Campo | Valor |\n|---|---|\n| Tipo | gateway |\n| Tecnologia | Amazon API Gateway (REST), integração direta com DynamoDB |\n| Ambientes | consolidado (01-appCore) |\n| Definido em | `01-appCore/template.yaml`, corpo da API em `backends/2-config-service/RestAPIs/api.yaml` |\n\n## Usado por\n- config-service (`rest-api-config`: `GET /config`, `GET /admin-config`, `PUT /store`)\n"}, {"id": "res-rest-api-order-manager", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "API Gateway REST \"ServerlesspressoOrdermanagerRestApi\"", "resumo": "", "caminho": "infraestrutura/recursos/res-rest-api-order-manager.md", "realiza": ["sys-order-manager-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# API Gateway REST \"ServerlesspressoOrdermanagerRestApi\"\n| Campo | Valor |\n|---|---|\n| Tipo | gateway |\n| Tecnologia | Amazon API Gateway (REST), integrações diretas com DynamoDB e Step Functions, autorização Cognito User Pools |\n| Ambientes | consolidado (01-appCore) |\n| Definido em | `01-appCore/template.yaml`, corpo da API em `backends/5-order-manager/RestAPIs/api.yaml` |\n\n## Usado por\n- order-manager-service (`rest-api-orders`: `GET /orders`, `GET /orders/{id}`, `PUT /orders/{id}`)\n"}, {"id": "res-user-pool-cognito", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "Cognito User Pool \"ServerlesspressoUserPool\"", "resumo": "", "caminho": "infraestrutura/recursos/res-user-pool-cognito.md", "realiza": ["sys-nucleo-serverlesspresso"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# Cognito User Pool \"ServerlesspressoUserPool\"\n| Campo | Valor |\n|---|---|\n| Tipo | banco de identidade / autenticação |\n| Tecnologia | Amazon Cognito User Pool, login por `phone_number`, fluxo `CUSTOM_CHALLENGE` (sem senha) |\n| Ambientes | core (00-baseCore); ARN e ID publicados via SSM (`/Serverlesspresso/core/userpool*`) para todos os outros stacks |\n| Definido em | `00-baseCore/template.yaml` |\n\n## Usado por\n- validator-service (autoriza `GET/POST /qr-code`)\n- order-manager-service (autoriza `GET/PUT /orders*`)\n- config-service (autoriza `GET /admin-config`, `PUT /store`)\n- Todas as 4 lambdas de trigger do Cognito (`pre-sign-up`, `define-auth-challenge`, `create-auth-challenge`, `verify-auth-challenge-response`)\n"}, {"id": "std-orquestracao-por-task-token", "kind": "standard", "camada": 0, "status": "proposed", "titulo": "Orquestração por Task Token entre duas state machines", "resumo": "Como o domínio conecta um processo de longa duração (o pedido, minutos a horas) com ações humanas assíncronas (cliente monta o pedido, barista conclui), sem fazer polling nem manter uma lambda \"esperando\".", "caminho": "padroes/orquestracao-por-task-token-entre-duas-state-machines.md", "realiza": [], "realizado_por": ["sys-order-processing-service", "sys-order-manager-service"], "extracoes": ["inferred"], "conflito": false, "corpo": "# Orquestração por Task Token entre duas state machines\nComo o domínio conecta um processo de longa duração (o pedido, minutos a horas) com ações humanas assíncronas (cliente monta o pedido, barista conclui), sem fazer polling nem manter uma lambda \"esperando\".\n\n## Exemplo\n1. State machine A emite `events:putEvents.waitForTaskToken` e pausa.\n2. O evento carrega o `$$.Task.Token` no `detail`.\n3. Uma lambda ou outra state machine guarda esse token em um banco (aqui, no campo `TaskToken` do pedido em DynamoDB).\n4. Quando a ação humana ocorre, quem tem o token chama `states:SendTaskSuccess` (ou `SendTaskFailure`) para retomar a state machine A.\n5. Um `Catch` de `States.Timeout` com `HeartbeatSeconds` cobre o caso de a ação humana nunca acontecer.\n\n## Onde se aplica\n- `order-processing-service` ↔ `order-manager-service`, nos dois pontos do [fluxo de pedido de café](../fluxos/pedido-de-cafe.sequencia.md) (cliente envia o pedido; barista conclui/cancela)\n"}, {"id": "rule-capacidade-maxima-concorrente", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "Capacidade máxima de pedidos simultâneos", "resumo": "No máximo **20 pedidos** podem estar em andamento ao mesmo tempo (execuções `RUNNING` da `order-processor-state-machine`); um 21º pedido é recusado com `OrderProcessor.ShopUnavailable` até que algum dos 20 termine.", "caminho": "regras-de-negocio/capacidade-maxima-concorrente.md", "realiza": ["flow-pedido-de-cafe"], "realizado_por": ["cmp-order-processor-state-machine"], "extracoes": ["extracted"], "conflito": false, "corpo": "# Capacidade máxima de pedidos simultâneos\nNo máximo **20 pedidos** podem estar em andamento ao mesmo tempo (execuções `RUNNING` da `order-processor-state-machine`); um 21º pedido é recusado com `OrderProcessor.ShopUnavailable` até que algum dos 20 termine.\n\n## Onde está implementada\n- `backends/4-order-processing/statemachine/op.asl.json`, states `ListExecutions` + `Is capacity available?` (`$.isCapacityAvailable[20]`)\n\n## Conflito\nValor `20` está **hardcoded como índice de array** na expressão JSONPath (`$.isCapacityAvailable[20]`), não como parâmetro nomeado — forma frágil de configurar um limite de negócio; qualquer mudança exige editar o ASL. Marcado para confirmação com o tech lead sobre se isso é intencional (ver `RELATORIO.md`).\n"}, {"id": "rule-limite-de-tokens-por-janela", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "Limite de tokens por janela de tempo", "resumo": "A cada janela de 5 minutos, só um número limitado de bebidas pode ser resgatado por token (`ConfigTable.drinksPerBarcode`, valor configurável por evento). Isso limita quantos clientes podem escanear o QR code do balcão e iniciar um pedido d", "caminho": "regras-de-negocio/limite-de-tokens-por-janela.md", "realiza": ["flow-pedido-de-cafe"], "realizado_por": ["cmp-validator-get-qr-code", "cmp-validator-verify-qr-code"], "extracoes": ["extracted"], "conflito": false, "corpo": "# Limite de tokens por janela de tempo\nA cada janela de 5 minutos, só um número limitado de bebidas pode ser resgatado por token (`ConfigTable.drinksPerBarcode`, valor configurável por evento). Isso limita quantos clientes podem escanear o QR code do balcão e iniciar um pedido dentro da mesma janela.\n\n## Onde está implementada\n- `backends/9-validator/code/getCode.js` (cria o bucket com `availableTokens = drinksPerBarcode`)\n- `backends/9-validator/code/verifyCode.js` (decrementa a cada resgate válido)\n\n## Conflito\nNão identificado.\n"}, {"id": "rule-timeout-barista-preparo", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "Timeout do barista para concluir o pedido", "resumo": "Depois que o pedido entra na fila com um número, o barista tem **15 minutos** (`HeartbeatSeconds: 900` no state `Emit - Awaiting Completion TT`) para concluir ou cancelar antes de o pedido expirar por timeout.", "caminho": "regras-de-negocio/timeout-barista-preparo.md", "realiza": ["flow-pedido-de-cafe"], "realizado_por": ["cmp-order-processor-state-machine"], "extracoes": ["extracted"], "conflito": false, "corpo": "# Timeout do barista para concluir o pedido\nDepois que o pedido entra na fila com um número, o barista tem **15 minutos** (`HeartbeatSeconds: 900` no state `Emit - Awaiting Completion TT`) para concluir ou cancelar antes de o pedido expirar por timeout.\n\n## Onde está implementada\n- `backends/4-order-processing/statemachine/op.asl.json`, state `Emit - Awaiting Completion TT`\n\n## Conflito\nNão identificado. Mesmo comentário do timeout do cliente: valor hardcoded no ASL.\n"}, {"id": "rule-timeout-cliente-envio-pedido", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "Timeout do cliente para enviar o pedido", "resumo": "Depois de escanear o QR code, o cliente tem **5 minutos** (`HeartbeatSeconds: 300` no state `Emit - Workflow Started TT`) para montar e enviar a bebida antes de o pedido ser cancelado automaticamente por timeout.", "caminho": "regras-de-negocio/timeout-cliente-envio-pedido.md", "realiza": ["flow-pedido-de-cafe"], "realizado_por": ["cmp-order-processor-state-machine"], "extracoes": ["extracted"], "conflito": false, "corpo": "# Timeout do cliente para enviar o pedido\nDepois de escanear o QR code, o cliente tem **5 minutos** (`HeartbeatSeconds: 300` no state `Emit - Workflow Started TT`) para montar e enviar a bebida antes de o pedido ser cancelado automaticamente por timeout.\n\n## Onde está implementada\n- `backends/4-order-processing/statemachine/op.asl.json`, state `Emit - Workflow Started TT`\n\n## Conflito\nNão identificado. Valor hardcoded no ASL, não configurável por variável de ambiente — mudar exige alterar e reimplantar a definição da state machine.\n"}, {"id": "cmp-config-changed", "kind": "component", "camada": 5, "status": "proposed", "titulo": "config-changed", "resumo": "Republica no EventBridge qualquer alteração gravada em `ConfigTable` (cardápio, loja aberta/fechada).", "caminho": "sistemas/config-service/componentes/config-changed.md", "realiza": ["sys-config-service"], "realizado_por": ["res-ddb-config-table", "res-event-bus-serverlesspresso"], "extracoes": ["extracted"], "conflito": false, "corpo": "# config-changed\nRepublica no EventBridge qualquer alteração gravada em `ConfigTable` (cardápio, loja aberta/fechada).\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda |\n| Gatilho | DynamoDB Streams de `ConfigTable` (`BatchSize: 1`, `StartingPosition: TRIM_HORIZON`) |\n| Entrada | `event.Records[0].dynamodb.NewImage` |\n| Saída | Publica `ConfigService.ConfigChanged` com a imagem nova do item |\n| Timeout / memória / concorrência | 15 s / 128 MB |\n\n## Dependências\n- EventBridge `Serverlesspresso` — `events:PutEvents`\n\n## Erros e retentativas\nSem `Retry`/DLQ próprios; falhas de stream seguem o comportamento padrão de retry do DynamoDB Streams + Lambda (retenção de 24h, sem bisect configurado).\n"}, {"id": "cmp-config-fill-databases", "kind": "component", "camada": 5, "status": "proposed", "titulo": "fill-databases-custom-resource", "resumo": "Custom Resource do CloudFormation que popula `ConfigTable` (cardápio inicial) e `CountingTable` (contador zerado) toda vez que a pilha `01-appCore` é criada ou atualizada.", "caminho": "sistemas/config-service/componentes/fill-databases-custom-resource.md", "realiza": ["sys-config-service"], "realizado_por": ["res-ddb-config-table", "res-ddb-counting-table"], "extracoes": ["extracted"], "conflito": false, "corpo": "# fill-databases-custom-resource\nCustom Resource do CloudFormation que popula `ConfigTable` (cardápio inicial) e `CountingTable` (contador zerado) toda vez que a pilha `01-appCore` é criada ou atualizada.\n\n| Campo | Valor |\n|---|---|\n| Tipo | job (Lambda-backed CloudFormation Custom Resource) |\n| Gatilho | `AWS::CloudFormation::CustomResource` nos eventos `Create`/`Update`/`Delete` do stack |\n| Entrada | `initMenuState.JSON`, `initCountingState.JSON` (embutidos no pacote da função) |\n| Saída | `BatchWriteItem` em `ConfigTable` e `CountingTable`; responde ao CloudFormation via `ResponseURL` |\n| Timeout / memória / concorrência | 15 s / 128 MB |\n\n## Dependências\n- `ConfigTable`, `CountingTable` — `dynamodb:BatchWriteItem`\n\n## Erros e retentativas\n`Delete` não limpa dados (apenas responde `SUCCESS`); não há tratamento de falha parcial do `BatchWriteItem` (itens não processados não são reenviados).\n"}, {"id": "cmp-config-rest-api", "kind": "component", "camada": 5, "status": "proposed", "titulo": "rest-api-config", "resumo": "Rotas de leitura e escrita da configuração da loja, todas em integração direta do API Gateway com o DynamoDB (sem lambda).", "caminho": "sistemas/config-service/componentes/rest-api-config.md", "realiza": ["sys-config-service"], "realizado_por": ["res-ddb-config-table", "res-rest-api-config"], "extracoes": ["extracted"], "conflito": false, "corpo": "# rest-api-config\nRotas de leitura e escrita da configuração da loja, todas em integração direta do API Gateway com o DynamoDB (sem lambda).\n\n| Campo | Valor |\n|---|---|\n| Tipo | endpoint (API Gateway REST, integração direta) |\n| Gatilho | `GET /config` (público), `GET /admin-config` (Cognito), `PUT /store` (Cognito) |\n| Entrada | Query `eventId` (GET); query `eventId`, `state=open|closed` (PUT) |\n| Saída | Item de `ConfigTable` (GET); item atualizado (PUT) |\n| Timeout / memória / concorrência | N/A (sem lambda) |\n\n## Dependências\n- `serverlesspresso-config-table` — via role `ConfigRESTApiRole` (`dynamodb:GetItem`, `UpdateItem`, `Query`)\n\n## Erros e retentativas\nSem lambda; erros de VTL/permissão retornam como erro genérico do API Gateway.\n"}, {"id": "ctr-config-service-config-changed", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "ConfigService.ConfigChanged", "resumo": "{", "caminho": "sistemas/config-service/contratos/config-service-config-changed.md", "realiza": ["sys-config-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# ConfigService.ConfigChanged\n| Campo | Valor |\n|---|---|\n| Tipo | evento (EventBridge) |\n| Produtor | config-service (`config-changed`) |\n| Consumidores | publisher-service (tópico IoT `serverlesspresso-config`), order-journey-service |\n| Especificação | Sem AsyncAPI formal |\n\n## Exemplo\n```json\n{\n  \"NewImage\": {\n    \"PK\": { \"S\": \"config-ABC\" },\n    \"storeOpen\": { \"BOOL\": true }\n  }\n}\n```\n"}, {"id": "sys-config-service", "kind": "system", "camada": 4, "status": "proposed", "titulo": "config-service", "resumo": "Fonte de verdade do cardápio do evento e do estado \"loja aberta/fechada\"; avisa o resto do sistema quando essa configuração muda.", "caminho": "sistemas/config-service/ficha.md", "realiza": ["sub-configuracao-da-loja"], "realizado_por": ["cmp-config-changed", "cmp-config-rest-api", "cmp-config-fill-databases", "res-ddb-config-table", "res-rest-api-config"], "extracoes": ["extracted"], "conflito": false, "corpo": "# config-service\nFonte de verdade do cardápio do evento e do estado \"loja aberta/fechada\"; avisa o resto do sistema quando essa configuração muda.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Configuração da loja |\n| Dono | Não identificado |\n| Stack | Node.js 14.x (Lambda) + API Gateway (integração direta com DynamoDB) |\n| Repositório | `backends/2-config-service/`; recursos em `01-appCore/template.yaml` |\n| Criticidade | Média-alta — se `storeOpen` ou o cardápio estiverem errados, o `order-processing-service` recusa ou aceita pedidos incorretamente |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph config-service\n    API[REST API]\n    L1[config-changed]\n  end\n  API -->|GET /config, /admin-config,<br/>PUT /store, integração direta| DB[(ConfigTable)]\n  DB -- DynamoDB Stream --> L1\n  L1 -.publica.-> BUS[[EventBridge]]\n```\n\n## Expõe\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `GET /config`, `GET /admin-config`, `PUT /store` | REST API (integração direta com DynamoDB) | [rest-api-config](./componentes/rest-api-config.md) |\n| `ConfigService.ConfigChanged` | Evento | [contrato](./contratos/config-service-config-changed.md) |\n\n## Consome\nNenhuma dependência de outro sistema do domínio.\n\n## Dados\n```mermaid\nerDiagram\n  CONFIG {\n    string PK \"config-eventId\"\n    boolean storeOpen\n    number drinksPerBarcode\n    array menu\n  }\n```\nTabela `serverlesspresso-config-table`, com `StreamViewType: NEW_AND_OLD_IMAGES`. Fonte: `01-appCore/template.yaml#L316-L328`; conteúdo inicial em `01-appCore/initDB/initMenuState.JSON`.\n\n## Estados\nNão há máquina de estados de entidade; `storeOpen` é um booleano simples.\n\n## Qualidade\n- `ConfigChangedFunction`: `BatchSize: 1`, `StartingPosition: TRIM_HORIZON` no DynamoDB Stream — processa uma mudança por vez, sem paralelismo\n- Timeout: 15 s\n"}, {"id": "cmp-counting-get-order-id", "kind": "component", "camada": 5, "status": "proposed", "titulo": "get-order-id", "resumo": "Incrementa e devolve o contador de pedidos.", "caminho": "sistemas/counting-service/componentes/get-order-id.md", "realiza": ["sys-counting-service"], "realizado_por": ["res-ddb-counting-table"], "extracoes": ["extracted"], "conflito": false, "corpo": "# get-order-id\nIncrementa e devolve o contador de pedidos.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda (código presente, **sem `template.yaml` que o implante** — órfão) |\n| Gatilho | Desconhecido — nenhum `Events:` encontrado em templates do repositório |\n| Entrada | Nenhuma (ignora o `event`) |\n| Saída | `{orderNumber}` |\n| Timeout / memória / concorrência | Não definido (sem template) |\n\n## Dependências\n- `CountingTable` (via `process.env.TableName`) — `UpdateItem` incrementando `IDvalue` para `PK='orderID'` (chave fixa, sem `eventId` — diferente do que a state machine do order-processing usa hoje, que é `orderID-{eventId}`)\n\n## Erros e retentativas\nN/A — não implantado.\n"}, {"id": "cmp-counting-reset-order-id", "kind": "component", "camada": 5, "status": "proposed", "titulo": "reset-order-id", "resumo": "Zera o contador de pedidos.", "caminho": "sistemas/counting-service/componentes/reset-order-id.md", "realiza": ["sys-counting-service"], "realizado_por": ["res-ddb-counting-table"], "extracoes": ["extracted"], "conflito": false, "corpo": "# reset-order-id\nZera o contador de pedidos.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda (código presente, **sem `template.yaml` que o implante** — órfão) |\n| Gatilho | Desconhecido — provavelmente pensado para acionamento manual/agendado |\n| Entrada | Nenhuma |\n| Saída | Nenhuma |\n| Timeout / memória / concorrência | Não definido (sem template) |\n\n## Dependências\n- `CountingTable` — `UpdateItem` (`IDvalue = 0` para `PK='orderID'`)\n\n## Erros e retentativas\nN/A — não implantado.\n"}, {"id": "sys-counting-service", "kind": "system", "camada": 4, "status": "proposed", "titulo": "counting-service", "resumo": "**Sistema parcialmente órfão.** A tabela `CountingTable` (`serverlesspresso-counting-table`) é real e usada — mas na pilha consolidada (`01-appCore`) quem incrementa o contador é um state (`Generate Order Number`) direto dentro do `order-pr", "caminho": "sistemas/counting-service/ficha.md", "realiza": ["sub-pedido"], "realizado_por": ["res-ddb-counting-table"], "extracoes": ["extracted"], "conflito": false, "corpo": "# counting-service\n**Sistema parcialmente órfão.** A tabela `CountingTable` (`serverlesspresso-counting-table`) é real e usada — mas na pilha consolidada (`01-appCore`) quem incrementa o contador é um state (`Generate Order Number`) direto dentro do `order-processing-service`, não as lambdas deste diretório.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Pedido |\n| Dono | Não identificado |\n| Stack | Node.js (Lambda) — mas sem `template.yaml` próprio |\n| Repositório | `backends/1-counting-service/code/` |\n| Criticidade | Baixa como está hoje (código não implantado); a **função** que ele cumpre (gerar `orderNumber`) é crítica e está embutida no `order-processing-service` |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph counting-service[\"counting-service (código não referenciado por nenhum template.yaml)\"]\n    L1[get-order-id]\n    L2[reset-order-id]\n  end\n  L1 -.não usado.-> CNT[(CountingTable)]\n  L2 -.não usado.-> CNT\n  OPS[order-processing-service] -->|UpdateItem direto, incrementa IDvalue| CNT\n```\n\n## Expõe\nNenhum contrato ativo.\n\n## Consome\nNenhum.\n\n## Dados\n```mermaid\nerDiagram\n  COUNTER {\n    string PK \"orderID-eventId\"\n    number IDvalue\n  }\n```\nTabela `serverlesspresso-counting-table`, populada inicialmente por `01-appCore/initDB/initCountingState.JSON`.\n\n## Estados\nN/A.\n\n## Qualidade\n- Nenhum `template.yaml` em `backends/1-counting-service/` referencia `getOrderId.js`/`resetOrderId.js` como função Lambda — **achado a confirmar com o tech lead** (ver `RELATORIO.md`)\n"}, {"id": "sys-ext-event-player", "kind": "system", "camada": 4, "status": "proposed", "titulo": "extensao-event-player", "resumo": "Step Functions que reproduz uma sequência gravada de eventos reais do Serverlesspresso (um em cada ~5 s, ao longo de ~15 minutos), útil para testar extensões e dashboards sem precisar operar o balcão de verdade.", "caminho": "sistemas/extensao-event-player/ficha.md", "realiza": ["sub-extensoes"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# extensao-event-player\nStep Functions que reproduz uma sequência gravada de eventos reais do Serverlesspresso (um em cada ~5 s, ao longo de ~15 minutos), útil para testar extensões e dashboards sem precisar operar o balcão de verdade.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Extensões |\n| Dono | Não identificado |\n| Stack | Step Functions (AWS SAM) |\n| Repositório | `extensions/EventPlayer/` |\n| Criticidade | Nenhuma (ferramenta de teste/demo) |\n\n## Contêineres\n```mermaid\nflowchart LR\n  SFN[EventPlayer state machine] -->|events:PutEvents| BUS[[EventBridge Serverlesspresso]]\n```\n\n## Expõe\nNenhum contrato de negócio; entrada manual `{\"eventId\":\"ABC\"}` via console do Step Functions.\n\n## Consome\nNenhuma.\n\n## Dados / Estados\nN/A.\n\n## Qualidade\nImplantado e removido de forma independente do core (regra da pasta `extensions/`, ver `subdominios/extensoes.md`); recria seu próprio `AWS::Events::EventBus` chamado `Serverlesspresso` no template — **pode colidir com o bus já criado por `00-baseCore`** se implantado na mesma conta/região sem ajuste (ver `RELATORIO.md`).\n"}, {"id": "sys-ext-order-robot", "kind": "system", "camada": 4, "status": "proposed", "titulo": "extensao-order-robot", "resumo": "Duas state machines que simulam, respectivamente, um \"robô cliente\" fazendo pedidos em lote e um \"robô barista\" preparando-os automaticamente — usadas para gerar carga/demonstração sem humanos.", "caminho": "sistemas/extensao-order-robot/ficha.md", "realiza": ["sub-extensoes"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# extensao-order-robot\nDuas state machines que simulam, respectivamente, um \"robô cliente\" fazendo pedidos em lote e um \"robô barista\" preparando-os automaticamente — usadas para gerar carga/demonstração sem humanos.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Extensões |\n| Dono | Não identificado |\n| Stack | Step Functions (AWS SAM) |\n| Repositório | `extensions/OrderRobotExtension/` |\n| Criticidade | Nenhuma (ferramenta de carga/demo) |\n\n## Contêineres\n```mermaid\nflowchart LR\n  OrderRobot[OrderRobot SFN] -->|simula pedidos| BUS[[EventBridge Serverlesspresso]]\n  BUS -->|ProducerRobot.FulfillOrder| BaristaRobot[BaristaRobot SFN]\n  BaristaRobot -->|events:PutEvents| BUS\n```\n\n## Expõe\n`BaristaRobot` escuta `ProducerRobot.FulfillOrder` (prefixo); não há evidência no repositório de quem publica esse evento — possivelmente o próprio `OrderRobot` ou o app `robot/` do order-manager (`backends/5-order-manager/robot/`). **Inferido, a confirmar.**\n\n## Consome\n| Evento | Tipo |\n|---|---|\n| `ProducerRobot.FulfillOrder` | Evento (EventBridge) |\n\n## Dados / Estados\nN/A.\n\n## Qualidade\nImplantado/removido de forma independente do core.\n"}, {"id": "sys-ext-persist-metrics-dynamodb", "kind": "system", "camada": 4, "status": "proposed", "titulo": "extensao-persist-metrics-dynamodb", "resumo": "Exemplo de extensão \"EventBridge → SQS → Lambda → DynamoDB\": uma regra roteia `OrderManager.WaitingCompletion` para uma fila SQS, que alimenta uma lambda que grava em uma tabela DynamoDB própria da extensão.", "caminho": "sistemas/extensao-persist-metrics-dynamodb/ficha.md", "realiza": ["sub-extensoes"], "realizado_por": ["res-metrics-queue-sqs", "res-metrics-table-dynamodb"], "extracoes": ["extracted"], "conflito": false, "corpo": "# extensao-persist-metrics-dynamodb\nExemplo de extensão \"EventBridge → SQS → Lambda → DynamoDB\": uma regra roteia `OrderManager.WaitingCompletion` para uma fila SQS, que alimenta uma lambda que grava em uma tabela DynamoDB própria da extensão.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Extensões |\n| Dono | Não identificado |\n| Stack | SQS + Lambda (Node.js 16.x) + DynamoDB (AWS SAM, com `AWS::Serverless::Connector`) |\n| Repositório | `extensions/PersistOrderMetricsToDynamoDB/` |\n| Criticidade | Nenhuma (exemplo de referência para novas extensões) |\n\n## Contêineres\n```mermaid\nflowchart LR\n  BUS[[EventBridge Serverlesspresso]] -->|OrderManager.WaitingCompletion| Q[[MetricsQueue - SQS]]\n  Q --> L[publishMetric lambda]\n  L --> DB[(MetricsTable)]\n```\n\n## Expõe\nNenhum contrato externo.\n\n## Consome\n| Evento | Tipo |\n|---|---|\n| `OrderManager.WaitingCompletion` | Evento (EventBridge → SQS) |\n\n## Dados\nTabela `serverlesspresso-metrics-table` (`PK`/`SK`), capacidade provisionada (5 RCU/5 WCU) — diferente do padrão `PAY_PER_REQUEST` usado no core.\n\n## Qualidade\n- Fila SQS com `VisibilityTimeout: 30s`, `ReceiveMessageWaitTimeSeconds: 5` (long polling)\n- `EventSourceMapping`: lotes de até 10 mensagens, janela de 30 s\n"}, {"id": "sys-ext-wait-times", "kind": "system", "camada": 4, "status": "proposed", "titulo": "extensao-wait-times", "resumo": "Calcula o tempo médio de preparo por tipo de bebida a partir dos eventos de início (`OrderManager.WaitingCompletion`) e fim (`OrderProcessor.orderFinished`) do pedido, e publica o resultado de volta no bus.", "caminho": "sistemas/extensao-wait-times/ficha.md", "realiza": ["sub-extensoes"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# extensao-wait-times\nCalcula o tempo médio de preparo por tipo de bebida a partir dos eventos de início (`OrderManager.WaitingCompletion`) e fim (`OrderProcessor.orderFinished`) do pedido, e publica o resultado de volta no bus.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Extensões |\n| Dono | Não identificado |\n| Stack | AWS CDK (TypeScript) — único sistema do domínio que não usa SAM |\n| Repositório | `extensions/WaitTimes/` |\n| Criticidade | Nenhuma (métrica de negócio complementar) |\n\n## Contêineres\n```mermaid\nflowchart LR\n  BUS[[EventBridge Serverlesspresso]] -->|OrderManager.WaitingCompletion| SFN[Duration SFN]\n  BUS -->|OrderProcessor.orderFinished| SFN\n  SFN --> DB[(OrderDurationTable)]\n  SFN --> L[calculateAvgFunction]\n  L -->|OrderManager.DrinkAverageTime| BUS\n```\n\n## Expõe\n| Evento | Tipo |\n|---|---|\n| `OrderManager.DrinkAverageTime` | Evento (EventBridge) — média das últimas 10 (`nbItemsForAverage`) durações por bebida |\n\n## Consome\n| Evento | Tipo |\n|---|---|\n| `OrderManager.WaitingCompletion` | Evento (grava o horário de início) |\n| `OrderProcessor.orderFinished` | Evento (grava o horário de fim e dispara o cálculo) |\n\n## Dados\n`OrderDurationTable` (DynamoDB, chave `orderId`, GSI `drinkIndex` por `drink`).\n\n## Qualidade\nX-Ray (`tracing: ACTIVE`/`tracingEnabled: true`) habilitado na lambda e na state machine — único sistema do domínio com tracing explícito no código lido.\n"}, {"id": "cmp-metrics-order-manager-cancelled", "kind": "component", "camada": 5, "status": "proposed", "titulo": "order-manager-order-cancelled-metric", "resumo": "Registra no CloudWatch pedidos cancelados pelo barista.", "caminho": "sistemas/metrics-service/componentes/order-manager-order-cancelled-metric.md", "realiza": ["sys-metrics-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# order-manager-order-cancelled-metric\nRegistra no CloudWatch pedidos cancelados pelo barista.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda |\n| Gatilho | Evento EventBridge `detail-type` prefixo `OrderManager.OrderCancelled` — **ver divergência de nome de evento na ficha do sistema** |\n| Entrada | Evento `OrderManager.Order*-CANCELLED` |\n| Saída | `cloudwatch:PutMetricData` |\n| Timeout / memória / concorrência | 3 s / 128 MB |\n\n## Dependências\n- CloudWatch Metrics\n\n## Erros e retentativas\nSem `Retry`/DLQ configurados.\n"}, {"id": "cmp-metrics-order-manager-waiting-completion", "kind": "component", "camada": 5, "status": "proposed", "titulo": "order-manager-waiting-completion-metric", "resumo": "Registra no CloudWatch cada pedido que entrou na fila do barista.", "caminho": "sistemas/metrics-service/componentes/order-manager-waiting-completion-metric.md", "realiza": ["sys-metrics-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# order-manager-waiting-completion-metric\nRegistra no CloudWatch cada pedido que entrou na fila do barista.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda |\n| Gatilho | Evento EventBridge `detail-type` prefixo `OrderManager.WaitingCompletion` |\n| Entrada | Evento `OrderManager.WaitingCompletion` |\n| Saída | `cloudwatch:PutMetricData` |\n| Timeout / memória / concorrência | 3 s / 128 MB |\n\n## Dependências\n- CloudWatch Metrics\n\n## Erros e retentativas\nSem `Retry`/DLQ configurados.\n"}, {"id": "cmp-metrics-order-processor-timeout", "kind": "component", "camada": 5, "status": "proposed", "titulo": "order-processor-order-timeout-metric", "resumo": "Registra no CloudWatch pedidos perdidos por timeout (cliente ou barista).", "caminho": "sistemas/metrics-service/componentes/order-processor-order-timeout-metric.md", "realiza": ["sys-metrics-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# order-processor-order-timeout-metric\nRegistra no CloudWatch pedidos perdidos por timeout (cliente ou barista).\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda |\n| Gatilho | Evento EventBridge `detail-type` prefixo `OrderProcessor.OrderTimeOut` |\n| Entrada | Evento `OrderProcessor.OrderTimeOut` |\n| Saída | `cloudwatch:PutMetricData` |\n| Timeout / memória / concorrência | 3 s / 128 MB |\n\n## Dependências\n- CloudWatch Metrics\n\n## Erros e retentativas\nSem `Retry`/DLQ configurados.\n"}, {"id": "cmp-metrics-validator-new-order", "kind": "component", "camada": 5, "status": "proposed", "titulo": "validator-new-order-metric", "resumo": "Registra no CloudWatch cada novo pedido validado.", "caminho": "sistemas/metrics-service/componentes/validator-new-order-metric.md", "realiza": ["sys-metrics-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# validator-new-order-metric\nRegistra no CloudWatch cada novo pedido validado.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda |\n| Gatilho | Evento EventBridge `detail-type` prefixo `Validator.NewOrder` |\n| Entrada | Evento `Validator.NewOrder` |\n| Saída | `cloudwatch:PutMetricData` |\n| Timeout / memória / concorrência | 3 s / 128 MB (globais do template) |\n\n## Dependências\n- CloudWatch Metrics (`CloudWatchPutMetricPolicy`)\n\n## Erros e retentativas\nSem `Retry`/DLQ configurados.\n"}, {"id": "sys-metrics-service", "kind": "system", "camada": 4, "status": "proposed", "titulo": "metrics-service", "resumo": "Publica métricas customizadas no CloudWatch a partir de 4 eventos do domínio, para observar o funcionamento do balcão (quantos pedidos, quantos cancelados, quantos com timeout).", "caminho": "sistemas/metrics-service/ficha.md", "realiza": ["sub-pedido"], "realizado_por": ["cmp-metrics-validator-new-order", "cmp-metrics-order-manager-cancelled", "cmp-metrics-order-processor-timeout", "cmp-metrics-order-manager-waiting-completion"], "extracoes": ["extracted"], "conflito": false, "corpo": "# metrics-service\nPublica métricas customizadas no CloudWatch a partir de 4 eventos do domínio, para observar o funcionamento do balcão (quantos pedidos, quantos cancelados, quantos com timeout).\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Pedido |\n| Dono | Não identificado |\n| Stack | Node.js 14.x (Lambda) |\n| Repositório | `backends/7-metrics-service/` — **stack próprio, standalone, não referenciado por `01-appCore/template.yaml`** |\n| Criticidade | Baixa — puramente observabilidade; sua ausência não afeta o pedido |\n\n## Contêineres\n```mermaid\nflowchart LR\n  BUS[[EventBridge Serverlesspresso]]\n  subgraph metrics-service\n    L1[validator-new-order-metric]\n    L2[order-manager-order-cancelled-metric]\n    L3[order-processor-order-timeout-metric]\n    L4[order-manager-waiting-completion-metric]\n  end\n  BUS -->|Validator.NewOrder| L1\n  BUS -->|OrderManager.OrderCancelled| L2\n  BUS -->|OrderProcessor.OrderTimeOut| L3\n  BUS -->|OrderManager.WaitingCompletion| L4\n  L1 --> CW[(CloudWatch Metrics)]\n  L2 --> CW\n  L3 --> CW\n  L4 --> CW\n```\n\n## Expõe\nNenhum contrato; só grava métricas no CloudWatch (`cloudwatch:PutMetricData` via `CloudWatchPutMetricPolicy`).\n\n## Consome\n| Sistema | Contrato | Tipo |\n|---|---|---|\n| validator-service | `Validator.NewOrder` | Evento |\n| order-manager-service | `OrderManager.OrderCancelled`* | Evento |\n| order-processing-service | `OrderProcessor.OrderTimeOut` | Evento |\n| order-manager-service | `OrderManager.WaitingCompletion` | Evento |\n\n\\* O padrão real emitido pelo order-manager-state-machine é `OrderManager.Order{eventId}-CANCELLED` (com o `eventId` no meio do nome) — o prefixo `OrderManager.OrderCancelled` desta regra **não bate exatamente** com o que é publicado; ver `RELATORIO.md`.\n\n## Dados\nNenhum banco próprio.\n\n## Estados\nN/A.\n\n## Qualidade\n- Timeout: 3 s em todas as funções\n- **Este stack não é implantado pelo caminho documentado no README raiz** (que só manda subir `00-baseCore` e `01-appCore`) — ver `infraestrutura/ambientes/modulos-standalone-backends.md`\n"}, {"id": "cmp-nucleo-create-auth-challenge", "kind": "component", "camada": 5, "status": "proposed", "titulo": "create-auth-challenge", "resumo": "Gera o código de 6 dígitos e envia por SMS via SNS.", "caminho": "sistemas/nucleo-serverlesspresso/componentes/create-auth-challenge.md", "realiza": ["sys-nucleo-serverlesspresso"], "realizado_por": ["res-user-pool-cognito"], "extracoes": ["extracted"], "conflito": false, "corpo": "# create-auth-challenge\nGera o código de 6 dígitos e envia por SMS via SNS.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda (Cognito trigger `CreateAuthChallenge`) |\n| Gatilho | Início do desafio customizado (login por telefone) |\n| Entrada | `event.request.userAttributes.phone_number`, `event.request.session` |\n| Saída | `event.response.{publicChallengeParameters, privateChallengeParameters, challengeMetadata}`; efeito colateral: SMS via SNS |\n| Timeout / memória / concorrência | Não definido explicitamente |\n\n## Dependências\n- Amazon SNS (`sns:*` — política ampla, ver `RELATORIO.md`) — envio do SMS com o código\n\n## Erros e retentativas\nSem tratamento de erro explícito; falha do `sns.publish` propaga e falha o login.\n"}, {"id": "cmp-nucleo-define-auth-challenge", "kind": "component", "camada": 5, "status": "proposed", "titulo": "define-auth-challenge", "resumo": "Decide o próximo passo do login sem senha: emitir o desafio customizado, aceitar, ou falhar após tentativas demais.", "caminho": "sistemas/nucleo-serverlesspresso/componentes/define-auth-challenge.md", "realiza": ["sys-nucleo-serverlesspresso"], "realizado_por": ["res-user-pool-cognito"], "extracoes": ["extracted"], "conflito": false, "corpo": "# define-auth-challenge\nDecide o próximo passo do login sem senha: emitir o desafio customizado, aceitar, ou falhar após tentativas demais.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda (Cognito trigger `DefineAuthChallenge`) |\n| Gatilho | Cada etapa do fluxo de login customizado |\n| Entrada | `event.request.session` (histórico de desafios da sessão) |\n| Saída | `event.response.{issueTokens, failAuthentication, challengeName}` |\n| Timeout / memória / concorrência | Não definido explicitamente |\n\n## Dependências\n- Nenhuma chamada externa\n\n## Erros e retentativas\nFalha a autenticação após 3 respostas erradas (`session.length >= 4` com o último resultado falso); contorna um bug conhecido do SDK iOS da AWS que envia `SRP_A` no primeiro desafio customizado (comentário no próprio código).\n"}, {"id": "cmp-nucleo-get-iot-endpoint", "kind": "component", "camada": 5, "status":
