const D = {"nome": "Clínica Veterinária", "itens": [{"id": "dom-clinica-veterinaria", "kind": "domain", "camada": 2, "status": "proposed", "titulo": "Domínio Clínica Veterinária", "resumo": "Gerir o cadastro de tutores e pets, o corpo clínico de veterinários e o histórico de consultas de uma clínica veterinária, oferecendo atendimento tanto por uma tela web quanto por um assistente virtual com IA generativa. Documentação gerada", "caminho": "README.md", "realiza": [], "realizado_por": ["sub-cadastro", "sub-corpo-clinico", "sub-consultas", "sub-atendimento-digital", "sub-plataforma"], "extracoes": ["inferred"], "conflito": false, "corpo": "\n# Domínio Clínica Veterinária\nGerir o cadastro de tutores e pets, o corpo clínico de veterinários e o histórico de consultas de uma clínica veterinária, oferecendo atendimento tanto por uma tela web quanto por um assistente virtual com IA generativa. Documentação gerada a partir do código-fonte de `spring-petclinic-microservices` (branch/commit `aefaf7f`, 2026-09-23); não houve documento de arquitetura, ADR ou brief de negócio para consultar além do `README.md` técnico do repositório.\n\n## Visão de capacidades (camada 1, inferido a partir do código)\n```mermaid\nflowchart TB\n  subgraph Cadastro\n    C1[Cadastrar e manter clientes e pets]\n  end\n  subgraph Corpo_Clinico[Corpo Clínico]\n    C2[Divulgar corpo clínico e especialidades]\n  end\n  subgraph Consultas\n    C3[Registrar e consultar histórico de consultas]\n  end\n  subgraph Atendimento\n    C4[Atender num único canal digital]\n    C5[Atender por assistente virtual]\n  end\n```\nVer cada capacidade em [`capacidades/`](capacidades/) e os fluxos macro em [`fluxos/`](fluxos/).\n\n## Fronteiras\n- **Dentro:** cadastro de tutores e pets, cadastro/consulta de veterinários e especialidades, registro e consulta de visitas (consultas veterinárias), o portal web de atendimento e o assistente virtual de IA generativa.\n- **Fora:** qualquer processo de agendamento de horários, faturamento/cobrança, prontuário clínico detalhado (exames, prescrições), autenticação/autorização de usuários — nenhuma dessas capacidades foi encontrada no código. **Não presuma que elas existem só porque seria natural para uma clínica veterinária real** — isso é uma lacuna a confirmar com o PM, não um fato extraído.\n\n## Dono\nNão informado — não há `CODEOWNERS` nem seção de donos no repositório. **A confirmar.**\n\n## Subdomínios\n| Subdomínio | Responsabilidade | Sistemas |\n|---|---|---|\n| [Cadastro de Clientes e Pets](subdominios/sub-cadastro.md) | Cadastro mestre de tutores e pets | `customers-service` |\n| [Corpo Clínico](subdominios/sub-corpo-clinico.md) | Catálogo de veterinários e especialidades | `vets-service` |\n| [Consultas](subdominios/sub-consultas.md) | Histórico de visitas por pet | `visits-service` |\n| [Atendimento Digital](subdominios/sub-atendimento-digital.md) | Canais de acesso: portal web e assistente virtual | `api-gateway`, `genai-service` |\n| [Plataforma](subdominios/sub-plataforma.md) | Configuração, service discovery, observabilidade | `config-server`, `discovery-server`, `admin-server` |\n\n## Contexto\n```mermaid\nflowchart LR\n  Tutor((Tutor)) --> GW[api-gateway: portal web]\n  Equipe((Equipe clínica)) --> GW\n  GW --> DOM[Domínio Clínica Veterinária]\n  DOM --> LLM[Provedor de LLM externo\\nAzure OpenAI / OpenAI]\n  DOM -.config externa.-> CFGREPO[(Repo Git externo:\\nspring-petclinic-microservices-config)]\n```\nNão foram encontrados outros domínios internos (de outro time/produto) que este domínio consuma ou publique eventos para — o único sistema externo real é o provedor de LLM e o repositório de configuração externo. **Inferido**: isso pode significar que este é um domínio isolado, ou que integrações reais existem apenas na configuração externa não lida aqui.\n\n## Eventos de domínio\n| Evento | Produtor | Consumidores | Contrato |\n|---|---|---|---|\n| — | — | — | — |\n\nNenhum evento assíncrono (fila, tópico, webhook) foi encontrado no código deste repositório — toda comunicação entre sistemas é síncrona via HTTP/REST, resolvida por service discovery (Eureka). Isso é um fato `extracted` (ausência de qualquer dependência de mensageria nos `pom.xml` e nenhum `@KafkaListener`/`sqs`/`@RabbitListener` no código-fonte).\n"}, {"id": "cap-atendimento-inteligente", "kind": "capability", "camada": 1, "status": "proposed", "titulo": "Atender por assistente virtual (IA generativa)", "resumo": "A clínica oferece um canal conversacional em que o usuário pergunta ou pede ações sobre tutores, pets e veterinários em linguagem natural, sem precisar navegar pelas telas tradicionais.", "caminho": "capacidades/cap-atendimento-inteligente.md", "realiza": ["dom-clinica-veterinaria"], "realizado_por": ["flow-atendimento-assistente-virtual"], "extracoes": ["inferred"], "conflito": false, "corpo": "\n# Atender por assistente virtual (IA generativa)\nA clínica oferece um canal conversacional em que o usuário pergunta ou pede ações sobre tutores, pets e veterinários em linguagem natural, sem precisar navegar pelas telas tradicionais.\n\n## Fluxos que a realizam\n- [Atendimento via assistente virtual](../fluxos/flow-atendimento-assistente-virtual.md)\n\n## Sistemas envolvidos\n- `genai-service` — dono da capacidade (orquestra LLM + tools)\n- `customers-service`, `vets-service` — fontes de dado consultadas/alteradas pelo assistente\n- `api-gateway` — canal de acesso\n"}, {"id": "cap-atendimento-omnicanal", "kind": "capability", "camada": 1, "status": "proposed", "titulo": "Atender o tutor num único canal digital", "resumo": "A clínica oferece uma única porta de entrada (tela web) onde o tutor ou a equipe encontram, numa mesma consulta, o cadastro, os pets e o histórico de visitas — sem precisar saber que essas informações vêm de sistemas diferentes.", "caminho": "capacidades/cap-atendimento-omnicanal.md", "realiza": ["dom-clinica-veterinaria"], "realizado_por": ["flow-consulta-historico-tutor"], "extracoes": ["inferred"], "conflito": false, "corpo": "\n# Atender o tutor num único canal digital\nA clínica oferece uma única porta de entrada (tela web) onde o tutor ou a equipe encontram, numa mesma consulta, o cadastro, os pets e o histórico de visitas — sem precisar saber que essas informações vêm de sistemas diferentes.\n\n## Fluxos que a realizam\n- [Consulta de histórico do tutor](../fluxos/flow-consulta-historico-tutor.md)\n\n## Sistemas envolvidos\n- `api-gateway` — canal único e agregador\n- `customers-service`, `visits-service`, `vets-service` — fontes de dado agregadas\n"}, {"id": "cap-cadastro-clientes-pets", "kind": "capability", "camada": 1, "status": "proposed", "titulo": "Cadastrar e manter clientes e seus pets", "resumo": "A clínica consegue cadastrar tutores e seus pets, mantendo esse cadastro atualizado e disponível para todos os demais atendimentos.", "caminho": "capacidades/cap-cadastro-clientes-pets.md", "realiza": ["dom-clinica-veterinaria"], "realizado_por": ["flow-cadastro-tutor-pet", "flow-consulta-historico-tutor"], "extracoes": ["inferred"], "conflito": false, "corpo": "\n# Cadastrar e manter clientes e seus pets\nA clínica consegue cadastrar tutores e seus pets, mantendo esse cadastro atualizado e disponível para todos os demais atendimentos.\n\n## Fluxos que a realizam\n- [Cadastro de tutor e pet](../fluxos/flow-cadastro-tutor-pet.md)\n- [Consulta de histórico do tutor](../fluxos/flow-consulta-historico-tutor.md)\n\n## Sistemas envolvidos\n- `customers-service` — dono do cadastro (CRUD completo)\n- `api-gateway` — canal de acesso ao cadastro\n- `genai-service` — canal alternativo (assistente virtual) para consultar/cadastrar\n"}, {"id": "cap-gestao-corpo-clinico", "kind": "capability", "camada": 1, "status": "proposed", "titulo": "Divulgar o corpo clínico e suas especialidades", "resumo": "A clínica consegue apresentar, a tutores e à própria equipe, quais veterinários atendem e em quais especialidades — hoje como um catálogo de consulta, sem fluxo de cadastro/edição exposto por API.", "caminho": "capacidades/cap-gestao-corpo-clinico.md", "realiza": ["dom-clinica-veterinaria"], "realizado_por": [], "extracoes": ["inferred"], "conflito": false, "corpo": "\n# Divulgar o corpo clínico e suas especialidades\nA clínica consegue apresentar, a tutores e à própria equipe, quais veterinários atendem e em quais especialidades — hoje como um catálogo de consulta, sem fluxo de cadastro/edição exposto por API.\n\n## Fluxos que a realizam\nNenhum fluxo de ponta a ponta foi identificado no código para *gerir* (criar/editar) o corpo clínico — apenas para consultá-lo (dentro do fluxo de [Atendimento via assistente virtual](../fluxos/flow-atendimento-assistente-virtual.md) e nas telas do `api-gateway`). **Pergunta ao PM**: como o cadastro de veterinários é feito hoje (direto no banco, outra ferramenta)?\n\n## Sistemas envolvidos\n- `vets-service` — dono do catálogo (somente leitura via API)\n- `api-gateway` — canal de consulta (tela de veterinários)\n- `genai-service` — canal de consulta (busca semântica de veterinários no chat)\n"}, {"id": "cap-registro-consultas", "kind": "capability", "camada": 1, "status": "proposed", "titulo": "Registrar e consultar o histórico de consultas", "resumo": "A clínica consegue registrar cada consulta realizada em um pet e recuperar esse histórico depois, tanto pet a pet quanto agregado por tutor.", "caminho": "capacidades/cap-registro-consultas.md", "realiza": ["dom-clinica-veterinaria"], "realizado_por": ["flow-registro-consulta", "flow-consulta-historico-tutor"], "extracoes": ["inferred"], "conflito": false, "corpo": "\n# Registrar e consultar o histórico de consultas\nA clínica consegue registrar cada consulta realizada em um pet e recuperar esse histórico depois, tanto pet a pet quanto agregado por tutor.\n\n## Fluxos que a realizam\n- [Registro de consulta veterinária](../fluxos/flow-registro-consulta.md)\n- [Consulta de histórico do tutor](../fluxos/flow-consulta-historico-tutor.md)\n\n## Sistemas envolvidos\n- `visits-service` — dono do histórico de consultas\n- `api-gateway` — canal de acesso (registro e consulta agregada)\n"}, {"id": "flow-atendimento-assistente-virtual", "kind": "flow", "camada": 1, "status": "proposed", "titulo": "Atendimento via assistente virtual", "resumo": "Permitir que um usuário converse em linguagem natural com um assistente virtual para consultar tutores, pets e veterinários, ou até cadastrar um novo tutor/pet, sem navegar pelas telas tradicionais.", "caminho": "fluxos/flow-atendimento-assistente-virtual.md", "realiza": ["cap-atendimento-inteligente"], "realizado_por": ["sys-genai-service", "sys-api-gateway", "sys-customers-service", "sys-vets-service"], "extracoes": ["inferred"], "conflito": false, "corpo": "\n# Atendimento via assistente virtual\nPermitir que um usuário converse em linguagem natural com um assistente virtual para consultar tutores, pets e veterinários, ou até cadastrar um novo tutor/pet, sem navegar pelas telas tradicionais.\n\n## Atores\n- **Usuário (tutor ou equipe clínica)** — faz perguntas ou pede ações em linguagem natural\n- **Assistente virtual (IA)** — interpreta a pergunta, decide se precisa consultar/alterar dados e responde\n- **Sistema (clínica veterinária)** — fornece os dados reais de owners/pets/vets sob demanda do assistente\n\n## Etapas\n| # | Etapa | Ator | Decisão ou resultado | Técnica |\n|---|---|---|---|---|\n| 1 | Usuário envia uma pergunta ou pedido em texto livre | Usuário | ex.: \"liste os donos\" ou \"cadastre um novo pet\" | [passo 1](./flow-atendimento-assistente-virtual.sequencia.md#passo-1) |\n| 2 | Assistente decide se precisa consultar ou alterar dados da clínica | Assistente virtual | invoca uma ou mais ferramentas (tools) | [passo 2](./flow-atendimento-assistente-virtual.sequencia.md#passo-2) |\n| 3 | Sistema executa a consulta/ação solicitada | Sistema | dado retornado ou registro criado | [passo 2](./flow-atendimento-assistente-virtual.sequencia.md#passo-2) |\n| 4 | Assistente compõe e devolve a resposta em linguagem natural | Assistente virtual | resposta ao usuário, ou mensagem de indisponibilidade em caso de falha | [passo 3](./flow-atendimento-assistente-virtual.sequencia.md#passo-3) |\n\n## Diagrama\n```mermaid\nflowchart LR\n  subgraph Usuário\n    A[Faz pergunta em texto livre] --> D[Recebe resposta]\n  end\n  subgraph Assistente virtual\n    A --> B{Precisa de dados da clínica?}\n    B -- sim --> C[Invoca ferramenta: listar/cadastrar owner, pet ou vet]\n    B -- não --> E[Responde com conhecimento geral]\n    C --> F{Clínica respondeu a tempo?}\n    F -- sim --> G[Compõe resposta com os dados]\n    F -- não --> H[Responde \"assistente indisponível\"]\n    G --> D\n    H --> D\n    E --> D\n  end\n```\n\n## Indicadores\n- Volume de conversas, taxa de erro/indisponibilidade, custo por interação com o provedor de LLM — não encontrados no código; **a confirmar com o PM**.\n\n## Regras que governam\n- [Memória de conversa limitada a 10 mensagens](../regras-de-negocio/reg-memoria-conversa.md)\n- [Tipos de pet permitidos](../regras-de-negocio/reg-tipos-de-pet.md)\n"}, {"id": "flow-atendimento-assistente-virtual-sequencia", "kind": "flow", "camada": 3, "status": "proposed", "titulo": "Atendimento via assistente virtual: sequência técnica", "resumo": "Realiza as etapas do [fluxo macro](./flow-atendimento-assistente-virtual.md).", "caminho": "fluxos/flow-atendimento-assistente-virtual.sequencia.md", "realiza": ["flow-atendimento-assistente-virtual"], "realizado_por": ["ctr-genai-post-chatclient", "ctr-customers-get-owners", "ctr-customers-post-owners", "ctr-customers-post-pet"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Atendimento via assistente virtual: sequência técnica\nRealiza as etapas do [fluxo macro](./flow-atendimento-assistente-virtual.md).\n\n## Diagrama\n```mermaid\nsequenceDiagram\n  participant UI as Frontend (chat.js)\n  participant GW as api-gateway\n  participant CHAT as genai-service (PetclinicChatClient)\n  participant LLM as Provedor LLM externo\n  participant TOOLS as PetclinicTools/AIDataProvider\n  participant CUST as customers-service\n\n  UI->>GW: POST /api/genai/chatclient (pergunta)\n  GW->>CHAT: POST /chatclient (StripPrefix=2, circuit breaker \"genaiCircuitBreaker\")\n  CHAT->>LLM: prompt + system message + lista de tools disponíveis\n  alt LLM decide chamar uma tool (ex.: listOwners)\n    LLM-->>CHAT: pedido de function-call\n    CHAT->>TOOLS: listOwners()\n    TOOLS->>CUST: GET /owners (via DiscoveryClient + RestClient)\n    CUST-->>TOOLS: 200 lista de owners\n    TOOLS-->>CHAT: dados formatados\n    CHAT->>LLM: resultado da tool\n    LLM-->>CHAT: resposta final em linguagem natural\n  else LLM responde direto (sem tool)\n    LLM-->>CHAT: resposta final\n  end\n  CHAT-->>GW: 200 texto da resposta\n  GW-->>UI: 200 repassado\n\n  alt exceção em qualquer etapa acima\n    CHAT-->>GW: 200 \"Chat is currently unavailable. Please try again later.\"\n  end\n  alt genai-service fora do ar (nível de rede)\n    GW-->>UI: fallback (POST /fallback, 503)\n  end\n```\n\n## Passos\n### Passo 1\nO frontend envia a pergunta como corpo de texto puro para `POST /chatclient`, roteado pelo `api-gateway` (`/api/genai/**`, com circuit breaker nomeado `genaiCircuitBreaker` além do padrão — sinal de que este caminho é considerado mais instável, por depender de um provedor de LLM externo).\n\n### Passo 2\n`PetclinicChatClient` monta o prompt com um system message fixo (persona do assistente da Spring Petclinic) e disponibiliza as 4 tools de `PetclinicTools` ao LLM (`listOwners`, `addOwnerToPetclinic`, `listVets`, `addPetToOwner`). Se o LLM decidir invocar uma tool, `AIDataProvider` executa a chamada real ao `customers-service` (resolvido via `DiscoveryClient`, não via Gateway) ou busca no `VectorStore` local (para `listVets`).\n\n### Passo 3\nO resultado da tool volta ao LLM, que compõe a resposta final em linguagem natural, devolvida ao usuário.\n\n### Caminho de erro\n- Qualquer exceção dentro de `PetclinicChatClient.exchange` (falha do LLM, falha de rede ao chamar `customers-service`, etc.) é capturada e vira a resposta fixa \"Chat is currently unavailable. Please try again later.\" — **o usuário recebe HTTP 200 com uma mensagem de erro em texto**, não um HTTP 5xx (comportamento notável para quem for tratar erros no frontend).\n- Se o próprio `genai-service` estiver fora do ar (não apenas uma exceção interna, mas indisponibilidade de rede), o circuit breaker do `api-gateway` intercepta e devolve o fallback genérico (`POST /fallback`, `503`).\n"}, {"id": "flow-cadastro-tutor-pet", "kind": "flow", "camada": 1, "status": "proposed", "titulo": "Cadastro de tutor e pet", "resumo": "Permitir que um novo tutor se cadastre na clínica e registre seus pets, para que a clínica possa atendê-lo e manter o histórico de consultas.", "caminho": "fluxos/flow-cadastro-tutor-pet.md", "realiza": ["cap-cadastro-clientes-pets"], "realizado_por": ["sys-customers-service", "sys-api-gateway"], "extracoes": ["inferred"], "conflito": false, "corpo": "\n# Cadastro de tutor e pet\nPermitir que um novo tutor se cadastre na clínica e registre seus pets, para que a clínica possa atendê-lo e manter o histórico de consultas.\n\n## Atores\n- **Tutor / recepção** — informa os dados do tutor e do pet (inferido: o frontend não distingue autoatendimento de cadastro feito pela recepção)\n- **Sistema (clínica veterinária)** — valida e armazena o cadastro\n\n## Etapas\n| # | Etapa | Ator | Decisão ou resultado | Técnica |\n|---|---|---|---|---|\n| 1 | Tutor informa nome, endereço, cidade e telefone | Tutor/recepção | dados validados (campos obrigatórios, telefone numérico) | [passo 1](./flow-cadastro-tutor-pet.sequencia.md#passo-1) |\n| 2 | Sistema cria o cadastro do tutor | Sistema | tutor cadastrado com sucesso ou erro de validação | [passo 1](./flow-cadastro-tutor-pet.sequencia.md#passo-1) |\n| 3 | Tutor informa dados do pet (nome, data de nascimento, tipo) | Tutor/recepção | tipo de pet deve ser um dos cadastrados (cat, dog, lizard, snake, bird, hamster) | [passo 2](./flow-cadastro-tutor-pet.sequencia.md#passo-2) |\n| 4 | Sistema associa o pet ao tutor | Sistema | pet cadastrado e vinculado ao tutor | [passo 2](./flow-cadastro-tutor-pet.sequencia.md#passo-2) |\n\n## Diagrama\n```mermaid\nflowchart LR\n  subgraph Tutor/Recepção\n    A[Informa dados do tutor] --> B[Informa dados do pet]\n  end\n  subgraph Clínica\n    A --> C{Dados válidos?}\n    C -- sim --> D[Cadastra tutor]\n    C -- não --> E[Solicita correção]\n    D --> F[Cadastra pet vinculado ao tutor]\n    B --> F\n  end\n```\n\n## Indicadores\n- Tempo médio de cadastro, taxa de abandono no formulário — não encontrados no código; **a confirmar com o PM**.\n\n## Regras que governam\n- [Telefone com até 12 dígitos, sem formatação](../regras-de-negocio/reg-telefone-formato.md)\n- [Tipos de pet permitidos](../regras-de-negocio/reg-tipos-de-pet.md)\n"}, {"id": "flow-cadastro-tutor-pet-sequencia", "kind": "flow", "camada": 3, "status": "proposed", "titulo": "Cadastro de tutor e pet: sequência técnica", "resumo": "Realiza as etapas do [fluxo macro](./flow-cadastro-tutor-pet.md).", "caminho": "fluxos/flow-cadastro-tutor-pet.sequencia.md", "realiza": ["flow-cadastro-tutor-pet"], "realizado_por": ["ctr-customers-post-owners", "ctr-customers-post-pet", "ctr-customers-get-pettypes"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Cadastro de tutor e pet: sequência técnica\nRealiza as etapas do [fluxo macro](./flow-cadastro-tutor-pet.md).\n\n## Diagrama\n```mermaid\nsequenceDiagram\n  participant UI as Frontend (AngularJS)\n  participant GW as api-gateway\n  participant CUST as customers-service\n\n  UI->>GW: POST /api/customer/owners (dados do tutor)\n  GW->>CUST: POST /owners (StripPrefix=2)\n  alt dados válidos\n    CUST-->>GW: 201 Created (owner com id)\n    GW-->>UI: 201 Created\n  else campo obrigatório ausente\n    CUST-->>GW: 400 Bad Request (Bean Validation)\n    GW-->>UI: 400 repassado\n  end\n\n  UI->>GW: GET /api/customer/petTypes\n  GW->>CUST: GET /petTypes\n  CUST-->>GW: 200 lista de tipos\n  GW-->>UI: 200 repassado\n\n  UI->>GW: POST /api/customer/owners/{ownerId}/pets\n  GW->>CUST: POST /owners/{ownerId}/pets (StripPrefix=2)\n  alt owner existe\n    CUST-->>GW: 201 Created (pet)\n    GW-->>UI: 201 Created\n  else owner não encontrado\n    CUST-->>GW: erro (ResourceNotFoundException)\n    GW-->>UI: erro repassado\n  end\n```\n\n## Passos\n### Passo 1\n`api-gateway` recebe a requisição do frontend na rota `/api/customer/**` e a repassa, via Eureka (`lb://customers-service`) e `StripPrefix=2`, para `POST /owners` no `customers-service`. Ver contrato [ctr-customers-post-owners](../sistemas/customers-service/contratos/ctr-customers-post-owners.md).\n\n### Passo 2\nAntes de cadastrar o pet, o frontend consulta `GET /petTypes` para popular a lista de tipos válidos (ver [ctr-customers-get-pettypes](../sistemas/customers-service/contratos/ctr-customers-get-pettypes.md)). Em seguida, envia `POST /owners/{ownerId}/pets` (ver [ctr-customers-post-pet](../sistemas/customers-service/contratos/ctr-customers-post-pet.md)).\n\n### Caminho de erro\n- Se o `ownerId` informado não existir, `customers-service` lança `ResourceNotFoundException` — o `api-gateway` não trata esse erro de forma especial nesta rota (ele não passa pelo `ApiGatewayController` de agregação, é uma rota simples do Spring Cloud Gateway), então o erro é repassado como está ao frontend. **Inferido**: o formato exato do corpo de erro não foi confirmado nas fontes lidas.\n- Falha de validação (`@NotBlank`, `@Digits`) resulta em `400` do handler padrão do Spring, antes mesmo de chegar à lógica de negócio.\n"}, {"id": "flow-consulta-historico-tutor", "kind": "flow", "camada": 1, "status": "proposed", "titulo": "Consulta de histórico do tutor", "resumo": "Permitir que a clínica veja, numa única tela, o tutor, seus pets e o histórico de visitas de cada pet — sem precisar navegar por telas separadas para cada informação.", "caminho": "fluxos/flow-consulta-historico-tutor.md", "realiza": ["cap-atendimento-omnicanal", "cap-cadastro-clientes-pets"], "realizado_por": ["sys-api-gateway", "sys-customers-service", "sys-visits-service"], "extracoes": ["inferred"], "conflito": false, "corpo": "\n# Consulta de histórico do tutor\nPermitir que a clínica veja, numa única tela, o tutor, seus pets e o histórico de visitas de cada pet — sem precisar navegar por telas separadas para cada informação.\n\n## Atores\n- **Tutor / equipe clínica** — consulta os dados de um tutor específico\n- **Sistema (clínica veterinária)** — agrega os dados vindos de Cadastro e Consultas\n\n## Etapas\n| # | Etapa | Ator | Decisão ou resultado | Técnica |\n|---|---|---|---|---|\n| 1 | Usuário seleciona um tutor | Tutor/equipe | dispara a consulta agregada | [passo 1](./flow-consulta-historico-tutor.sequencia.md#passo-1) |\n| 2 | Sistema busca o tutor e seus pets | Sistema | dados do tutor e lista de pets | [passo 1](./flow-consulta-historico-tutor.sequencia.md#passo-1) |\n| 3 | Sistema busca as visitas de todos os pets do tutor | Sistema | histórico de visitas por pet, **ou lista vazia se a busca falhar** | [passo 2](./flow-consulta-historico-tutor.sequencia.md#passo-2) |\n| 4 | Sistema devolve tutor + pets + visitas numa única resposta | Sistema | tela exibida ao usuário | [passo 2](./flow-consulta-historico-tutor.sequencia.md#passo-2) |\n\n## Diagrama\n```mermaid\nflowchart LR\n  subgraph Usuário\n    A[Seleciona um tutor] --> B[Visualiza tutor, pets e visitas]\n  end\n  subgraph Clínica\n    A --> C[Busca tutor e pets]\n    C --> D{Busca de visitas OK?}\n    D -- sim --> E[Anexa visitas aos pets]\n    D -- não/timeout --> F[Anexa lista de visitas vazia]\n    E --> B\n    F --> B\n  end\n```\n\n## Indicadores\n- Latência da consulta agregada, taxa de degradação (quantas vezes o histórico de visitas veio vazio por falha) — não encontrados no código; **a confirmar com o PM**.\n\n## Regras que governam\n- [Degradação graciosa quando o histórico de visitas falha](../regras-de-negocio/reg-degradacao-visitas.md)\n"}, {"id": "flow-consulta-historico-tutor-sequencia", "kind": "flow", "camada": 3, "status": "proposed", "titulo": "Consulta de histórico do tutor: sequência técnica", "resumo": "Realiza as etapas do [fluxo macro](./flow-consulta-historico-tutor.md). Esta é a única sequência do domínio com um agregador de dados explícito no código (`ApiGatewayController`) e com um caminho de erro tratado deliberadamente (circuit bre", "caminho": "fluxos/flow-consulta-historico-tutor.sequencia.md", "realiza": ["flow-consulta-historico-tutor"], "realizado_por": ["ctr-gateway-get-owner-details", "ctr-customers-get-owner", "ctr-visits-get-visits-batch"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Consulta de histórico do tutor: sequência técnica\nRealiza as etapas do [fluxo macro](./flow-consulta-historico-tutor.md). Esta é a única sequência do domínio com um agregador de dados explícito no código (`ApiGatewayController`) e com um caminho de erro tratado deliberadamente (circuit breaker com fallback funcional, não apenas um erro genérico).\n\n## Diagrama\n```mermaid\nsequenceDiagram\n  participant UI as Frontend (AngularJS)\n  participant GW as ApiGatewayController\n  participant CUST as customers-service\n  participant VIS as visits-service\n\n  UI->>GW: GET /api/gateway/owners/{ownerId}\n  GW->>CUST: GET /owners/{ownerId} (via lb://customers-service)\n  CUST-->>GW: 200 OwnerDetails (com lista de pets e petIds)\n  GW->>VIS: GET pets/visits?petId=... (via lb://visits-service)\n  alt visits-service responde a tempo\n    VIS-->>GW: 200 Visits {items: [...]}\n    GW-->>GW: anexa cada visita ao pet correspondente (por petId)\n  else timeout ou erro no circuit breaker \"getOwnerDetails\"\n    GW-->>GW: emptyVisitsForPets() -> Visits vazio\n  end\n  GW-->>UI: 200 OwnerDetails completo (pets com ou sem visitas)\n```\n\n## Passos\n### Passo 1\n`api-gateway` chama `customers-service` diretamente via `WebClient` (`CustomersServiceClient.getOwner`), não através de uma rota do Spring Cloud Gateway — é uma chamada de aplicação, resolvida também por `lb://customers-service` via Eureka. Ver [ctr-customers-get-owner](../sistemas/customers-service/contratos/ctr-customers-get-owner.md).\n\n### Passo 2\nCom os `petIds` do owner em mãos, `api-gateway` chama `visits-service` em lote (`VisitsServiceClient.getVisitsForPets`, uma única requisição com todos os ids) e, com `ReactiveCircuitBreakerFactory`, protege essa chamada especificamente. Ver [ctr-visits-get-visits-batch](../sistemas/visits-service/contratos/ctr-visits-get-visits-batch.md) e o contrato do próprio agregador [ctr-gateway-get-owner-details](../sistemas/api-gateway/contratos/ctr-gateway-get-owner-details.md).\n\n### Caminho de erro\nSe a chamada a `visits-service` falhar (erro ou timeout — o timeout exato do circuit breaker Resilience4j não foi encontrado nas fontes lidas, **a confirmar**), o circuit breaker `getOwnerDetails` intercepta e devolve uma lista de visitas vazia, em vez de propagar o erro ao usuário. O tutor e seus pets continuam sendo exibidos — apenas sem o histórico de visitas. Se a chamada a `customers-service` falhar, **não há fallback específico neste método**; o comportamento observado pelo usuário final não foi confirmado nas fontes lidas (provavelmente erro 5xx propagado).\n"}, {"id": "flow-registro-consulta", "kind": "flow", "camada": 1, "status": "proposed", "titulo": "Registro de consulta veterinária", "resumo": "Permitir que a equipe da clínica registre a consulta realizada em um pet, formando o histórico clínico que poderá ser consultado depois pelo tutor ou pelo próprio veterinário.", "caminho": "fluxos/flow-registro-consulta.md", "realiza": ["cap-registro-consultas"], "realizado_por": ["sys-visits-service", "sys-api-gateway"], "extracoes": ["inferred"], "conflito": false, "corpo": "\n# Registro de consulta veterinária\nPermitir que a equipe da clínica registre a consulta realizada em um pet, formando o histórico clínico que poderá ser consultado depois pelo tutor ou pelo próprio veterinário.\n\n## Atores\n- **Equipe clínica / veterinário** — registra a consulta realizada (inferido: o código não distingue papéis de usuário, qualquer chamador do frontend pode registrar)\n- **Sistema (clínica veterinária)** — grava e disponibiliza a visita\n\n## Etapas\n| # | Etapa | Ator | Decisão ou resultado | Técnica |\n|---|---|---|---|---|\n| 1 | Equipe seleciona o pet e descreve a consulta realizada | Equipe clínica | descrição limitada a 8192 caracteres | [passo 1](./flow-registro-consulta.sequencia.md#passo-1) |\n| 2 | Sistema grava a visita vinculada ao pet | Sistema | visita registrada com data e descrição | [passo 1](./flow-registro-consulta.sequencia.md#passo-1) |\n\n## Diagrama\n```mermaid\nflowchart LR\n  subgraph Equipe clínica\n    A[Seleciona pet e descreve a consulta] --> B[Confirma registro]\n  end\n  subgraph Clínica\n    B --> C[Grava visita vinculada ao pet]\n  end\n```\n\n## Indicadores\n- Número de consultas por período, tempo médio entre consultas — não encontrados no código; **a confirmar com o PM**.\n\n## Regras que governam\n- [Descrição da consulta limitada a 8192 caracteres](../regras-de-negocio/reg-limite-descricao-visita.md)\n"}, {"id": "flow-registro-consulta-sequencia", "kind": "flow", "camada": 3, "status": "proposed", "titulo": "Registro de consulta veterinária: sequência técnica", "resumo": "Realiza as etapas do [fluxo macro](./flow-registro-consulta.md).", "caminho": "fluxos/flow-registro-consulta.sequencia.md", "realiza": ["flow-registro-consulta"], "realizado_por": ["ctr-visits-post-visit"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Registro de consulta veterinária: sequência técnica\nRealiza as etapas do [fluxo macro](./flow-registro-consulta.md).\n\n## Diagrama\n```mermaid\nsequenceDiagram\n  participant UI as Frontend (AngularJS)\n  participant GW as api-gateway\n  participant VIS as visits-service\n\n  UI->>GW: POST /api/visit/owners/{ownerId}/pets/{petId}/visits\n  GW->>VIS: POST owners/*/pets/{petId}/visits (StripPrefix=2, lb://visits-service)\n  alt sucesso\n    VIS-->>GW: 201 Created (visita)\n    GW-->>UI: 201 Created\n  else visits-service indisponível\n    GW-->>GW: CircuitBreaker/Retry (1x, só para 503)\n    GW-->>UI: fallback (POST /fallback) ou erro\n  end\n```\n\n## Passos\n### Passo 1\n`api-gateway` roteia `/api/visit/**` para `visits-service` via Eureka. `VisitResource.create` ignora o `petId` do corpo e usa o do path (`visit.setPetId(petId)`), garantindo consistência do vínculo. Ver [ctr-visits-post-visit](../sistemas/visits-service/contratos/ctr-visits-post-visit.md).\n\n### Caminho de erro\n- Se `visits-service` estiver fora do ar, o filtro padrão do Gateway (`CircuitBreaker` + `Retry` para `POST`/`503`) tenta 1 vez antes de cair no fallback genérico (`/fallback`, sempre `503`).\n- `visits-service` **não valida** se o `petId` existe de fato em `customers-service` antes de gravar — uma visita pode ser registrada para um `petId` inexistente sem erro (ver nota em [sys-visits-service](../sistemas/visits-service/ficha.md)). **A confirmar com o arquiteto** se isso é aceitável ou se falta uma validação.\n"}, {"id": "term-pet", "kind": "term", "camada": 0, "status": "proposed", "titulo": "Pet", "resumo": "Animal de estimação vinculado a um tutor, com nome, data de nascimento e um tipo (`PetType`). É o sujeito das visitas/consultas registradas em `visits-service`.", "caminho": "glossario/term-pet.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Pet\nAnimal de estimação vinculado a um tutor, com nome, data de nascimento e um tipo (`PetType`). É o sujeito das visitas/consultas registradas em `visits-service`.\n\nNão confundir com: **Tipo de pet** (`PetType`) — a espécie/categoria do pet (cat, dog, lizard, snake, bird, hamster), não o pet individual.\n"}, {"id": "term-tutor-owner", "kind": "term", "camada": 0, "status": "proposed", "titulo": "Tutor (Owner)", "resumo": "Pessoa responsável por um ou mais pets cadastrados na clínica. No código é chamado de `Owner` (nome, sobrenome, endereço, cidade, telefone e a lista de pets).", "caminho": "glossario/term-tutor-owner.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Tutor (Owner)\nPessoa responsável por um ou mais pets cadastrados na clínica. No código é chamado de `Owner` (nome, sobrenome, endereço, cidade, telefone e a lista de pets).\n\nNão confundir com: **Equipe clínica** (quem opera o sistema/atende, não é dono de pet) — o código não distingue esses dois papéis de usuário.\n"}, {"id": "term-veterinario-especialidade", "kind": "term", "camada": 0, "status": "proposed", "titulo": "Veterinário / Especialidade", "resumo": "Veterinário (`Vet`): profissional da clínica, com nome e uma ou mais especialidades. Especialidade (`Specialty`): área de atuação do veterinário (ex.: radiologia — visto em dado de exemplo), associada em relação muitos-para-muitos com `Vet`", "caminho": "glossario/term-veterinario-especialidade.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Veterinário / Especialidade\nVeterinário (`Vet`): profissional da clínica, com nome e uma ou mais especialidades. Especialidade (`Specialty`): área de atuação do veterinário (ex.: radiologia — visto em dado de exemplo), associada em relação muitos-para-muitos com `Vet` via `vet_specialties`.\n\nNão confundir com: **Corpo clínico** — o conjunto de todos os veterinários da clínica (capacidade de negócio), não um veterinário individual.\n"}, {"id": "term-visita-consulta", "kind": "term", "camada": 0, "status": "proposed", "titulo": "Visita / Consulta", "resumo": "Registro de um atendimento veterinário prestado a um pet, com data e descrição textual (até 8192 caracteres). No código é chamado de `Visit`. Usamos \"visita\" e \"consulta\" como sinônimos neste domínio, já que o código só usa `Visit`.", "caminho": "glossario/term-visita-consulta.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Visita / Consulta\nRegistro de um atendimento veterinário prestado a um pet, com data e descrição textual (até 8192 caracteres). No código é chamado de `Visit`. Usamos \"visita\" e \"consulta\" como sinônimos neste domínio, já que o código só usa `Visit`.\n\nNão confundir com: **Prontuário clínico** (exames, prescrições, diagnósticos detalhados) — não encontrado no código; a `Visit` é apenas uma descrição textual livre.\n"}, {"id": "env-local-docker", "kind": "environment", "camada": 6, "status": "proposed", "titulo": "Ambiente local via Docker Compose", "resumo": "Sobe toda a stack (serviços de negócio + plataforma + observabilidade) em containers na mesma máquina, para desenvolvimento e demonstração. Não há evidência neste repositório de um ambiente de homologação ou produção real (nuvem, Kubernetes", "caminho": "infraestrutura/ambientes/env-local-docker.md", "realiza": [], "realizado_por": ["res-tracing-server", "res-grafana-prometheus"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Ambiente local via Docker Compose\nSobe toda a stack (serviços de negócio + plataforma + observabilidade) em containers na mesma máquina, para desenvolvimento e demonstração. Não há evidência neste repositório de um ambiente de homologação ou produção real (nuvem, Kubernetes, Terraform) — apenas este compose local. **A confirmar com o time de infraestrutura.**\n\n## Implantação\n```mermaid\nflowchart TB\n  subgraph docker[\"docker-compose (host local)\"]\n    CFG[config-server :8888] --> DISC[discovery-server :8761]\n    DISC --> CUST[customers-service :8081]\n    DISC --> VIS[visits-service :8082]\n    DISC --> VET[vets-service :8083]\n    DISC --> GEN[genai-service :8084]\n    DISC --> GW[api-gateway :8080]\n    DISC --> ADM[admin-server :9090]\n    GW --> CUST\n    GW --> VIS\n    GW --> VET\n    GW --> GEN\n    TRACE[tracing-server :9411]\n    GRAF[grafana-server :3030] --> PROM[prometheus-server :9091]\n  end\n```\n\nOrdem de subida (via `depends_on` + `condition: service_healthy`): `config-server` → `discovery-server` → demais serviços. Cada serviço de negócio expõe uma porta fixa mapeada no host: `customers-service` 8081, `visits-service` 8082, `vets-service` 8083, `genai-service` 8084, `api-gateway` 8080, `admin-server` 9090, `discovery-server` 8761, `config-server` 8888. Todos os containers têm limite de memória de 512M (256M para Grafana/Prometheus).\n"}, {"id": "env-local-ide", "kind": "environment", "camada": 6, "status": "proposed", "titulo": "Ambiente local via IDE / Maven", "resumo": "Cada microsserviço roda como processo Java independente (`../mvnw spring-boot:run` ou execução pela IDE), sem containers. `config-server` e `discovery-server` precisam subir antes dos demais. Tracing (Zipkin), Admin Server, Grafana e Promet", "caminho": "infraestrutura/ambientes/env-local-ide.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Ambiente local via IDE / Maven\nCada microsserviço roda como processo Java independente (`../mvnw spring-boot:run` ou execução pela IDE), sem containers. `config-server` e `discovery-server` precisam subir antes dos demais. Tracing (Zipkin), Admin Server, Grafana e Prometheus são opcionais nesse modo. Usa banco HSQLDB embutido por padrão (ver `res-hsqldb-embedded`).\n\n## Implantação\n```mermaid\nflowchart TB\n  subgraph local[\"Processos Java locais\"]\n    CFG[config-server] --> DISC[discovery-server]\n    DISC --> CUST[customers-service]\n    DISC --> VIS[visits-service]\n    DISC --> VET[vets-service]\n    DISC --> GW[\"api-gateway :8080\"]\n  end\n```\n\nPortas de negócio não são fixadas em `application.yml` neste modo (nenhum `server.port` explícito nos serviços de negócio) — o README instrui checar a porta real pelo painel do Eureka. **Inferido**: a porta efetiva provavelmente vem de variável de ambiente `SERVER_PORT`, cuja origem (perfil, config externo) não está neste repositório.\n"}, {"id": "res-grafana-prometheus", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "Grafana + Prometheus (métricas)", "resumo": "Todos os serviços Spring Boot do domínio expõem métricas via `micrometer-registry-prometheus` (dependência presente nos `pom.xml`), consumidas pelo Prometheus e visualizadas no Grafana (há um dashboard de exemplo em `docs/grafana-custom-met", "caminho": "infraestrutura/recursos/res-grafana-prometheus.md", "realiza": ["sub-plataforma"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Grafana + Prometheus (métricas)\n| Campo | Valor |\n|---|---|\n| Tipo | cluster/servidor de observabilidade (métricas e dashboards) |\n| Tecnologia | Prometheus (scrape) + Grafana (dashboards), imagens customizadas em `docker/grafana` e `docker/prometheus` |\n| Ambientes | local via `docker-compose.yml`, portas `3030` (Grafana) e `9091` (Prometheus) |\n| Definido em | `docker-compose.yml` (serviços `grafana-server`, `prometheus-server`) |\n\nTodos os serviços Spring Boot do domínio expõem métricas via `micrometer-registry-prometheus` (dependência presente nos `pom.xml`), consumidas pelo Prometheus e visualizadas no Grafana (há um dashboard de exemplo em `docs/grafana-custom-metrics-dashboard.png`).\n\n## Usado por\n- `sys-customers-service`, `sys-vets-service`, `sys-visits-service`, `sys-api-gateway`, `sys-genai-service` — expõem métricas Micrometer/Prometheus\n"}, {"id": "res-hsqldb-embedded", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "Banco HSQLDB embutido (dev/teste)", "resumo": "Cada serviço de dados (`customers-service`, `vets-service`, `visits-service`) inicializa seu próprio banco HSQLDB em memória ao subir, populado com dados de exemplo (`data.sql`). Não é compartilhado entre serviços nem entre instâncias — é r", "caminho": "infraestrutura/recursos/res-hsqldb-embedded.md", "realiza": ["sys-customers-service", "sys-vets-service", "sys-visits-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Banco HSQLDB embutido (dev/teste)\n| Campo | Valor |\n|---|---|\n| Tipo | banco (relacional, em memória) |\n| Tecnologia | HSQLDB, uma instância por serviço, embutida no processo Java |\n| Ambientes | desenvolvimento local (perfil padrão) e testes automatizados (perfil `test`) |\n| Definido em | `pom.xml` de cada serviço (dependência `org.hsqldb:hsqldb`), scripts `src/main/resources/db/hsqldb/schema.sql` e `data.sql` de cada serviço |\n\nCada serviço de dados (`customers-service`, `vets-service`, `visits-service`) inicializa seu próprio banco HSQLDB em memória ao subir, populado com dados de exemplo (`data.sql`). Não é compartilhado entre serviços nem entre instâncias — é recriado a cada start. Não há configuração explícita de `spring.datasource` neste repositório: a escolha do banco (HSQLDB vs. MySQL) depende de qual driver e schema o ambiente de execução ativa, o que não é decidido dentro deste repositório (ver `res-mysql-customers` e RELATORIO.md).\n\n## Usado por\n- `sys-customers-service` — leitura e escrita das tabelas `owners`, `pets`, `types`\n- `sys-vets-service` — leitura das tabelas `vets`, `specialties`, `vet_specialties`\n- `sys-visits-service` — leitura e escrita da tabela `visits`\n"}, {"id": "res-mysql-customers", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "Banco MySQL — customers-service", "resumo": "O schema e a massa de dados MySQL existem no código (driver `mysql-connector-j` no `pom.xml`), mas **nenhum arquivo deste repositório define host, credenciais ou string de conexão** para MySQL em produção — nem em `docker-compose.yml` (que ", "caminho": "infraestrutura/recursos/res-mysql-customers.md", "realiza": ["sys-customers-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Banco MySQL — customers-service\n| Campo | Valor |\n|---|---|\n| Tipo | banco (relacional) |\n| Tecnologia | MySQL (banco lógico `petclinic`, tabelas `owners`, `pets`, `types`) |\n| Ambientes | produção (inferido — a conexão real não está neste repositório) |\n| Definido em | `spring-petclinic-customers-service/src/main/resources/db/mysql/schema.sql` e `data.sql` |\n\nO schema e a massa de dados MySQL existem no código (driver `mysql-connector-j` no `pom.xml`), mas **nenhum arquivo deste repositório define host, credenciais ou string de conexão** para MySQL em produção — nem em `docker-compose.yml` (que não sobe um container MySQL), nem em `application.yml`. O Config Server aponta para um repositório Git externo (`spring-petclinic-microservices-config`) que provavelmente contém essas propriedades por ambiente. **Inferido**, a confirmar com o time de infraestrutura (ver RELATORIO.md).\n\n## Usado por\n- `sys-customers-service` — leitura e escrita\n"}, {"id": "res-mysql-vets", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "Banco MySQL — vets-service", "resumo": "", "caminho": "infraestrutura/recursos/res-mysql-vets.md", "realiza": ["sys-vets-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Banco MySQL — vets-service\n| Campo | Valor |\n|---|---|\n| Tipo | banco (relacional) |\n| Tecnologia | MySQL (banco lógico `petclinic`, tabelas `vets`, `specialties`, `vet_specialties`) |\n| Ambientes | produção (inferido — mesma ressalva de `res-mysql-customers`) |\n| Definido em | `spring-petclinic-vets-service/src/main/resources/db/mysql/schema.sql` e `data.sql` |\n\n## Usado por\n- `sys-vets-service` — leitura (o serviço não expõe escrita de veterinários; a carga inicial vem de `data.sql`)\n"}, {"id": "res-mysql-visits", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "Banco MySQL — visits-service", "resumo": "A tabela `visits` declara `FOREIGN KEY (pet_id) REFERENCES pets(id)`, mas `pets` vive no banco do `customers-service`. Em uma topologia de um banco MySQL por serviço, essa FK não pode ser aplicada pelo próprio MySQL entre schemas separados ", "caminho": "infraestrutura/recursos/res-mysql-visits.md", "realiza": ["sys-visits-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Banco MySQL — visits-service\n| Campo | Valor |\n|---|---|\n| Tipo | banco (relacional) |\n| Tecnologia | MySQL (banco lógico `petclinic`, tabela `visits`) |\n| Ambientes | produção (inferido — mesma ressalva de `res-mysql-customers`) |\n| Definido em | `spring-petclinic-visits-service/src/main/resources/db/mysql/schema.sql` e `data.sql` |\n\nA tabela `visits` declara `FOREIGN KEY (pet_id) REFERENCES pets(id)`, mas `pets` vive no banco do `customers-service`. Em uma topologia de um banco MySQL por serviço, essa FK não pode ser aplicada pelo próprio MySQL entre schemas separados — **inferido** que a integridade referencial entre `visits.pet_id` e o pet real é garantida apenas pela aplicação (via chamada HTTP), não pelo banco. A confirmar com o arquiteto.\n\n## Usado por\n- `sys-visits-service` — leitura e escrita\n"}, {"id": "res-tracing-server", "kind": "resource", "camada": 6, "status": "proposed", "titulo": "Servidor de tracing distribuído (Zipkin)", "resumo": "", "caminho": "infraestrutura/recursos/res-tracing-server.md", "realiza": ["sub-plataforma"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Servidor de tracing distribuído (Zipkin)\n| Campo | Valor |\n|---|---|\n| Tipo | cluster/servidor de observabilidade (tracing distribuído) |\n| Tecnologia | Zipkin (`openzipkin/zipkin`), via Micrometer Tracing nos serviços |\n| Ambientes | local via `docker-compose.yml`, porta `9411` |\n| Definido em | `docker-compose.yml` (serviço `tracing-server`) |\n\n## Usado por\n- Todos os sistemas Spring Boot do domínio publicam traces aqui (Micrometer Tracing é citado no README do repositório); não há evidência de qual exportador exato é usado em cada serviço além da menção no README raiz — **inferido**.\n"}, {"id": "pad-metricas-timed", "kind": "standard", "camada": 0, "status": "proposed", "titulo": "Controllers anotados com @Timed(\"petclinic.<recurso>\")", "resumo": "Cada controller REST de negócio é anotado com `@Timed` do Micrometer, usando o padrão de nome `petclinic.<recurso>` (`petclinic.owner`, `petclinic.pet`, `petclinic.visit`), exportado ao Prometheus.", "caminho": "padroes/pad-metricas-timed.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Controllers anotados com @Timed(\"petclinic.<recurso>\")\nCada controller REST de negócio é anotado com `@Timed` do Micrometer, usando o padrão de nome `petclinic.<recurso>` (`petclinic.owner`, `petclinic.pet`, `petclinic.visit`), exportado ao Prometheus.\n\n## Exemplo\n```java\n@RequestMapping(\"/owners\")\n@RestController\n@Timed(\"petclinic.owner\")\nclass OwnerResource { ... }\n```\n\n## Onde se aplica\n- `customers-service` (`OwnerResource`, `PetResource`)\n- `visits-service` (`VisitResource`)\n- `vets-service` não segue este padrão — `VetResource` não tem `@Timed` (**inferido**: inconsistência a confirmar com o time).\n"}, {"id": "pad-service-discovery-lb", "kind": "standard", "camada": 0, "status": "proposed", "titulo": "Chamadas entre serviços sempre via nome lógico + Eureka", "resumo": "Nenhum sistema deste domínio chama outro por host/IP fixo. Todas as chamadas HTTP entre sistemas usam o nome lógico do serviço (`http://customers-service/...`, `http://vets-service/...`) resolvido em tempo de execução pelo `discovery-server", "caminho": "padroes/pad-service-discovery-lb.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Chamadas entre serviços sempre via nome lógico + Eureka\nNenhum sistema deste domínio chama outro por host/IP fixo. Todas as chamadas HTTP entre sistemas usam o nome lógico do serviço (`http://customers-service/...`, `http://vets-service/...`) resolvido em tempo de execução pelo `discovery-server` (Eureka), seja via `lb://` nas rotas do Spring Cloud Gateway, seja via `WebClient`/`RestClient` com `@LoadBalanced` ou `DiscoveryClient` explícito.\n\n## Exemplo\n```java\n// api-gateway\nuri(\"http://customers-service/owners/{ownerId}\", ownerId)\n// genai-service\ndiscoveryClient.getInstances(\"customers-service\").get(0).getUri()\n```\n\n## Onde se aplica\n- `api-gateway` (`CustomersServiceClient`, `VisitsServiceClient`, rotas do Gateway)\n- `genai-service` (`AIDataProvider`, `VectorStoreController`)\n"}, {"id": "reg-degradacao-visitas", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "A tela do tutor nunca falha por causa do histórico de visitas", "resumo": "Se a busca do histórico de visitas (`visits-service`) falhar ou ficar lenta, o `api-gateway` exibe o tutor e seus pets normalmente, apenas com a lista de visitas vazia — em vez de falhar a tela inteira. Implementado via `ReactiveCircuitBrea", "caminho": "regras-de-negocio/reg-degradacao-visitas.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# A tela do tutor nunca falha por causa do histórico de visitas\nSe a busca do histórico de visitas (`visits-service`) falhar ou ficar lenta, o `api-gateway` exibe o tutor e seus pets normalmente, apenas com a lista de visitas vazia — em vez de falhar a tela inteira. Implementado via `ReactiveCircuitBreakerFactory` com fallback `emptyVisitsForPets()`.\n\n## Onde está implementada\n- `spring-petclinic-api-gateway` — `ApiGatewayController.getOwnerDetails`\n\n## Conflito\nO mesmo tratamento **não existe** para a chamada a `customers-service` no mesmo método — se ela falhar, não há fallback e o comportamento observado pelo usuário não foi confirmado nas fontes lidas. **A confirmar com o arquiteto** se essa assimetria é intencional (ex.: \"sem tutor não há o que mostrar mesmo\") ou uma lacuna.\n"}, {"id": "reg-limite-descricao-visita", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "Descrição da visita limitada a 8192 caracteres", "resumo": "A descrição de uma visita (`Visit.description`) é validada com `@Size(max = 8192)` e a coluna do banco é `VARCHAR(8192)`.", "caminho": "regras-de-negocio/reg-limite-descricao-visita.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Descrição da visita limitada a 8192 caracteres\nA descrição de uma visita (`Visit.description`) é validada com `@Size(max = 8192)` e a coluna do banco é `VARCHAR(8192)`.\n\n## Onde está implementada\n- `spring-petclinic-visits-service` — entidade `Visit` e `db/mysql/schema.sql` (coluna `description VARCHAR(8192)`)\n"}, {"id": "reg-memoria-conversa", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "O assistente virtual lembra até 10 mensagens anteriores", "resumo": "O `MessageChatMemoryAdvisor` é configurado com `.order(10)` — o contexto de conversa considerado pelo LLM cobre até as últimas 10 mensagens. Implementação de armazenamento da memória (em memória, banco, etc.) não confirmada nas fontes lidas", "caminho": "regras-de-negocio/reg-memoria-conversa.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# O assistente virtual lembra até 10 mensagens anteriores\nO `MessageChatMemoryAdvisor` é configurado com `.order(10)` — o contexto de conversa considerado pelo LLM cobre até as últimas 10 mensagens. Implementação de armazenamento da memória (em memória, banco, etc.) não confirmada nas fontes lidas.\n\n## Onde está implementada\n- `spring-petclinic-genai-service` — `PetclinicChatClient`\n"}, {"id": "reg-telefone-formato", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "Telefone do tutor deve ter até 12 dígitos, sem formatação", "resumo": "O telefone do tutor é validado com `@Digits(fraction = 0, integer = 12)` — só dígitos, sem parte fracionária, no máximo 12 caracteres numéricos. O campo também é obrigatório (`@NotBlank`).", "caminho": "regras-de-negocio/reg-telefone-formato.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Telefone do tutor deve ter até 12 dígitos, sem formatação\nO telefone do tutor é validado com `@Digits(fraction = 0, integer = 12)` — só dígitos, sem parte fracionária, no máximo 12 caracteres numéricos. O campo também é obrigatório (`@NotBlank`).\n\n## Onde está implementada\n- `spring-petclinic-customers-service` — entidade `Owner` e DTO `OwnerRequest`\n- `spring-petclinic-genai-service` — o `record OwnerRequest` da tool `addOwnerToPetclinic` replica a mesma regra (`@Digits(fraction = 0, integer = 12)`)\n"}, {"id": "reg-tipos-de-pet", "kind": "rule", "camada": 0, "status": "proposed", "titulo": "Um pet só pode ter um dos tipos cadastrados", "resumo": "Todo pet deve ter um `typeId` que exista na tabela `types`/entidade `PetType`. Os valores observados (via `data.sql` e a descrição da tool `addPetToOwner` do `genai-service`) são: 1=cat, 2=dog, 3=lizard, 4=snake, 5=bird, 6=hamster.", "caminho": "regras-de-negocio/reg-tipos-de-pet.md", "realiza": [], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Um pet só pode ter um dos tipos cadastrados\nTodo pet deve ter um `typeId` que exista na tabela `types`/entidade `PetType`. Os valores observados (via `data.sql` e a descrição da tool `addPetToOwner` do `genai-service`) são: 1=cat, 2=dog, 3=lizard, 4=snake, 5=bird, 6=hamster.\n\n## Onde está implementada\n- `spring-petclinic-customers-service` — `PetResource.processCreationForm`/`save` (busca o `PetType` por id; se não encontrar, o pet é salvo sem tipo — `ifPresent`, sem erro explícito)\n- `spring-petclinic-genai-service` — `PetclinicTools.addPetToOwner`, documentação da tool cita os 6 ids válidos\n\n## Conflito\nNão há validação explícita no `customers-service` que rejeite um `typeId` inexistente — `petRepository.findPetTypeById(...).ifPresent(pet::setType)` simplesmente não define o tipo se o id não existir, deixando `pet.getType()` nulo. Isso pode conflitar com a expectativa de negócio de que \"todo pet tem um tipo válido\". **A confirmar com o time de desenvolvimento** se isso é um bug ou comportamento aceito.\n"}, {"id": "cmp-admin-server-app", "kind": "component", "camada": 5, "status": "proposed", "titulo": "SpringBootAdminApplication", "resumo": "", "caminho": "sistemas/admin-server/componentes/cmp-admin-server-app.md", "realiza": ["sys-admin-server"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# SpringBootAdminApplication\n| Campo | Valor |\n|---|---|\n| Tipo | endpoint (UI + agregador Spring Boot Admin) |\n| Gatilho | HTTP, acesso via navegador; polling nos endpoints Actuator dos serviços registrados no Eureka |\n| Entrada | lista de instâncias do `discovery-server` |\n| Saída | dashboard web de saúde/métricas |\n| Timeout / memória / concorrência | não configurado explicitamente |\n\n## Dependências\n- `discovery-server` (para descobrir quais instâncias monitorar)\n\n## Erros e retentativas\n- Nada customizado identificado nas fontes lidas.\n"}, {"id": "sys-admin-server", "kind": "system", "camada": 4, "status": "proposed", "titulo": "admin-server", "resumo": "Console de administração (Spring Boot Admin) para observar saúde, métricas e logs dos demais serviços. Não implementa capacidade de negócio.", "caminho": "sistemas/admin-server/ficha.md", "realiza": ["sub-plataforma"], "realizado_por": ["cmp-admin-server-app"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# admin-server\nConsole de administração (Spring Boot Admin) para observar saúde, métricas e logs dos demais serviços. Não implementa capacidade de negócio.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | [Plataforma](../../subdominios/sub-plataforma.md) |\n| Dono | não informado — a confirmar |\n| Stack | Java 17+, Spring Boot 4.0.1, Spring Boot Admin Server |\n| Repositório | `spring-petclinic-admin-server/` |\n| Criticidade | baixa (opcional — README indica que sua subida é opcional) |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph admin-server\n    ADM[Spring Boot Admin UI :9090]\n  end\n  ADM -.monitora via Eureka.-> DISC[[discovery-server]]\n```\n\n## Expõe\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| UI de administração (`/`) | interface web | não documentado neste repositório |\n\n## Dados\nNão possui banco; consulta os endpoints Actuator dos demais serviços em tempo real.\n"}, {"id": "cmp-gateway-controller", "kind": "component", "camada": 5, "status": "proposed", "titulo": "ApiGatewayController", "resumo": "Endpoint de agregação (padrão *Backend for Frontend*) que junta owner + pets + visitas numa única resposta, evitando que o frontend faça 3 chamadas separadas.", "caminho": "sistemas/api-gateway/componentes/cmp-gateway-controller.md", "realiza": ["sys-api-gateway"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# ApiGatewayController\nEndpoint de agregação (padrão *Backend for Frontend*) que junta owner + pets + visitas numa única resposta, evitando que o frontend faça 3 chamadas separadas.\n\n| Campo | Valor |\n|---|---|\n| Tipo | endpoint (controller reativo WebFlux) |\n| Gatilho | HTTP GET `/api/gateway/owners/{ownerId}` |\n| Entrada | `ownerId` de path |\n| Saída | `OwnerDetails` (JSON) com `pets[].visits` preenchido |\n| Timeout / memória / concorrência | reativo (`Mono`), sem timeout explícito configurado no componente |\n\n## Dependências\n- `CustomersServiceClient` → `customers-service` (`GET /owners/{ownerId}`)\n- `VisitsServiceClient` → `visits-service` (`GET pets/visits?petId=...`)\n- `ReactiveCircuitBreakerFactory` (Resilience4j) — protege especificamente a chamada a `visits-service`\n\n## Erros e retentativas\n- Se a chamada a `visits-service` falhar (erro ou timeout), o circuit breaker (`cbFactory.create(\"getOwnerDetails\")`) intercepta e retorna `Visits` vazio — o owner e seus pets ainda são exibidos, sem histórico de visitas (degradação graciosa).\n- Se a chamada a `customers-service` falhar, não há fallback específico neste método — o erro se propaga (o comportamento final depende do circuit breaker padrão da rota Gateway, se esta chamada passar por ela; **inferido**, pois este é um `WebClient` direto, não uma rota do Gateway).\n"}, {"id": "cmp-gateway-routes", "kind": "component", "camada": 5, "status": "proposed", "titulo": "Rotas do Spring Cloud Gateway", "resumo": "Proxy reverso declarativo que encaminha chamadas do frontend para os serviços de negócio, resolvendo o host via Eureka (`lb://`).", "caminho": "sistemas/api-gateway/componentes/cmp-gateway-routes.md", "realiza": ["sys-api-gateway"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Rotas do Spring Cloud Gateway\nProxy reverso declarativo que encaminha chamadas do frontend para os serviços de negócio, resolvendo o host via Eureka (`lb://`).\n\n| Campo | Valor |\n|---|---|\n| Tipo | worker (roteador reativo, WebFlux) |\n| Gatilho | HTTP, prefixos `/api/vet/**`, `/api/visit/**`, `/api/customer/**`, `/api/genai/**` |\n| Entrada | requisição HTTP do frontend |\n| Saída | requisição encaminhada ao serviço alvo, com os 2 primeiros segmentos do path removidos (`StripPrefix=2`) |\n| Timeout / memória / concorrência | não configurado explicitamente (sem `httpclient.connect-timeout`/`response-timeout` nas fontes lidas) |\n\n## Dependências\n- `discovery-server` — resolve `lb://vets-service`, `lb://visits-service`, `lb://customers-service`, `lb://genai-service`\n- `vets-service`, `visits-service`, `customers-service`, `genai-service`\n\n## Erros e retentativas\n- Filtro `CircuitBreaker` padrão em todas as rotas, fallback `forward:/fallback`.\n- Filtro `Retry` padrão: 1 retentativa, apenas para `POST` com resposta `503 SERVICE_UNAVAILABLE`.\n- Rota `genai-service` tem circuit breaker nomeado adicional `genaiCircuitBreaker`.\n"}, {"id": "ctr-gateway-get-owner-details", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "GET /api/gateway/owners/{ownerId}", "resumo": "Agrega, numa única resposta, o tutor, seus pets e as visitas de cada pet. É o contrato central do fluxo [Consulta de histórico do tutor](../../../fluxos/flow-consulta-historico-tutor.md) — ver a sequência técnica completa lá, incluindo o ca", "caminho": "sistemas/api-gateway/contratos/ctr-gateway-get-owner-details.md", "realiza": ["cap-atendimento-omnicanal", "cap-cadastro-clientes-pets"], "realizado_por": ["cmp-gateway-controller"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# GET /api/gateway/owners/{ownerId}\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona do ponto de vista do cliente, implementação reativa) |\n| Produtor | `api-gateway` |\n| Consumidores | frontend AngularJS (tela de detalhe do tutor) |\n| Especificação | sem OpenAPI; extraído de `ApiGatewayController.getOwnerDetails` |\n\nAgrega, numa única resposta, o tutor, seus pets e as visitas de cada pet. É o contrato central do fluxo [Consulta de histórico do tutor](../../../fluxos/flow-consulta-historico-tutor.md) — ver a sequência técnica completa lá, incluindo o caminho de erro do circuit breaker.\n\n## Exemplo\n```json\n// GET /api/gateway/owners/1 -> 200\n{ \"id\": 1, \"firstName\": \"George\", \"lastName\": \"Franklin\", \"pets\": [\n  { \"id\": 1, \"name\": \"Leo\", \"type\": {\"id\":1,\"name\":\"cat\"},\n    \"visits\": [ { \"id\": 42, \"petId\": 1, \"date\": \"2026-09-20\", \"description\": \"Vacina\" } ] } ] }\n```\n"}, {"id": "ctr-gateway-post-fallback", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "POST /fallback", "resumo": "Retorna sempre `503 Service Unavailable` com uma mensagem fixa. Usado principalmente quando o `genai-service` está indisponível (\"Chat is currently unavailable...\").", "caminho": "sistemas/api-gateway/contratos/ctr-gateway-post-fallback.md", "realiza": ["cap-atendimento-omnicanal"], "realizado_por": ["cmp-gateway-routes"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# POST /fallback\n| Campo | Valor |\n|---|---|\n| Tipo | API (fallback de circuit breaker) |\n| Produtor | `api-gateway` |\n| Consumidores | invocado internamente pelas rotas do Gateway (`fallbackUri: forward:/fallback`) quando o serviço de destino falha |\n| Especificação | sem OpenAPI; extraído de `FallbackController.fallback` |\n\nRetorna sempre `503 Service Unavailable` com uma mensagem fixa. Usado principalmente quando o `genai-service` está indisponível (\"Chat is currently unavailable...\").\n\n## Exemplo\n```\n// POST /fallback -> 503\n\"Chat is currently unavailable. Please try again later.\"\n```\n"}, {"id": "sys-api-gateway", "kind": "system", "camada": 4, "status": "proposed", "titulo": "api-gateway", "resumo": "Porta de entrada única do domínio: serve o frontend AngularJS (tela de tutores, pets, veterinários, visitas e chat) e roteia/agrega chamadas para os serviços de negócio via Spring Cloud Gateway.", "caminho": "sistemas/api-gateway/ficha.md", "realiza": ["sub-atendimento-digital", "cap-atendimento-omnicanal"], "realizado_por": ["cmp-gateway-routes", "cmp-gateway-controller"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# api-gateway\nPorta de entrada única do domínio: serve o frontend AngularJS (tela de tutores, pets, veterinários, visitas e chat) e roteia/agrega chamadas para os serviços de negócio via Spring Cloud Gateway.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | [Atendimento Digital](../../subdominios/sub-atendimento-digital.md) |\n| Dono | não informado — a confirmar |\n| Stack | Java 17+, Spring Boot 4.0.1, Spring Cloud Gateway (WebFlux), Spring Cloud Circuit Breaker (Resilience4j), AngularJS 1.x (frontend estático embutido) |\n| Repositório | `spring-petclinic-api-gateway/` |\n| Criticidade | alta (inferido — é o único ponto de entrada externo do domínio; se cair, nenhum canal funciona) |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph api-gateway\n    UI[Frontend AngularJS estático]\n    ROUTES[Spring Cloud Gateway routes]\n    AGG[ApiGatewayController]\n    FB[FallbackController]\n  end\n  UI --> ROUTES\n  UI --> AGG\n  ROUTES -->|lb://vets-service /api/vet/**| VET[vets-service]\n  ROUTES -->|lb://visits-service /api/visit/**| VIS[visits-service]\n  ROUTES -->|lb://customers-service /api/customer/**| CUST[customers-service]\n  ROUTES -->|lb://genai-service /api/genai/**| GEN[genai-service]\n  AGG --> CUST\n  AGG --> VIS\n  ROUTES -.circuit breaker/retry falha.-> FB\n```\n\n## Expõe\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `GET /api/gateway/owners/{ownerId}` | API REST (agregação) | [ctr-gateway-get-owner-details](contratos/ctr-gateway-get-owner-details.md) |\n| `POST /fallback` | API REST (fallback de circuit breaker) | [ctr-gateway-post-fallback](contratos/ctr-gateway-post-fallback.md) |\n| `/api/vet/**`, `/api/visit/**`, `/api/customer/**`, `/api/genai/**` | Roteamento (proxy reverso via Eureka `lb://`) | encaminha, com `StripPrefix=2`, para os contratos próprios de cada serviço (ver fichas de `vets-service`, `visits-service`, `customers-service`, `genai-service`) |\n\nNão há OpenAPI neste serviço; contratos extraídos de `application.yml` (rotas) e dos controllers Java.\n\n## Consome\n| Sistema | Contrato | Tipo |\n|---|---|---|\n| `customers-service` | [ctr-customers-get-owner](../customers-service/contratos/ctr-customers-get-owner.md) e demais endpoints `/owners/**`, `/petTypes` | API REST síncrona, via `lb://customers-service` |\n| `visits-service` | [ctr-visits-get-visits-batch](../visits-service/contratos/ctr-visits-get-visits-batch.md) e demais endpoints `/api/visit/**` | API REST síncrona, via `lb://visits-service` |\n| `vets-service` | [ctr-vets-get-vets](../vets-service/contratos/ctr-vets-get-vets.md) | API REST síncrona, via `lb://vets-service` |\n| `genai-service` | `POST /api/genai/chatclient` (roteado) | API REST síncrona, via `lb://genai-service` |\n| discovery-server | registro/descoberta Eureka | infraestrutura |\n| config-server | propriedades externas | infraestrutura |\n\n## Dados\nEste sistema não possui banco próprio nem entidades persistentes — trabalha apenas com DTOs de agregação em memória (`OwnerDetails`, `PetDetails`, `VisitDetails`, `Visits`, todos em `org.springframework.samples.petclinic.api.dto`), espelhando as entidades dos serviços de origem.\n\n## Qualidade\n- `CircuitBreaker` (Resilience4j) aplicado a todas as rotas por padrão (`default-filters`), com `fallbackUri: forward:/fallback`; a rota `/api/genai/**` tem um circuit breaker nomeado adicional (`genaiCircuitBreaker`).\n- `Retry` padrão: 1 retentativa, só para respostas `SERVICE_UNAVAILABLE` em métodos `POST`.\n- No endpoint de agregação `GET /api/gateway/owners/{ownerId}`, se a chamada a `visits-service` falhar, o circuit breaker devolve uma lista de visitas vazia (`emptyVisitsForPets`) em vez de propagar o erro — o tutor e os pets ainda aparecem, sem visitas.\n"}, {"id": "cmp-config-server-app", "kind": "component", "camada": 5, "status": "proposed", "titulo": "ConfigServerApplication", "resumo": "", "caminho": "sistemas/config-server/componentes/cmp-config-server-app.md", "realiza": ["sys-config-server"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# ConfigServerApplication\n| Campo | Valor |\n|---|---|\n| Tipo | endpoint (servidor Spring Cloud Config, `@EnableConfigServer` presumido) |\n| Gatilho | HTTP, requisições de configuração dos demais serviços na subida |\n| Entrada | nome da aplicação + perfil ativo |\n| Saída | propriedades de configuração (YAML/properties) |\n| Timeout / memória / concorrência | não configurado explicitamente; limite de memória do container: 512M (`docker-compose.yml`) |\n\n## Dependências\n- Repositório Git externo (ou filesystem local via perfil `native`)\n\n## Erros e retentativas\n- Os clientes usam `optional:configserver:...` — se o config-server estiver indisponível, a subida do serviço cliente **não falha** (import opcional), mas o serviço roda sem as propriedades externas.\n"}, {"id": "sys-config-server", "kind": "system", "camada": 4, "status": "proposed", "titulo": "config-server", "resumo": "Servidor de configuração centralizada (Spring Cloud Config). Não implementa nenhuma capacidade de negócio da clínica veterinária — é infraestrutura de plataforma consumida por todos os outros sistemas.", "caminho": "sistemas/config-server/ficha.md", "realiza": ["sub-plataforma"], "realizado_por": ["cmp-config-server-app"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# config-server\nServidor de configuração centralizada (Spring Cloud Config). Não implementa nenhuma capacidade de negócio da clínica veterinária — é infraestrutura de plataforma consumida por todos os outros sistemas.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | [Plataforma](../../subdominios/sub-plataforma.md) |\n| Dono | não informado — a confirmar |\n| Stack | Java 17+, Spring Boot 4.0.1, Spring Cloud Config Server |\n| Repositório | `spring-petclinic-config-server/` |\n| Criticidade | crítica (inferido — todos os demais serviços dependem dele para subir: `depends_on: condition: service_healthy` no `docker-compose.yml`) |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph config-server\n    SRV[Config Server :8888]\n  end\n  SRV -->|git ou filesystem| REPO[(spring-petclinic-microservices-config, externo)]\n```\n\n## Expõe\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| API do Spring Cloud Config (`/{application}/{profile}`) | API REST (padrão do framework) | não documentado neste repositório; consumida via `spring.config.import: configserver:...` pelos demais serviços |\n\n## Consome\n- Repositório Git externo `https://github.com/spring-petclinic/spring-petclinic-microservices-config` (branch `main`), ou um diretório local via perfil `native` + variável `GIT_REPO`. **Este repositório de configuração não faz parte do escopo lido nesta documentação** — é a provável fonte real das credenciais de banco, URLs de produção e segredos (ver RELATORIO.md).\n\n## Dados\nNão possui banco próprio; serve arquivos de configuração de um repositório Git/filesystem externo.\n\n## Qualidade\n- Porta fixa `8888` (único serviço com `server.port` explícito neste repositório).\n- Health check via `curl -I http://config-server:8888` no `docker-compose.yml`, com 10 tentativas a cada 5s.\n"}, {"id": "cmp-customers-owner-api", "kind": "component", "camada": 5, "status": "proposed", "titulo": "OwnerResource", "resumo": "Endpoint REST para criar, consultar e atualizar tutores (owners).", "caminho": "sistemas/customers-service/componentes/cmp-customers-owner-api.md", "realiza": ["sys-customers-service"], "realizado_por": ["res-hsqldb-embedded", "res-mysql-customers"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# OwnerResource\nEndpoint REST para criar, consultar e atualizar tutores (owners).\n\n| Campo | Valor |\n|---|---|\n| Tipo | endpoint (controller Spring MVC) |\n| Gatilho | HTTP, prefixo `/owners` |\n| Entrada | `OwnerRequest` (JSON validado com Bean Validation) ou `ownerId` de path |\n| Saída | entidade `Owner` (JSON) ou `204 No Content` na atualização |\n| Timeout / memória / concorrência | não configurado explicitamente neste componente |\n\n## Dependências\n- `OwnerRepository` (Spring Data JPA) — leitura e escrita da tabela `owners`\n- `OwnerEntityMapper` — mapeia `OwnerRequest` para a entidade `Owner`\n\n## Erros e retentativas\n- `findOwner` retorna `Optional<Owner>` — se vazio, o Spring serializa `null`/404 conforme configuração padrão (não há tratamento explícito neste método).\n- `updateOwner` lança `ResourceNotFoundException` se o owner não existir.\n- Sem fila de mensagens mortas — este componente não consome filas.\n"}, {"id": "cmp-customers-pet-api", "kind": "component", "camada": 5, "status": "proposed", "titulo": "PetResource", "resumo": "Endpoint REST para tipos de pet e para criar/consultar/atualizar pets de um tutor.", "caminho": "sistemas/customers-service/componentes/cmp-customers-pet-api.md", "realiza": ["sys-customers-service"], "realizado_por": ["res-hsqldb-embedded", "res-mysql-customers"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# PetResource\nEndpoint REST para tipos de pet e para criar/consultar/atualizar pets de um tutor.\n\n| Campo | Valor |\n|---|---|\n| Tipo | endpoint (controller Spring MVC) |\n| Gatilho | HTTP, rotas `/petTypes` e `/owners/{ownerId}/pets/**` |\n| Entrada | `PetRequest` (JSON) ou `ownerId`/`petId` de path |\n| Saída | entidade `Pet`, `PetDetails` ou lista de `PetType` (JSON) |\n| Timeout / memória / concorrência | não configurado explicitamente neste componente |\n\n## Dependências\n- `PetRepository` — leitura/escrita de `pets`, consulta de `types`\n- `OwnerRepository` — para associar o pet criado ao tutor (`owner.addPet(pet)`)\n\n## Erros e retentativas\n- `processCreationForm` lança `ResourceNotFoundException` se o `ownerId` não existir.\n- `findPetById` (usado por `findPet` e `processUpdateForm`) lança `ResourceNotFoundException` se o pet não existir.\n- Sem fila de mensagens mortas.\n"}, {"id": "ctr-customers-get-owner", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "GET /owners/{ownerId}", "resumo": "Retorna um tutor pelo id, incluindo a lista de pets (`Owner.pets`, carregada `EAGER`). É a chamada base do fluxo [Consulta de histórico do tutor](../../../fluxos/flow-consulta-historico-tutor.md).", "caminho": "sistemas/customers-service/contratos/ctr-customers-get-owner.md", "realiza": ["cap-cadastro-clientes-pets"], "realizado_por": ["cmp-customers-owner-api"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# GET /owners/{ownerId}\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `api-gateway` (`CustomersServiceClient.getOwner`, via Eureka `lb://customers-service`), `genai-service` (indiretamente, via `listOwners`) |\n| Especificação | sem OpenAPI; extraído de `OwnerResource.findOwner` |\n\nRetorna um tutor pelo id, incluindo a lista de pets (`Owner.pets`, carregada `EAGER`). É a chamada base do fluxo [Consulta de histórico do tutor](../../../fluxos/flow-consulta-historico-tutor.md).\n\n## Exemplo\n```json\n// GET /owners/1 -> 200\n{ \"id\": 1, \"firstName\": \"George\", \"lastName\": \"Franklin\", \"address\": \"110 W. Liberty St.\", \"city\": \"Madison\",\n  \"telephone\": \"6085551023\", \"pets\": [ { \"id\": 1, \"name\": \"Leo\", \"birthDate\": \"2010-09-07\", \"type\": { \"id\": 1, \"name\": \"cat\" } } ] }\n```\n"}, {"id": "ctr-customers-get-owners", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "GET /owners", "resumo": "Lista todos os tutores cadastrados, sem paginação nem filtro.", "caminho": "sistemas/customers-service/contratos/ctr-customers-get-owners.md", "realiza": ["cap-cadastro-clientes-pets"], "realizado_por": ["cmp-customers-owner-api"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# GET /owners\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `genai-service` (tool `listOwners`, via `AIDataProvider.getAllOwners`) |\n| Especificação | sem OpenAPI; extraído de `OwnerResource.findAll` |\n\nLista todos os tutores cadastrados, sem paginação nem filtro.\n\n## Exemplo\n```json\n// GET /owners -> 200\n[ { \"id\": 1, \"firstName\": \"George\", \"lastName\": \"Franklin\", \"pets\": [ /* ... */ ] } ]\n```\n"}, {"id": "ctr-customers-get-pet", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "GET owners/*/pets/{petId}", "resumo": "Retorna os detalhes de um pet, incluindo o nome completo do tutor (`PetDetails` monta `owner.getFirstName() + \" \" + owner.getLastName()`).", "caminho": "sistemas/customers-service/contratos/ctr-customers-get-pet.md", "realiza": ["cap-cadastro-clientes-pets"], "realizado_por": ["cmp-customers-pet-api"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# GET owners/*/pets/{petId}\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `api-gateway` (tela de detalhe/edição de pet) |\n| Especificação | sem OpenAPI; extraído de `PetResource.findPet` |\n\nRetorna os detalhes de um pet, incluindo o nome completo do tutor (`PetDetails` monta `owner.getFirstName() + \" \" + owner.getLastName()`).\n\n## Exemplo\n```json\n// GET owners/1/pets/15 -> 200\n{ \"id\": 15, \"name\": \"Rex\", \"owner\": \"Ana Souza\", \"birthDate\": \"2022-01-10\", \"type\": {\"id\":2,\"name\":\"dog\"} }\n```\n"}, {"id": "ctr-customers-get-pettypes", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "GET /petTypes", "resumo": "Lista os tipos de pet cadastrados (dado de referência), usados para popular o formulário de cadastro de pet.", "caminho": "sistemas/customers-service/contratos/ctr-customers-get-pettypes.md", "realiza": ["cap-cadastro-clientes-pets"], "realizado_por": ["cmp-customers-pet-api"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# GET /petTypes\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `api-gateway` (formulário de cadastro de pet) |\n| Especificação | sem OpenAPI; extraído de `PetResource.getPetTypes` |\n\nLista os tipos de pet cadastrados (dado de referência), usados para popular o formulário de cadastro de pet.\n\n## Exemplo\n```json\n// GET /petTypes -> 200\n[ {\"id\":1,\"name\":\"cat\"}, {\"id\":2,\"name\":\"dog\"}, {\"id\":3,\"name\":\"lizard\"}, {\"id\":4,\"name\":\"snake\"}, {\"id\":5,\"name\":\"bird\"}, {\"id\":6,\"name\":\"hamster\"} ]\n```\n"}, {"id": "ctr-customers-post-owners", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "POST /owners", "resumo": "Cria um novo tutor. Retorna `201 Created` com o owner criado (incluindo `id` gerado).", "caminho": "sistemas/customers-service/contratos/ctr-customers-post-owners.md", "realiza": ["cap-cadastro-clientes-pets"], "realizado_por": ["cmp-customers-owner-api"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# POST /owners\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `api-gateway` (frontend AngularJS), `genai-service` (tool `addOwnerToPetclinic`) |\n| Especificação | sem OpenAPI; extraído de `OwnerResource.createOwner` |\n\nCria um novo tutor. Retorna `201 Created` com o owner criado (incluindo `id` gerado).\n\n## Exemplo\n```json\n// request\n{ \"firstName\": \"Ana\", \"lastName\": \"Souza\", \"address\": \"Rua 1\", \"city\": \"Curitiba\", \"telephone\": \"41999990000\" }\n// response 201\n{ \"id\": 11, \"firstName\": \"Ana\", \"lastName\": \"Souza\", \"address\": \"Rua 1\", \"city\": \"Curitiba\", \"telephone\": \"41999990000\", \"pets\": [] }\n```\n"}, {"id": "ctr-customers-post-pet", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "POST /owners/{ownerId}/pets", "resumo": "Cria um novo pet associado a um tutor existente. IDs de tipo de pet válidos: 1=cat, 2=dog, 3=lizard, 4=snake, 5=bird, 6=hamster (conforme descrição da tool `addPetToOwner` do `genai-service`). Retorna `201 Created`.", "caminho": "sistemas/customers-service/contratos/ctr-customers-post-pet.md", "realiza": ["cap-cadastro-clientes-pets"], "realizado_por": ["cmp-customers-pet-api"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# POST /owners/{ownerId}/pets\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `api-gateway` (formulário de cadastro de pet), `genai-service` (tool `addPetToOwner`) |\n| Especificação | sem OpenAPI; extraído de `PetResource.processCreationForm` |\n\nCria um novo pet associado a um tutor existente. IDs de tipo de pet válidos: 1=cat, 2=dog, 3=lizard, 4=snake, 5=bird, 6=hamster (conforme descrição da tool `
