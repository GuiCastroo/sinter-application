n\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `PaymentService.Charge` | gRPC | Ver [componente charge](./componentes/charge.md) e [regras de cartão](../../regras-de-negocio/bandeiras-de-cartao-aceitas.md) |\n\n`[extracted, protos/demo.proto#L177-L195]`\n\n## Consome\n- Nenhum outro sistema.\n\n## Dados\nNão persiste nada — cada chamada é sem estado; o `transaction_id` retornado é um UUID aleatório, não rastreável depois. `[extracted, src/paymentservice/charge.js#L85]`\n\n## Qualidade\n- Erros de validação (`InvalidCreditCard`, `UnacceptedCreditCard`, `ExpiredCreditCard`) têm `code = 400` mas são propagados como gRPC error genérico; o `checkoutservice` os traduz para `Internal` (500) na resposta ao cliente — perde-se a granularidade do motivo da recusa. `[extracted, src/paymentservice/charge.js#L30-L53; src/checkoutservice/main.go#L262-L266]`\n"}, {"id": "sys-productcatalogservice", "kind": "system", "camada": 4, "status": "proposed", "titulo": "productcatalogservice", "resumo": "Fonte de verdade dos produtos vendidos na loja: lista, busca e devolve detalhe. Não tem banco de dados — o catálogo é um arquivo JSON estático empacotado na imagem. `[extracted]`", "caminho": "sistemas/productcatalogservice/ficha.md", "realiza": ["sub-catalogo-e-descoberta"], "realizado_por": ["cmp-productcatalogservice-grpc"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# productcatalogservice\n\nFonte de verdade dos produtos vendidos na loja: lista, busca e devolve detalhe. Não tem banco de dados — o catálogo é um arquivo JSON estático empacotado na imagem. `[extracted]`\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Catálogo e Descoberta |\n| Dono | Não identificado `[a confirmar]` |\n| Stack | Go |\n| Repositório | `src/productcatalogservice/` |\n| Criticidade | Alta — praticamente todas as páginas dependem dele `[inferred]` |\n\n## Contêineres\n\n```mermaid\nflowchart LR\n  API[ProductCatalogService gRPC :3550] --> JSON[[products.json embutido na imagem]]\n```\n`[extracted — arquivo de dados local, não é um recurso de infraestrutura externo]`\n\n## Expõe\n\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `ProductCatalogService.ListProducts` | gRPC | Lista todos os produtos |\n| `ProductCatalogService.GetProduct` | gRPC | Detalhe por id |\n| `ProductCatalogService.SearchProducts` | gRPC | Busca por texto |\n\n`[extracted, protos/demo.proto#L71-L103]`\n\n## Consome\n- Nenhum outro sistema.\n\n## Dados\n\n```mermaid\nerDiagram\n  PRODUCT {\n    string id\n    string name\n    string description\n    string picture\n    Money price_usd\n    string categorias\n  }\n```\n`[extracted, protos/demo.proto#L77-L87]`\n\n## Qualidade\n- Catálogo estático versionado junto com o código (deploy de novo produto = novo build da imagem). `[inferred a partir da ausência de qualquer chamada de escrita/admin no contrato]`\n"}, {"id": "sys-recommendationservice", "kind": "system", "camada": 4, "status": "proposed", "titulo": "recommendationservice", "resumo": "Sugere produtos a partir dos itens já no carrinho do cliente. `[extracted, README.md#L34]`", "caminho": "sistemas/recommendationservice/ficha.md", "realiza": ["sub-catalogo-e-descoberta"], "realizado_por": ["cmp-recommendationservice-grpc"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# recommendationservice\n\nSugere produtos a partir dos itens já no carrinho do cliente. `[extracted, README.md#L34]`\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Catálogo e Descoberta |\n| Dono | Não identificado `[a confirmar]` |\n| Stack | Python |\n| Repositório | `src/recommendationservice/` |\n| Criticidade | Baixa — degrada a experiência mas não bloqueia compra `[inferred, src/frontend/handlers.go#L316 usa `_` para ignorar erro]` |\n\n## Expõe\n\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `RecommendationService.ListRecommendations` | gRPC | Recebe `user_id` + ids já no carrinho; devolve uma amostra **aleatória** dos demais produtos do catálogo (`random.sample`), excluindo os já presentes |\n\n`[extracted, protos/demo.proto#L56-L67; src/recommendationservice/recommendation_server.py#L70-L86]`\n\n## Consome\n- productcatalogservice.ListProducts — para saber o universo de produtos a sortear.\n\n## Regra de negócio\nVer [recomendação não é personalizada](../../regras-de-negocio/recomendacao-nao-e-personalizada.md) — não há modelo de ML nem histórico de compras envolvido, apesar do nome do serviço.\n"}, {"id": "sys-shippingservice", "kind": "system", "camada": 4, "status": "proposed", "titulo": "shippingservice", "resumo": "Dá uma cotação de frete e \"expede\" o pedido (mock: gera um código de rastreio determinístico; não integra transportadora real). `[extracted, README.md#L33]`", "caminho": "sistemas/shippingservice/ficha.md", "realiza": ["sub-checkout-e-pagamento"], "realizado_por": ["cmp-shippingservice-grpc"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# shippingservice\n\nDá uma cotação de frete e \"expede\" o pedido (mock: gera um código de rastreio determinístico; não integra transportadora real). `[extracted, README.md#L33]`\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Checkout e Pagamento |\n| Dono | Não identificado `[a confirmar]` |\n| Stack | Go |\n| Repositório | `src/shippingservice/` |\n| Criticidade | Média-alta — bloqueia a confirmação do pedido se falhar `[inferred]` |\n\n## Expõe\n\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `ShippingService.GetQuote` | gRPC | Custo em USD calculado a partir da contagem de itens (`CreateQuoteFromCount`), endereço não influencia o valor apesar de fazer parte do contrato |\n| `ShippingService.ShipOrder` | gRPC | Devolve `tracking_id` mock (`CreateTrackingId`) a partir do endereço |\n\n`[extracted, src/shippingservice/main.go#L118-L154]`\n\n## Consome\n- Nenhum outro sistema.\n\n## Dados\nSem persistência — cálculo puro em memória.\n\n## Qualidade\n- Determinístico e sem I/O externo — não tem por que falhar em produção normal; falhas seriam de rede/infra, não de regra de negócio.\n"}, {"id": "sys-shoppingassistantservice", "kind": "system", "camada": 4, "status": "proposed", "titulo": "shoppingassistantservice", "resumo": "Responde perguntas em linguagem natural sobre o catálogo, usando busca por similaridade vetorial (AlloyDB) e um modelo de linguagem generativo (Gemini via `langchain_google_genai`). Recurso opcional, desligado por padrão. `[extracted]`", "caminho": "sistemas/shoppingassistantservice/ficha.md", "realiza": ["sub-assistente-de-compras"], "realizado_por": ["cmp-shoppingassistant-chat", "res-alloydb", "res-secret-manager"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# shoppingassistantservice\n\nResponde perguntas em linguagem natural sobre o catálogo, usando busca por similaridade vetorial (AlloyDB) e um modelo de linguagem generativo (Gemini via `langchain_google_genai`). Recurso opcional, desligado por padrão. `[extracted]`\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Assistente de Compras |\n| Dono | Não identificado `[a confirmar]` |\n| Stack | Python, Flask, LangChain, `langchain_google_alloydb_pg` |\n| Repositório | `src/shoppingassistantservice/` |\n| Criticidade | Baixa — feature opcional, não faz parte do caminho de compra `[extracted]` |\n\n## Contêineres\n\n```mermaid\nflowchart LR\n  API[Flask HTTP :80] --> VS[AlloyDBVectorStore]\n  VS --> DB[(AlloyDB - tabela de embeddings de produtos)]\n  API --> LLM[ChatGoogleGenerativeAI - Gemini]\n  API --> SM[(Secret Manager - senha do AlloyDB)]\n```\n`[extracted, src/shoppingassistantservice/shoppingassistantservice.py#L20-L60]`\n\n## Expõe\n\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `POST /` | HTTP | Recebe a pergunta do cliente e devolve texto gerado a partir dos produtos similares encontrados |\n\n## Consome\n- AlloyDB (vetores de produto) e Secret Manager (senha do banco) diretamente — não via outro sistema do domínio.\n- API do Google Generative AI (Gemini) para gerar a resposta e os embeddings.\n\n## Qualidade\n- Requer `PROJECT_ID`, `REGION`, `ALLOYDB_DATABASE_NAME`, `ALLOYDB_TABLE_NAME`, `ALLOYDB_CLUSTER_NAME`, `ALLOYDB_INSTANCE_NAME`, `ALLOYDB_SECRET_NAME` — se qualquer uma faltar, o processo falha no boot (`os.environ[...]` sem default). `[extracted, src/shoppingassistantservice/shoppingassistantservice.py#L19-L24]`\n- Segredo: senha do Postgres/AlloyDB é buscada em runtime no Secret Manager, nunca fica em variável de ambiente em texto puro. `[extracted, src/shoppingassistantservice/shoppingassistantservice.py#L36-L39]`\n"}, {"id": "sub-assistente-de-compras", "kind": "subdomain", "camada": 3, "status": "proposed", "titulo": "Subdomínio Assistente de Compras", "resumo": "Recurso opcional (desligado por padrão) que responde perguntas em linguagem natural sobre o catálogo usando busca vetorial + um modelo de linguagem generativo. `[extracted]`", "caminho": "subdominios/assistente-de-compras.md", "realiza": ["dom-online-boutique", "cap-assistir-compra-com-ia"], "realizado_por": ["sys-shoppingassistantservice"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Subdomínio Assistente de Compras\n\nRecurso opcional (desligado por padrão) que responde perguntas em linguagem natural sobre o catálogo usando busca vetorial + um modelo de linguagem generativo. `[extracted]`\n\n## Sistemas\n\n| Sistema | Papel |\n|---|---|\n| [shoppingassistantservice](../sistemas/shoppingassistantservice/ficha.md) | Recebe a pergunta, busca produtos similares em um vetor armazenado no AlloyDB e gera a resposta com Gemini |\n\n## Fluxos executados aqui\n\nSem sequência dedicada nesta rodada de documentação — a chamada é isolada (`frontend POST /bot → shoppingassistantservice`), sem orquestração com os demais subdomínios. `[extracted]`\n\n## Ativação\n\nSó existe quando:\n1. o overlay Kustomize `kustomize/components/shopping-assistant` é aplicado (adiciona o Deployment do serviço e liga `ENABLE_ASSISTANT=true` no frontend); e\n2. as variáveis `PROJECT_ID`, `REGION`, `ALLOYDB_*` estão configuradas.\n\n`[extracted, kustomize/components/shopping-assistant/kustomization.yaml]`\n"}, {"id": "sub-carrinho-e-sessao", "kind": "subdomain", "camada": 3, "status": "proposed", "titulo": "Subdomínio Carrinho e Sessão", "resumo": "Identifica o visitante sem exigir cadastro e mantém o carrinho de compras entre requisições, mesmo sem estado no navegador além de um cookie. `[extracted]`", "caminho": "subdominios/carrinho-e-sessao.md", "realiza": ["dom-online-boutique", "cap-vender-produtos-online"], "realizado_por": ["sys-frontend", "sys-cartservice"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Subdomínio Carrinho e Sessão\n\nIdentifica o visitante sem exigir cadastro e mantém o carrinho de compras entre requisições, mesmo sem estado no navegador além de um cookie. `[extracted]`\n\n## Sistemas\n\n| Sistema | Papel |\n|---|---|\n| [frontend](../sistemas/frontend/ficha.md) | Gera e propaga o `session_id` (cookie `shop_session-id`); usa esse id como `user_id` em todas as chamadas downstream |\n| [cartservice](../sistemas/cartservice/ficha.md) | Persiste o carrinho por `user_id`; suporta três backends de dados intercambiáveis (Redis, Cloud Spanner, AlloyDB) |\n\n## Fluxos executados aqui\n- [Compra do cliente](../fluxos/compra-do-cliente.sequencia.md) — passos 1, 3, 4 e 10\n\n## Ponto de atenção\n\nO `user_id` é literalmente o valor do cookie de sessão — não há verificação de identidade. Um cliente que limpa cookies ou troca de dispositivo perde o carrinho e \"vira\" outro usuário. `[inferred a partir da ausência de login]`\n"}, {"id": "sub-catalogo-e-descoberta", "kind": "subdomain", "camada": 3, "status": "proposed", "titulo": "Subdomínio Catálogo e Descoberta", "resumo": "Responsável por manter e expor o catálogo de produtos e por ajudar o cliente a descobrir itens além do que ele já procurou (recomendações e anúncios). `[extracted a partir das responsabilidades de cada serviço]`", "caminho": "subdominios/catalogo-e-descoberta.md", "realiza": ["dom-online-boutique", "cap-descobrir-e-recomendar-produtos"], "realizado_por": ["sys-productcatalogservice", "sys-recommendationservice", "sys-adservice"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Subdomínio Catálogo e Descoberta\n\nResponsável por manter e expor o catálogo de produtos e por ajudar o cliente a descobrir itens além do que ele já procurou (recomendações e anúncios). `[extracted a partir das responsabilidades de cada serviço]`\n\n## Sistemas\n\n| Sistema | Papel |\n|---|---|\n| [productcatalogservice](../sistemas/productcatalogservice/ficha.md) | Fonte de verdade dos produtos (catálogo estático em JSON), busca e detalhe |\n| [recommendationservice](../sistemas/recommendationservice/ficha.md) | Sugere produtos a partir dos itens do carrinho |\n| [adservice](../sistemas/adservice/ficha.md) | Anúncios de texto por categoria/contexto |\n\n## Fluxos executados aqui\n\nNão há fluxo macro dedicado; este subdomínio é consumido dentro de [Compra do cliente](../fluxos/compra-do-cliente.sequencia.md) (passos 2 e 4) e por qualquer página que liste produtos.\n\n## Observação\n\nNenhum dos três sistemas escreve dados — todos são consultas. Não há cache dedicado documentado no código (o catálogo é lido do arquivo JSON a cada `ListProducts`, salvo cache em memória — ver [ficha do productcatalogservice](../sistemas/productcatalogservice/ficha.md)). `[extracted]`\n"}, {"id": "sub-checkout-e-pagamento", "kind": "subdomain", "camada": 3, "status": "proposed", "titulo": "Subdomínio Checkout e Pagamento", "resumo": "Orquestra a finalização do pedido: reúne o carrinho, precifica na moeda do cliente, cota e executa o frete, cobra o cartão e confirma por e-mail. `[extracted]`", "caminho": "subdominios/checkout-e-pagamento.md", "realiza": ["dom-online-boutique", "cap-vender-produtos-online"], "realizado_por": ["sys-checkoutservice", "sys-paymentservice", "sys-shippingservice", "sys-emailservice", "sys-currencyservice"], "extracoes": ["extracted"], "conflito": false, "corpo": "\n# Subdomínio Checkout e Pagamento\n\nOrquestra a finalização do pedido: reúne o carrinho, precifica na moeda do cliente, cota e executa o frete, cobra o cartão e confirma por e-mail. `[extracted]`\n\n## Sistemas\n\n| Sistema | Papel |\n|---|---|\n| [checkoutservice](../sistemas/checkoutservice/ficha.md) | Orquestrador central — único ponto que fala com cart, catálogo, câmbio, frete, pagamento e e-mail |\n| [paymentservice](../sistemas/paymentservice/ficha.md) | Valida e \"cobra\" o cartão (mock) |\n| [shippingservice](../sistemas/shippingservice/ficha.md) | Cota e \"executa\" o frete (mock) |\n| [emailservice](../sistemas/emailservice/ficha.md) | Envia (mock) a confirmação do pedido |\n| [currencyservice](../sistemas/currencyservice/ficha.md) | Converte todos os valores monetários para a moeda do cliente |\n\n## Fluxos executados aqui\n- [Compra do cliente](../fluxos/compra-do-cliente.sequencia.md) — passos 5 a 12 (o núcleo do subdomínio)\n\n## Como o fluxo vira engenharia\n\nO `checkoutservice` é a única porta de entrada deste subdomínio (`PlaceOrder`); nenhum outro sistema do domínio chama `paymentservice`, `shippingservice` ou `emailservice` diretamente. Isso o torna o ponto único de falha e de regra de negócio do checkout. `[extracted — nenhum outro cliente gRPC para paymentservice/shippingservice/emailservice encontrado além do checkoutservice]`\n"}], "relatorio": "# Relatório de documentação — Domínio Online Boutique\n\nDocumentação gerada a partir do repositório `microservices-demo` (Google Cloud, demo \"Online Boutique\"), commit `38e7348eb289eb5b87c0c6e8cb19ced0449dc389` (2026-09-18), lido em modo somente leitura. Repositório do domínio: `dominio-online-boutique/`, seguindo o Padrão de Documentação do Sinter (6 camadas + gavetas transversais). Todo item nasceu com `status: proposed` — precisa de aprovação humana antes de virar `approved`.\n\n## Cobertura\n\n**51 arquivos Markdown**, cobrindo os 12 sistemas do repositório (11 microsserviços de negócio + `loadgenerator m European Central Bank\" (tempo real); o código (`src/currencyservice/server.js`) carrega um JSON estático embutido na imagem, sem nenhuma chamada de rede em runtime. Registrei as duas versões e uma hipótese de explicação, sem resolver sozinho.\n\n## Segredos encontrados\n\nNenhum valor de segredo (chave, token, senha, connection string com credencial) foi encontrado em texto plano no código ou nos manifestos. Um ponto a observar, sem valor exposto:\n- `src/shoppingassistantservice/shoppingassistantservice.py#L33-L39` — o serviço busca a senha do AlloyDB em runtime via Google Secret Manager (`ALLOYDB_SECRET_NAME`); o nome do segredo está em variável de ambiente, o valor nunca aparece no repositório. Registrado em `infraestrutura/recursos/secret-manager.md`.\n- Os manifestos Kustomize (`kustomize/components/spanner`, `.../alloydb`) têm placeholders (`SPANNER_DB_USER_GSA_ID`, `REDIS_CONNECTION_STRING`) que precisam ser preenchidos por quem for ativar essas variantes — não são segredos, são valores de configuração pendentes.\n\n## Riscos técnicos identificados (não são segredos, mas vale destacar)\n\n- **Cobrança sem pedido**: se `ShipOrder` falhar depois de `Charge` ter sido aprovado, o `checkoutservice` devolve erro ao cliente sem estornar a cobrança nem registrar o pedido (ver `regras-de-negocio/falha-pos-cobranca-nao-reverte-pedido.md` e o \"Caminho de erro\" em `fluxos/compra-do-cliente.sequencia.md`).\n- **Sem persistência de pedido**: não existe uma tabela ou log de pedidos em lugar nenhum do domínio — `OrderResult` só existe na resposta da chamada. Qualquer necessidade de auditoria, histórico de compras ou relatório de vendas não é suportada hoje pelo código.\n- **Carrinho não durável no ambiente padrão**: `redis-cart` usa `emptyDir`; um restart do pod apaga todos os carrinhos ativos.\n\n## Perguntas para as pessoas\n\n### Para o PM\n1. A capacidade \"Vender produtos online\" e o fluxo \"Compra do cliente\" (`capacidades/`, `fluxos/`) descrevem corretamente a intenção de negócio, ou há nomes/objetivos oficiais diferentes?\n2. É aceitável, do ponto de vista de negócio, que uma falha de frete pós-cobrança deixe o cliente pago sem um pedido registrado (ver risco acima)? Deveria existir estorno automático?\n3. Existem indicadores de negócio (conversão, ticket médio, abandono de carrinho) definidos em outro lugar que deveriam aparecer na seção \"Indicadores\" do fluxo macro?\n4. Quem é o dono/responsável de cada sistema (nenhum `CODEOWNERS` foi encontrado)?\n\n### Para o arquiteto\n5. Existe algum outro domínio de negócio real (fora desta demo) com o qual este domínio deveria se relacionar? Hoje não há evidência de nenhum.\n6. Qual combinação de overlays Kustomize (`infraestrutura/ambientes/variantes-kustomize.md`) representa a produção real, se este repositório for adaptado além de demo — Redis in-cluster, Memorystore, Spanner ou AlloyDB para o carrinho? Istio/Service Mesh ligado ou não?\n7. A ausência de mensageria assíncrona é uma escolha deliberada permanente, ou algo a introduzir se o domínio precisar notificar sistemas externos (ex.: um data warehouse) sobre pedidos concluídos?\n\n### Para o tech lead\n8. O conflito sobre a origem dos dados de câmbio (README vs. código) — o arquivo `currency_conversion.json` é atualizado manualmente a partir do BCE de tempos em tempos, ou o README está desatualizado?\n9. Faz sentido propagar os erros específicos de `paymentservice` (`InvalidCreditCard`, `UnacceptedCreditCard`, `ExpiredCreditCard`) até o cliente, em vez do genérico \"falha ao completar o pedido\" que ele vê hoje?\n10. Vale a pena aprofundar a documentação de componente a componente para `frontend` e `cartservice` (os dois sistemas com mais lógica própria além do simples proxy gRPC)?\n\n## Como continuar esta documentação\n\n- Estrutura e convenções: ver `README.md` na raiz deste repositório de domínio.\n- Para atualizar depois de uma mudança no código-fonte: releia o item afetado (ele já tem `provenance` apontando pro ar   const link = ids => ids.map(x => byId[x] ? `<a href="#" data-id="${x}">${esc(byId[x].titulo)} <span style="color:var(--faint)">· ${D.camadas[byId[x].camada]}</span></a>` : '').join('') || '<span style="color:var(--faint);font-size:13px">—</span>';
  const desce = [...new Set([...i.realizado_por, ...D.itens.filter(o => o.realiza.includes(id)).map(o => o.id)])];
  const sobe = [...new Set([...i.realiza, ...D.itens.filter(o => o.realizado_por.includes(id)).map(o => o.id)])];
  const ex = [...new Set(i.extracoes)];
  const v = document.getElementById('view');
  v.innerHTML = `<p class="crumbs">${D.camadas[i.camada]} · ${esc(i.caminho)}</p>
    <div class="chips"><span class="chip">${esc(i.kind)}</span>${i.status ? `<span class="chip ${i.status==='approved'?'ok':''}">${i.status==='approved'?'aprovado':'proposto'}</span>` : ''}
    ${ex.map(e => `<span class="chip ${e==='inferred'?'inf':'ext'}">${e==='inferred'?'inferido':e==='extracted'?'extraído':'humano'}</span>`).join('')}${i.conflito ? '<span class="chip inf">conflito entre fontes</span>' : ''}</div>
    <div class="doc">${isCanvas(i) ? canvasHTML(i.corpo) : md(i.corpo)}</div>
    <div class="links"><div class="box"><h4>Sobe para</h4>${link(sobe)}</div><div class="box"><h4>Desce para</h4>${link(desce)}</div></div>`;
  v.querySelectorAll('.links a').forEach(a => a.onclick = e => { e.preventDefault(); item(a.dataset.id); });
  window.scrollTo(0,0); desenhar(v);
}
document.getElementById('q').oninput = () => { if (tab === 'geral') abrir('servicos'); else side(gruposPara(tab)); };
tabs(); abrir('geral');
</script></body></html>
