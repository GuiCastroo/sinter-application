const D = {"nome": "Serverlesspresso", "paginas": [{"arquivo": "1-negocio.md", "nome": "Negócio", "resumo": "uma cafeteria de eventos (pop-up, tipo re:Invent) em que o cliente pede café pelo celular escaneando um QR code no balcão, e o barista prepara na ordem em que os pedidos chegam. O domínio controla quem pode pedir, quantos pedidos cabem ao mesmo tempo, e acompanha cada pedido do QR code até um recibo final — sem fila física e sem dinheiro trocando de mãos no sistema.", "texto": "# Negócio: Serverlesspresso\n\n> **Em resumo:** uma cafeteria de eventos (pop-up, tipo re:Invent) em que o cliente pede café pelo\n> celular escaneando um QR code no balcão, e o barista prepara na ordem em que os pedidos chegam.\n> O domínio controla quem pode pedir, quantos pedidos cabem ao mesmo tempo, e acompanha cada\n> pedido do QR code até um recibo final — sem fila física e sem dinheiro trocando de mãos no\n> sistema.\n\n## Nesta página\n\n| Seção |\n|---|\n| [Em uma frase](#em-uma-frase) |\n| [Por que existe](#por-que-existe) |\n| [Faz / Não faz / Não sabemos](#faz--não-faz--não-sabemos) |\n| [A parede do domínio](#a-parede-do-domínio) |\n| [Jornadas principais](#jornadas-principais) |\n| [Quem orquestra](#quem-orquestra) |\n| [Regras que mandam](#regras-que-mandam) |\n| [Entra e sai](#entra-e-sai) |\n| [Linguagem](#linguagem) |\n| [Indicadores](#indicadores) |\n\n## Em uma frase\nDeixar visitantes de um evento pedirem café pelo celular sem fila física, enquanto o sistema\ncontrola o ritmo de pedidos para o barista dar conta e mostra o andamento em tempo real para\ncliente, barista e organização.\n\n## Por que existe\nFoi criado como demonstração pública da AWS (re:Invent 2021) de como orquestrar um processo longo,\ncom esperas humanas, usando serviços serverless — não é um produto comercial de verdade.\nClassificação: **genérico/demonstração** *(a confirmar — não há indicação de que sirva a um\nnegócio real de vendas de café)*.\n\n## Faz / Não faz / Não sabemos\n| Faz | Não faz | Não sabemos |\n|---|---|---|\n| Libera o pedido por QR code, limitado por janela de tempo | Cobrança e pagamento | Se há plano de cobrar pelo café no futuro |\n| Limita pedidos simultâneos para não afogar o barista | Controle de estoque de insumos | Quem decide o cardápio de cada evento (endpoint de edição não encontrado) |\n| Acompanha o pedido do início ao recibo, em tempo real | Entrega/logística fora do balcão | Papéis e donos de cada serviço (sem `CODEOWNERS`) |\n| Autentica cliente e barista por SMS (sem senha) | Cadastro de produto/preço fora do cardápio do evento | Se times reais rodam isto em produção ou só em workshops |\n\n## A parede do domínio\n| # | 🟨 Quem | 🟦 Faz | 🟧 Acontece | 🟪 Regra ou reação |\n|---|---|---|---|---|\n| 1 | Admin | Abre a loja e publica o cardápio do evento | Loja configurada | Pedido só é aceito com a loja aberta |\n| 2 | Cliente | Escaneia o QR code do balcão | Pedido iniciado | Só se houver token livre na janela de 5 min (10 por padrão) |\n| 3 | Sistema | Confere se a loja está aberta e há vaga | Loja indisponível *ou* pedido aceito | No máx. 20 pedidos em andamento ao mesmo tempo |\n| 4 | Cliente | Escolhe a bebida e envia | Pedido registrado com número | Expira em 5 min se não enviar; bebida precisa constar do cardápio |\n| 5 | Barista | Assume, prepara e conclui (ou cancela) | Pedido em preparo → concluído *ou* cancelado | Expira em 15 min se o barista não agir; cliente é avisado na hora |\n| 6 | Sistema | Fecha o pedido e monta o recibo | Pedido finalizado | Recibo em HTML com a trilha de eventos com `userId` |\n\n🟥 Consulte as [dúvidas de contexto na Referência](6-referencia.md#dúvidas-de-contexto).\n\n## Jornadas principais\n| Jornada | Em uma linha | Link |\n|---|---|---|\n| Pedir um café | QR code → bebida → preparo → recibo | [4-jornadas.md → Pedir um café](./4-jornadas.md#pedir-um-café) |\n| Configurar o evento | Admin abre a loja e define o cardápio | [4-jornadas.md → Configurar o evento](./4-jornadas.md#configurar-o-evento) |\n\n## Quem orquestra\n| Jornada | Quem manda | Como |\n|---|---|---|\n| Pedir um café | Duas máquinas de Step Functions cooperando | Uma toca o relógio do pedido e pausa esperando ação humana; a outra recebe a ação (via API) e \"acorda\" a primeira |\n| Configurar o evento | Ninguém — coreografia por eventos | Mudança na tabela dispara evento, que se espalha sozinho para quem escuta |\n\n## Regras que mandam\nOs limites e exceções desta perspectiva estão consolidados na [Referência](6-referencia.md#regras-de-negócio); consulte também as [dúvidas](6-referencia.md#dúvidas-e-perguntas).\n\n## Entra e sai\n| Direção | O quê | Com quem |\n|---|---|---|\n| Entra | Login por número de telefone + código SMS | 🩷 Amazon SNS (via Cognito) |\n| Entra | Pedido escaneado, escolha de bebida, ações do barista | Cliente e Barista (apps não incluídos neste repositório) |\n| Entra | Abertura/fechamento da loja e cardápio | Admin (app não incluído) |\n| Sai | Atualização de pedido em tempo real | 🩷 AWS IoT Core → apps do cliente, barista e admin |\n| Sai | Recibo do pedido | 🩷 Amazon S3 + CloudFront |\n| Sai | Métricas operacionais | 🩷 Amazon CloudWatch |\n\n## Linguagem\nOs termos têm uma definição única na [Referência](6-referencia.md#glossário); consulte também as [dúvidas](6-referencia.md#dúvidas-e-perguntas).\n\n## Indicadores\n*(a confirmar — nenhum indicador de negócio está documentado no repositório; o mais próximo é a\nextensão opcional `WaitTimes`, que calcula tempo médio de espera por bebida, e o `metrics-service`,\nque conta pedidos, cancelamentos e timeouts no CloudWatch.)*\n\n**Fontes:** `01-appCore/initDB/initMenuState.JSON`, `backends/4-order-processing/statemachine/op.asl.json`,\n`backends/5-order-manager/statemachine/om.asl.json`, `backends/9-validator/code/*.js`,\nREADME raiz e de cada backend, `extensions/WaitTimes/README.md`. A classificação em \"Por que\nexiste\" e os itens de \"Não sabemos\" são dedução a partir da ausência de código de cobrança/estoque\ne da origem do repositório (evento re:Invent), não afirmação explícita encontrada no texto.\n", "secoes": [{"titulo": "Em uma frase", "slug": "em-uma-frase", "subs": []}, {"titulo": "Por que existe", "slug": "por-que-existe", "subs": []}, {"titulo": "Faz / Não faz / Não sabemos", "slug": "faz--não-faz--não-sabemos", "subs": []}, {"titulo": "A parede do domínio", "slug": "a-parede-do-domínio", "subs": []}, {"titulo": "Jornadas principais", "slug": "jornadas-principais", "subs": []}, {"titulo": "Quem orquestra", "slug": "quem-orquestra", "subs": []}, {"titulo": "Regras que mandam", "slug": "regras-que-mandam", "subs": []}, {"titulo": "Entra e sai", "slug": "entra-e-sai", "subs": []}, {"titulo": "Linguagem", "slug": "linguagem", "subs": []}, {"titulo": "Indicadores", "slug": "indicadores", "subs": []}]}, {"arquivo": "2-arquitetura.md", "nome": "Arquitetura", "resumo": "um único event bus do EventBridge (`Serverlesspresso`) conecta nove serviços serverless; dois deles são máquinas de Step Functions que se revezam para orquestrar o pedido, o resto é coreografia por eventos (nome do evento como contrato). Nada é síncrono entre serviços, exceto as chamadas REST que vêm de fora (dos 3 frontends) e o par de `SendTaskSuccess` que liga as duas máquinas de estado.", "texto": "# Arquitetura: Serverlesspresso\n\n> **Em resumo:** um único event bus do EventBridge (`Serverlesspresso`) conecta nove serviços\n> serverless; dois deles são máquinas de Step Functions que se revezam para orquestrar o pedido, o\n> resto é coreografia por eventos (nome do evento como contrato). Nada é síncrono entre serviços,\n> exceto as chamadas REST que vêm de fora (dos 3 frontends) e o par de `SendTaskSuccess` que liga\n> as duas máquinas de estado.\n\n## Nesta página\n\n| Seção |\n|---|\n| [Contexto](#contexto) |\n| [Subdomínios](#subdomínios) |\n| [Mapa dos serviços](#mapa-dos-serviços) |\n| [Estilo de integração](#estilo-de-integração) |\n| [Decisões que moldam](#decisões-que-moldam) |\n| [Riscos técnicos](#riscos-técnicos) |\n\n## Contexto\n\n```mermaid\nflowchart LR\n  Cliente((Cliente)) --> SP[Domínio Serverlesspresso]\n  Barista((Barista)) --> SP\n  Admin((Admin)) --> SP\n  SP --> SMS[🩷 SNS/SMS via Cognito]\n  SP --> IOT[🩷 AWS IoT Core]\n  SP --> CDN[🩷 CloudFront/S3 - recibo]\n  SP --> CW[🩷 CloudWatch metrics]\n```\n\nOs 3 frontends (app do cliente, app do barista, painel admin) **não estão neste repositório**\n(README raiz); eles só aparecem aqui como consumidores das APIs REST e do tópico IoT.\n\n## Subdomínios\n\n| Subdomínio | Responsabilidade | Serviços |\n|---|---|---|\n| Plataforma | Event bus, login por SMS, endpoint de tempo real | `00-baseCore` |\n| Validação do pedido | Portão de entrada: QR code com token limitado por janela | `validator-service` |\n| Configuração do evento | Cardápio, limites e loja aberta/fechada | `config-service` |\n| Processamento do pedido | Relógio do pedido: capacidade, timeouts, task tokens | `order-processor` |\n| Gestão do pedido | Ações do cliente e do barista sobre um pedido | `order-manager` |\n| Tempo real | Espelha eventos de negócio nos 3 frontends | `publisher-service` |\n| Recibo do pedido | Trilha de eventos + HTML final | `order-journey-service` |\n| Métricas | CloudWatch customizado | `metrics-service` |\n| Extensões | Simulação e analytics opcionais, desacoplados | `EventPlayer`, `OrderRobotExtension`, `PersistOrderMetricsToDynamoDB`, `WaitTimes` |\n\n## Mapa dos serviços\n\n<!-- MAPA-PRINCIPAL -->\n\nRelações de dependência declaradas em [Serviços](3-servicos.md); a seta parte do consumidor e aponta para seu fornecedor. O rótulo distingue chamada, evento, dado, callback e inicialização. Componentes opcionais e inativos conservam seu estado.\n\n## Estilo de integração\n\n| De → Para | Estilo | Observação |\n|---|---|---|\n| Frontends → validator/config/order-manager | Síncrono (REST via API Gateway, auth Cognito) | Único ponto síncrono externo |\n| validator-service → order-processor | Assíncrono (evento `Validator.NewOrder` inicia a Step Function) | Coreografia |\n| order-processor ⇄ order-manager | **Orquestração cruzada** via *task token* persistido no DynamoDB + `SendTaskSuccess` | Não é nem puro evento nem chamada direta — um workflow pausa e o outro o resume |\n| order-processor/order-manager → publisher-service, order-journey-service, metrics-service | Assíncrono (EventBridge, roteado por `detail-type`) | Coreografia pura, várias regras de rota por prefixo |\n| publisher-service → frontends | Assíncrono (MQTT via IoT Core) | Sem confirmação de entrega tratada pelo domínio |\n| config-service (mudança na tabela) → resto do domínio | Assíncrono (DynamoDB Streams → EventBridge) | Não há API para mudar o cardápio, só a tabela `storeOpen` |\n\n## Decisões que moldam\n\n| Decisão | Onde está detalhada |\n|---|---|\n| Duas máquinas de Step Functions cooperando por *task token* em vez de uma só | [6-referencia.md → Decisões #1](./6-referencia.md#decisões) |\n| AWS IoT Core (MQTT) para tempo real, em vez de WebSocket API ou polling | [6-referencia.md → Decisões #2](./6-referencia.md#decisões) |\n| Uma tabela de config única por `eventId`, propagada por Streams | [6-referencia.md → Decisões #3](./6-referencia.md#decisões) |\n\n## Riscos técnicos\n\n- **Limite de 20 pedidos simultâneos fixo no ASL** (não vem da config `maxOrdersInQueue`): mudar a\n  capacidade do evento exige editar e reimplantar a máquina de estados, não só a config.\n- **Task token perdido = pedido preso até o timeout.** O elo entre as duas Step Functions é um\n  campo (`TaskToken`) numa linha do DynamoDB; se essa linha for sobrescrita, apagada ou o\n  `ConditionExpression` falhar, o `order-processor` só sai da pausa quando o timeout (5 ou 15 min)\n  estourar — não há alarme nem retry visível para esse caso.\n- **`publisher-service` engole erro de IoT silenciosamente** (`try/catch` só loga): um frontend\n  pode parar de receber atualização em tempo real sem que nada no backend acuse falha.\n- **`order-journey-service` escuta *todo* evento do bus** (sem filtro de `detail-type`): qualquer\n  novo tipo de evento adicionado ao domínio passa a ser processado por ele também, ainda que não\n  pertença a um pedido — o primeiro `Choice` descarta o que não tem `userId`, mas isso significa\n  reprocessar tudo o tempo todo.\n- **Código órfão convivendo com o código ativo** (`1-counting-service`, os dois lambdas de\n  `4-order-processing/functions`, o `api.yaml` de `/order`): risco de alguém reativar ou editar o\n  caminho errado achando que é o que está no ar.\n\n**Fontes:** todos os `template.yaml`/`*.asl.json` e handlers citados em\n[3-servicos.md](./3-servicos.md) e [5-infraestrutura.md](./5-infraestrutura.md); README raiz para\nos frontends externos.\n", "secoes": [{"titulo": "Contexto", "slug": "contexto", "subs": []}, {"titulo": "Subdomínios", "slug": "subdomínios", "subs": []}, {"titulo": "Mapa dos serviços", "slug": "mapa-dos-serviços", "subs": []}, {"titulo": "Estilo de integração", "slug": "estilo-de-integração", "subs": []}, {"titulo": "Decisões que moldam", "slug": "decisões-que-moldam", "subs": []}, {"titulo": "Riscos técnicos", "slug": "riscos-técnicos", "subs": []}]}, {"arquivo": "3-servicos.md", "nome": "Serviços", "resumo": "catálogo de plataforma e serviços, incluindo métricas em stack separada, código inativo e quatro extensões opcionais, quase todos Lambda + EventBridge; dois deles são máquinas de estado do Step Functions que cooperam para tocar o pedido do início ao fim. Cada seção lista os lambdas daquele serviço um a um, o contrato que expõe e os eventos que produz/consome.", "texto": "# Serviços: Serverlesspresso\n\n> **Em resumo:** catálogo de plataforma e serviços, incluindo métricas em stack separada, código inativo e quatro extensões opcionais, quase todos\n> Lambda + EventBridge; dois deles são máquinas de estado do Step Functions que cooperam para\n> tocar o pedido do início ao fim. Cada seção lista os lambdas daquele serviço um a um, o contrato\n> que expõe e os eventos que produz/consome.\n\n## Nesta página\n\n| Seção |\n|---|\n| [00-baseCore](#00-basecore) |\n| [validator-service (backends/9-validator)](#validator-service-backends9-validator) |\n| [config-service (backends/2-config-service)](#config-service-backends2-config-service) |\n| [order-processor (backends/4-order-processing)](#order-processor-backends4-order-processing) |\n| [order-manager (backends/5-order-manager)](#order-manager-backends5-order-manager) |\n| [publisher-service (backends/6-publisher-service)](#publisher-service-backends6-publisher-service) |\n| [order-journey-service (backends/8-order-journey)](#order-journey-service-backends8-order-journey) |\n| [metrics-service (backends/7-metrics-service)](#metrics-service-backends7-metrics-service) |\n| [counting-service (backends/1-counting-service, não usado)](#counting-service-backends1-counting-service-não-usado) |\n| [EventPlayer (extensions/EventPlayer)](#eventplayer-extensionseventplayer) |\n| [OrderRobotExtension (extensions/OrderRobotExtension)](#orderrobotextension-extensionsorderrobotextension) |\n| [PersistOrderMetricsToDynamoDB (extensions/PersistOrderMetricsToDynamoDB)](#persistordermetricstodynamodb-extensionspersistordermetricstodynamodb) |\n| [WaitTimes (extensions/WaitTimes)](#waittimes-extensionswaittimes) |\n\n## 00-baseCore\n\n**ID:** `00-baseCore`\n**Estado:** ativo\n> **Em resumo:** stack fundacional: cria o event bus `Serverlesspresso`, o Cognito User Pool com\n> login por SMS (sem senha) e o endpoint IoT usado para tempo real. Todo o resto depende dela.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Plataforma | Não identificado *(a confirmar)* | SAM, Node.js 14.x | `00-baseCore/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `ServerlesspressoEventBus` | EventBridge custom bus | Barramento de eventos de todo o domínio |\n| Cognito User Pool / Identity Pool | Auth | Login do cliente e do barista por número de telefone (OTP via SMS) |\n| Endpoint IoT Core | MQTT | Canal de tempo real para os 3 frontends |\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `DefineAuthChallenge` | Cognito (custom auth flow) | Decide o próximo passo do desafio de login |\n| `CreateAuthChallenge` | Cognito | Gera e envia o código por SMS (`sns`/`mobiletargeting`) |\n| `VerifyAuthChallengeResponse` | Cognito | Confere o código digitado pelo usuário |\n| `PreSignUp` | Cognito | Auto-confirma o cadastro no primeiro login |\n| `GetIoTEndpointFunction` | Custom resource (deploy) | Descobre o endpoint IoT da conta e o expõe como output |\n\n### Quando falha\nSem retry/DLQ explícitos nos gatilhos do Cognito; falha no desafio = login recusado pelo Cognito.\n`LogsRule` grava todo evento do bus em CloudWatch Logs para depuração (`/aws/serverlesspresso-event-bus`).\n\n### Infra que usa\nEventBridge, Cognito, IoT Core — ver [5-infraestrutura.md](./5-infraestrutura.md#stack-00-basecore-00-basecoretemplateyaml).\n\n---\n\n## validator-service (`backends/9-validator`)\n\n**ID:** `validator-service`\n**Estado:** ativo\n> **Em resumo:** é o portão de entrada do pedido: gera um QR code com token limitado por janela de\n> 5 minutos e, quando o cliente escaneia, valida o token e dispara `Validator.NewOrder` — o evento\n> que dá partida em tudo.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Validação do pedido | Não identificado *(a confirmar)* | SAM, Node.js 14.x | `backends/9-validator/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `GET /qr-code` | API (Cognito auth) | Gera/retorna o código válido da janela de tempo atual |\n| `POST /qr-code` | API (Cognito auth) | Valida o código escaneado e abre um novo pedido |\n\n### Consome\n| Serviço | Contrato | Tipo | Transporte |\n|---|---|---|---|\n| config-service | `ConfigTable` (leitura direta) | acessa_dado | Dado (DynamoDB) |\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `getCode.js` (`GetQRcodeFunction`) | API Gateway `GET /qr-code` | Só admin; cria (se não existir) um código de `CodeLength` chars por janela de 5 min, com `drinksPerBarcode` tokens disponíveis, lido do `config-{eventId}` |\n| `verifyCode.js` (`VerifyQRcodeFunction`) | API Gateway `POST /qr-code` | Confere código + janela; se `availableTokens < 1` recusa; senão decrementa, gera `orderId` (`nanoid`) e publica `Validator.NewOrder` no bus |\n\n### Dados\nTabela `serverlesspresso-validator` (`PK` = `{eventId}-{bucket de 5 min}`), com `last_code`,\n`availableTokens`, `start_ts`/`end_ts` da janela.\n\n### Quando falha\nSem parâmetro obrigatório → `400`/`422`. Código/token errado → `400 Invalid code`. Sem tokens na\njanela → `200` com `{error: 'No tokens remaining'}` (o cliente vê que esgotou, não é um erro HTTP).\n\n### Infra que usa\n`ValidatorTable` (DynamoDB), `RESTApiValidatorService` (API Gateway), `ServerlesspressoEventBus` —\nver [5-infraestrutura.md](./5-infraestrutura.md#stack-01-appcore-01-appcoretemplateyaml--a-maior-parte-da-aplicação).\n\n---\n\n## config-service (`backends/2-config-service`)\n\n**ID:** `config-service`\n**Estado:** ativo\n> **Em resumo:** guarda a configuração de cada evento pop-up (loja aberta/fechada, cardápio,\n> limites) numa única tabela e propaga qualquer mudança para o resto do domínio via EventBridge.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Configuração do evento | Não identificado *(a confirmar)* | SAM, Node.js 14.x | `backends/2-config-service/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `GET /config` | API | Cardápio e limites do evento (público, sem auth) |\n| `GET /admin-config` | API (Cognito auth) | Mesma config, para o painel admin |\n| `PUT /store` | API (Cognito auth) | Abre/fecha a loja (`storeOpen`) |\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| `configChanged.js` (`ConfigChangedFunction`) | DynamoDB Streams da `ConfigTable` | Publica `ConfigService.ConfigChanged` com a nova imagem do item toda vez que a config muda |\n\n### Dados\n`ConfigTable` (`PK` = `config-{eventId}`): `storeOpen` (bool), `menu` (lista de bebida + modificadores\n+ disponibilidade), `drinksPerBarcode`, `maxOrdersInQueue`, `maxOrdersPerUser`, `start`/`end` do evento,\n`language`. Semeada no deploy por `FillDatabasesCustomResource` (`01-appCore/initDB`).\n\n### Quando falha\nAs integrações `PUT`/`GET` são diretas API Gateway → DynamoDB (sem lambda no meio); erro de\nDynamoDB vira erro HTTP cru, sem tratamento customizado visível.\n\n### Infra que usa\n`ConfigTable`, `RESTApiConfigService` — ver [5-infraestrutura.md](./5-infraestrutura.md#stack-01-appcore-01-appcoretemplateyaml--a-maior-parte-da-aplicação).\n\n---\n\n## order-processor (`backends/4-order-processing`)\n\n**ID:** `order-processor`\n**Estado:** ativo\n> **Em resumo:** a máquina de estado que carrega o pedido do início ao fim. Não tem lambda\n> própria: fala direto com DynamoDB e EventBridge, e pausa duas vezes esperando uma ação humana\n> (cliente escolher a bebida, barista concluir), usando o padrão *waitForTaskToken*.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Processamento do pedido | Não identificado *(a confirmar)* | Step Functions (Standard) | `backends/4-order-processing/statemachine/op.asl.json` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| Execução iniciada por `Validator.NewOrder` | EventBridgeRule → StartExecution | Único jeito documentado de iniciar um pedido |\n\n### Consome\n| Serviço | Contrato | Tipo | Transporte |\n|---|---|---|---|\n| config-service | `ConfigTable.GetItem` (`storeOpen`) | acessa_dado | Dado (DynamoDB) |\n| CountingTable | `CountingTable.UpdateItem` (gera o número do pedido, lógica reimplementada inline no ASL — ver nota abaixo) | acessa_dado | Dado (DynamoDB) |\n| order-manager | `SendTaskSuccess` recebido | callback | Assíncrono (token) |\n\n### Por dentro (estados do ASL)\n| Estado | O que faz |\n|---|---|\n| `DynamoDB Get Shop status` → `Shop Open?` | Lê `storeOpen` na config do evento |\n| `ListExecutions` → `Is capacity available?` | Lista execuções `RUNNING` da própria máquina; se a 21ª existir (`[20]`), rejeita — **limite de 20 pedidos simultâneos, fixo no ASL** |\n| `EventBridge PutEvents` (`OrderProcessor.ShopUnavailable`) | Loja fechada ou lotada → encerra o pedido |\n| `Emit - Workflow Started TT` | Publica `OrderProcessor.WorkflowStarted` com `TaskToken`; espera até **5 min** (`HeartbeatSeconds: 300`) o cliente enviar a bebida |\n| `Generate Order Number` | `UpdateItem` na `CountingTable` (`IDvalue += 1`) — gera o número exibido ao cliente |\n| `Emit - Awaiting Completion TT` | Publica `OrderProcessor.WaitingCompletion` com novo `TaskToken`; espera até **15 min** (`HeartbeatSeconds: 900`) o barista concluir |\n| `Emit - order finished` | Publica `OrderProcessor.orderFinished` — fecha o pedido com sucesso |\n| `Customer timedout` / `Barista timedout` → `Emit - error timeout` | Em qualquer um dos dois esperas, se estourar o tempo publica `OrderProcessor.OrderTimeOut` |\n\n### Estados do pedido (visão da máquina)\n```mermaid\nstateDiagram-v2\n  [*] --> VerificandoLoja\n  VerificandoLoja --> Indisponivel: fechada ou 20+ em andamento\n  VerificandoLoja --> AguardandoCliente: aceito\n  AguardandoCliente --> ExpiradoCliente: 5 min sem ação\n  AguardandoCliente --> AguardandoBarista: bebida recebida\n  AguardandoBarista --> ExpiradoBarista: 15 min sem ação\n  AguardandoBarista --> Finalizado: concluído ou cancelado\n  Indisponivel --> [*]\n  ExpiradoCliente --> [*]\n  ExpiradoBarista --> [*]\n  Finalizado --> [*]\n```\n\n### Quando falha\nTimeout do cliente ou do barista → `OrderProcessor.OrderTimeOut` (o pedido não fica preso para\nsempre, mas também não distingue \"cliente sumiu\" de \"barista cancelou\" no evento). Sem `Retry`\nnos `PutEvents`; se o `EventBridge PutEvents` falhar a execução simplesmente falha (sem DLQ visível).\n\n### Infra que usa\n`OrderProcessorStateMachine`, `OrderTable`(indireto via order-manager), `CountingTable`, `ConfigTable`,\n`ServerlesspressoEventBus` — ver [5-infraestrutura.md](./5-infraestrutura.md).\n\n🟥 Consulte as [dúvidas de contexto na Referência](6-referencia.md#dúvidas-de-contexto).\n\n---\n\n## order-manager (`backends/5-order-manager`)\n\n**ID:** `order-manager`\n**Estado:** ativo\n> **Em resumo:** a segunda máquina de estado: recebe, via API Gateway, a bebida escolhida pelo\n> cliente e as ações do barista (assumir, liberar, concluir, cancelar), grava tudo na tabela de\n> pedidos e é quem efetivamente \"acorda\" o order-processor com `SendTaskSuccess`.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Gestão do pedido | Não identificado *(a confirmar)* | Step Functions (Standard) + SAM | `backends/5-order-manager/` |\n\n### Expõe\n| Contrato | Tipo | Para quê |\n|---|---|---|\n| `PUT /orders/{id}?action=&eventId=` | API (Cognito auth) → inicia `OrderManagerStateMachine` | Cliente envia a bebida (sem `action`); barista envia `make`/`unmake`/`complete`/`cancel` |\n| `GET /orders` | API (Cognito auth) → `Query` direto no DynamoDB | Fila de pedidos por estado (`ORDERSTATE`), para o app do barista |\n| `GET /orders/{id}` | API (Cognito auth) → `GetItem` direto no DynamoDB | Detalhe de um pedido |\n| `GET /myOrders` | API (Cognito auth) → `Query` por `USERID` | Pedidos do próprio cliente logado |\n\n### Consome\n| Serviço | Contrato | Tipo | Transporte |\n|---|---|---|---|\n| order-processor | `TaskToken` gravado por evento, resumido via `SendTaskSuccess` | callback | Assíncrono (token) |\n| config-service | `ConfigTable.GetItem` (cardápio) | acessa_dado | Dado (DynamoDB) |\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| ASL: `Customer Put Order` → `get menu` → `Sanitize order` | `PUT /orders/{id}` sem `action` | Lê o cardápio do evento e valida a bebida |\n| `sanitize/app.js` (`SanitizeOrderLambda`) | Invocado pelo ASL acima | Confere se a bebida e os modificadores existem no cardápio (`available`); devolve `true`/`false` |\n| ASL: `Update order` → `Resume Order Processor - customer` | Pedido válido | Grava `drinkOrder`, lê o `TaskToken` salvo e chama `SendTaskSuccess` — resume o order-processor no primeiro *wait* |\n| `workflowStarted/app.js` (`WorkFlowStarted`) | Evento `OrderProcessor.WorkflowStarted` | Cria a linha do pedido (`PK=orders`, `SK=orderId`, `ORDERSTATE={eventId}-CREATED`) com o 1º `TaskToken` |\n| `waitingCompletion/app.js` (`WaitingCompletion`) | Evento `OrderProcessor.WaitingCompletion` | Grava o número do pedido e o 2º `TaskToken`; publica `OrderManager.WaitingCompletion` |\n| `OrderTimedOut/app.js` (`OrderTimedOut`) | Evento `OrderProcessor.OrderTimeOut` | Marca `ORDERSTATE = {eventId}-CANCELLED` com o motivo (`cause`) |\n| ASL: `Claim Order` → `Make OR Unmake?` → `EventBridge Emit Making Order` | `PUT /orders/{id}?action=make\\|unmake` | Grava `baristaUserId` (ou limpa, no `unmake`); publica `OrderManager.MakeOrder` |\n| ASL: `Complete Order`/`Cancel Order` → `Emit Completed \\|\\| Cancelled` → `Resume Order Processor - Barista` | `PUT /orders/{id}?action=complete\\|cancel` | Atualiza `ORDERSTATE`, publica `OrderManager.Order{eventId}-COMPLETED/CANCELLED` e chama `SendTaskSuccess` — resume o order-processor no segundo *wait* |\n\n### Dados\n`serverlesspresso-order-table`: `PK=\"orders\"`, `SK=orderId`, `USERID`, `ORDERSTATE`\n(`{eventId}-CREATED/COMPLETED/CANCELLED`), `TaskToken`, `orderNumber`, `drinkOrder`, `baristaUserId`,\n`robot` (marca pedidos simulados — ver OrderRobotExtension), `TS`. Índices: `LSI-timestamp`,\n`GSI-status`, `GSI-userId`.\n\n```mermaid\nerDiagram\n  ORDER {\n    string orderId PK\n    string userId\n    string orderState\n    string taskToken\n    string orderNumber\n    string baristaUserId\n    bool robot\n  }\n```\n\n### Quando falha\n`Update order` usa `ConditionExpression` (`userId` bate + `TaskToken` existe) — se falhar, a\nexecução do Step Functions falha sem tratamento visível (sem `Catch`). `Sanitize order` tem retry\n(6x, backoff 2) só para erros de infraestrutura do Lambda, não para bebida inválida (aí o ASL\ntermina em `Succeed` silencioso, sem avisar o cliente por evento).\n\n### Infra que usa\n`OrderManagerStateMachine`, `OrderTable`, `RESTApiForOrderManager` — ver [5-infraestrutura.md](./5-infraestrutura.md).\n\n---\n\n## publisher-service (`backends/6-publisher-service`)\n\n**ID:** `publisher-service`\n**Estado:** ativo\n> **Em resumo:** três lambdas puramente \"escuta o bus, publica no IoT\" — é assim que os 3\n> frontends recebem atualização em tempo real sem dar polling nas APIs.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Tempo real | Não identificado *(a confirmar)* | SAM, Node.js 14.x | `backends/6-publisher-service/` |\n\n### Consome\n| Serviço | Contrato | Tipo | Transporte |\n|---|---|---|---|\n| order-processor | Eventos por prefixo de `detail-type` (`OrderProcessor.*`) | consome_evento | Evento (EventBridge) |\n| order-manager | Eventos por prefixo de `detail-type` (`OrderManager.*`) | consome_evento | Evento (EventBridge) |\n| validator-service | Eventos por prefixo de `detail-type` (`Validator.*`) | consome_evento | Evento (EventBridge) |\n| config-service | Eventos por prefixo de `detail-type` (`ConfigService.*`) | consome_evento | Evento (EventBridge) |\n\n### Por dentro\n| Componente | Gatilho (prefixo do evento) | Publica em (tópico IoT) |\n|---|---|---|\n| `publishToIOT.js` (`PublisherFunctionAdmin`) | `OrderManager.*`, `OrderProcessor.*`, `Validator.*`, `ConfigService.*` | `serverlesspresso-admin-{eventId}` |\n| `publishToIOTuserTopic.js` (`PublisherFunctionUser`) | `OrderManager.*`, `OrderProcessor.*` | `serverlesspresso-user-{userId}` |\n| `publishToIOTconfig.js` (`PublisherFunctionConfig`) | `ConfigService.*` | `serverlesspresso-config-{eventId}` |\n\n### Quando falha\nCada lambda tem `try/catch` interno em volta do `iotdata.publish` e só loga o erro — uma falha de\npublish no IoT **não** falha o evento nem gera alerta visível; o frontend correspondente\nsimplesmente não recebe a atualização até a próxima leitura via API.\n\n### Infra que usa\nIoT Core, `ServerlesspressoEventBus` — ver [5-infraestrutura.md](./5-infraestrutura.md).\n\n---\n\n## order-journey-service (`backends/8-order-journey`)\n\n**ID:** `order-journey-service`\n**Estado:** ativo\n> **Em resumo:** não orquestra nada — é um espectador que grava *todo* evento do domínio numa\n> tabela própria e, quando vê o pedido terminar, monta um recibo em HTML e publica no S3/CloudFront.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Recibo do pedido | Não identificado *(a confirmar)* | Step Functions (Standard) + SAM | `backends/8-order-journey/` |\n\n### Consome\n| Serviço | Contrato | Tipo | Transporte |\n|---|---|---|---|\n| validator-service | Qualquer evento (sem filtro de `detail-type`) | consome_evento | Evento (EventBridge) |\n| config-service | Qualquer evento (sem filtro de `detail-type`) | consome_evento | Evento (EventBridge) |\n| order-processor | Qualquer evento (sem filtro de `detail-type`) | consome_evento | Evento (EventBridge) |\n| order-manager | Qualquer evento (sem filtro de `detail-type`) | consome_evento | Evento (EventBridge) |\n\n### Por dentro\n| Componente | Gatilho | O que faz |\n|---|---|---|\n| ASL: `invocation type` → `Builder event`/`Not a user event` | Todo evento do bus | Descarta eventos sem `userId` (não é de um pedido de cliente) |\n| ASL: `Choice` → `DynamoDB PutItem Other/Completed/Cancelled` | Qualquer evento de pedido | Grava o evento bruto em `OrderJourneyEventsTable` (`PK=orderId`, `SK=timestamp`) |\n| ASL: `Final Event` → `Get Orders` → `Generate HTML` → `Save to S3` | `OrderProcessor.orderFinished` | Busca todos os eventos daquele `orderId`, gera o HTML (`GenerateHtml/app.js`) e salva em `JourneyBucket` |\n\n### Dados\n`OrderJourneyEventsTable`: `PK=orderId`, `SK=timestamp`, `orderDetails` (JSON bruto do evento).\n\n### Quando falha\n`Generate HTML` tem retry (6x, backoff 2) só para falhas de infraestrutura do Lambda.\n\n### Infra que usa\n`OrderJourneyService`, `OrderJourneyEventsTable`, `JourneyBucket`, `JourneyCloudFront` — ver\n[5-infraestrutura.md](./5-infraestrutura.md).\n\n---\n\n## metrics-service (`backends/7-metrics-service`)\n\n**ID:** `metrics-service`\n**Estado:** opcional\n> **Em resumo:** stack separada, opcional: quatro lambdas que só transformam evento em métrica do\n> CloudWatch, para dashboards operacionais.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Métricas | Não identificado *(a confirmar)* | SAM (stack própria), Node.js 14.x | `backends/7-metrics-service/` |\n\n### Consome\n| Serviço | Contrato | Tipo | Transporte |\n|---|---|---|---|\n| validator-service | `Validator.NewOrder` | consome_evento | Evento (EventBridge) |\n| order-manager | `OrderManager.OrderCancelled*`, `OrderManager.WaitingCompletion` | consome_evento | Evento (EventBridge) |\n| order-processor | `OrderProcessor.OrderTimeOut` | consome_evento | Evento (EventBridge) |\n\n### Por dentro\n| Componente | Gatilho |\n|---|---|\n| `ValidatorNewOrder.js` | `Validator.NewOrder` |\n| `OrderManagerOrderCancelled.js` | prefixo `OrderManager.OrderCancelled` |\n| `OrderProcessorOrderTimeOut.js` | `OrderProcessor.OrderTimeOut` |\n| `OrderManagerWaitingCompletion.js` | `OrderManager.WaitingCompletion` |\n\n### Infra que usa\nCloudWatch Metrics, `ServerlesspressoEventBus` (importado via SSM Parameter `/Serverlesspresso/core/eventbusname`).\n\n---\n\n## counting-service (`backends/1-counting-service`, não usado)\n\n**ID:** `counting-service`\n**Estado:** inativo\n> **Em resumo:** código presente no repositório (`getOrderId.js`, `resetOrderId.js`), mas sem\n> `template.yaml` e sem nenhuma referência em outra stack. A geração do número do pedido hoje\n> acontece dentro do próprio `order-processor` (estado `Generate Order Number`).\n\n🟥 Consulte as [dúvidas de contexto na Referência](6-referencia.md#dúvidas-de-contexto).\n\n---\n\n## EventPlayer (`extensions/EventPlayer`)\n\n**ID:** `EventPlayer`\n**Estado:** opcional\n> **Em resumo:** Step Functions que reproduz ~15 minutos de eventos reais no bus, para testar\n> extensões sem precisar operar a loja de verdade.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Extensões | Comunidade/exemplo | Step Functions + SAM | `extensions/EventPlayer/` |\n\n### Consome\n| Serviço | Contrato | Tipo | Transporte |\n|---|---|---|---|\n| — | Lê `events.json` local e publica no bus `Serverlesspresso` | consome_evento | Evento (EventBridge, saída) |\n\n---\n\n## OrderRobotExtension (`extensions/OrderRobotExtension`)\n\n**ID:** `OrderRobotExtension`\n**Estado:** opcional\n> **Em resumo:** duas máquinas de estado (`orderBot`, `baristaBot`) que simulam clientes e\n> baristas em massa (parâmetro `orders`) — é a origem do campo `robot` nas linhas da `OrderTable`.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Extensões | Comunidade/exemplo | Step Functions + SAM | `extensions/OrderRobotExtension/` |\n\n### Consome\n| Serviço | Contrato | Tipo | Transporte |\n|---|---|---|---|\n| validator-service | Chama a mesma API que um cliente real chamaria *(a confirmar, não lido em detalhe)* | chama_api | API |\n| order-manager | Chama a mesma API que um barista real chamaria *(a confirmar, não lido em detalhe)* | chama_api | API |\n\n---\n\n## PersistOrderMetricsToDynamoDB (`extensions/PersistOrderMetricsToDynamoDB`)\n\n**ID:** `PersistOrderMetricsToDynamoDB`\n**Estado:** opcional\n> **Em resumo:** fila SQS + Lambda + DynamoDB dedicados a guardar histórico de\n> `OrderManager.WaitingCompletion` para análise posterior (a fila absorve picos de eventos).\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Extensões | Comunidade/exemplo | SAM (SQS + DynamoDB + Lambda) | `extensions/PersistOrderMetricsToDynamoDB/` |\n\n### Consome\n| Serviço | Contrato | Tipo | Transporte |\n|---|---|---|---|\n| order-manager | `OrderManager.WaitingCompletion` via EventBridge → SQS | consome_evento | Evento (assíncrono, com fila) |\n\n---\n\n## WaitTimes (`extensions/WaitTimes`)\n\n**ID:** `WaitTimes`\n**Estado:** opcional\n> **Em resumo:** único componente em CDK/TypeScript do repositório; escuta pedido\n> enviado/concluído e calcula o tempo médio de espera por bebida.\n\n| Subdomínio | Dono | Stack | Repositório |\n|---|---|---|---|\n| Extensões | Comunidade/exemplo | AWS CDK, TypeScript | `extensions/WaitTimes/` |\n\n### Consome\n| Serviço | Contrato | Tipo | Transporte |\n|---|---|---|---|\n| order-manager | Eventos de pedido enviado e concluído | consome_evento | Evento (EventBridge) |\n\n---\n\n**Fontes:** cada `template.yaml`/`*.asl.json` citado na seção correspondente, e o código-fonte de\ncada handler (`backends/*/code|functions/**/*.js`). \"Dono\" não aparece em nenhum arquivo do\nrepositório (sem `CODEOWNERS`) — marcado *(a confirmar)* em todas as seções. Detalhes de\nOrderRobotExtension não foram lidos linha a linha (só o README e a lista de arquivos); o resto do\ninventário vem de leitura direta do código.\n", "secoes": [{"titulo": "00-baseCore", "slug": "00-basecore", "subs": [{"titulo": "Expõe", "slug": "00-basecore--expõe"}, {"titulo": "Por dentro", "slug": "00-basecore--por-dentro"}, {"titulo": "Quando falha", "slug": "00-basecore--quando-falha"}, {"titulo": "Infra que usa", "slug": "00-basecore--infra-que-usa"}]}, {"titulo": "validator-service (backends/9-validator)", "slug": "validator-service-backends9-validator", "subs": [{"titulo": "Expõe", "slug": "validator-service-backends9-validator--expõe"}, {"titulo": "Consome", "slug": "validator-service-backends9-validator--consome"}, {"titulo": "Por dentro", "slug": "validator-service-backends9-validator--por-dentro"}, {"titulo": "Dados", "slug": "validator-service-backends9-validator--dados"}, {"titulo": "Quando falha", "slug": "validator-service-backends9-validator--quando-falha"}, {"titulo": "Infra que usa", "slug": "validator-service-backends9-validator--infra-que-usa"}]}, {"titulo": "config-service (backends/2-config-service)", "slug": "config-service-backends2-config-service", "subs": [{"titulo": "Expõe", "slug": "config-service-backends2-config-service--expõe"}, {"titulo": "Por dentro", "slug": "config-service-backends2-config-service--por-dentro"}, {"titulo": "Dados", "slug": "config-service-backends2-config-service--dados"}, {"titulo": "Quando falha", "slug": "config-service-backends2-config-service--quando-falha"}, {"titulo": "Infra que usa", "slug": "config-service-backends2-config-service--infra-que-usa"}]}, {"titulo": "order-processor (backends/4-order-processing)", "slug": "order-processor-backends4-order-processing", "subs": [{"titulo": "Expõe", "slug": "order-processor-backends4-order-processing--expõe"}, {"titulo": "Consome", "slug": "order-processor-backends4-order-processing--consome"}, {"titulo": "Por dentro (estados do ASL)", "slug": "order-processor-backends4-order-processing--por-dentro-estados-do-asl"}, {"titulo": "Estados do pedido (visão da máquina)", "slug": "order-processor-backends4-order-processing--estados-do-pedido-visão-da-máquina"}, {"titulo": "Quando falha", "slug": "order-processor-backends4-order-processing--quando-falha"}, {"titulo": "Infra que usa", "slug": "order-processor-backends4-order-processing--infra-que-usa"}]}, {"titulo": "order-manager (backends/5-order-manager)", "slug": "order-manager-backends5-order-manager", "subs": [{"titulo": "Expõe", "slug": "order-manager-backends5-order-manager--expõe"}, {"titulo": "Consome", "slug": "order-manager-backends5-order-manager--consome"}, {"titulo": "Por dentro", "slug": "order-manager-backends5-order-manager--por-dentro"}, {"titulo": "Dados", "slug": "order-manager-backends5-order-manager--dados"}, {"titulo": "Quando falha", "slug": "order-manager-backends5-order-manager--quando-falha"}, {"titulo": "Infra que usa", "slug": "order-manager-backends5-order-manager--infra-que-usa"}]}, {"titulo": "publisher-service (backends/6-publisher-service)", "slug": "publisher-service-backends6-publisher-service", "subs": [{"titulo": "Consome", "slug": "publisher-service-backends6-publisher-service--consome"}, {"titulo": "Por dentro", "slug": "publisher-service-backends6-publisher-service--por-dentro"}, {"titulo": "Quando falha", "slug": "publisher-service-backends6-publisher-service--quando-falha"}, {"titulo": "Infra que usa", "slug": "publisher-service-backends6-publisher-service--infra-que-usa"}]}, {"titulo": "order-journey-service (backends/8-order-journey)", "slug": "order-journey-service-backends8-order-journey", "subs": [{"titulo": "Consome", "slug": "order-journey-service-backends8-order-journey--consome"}, {"titulo": "Por dentro", "slug": "order-journey-service-backends8-order-journey--por-dentro"}, {"titulo": "Dados", "slug": "order-journey-service-backends8-order-journey--dados"}, {"titulo": "Quando falha", "slug": "order-journey-service-backends8-order-journey--quando-falha"}, {"titulo": "Infra que usa", "slug": "order-journey-service-backends8-order-journey--infra-que-usa"}]}, {"titulo": "metrics-service (backends/7-metrics-service)", "slug": "metrics-service-backends7-metrics-service", "subs": [{"titulo": "Consome", "slug": "metrics-service-backends7-metrics-service--consome"}, {"titulo": "Por dentro", "slug": "metrics-service-backends7-metrics-service--por-dentro"}, {"titulo": "Infra que usa", "slug": "metrics-service-backends7-metrics-service--infra-que-usa"}]}, {"titulo": "counting-service (backends/1-counting-service, não usado)", "slug": "counting-service-backends1-counting-service-não-usado", "subs": []}, {"titulo": "EventPlayer (extensions/EventPlayer)", "slug": "eventplayer-extensionseventplayer", "subs": [{"titulo": "Consome", "slug": "eventplayer-extensionseventplayer--consome"}]}, {"titulo": "OrderRobotExtension (extensions/OrderRobotExtension)", "slug": "orderrobotextension-extensionsorderrobotextension", "subs": [{"titulo": "Consome", "slug": "orderrobotextension-extensionsorderrobotextension--consome"}]}, {"titulo": "PersistOrderMetricsToDynamoDB (extensions/PersistOrderMetricsToDynamoDB)", "slug": "persistordermetricstodynamodb-extensionspersistordermetricstodynamodb", "subs": [{"titulo": "Consome", "slug": "persistordermetricstodynamodb-extensionspersistordermetricstodynamodb--consome"}]}, {"titulo": "WaitTimes (extensions/WaitTimes)", "slug": "waittimes-extensionswaittimes", "subs": [{"titulo": "Consome", "slug": "waittimes-extensionswaittimes--consome"}]}]}, {"arquivo": "4-jornadas.md", "nome": "Jornadas", "resumo": "duas jornadas. A principal é **Pedir um café**: do QR code escaneado no balcão até o recibo em HTML, orquestrada por duas máquinas de Step Functions que se revezam via *task token*. A segunda é **Configurar o evento**: como o admin abre/fecha a loja e muda o cardápio, e como isso se propaga sem nenhum orquestrador — por coreografia de eventos.", "texto": "# Jornadas: Serverlesspresso\n\n> **Em resumo:** duas jornadas. A principal é **Pedir um café**: do QR code escaneado no balcão até\n> o recibo em HTML, orquestrada por duas máquinas de Step Functions que se revezam via *task\n> token*. A segunda é **Configurar o evento**: como o admin abre/fecha a loja e muda o cardápio, e\n> como isso se propaga sem nenhum orquestrador — por coreografia de eventos.\n\n## Nesta página\n\n| Seção |\n|---|\n| [Pedir um café](#pedir-um-café) |\n| [Configurar o evento](#configurar-o-evento) |\n\n## Pedir um café\n\n**Participantes:** `validator-service`, `config-service`, `order-processor`, `order-manager`, `publisher-service`, `order-journey-service`, `metrics-service`\n\n> **Em resumo:** o cliente escaneia um QR code liberado pelo balcão, escolhe a bebida, o barista\n> prepara e conclui, e um recibo é gerado no fim. O pedido nunca fica \"girando\": ele existe como\n> duas pausas de uma máquina de estados, acordadas por eventos quando alguém age.\n\n### Em linguagem de negócio\n| # | 🟨 Quem | 🟦 Faz | 🟧 Acontece | 🟪 Regra ou reação |\n|---|---|---|---|---|\n| 1 | Cliente | Pede o código no balcão e escaneia o QR | Pedido iniciado | Só se houver token livre na janela de 5 min (10 por padrão) |\n| 2 | Sistema | Confere se a loja está aberta e há vaga | Loja indisponível *ou* pedido aceito | Aceita só com loja aberta e menos de 20 pedidos em andamento |\n| 3 | Cliente | Escolhe a bebida e envia | Pedido registrado com número | Expira em 5 min se não enviar; bebida precisa existir no cardápio do evento |\n| 4 | Barista | Assume o pedido | Pedido em preparo | Qualquer barista autenticado pode assumir ou devolver (unmake) |\n| 5 | Barista | Conclui ou cancela | Pedido concluído *ou* cancelado | Expira em 15 min se o barista não agir; cliente é avisado na hora |\n| 6 | Sistema | Fecha o pedido e monta o recibo | Pedido finalizado | Recibo em HTML publicado com a trilha de eventos com `userId` |\n\n🟥 Consulte as [dúvidas de contexto na Referência](6-referencia.md#dúvidas-de-contexto).\n\n### Quem orquestra\nDuas máquinas do Step Functions cooperam: **order-processor** é o dono do relógio (abre/fecha o\npedido, controla os dois tempos-limite), mas não fala com ninguém diretamente — ele publica um\nevento com um `TaskToken` e **pausa**. Quem \"acorda\" ele é a segunda máquina, **order-manager**,\ndisparada via API Gateway sempre que o cliente ou o barista fazem uma ação; ela lê o token\nsalvo no DynamoDB e chama `SendTaskSuccess`. Não há coreografia aqui: sem uma ação humana passando\npelo order-manager, o order-processor fica parado até o timeout.\n\n### Passo a passo técnico\n```mermaid\nsequenceDiagram\n  participant A as Admin/display\n  participant C as Cliente\n  participant V as validator-service\n  participant EB as EventBridge\n  participant OP as order-processor (SFN)\n  participant OM as order-manager (SFN + API)\n  participant B as Barista\n  participant PUB as publisher-service (IoT)\n\n  A->>V: GET /qr-code (admin mostra QR no balcão)\n  C->>V: POST /qr-code (escaneia código + token)\n  alt sem tokens na janela de 5 min\n    V-->>C: 200 \"No tokens remaining\"\n  else código válido\n    V-)EB: Validator.NewOrder\n    EB-)OP: inicia execução\n    alt loja fechada ou 20+ pedidos em andamento\n      OP-)EB: OrderProcessor.ShopUnavailable\n      EB-)PUB: publica no IoT (cliente é avisado)\n    else loja aberta e com vaga\n      OP-)EB: OrderProcessor.WorkflowStarted (aguarda até 5 min)\n      EB-)OM: grava 1º TaskToken no pedido\n      EB-)PUB: publica no IoT\n      C->>OM: PUT /orders/{id} (bebida escolhida)\n      OM->>OM: valida bebida no cardápio (sanitize)\n      OM-->>OP: SendTaskSuccess (1º token)\n      OP->>OP: gera o número do pedido\n      OP-)EB: OrderProcessor.WaitingCompletion (aguarda até 15 min)\n      EB-)OM: grava 2º TaskToken + número do pedido\n      EB-)PUB: publica no IoT\n      B->>OM: PUT /orders/{id}?action=make (assume)\n      OM-)EB: OrderManager.MakeOrder\n      EB-)PUB: publica no IoT\n      B->>OM: PUT /orders/{id}?action=complete (ou cancel)\n      OM-)EB: OrderManager.Order{eventId}-COMPLETED (ou CANCELLED)\n      OM-->>OP: SendTaskSuccess (2º token)\n      OP-)EB: OrderProcessor.orderFinished\n      EB-)PUB: publica no IoT\n    end\n  end\n```\n\nCaminho de erro por timeout (fora do diagrama, para não poluir): se ninguém agir dentro dos 5 min\n(cliente) ou 15 min (barista) de cada pausa, o `order-processor` emite `OrderProcessor.OrderTimeOut`\npor conta própria e encerra o pedido como cancelado — o `order-manager` também consome o evento de timeout para atualizar o pedido.\n\n### Regras e dúvidas\nOs limites e exceções desta perspectiva estão consolidados na [Referência](6-referencia.md#regras-de-negócio); consulte também as [dúvidas](6-referencia.md#dúvidas-e-perguntas).\n\n## Configurar o evento\n\n**Participantes:** `config-service`, `publisher-service`\n\n> **Em resumo:** o admin abre/fecha a loja e ajusta o cardápio direto na tabela de configuração;\n> qualquer mudança se propaga sozinha para quem precisar saber, sem ninguém \"chamando\" ninguém.\n\n### Em linguagem de negócio\n| # | 🟨 Quem | 🟦 Faz | 🟧 Acontece | 🟪 Regra ou reação |\n|---|---|---|---|---|\n| 1 | Admin | Abre ou fecha a loja / muda o cardápio | Configuração alterada | Toda mudança na tabela de config dispara aviso para os apps |\n\n### Quem orquestra\nNinguém: é coreografia pura. A mudança acontece direto no DynamoDB (via API Gateway sem lambda no\nmeio), o DynamoDB Streams dispara `configChanged.js`, que publica `ConfigService.ConfigChanged` no\nbus, e o `publisher-service` encaminha para o tópico IoT `serverlesspresso-config-{eventId}`. Não\nhá um serviço \"dono\" desse fluxo de ponta a ponta.\n\n### Passo a passo técnico\n```mermaid\nsequenceDiagram\n  participant A as Admin\n  participant CFG as config-service\n  participant DDB as ConfigTable (Streams)\n  participant EB as EventBridge\n  participant PUB as publisher-service\n\n  A->>CFG: PUT /store (abre/fecha) ou edição direta do cardápio\n  CFG->>DDB: UpdateItem\n  DDB-)CFG: Stream (NewImage)\n  CFG-)EB: ConfigService.ConfigChanged\n  EB-)PUB: publica no tópico IoT de config\n```\n\n### Regras e dúvidas\nOs limites e exceções desta perspectiva estão consolidados na [Referência](6-referencia.md#regras-de-negócio); consulte também as [dúvidas](6-referencia.md#dúvidas-e-perguntas).\n\n**Fontes:** `backends/4-order-processing/statemachine/op.asl.json`,\n`backends/5-order-manager/statemachine/om.asl.json`, `backends/9-validator/code/*.js`,\n`backends/5-order-manager/functions/*/app.js`, `backends/2-config-service/code/configChanged.js`,\n`backends/2-config-service/RestAPIs/api.yaml`, `01-appCore/template.yaml`,\n`01-appCore/initDB/initMenuState.JSON`. Ver também [3-servicos.md](./3-servicos.md).\n", "secoes": [{"titulo": "Pedir um café", "slug": "pedir-um-café", "subs": [{"titulo": "Em linguagem de negócio", "slug": "pedir-um-café--em-linguagem-de-negócio"}, {"titulo": "Quem orquestra", "slug": "pedir-um-café--quem-orquestra"}, {"titulo": "Passo a passo técnico", "slug": "pedir-um-café--passo-a-passo-técnico"}, {"titulo": "Regras e dúvidas", "slug": "pedir-um-café--regras-e-dúvidas"}]}, {"titulo": "Configurar o evento", "slug": "configurar-o-evento", "subs": [{"titulo": "Em linguagem de negócio", "slug": "configurar-o-evento--em-linguagem-de-negócio"}, {"titulo": "Quem orquestra", "slug": "configurar-o-evento--quem-orquestra"}, {"titulo": "Passo a passo técnico", "slug": "configurar-o-evento--passo-a-passo-técnico"}, {"titulo": "Regras e dúvidas", "slug": "configurar-o-evento--regras-e-dúvidas"}]}]}, {"arquivo": "5-infraestrutura.md", "nome": "Infraestrutura", "resumo": "tudo roda em `us-east-1` só como AWS SAM/CloudFormation, sem Kubernetes nem contêineres: Lambda (Node.js 14.x quase toda), três máquinas de estado do Step Functions (pedido, ações e recibo), um event bus próprio do EventBridge, cinco tabelas DynamoDB, uma API Gateway REST por serviço, Cognito com fluxo de login por SMS e AWS IoT Core para tempo real. Não há ambientes dev/homologação distintos: o próprio template é reimplantado em qualquer conta/região que o operador escolher.", "texto": "# Infraestrutura: Serverlesspresso\n\n> **Em resumo:** tudo roda em `us-east-1` só como AWS SAM/CloudFormation, sem Kubernetes nem\n> contêineres: Lambda (Node.js 14.x quase toda), três máquinas de estado do Step Functions (pedido, ações e recibo), um\n> event bus próprio do EventBridge, cinco tabelas DynamoDB, uma API Gateway REST por serviço,\n> Cognito com fluxo de login por SMS e AWS IoT Core para tempo real. Não há ambientes\n> dev/homologação distintos: o próprio template é reimplantado em qualquer conta/região que o\n> operador escolher.\n\n## Nesta página\n\n| Seção |\n|---|\n| [Ambientes](#ambientes) |\n| [Recursos](#recursos) |\n| [Implantação](#implantação) |\n\n## Ambientes\n\nNão há pastas nem parâmetros de ambiente (`dev`/`staging`/`prod`). O README raiz instrui implantar\ntudo manualmente com `sam deploy --guided` em `us-east-1`, escolhendo nomes de stack únicos por\nconta. Cada \"evento\" (pop-up) é isolado por dado (`eventId`, ex. `ABC`), não por stack ou conta.\n*(a confirmar: se times usam contas separadas por ambiente, não há evidência no repositório.)*\n\n## Recursos\n\n### Stack `00-baseCore` (`00-baseCore/template.yaml`)\n| Recurso | Tipo | Tecnologia | Quem usa | Definido em |\n|---|---|---|---|---|\n| `ServerlesspressoEventBus` | EventBridge custom bus (`Serverlesspresso`) | EventBridge | Todos os serviços | `00-baseCore/template.yaml` |\n| `LogsRule` + `LogGroupForEvents` | Regra + log group | CloudWatch Logs | Auditoria de todos os eventos do bus | `00-baseCore/template.yaml` |\n| `UserPool` / `UserPoolClient` / `IdentityPool` | Cognito User Pool + Identity Pool | Cognito | Login do cliente e do barista por número de telefone | `00-baseCore/template.yaml` |\n| `DefineAuthChallenge`, `CreateAuthChallenge`, `VerifyAuthChallengeResponse`, `PreSignUp` | Lambda (gatilhos do Cognito) | Node.js 14.x | Fluxo de login customizado por SMS/OTP | `00-baseCore/cognito-triggers/*.js` |\n| `ServerlesspressoRealtime` + `IotEndpoint` | AWS IoT Thing + endpoint | IoT Core | Canal MQTT em tempo real para os apps | `00-baseCore/template.yaml` |\n| `GetIoTEndpointFunction` | Lambda (custom resource) | Node.js 14.x | Descobre o endpoint IoT no deploy | `00-baseCore/GetIoTEndpoint.js` |\n\n### Stack `01-appCore` (`01-appCore/template.yaml`) — a maior parte da aplicação\n| Recurso | Tipo | Tecnologia | Quem usa | Definido em |\n|---|---|---|---|---|\n| `ConfigTable` | DynamoDB (Streams ligado) | DynamoDB | config-service, order-processor, order-manager | `01-appCore/template.yaml` |\n| `CountingTable` (`serverlesspresso-counting-table`) | DynamoDB | DynamoDB | order-processor (gera número do pedido) | `01-appCore/template.yaml` |\n| `ValidatorTable` (`serverlesspresso-validator`) | DynamoDB (Streams ligado, não consumido) | DynamoDB | validator-service | `01-appCore/template.yaml` |\n| `OrderTable` (`serverlesspresso-order-table`, 1 LSI + 2 GSI) | DynamoDB (Streams ligado) | DynamoDB | order-manager, order-processor, order-journey | `01-appCore/template.yaml` |\n| `OrderJourneyEventsTable` | DynamoDB (Streams ligado, não consumido) | DynamoDB | order-journey-service | `01-appCore/template.yaml` |\n| `JourneyBucket` + `JourneyCloudFront` + `OriginAccessIdentity` | S3 + CloudFront | S3, CloudFront | Recibo HTML do pedido | `01-appCore/template.yaml` |\n| `OrderProcessorStateMachine` | Step Functions (Standard) | ASL | Orquestra o ciclo de vida do pedido | `backends/4-order-processing/statemachine/op.asl.json` |\n| `OrderManagerStateMachine` | Step Functions (Standard) | ASL | Ações do cliente e do barista sobre um pedido | `backends/5-order-manager/statemachine/om.asl.json` |\n| `OrderJourneyService` | Step Functions (Standard) | ASL | Grava trilha de eventos e gera o recibo | `backends/8-order-journey/statemachine/StepFunction.asl.json` |\n| `RESTApiValidatorService`, `RESTApiForOrderManager`, `RESTApiConfigService` | API Gateway REST (Cognito authorizer) | API Gateway | Frontends cliente/barista/admin | `01-appCore/template.yaml` |\n| `GetQRcodeFunction`, `VerifyQRcodeFunction` | Lambda | Node.js 14.x | validator-service | `backends/9-validator/code/*.js` |\n| `ConfigChangedFunction` | Lambda (gatilho: DynamoDB Streams da `ConfigTable`) | Node.js 14.x | config-service | `backends/2-config-service/code/configChanged.js` |\n| `SanitizeOrderLambda`, `WorkFlowStarted`, `OrderTimedOut`, `WaitingCompletion` | Lambda | Node.js 14.x | order-manager | `backends/5-order-manager/functions/*/app.js` |\n| `PublisherFunctionAdmin`, `PublisherFunctionUser`, `PublisherFunctionConfig` | Lambda (gatilho: EventBridge) | Node.js 14.x | publisher-service → IoT Core | `backends/6-publisher-service/code/*.js` |\n| `GenerateHtml` | Lambda | Node.js 14.x | order-journey-service | `backends/8-order-journey/functions/GenerateHtml/app.js` |\n| `FillDatabasesCustomResource` | Lambda (custom resource, roda 1x no deploy) | Node.js 14.x | Semeia `ConfigTable` e `CountingTable` | `01-appCore/initDB/app.js` |\n\n### Stack `7-metrics-service` (`backends/7-metrics-service/template.yaml`) — implantada à parte\n| Recurso | Tipo | Tecnologia | Quem usa | Definido em |\n|---|---|---|---|---|\n| `ValidatorNewOrderFunction`, `OrderManagerOrderCancelledFunction`, `OrderProcessorOrderTimeOutFunction`, `OrderManagerWaitingCompletionFunction` | Lambda (gatilho: EventBridge) | Node.js 14.x, CloudWatch PutMetric | metrics-service | `backends/7-metrics-service/code/*.js` |\n\n### Extensões (stacks independentes, opcionais)\n| Recurso | Tipo | Tecnologia | Quem usa | Definido em |\n|---|---|---|---|---|\n| `player.asl.json` | Step Functions | ASL | EventPlayer (simula 15 min de eventos reais) | `extensions/EventPlayer/statemachines/player.asl.json` |\n| `orderBot.asl.json`, `baristaBot.asl.json` | Step Functions | ASL | OrderRobotExtension (simula clientes e baristas) | `extensions/OrderRobotExtension/statemachines/*.asl.json` |\n| SQS + DynamoDB + Lambda (`publishMetric`) | SQS, DynamoDB, Lambda | Node.js | PersistOrderMetricsToDynamoDB (histórico de métricas) | `extensions/PersistOrderMetricsToDynamoDB/template.yaml` |\n| Step Functions + DynamoDB + Lambda (`average`) | CDK stack | TypeScript, CDK | WaitTimes (tempo médio de espera por bebida) | `extensions/WaitTimes/lib/wait_times_stack.ts` |\n\n### Fora do repositório\n| Recurso | Observação |\n|---|---|\n| 3 aplicações frontend (cliente, barista, admin) | Citadas no README raiz como \"not included\"; consomem as APIs REST e o tópico IoT 🩷 |\n\n### Código encontrado mas não implantado *(a confirmar)*\n| Local | Observação |\n|---|---|\n| `backends/1-counting-service/code/*.js` | Sem `template.yaml` próprio e não referenciado por nenhum outro; o número do pedido é gerado hoje direto dentro do `OrderProcessorStateMachine` |\n| `backends/4-order-processing/functions/capacity/isCapacityAvailable.js` e `functions/resumeWF/app.js` | Não aparecem em nenhum `template.yaml` implantado; a checagem de capacidade real está embutida no ASL (`ListExecutions`) |\n| `backends/4-order-processing/api.yaml` (`POST /order` → EventBridge) | Não é incluído por nenhum template da stack principal; não achamos quem a chama |\n\n## Implantação\n\nOrdem de deploy descrita no README raiz: `00-baseCore` primeiro (bus, Cognito, IoT), depois\n`01-appCore` (tudo mais). `7-metrics-service` e as `extensions/*` são stacks separadas e\nopcionais, implantadas independentemente.\n\n```mermaid\nflowchart TB\n  subgraph core[\"00-baseCore\"]\n    Bus[[EventBridge Serverlesspresso]]\n    Cognito[Cognito UserPool + SMS OTP]\n    IoT[IoT Core endpoint]\n  end\n  subgraph app[\"01-appCore\"]\n    APIGW[3x API Gateway REST] --> Lambdas[Lambdas de validator/config/order-manager]\n    Lambdas --> DDB[(5x DynamoDB)]\n    Bus --> OP[Step Functions: Order Processor]\n    Bus --> OJ[Step Functions: Order Journey]\n    OM[Step Functions: Order Manager] --> DDB\n    OJ --> S3[(S3 recibo)] --> CF[CloudFront]\n  end\n  subgraph metrics[\"7-metrics-service (à parte)\"]\n    Bus --> CW[Lambdas → CloudWatch metrics]\n  end\n  subgraph ext[\"extensions/* (à parte)\"]\n    Bus --> EXT[EventPlayer, OrderRobotExtension, WaitTimes, PersistOrderMetricsToDynamoDB]\n  end\n```\n\n**Fontes:** `00-baseCore/template.yaml`, `01-appCore/template.yaml`, `backends/*/template.yaml`,\n`backends/4-order-processing/statemachine/op.asl.json`, `backends/5-order-manager/statemachine/om.asl.json`,\n`backends/8-order-journey/statemachine/StepFunction.asl.json`, `extensions/*/template.yaml`,\nREADME raiz e de cada backend. Trechos marcados *(a confirmar)* são deduzidos por ausência de\nreferência cruzada no código, não por documentação explícita.\n", "secoes": [{"titulo": "Ambientes", "slug": "ambientes", "subs": []}, {"titulo": "Recursos", "slug": "recursos", "subs": [{"titulo": "Stack `00-baseCore` (`00-baseCore/template.yaml`)", "slug": "recursos--stack-00-basecore-00-basecoretemplateyaml"}, {"titulo": "Stack `01-appCore` (`01-appCore/template.yaml`) — a maior parte da aplicação", "slug": "recursos--stack-01-appcore-01-appcoretemplateyaml--a-maior-parte-da-aplicação"}, {"titulo": "Stack `7-metrics-service` (`backends/7-metrics-service/template.yaml`) — implantada à parte", "slug": "recursos--stack-7-metrics-service-backends7-metrics-servicetemplateyaml--implantada-à-parte"}, {"titulo": "Extensões (stacks independentes, opcionais)", "slug": "recursos--extensões-stacks-independentes-opcionais"}, {"titulo": "Fora do repositório", "slug": "recursos--fora-do-repositório"}, {"titulo": "Código encontrado mas não implantado *(a confirmar)*", "slug": "recursos--código-encontrado-mas-não-implantado-a-confirmar"}]}, {"titulo": "Implantação", "slug": "implantação", "subs": []}]}, {"arquivo": "6-referencia.md", "nome": "Referência", "resumo": "glossário, regras, decisões reconstruídas, padrões de código e um guia rápido para rodar o projeto localmente. A seção mais importante para quem for mexer aqui é \"Dúvidas e perguntas\": lista o código órfão encontrado e os conflitos entre a config e o código.", "texto": "# Referência: Serverlesspresso\n\n> **Em resumo:** glossário, regras, decisões reconstruídas, padrões de código e um guia rápido para\n> rodar o projeto localmente. A seção mais importante para quem for mexer aqui é \"Dúvidas e\n> perguntas\": lista o código órfão encontrado e os conflitos entre a config e o código.\n\n## Nesta página\n\n| Seção |\n|---|\n| [Glossário](#glossário) |\n| [Regras de negócio](#regras-de-negócio) |\n| [Decisões](#decisões) |\n| [Padrões](#padrões) |\n| [Como começar](#como-começar) |\n| [Dúvidas e perguntas](#dúvidas-e-perguntas) |\n| [Dúvidas de contexto](#dúvidas-de-contexto) |\n| [Perguntas para decisão](#perguntas-para-decisão) |\n| [Evidências da revisão v3](#evidências-da-revisão-v3) |\n\n## Glossário\n| Termo | Definição |\n|---|---|\n| `eventId` | Identificador de um evento pop-up (ex.: `ABC`); particiona config, tokens e pedidos |\n| Token / QR code | Código de curta duração que libera um pedido; renovado a cada janela de 5 min |\n| `TaskToken` | Ficha emitida pelo Step Functions ao pausar (`waitForTaskToken`); guardada no DynamoDB e usada por outro processo para chamar `SendTaskSuccess` |\n| `orderId` | Identificador único do pedido, gerado (`nanoid`) no momento da validação do QR code |\n| `orderNumber` | Número sequencial exibido ao cliente, gerado só depois que ele envia a bebida |\n| `ORDERSTATE` | Estado do pedido, sempre `{eventId}-{ESTADO}` (`CREATED`, `COMPLETED`, `CANCELLED`) |\n| `drinkOrder` | JSON da bebida escolhida + modificadores, validado contra o cardápio |\n| `baristaUserId` | Identificador do barista que assumiu o pedido (`action=make`) |\n| `robot` | Marca um pedido como gerado por simulação (`OrderRobotExtension`), não por cliente real |\n| Bus `Serverlesspresso` | Event bus custom do EventBridge; todo evento de negócio passa por ele |\n| Barista | Quem prepara e conclui (ou cancela) o pedido |\n| Recibo (Journey) | Página HTML final com a trilha de eventos de um pedido |\n\n## Regras de negócio\n| ID | Regra | Valor atual | Onde está implementada |\n|---|---|---|---|\n| R01 | Pedidos simultâneos | máx. 20 | `backends/4-order-processing/statemachine/op.asl.json` (`Is capacity available?`) |\n| R02 | Tokens (QR) por janela | 10 a cada 5 min, por evento | `01-appCore/initDB/initMenuState.JSON` (`drinksPerBarcode`), `backends/9-validator/code/getCode.js` |\n| R03 | Tempo para o cliente enviar a bebida | 5 min | `op.asl.json` (`HeartbeatSeconds: 300`) |\n| R04 | Tempo para o barista concluir | 15 min | `op.asl.json` (`HeartbeatSeconds: 900`) |\n| R05 | Pedidos por cliente | 1 (`maxOrdersPerUser`) | `01-appCore/initDB/initMenuState.JSON` — *(a confirmar: não achamos onde é checado em runtime)* |\n\n## Decisões\nNenhum ADR foi encontrado no repositório (`docs/` só tem um template de Pull Request). As três\ndecisões abaixo foram **reconstruídas a partir do código**, não de um documento de decisão real:\n\n| # | Contexto | Escolha | Consequência |\n|---|---|---|---|\n| 1 | Um pedido precisa esperar minutos por ações humanas (cliente escolher bebida, barista concluir) sem manter função alguma \"viva\" | Duas máquinas de Step Functions: uma pausa com `waitForTaskToken`, a outra recebe a ação via API e resume a primeira com `SendTaskSuccess`, usando o DynamoDB como elo | Acoplamento indireto entre as duas máquinas via a linha do pedido; se o token for perdido ou sobrescrito, o pedido só termina no timeout |\n| 2 | Três frontends (cliente, barista, admin) precisam de atualização em tempo real sem polling | AWS IoT Core (MQTT), alimentado por lambdas \"publisher\" que escutam o bus por prefixo de `detail-type` | Acoplamento por convenção de nome: um evento novo só chega ao frontend se algum publisher já escutar aquele prefixo |\n| 3 | Cada evento pop-up precisa de config própria (cardápio, limites, aberto/fechado) | Uma única tabela indexada por `config-{eventId}`, alterada via API e propagada por DynamoDB Streams | Todo serviço que precisa do cardápio lê a mesma tabela direto, em vez de manter cópia local por evento |\n\n## Padrões\n- **IaC:** AWS SAM (`template.yaml`) em quase todos os serviços; um deles (`extensions/WaitTimes`)\n  usa AWS CDK em TypeScript — única exceção no repositório.\n- **Runtime:** Node.js 14.x em praticamente todos os lambdas (handlers `exports.handler`, SDK v2\n  `aws-sdk`).\n- **Orquestração:** Amazon States Language (`*.asl.json`) versionado separado do `template.yaml`,\n  injetado via `DefinitionSubstitutions`.\n- **Testes:** cada serviço tem um `localTest.js`/`testharness.js` ad-hoc para rodar o handler local\n  com um evento de exemplo; os READMEs mencionam Mocha em `functions/*/tests`, mas poucos arquivos\n  de teste formais foram encontrados *(a confirmar)* — não há pipeline de CI configurado (`.github`\n  só tem templates de Issue/PR).\n- **Nomeação de eventos:** `{Serviço}.{Acontecimento}` (ex.: `Validator.NewOrder`,\n  `OrderProcessor.WorkflowStarted`); o order-manager foge um pouco do padrão e embute o `eventId`\n  no meio (`OrderManager.Order{eventId}-COMPLETED`).\n\n## Como começar\n1. **Deploy:** `00-baseCore` primeiro (`sam build && sam deploy --guided`, stack\n   `serverlesspresso-core`, região `us-east-1`), depois `01-appCore` (stack `serverlesspresso`).\n   `7-metrics-service` e cada pasta em `extensions/` são opcionais e implantados à parte.\n2. **Testar localmente:** entrar na pasta do lambda e rodar `node localTest.js` (ou\n   `testharness.js`), ou `npm test` onde houver `package.json` com Mocha.\n3. **Onde fica cada coisa:** `backends/<n>-<nome>/` por serviço; `functions/`/`code/` = lambdas,\n   `statemachine/` = ASL, `RestAPIs/api.yaml` ou `api.yaml` = contrato REST.\n4. **As 3 mudanças mais comuns:**\n   - Mudar o cardápio ou limites de um evento → editar a linha `config-{eventId}` na `ConfigTable`\n     (não há endpoint de escrita para o cardápio, só para `storeOpen`).\n   - Mudar o limite de pedidos simultâneos → editar o número `20` fixo em\n     `backends/4-order-processing/statemachine/op.asl.json` (não é parâmetro).\n   - Adicionar um novo consumidor de eventos → seguir o modelo em `extensions/_extension-model/`\n     (regra de EventBridge nova, sem tocar no core).\n5. **Publicar:** `sam deploy` (guiado ou com `samconfig.toml` salvo); limpeza via\n   `aws cloudformation delete-stack --stack-name <nome>`.\n\n## Dúvidas e perguntas\n\n**Conflitos entre fontes:**\n- 🟥 `maxOrdersInQueue: 10` (na config do evento) vs. limite real de `20` pedidos simultâneos, fixo\n  no ASL do order-processor — os dois existem, nenhum lê o outro.\n\n**Segredos:** nenhuma chave, token ou senha em texto claro foi encontrada nos arquivos lidos\n(buscado por padrões comuns de chave AWS, senha e chave privada). Nada a reportar aqui.\n\n**Código encontrado mas aparentemente não implantado** *(ver também [5-infraestrutura.md](./5-infraestrutura.md#código-encontrado-mas-não-implantado-a-confirmar)):*\n- `backends/1-counting-service/` (`getOrderId.js`, `resetOrderId.js`) — sem `template.yaml`, sem\n  referência cruzada; duplica o que o order-processor já faz inline.\n- `backends/4-order-processing/functions/capacity/isCapacityAvailable.js` e `functions/resumeWF/app.js`\n  — não aparecem em nenhum template implantado.\n- `backends/4-order-processing/api.yaml` (`POST /order` → EventBridge) — não é incluído por\n  nenhuma stack encontrada; não identificamos quem o chamaria.\n\nAs questões por papel estão reunidas em [Perguntas para decisão](#perguntas-para-decisão).\n\n**Fontes:** leitura direta de todo o código citado nas seções anteriores; ausência de\n`CODEOWNERS`, `docs/adr`, ou pipeline de CI verificada por busca no repositório.\n\n## Dúvidas de contexto\n\nO cancelamento manual não registra motivo estruturado; o timeout possui causa. Confirmar se a operação precisa distinguir desistência, erro e falta de insumo. Fonte: eventos em `backends/5-order-manager/`.\n\nA API altera `storeOpen`; não foi encontrada rota para editar `menu`. Confirmar o procedimento operacional de edição direta na `ConfigTable`. Fontes: `backends/2-config-service/`, `01-appCore/initDB/initMenuState.JSON`. Conflito de capacidade, cobrança e código inativo estão registrados acima e em Q01/Q05/Q06/Q07.\n\n## Perguntas para decisão\n\n| ID | Papel | Pergunta |\n|---|---|---|\n| Q01 | PM | Existe plano de cobrança/pagamento? Hoje não há nenhum passo de pagamento no domínio. |\n| Q02 | PM | Quais são os indicadores de sucesso de um evento (KPIs)? Não encontramos nada documentado além do que a extensão `WaitTimes` calcula. |\n| Q03 | PM | `maxOrdersPerUser = 1` é uma regra real hoje ou só um valor de config sem efeito? |\n| Q04 | Arquiteto | Por que duas máquinas de Step Functions em vez de uma? O acoplamento via `TaskToken` no DynamoDB foi uma escolha deliberada ou uma consequência de como o workshop foi montado em módulos? |\n| Q05 | Arquiteto | Vale a pena mover o limite de capacidade (hoje fixo em `20` no ASL) para a tabela de config, já que ela já tem um campo parecido (`maxOrdersInQueue`) sem uso? |\n| Q06 | Tech lead | `1-counting-service` e os dois lambdas órfãos de `4-order-processing/functions` podem ser removidos, ou há algum plano de reativá-los? |\n| Q07 | Tech lead | O endpoint `POST /order` em `backends/4-order-processing/api.yaml` é usado por algum dos 3 frontends externos (não incluídos neste repositório)? |\n| Q08 | Tech lead | Existe algum alarme/DLQ para quando `publisher-service` falha ao publicar no IoT (hoje só loga e segue)? |\n\n## Evidências da revisão v3\n\n`01-appCore/template.yaml:143,197,317,497,648` declara cinco tabelas; `:67,759,791` declara três máquinas (duas do pedido e uma do recibo). `backends/9-validator/code/getCode.js:11–28` restringe GET /qr-code ao grupo admin.\n\nCaminhos relativos à fixture local do domínio; snapshots e hashes em `verificacao.json` da iteração. As aplicações não foram executadas.\n", "secoes": [{"titulo": "Glossário", "slug": "glossário", "subs": []}, {"titulo": "Regras de negócio", "slug": "regras-de-negócio", "subs": []}, {"titulo": "Decisões", "slug": "decisões", "subs": []}, {"titulo": "Padrões", "slug": "padrões", "subs": []}, {"titulo": "Como começar", "slug": "como-começar", "subs": []}, {"titulo": "Dúvidas e perguntas", "slug": "dúvidas-e-perguntas", "subs": []}, {"titulo": "Dúvidas de contexto", "slug": "dúvidas-de-contexto", "subs": []}, {"titulo": "Perguntas para decisão", "slug": "perguntas-para-decisão", "subs": []}, {"titulo": "Evidências da revisão v3", "slug": "evidências-da-revisão-v3", "subs": []}]}], "mapa": "flowchart LR\n    n_00_baseCore[\"00-baseCore (ativo)\"]\n    n_validator_service[\"validator-service (ativo)\"]\n    n_config_service[\"config-service (ativo)\"]\n    n_order_processor[\"order-processor (ativo)\"]\n    n_order_manager[\"order-manager m Q05](6-referencia.md#perguntas-para-decisão)\n- **Tech lead:** `1-counting-service` e os dois lambdas órfãos de `4-order-processing/functions` podem ser removidos, ou há algum plano de reativá-los? [Origem Q06](6-referencia.md#perguntas-para-decisão)\n- **Tech lead:** O endpoint `POST /order` em `backends/4-order-processing/api.yaml` é usado por algum dos 3 frontends externos (não incluídos neste repositório)? [Origem Q07](6-referencia.md#perguntas-para-decisão)\n- **Tech lead:** Existe algum alarme/DLQ para quando `publisher-service` falha ao publicar no IoT (hoje só loga e segue)? [Origem Q08](6-referencia.md#perguntas-para-decisão)\n\n[Resumos explicativos](llm/resumos.md) · [Grafo tipado](llm/grafo.json)\n"};

function parede(table){
  const ths = [...table.querySelectorAll('th')].map(t => t.textContent);
  if (!ths.some(t => t.includes('🟧'))) return;
  const idx = k => ths.findIndex(t => t.includes(k));
  const cols = {ator: idx('🟨'), cmd: idx('🟦'), evt: idx('🟧'), pol: idx('🟪')};
  const w = document.createElement('div'); w.className = 'wall';
  [...table.querySelectorAll('tbody tr')].forEach((tr, i) => {
    const td = [...tr.children].map(c => c.innerHTML);
    let h = `<div class="step"><div class="num">${i+1}</div>`;
    for (const [k, j] of Object.entries(cols)) if (j >= 0 && td[j] && td[j].replace(/<[^>]+>/g,'').trim() && td[j].trim() !== '—') h += `<div class="note ${k}">${td[j]}</div>`;
    w.innerHTML += h + '</div>';
  });
  const leg = document.createElement('div'); leg.className = 'legend';
  leg.innerHTML = '<span style="--c:#FFE9A8">Quem</span><span style="--c:#B9D3FF">Faz</span><span style="--c:#FFB36B">Acontece</span><span style="--c:#DCC4F7">Regra ou reação</span>';
  table.replaceWith(leg); leg.after(w);
}
async function mostrar(arq, ancora, forcar){
  const doc = document.getElementById('doc');
  if (arq !== atual || forcar) {
    atual = arq;
    if (arq === '_ia') {
      doc.innerHTML = `<h1>Para IA</h1><blockquote><p>O que um agente lê primeiro: ~${Math.round(D.cartao.length/4)} tokens. Resumos completos em <code>llm/resumos.md</code>; ligações em <code>llm/grafo.json</code>.</p></blockquote><div class="card"><pre>${esc(D.cartao)}</pre></div>`;
    } else {
      const p = D.paginas.find(x => x.arquivo === arq);
      doc.innerHTML = marked.parse(p.texto.replace(/^## Nesta p[áa]gina[\s\S]*?(?=^## )/m, ''));
      let parent = ''; const used = new Map(); const githubCounts = new Map(); p.aliases = {};
      doc.querySelectorAll('h1, h2, h3').forEach(h => {
        let id = slug(h.textContent); const plain = id; const seen = githubCounts.get(plain) || 0; githubCounts.set(plain, seen + 1); const nativeAnchor = plain + (seen ? '-' + seen : '');
        if (h.tagName === 'H2') parent = id;
        if (h.tagName === 'H3') id = parent + '--' + id;
        const count = used.get(id) || 0; used.set(id, count + 1);
        if (count) id += '-' + count;
        p.aliases[nativeAnchor] = id; h.dataset.anchor = id; h.id = arq.replace('.md','') + '--' + id;
      });
      doc.querySelectorAll('a[href]').forEach(a => {
        const raw = a.getAttribute('href');
        const [file, anchor] = raw.split('#');
        const target = file.replace(/^\.\//,'');
        if ((!file && anchor) || D.paginas.some(x => x.arquivo === target)) {
          const dest = file ? target : arq;
          a.href = '#' + encodeURIComponent(dest) + (anchor ? '#' + anchor : '');
          a.onclick = e => { e.preventDefault(); mostrar(dest, anchor ? decodeURIComponent(anchor) : null); };
        } else if (!/^(?:[a-z]+:|\/)/i.test(raw)) a.setAttribute('href', '../' + raw);
      });
      doc.querySelectorAll('table').forEach(parede);
      doc.querySelectorAll('table').forEach(table => { const wrapper = document.createElement('div'); wrapper.className = 'table-scroll'; table.replaceWith(wrapper); wrapper.append(table); });
      if (arq === '2-arquitetura.md' && D.mapa) {
        const walker = document.createTreeWalker(doc, NodeFilter.SHOW_COMMENT);
        let marker; while (marker = walker.nextNode()) {
          if (marker.textContent.trim() !== 'MAPA-PRINCIPAL') continue;
          const box = document.createElement('div'); box.className = 'mapa-principal';
          box.innerHTML = '<p class="gen">Mapa de dependências gerado das relações declaradas em Serviços; estados preservados.</p><div class="mermaid"></div>';
          box.querySelector('.mermaid').textContent = D.mapa; marker.replaceWith(box); break;
        }
      }
      doc.querySelectorAll('pre > code.language-mermaid').forEach(c => { const d = document.createElement('div'); d.className = 'mermaid'; d.textContent = c.textContent; c.parentElement.replaceWith(d); });
      try { await mermaid.run({nodes: doc.querySelectorAll('.mermaid')}); } catch(e){ console.warn(e); }
      observar();
    }
  }
  document.querySelectorAll('details.pag').forEach(d => d.open = d.dataset.p === arq || (d.open && !!document.getElementById('q').value));
  if (ancora) { const p = D.paginas.find(x => x.arquivo === arq); ancora = (p && p.aliases && p.aliases[ancora]) || ancora; const el = document.getElementById(arq.replace('.md','') + '--' + ancora); if (el) el.scrollIntoView(); } else window.scrollTo(0, 0);
  marcar(arq, ancora);
}
function marcar(arq, ancora){
  document.querySelectorAll('#arvore a.no').forEach(a => a.classList.remove('ativo'));
  const sel = ancora ? `#arvore a.no[data-p="${arq}"][data-a="${ancora}"]` : `#arvore details.pag[data-p="${arq}"] > summary a.no`;
  const a = document.querySelector(sel); if (!a) return;
  a.classList.add('ativo');
  let d = a.closest('details'); while (d) { d.open = true; d = d.parentElement.closest('details'); }
  const pg = D.paginas.find(x => x.arquivo === arq);
  const partes = [pg ? pg.nome : 'Para IA'];
  if (ancora && a.dataset.pai) { const pai = document.querySelector(`#arvore a.no[data-p="${arq}"][data-a="${a.dataset.pai}"]`); if (pai) partes.push(pai.textContent.trim()); }
  if (ancora) partes.push(a.textContent.trim());
  document.getElementById('trilha').textContent = partes.join('  ›  ');
}

}

};
