const F = {"00-visao-geral-dominio.md": "# Domínio: Clínica Veterinária (Spring PetClinic Microservices)\n\n> Fonte analisada: `spring-petclinic-microservices` (repositório local, somente leitura).\n> Este documento é o índice do \"repo do domínio\" — reúne capacidades de negócio, contratos de API e modelo de dados de cada serviço que compõe o domínio \"Clínica Veterinária\".\n\n## 1. O que é o domínio\n\nO sistema implementa a operação de uma clínica veterinária: cadastro de tutores (owners) e seus animais (pets), agenda de visitas/consultas, cadastro de veterinários com especialidades, e um assistente conversacional (GenAI) que apoia a equipe da clínica a consultar e alimentar esses dados em linguagem natural.\n\nÉ uma decomposição em microsserviços do clássico Spring PetClinic, usando Spring Cloud (Config Server, Eureka Discovery, Gateway, Circuit Breaker) e Spring AI.\n\n## 2. Mapa de serviços\n\n| Serviço | Papel no domínio | Porta padrão | Tipo |\n|---|---|---|---|\n| `spring-petclinic-customers-service` | Sistema de registro de Tutores (Owners), Pets e Tipos de Pet | 8081 | Negócio (core) |\n| `spring-petclinic-vets-service` | Sistema de registro de Veterinários e Especialidades | 8083 | Negócio (core) |\n| `spring-petclinic-visits-service` | Sistema de registro de Visitas/Consultas de um Pet | 8082 | Negócio (core) |\n| `spring-petclinic-genai-service` | Assistente conversacional (chat) sobre o domínio, com ferramentas (tools) que chamam customers-service e um vector store de veterinários | 8084 | Negócio (suporte / IA) |\n| `spring-petclinic-api-gateway` | Front-end (UI AngularJS) + BFF/API Gateway que agrega Owner + Pets + Visits para a tela do tutor, e roteia `/api/**` para os serviços | 8080 | Infraestrutura / Experiência |\n| `spring-petclinic-discovery-server` | Service Registry (Eureka) | 8761 | Infraestrutura |\n| `spring-petclinic-config-server` | Configuração centralizada (Spring Cloud Config) | 8888 | Infraestrutura |\n| `spring-petclinic-admin-server` | Observabilidade/administração (Spring Boot Admin) | 9090 | Infraestrutura |\n\nServiços auxiliares fora do código Java: Zipkin (tracing, porta 9411), Prometheus (9091) e Grafana (3030) — definidos em `docker-compose.yml` e `docker/`.\n\n## 3. Como o domínio se conecta (visão de integração)\n\n```mermaid\nflowchart LR\n    subgraph Cliente\n        UI[AngularJS UI]\n    end\n\n    UI -->|HTTP /api/*| GW[api-gateway]\n\n    GW -->|Path=/api/customer/** StripPrefix=2| CUST[customers-service]\n    GW -->|Path=/api/vet/** StripPrefix=2| VET[vets-service]\n    GW -->|Path=/api/visit/** StripPrefix=2| VIS[visits-service]\n    GW -->|Path=/api/genai/** StripPrefix=2 + CircuitBreaker| GENAI[genai-service]\n\n    GW -->|GET /api/gateway/owners/{id}\\n(WebClient lb://customers-service)| CUST\n    GW -->|GET /api/gateway/owners/{id}\\n(WebClient lb://visits-service, com Circuit Breaker)| VIS\n\n    GENAI -->|RestClient via Eureka DiscoveryClient\\nGET/POST /owners...| CUST\n    GENAI -->|WebClient no startup\\nGET /vets| VET\n    GENAI -.->|vector store (RAG)\\nSimpleVectorStore / vectorstore.json| GENAI\n\n    CUST -.->|referencia lógica pet_id, sem FK física| VIS\n\n    CUST --- DISC[discovery-server / Eureka]\n    VET --- DISC\n    VIS --- DISC\n    GENAI --- DISC\n    GW --- DISC\n\n    CUST --- CFG[config-server]\n    VET --- CFG\n    VIS --- CFG\n    GENAI --- CFG\n    GW --- CFG\n    DISC --- CFG\n\n    ADM[admin-server] -.->|monitora via Eureka| DISC\n```\n\nPontos-chave da integração:\n- Toda comunicação síncrona de negócio entre serviços é feita via HTTP REST, resolvendo o host lógico pelo nome registrado no Eureka (`lb://customers-service`, `http://vets-service/`, `discoveryClient.getInstances(\"customers-service\")`).\n- Não há mensageria/eventos assíncronos no código analisado — toda integração é request/response síncrona (WebClient reativo no gateway, RestClient bloqueante no genai-service).\n- `visits-service` guarda apenas `pet_id` (inteiro), sem chave estrangeira física para a tabela `pets` de `customers-service` — o vínculo Pet↔Visita é uma referência lógica entre bancos de dados distintos (consistência eventual/acoplamento fraco de dados, e não de schema).\n- O `api-gateway` é o único serviço que agrega dados de dois serviços de negócio (customers + visits) numa única resposta (`GET /api/gateway/owners/{ownerId}`), com Circuit Breaker para tolerar falha do visits-service (retorna lista de visitas vazia).\n- O `genai-service` só integra com `customers-service` (leitura/escrita de Owners e Pets) e com `vets-service` (somente leitura, e apenas uma vez no startup para popular o vector store). Ele não conversa diretamente com `visits-service`.\n\n## 4. Documentos deste repositório de domínio\n\n- Capacidades de negócio: `01-capacidades-negocio.md`\n- Contratos de API por serviço:\n  - `02-contrato-api-customers-service.md`\n  - `02-contrato-api-vets-service.md`\n  - `02-contrato-api-visits-service.md`\n  - `02-contrato-api-genai-service.md`\n  - `02-contrato-api-gateway.md`\n- Modelo de dados por serviço:\n  - `03-modelo-dados-customers-service.md`\n  - `03-modelo-dados-vets-service.md`\n  - `03-modelo-dados-visits-service.md`\n  - `03-modelo-dados-genai-service.md`\n- Serviços de infraestrutura de suporte: `04-servicos-infraestrutura.md`\n- Glossário do domínio: `05-glossario.md`\n\n## 5. Stack técnica observada\n\n- Java 17, Spring Boot `4.0.1` (spring-boot-starter-parent), Spring Cloud `2025.1.0`.\n- Persistência: Spring Data JPA + HSQLDB (perfil de desenvolvimento/testes, `db/hsqldb`) ou MySQL (perfil `mysql`, `db/mysql`), scripts `schema.sql`/`data.sql` por serviço.\n- Comunicação: Spring Cloud Gateway (WebFlux reativo) no api-gateway; Spring Web MVC (bloqueante) em customers/vets/visits-service.\n- Resiliência: Spring Cloud Circuit Breaker (Resilience4j) no api-gateway e nas rotas do gateway para `genai-service`.\n- Observabilidade: Micrometer + `@Timed`, Spring Boot Admin, Prometheus, Grafana, Zipkin.\n- IA: Spring AI (`ChatClient`, tools/function-calling, `SimpleVectorStore` para RAG sobre dados de veterinários), com suporte a OpenAI e Azure OpenAI como provedores de modelo.\n", "01-capacidades-negocio.md": "# Capacidades de Negócio — Domínio Clínica Veterinária\n\n> Levantado a partir dos controllers REST, modelos JPA e regras de validação encontrados no código de cada serviço. Cada capacidade lista o serviço \"dono\" dos dados/regra e a evidência no código.\n\n## Mapa de capacidades\n\n```mermaid\nflowchart TB\n    subgraph \"Gestão de Tutores e Pets\"\n        C1[Cadastrar tutor]\n        C2[Consultar tutor]\n        C3[Listar tutores]\n        C4[Atualizar dados do tutor]\n        C5[Cadastrar pet de um tutor]\n        C6[Atualizar dados do pet]\n        C7[Consultar detalhes de um pet]\n        C8[Listar tipos de pet suportados]\n    end\n\n    subgraph \"Gestão de Corpo Clínico\"\n        V1[Listar veterinários e suas especialidades]\n    end\n\n    subgraph \"Gestão de Visitas\"\n        S1[Registrar visita de um pet]\n        S2[Consultar visitas de um pet]\n        S3[Consultar visitas de múltiplos pets em lote]\n    end\n\n    subgraph \"Atendimento Assistido por IA\"\n        G1[Responder perguntas em linguagem natural sobre o domínio]\n        G2[Consultar veterinários por similaridade semântica]\n        G3[Cadastrar tutor via linguagem natural]\n        G4[Cadastrar pet via linguagem natural]\n    end\n\n    subgraph \"Experiência do Tutor (Portal)\"\n        A1[Ver ficha completa do tutor: dados + pets + histórico de visitas]\n    end\n```\n\n## 1. Gestão de Tutores e Pets (`customers-service`)\n\nServiço dono do cadastro mestre de **Owners** (tutores) e **Pets**.\n\n| Capacidade | Descrição de negócio | Evidência (código) |\n|---|---|---|\n| Cadastrar tutor | Cria um novo tutor com nome, endereço, cidade e telefone | `OwnerResource.createOwner` (`POST /owners`) |\n| Consultar tutor | Busca um tutor por ID, incluindo a lista de seus pets | `OwnerResource.findOwner` (`GET /owners/{ownerId}`) |\n| Listar tutores | Lista todos os tutores cadastrados | `OwnerResource.findAll` (`GET /owners`) |\n| Atualizar dados do tutor | Atualiza nome, endereço, cidade e telefone de um tutor existente | `OwnerResource.updateOwner` (`PUT /owners/{ownerId}`) |\n| Cadastrar pet de um tutor | Associa um novo pet (nome, data de nascimento, tipo) a um tutor existente | `PetResource.processCreationForm` (`POST /owners/{ownerId}/pets`) |\n| Atualizar dados do pet | Atualiza nome, data de nascimento e tipo de um pet | `PetResource.processUpdateForm` (`PUT /owners/*/pets/{petId}`) |\n| Consultar detalhes de um pet | Retorna nome, tutor, data de nascimento e tipo de um pet específico | `PetResource.findPet` (`GET owners/*/pets/{petId}`) |\n| Listar tipos de pet suportados | Retorna o catálogo de espécies (cachorro, gato, etc.) usado para classificar pets | `PetResource.getPetTypes` (`GET /petTypes`) |\n\n**Regras de negócio observadas:**\n- Nome, sobrenome, endereço, cidade e telefone do tutor são obrigatórios (`@NotBlank`).\n- Telefone deve ser numérico, com até 12 dígitos (`@Digits(fraction=0, integer=12)`).\n- Um tutor pode ter múltiplos pets (`@OneToMany` `Owner → Pet`), carregados sempre junto (`FetchType.EAGER`) e ordenados por nome.\n- Cada pet pertence a exatamente um tutor e a exatamente um tipo (`PetType`).\n- IDs de tutor e pet devem ser >= 1 (`@Min(1)`) nos endpoints que recebem `ownerId`/`petId` via URL.\n- Buscar um tutor ou pet inexistente resulta em erro de negócio explícito (`ResourceNotFoundException`).\n\n## 2. Gestão de Corpo Clínico (`vets-service`)\n\nServiço dono do cadastro de **Veterinários** e suas **Especialidades**.\n\n| Capacidade | Descrição de negócio | Evidência (código) |\n|---|---|---|\n| Listar veterinários e suas especialidades | Retorna todos os veterinários cadastrados, cada um com a lista ordenada de especialidades (ex.: radiologia, cirurgia, dentística) | `VetResource.showResourcesVetList` (`GET /vets`) |\n\n**Regras de negócio observadas:**\n- Nome e sobrenome do veterinário são obrigatórios (`@NotBlank`).\n- Um veterinário pode ter zero, uma ou várias especialidades (`@ManyToMany` via tabela `vet_specialties`), retornadas ordenadas por nome.\n- A lista de veterinários é cacheada (`@Cacheable(\"vets\")`, cache habilitado apenas no perfil `production`) — é tratada como dado de leitura pesada e de baixa volatilidade, adequado para consulta de IA (RAG) e telas de listagem.\n- Não há endpoint de escrita (criação/edição de veterinário) exposto neste serviço — o cadastro de veterinários é somente leitura pela API pública atual.\n\n## 3. Gestão de Visitas (`visits-service`)\n\nServiço dono do histórico de **Visitas/Consultas** de cada pet.\n\n| Capacidade | Descrição de negócio | Evidência (código) |\n|---|---|---|\n| Registrar visita de um pet | Cria uma nova visita associada a um pet, com data e descrição do atendimento | `VisitResource.create` (`POST owners/*/pets/{petId}/visits`) |\n| Consultar visitas de um pet | Lista o histórico de visitas de um pet específico | `VisitResource.read` (`GET owners/*/pets/{petId}/visits`) |\n| Consultar visitas de múltiplos pets em lote | Retorna as visitas de vários pets de uma vez, dado um conjunto de `petId` — usado para montar a ficha agregada do tutor | `VisitResource.read` (`GET pets/visits?petId=...`) |\n\n**Regras de negócio observadas:**\n- Uma visita sempre pertence a um pet (`pet_id` obrigatório), mas o vínculo é lógico — não há chave estrangeira de banco entre o schema de `visits-service` e o de `customers-service` (são bases de dados separadas por serviço).\n- Data da visita tem valor padrão \"agora\" se não informada (`Date date = new Date()`), mas é normalmente enviada pelo cliente.\n- Descrição da visita é limitada a 8192 caracteres.\n- `petId` na URL deve ser >= 1 (`@Min(1)`).\n\n## 4. Atendimento Assistido por IA (`genai-service`)\n\nCapacidade transversal de negócio: um assistente conversacional que **usa** as capacidades acima como ferramentas (function calling), sem ser dono de dados próprios de owners/pets/vets (exceto o índice vetorial de veterinários usado para busca semântica).\n\n| Capacidade | Descrição de negócio | Evidência (código) |\n|---|---|---|\n| Responder perguntas em linguagem natural sobre o domínio | Ponto único de entrada de chat (`/chatclient`) que interpreta a pergunta do usuário e decide quais ferramentas acionar | `PetclinicChatClient.exchange` |\n| Consultar veterinários por similaridade semântica | Busca vetorial (RAG) sobre um índice de veterinários pré-carregado, com top-K configurável (20 resultados por padrão, 50 se a pergunta não tiver critério) | `PetclinicTools.listVets` + `AIDataProvider.getVets` |\n| Listar tutores via IA | Delega para `customers-service` (`GET /owners`) para responder \"quem são os tutores da clínica\" | `PetclinicTools.listOwners` + `AIDataProvider.getAllOwners` |\n| Cadastrar tutor via linguagem natural | Delega para `customers-service` (`POST /owners`) a criação de um tutor a partir de um pedido em linguagem natural | `PetclinicTools.addOwnerToPetclinic` |\n| Cadastrar pet via linguagem natural | Delega para `customers-service` (`POST /owners/{id}/pets`) a criação de um pet, validando o `petTypeId` contra uma lista fixa (1=gato, 2=cachorro, 3=lagarto, 4=cobra, 5=pássaro, 6=hamster) descrita no prompt da ferramenta | `PetclinicTools.addPetToOwner` |\n\n**Regras de negócio observadas:**\n- O agente é instruído (system prompt) a ser honesto sobre incerteza, manter tom profissional e, para perguntas sobre \"quantos veterinários existem no total\", pedir mais critérios em vez de tentar enumerar todos (proteção contra respostas incompletas de uma busca top-K limitada).\n- O histórico de conversa é mantido para até as últimas mensagens via `ChatMemory` (memória de curto prazo por sessão de chat).\n- O serviço descobre o `customers-service` dinamicamente via Eureka (`DiscoveryClient`), e não por URL fixa — acopla-se à mesma malha de service discovery dos demais serviços de negócio.\n- O índice vetorial de veterinários é carregado uma única vez: na primeira subida, se não existir `vectorstore.json` em classpath, o serviço busca todos os vetos em `vets-service` (`GET /vets`) e gera embeddings; caso exista o arquivo, ele é reaproveitado (economia de custo com o provedor de IA), o que implica que alterações no cadastro de veterinários não se refletem automaticamente na busca por IA sem reindexação manual.\n\n## 5. Experiência do Tutor / Portal (`api-gateway`)\n\nNão é dono de regra de negócio própria, mas materializa a capacidade de **visão 360° do tutor** combinando dois serviços de negócio.\n\n| Capacidade | Descrição de negócio | Evidência (código) |\n|---|---|---|\n| Ver ficha completa do tutor (dados + pets + histórico de visitas) | Agrega `Owner`+`Pets` (via customers-service) com as `Visits` de cada pet (via visits-service) em uma única resposta para a UI | `ApiGatewayController.getOwnerDetails` (`GET /api/gateway/owners/{ownerId}`) |\n\n**Regra de resiliência de negócio:** se `visits-service` estiver indisponível ou lento, a ficha do tutor ainda é retornada, porém com a lista de visitas vazia para cada pet (circuit breaker com fallback), priorizando disponibilidade do cadastro sobre completude do histórico.\n\n## 6. Capacidades explicitamente fora do escopo atual (lacunas observadas)\n\n- Não há capacidade de **agendamento futuro** de consultas (o domínio registra visitas já ocorridas/descrições de atendimento, não uma agenda com horários e confirmação).\n- Não há **cadastro/edição de veterinários ou especialidades** via API (somente leitura).\n- Não há **exclusão (delete)** de tutor, pet ou visita em nenhum dos serviços.\n- Não há autenticação/autorização (controle de acesso) nos controllers analisados.\n- Não há integração com pagamento, faturamento ou prontuário clínico detalhado (exames, prescrições) — a \"visita\" é limitada a data + descrição textual.\n", "02-contrato-api-customers-service.md": "# Contrato de API — customers-service\n\n- Base path local: `http://localhost:8081`\n- Via api-gateway: `http://<gateway>/api/customer/**` (prefixo `/api/customer` é removido pelo gateway — `StripPrefix=2`)\n- Controllers-fonte: `OwnerResource.java`, `PetResource.java`\n- Formato: JSON (Spring MVC / `@RestController`)\n- Métricas: todos os endpoints de `OwnerResource` têm timer Micrometer `petclinic.owner`; os de `PetResource`, `petclinic.pet`.\n\n## Owners\n\n### `POST /owners` — Cadastrar tutor\nCria um novo tutor.\n\n**Request body** (`OwnerRequest`):\n```json\n{\n  \"firstName\": \"string (obrigatório)\",\n  \"lastName\": \"string (obrigatório)\",\n  \"address\": \"string (obrigatório)\",\n  \"city\": \"string (obrigatório)\",\n  \"telephone\": \"string numérico, até 12 dígitos (obrigatório)\"\n}\n```\n\n**Response:** `201 Created` — corpo é a entidade `Owner` persistida (inclui `id` e `pets: []`).\n\n### `GET /owners/{ownerId}` — Consultar tutor\n- Path param: `ownerId` (inteiro, mínimo 1).\n- **Response:** `200 OK` com `Optional<Owner>` serializado (objeto `Owner` ou corpo vazio/`null` se não existir) — inclui a lista `pets` do tutor.\n- Não há tratamento explícito de 404 nesta ação (diferente de `updateOwner`/`PetResource`, que lançam `ResourceNotFoundException` → mapeado como erro de negócio).\n\n### `GET /owners` — Listar tutores\n- **Response:** `200 OK` com array de `Owner`.\n\n### `PUT /owners/{ownerId}` — Atualizar tutor\n- Path param: `ownerId` (mínimo 1).\n- **Request body:** `OwnerRequest` (mesmo schema do POST, todos os campos novamente obrigatórios).\n- **Response:** `204 No Content`.\n- **Erros:** se `ownerId` não existir, lança `ResourceNotFoundException` (\"Owner {id} not found\").\n\n## Pets\n\n### `GET /petTypes` — Listar tipos de pet\n- **Response:** `200 OK` com array de `PetType` (`{ \"id\": int, \"name\": string }`).\n\n### `POST /owners/{ownerId}/pets` — Cadastrar pet para um tutor\n- Path param: `ownerId` (mínimo 1).\n- **Request body** (`PetRequest`):\n```json\n{\n  \"id\": \"int (ignorado na criação)\",\n  \"birthDate\": \"yyyy-MM-dd\",\n  \"name\": \"string (mínimo 1 caractere)\",\n  \"typeId\": \"int (id de PetType existente)\"\n}\n```\n- **Response:** `201 Created` — corpo é a entidade `Pet` persistida.\n- **Erros:** `ResourceNotFoundException` se `ownerId` não existir. Se `typeId` não existir, o pet é salvo sem tipo (busca é `Optional`, sem lançar erro).\n\n### `PUT /owners/*/pets/{petId}` — Atualizar pet\n- Path param: `petId` (o segmento `owners/*` na rota não é validado/usado para autorização — qualquer valor é aceito).\n- **Request body:** `PetRequest` (o campo `id` do corpo é o identificador usado para localizar o pet, não o path — atenção: o path `{petId}` está declarado mas a implementação lê `petRequest.id()`).\n- **Response:** `204 No Content`.\n- **Erros:** `ResourceNotFoundException` se o pet não existir.\n\n### `GET owners/*/pets/{petId}` — Detalhes de um pet\n- Path param: `petId`.\n- **Response:** `200 OK` com `PetDetails`:\n```json\n{\n  \"id\": \"long\",\n  \"name\": \"string\",\n  \"owner\": \"string (\\\"firstName lastName\\\")\",\n  \"birthDate\": \"yyyy-MM-dd\",\n  \"type\": { \"id\": \"int\", \"name\": \"string\" }\n}\n```\n- **Erros:** `ResourceNotFoundException` se o pet não existir.\n\n## Erros\n\n`ResourceNotFoundException` (não mapeado explicitamente para um `@ExceptionHandler` no código revisado) — comportamento de status HTTP depende do tratamento padrão do Spring Boot para exceções não capturadas (tipicamente `500`, a menos que anotada/mapeada em configuração não coberta por este código-fonte).\n\n## Consumidores conhecidos deste contrato\n\n- `spring-petclinic-api-gateway` (`CustomersServiceClient`): `GET http://customers-service/owners/{ownerId}` via WebClient com balanceamento de carga (`lb://`).\n- `spring-petclinic-genai-service` (`AIDataProvider`): `GET /owners` (listar), `POST /owners` (cadastrar), `POST /owners/{ownerId}/pets` (cadastrar pet) — via `RestClient` apontando para a instância resolvida por `DiscoveryClient`.\n", "02-contrato-api-gateway.md": "# Contrato de API — api-gateway\n\n- Base path local: `http://localhost:8080`\n- Controllers-fonte: `ApiGatewayController.java`, `FallbackController.java`\n- Tecnologia: Spring Cloud Gateway (WebFlux, reativo)\n\nO api-gateway tem dois papéis contratuais distintos: (1) roteador transparente para os serviços de negócio, e (2) um endpoint próprio de agregação (BFF) para a tela de detalhe do tutor.\n\n## 1. Rotas de proxy (Spring Cloud Gateway)\n\nConfiguradas em `application.yml`, sem código Java de roteamento (declarativas):\n\n| Rota (id) | Predicado | Destino | Filtros |\n|---|---|---|---|\n| `vets-service` | `Path=/api/vet/**` | `lb://vets-service` | `StripPrefix=2` |\n| `visits-service` | `Path=/api/visit/**` | `lb://visits-service` | `StripPrefix=2` |\n| `customers-service` | `Path=/api/customer/**` | `lb://customers-service` | `StripPrefix=2` |\n| `genai-service` | `Path=/api/genai/**` | `lb://genai-service` | `StripPrefix=2`, `CircuitBreaker=name=genaiCircuitBreaker,fallbackUri=/fallback` |\n\nFiltros globais (`default-filters`, aplicados a todas as rotas acima):\n- `CircuitBreaker` nomeado `defaultCircuitBreaker`, com fallback em `forward:/fallback`.\n- `Retry`: 1 tentativa adicional, apenas para respostas `SERVICE_UNAVAILABLE` e apenas em métodos `POST`.\n\nEfeito de negócio: qualquer chamada `POST` do front-end que resulte em `503` do serviço de destino é automaticamente reexecutada uma vez antes de acionar o fallback.\n\n## 2. `GET /api/gateway/owners/{ownerId}` — Ficha agregada do tutor (BFF)\n\nEndpoint próprio do gateway (não é um proxy simples).\n\n- Path param: `ownerId` (inteiro).\n- **Orquestração:**\n  1. Busca o tutor e seus pets em `customers-service`: `GET http://customers-service/owners/{ownerId}` (via `CustomersServiceClient`, `WebClient` com resolução por load balancer).\n  2. Com os IDs dos pets do tutor, busca as visitas de todos eles em lote em `visits-service`: `GET http://visits-service/pets/visits?petId=<id1>,<id2>,...` (via `VisitsServiceClient`).\n  3. Combina o resultado: cada pet do tutor recebe sua lista de `visits` preenchida a partir do resultado do passo 2.\n- **Resiliência:** a chamada ao `visits-service` é envolvida por um Circuit Breaker nomeado `getOwnerDetails`. Se abrir (falha/timeout), o gateway substitui o resultado por uma lista de visitas vazia (`emptyVisitsForPets`), e a resposta é retornada normalmente sem visitas, em vez de falhar.\n- **Response:** `200 OK` com `OwnerDetails`:\n```json\n{\n  \"id\": \"int\",\n  \"firstName\": \"string\",\n  \"lastName\": \"string\",\n  \"address\": \"string\",\n  \"city\": \"string\",\n  \"telephone\": \"string\",\n  \"pets\": [\n    {\n      \"id\": \"int\",\n      \"name\": \"string\",\n      \"birthDate\": \"string (yyyy-MM-dd)\",\n      \"type\": { \"id\": \"int\", \"name\": \"string\" },\n      \"visits\": [\n        { \"id\": \"int\", \"petId\": \"int\", \"date\": \"string\", \"description\": \"string\" }\n      ]\n    }\n  ]\n}\n```\n\n## 3. `POST /fallback` — Fallback padrão de circuito\n\n- Acionado internamente pelo Gateway quando um circuito (`defaultCircuitBreaker` ou `genaiCircuitBreaker`) abre.\n- **Response:** `503 Service Unavailable`, corpo: `\"Chat is currently unavailable. Please try again later.\"`\n- Observação: a mensagem de fallback é genérica para \"chat\", mesmo sendo o fallback padrão de qualquer rota — pode gerar mensagem enganosa se o circuito que abrir for o de `customers-service`, `vets-service` ou `visits-service` (não apenas o de `genai-service`).\n\n## 4. UI estática\n\nO mesmo serviço também serve a aplicação AngularJS (`src/main/resources/static/`) que consome as rotas acima como seu backend — não detalhado aqui por não ser um contrato de API de domínio, apenas front-end estático.\n\n## Consumidores conhecidos\n\n- UI AngularJS embutida (`owner-details.component.js`, `vet-list.component.js`, etc.) é a única consumidora conhecida deste contrato no código analisado.\n", "02-contrato-api-genai-service.md": "# Contrato de API — genai-service\n\n- Base path local: `http://localhost:8084` (`web-application-type: reactive`)\n- Via api-gateway: `http://<gateway>/api/genai/**` (`StripPrefix=2` + `CircuitBreaker=name=genaiCircuitBreaker,fallbackUri=/fallback`)\n- Controller-fonte: `PetclinicChatClient.java`\n- Formato: texto simples de entrada/saída (não é um JSON estruturado de request/response)\n\n## `POST /chatclient` — Conversar com o assistente da clínica\n\nÚnico endpoint HTTP de negócio exposto por este serviço.\n\n- **Request body:** `string` (a pergunta/instrução em linguagem natural do usuário, texto puro, não um objeto JSON).\n- **Response:** `200 OK` com `string` (a resposta do assistente em linguagem natural).\n  - Em caso de erro no processamento (ex.: falha no provedor de IA), retorna a string fixa: `\"Chat is currently unavailable. Please try again later.\"` em vez de propagar erro HTTP.\n- **Comportamento:** o texto do usuário é processado por um `ChatClient` do Spring AI, com:\n  - Um *system prompt* fixo definindo o papel do assistente (focado em veterinários, tutores, pets e visitas da \"Spring Petclinic\").\n  - Memória de conversa (`ChatMemory`, via `MessageChatMemoryAdvisor`) — mantém contexto entre chamadas dentro de uma mesma sessão/thread de conversa.\n  - Um conjunto de *tools* (function calling) que o modelo pode decidir invocar (ver abaixo).\n  - Provedor de modelo configurável: OpenAI (`gpt-4o-mini`, chave via `OPENAI_API_KEY`) ou Azure OpenAI (`gpt-4o`, chave/endpoint via `AZURE_OPENAI_KEY`/`AZURE_OPENAI_ENDPOINT`), `temperature: 0.7`.\n\n### Ferramentas (tools) disponíveis ao modelo — não são endpoints HTTP diretos, mas parte do contrato funcional do assistente\n\n| Tool | Efeito | Serviço de negócio acionado internamente |\n|---|---|---|\n| `listOwners` | Lista os tutores da clínica | `customers-service` `GET /owners` |\n| `addOwnerToPetclinic` | Cadastra um novo tutor (nome, sobrenome, endereço, cidade, telefone — telefone deve ter 10 dígitos conforme instrução da tool) | `customers-service` `POST /owners` |\n| `listVets` | Lista veterinários que casam com um critério opcional, via busca semântica (vector store) | Vector store interno (dados originados de `vets-service` `GET /vets` na carga inicial) |\n| `addPetToOwner` | Adiciona um pet a um tutor existente, dado `ownerId` e `petTypeId` (1=gato, 2=cachorro, 3=lagarto, 4=cobra, 5=pássaro, 6=hamster) | `customers-service` `POST /owners/{ownerId}/pets` |\n\n## Sem controller separado, mas parte do runtime do serviço\n\n- **Carregamento do vector store (não é um endpoint HTTP):** ao subir a aplicação (`ApplicationStartedEvent`), o serviço tenta carregar `vectorstore.json` do classpath; se ausente, chama `vets-service` (`GET /vets`) uma única vez, gera embeddings e persiste um novo arquivo local temporário. Não há endpoint para forçar reindexação sob demanda.\n\n## Consumidores conhecidos deste contrato\n\n- UI do `api-gateway` (`scripts/genai/chat.js`) consome `POST /api/genai/chatclient` (roteado pelo gateway) para a experiência de chat na tela.\n\n## Observações de contrato\n\n- O corpo de request/response é texto puro, não um envelope JSON com metadados (ex.: sem `conversationId` explícito no contrato HTTP — a continuidade de contexto é gerenciada internamente pelo `ChatMemory`).\n- Não há endpoint de health/streaming específico documentado no código revisado além do endpoint padrão do Actuator (não analisado em detalhe neste levantamento).\n", "02-contrato-api-vets-service.md": "# Contrato de API — vets-service\n\n- Base path local: `http://localhost:8083`\n- Via api-gateway: `http://<gateway>/api/vet/**` (`StripPrefix=2`)\n- Controller-fonte: `VetResource.java`\n- Formato: JSON (Spring MVC / `@RestController`)\n\n## `GET /vets` — Listar veterinários\n\nÚnico endpoint exposto por este serviço.\n\n- **Response:** `200 OK` com array de `Vet`:\n```json\n[\n  {\n    \"id\": \"int\",\n    \"firstName\": \"string\",\n    \"lastName\": \"string\",\n    \"specialties\": [\n      { \"id\": \"int\", \"name\": \"string\" }\n    ],\n    \"nrOfSpecialties\": \"int\"\n  }\n]\n```\n- Especialidades vêm ordenadas por nome.\n- **Cache:** resposta é cacheada sob a chave de cache `\"vets\"` (`@Cacheable`), habilitado apenas quando o perfil Spring ativo é `production` (`CacheConfig` com `@Profile(\"production\")`). Em outros perfis (ex.: testes), a consulta sempre vai ao banco.\n- Não há paginação, filtro por nome/especialidade, nem endpoints de escrita.\n\n## Consumidores conhecidos deste contrato\n\n- `spring-petclinic-genai-service` (`VectorStoreController`): `GET http://vets-service/vets`, executado uma única vez no evento `ApplicationStartedEvent`, para popular o vector store usado na busca semântica de veterinários (a menos que já exista `vectorstore.json` em classpath, caso em que este endpoint não é chamado).\n- UI (via `api-gateway`, rota `/api/vet/**`) para a tela de listagem de veterinários.\n\n## Observação de contrato\n\nComo não há endpoint de escrita, qualquer necessidade de negócio para cadastrar/editar um veterinário ou associar especialidades precisa ser feita fora da API pública (ex.: diretamente no banco via `data.sql`/migração), o que é uma lacuna de contrato caso o negócio precise disso futuramente.\n", "02-contrato-api-visits-service.md": "# Contrato de API — visits-service\n\n- Base path local: `http://localhost:8082`\n- Via api-gateway: `http://<gateway>/api/visit/**` (`StripPrefix=2`)\n- Controller-fonte: `VisitResource.java`\n- Formato: JSON (Spring MVC / `@RestController`)\n- Métricas: timer Micrometer `petclinic.visit` em todos os endpoints.\n\n## `POST owners/*/pets/{petId}/visits` — Registrar visita\n\n- Path param: `petId` (inteiro, mínimo 1). O segmento `owners/*` não é validado.\n- **Request body** (`Visit`, validado com `@Valid`):\n```json\n{\n  \"date\": \"yyyy-MM-dd (opcional; padrão = data/hora atual do servidor)\",\n  \"description\": \"string, até 8192 caracteres\",\n  \"petId\": \"int (sobrescrito pelo path param no servidor)\"\n}\n```\n- **Response:** `201 Created` — corpo é a entidade `Visit` persistida (com `id` gerado).\n- Observação: o `petId` do corpo é sobrescrito pelo `petId` da URL antes de salvar (`visit.setPetId(petId)`), então o valor enviado no corpo é ignorado para esse fim.\n\n## `GET owners/*/pets/{petId}/visits` — Consultar visitas de um pet\n\n- Path param: `petId` (mínimo 1).\n- **Response:** `200 OK` com array de `Visit`.\n\n## `GET pets/visits?petId=1,2,3` — Consultar visitas de múltiplos pets\n\n- Query param: `petId` — lista de inteiros, repetível ou separada por vírgula (`@RequestParam List<Integer>`).\n- **Response:** `200 OK`:\n```json\n{\n  \"items\": [\n    { \"id\": \"int\", \"date\": \"yyyy-MM-dd\", \"description\": \"string\", \"petId\": \"int\" }\n  ]\n}\n```\n- Usado para busca em lote, evitando N chamadas para montar o histórico de vários pets de uma vez.\n\n## Consumidores conhecidos deste contrato\n\n- `spring-petclinic-api-gateway` (`VisitsServiceClient`): `GET http://visits-service/pets/visits?petId=...` (WebClient, hostname fixo `http://visits-service/` resolvido via service discovery/load balancer), usado por `ApiGatewayController.getOwnerDetails` para montar a ficha do tutor. Esta chamada é protegida por Circuit Breaker (`getOwnerDetails`) — em caso de falha, o gateway trata como \"sem visitas\" em vez de propagar o erro.\n- Nenhuma chamada observada partindo de `genai-service` para este serviço no código analisado.\n\n## Observação de contrato\n\nNão existe endpoint de atualização (`PUT`) nem exclusão (`DELETE`) de visita — o histórico de visitas é apenas append-only pela API pública atual.\n", "03-modelo-dados-customers-service.md": "# Modelo de Dados — customers-service\n\n- Banco: MySQL em produção (`db/mysql/schema.sql`) ou HSQLDB embarcado em testes/dev (`db/hsqldb/schema.sql`) — schemas equivalentes.\n- Mapeamento ORM: Jakarta Persistence (JPA) / Hibernate, entidades em `org.springframework.samples.petclinic.customers.model`.\n- Banco lógico: `petclinic` (schema próprio deste serviço; cada microsserviço tem seu próprio banco — sem tabelas compartilhadas entre serviços).\n\n## Diagrama Entidade-Relacionamento\n\n```mermaid\nerDiagram\n    OWNERS ||--o{ PETS : \"possui\"\n    TYPES ||--o{ PETS : \"classifica\"\n\n    OWNERS {\n        int id PK\n        varchar30 first_name\n        varchar30 last_name\n        varchar255 address\n        varchar80 city\n        varchar20 telephone\n    }\n\n    PETS {\n        int id PK\n        varchar30 name\n        date birth_date\n        int type_id FK\n        int owner_id FK\n    }\n\n    TYPES {\n        int id PK\n        varchar80 name\n    }\n```\n\n## Tabelas\n\n### `owners`\n| Coluna | Tipo | Constraint | Observação |\n|---|---|---|---|\n| `id` | `INT(4) UNSIGNED` | PK, auto increment | |\n| `first_name` | `VARCHAR(30)` | | obrigatório na camada de aplicação (`@NotBlank`) |\n| `last_name` | `VARCHAR(30)` | índice (`INDEX(last_name)`) | obrigatório na aplicação |\n| `address` | `VARCHAR(255)` | | obrigatório na aplicação |\n| `city` | `VARCHAR(80)` | | obrigatório na aplicação |\n| `telephone` | `VARCHAR(20)` | | obrigatório na aplicação; validado como numérico até 12 dígitos |\n\n### `pets`\n| Coluna | Tipo | Constraint | Observação |\n|---|---|---|---|\n| `id` | `INT(4) UNSIGNED` | PK, auto increment | |\n| `name` | `VARCHAR(30)` | índice (`INDEX(name)`) | |\n| `birth_date` | `DATE` | | |\n| `type_id` | `INT(4) UNSIGNED` | NOT NULL, FK → `types(id)` | |\n| `owner_id` | `INT(4) UNSIGNED` | NOT NULL, FK → `owners(id)` | |\n\n### `types`\n| Coluna | Tipo | Constraint | Observação |\n|---|---|---|---|\n| `id` | `INT(4) UNSIGNED` | PK, auto increment | |\n| `name` | `VARCHAR(80)` | índice (`INDEX(name)`) | catálogo fixo (ex.: cat, dog, lizard, snake, bird, hamster — conforme `data.sql` e prompt do genai-service) |\n\n## Relacionamentos e regras de integridade\n\n- `pets.owner_id → owners.id`: obrigatório (`NOT NULL`), FK física — um pet sempre pertence a um tutor.\n- `pets.type_id → types.id`: obrigatório (`NOT NULL`), FK física — um pet sempre tem um tipo.\n- `owners (1) — (N) pets`: no ORM, `@OneToMany(cascade = ALL, fetch = EAGER, mappedBy = \"owner\")` — apagar/persistir um `Owner` propaga para seus `Pet`s (cascade), e os pets são sempre carregados junto com o tutor.\n- Não há relação física de `pets` com o serviço `visits-service` (o vínculo pet↔visita existe apenas do lado de `visits-service`, como referência lógica ao `pet_id`).\n\n## Observações de modelagem\n\n- Chaves primárias são inteiras autoincrementais (`IDENTITY`), sem UUID.\n- Não há colunas de auditoria (`created_at`/`updated_at`) nem soft-delete — o modelo reflete o desenho original do Spring PetClinic monolítico, adaptado para múltiplos serviços.\n- Engine `InnoDB` (suporta FKs e transações) em MySQL.\n", "03-modelo-dados-genai-service.md": "# Modelo de Dados — genai-service\n\nEste serviço não possui banco relacional próprio. Ele mantém dois tipos de estado:\n\n1. **DTOs de domínio** (réplicas locais dos contratos de `customers-service`/`vets-service`/`visits-service`, usadas apenas para desserializar/serializar chamadas HTTP e respostas das tools de IA — não é armazenamento persistente).\n2. **Vector store de veterinários** (`SimpleVectorStore`, persistido em `vectorstore.json`), usado para busca semântica (RAG).\n\n## 1. DTOs de domínio (`org.springframework.samples.petclinic.genai.dto`)\n\n| DTO | Campos | Espelha o modelo de |\n|---|---|---|\n| `OwnerDetails` | `id, firstName, lastName, address, city, telephone, pets: List<PetDetails>` | `customers-service` (Owner) |\n| `PetDetails` | `id, name, birthDate, type: PetType, visits: List<VisitDetails>` | `customers-service` (Pet) + `visits-service` (Visit) |\n| `PetRequest` | `id, birthDate, name, typeId` | payload de criação de pet em `customers-service` |\n| `PetType` | `name` (sem `id` — diferente do modelo real de `customers-service`, que tem `id` + `name`) | `customers-service` (PetType), de forma simplificada |\n| `Vet` | `id, firstName, lastName, specialties: Set<Specialty>` | `vets-service` (Vet) |\n| `Specialty` | `id, name` | `vets-service` (Specialty) |\n| `VisitDetails` | `id, petId, date, description` | `visits-service` (Visit) |\n\nEstes DTOs são a \"visão do assistente de IA\" sobre o domínio — mantidos manualmente em código, e não gerados a partir de um contrato compartilhado, o que é um risco de desalinhamento caso os contratos reais mudem (ex.: `PetType` aqui não tem `id`, diferente do `PetType` real).\n\n## 2. Vector store de veterinários (RAG)\n\n- Tecnologia: `org.springframework.ai.vectorstore.SimpleVectorStore`, persistido como JSON em `src/main/resources/vectorstore.json` (formato de exemplo abaixo).\n- Estrutura de cada entrada (chave = UUID do documento):\n```json\n{\n  \"<uuid>\": {\n    \"text\": \"{id=2, firstName=Helen, lastName=Leary, specialties=[{id=1, name=radiology}]}\",\n    \"embedding\": [0.0127, 0.0346, \"... vetor de ponto flutuante ...\"]\n  }\n}\n```\n- Cada \"documento\" representa **um veterinário** (serializado como texto livre a partir do objeto `Vet` retornado por `vets-service`), com seu vetor de embedding associado.\n- **Origem dos dados:** gerado a partir de `GET /vets` em `vets-service`, uma única vez, no primeiro start sem `vectorstore.json` existente (ver `02-contrato-api-genai-service.md`).\n- **Ciclo de vida:** não há atualização incremental — o índice reflete o estado dos veterinários no momento em que foi gerado; alterações posteriores no cadastro de veterinários não aparecem nas buscas de IA até uma reindexação manual (apagar o arquivo e reiniciar o serviço).\n\n## 3. Memória de conversa (Chat Memory)\n\n- `ChatMemory` (Spring AI) mantém o histórico de mensagens por conversa para dar contexto ao modelo (usado via `MessageChatMemoryAdvisor`, ordem 10, no `PetclinicChatClient`).\n- Não foi encontrada, no código revisado, configuração explícita de um backend persistente (ex.: banco de dados) para essa memória — não é abordado em detalhe neste levantamento por não haver entidade/schema correspondente no código-fonte principal analisado.\n", "03-modelo-dados-vets-service.md": "# Modelo de Dados — vets-service\n\n- Banco: MySQL em produção (`db/mysql/schema.sql`) ou HSQLDB embarcado em testes/dev (`db/hsqldb/schema.sql`).\n- Mapeamento ORM: JPA/Hibernate, entidades em `org.springframework.samples.petclinic.vets.model`.\n- Banco lógico: `petclinic` (schema próprio deste serviço, independente do banco de `customers-service`, embora tenha o mesmo nome lógico).\n\n## Diagrama Entidade-Relacionamento\n\n```mermaid\nerDiagram\n    VETS ||--o{ VET_SPECIALTIES : \"tem\"\n    SPECIALTIES ||--o{ VET_SPECIALTIES : \"é atribuída em\"\n\n    VETS {\n        int id PK\n        varchar30 first_name\n        varchar30 last_name\n    }\n\n    SPECIALTIES {\n        int id PK\n        varchar80 name\n    }\n\n    VET_SPECIALTIES {\n        int vet_id FK\n        int specialty_id FK\n    }\n```\n\n## Tabelas\n\n### `vets`\n| Coluna | Tipo | Constraint | Observação |\n|---|---|---|---|\n| `id` | `INT(4) UNSIGNED` | PK, auto increment | |\n| `first_name` | `VARCHAR(30)` | | obrigatório na aplicação (`@NotBlank`) |\n| `last_name` | `VARCHAR(30)` | índice (`INDEX(last_name)`) | obrigatório na aplicação |\n\n### `specialties`\n| Coluna | Tipo | Constraint | Observação |\n|---|---|---|---|\n| `id` | `INT(4) UNSIGNED` | PK, auto increment | |\n| `name` | `VARCHAR(80)` | índice (`INDEX(name)`) | ex.: radiology, surgery, dentistry (conforme `data.sql`) |\n\n### `vet_specialties` (tabela associativa N:N)\n| Coluna | Tipo | Constraint | Observação |\n|---|---|---|---|\n| `vet_id` | `INT(4) UNSIGNED` | FK → `vets(id)` | |\n| `specialty_id` | `INT(4) UNSIGNED` | FK → `specialties(id)` | |\n| — | — | `UNIQUE(vet_id, specialty_id)` | impede duplicidade da mesma especialidade para o mesmo veterinário |\n\n## Relacionamentos e regras de integridade\n\n- `vets (N) — (N) specialties` via `vet_specialties`, mapeado no ORM como `@ManyToMany(fetch = EAGER)` no lado `Vet` — especialidades são sempre carregadas junto com o veterinário e retornadas ordenadas por nome.\n- Um veterinário pode não ter nenhuma especialidade (relação opcional do lado `specialties`).\n\n## Observações de modelagem\n\n- Não há coluna para dados de contato do veterinário (telefone, e-mail), agenda/disponibilidade, nem status (ativo/inativo) — o modelo é propositalmente mínimo (nome + especialidades).\n- Sem colunas de auditoria ou soft-delete.\n- Resultado de `GET /vets` é cacheado em memória (`@Cacheable(\"vets\")`, perfil `production`) — mudanças diretas no banco não aparecerão na API até expiração/invalidação do cache do processo.\n", "03-modelo-dados-visits-service.md": "# Modelo de Dados — visits-service\n\n- Banco: MySQL em produção (`db/mysql/schema.sql`) ou HSQLDB embarcado em testes/dev (`db/hsqldb/schema.sql`).\n- Mapeamento ORM: JPA/Hibernate, entidade em `org.springframework.samples.petclinic.visits.model.Visit`.\n- Banco lógico: `petclinic` (schema próprio deste serviço, base de dados fisicamente separada da de `customers-service`).\n\n## Diagrama Entidade-Relacionamento\n\n```mermaid\nerDiagram\n    VISITS {\n        int id PK\n        int pet_id \"referência lógica a customers-service.pets.id (sem FK física entre bancos)\"\n        date visit_date\n        varchar8192 description\n    }\n```\n\n## Tabela\n\n### `visits`\n| Coluna | Tipo | Constraint | Observação |\n|---|---|---|---|\n| `id` | `INT(4) UNSIGNED` | PK, auto increment | |\n| `pet_id` | `INT(4) UNSIGNED` | NOT NULL, `FOREIGN KEY (pet_id) REFERENCES pets(id)` **no script SQL** | ver nota abaixo |\n| `visit_date` | `DATE` | | mapeado no Java como `@Temporal(TIMESTAMP)`, mas a coluna SQL é `DATE` |\n| `description` | `VARCHAR(8192)` | | validado na aplicação com `@Size(max = 8192)` |\n\n## Nota importante sobre a FK `pet_id → pets(id)`\n\nO script `schema.sql` deste serviço declara `FOREIGN KEY (pet_id) REFERENCES pets(id)`, mas a tabela `pets` **não existe no banco deste serviço** — ela pertence ao schema de `customers-service`, em outro banco/processo. Isso só é sintaticamente válido porque cada serviço roda sobre seu próprio schema `petclinic` isolado (ou o script foi herdado do monólito original e a FK é, na prática, inofensiva/ignorada dependendo do motor). Em termos de arquitetura de dados:\n- Não existe integridade referencial garantida pelo banco entre `visits.pet_id` e o `pets.id` real de `customers-service`.\n- A consistência é responsabilidade da aplicação (ninguém valida, no `visits-service`, que o `petId` recebido de fato existe em `customers-service` antes de gravar uma visita).\n\n## Observações de modelagem\n\n- Não há referência a `owner_id` — o vínculo com o tutor é sempre indireto, via `pet_id`.\n- Não há colunas de auditoria ou soft-delete.\n- Suporta consulta por pet único (`findByPetId`) e por lote de pets (`findByPetIdIn`), refletindo o padrão de uso do `api-gateway` para montar a ficha agregada do tutor.\n", "04-servicos-infraestrutura.md": "# Serviços de Infraestrutura de Suporte\n\nEstes serviços não implementam capacidades de negócio da clínica veterinária, mas são pré-requisitos operacionais para os serviços de negócio funcionarem. Documentados aqui para completude do \"repo do domínio\", sem contratos de API de negócio.\n\n## discovery-server (Eureka)\n- Porta: `8761`.\n- Papel: Service Registry — todos os demais serviços se registram nele e o utilizam para resolver `lb://<nome-do-serviço>` (usado pelo gateway) ou `DiscoveryClient.getInstances(\"customers-service\")` (usado pelo genai-service).\n- Deve subir antes dos serviços de negócio (README: \"Config and Discovery Server must be started before any other application\").\n\n## config-server (Spring Cloud Config)\n- Porta: `8888`.\n- Papel: fonte centralizada de configuração para todos os serviços (`spring.config.import: optional:configserver:...` em cada `application.yml`).\n- Fonte da configuração: repositório Git (`spring-petclinic-microservices-config`) por padrão, ou sistema de arquivos local via perfil `native` + variável `GIT_REPO`.\n- Cada serviço de negócio importa sua config de `http://localhost:8888` localmente, ou `http://config-server:8888` no perfil `docker`.\n\n## admin-server (Spring Boot Admin)\n- Porta: `9090`.\n- Papel: painel de observabilidade/administração dos demais serviços registrados no Eureka (health, métricas, logs, env).\n\n## api-gateway (também documentado como serviço de negócio em `02-contrato-api-gateway.md`)\n- Porta: `8080`.\n- Além do roteamento, serve a UI AngularJS estática do domínio.\n\n## Observabilidade (fora do código Java, definidos em `docker-compose.yml`/`docker/`)\n- **Zipkin** (tracing distribuído): porta `9411`.\n- **Prometheus** (métricas): porta `9091` (mapeada), config em `docker/prometheus/prometheus.yml`.\n- **Grafana** (dashboards): porta `3030` (mapeada), dashboard pré-carregado em `docker/grafana/dashboards/grafana-petclinic-dashboard.json`.\n\n## Ordem de dependência (docker-compose `depends_on` + healthcheck)\n\n```mermaid\nflowchart LR\n    CFG[config-server] --> DISC[discovery-server]\n    DISC --> CUST[customers-service]\n    DISC --> VIS[visits-service]\n    DISC --> VET[vets-service]\n    DISC --> GENAI[genai-service]\n    DISC --> GW[api-gateway]\n    DISC --> ADM[admin-server]\n    CFG --> CUST\n    CFG --> VIS\n    CFG --> VET\n    CFG --> GENAI\n    CFG --> GW\n    CFG --> ADM\n```\n\nTodos os serviços de negócio dependem de `config-server` e `discovery-server` estarem saudáveis (`service_healthy`) antes de subir.\n", "05-glossario.md": "# Glossário do Domínio — Clínica Veterinária\n\n| Termo | Definição no contexto deste sistema | Onde vive |\n|---|---|---|\n| **Owner (Tutor)** | Pessoa dona de um ou mais pets, cadastrada com nome, endereço, cidade e telefone | `customers-service` |\n| **Pet** | Animal de estimação vinculado a exatamente um Owner e a exatamente um PetType | `customers-service` |\n| **PetType** | Categoria/espécie do pet (ex.: cat, dog, lizard, snake, bird, hamster) | `customers-service` |\n| **Vet (Veterinário)** | Profissional do corpo clínico da clínica, com nome e zero ou mais Specialties | `vets-service` |\n| **Specialty (Especialidade)** | Área de atuação de um veterinário (ex.: radiology, surgery, dentistry) | `vets-service` |\n| **Visit (Visita)** | Registro de um atendimento realizado a um Pet, com data e descrição textual | `visits-service` |\n| **Owner Details** | Visão agregada de um tutor + seus pets + as visitas de cada pet, montada pelo api-gateway a partir de dois serviços | `api-gateway` (BFF) |\n| **Chat / Assistente da clínica** | Ponto de entrada conversacional que interpreta perguntas/comandos em linguagem natural e aciona tools de negócio | `genai-service` |\n| **Tool (ferramenta de IA)** | Função exposta ao modelo de linguagem para consultar ou alterar dados reais do domínio (listar tutores/vets, cadastrar tutor/pet) | `genai-service` |\n| **Vector store** | Índice de embeddings dos veterinários usado para busca semântica (RAG) nas perguntas sobre corpo clínico | `genai-service` |\n| **Circuit Breaker** | Mecanismo de resiliência que interrompe chamadas a um serviço instável e retorna uma resposta alternativa (fallback) | `api-gateway` (rotas + BFF) |\n| **Service Discovery / Eureka** | Registro dinâmico de instâncias de serviço, usado para resolver nomes lógicos (`customers-service`, `vets-service`, etc.) em endereços reais | `discovery-server`, consumido por todos |\n| **Config Server** | Fonte centralizada de configuração (`application.yml` remoto) consumida por todos os serviços na subida | `config-server` |\n\n## Convenções observadas no código\n\n- Nomes de serviço usados no service discovery são sempre em kebab-case e coincidem com `spring.application.name` de cada módulo (`customers-service`, `vets-service`, `visits-service`, `genai-service`, `api-gateway`, `discovery-server`, `admin-server`).\n- IDs de entidades são sempre inteiros autoincrementais (`Integer id`, `GenerationType.IDENTITY`), nunca UUID, em todos os serviços de negócio.\n- Datas de nascimento/visita trafegam no formato `yyyy-MM-dd` nos contratos JSON, mesmo quando armazenadas internamente como `Date`/`Timestamp`.\n"};
mermaid.initialize({startOnLoad:false, theme:'default'});
const nav = document.getElementById('nav'), doc = document.getElementById('doc');
const keys = Object.keys(F).sort((a,b)=> (a.includes('RELATORIO')?-1:0) - (b.includes('RELATORIO')?-1:0) || a.localeCompare(b));
async function show(k){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.k===k));
  let t = F[k], fm = '';
  const m = t.match(/^---\n([\s\S]*?)\n---\n?/);
  if (m) { fm = '<div class="fm">'+m[1].replace(/</g,'&lt;')+'</div>'; t = t.slice(m[0].length); }
  let h = marked.parse(t);
  h = h.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g, (_, c) => '<div class="mermaid">'+c+'</div>');
  doc.innerHTML = '<p style="color:var(--muted);font-size:12px">'+k+'</p>' + fm + h;
  doc.querySelectorAll('.mermaid').forEach(el => { el.textContent = el.textContent.replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&'); });
  try { await mermaid.run({nodes: doc.querySelectorAll('.mermaid')}); } catch(e) { console.warn(e); }
}
keys.forEach(k => { const a = document.createElement('a'); a.href='#'; a.textContent=k; a.dataset.k=k; a.onclick=e=>{e.preventDefault();show(k)}; nav.appendChild(a); });
show(keys[0]);
