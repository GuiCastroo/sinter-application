const F = {"00-visao-geral.md": "# Serverlesspresso — Visão Geral da Documentação\n\n> Documentação técnica gerada a partir da leitura direta do código-fonte em\n> `fixtures/serverless-coffee` (repositório `aws-samples/serverless-coffee`, também\n> conhecido como **Serverlesspresso**). Não foi executado nenhum deploy nem chamada de API —\n> tudo abaixo é derivado dos templates SAM (`template.yaml`), das definições de state machine\n> (`*.asl.json`), do código dos handlers Lambda e dos `README.md` do próprio repositório.\n\n## O que é este sistema\n\nServerlesspresso é o backend de um **carrinho de café pop-up** (usado como demo/workshop da AWS\nem eventos como o re:Invent). Um cliente escaneia um QR code exibido no balcão, faz login por SMS,\nescolhe uma bebida no app, e acompanha o pedido em tempo real até o barista prepará-lo. Todo o\nback-end é serverless: **Lambda + Step Functions + EventBridge + DynamoDB + API Gateway + IoT\nCore + Cognito**, sem nenhum servidor ou container de longa duração.\n\nNão há um \"monólito\": o sistema é um conjunto de **9 microsserviços numerados** (mais duas pilhas\nde infraestrutura de base e um punhado de extensões opcionais), todos conectados por um único\n**event bus do EventBridge** chamado `Serverlesspresso`. Cada serviço publica e consome eventos\nnesse barramento; poucos serviços chamam uns aos outros diretamente.\n\n## Como navegar nesta documentação (de baixo para cima)\n\n| Camada | Arquivo | Conteúdo |\n|---|---|---|\n| 1. Infraestrutura | [`01-infraestrutura.md`](./01-infraestrutura.md) | As duas pilhas de fundação (`00-baseCore`, `01-appCore`): event bus, Cognito, IoT Core, tabelas DynamoDB, API Gateways, S3/CloudFront, papéis IAM. |\n| 2. Componentes (Lambdas) | [`02-lambdas.md`](./02-lambdas.md) | Catálogo de todas as **25 funções Lambda** do repositório: gatilho, entrada, saída, efeitos colaterais. |\n| 3. Sistemas (microsserviços) | [`03-sistemas.md`](./03-sistemas.md) | Os 9 microsserviços + as 3 state machines + as extensões opcionais, com diagramas de cada fluxo interno. |\n| 4. Fluxo de negócio | [`04-fluxo-pedido-sequencia.md`](./04-fluxo-pedido-sequencia.md) | O ciclo de vida completo de **um pedido de café**, do QR code ao \"order journey\" final, com diagrama de sequência. |\n\n## Mapa de alto nível (C4 — nível de contexto/contêiner)\n\n```mermaid\nflowchart TB\n    subgraph Clients[\"Frontends (fora deste repo)\"]\n        CustomerApp[\"App do Cliente\"]\n        AdminApp[\"App Admin / Barista\"]\n        OrderJourneyPage[\"Página 'Order Journey' (estática)\"]\n    end\n\n    subgraph Auth[\"00-baseCore\"]\n        Cognito[\"Cognito User Pool\\n(login via SMS OTP)\"]\n        IoT[\"AWS IoT Core\\n(MQTT realtime)\"]\n    end\n\n    subgraph Bus[\"Event Bus\"]\n        EventBridge([\"EventBridge bus: Serverlesspresso\"])\n    end\n\n    subgraph Services[\"01-appCore — microsserviços\"]\n        Validator[\"9-validator\\n(QR code)\"]\n        OrderProcessor[\"4-order-processing\\n(Step Functions)\"]\n        OrderManager[\"5-order-manager\\n(Step Functions + API)\"]\n        ConfigSvc[\"2-config-service\"]\n        Publisher[\"6-publisher-service\"]\n        Metrics[\"7-metrics-service\"]\n        OrderJourney[\"8-order-journey\\n(Step Functions)\"]\n        Counting[\"1-counting-service\"]\n    end\n\n    subgraph Data[\"Dados\"]\n        DDB[(\"DynamoDB\\nConfig / Counting / Validator / Order / OrderJourneyEvents\")]\n        S3[(\"S3 + CloudFront\\nJourneyBucket\")]\n        CW[(\"CloudWatch Metrics\")]\n    end\n\n    CustomerApp -- login SMS --> Cognito\n    CustomerApp -- \"scan QR / POST /qr-code\" --> Validator\n    AdminApp -- \"GET/PUT /orders, /config\" --> OrderManager\n    AdminApp --> ConfigSvc\n\n    Validator -- \"Validator.NewOrder\" --> EventBridge\n    EventBridge --> OrderProcessor\n    OrderProcessor <-- \"waitForTaskToken /\\nsendTaskSuccess\" --> OrderManager\n    OrderManager -- eventos --> EventBridge\n    OrderProcessor -- eventos --> EventBridge\n    ConfigSvc -- \"ConfigService.*\" --> EventBridge\n\n    EventBridge --> Publisher\n    Publisher -- MQTT publish --> IoT\n    IoT -. realtime .-> CustomerApp\n    IoT -. realtime .-> AdminApp\n\n    EventBridge --> Metrics --> CW\n    EventBridge --> OrderJourney\n    OrderJourney --> S3 --> OrderJourneyPage\n\n    Validator --- DDB\n    OrderProcessor --- DDB\n    OrderManager --- DDB\n    ConfigSvc --- DDB\n    Counting --- DDB\n    OrderJourney --- DDB\n```\n\n## Duas formas de deploy encontradas no repositório\n\nIsso é importante para não se confundir ao ler o código:\n\n1. **Pilha consolidada** (`00-baseCore/template.yaml` + `01-appCore/template.yaml`) — é o\n   caminho de instalação documentado no `README.md` raiz (`sam deploy --guided` em cada pasta).\n   `01-appCore` **reimplementa inline** a maior parte da lógica dos serviços 1, 2, 4, 5, 6, 8 e 9,\n   referenciando o código-fonte de `backends/*` por `CodeUri` relativo, mas com sua **própria**\n   definição de recursos (tabelas, filas de eventos, state machines). É o que roda de fato quando\n   se segue o README.\n2. **Pastas `backends/<n>-<nome>`** — cada uma tem (quase) seu próprio `template.yaml`/`api.yaml`\n   independente, no estilo dos módulos do workshop `workshop.serverlesscoffee.com`, pensados para\n   deploy isolado durante o aprendizado. Algumas contêm código que **não é usado** pela pilha\n   consolidada (ex.: `4-order-processing/functions/capacity/isCapacityAvailable.js` e\n   `functions/resumeWF/app.js` — na pilha consolidada essas responsabilidades foram embutidas\n   diretamente na Amazon States Language, ver [`03-sistemas.md`](./03-sistemas.md)).\n\nIsso é sinalizado item a item nos capítulos seguintes.\n\n## Convenções usadas nesta documentação\n\n- Nomes de recursos são citados exatamente como aparecem no template (`PascalCase` do\n  CloudFormation).\n- \"Evento\" sempre se refere a um evento do EventBridge (`detail-type` + `source` +\n  `detail`), nunca a um evento de UI.\n- Todos os diagramas são Mermaid e podem ser renderizados em qualquer visualizador compatível\n  (GitHub, VS Code, mermaid.live).\n- Onde o código tem bugs ou inconsistências visíveis (nome de variável, TODO, chave de config\n  esquecida), isso é anotado com **⚠️ Nota**.\n", "01-infraestrutura.md": "# 1. Infraestrutura\n\nEsta camada documenta os recursos de fundação declarados nos templates SAM/CloudFormation.\nExistem duas pilhas de infraestrutura \"core\", instaladas nesta ordem (conforme o `README.md`\nraiz):\n\n1. `00-baseCore/template.yaml` → stack **`serverlesspresso-core`**\n2. `01-appCore/template.yaml` → stack **`serverlesspresso`**\n\n## 1.1 Stack `serverlesspresso-core` (`00-baseCore`)\n\nResponsável pelo **event bus**, **autenticação** e **realtime (IoT)** — os três alicerces que\ntodos os outros serviços consomem via parâmetros do SSM Parameter Store.\n\n### Event Bus\n\n| Recurso | Tipo | Detalhe |\n|---|---|---|\n| `ServerlesspressoEventBus` | `AWS::Events::EventBus` | Bus custom chamado **`Serverlesspresso`**. Todo o sistema publica/consome eventos aqui usando `Source = awsserverlessda.serverlesspresso`. |\n| `LogsRule` + `LogGroupForEvents` | `AWS::Events::Rule` / `AWS::Logs::LogGroup` | Regra \"catch-all\" (`source: awsserverlessda.serverlesspresso`) que espelha **todo** evento do bus para o log group `/aws/serverlesspresso-event-bus` — usado só para depuração/auditoria. |\n\n### Autenticação (Cognito com login via SMS, sem senha)\n\n| Recurso | Tipo | Detalhe |\n|---|---|---|\n| `UserPool` | `AWS::Cognito::UserPool` | Usuário identificado por `phone_number`. MFA desligado; usa fluxo de **autenticação customizada** (custom auth challenge) em vez de senha. |\n| `DefineAuthChallenge`, `CreateAuthChallenge`, `VerifyAuthChallengeResponse`, `PreSignUp` | `AWS::Serverless::Function` | 4 Lambda triggers do Cognito que implementam o fluxo de OTP por SMS (detalhado em [`02-lambdas.md`](./02-lambdas.md)). |\n| `UserPoolClient` | `AWS::Cognito::UserPoolClient` | Client público, sem secret (`GenerateSecret: false`) — para SPA/mobile. |\n| `IdentityPool` | `AWS::Cognito::IdentityPool` | Federated Identity Pool, **permite usuários não autenticados** (`AllowUnauthenticatedIdentities: true`) — provavelmente para permitir conexão IoT antes do login. |\n| `CognitoAuthorizedRole` / `CognitoUnAuthorizedRole` | `AWS::IAM::Role` | Ambos os papéis dão a mesma permissão de `iot:Connect` / `iot:Subscribe` / `iot:Receive` restrita a `client/serverlesspresso-*`, ou seja, tanto visitante anônimo quanto cliente logado podem abrir uma conexão MQTT para receber updates em tempo real. |\n\n### Realtime (IoT Core)\n\n| Recurso | Tipo | Detalhe |\n|---|---|---|\n| `ServerlesspressoRealtime` | `AWS::IoT::Thing` | Thing nomeada `serverlesspresso-realtime-workshop` — usada apenas como âncora simbólica; o realtime de fato acontece via MQTT pub/sub, não via Device Shadow. |\n| `GetIoTEndpointFunction` + `IotEndpoint` | Lambda + `Custom::IotEndpoint` | **Custom Resource** do CloudFormation: a Lambda chama `iot:DescribeEndpoint` na hora do deploy e devolve a URL do endpoint IoT da conta/região, exposta como output `IotEndpointAddress` (consumida pelos frontends para abrir a conexão MQTT). |\n\n### Outputs (consumidos pelas pilhas seguintes via SSM Parameter Store)\n\n`UserPoolID`, `UserPoolWebClientId`, `CoreEventBusARN`, `IoTRealtimeName`, `IotEndpointAddress`,\n`UserPoolARNParameter` — o `README.md` raiz explica que esses outputs também são gravados no\n**AWS Systems Manager Parameter Store** (`/Serverlesspresso/core/...`), de onde os templates dos\noutros serviços os leem via parâmetros `AWS::SSM::Parameter::Value<String>` (visto em\n`backends/9-validator/template.yaml`, por exemplo).\n\n---\n\n## 1.2 Stack `serverlesspresso` (`01-appCore`)\n\nÉ a pilha \"guarda-chuva\" que declara (quase) todos os recursos de dados e execução dos 9\nmicrosserviços de negócio. Ela referencia código-fonte fora da própria pasta\n(`CodeUri: ../backends/...`), então **o código vive em `backends/`, mas os recursos de nuvem são\ndeclarados aqui**.\n\n### Armazenamento (DynamoDB)\n\n| Tabela | Chave | Usada por | Observações |\n|---|---|---|---|\n| `ConfigTable` (`serverlesspresso-config-table`) | `PK` (string) | Config service, Validator, Order Manager (SFN `get menu`), Order Processor (SFN `Shop Open?`) | Guarda config por evento (`config-<eventId>`): cardápio, `storeOpen` (bool), `drinksPerBarcode`. Tem **DynamoDB Stream** ligado ao `ConfigChangedFunction`. |\n| `CountingTable` (`serverlesspresso-counting-table`) | `PK` (string) | Order Processor (SFN `Generate Order Number`) | Contador atômico de número de pedido por evento (`orderID-<eventId>`), incrementado via `UpdateExpression` direto na ASL (sem Lambda). |\n| `ApplicationTable` / `ValidatorTable` (`serverlesspresso-validator`) | `PK` | Validator service | Guarda os \"buckets\" de token QR code rotativos (janelas de 5 min) e contagem de tokens restantes. |\n| `OrderTable` (`serverlesspresso-order-table`) | `PK`+`SK`, GSIs `GSI-status` (`ORDERSTATE`+`SK`) e `GSI-userId` (`USERID`+`SK`), LSI `LSI-timestamp` | Order Manager | O \"registro mestre\" de cada pedido: task tokens, estado (`<eventId>-CREATED/COMPLETED/CANCELLED`), drink order, barista designado. As APIs REST (`GET /orders`, `GET /myOrders`) fazem `Query` direto nos GSIs via integração de API Gateway com DynamoDB (sem Lambda no caminho de leitura). |\n| `OrderJourneyEventsTable` | `PK`+`SK` | Order Journey service | Guarda uma linha por evento do pedido (histórico completo), usada para montar a página HTML final. |\n\n### API Gateways (REST, integração direta com AWS services quando possível)\n\n| API | Stack/pasta | Endpoints | Padrão de integração |\n|---|---|---|---|\n| `RESTApiConfigService` | `2-config-service/RestAPIs/api.yaml` | `GET /config`, `GET /admin-config`, `PUT /store` | **Integração direta API Gateway → DynamoDB** (`GetItem`/`UpdateItem`), sem Lambda no meio. `/admin-config` e `/store` exigem Cognito; `/config` é público. |\n| `RESTApiForOrderManager` | `5-order-manager/RestAPIs/api.yaml` | `GET /orders`, `GET /orders/{id}`, `PUT /orders/{id}`, `GET /myOrders` | `GET`s = integração direta com **DynamoDB Query/GetItem**; `PUT /orders/{id}` = integração direta **API Gateway → Step Functions `StartExecution`** (inicia a Order Manager State Machine passando `action`, `eventId`, `body`, `orderId`, `baristaUserId` extraído do JWT). Todos exigem Cognito. |\n| `RESTApiValidatorService` | `9-validator/template.yaml` (versão standalone) / `01-appCore` (versão consolidada) | `GET /qr-code`, `POST /qr-code` | Essas sim passam por Lambda (`GetQRcodeFunction`, `VerifyQRcodeFunction`). Autenticação Cognito. |\n| `4-order-processing/api.yaml` | standalone apenas | `POST /order` | Integração **API Gateway HTTP API → EventBridge PutEvents** direta (`OrderProcessor.OrderStarted`) — não aparece usada na pilha consolidada (o caminho real de entrada é `VerifyQRcodeFunction` emitindo `Validator.NewOrder`). |\n\n⚠️ **Nota**: o padrão recorrente aqui é \"API Gateway sem Lambda\" (Velocity Templates + IAM role\ndedicada por API, ex. `ConfigRESTApiRole`, `RESTApiRole`) — reduz custo/latência para leituras e\npara iniciar workflows, e só usa Lambda quando há lógica de negócio real (Validator) ou\nefeitos colaterais (Config Streams).\n\n### Entrega em tempo real (S3 + CloudFront)\n\n| Recurso | Detalhe |\n|---|---|\n| `JourneyBucket` (`serverlesspresso-order-journey-<region>-<account>`) | Bucket S3 onde a Lambda `GenerateHtml` grava a página HTML final do pedido (`<orderId>.html`, ACL `public-read`). |\n| `JourneyCloudFront` + `OriginAccessIdentity` | Distribuição CloudFront na frente do bucket (cache curto, `DefaultTTL: 5`s) — serve a \"order journey page\" compartilhável publicamente. |\n\n### Execução assíncrona (Step Functions)\n\nTrês state machines vivem nesta pilha — cada uma detalhada em [`03-sistemas.md`](./03-sistemas.md):\n\n- `OrderProcessorStateMachine` (`backends/4-order-processing/statemachine/op.asl.json`) — usa um\n  **papel IAM próprio** (`OrderProcessorRole`), não o padrão de policies do SAM, com permissões\n  explícitas para `events:PutEvents`, `dynamodb:GetItem/UpdateItem` (Config e Counting tables) e\n  `states:ListExecutions`.\n- `OrderManagerStateMachine` (`backends/5-order-manager/statemachine/om.asl.json`).\n- `OrderJourneyService` (`backends/8-order-journey/statemachine/StepFunction.asl.json`).\n\n### Bootstrap de dados\n\n`FillDatabasesCustomResource` (Lambda) + `DeploymentCustomResourcePrefil`\n(`AWS::CloudFormation::CustomResource`) rodam automaticamente em **Create/Update** da stack para\npopular `ConfigTable` e `CountingTable` com o cardápio inicial e os contadores zerados —\nver [`02-lambdas.md`](./02-lambdas.md#25-fillDatabasesCustomResource).\n\n---\n\n## 1.3 Diagrama de infraestrutura (deploy view)\n\n```mermaid\nflowchart TB\n    subgraph Core[\"Stack: serverlesspresso-core (00-baseCore)\"]\n        Bus([\"EventBridge bus\\nServerlesspresso\"])\n        UP[\"Cognito UserPool\\n+ 4 auth-challenge triggers\"]\n        IdP[\"Identity Pool\\n(auth + unauth roles)\"]\n        IoTEP[\"IoT Core endpoint\\n(custom resource)\"]\n        LogsRule[\"LogsRule → CloudWatch Logs\"]\n    end\n\n    subgraph AppCore[\"Stack: serverlesspresso (01-appCore)\"]\n        subgraph DDB[\"DynamoDB\"]\n            ConfigTable\n            CountingTable\n            ValidatorTable[\"ApplicationTable / ValidatorTable\"]\n            OrderTable\n            JourneyEventsTable[\"OrderJourneyEventsTable\"]\n        end\n        subgraph SFN[\"Step Functions\"]\n            OP[\"OrderProcessorStateMachine\"]\n            OM[\"OrderManagerStateMachine\"]\n            OJ[\"OrderJourneyService\"]\n        end\n        subgraph APIs[\"API Gateway (REST)\"]\n            ConfigAPI[\"Config API\"]\n            OrderMgrAPI[\"Order Manager API\"]\n            ValidatorAPI[\"Validator API\"]\n        end\n        S3J[(\"JourneyBucket (S3)\")]\n        CF[\"CloudFront\"]\n    end\n\n    Bus --- LogsRule\n    UP --- IdP\n    IdP -. iot:Connect/Subscribe .-> IoTEP\n\n    ConfigAPI --> ConfigTable\n    OrderMgrAPI --> OrderTable\n    OrderMgrAPI --> OM\n    ValidatorAPI --> ValidatorTable\n    ValidatorAPI -- \"Validator.NewOrder\" --> Bus\n\n    Bus --> OP\n    OP --> ConfigTable\n    OP --> CountingTable\n    OP --> Bus\n\n    Bus --> OM\n    OM --> OrderTable\n    OM --> ConfigTable\n    OM --> Bus\n\n    Bus --> OJ\n    OJ --> JourneyEventsTable\n    OJ --> S3J --> CF\n```\n", "02-lambdas.md": "# 2. Catálogo de Lambdas\n\nTodas as funções Lambda do repositório (Node.js 14.x, `aws-sdk` v2), agrupadas pelo serviço a que\npertencem. Para cada uma: **gatilho**, **o que faz**, **entrada/saída relevantes** e\n**efeitos colaterais** (o que ela lê/grava/publica).\n\nLegenda de gatilho: 🌐 API Gateway · 📬 regra EventBridge · 🔀 tarefa de Step Functions ·\n🗄️ DynamoDB Stream · 🔑 gatilho do Cognito · 🏗️ Custom Resource (CloudFormation).\n\n---\n\n## 00-baseCore — Autenticação e bootstrap de infra\n\n### `GetIoTEndpointFunction` — `00-baseCore/GetIoTEndpoint.js`\n🏗️ Custom Resource, chamado uma vez no deploy.\nChama `iot:DescribeEndpoint` e devolve o endpoint de dados do IoT Core para o CloudFormation\nexpor como output (`IotEndpointAddress`), consumido pelos frontends para abrir a conexão MQTT.\n\n### `DefineAuthChallenge` — `cognito-triggers/define-auth-challenge.js`\n🔑 Cognito **Define Auth Challenge** trigger.\nMáquina de estados do fluxo de login sem senha: decide se emite tokens, falha a autenticação\n(após ≥3 tentativas erradas) ou repete o desafio `CUSTOM_CHALLENGE`. Também contorna um bug\nconhecido do SDK iOS que reenvia `SRP_A` em vez de `CUSTOM_CHALLENGE`.\n\n### `CreateAuthChallenge` — `cognito-triggers/create-auth-challenge.js`\n🔑 Cognito **Create Auth Challenge** trigger.\nGera um código OTP de 6 dígitos (`crypto-secure-random-digit`) e envia por **SMS via SNS** para o\n`phone_number` do usuário. Em tentativas subsequentes da mesma sessão, reaproveita o código já\nenviado (extraído do `challengeMetadata`) em vez de gerar um novo.\n\n### `VerifyAuthChallengeResponse` — `cognito-triggers/verify-auth-challenge-response.js`\n🔑 Cognito **Verify Auth Challenge Response** trigger.\nCompara a resposta do usuário (`challengeAnswer`) com o `passCode` esperado; simples igualdade\nde string.\n\n### `PreSignUp` — `cognito-triggers/pre-sign-up.js`\n🔑 Cognito **Pre Sign-up** trigger.\nSempre `autoConfirmUser = true` e `autoVerifyPhone = true` — dispensa o fluxo padrão de\nconfirmação, já que o próprio OTP de login cumpre esse papel.\n\n### `FillDatabasesCustomResource` — `01-appCore/initDB/app.js` (+ `initMenu.js`)\n🏗️ Custom Resource (`Create`/`Update`/`Delete`).\nEm `Create`/`Update`, chama `initMenu()`, que faz um `BatchWriteItem` carregando\n`initMenuState.JSON` em `ConfigTable` (cardápio + config inicial) e `initCountingState.JSON` em\n`CountingTable` (contadores zerados). Implementa manualmente o protocolo de resposta\npré-assinada do CloudFormation (`sendResponse` via HTTPS PUT).\n\n---\n\n## 8-order-journey\n\n### `GenerateHtml` — `functions/GenerateHtml/app.js`\n🔀 Tarefa da `OrderJourneyService` state machine (state **\"Generate HTML\"**).\nRecebe o resultado de uma DynamoDB `Query` (todos os eventos daquele `orderId`, já ordenados) e\nmonta, em memória, uma página HTML de linha do tempo (\"order journey\"): um bloco por evento\n(título amigável extraído do `detail-type`, mensagem, timestamp), escolhe a imagem do diagrama do\nStep Functions (sucesso vs. cancelamento) e adiciona um botão de compartilhar no Twitter. Devolve\n`{ html, fileName }`; a state machine grava esse HTML no S3 no state seguinte (\"Save to S3\").\n⚠️ **Nota**: as URLs de assets estáticos (CSS/JS/imagens) estão *hardcoded* para um bucket\nespecífico (`serverlesspresso-order-journey-journeybucket-1lc9wg7eac1f4.s3.us-west-2...`), não\npara o bucket real criado pela stack (`JourneyBucket`) — só funciona porque aquele bucket\nespecífico do ambiente de referência da AWS ainda hospeda os assets estáticos.\n\n---\n\n## 6-publisher-service — ponte EventBridge → IoT Core (MQTT)\n\nTrês funções quase idênticas: recebem um evento do EventBridge e o republicam em um tópico MQTT\ndo IoT Core, para que os frontends (inscritos via WebSocket/MQTT) recebam updates sem fazer\npolling.\n\n### `PublisherFunctionAdmin` — `code/publishToIOT.js`\n📬 Regra: `detail-type` com prefixo `OrderManager.` / `OrderProcessor.` / `Validator.` /\n`ConfigService.`.\nPublica em `serverlesspresso-admin-<eventId>` — canal do **dashboard do barista/admin**.\n\n### `PublisherFunctionUser` — `code/publishToIOTuserTopic.js`\n📬 Regra: prefixo `OrderManager.` ou `OrderProcessor.`.\nPublica em `serverlesspresso-user-<userId>` — canal **por cliente**, para o app do cliente ver o\nstatus do seu próprio pedido em tempo real.\n\n### `PublisherFunctionConfig` — `code/publishToIOTconfig.js`\n📬 Regra: prefixo `ConfigService.`.\nPublica em `serverlesspresso-config-<eventId>`. O `eventId` aqui é extraído de forma diferente das\noutras duas: vem do `NewImage.PK.S` do stream do DynamoDB (formato `config-<eventId>`), fazendo\n`split('-')[1]`.\n\n---\n\n## 2-config-service\n\n### `ConfigChangedFunction` — `code/configChanged.js`\n🗄️ DynamoDB Stream de `ConfigTable` (`BatchSize: 1`, `TRIM_HORIZON`).\nA cada alteração na tabela (ex.: barista abre/fecha a loja via `PUT /store`, ou atualização de\ncardápio), publica `ConfigService.ConfigChanged` no EventBridge com o `NewImage` completo. É o\núnico produtor de eventos do serviço — não expõe lógica de negócio própria, só *observa* mudanças\nfeitas diretamente pela API Gateway na tabela.\n\n---\n\n## 9-validator\n\n### `GetQRcodeFunction` — `code/getCode.js`\n🌐 `GET /qr-code` (exige grupo Cognito `admin`, checado manualmente em\n`requestContext.authorizer.claims['cognito:groups']`).\nGera (ou reaproveita) um **token rotativo por janela de 5 minutos** (`TIME_INTERVAL`) por evento:\ncalcula um `bucket` (`PK = <eventId>-<timeBucketId>`), e se ainda não existir na `ValidatorTable`\npara essa janela, cria um novo com `nanoid(CodeLength)` como código e `availableTokens` copiado do\n`drinksPerBarcode` do `ConfigTable`. Esse `bucket` é o que vira o QR code exibido no balcão.\n\n### `VerifyQRcodeFunction` — `code/verifyCode.js`\n🌐 `POST /qr-code` (Cognito).\nRecalcula o `bucket` da janela de 5 min atual, valida que o `token` enviado bate com\n`bucket.last_code` e que ainda há `availableTokens`. Se válido: decrementa o contador\n(`decrementToken`), gera um novo `orderId` (`nanoid()`), extrai o `userId` do JWT (`sub`) e\n**emite `Validator.NewOrder`** no EventBridge — este é o **evento que dispara toda a jornada do\npedido** (ver [`04-fluxo-pedido-sequencia.md`](./04-fluxo-pedido-sequencia.md)).\n\n### `ddb.js` (módulo compartilhado, não é um handler)\nFunções utilitárias de acesso a `ApplicationTable`/`ValidatorTable`: `getConfig`, `getItem`,\n`saveItem`, `decrementToken` — usadas pelas duas funções acima.\n\n---\n\n## 5-order-manager\n\n### `SanitizeOrderLambda` — `functions/sanitize/app.js`\n🔀 Tarefa da `OrderManagerStateMachine` (state **\"Sanitize order\"**).\nRecebe o pedido (`event.body`, com `drink` + `modifiers`) e o cardápio (`event.menu.Item`, ainda\nno formato bruto do DynamoDB, \"unwrapped\" com `dynamodb-data-types`). Confere se a bebida existe no\ncardápio e se cada modificador pedido está entre as `Options` permitidas para aquela bebida.\nRetorna `true`/`false`. ⚠️ **Nota**: não há checagem de nulidade em `order.modifiers` antes do\n`.map()` — se o app cliente enviar um pedido sem o campo `modifiers`, a função lança exceção em\nvez de devolver `false`; o state `Sanitize order` da state machine tem `Retry` configurado para\nerros de serviço/infra do Lambda, mas não trata esse tipo de erro de payload.\n\n### `WorkFlowStarted` — `functions/workflowStarted/app.js`\n📬 Regra: `detail-type` com prefixo `OrderProcessor.WorkflowStarted`.\nCria o registro inicial do pedido em `OrderTable`: `PK=\"orders\"`, `SK=orderId`,\n`USERID`, `ORDERSTATE=<eventId>-CREATED`, `TaskToken` (o task token do Step Functions do Order\nProcessor, guardado para ser usado depois via `sendTaskSuccess`), `robot` (flag opcional).\n\n### `WaitingCompletion` — `functions/waitingCompletion/app.js`\n📬 Regra: `detail-type` com prefixo `OrderProcessor.WaitingCompletion`.\nAtualiza o registro do pedido com o **novo** `TaskToken` e o `orderNumber` gerado pelo Order\nProcessor (condicionado a `USERID` bater, evitando overwrite cruzado). Em seguida emite\n`OrderManager.WaitingCompletion` com o pedido completo (drinkOrder, estado, etc.) — este evento é\nconsumido pelo `PublisherFunctionUser/Admin` (realtime) e pelo `OrderManagerWaitingCompletionFunction`\ndo serviço de métricas.\n\n### `OrderTimedOut` — `functions/OrderTimedOut/app.js`\n📬 Regra: `detail-type` com prefixo `OrderProcessor.OrderTimeOut`.\nMarca o pedido como `<eventId>-CANCELLED` em `OrderTable`, gravando o `cause` (motivo do timeout,\nex. \"Customer timedout\"/\"Barista timedout\") e o timestamp.\n\n---\n\n## 4-order-processing — funções presentes no repo mas **não usadas** na stack consolidada\n\nEstas duas funções existem em `backends/4-order-processing/functions/`, com seu próprio\n`env.json`/`template.yaml` de teste local, mas **a state machine consolidada (`op.asl.json`)\nimplementa a mesma lógica diretamente em Amazon States Language**, sem chamá-las. Prováveis\nsobras de uma versão anterior/alternativa do workshop — documentadas aqui porque fazem parte do\nrepositório e podem confundir quem está lendo o código pela primeira vez.\n\n### `isCapacityAvailable` — `functions/capacity/isCapacityAvailable.js`\nChamaria `stepFunctions.listExecutions` e compararia contra `MaxQueueCapacity` para decidir se\nainda há vaga na fila. **Equivalente implementado na ASL**: states `ListExecutions` +\n`Is capacity available?` em `op.asl.json`.\n\n### `resumeWF` — `functions/resumeWF/app.js`\nChamaria `stepfunctions.sendTaskSuccess` dado `orderId`+`TaskToken` de um evento.\n**Equivalente implementado na ASL**: states `Resume Order Processor - customer` /\n`Resume Order Processor - Barista` em `om.asl.json`, que chamam\n`arn:aws:states:::aws-sdk:sfn:sendTaskSuccess` diretamente, sem Lambda.\n\n---\n\n## 1-counting-service — idem, código presente mas superado pela ASL\n\n### `getOrderId` — `code/getOrderId.js`\nIncrementaria atomicamente `IDvalue` em `CountingTable` (`PK='orderID'`) e devolveria o\n`orderNumber`. **Na stack consolidada**, o state **\"Generate Order Number\"** do\n`OrderProcessorStateMachine` faz o mesmo `UpdateItem` diretamente via integração nativa do Step\nFunctions com o DynamoDB (chave `orderID-<eventId>`, não `orderID` fixo como nesta versão\nstandalone).\n\n### `resetOrderId` — `code/resetOrderId.js`\nUtilitário administrativo/de demo: zera o contador (`IDvalue = 0`). Não tem gatilho declarado\n(nenhum `template.yaml` na pasta) — é invocado manualmente (ex. `localTest.js`) entre\ndemonstrações.\n\n---\n\n## 7-metrics-service — publica métricas no CloudWatch\n\nStack standalone (`template.yaml` próprio), 4 Lambdas praticamente idênticas: todas assinam um\n`detail-type` específico e escrevem 1 (ou mais) pontos de métrica com\n`cloudWatch.putMetricData`, namespace `${AppName}-dev`.\n\n### `ValidatorNewOrderFunction` — `code/ValidatorNewOrder.js`\n📬 `detail-type` prefixo `Validator.NewOrder`.\nPublica métrica `Drink` (dimensão `Drink=<nome da bebida>`) e uma métrica `Drink` adicional por\ncada modificador pedido (dimensão `Modifier=<modificador>`) — permite ver no CloudWatch quais\nbebidas/modificadores são mais pedidos.\n\n### `OrderManagerOrderCancelledFunction` — `code/OrderManagerOrderCancelled.js`\n📬 `detail-type` prefixo `OrderManager.OrderCancelled`.\nPublica métrica `Order` (dimensão `State=Cancelled`, valor 1).\n\n### `OrderProcessorOrderTimeOutFunction` — `code/OrderProcessorOrderTimeOut.js`\n📬 `detail-type` prefixo `OrderProcessor.OrderTimeOut`.\nPublica métrica `Order` (dimensão `State=Timeout`, valor 1).\n\n### `OrderManagerWaitingCompletionFunction` — `code/OrderManagerWaitingCompletion.js`\n📬 `detail-type` prefixo `OrderManager.WaitingCompletion`.\nPublica métrica `Order` (dimensão `State=Started`, valor 1) — nome um pouco enganoso: mede\n\"pedido aguardando conclusão\", usado como proxy de \"pedido iniciado\".\n\n---\n\n## Tabela-resumo (todas as 25 Lambdas)\n\n| # | Função | Serviço | Gatilho | Grava/Publica em |\n|---|---|---|---|---|\n| 1 | GetIoTEndpointFunction | baseCore | Custom Resource | Output do CFN |\n| 2 | DefineAuthChallenge | baseCore | Cognito | — (controla fluxo) |\n| 3 | CreateAuthChallenge | baseCore | Cognito | SNS (SMS) |\n| 4 | VerifyAuthChallengeResponse | baseCore | Cognito | — |\n| 5 | PreSignUp | baseCore | Cognito | — |\n| 6 | FillDatabasesCustomResource | appCore bootstrap | Custom Resource | ConfigTable, CountingTable |\n| 7 | GenerateHtml | 8-order-journey | Step Functions | (retorno usado p/ S3 no state seguinte) |\n| 8 | PublisherFunctionAdmin | 6-publisher-service | EventBridge | IoT topic `serverlesspresso-admin-*` |\n| 9 | PublisherFunctionUser | 6-publisher-service | EventBridge | IoT topic `serverlesspresso-user-*` |\n| 10 | PublisherFunctionConfig | 6-publisher-service | EventBridge (via Stream) | IoT topic `serverlesspresso-config-*` |\n| 11 | ConfigChangedFunction | 2-config-service | DynamoDB Stream | EventBridge (`ConfigService.ConfigChanged`) |\n| 12 | GetQRcodeFunction | 9-validator | API Gateway | ValidatorTable |\n| 13 | VerifyQRcodeFunction | 9-validator | API Gateway | ValidatorTable, EventBridge (`Validator.NewOrder`) |\n| 14 | SanitizeOrderLambda | 5-order-manager | Step Functions | — (retorna bool) |\n| 15 | WorkFlowStarted | 5-order-manager | EventBridge | OrderTable |\n| 16 | WaitingCompletion | 5-order-manager | EventBridge | OrderTable, EventBridge (`OrderManager.WaitingCompletion`) |\n| 17 | OrderTimedOut | 5-order-manager | EventBridge | OrderTable |\n| 18 | isCapacityAvailable | 4-order-processing (não usada) | — | — |\n| 19 | resumeWF | 4-order-processing (não usada) | — | Step Functions `sendTaskSuccess` |\n| 20 | getOrderId | 1-counting-service (não usada) | — | CountingTable |\n| 21 | resetOrderId | 1-counting-service (utilitário) | manual | CountingTable |\n| 22 | ValidatorNewOrderFunction | 7-metrics-service | EventBridge | CloudWatch Metrics |\n| 23 | OrderManagerOrderCancelledFunction | 7-metrics-service | EventBridge | CloudWatch Metrics |\n| 24 | OrderProcessorOrderTimeOutFunction | 7-metrics-service | EventBridge | CloudWatch Metrics |\n| 25 | OrderManagerWaitingCompletionFunction | 7-metrics-service | EventBridge | CloudWatch Metrics |\n\n> As Lambdas das **extensões opcionais** (`extensions/`) ficam fora desta contagem por não\n> fazerem parte do core do domínio; estão descritas em\n> [`03-sistemas.md#extensões-opcionais`](./03-sistemas.md#5-extensões-opcionais).\n"};
mermaid.initialize({startOnLoad:false, theme:'default'});
const nav = document.getElementById('nav'), doc = document.getElementById('doc');
const keys = Object.keys(F).sort((a,b)=> (a.includes('RELATORIO')?-1:0) - (b.includes('RELATORIO')?-1:0) || a.localeCompare(b));
async function show(k){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.k===k));
  let t = F[k], fm = '';
  const m = t.match(/^---\n([\s\S]*?)\n---\n?/);
  if (m) { fm = '<div class="fm">'+m[1].replace(/</g,'&lt;')+'</div>'; t = t.slice(m[0].length); }
  let h = marked.parse(t);
  h = h.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g, (_, c) => '<div class="mermaid">'+c+'</div>');
  doc.innerHTML = '<p style="color:var(--muted);font-size:12px">'+k+'</p>' + fm + h;
  doc.querySelectorAll('.mermaid').forEach(el => { el.textContent = el.textContent.replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&'); });
  try { await mermaid.run({nodes: doc.querySelectorAll('.mermaid')}); } catch(e) { console.warn(e); }
}
keys.forEach(k => { const a = document.createElement('a'); a.href='#'; a.textContent=k; a.dataset.k=k; a.onclick=e=>{e.preventDefault();show(k)}; nav.appendChild(a); });
show(keys[0]);
</script></body></html>
