 "proposed", "titulo": "get-iot-endpoint", "resumo": "Custom Resource que descobre o endpoint de dados do AWS IoT Core da conta, para o `publisher-service` publicar mensagens MQTT.", "caminho": "sistemas/nucleo-serverlesspresso/componentes/get-iot-endpoint.md", "realiza": ["sys-nucleo-serverlesspresso"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# get-iot-endpoint\nCustom Resource que descobre o endpoint de dados do AWS IoT Core da conta, para o `publisher-service` publicar mensagens MQTT.\n\n| Campo | Valor |\n|---|---|\n| Tipo | job (Lambda-backed CloudFormation Custom Resource) |\n| Gatilho | `Custom::IotEndpoint` no ciclo de vida do CloudFormation |\n| Entrada | Nenhuma (chama `iot:DescribeEndpoint`) |\n| Saída | `IotEndpointAddress`, exportado como output da pilha e como parâmetro SSM |\n| Timeout / memória / concorrência | 3 s / 128 MB |\n\n## Dependências\n- AWS IoT (`iot:DescribeEndpoint`)\n\n## Erros e retentativas\nNão há tratamento de erro visível no arquivo lido (arquivo fora do escopo detalhado desta extração); assume-se o comportamento padrão de Custom Resource (falha reportada ao CloudFormation).\n"}, {"id": "cmp-nucleo-pre-sign-up", "kind": "component", "camada": 5, "status": "proposed", "titulo": "pre-sign-up", "resumo": "Confirma automaticamente o cadastro do cliente por telefone, sem exigir verificação manual.", "caminho": "sistemas/nucleo-serverlesspresso/componentes/pre-sign-up.md", "realiza": ["sys-nucleo-serverlesspresso"], "realizado_por": ["res-user-pool-cognito"], "extracoes": ["extracted"], "conflito": false, "corpo": "# pre-sign-up\nConfirma automaticamente o cadastro do cliente por telefone, sem exigir verificação manual.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda (Cognito trigger `PreSignUp`) |\n| Gatilho | Tentativa de cadastro no User Pool |\n| Entrada | Evento padrão do trigger `PreSignUp` do Cognito |\n| Saída | `autoConfirmUser: true`, `autoVerifyPhone: true` |\n| Timeout / memória / concorrência | Não definido explicitamente no template (padrão SAM) |\n\n## Dependências\n- Cognito User Pool (invocado por ele; sem chamada de saída)\n\n## Erros e retentativas\nSem tratamento de erro; qualquer exceção falha o cadastro (comportamento padrão do Cognito).\n"}, {"id": "cmp-nucleo-verify-auth-challenge", "kind": "component", "camada": 5, "status": "proposed", "titulo": "verify-auth-challenge-response", "resumo": "Confere se o código de 6 dígitos digitado pelo usuário bate com o gerado.", "caminho": "sistemas/nucleo-serverlesspresso/componentes/verify-auth-challenge-response.md", "realiza": ["sys-nucleo-serverlesspresso"], "realizado_por": ["res-user-pool-cognito"], "extracoes": ["extracted"], "conflito": false, "corpo": "# verify-auth-challenge-response\nConfere se o código de 6 dígitos digitado pelo usuário bate com o gerado.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda (Cognito trigger `VerifyAuthChallengeResponse`) |\n| Gatilho | Usuário submete o código recebido por SMS |\n| Entrada | `event.request.{challengeAnswer, privateChallengeParameters.passCode}` |\n| Saída | `event.response.answerCorrect` |\n| Timeout / memória / concorrência | Não definido explicitamente |\n\n## Dependências\n- Nenhuma chamada externa\n\n## Erros e retentativas\nComparação simples de string; sem rate limiting próprio (depende do limite de tentativas do `define-auth-challenge`).\n"}, {"id": "sys-nucleo-serverlesspresso", "kind": "system", "camada": 4, "status": "proposed", "titulo": "nucleo-serverlesspresso", "resumo": "Pilha fundacional (`00-baseCore`): cria o barramento de eventos, o fluxo de autenticação sem senha do Cognito (login por SMS com código de 6 dígitos) e descobre o endpoint do AWS IoT Core usado pelo `publisher-service`.", "caminho": "sistemas/nucleo-serverlesspresso/ficha.md", "realiza": ["sub-nucleo-e-identidade"], "realizado_por": ["cmp-nucleo-get-iot-endpoint", "cmp-nucleo-pre-sign-up", "cmp-nucleo-define-auth-challenge", "cmp-nucleo-create-auth-challenge", "cmp-nucleo-verify-auth-challenge", "res-event-bus-serverlesspresso", "res-user-pool-cognito", "res-identity-pool-cognito", "res-iot-core-realtime"], "extracoes": ["extracted"], "conflito": false, "corpo": "# nucleo-serverlesspresso\nPilha fundacional (`00-baseCore`): cria o barramento de eventos, o fluxo de autenticação sem senha do Cognito (login por SMS com código de 6 dígitos) e descobre o endpoint do AWS IoT Core usado pelo `publisher-service`.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Núcleo e identidade |\n| Dono | Não identificado |\n| Stack | AWS SAM (CloudFormation), Node.js 14.x para as lambdas |\n| Repositório | `00-baseCore/` |\n| Criticidade | Máxima — todos os outros sistemas dependem do bus e/ou do User Pool desta pilha (via SSM Parameter Store) |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph nucleo-serverlesspresso\n    BUS[[EventBridge Serverlesspresso]]\n    UP[Cognito User Pool]\n    IP[Cognito Identity Pool]\n    IOT[(IoT Core endpoint)]\n    L1[pre-sign-up]\n    L2[define-auth-challenge]\n    L3[create-auth-challenge]\n    L4[verify-auth-challenge-response]\n    L5[get-iot-endpoint]\n  end\n  UP --> L1\n  UP --> L2\n  UP --> L3\n  UP --> L4\n  L5 --> IOT\n  UP --> IP\n```\n\n## Expõe\n- `ServerlesspressoEventBus` (EventBridge) — usado por todos os sistemas do domínio para publicar/consumir eventos\n- User Pool / Identity Pool (Cognito) — autenticação usada por todas as APIs do domínio\n- Endpoint do IoT Core — usado pelo `publisher-service`\n\n## Consome\nNenhuma dependência de outro sistema do domínio.\n\n## Dados\nNenhum banco de dados próprio (apenas um `LogGroupForEvents` para depurar eventos do bus).\n\n## Estados\nN/A.\n\n## Qualidade\n- Autenticação: MFA desligada, política de senha mínima (o \"segredo\" real é o código de 6 dígitos enviado por SMS via SNS)\n- `GetIoTEndpointFunction` é um Custom Resource do CloudFormation — roda uma vez por deploy, não a cada requisição\n- Outputs desta pilha (User Pool ID, ARN do bus, endpoint IoT) são publicados em **AWS Systems Manager Parameter Store**, e é assim que `01-appCore` e os módulos standalone (`8-order-journey`, `9-validator`, `7-metrics-service`) os descobrem — ver `infraestrutura/ambientes/`\n"}, {"id": "cmp-order-journey-generate-html", "kind": "component", "camada": 5, "status": "proposed", "titulo": "generate-html", "resumo": "Monta o HTML da linha do tempo do pedido (imagens, mensagens amigáveis de cada evento, botão de compartilhar no Twitter/X).", "caminho": "sistemas/order-journey-service/componentes/generate-html.md", "realiza": ["sys-order-journey-service"], "realizado_por": ["res-journey-bucket-s3"], "extracoes": ["extracted"], "conflito": false, "corpo": "# generate-html\nMonta o HTML da linha do tempo do pedido (imagens, mensagens amigáveis de cada evento, botão de compartilhar no Twitter/X).\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda |\n| Gatilho | Invocação direta (`lambda:invoke`) pela `order-journey-state-machine`, só quando o pedido termina |\n| Entrada | `{dbResults, EndTime, orderId}` (resultado da Query na tabela de jornada) |\n| Saída | `{html, fileName}` — devolvido ao SFN, que grava em S3 |\n| Timeout / memória / concorrência | 3 s / 128 MB |\n\n## Dependências\n- Nenhuma chamada externa dentro da própria função (o `S3.putObject` está comentado no código-fonte — quem grava é o state seguinte do SFN, `Save to S3`, direto)\n\n## Erros e retentativas\nSem `try/catch`; se `dbResults.Items` vier vazio, `dbResults.Items[0].PK.S` lança e a função falha (coberta pelo retry do SFN chamador).\n"}, {"id": "cmp-order-journey-state-machine", "kind": "component", "camada": 5, "status": "proposed", "titulo": "order-journey-state-machine", "resumo": "Grava cada evento do domínio como uma linha na tabela de jornada; ao ver `OrderProcessor.orderFinished`, busca todo o histórico do pedido e manda montar a página HTML.", "caminho": "sistemas/order-journey-service/componentes/order-journey-state-machine.md", "realiza": ["sys-order-journey-service"], "realizado_por": ["res-ddb-order-journey-events-table", "cmp-order-journey-generate-html"], "extracoes": ["extracted"], "conflito": false, "corpo": "# order-journey-state-machine\nGrava cada evento do domínio como uma linha na tabela de jornada; ao ver `OrderProcessor.orderFinished`, busca todo o histórico do pedido e manda montar a página HTML.\n\n| Campo | Valor |\n|---|---|\n| Tipo | job (Step Functions Standard Workflow) |\n| Gatilho | Regra EventBridge que casa **qualquer** evento com `source: awsserverlessda.serverlesspresso` (sem filtro de `detail-type`) |\n| Entrada | Evento completo do EventBridge |\n| Saída | `PutItem` em `OrderJourneyEventsTable`; ou, se `orderFinished`, arquivo HTML em S3 |\n| Timeout / memória / concorrência | Sem timeout global |\n\n## Dependências\n- `OrderJourneyEventsTable` — `PutItem`/`Query` direto (sem lambda, via `${DDBPutItem}`/`${DDBQuery}`)\n- Lambda `generate-html`\n- `JourneyBucket` (S3) — `PutObject` direto (`${S3BucketPut}`), com `Acl: public-read`\n\n## Erros e retentativas\n- Chamada à lambda `Generate HTML`: retry de 6 tentativas, backoff x2, 2 s inicial\n- Eventos sem `$.detail.userId` terminam cedo no state `Not a user event`, sem gravar nada\n"}, {"id": "sys-order-journey-service", "kind": "system", "camada": 4, "status": "proposed", "titulo": "order-journey-service", "resumo": "Grava **todos** os eventos do domínio (não só os do pedido) em uma tabela própria e, quando um pedido termina, monta uma página HTML com a linha do tempo do pedido e a publica em S3/CloudFront.", "caminho": "sistemas/order-journey-service/ficha.md", "realiza": ["sub-pedido"], "realizado_por": ["cmp-order-journey-state-machine", "cmp-order-journey-generate-html", "res-ddb-order-journey-events-table", "res-journey-bucket-s3", "res-journey-cloudfront"], "extracoes": ["extracted"], "conflito": false, "corpo": "# order-journey-service\nGrava **todos** os eventos do domínio (não só os do pedido) em uma tabela própria e, quando um pedido termina, monta uma página HTML com a linha do tempo do pedido e a publica em S3/CloudFront.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Pedido |\n| Dono | Não identificado |\n| Stack | Step Functions + Lambda (Node.js 14.x) + S3 + CloudFront |\n| Repositório | `backends/8-order-journey/`; recursos em `01-appCore/template.yaml` |\n| Criticidade | Baixa — funcionalidade de \"recibo\"/compartilhamento, não bloqueia o fluxo do pedido |\n\n## Contêineres\n```mermaid\nflowchart LR\n  BUS[[EventBridge Serverlesspresso]]\n  subgraph order-journey-service\n    SFN[order-journey-state-machine]\n    L1[generate-html]\n  end\n  BUS -->|TODOS os eventos do source,<br/>sem filtro de detail-type| SFN\n  SFN --> DB[(OrderJourneyEventsTable)]\n  SFN -->|orderFinished: Query + invoke| L1\n  L1 --> S3[(JourneyBucket)]\n  S3 --> CF[CloudFront]\n```\n\n## Expõe\nPágina estática em `JourneyBucket`, servida via `JourneyCloudFront` (sem contrato de API formal).\n\n## Consome\n| Sistema | Contrato | Tipo |\n|---|---|---|\n| validator-service, order-processing-service, order-manager-service, config-service | Todos os eventos do bus (`source: awsserverlessda.serverlesspresso`, sem filtro de `detail-type`) | Evento (EventBridge) |\n\n## Dados\n```mermaid\nerDiagram\n  JOURNEY_EVENT {\n    string PK \"orderId\"\n    string SK \"timestamp do evento\"\n    string detailType\n    string orderDetails \"JSON serializado\"\n    string userId\n  }\n```\nTabela `OrderJourneyEventsTable` (nome gerado pelo CloudFormation).\n\n## Estados\nN/A (tabela de log de eventos, não de entidade com ciclo de vida).\n\n## Qualidade\n- `Generate HTML`: retry de 6 tentativas, backoff x2, 2 s inicial\n- A regra do EventBridge (`EventRuleStartOrderJourneySFN`) filtra só por `source`, **não por `detail-type`** — a state machine é iniciada para 100% dos eventos do domínio, inclusive os que não têm `orderId` (tratados no state `Not a user event`)\n- URLs de CSS/JS/imagens estão **hardcoded** no código da lambda `generate-html` (bucket de uma conta/região específicas) — ver `RELATORIO.md`\n"}, {"id": "cmp-order-manager-state-machine", "kind": "component", "camada": 5, "status": "proposed", "titulo": "order-manager-state-machine", "resumo": "Decide, pelo campo `action` recebido, se está tratando o envio do pedido pelo cliente, a reivindicação/liberação pelo barista, ou a conclusão/cancelamento — e em qualquer um dos últimos dois casos, acorda o `order-processing-service` com `S", "caminho": "sistemas/order-manager-service/componentes/order-manager-state-machine.md", "realiza": ["sys-order-manager-service"], "realizado_por": ["cmp-order-manager-sanitize-order", "res-ddb-order-table"], "extracoes": ["extracted"], "conflito": false, "corpo": "# order-manager-state-machine\nDecide, pelo campo `action` recebido, se está tratando o envio do pedido pelo cliente, a reivindicação/liberação pelo barista, ou a conclusão/cancelamento — e em qualquer um dos últimos dois casos, acorda o `order-processing-service` com `SendTaskSuccess`.\n\n| Campo | Valor |\n|---|---|\n| Tipo | job (Step Functions Standard Workflow) |\n| Gatilho | `PUT /orders/{id}` via API Gateway → `states:StartExecution` **direto** (sem lambda); a rota é compartilhada entre cliente (monta pedido) e barista (make/unmake/complete/cancel), diferenciados pelo campo `action` no corpo |\n| Entrada | `{action, eventId, body, orderId, baristaUserId}` (montado pelo VTL da API Gateway a partir do path, query string e corpo) |\n| Saída | Nenhuma direta ao chamador (API Gateway não espera o resultado do SFN); efeitos são via DynamoDB e `events:putEvents`/`SendTaskSuccess` |\n| Timeout / memória / concorrência | Sem timeout global definido no ASL |\n\n## Dependências\n- `serverlesspresso-order-table` — leitura/escrita do estado do pedido\n- `ConfigTable` — leitura do cardápio (`get menu`)\n- Lambda `sanitize-order` — valida a bebida/modificadores\n- EventBridge `Serverlesspresso` — publica os 3 eventos `OrderManager.*`\n- `order-processing-service` — `states:SendTaskSuccess` (retoma a execução do cliente e depois a do barista)\n\n## Erros e retentativas\n- Pedido fora do cardápio: termina em `Succeed` sem propagar erro nem notificar ninguém (ver `RELATORIO.md`)\n- Chamada à lambda `sanitize-order`: retry de 6 tentativas, backoff x2, 2 s inicial, para `Lambda.ServiceException`/`AWSLambdaException`/`SdkClientException`\n"}, {"id": "cmp-order-manager-order-timed-out", "kind": "component", "camada": 5, "status": "proposed", "titulo": "order-timed-out", "resumo": "Marca o pedido como cancelado quando o cliente ou o barista estouram o tempo limite no `order-processing-service`.", "caminho": "sistemas/order-manager-service/componentes/order-timed-out.md", "realiza": ["sys-order-manager-service"], "realizado_por": ["res-ddb-order-table"], "extracoes": ["extracted"], "conflito": false, "corpo": "# order-timed-out\nMarca o pedido como cancelado quando o cliente ou o barista estouram o tempo limite no `order-processing-service`.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda |\n| Gatilho | Evento EventBridge `detail-type` com prefixo `OrderProcessor.OrderTimeOut` |\n| Entrada | `event.detail.{orderId, eventId, cause}` |\n| Saída | Nenhuma (grava e termina) |\n| Timeout / memória / concorrência | 15 s / 128 MB |\n\n## Dependências\n- `serverlesspresso-order-table` — `UpdateItem` (`ORDERSTATE={eventId}-CANCELLED`, `reason=cause`)\n\n## Erros e retentativas\nSem `Retry`/DLQ configurados.\n"}, {"id": "cmp-order-manager-rest-api-orders", "kind": "component", "camada": 5, "status": "proposed", "titulo": "rest-api-orders", "resumo": "As 3 rotas da API de pedidos usadas pelos apps de cliente e barista. **Nenhuma delas passa por uma lambda** — são integrações diretas do API Gateway (`x-amazon-apigateway-integration type: aws`) com DynamoDB e Step Functions, usando Velocit", "caminho": "sistemas/order-manager-service/componentes/rest-api-orders.md", "realiza": ["sys-order-manager-service"], "realizado_por": ["res-ddb-order-table", "cmp-order-manager-state-machine", "res-rest-api-order-manager"], "extracoes": ["extracted"], "conflito": false, "corpo": "# rest-api-orders\nAs 3 rotas da API de pedidos usadas pelos apps de cliente e barista. **Nenhuma delas passa por uma lambda** — são integrações diretas do API Gateway (`x-amazon-apigateway-integration type: aws`) com DynamoDB e Step Functions, usando Velocity Template Language (VTL) para montar a requisição.\n\n| Campo | Valor |\n|---|---|\n| Tipo | endpoint (API Gateway REST, integração direta, sem lambda) |\n| Gatilho | `GET /orders`, `GET /orders/{id}`, `PUT /orders/{id}` — autenticação Cognito User Pools (`ServerlespressoAuth`) |\n| Entrada | `GET /orders`: query `state`, `eventId`, `maxItems` (monta uma Query no GSI `GSI-status`). `GET /orders/{id}`: path `id` (GetItem por `PK=orders`/`SK=id`). `PUT /orders/{id}`: path `id`, query `action`/`eventId`, corpo do pedido, `sub` do JWT como `baristaUserId` — inicia a `order-manager-state-machine` |\n| Saída | `GET /orders`: lista de pedidos do estado pedido. `GET /orders/{id}`: `{orderId, drinkOrder, orderState, TS}`. `PUT /orders/{id}`: `200` vazio (execução do SFN é assíncrona) |\n| Timeout / memória / concorrência | N/A (sem lambda; limites padrão do API Gateway) |\n\n## Dependências\n- `serverlesspresso-order-table` — via role `RESTApiRole` (`dynamodb:GetItem`, `dynamodb:Query`)\n- `order-manager-state-machine` — via `states:StartExecution` na mesma role\n\n## Erros e retentativas\nSem lambda, então sem retry de aplicação; erros de VTL ou de permissão aparecem como erro genérico do API Gateway (5xx) sem tratamento customizado observado no `api.yaml`.\n"}, {"id": "cmp-order-manager-sanitize-order", "kind": "component", "camada": 5, "status": "proposed", "titulo": "sanitize-order", "resumo": "Confere se a bebida pedida e seus modificadores existem no cardápio vigente antes de gravar o pedido.", "caminho": "sistemas/order-manager-service/componentes/sanitize-order.md", "realiza": ["sys-order-manager-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# sanitize-order\nConfere se a bebida pedida e seus modificadores existem no cardápio vigente antes de gravar o pedido.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda |\n| Gatilho | Invocação direta (`lambda:invoke`) pela `order-manager-state-machine` |\n| Entrada | `{body: {drink, modifiers, userId}, menu: {Item: <cardápio em formato DynamoDB AttributeValue>}}` |\n| Saída | `true`/`false` (booleano) |\n| Timeout / memória / concorrência | 20 s / 128 MB |\n\n## Dependências\n- Nenhuma chamada externa; opera só sobre o payload recebido (usa `dynamodb-data-types` para \"desembrulhar\" o formato DynamoDB do cardápio)\n\n## Erros e retentativas\nSem tratamento de exceção explícito no código — se `event.menu.Item` vier vazio/malformado, a função lança e a state machine aplica o `Retry` de 6 tentativas configurado no state `Sanitize order`. Nota de qualidade: a função não tem bloco `try/catch`, então qualquer erro de parsing derruba a invocação inteira.\n"}, {"id": "cmp-order-manager-waiting-completion", "kind": "component", "camada": 5, "status": "proposed", "titulo": "waiting-completion", "resumo": "Grava o número do pedido e o novo Task Token (o que vai destravar o barista) e avisa o resto do sistema que o pedido está na fila, pronto para ser preparado.", "caminho": "sistemas/order-manager-service/componentes/waiting-completion.md", "realiza": ["sys-order-manager-service"], "realizado_por": ["res-ddb-order-table", "res-event-bus-serverlesspresso"], "extracoes": ["extracted"], "conflito": false, "corpo": "# waiting-completion\nGrava o número do pedido e o novo Task Token (o que vai destravar o barista) e avisa o resto do sistema que o pedido está na fila, pronto para ser preparado.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda |\n| Gatilho | Evento EventBridge `detail-type` com prefixo `OrderProcessor.WaitingCompletion` |\n| Entrada | `event.detail.{orderId, userId, TaskToken, orderNumber, eventId}` |\n| Saída | Publica `OrderManager.WaitingCompletion` no bus |\n| Timeout / memória / concorrência | 15 s / 128 MB |\n\n## Dependências\n- `serverlesspresso-order-table` — `UpdateItem` condicionado a `USERID` bater (`ConditionExpression`)\n- EventBridge `Serverlesspresso` — publica o evento consumido por publisher, journey, métricas e extensões\n\n## Erros e retentativas\nSe a condição (`USERID` diferente) falhar, o `UpdateItem` lança e não há `Retry` configurado — a mensagem é perdida (sem DLQ na regra do EventBridge).\n"}, {"id": "cmp-order-manager-workflow-started", "kind": "component", "camada": 5, "status": "proposed", "titulo": "workflow-started", "resumo": "Cria o registro inicial do pedido assim que o `order-processing-service` sinaliza que está esperando o cliente montar a bebida.", "caminho": "sistemas/order-manager-service/componentes/workflow-started.md", "realiza": ["sys-order-manager-service"], "realizado_por": ["res-ddb-order-table"], "extracoes": ["extracted"], "conflito": false, "corpo": "# workflow-started\nCria o registro inicial do pedido assim que o `order-processing-service` sinaliza que está esperando o cliente montar a bebida.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda |\n| Gatilho | Evento EventBridge `detail-type` com prefixo `OrderProcessor.WorkflowStarted` |\n| Entrada | `event.detail.{orderId, userId, TaskToken, eventId, robot}` |\n| Saída | Nenhuma (grava e termina) |\n| Timeout / memória / concorrência | 15 s / 128 MB |\n\n## Dependências\n- `serverlesspresso-order-table` — `PutItem` (`PK=orders`, `SK=orderId`, `ORDERSTATE={eventId}-CREATED`, `TaskToken`)\n\n## Erros e retentativas\nSem `Retry`/DLQ configurados na regra do EventBridge nem na função.\n"}, {"id": "ctr-order-manager-make-order", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "OrderManager.MakeOrder", "resumo": "{", "caminho": "sistemas/order-manager-service/contratos/order-manager-make-order.md", "realiza": ["sys-order-manager-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# OrderManager.MakeOrder\n| Campo | Valor |\n|---|---|\n| Tipo | evento (EventBridge) |\n| Produtor | order-manager-service (`order-manager-state-machine`, states `Make OR Unmake?`/`Transform record`) |\n| Consumidores | publisher-service, order-journey-service |\n| Especificação | Sem AsyncAPI formal |\n\n## Exemplo\n```json\n{\n  \"baristaUserId\": \"cognito-sub-do-barista\",\n  \"orderId\": \"V1StGXR8_Z5jdHi6B-myT\",\n  \"eventId\": \"ABC\",\n  \"userId\": \"cognito-sub-do-cliente\",\n  \"Message\": \"The barista has pressed the 'Make order' button...\"\n}\n```\n"}, {"id": "ctr-order-manager-order-state-changed", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "OrderManager.Order{eventId}-COMPLETED / OrderManager.Order{eventId}-CANCELLED", "resumo": "{", "caminho": "sistemas/order-manager-service/contratos/order-manager-order-state-changed.md", "realiza": ["sys-order-manager-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# OrderManager.Order{eventId}-COMPLETED / OrderManager.Order{eventId}-CANCELLED\n| Campo | Valor |\n|---|---|\n| Tipo | evento (EventBridge); `detail-type` é montado dinamicamente com `States.Format('OrderManager.Order{}', $.detail.ORDERSTATE)` |\n| Produtor | order-manager-service (`order-manager-state-machine`, states `Complete Order`/`Cancel Order`) |\n| Consumidores | order-journey-service (decide qual imagem de diagrama mostrar), publisher-service |\n| Especificação | Sem AsyncAPI formal. **Nome de evento incomum**: o próprio `eventId` do pedido vira parte do `detail-type` (ex.: `OrderManager.OrderABC-COMPLETED`), o que dificulta criar uma regra EventBridge só com `prefix` — ver `RELATORIO.md` |\n\n## Exemplo\n```json\n{\n  \"eventId\": \"ABC\",\n  \"orderId\": \"V1StGXR8_Z5jdHi6B-myT\",\n  \"userId\": \"cognito-sub\",\n  \"ORDERSTATE\": \"ABC-COMPLETED\",\n  \"Message\": \"Barrista has cancelled or completed the order\"\n}\n```\n"}, {"id": "ctr-order-manager-waiting-completion", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "OrderManager.WaitingCompletion", "resumo": "{", "caminho": "sistemas/order-manager-service/contratos/order-manager-waiting-completion.md", "realiza": ["sys-order-manager-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# OrderManager.WaitingCompletion\n| Campo | Valor |\n|---|---|\n| Tipo | evento (EventBridge) |\n| Produtor | order-manager-service (`waiting-completion`) |\n| Consumidores | publisher-service, order-journey-service, metrics-service, extensão persist-metrics-dynamodb (via SQS), extensão wait-times |\n| Especificação | Sem AsyncAPI formal |\n\n## Exemplo\n```json\n{\n  \"orderId\": \"V1StGXR8_Z5jdHi6B-myT\",\n  \"orderNumber\": \"42\",\n  \"state\": \"ABC-WAITING\",\n  \"drinkOrder\": { \"drink\": \"Latte\", \"modifiers\": [\"Oat milk\"] },\n  \"userId\": \"cognito-sub\",\n  \"robot\": false,\n  \"eventId\": \"ABC\",\n  \"TS\": 1732550400000\n}\n```\n"}, {"id": "sys-order-manager-service", "kind": "system", "camada": 4, "status": "proposed", "titulo": "order-manager-service", "resumo": "Guarda o estado de cada pedido (`serverlesspresso-order-table`) e expõe a API que o app do cliente e o app do barista usam para montar, reivindicar, concluir e cancelar pedidos. Também escuta 3 eventos do `order-processing-service` para arm", "caminho": "sistemas/order-manager-service/ficha.md", "realiza": ["sub-pedido"], "realizado_por": ["cmp-order-manager-state-machine", "cmp-order-manager-sanitize-order", "cmp-order-manager-workflow-started", "cmp-order-manager-waiting-completion", "cmp-order-manager-order-timed-out", "cmp-order-manager-rest-api-orders", "res-ddb-order-table", "res-rest-api-order-manager"], "extracoes": ["extracted"], "conflito": false, "corpo": "# order-manager-service\nGuarda o estado de cada pedido (`serverlesspresso-order-table`) e expõe a API que o app do cliente e o app do barista usam para montar, reivindicar, concluir e cancelar pedidos. Também escuta 3 eventos do `order-processing-service` para armazenar o Task Token de cada etapa.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Pedido |\n| Dono | Não identificado |\n| Stack | Node.js 14.x (Lambda) + Step Functions + API Gateway (integrações diretas) |\n| Repositório | `backends/5-order-manager/`; recursos em `01-appCore/template.yaml` |\n| Criticidade | Alta — única escrita do estado do pedido e única API usada pelos apps de cliente/barista |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph order-manager-service\n    API[REST API]\n    SFN[order-manager-state-machine]\n    L1[sanitize-order]\n    L2[workflow-started]\n    L3[waiting-completion]\n    L4[order-timed-out]\n  end\n  API -->|PUT /orders/id, integração direta| SFN\n  API -->|GET /orders, /orders/id, integração direta| DB[(OrderTable)]\n  SFN --> L1\n  SFN --> DB\n  BUS[[EventBridge]] --> L2\n  BUS --> L3\n  BUS --> L4\n  L2 --> DB\n  L3 --> DB\n  L3 -.publica.-> BUS\n  L4 --> DB\n  L4 -.publica.-> BUS\n  SFN -.publica.-> BUS\n  SFN -->|SendTaskSuccess| OPS[order-processing-service]\n```\n\n## Expõe\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `GET /orders`, `GET /orders/{id}`, `PUT /orders/{id}` | REST API (Cognito User Pools, integração direta API Gateway → DynamoDB/Step Functions, sem lambda) | [rest-api-orders](./componentes/rest-api-orders.md) |\n| `OrderManager.WaitingCompletion` | Evento | [contrato](./contratos/order-manager-waiting-completion.md) |\n| `OrderManager.Order{state}-COMPLETED`/`-CANCELLED` | Evento | [contrato](./contratos/order-manager-order-state-changed.md) |\n| `OrderManager.MakeOrder` | Evento | [contrato](./contratos/order-manager-make-order.md) |\n\n## Consome\n| Sistema | Contrato | Tipo |\n|---|---|---|\n| order-processing-service | `OrderProcessor.WorkflowStarted`, `OrderProcessor.WaitingCompletion`, `OrderProcessor.OrderTimeOut` | Evento (EventBridge) |\n| config-service | Leitura direta de `ConfigTable` (cardápio) dentro do `om.asl.json` | DynamoDB GetItem |\n\n## Dados\n```mermaid\nerDiagram\n  ORDER {\n    string PK \"orders\"\n    string SK \"orderId\"\n    string USERID\n    string ORDERSTATE \"eventId-CREATED|...-COMPLETED|...-CANCELLED\"\n    string TaskToken\n    string orderNumber\n    string drinkOrder \"JSON serializado\"\n    string baristaUserId\n    boolean robot\n    number TS\n  }\n```\nTabela `serverlesspresso-order-table`, com GSIs `GSI-status` (por `ORDERSTATE`) e `GSI-userId` (por `USERID`), e LSI `LSI-timestamp`. Fonte: `01-appCore/template.yaml#L647-L709`.\n\n## Estados\n```mermaid\nstateDiagram-v2\n  [*] --> CREATED: workflowStarted grava o pedido\n  CREATED --> WAITING: cliente envia o pedido (drinkOrder gravado)\n  WAITING --> CLAIMED: barista aperta \"make\"\n  CLAIMED --> WAITING: barista aperta \"unmake\"\n  CLAIMED --> COMPLETED: barista aperta \"complete\"\n  CLAIMED --> CANCELLED: barista aperta \"cancel\"\n  WAITING --> CANCELLED: timeout (via OrderTimedOut)\n  COMPLETED --> [*]\n  CANCELLED --> [*]\n```\n`ORDERSTATE` é sempre prefixado por `eventId` (ex.: `ABC-CREATED`); estados inferidos a partir do ASL `om.asl.json` — não há um enum central documentado.\n\n## Qualidade\n- `Sanitize order`: retry de 6 tentativas, backoff x2 a partir de 2 s, em caso de erro de serviço da Lambda\n- `Update order` usa `ConditionExpression` (`USERID` bate e `TaskToken` existe) — protege contra sobrescrever pedido de outro usuário\n- Timeouts das lambdas: 15–20 s\n"}, {"id": "cmp-order-processor-state-machine", "kind": "component", "camada": 5, "status": "proposed", "titulo": "order-processor-state-machine", "resumo": "State machine (Standard) que controla todo o ciclo de vida do pedido do lado do cliente até a entrada na fila do barista, e é retomada até o fim do pedido.", "caminho": "sistemas/order-processing-service/componentes/order-processor-state-machine.md", "realiza": ["sys-order-processing-service"], "realizado_por": ["res-ddb-config-table", "res-ddb-counting-table", "res-event-bus-serverlesspresso"], "extracoes": ["extracted"], "conflito": false, "corpo": "# order-processor-state-machine\nState machine (Standard) que controla todo o ciclo de vida do pedido do lado do cliente até a entrada na fila do barista, e é retomada até o fim do pedido.\n\n| Campo | Valor |\n|---|---|\n| Tipo | job (Step Functions Standard Workflow) |\n| Gatilho | Regra EventBridge `Validator.NewOrder` aponta direto para a state machine (`Events.ValidatorNewOrder` no SAM) — não há lambda entre o evento e o SFN |\n| Entrada | `$.detail.{orderId, userId, bucket.eventId}` do evento `Validator.NewOrder` |\n| Saída | Nenhuma (state machine `End: true` em cada ramo); efeitos são via `events:putEvents` e updates diretos no DynamoDB |\n| Timeout / memória / concorrência | Sem `TimeoutSeconds` global; dois `waitForTaskToken` com heartbeat de 300 s e 900 s |\n\n## Dependências\n- `ConfigTable` — `dynamodb:GetItem`/`UpdateItem` (loja aberta, cardápio)\n- `CountingTable` — `dynamodb:UpdateItem` (gera `orderNumber`)\n- EventBridge `Serverlesspresso` — `events:PutEvents` (5 tipos de evento distintos)\n- Ela mesma via `states:ListExecutions` (checagem de capacidade)\n- `order-manager-service` chama de volta via `states:SendTaskSuccess` (permissão concedida à role do order-manager-state-machine, não ao contrário)\n\n## Erros e retentativas\n- `Catch States.Timeout` em ambos os `waitForTaskToken` → emite `OrderProcessor.OrderTimeOut` e termina\n- Sem `Retry` configurado nos states de `putEvents`/`dynamodb` desta state machine (diferente do order-manager, que tem retry na chamada de lambda)\n"}, {"id": "ctr-order-processor-order-finished", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "OrderProcessor.orderFinished", "resumo": "{", "caminho": "sistemas/order-processing-service/contratos/order-processor-order-finished.md", "realiza": ["sys-order-processing-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# OrderProcessor.orderFinished\n| Campo | Valor |\n|---|---|\n| Tipo | evento (EventBridge) |\n| Produtor | order-processing-service |\n| Consumidores | order-journey-service (gatilho para montar a página HTML da jornada do pedido), extensão wait-times, publisher-service |\n| Especificação | Sem AsyncAPI formal |\n\n## Exemplo\n```json\n{\n  \"Message\": \"The order has reached the end of the workflow...\",\n  \"userId\": \"cognito-sub\",\n  \"orderId\": \"V1StGXR8_Z5jdHi6B-myT\",\n  \"eventId\": \"ABC\"\n}\n```\n\nNota: este evento é emitido tanto quando o barista **conclui** quanto quando **cancela** o pedido — o ASL não distingue os dois casos neste ponto (ver `RELATORIO.md`).\n"}, {"id": "ctr-order-processor-order-timeout", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "OrderProcessor.OrderTimeOut", "resumo": "{", "caminho": "sistemas/order-processing-service/contratos/order-processor-order-timeout.md", "realiza": ["sys-order-processing-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# OrderProcessor.OrderTimeOut\n| Campo | Valor |\n|---|---|\n| Tipo | evento (EventBridge) |\n| Produtor | order-processing-service (dois pontos distintos do ASL: timeout do cliente e timeout do barista) |\n| Consumidores | order-manager-service (`OrderTimedOut` lambda, marca o pedido como cancelado), metrics-service, order-journey-service, publisher-service |\n| Especificação | Sem AsyncAPI formal |\n\n## Exemplo\n```json\n{\n  \"Message\": \"The order timed out. Step Functions waits a set amount of time...\",\n  \"userId\": \"cognito-sub\",\n  \"orderId\": \"V1StGXR8_Z5jdHi6B-myT\",\n  \"eventId\": \"ABC\",\n  \"cause\": \"Customer timedout\"\n}\n```\n"}, {"id": "ctr-order-processor-waiting-completion", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "OrderProcessor.WaitingCompletion", "resumo": "{", "caminho": "sistemas/order-processing-service/contratos/order-processor-waiting-completion.md", "realiza": ["sys-order-processing-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# OrderProcessor.WaitingCompletion\n| Campo | Valor |\n|---|---|\n| Tipo | evento (EventBridge, `putEvents.waitForTaskToken`) |\n| Produtor | order-processing-service |\n| Consumidores | order-manager-service (`waitingCompletion` lambda), order-journey-service, publisher-service |\n| Especificação | Sem AsyncAPI formal |\n\n## Exemplo\n```json\n{\n  \"Message\": \"You pressed 'submit order'...\",\n  \"TaskToken\": \"AAAAKgAAAAIAAAAA...\",\n  \"orderId\": \"V1StGXR8_Z5jdHi6B-myT\",\n  \"orderNumber\": \"42\",\n  \"userId\": \"cognito-sub\",\n  \"eventId\": \"ABC\"\n}\n```\n"}, {"id": "ctr-order-processor-workflow-started", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "OrderProcessor.WorkflowStarted", "resumo": "{", "caminho": "sistemas/order-processing-service/contratos/order-processor-workflow-started.md", "realiza": ["sys-order-processing-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# OrderProcessor.WorkflowStarted\n| Campo | Valor |\n|---|---|\n| Tipo | evento (EventBridge, `putEvents.waitForTaskToken`) |\n| Produtor | order-processing-service |\n| Consumidores | order-manager-service (`workflowStarted` lambda), order-journey-service, publisher-service |\n| Especificação | Sem AsyncAPI formal |\n\n## Exemplo\n```json\n{\n  \"Message\": \"The workflow waits for your order to be submitted...\",\n  \"TaskToken\": \"AAAAKgAAAAIAAAAA...\",\n  \"orderId\": \"V1StGXR8_Z5jdHi6B-myT\",\n  \"userId\": \"cognito-sub\",\n  \"eventId\": \"ABC\"\n}\n```\n"}, {"id": "sys-order-processing-service", "kind": "system", "camada": 4, "status": "proposed", "titulo": "order-processing-service", "resumo": "Orquestra o pedido do lado do cliente: confere se a loja está aberta e se há capacidade, aguarda o cliente montar o pedido, gera o número do pedido e aguarda o barista concluir — tudo em uma única execução de Step Functions por pedido, usan", "caminho": "sistemas/order-processing-service/ficha.md", "realiza": ["sub-pedido"], "realizado_por": ["cmp-order-processor-state-machine", "res-ddb-config-table", "res-ddb-counting-table", "res-event-bus-serverlesspresso"], "extracoes": ["extracted"], "conflito": false, "corpo": "# order-processing-service\nOrquestra o pedido do lado do cliente: confere se a loja está aberta e se há capacidade, aguarda o cliente montar o pedido, gera o número do pedido e aguarda o barista concluir — tudo em uma única execução de Step Functions por pedido, usando Task Tokens para pausar/retomar.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Pedido |\n| Dono | Não identificado |\n| Stack | AWS Step Functions (Amazon States Language), sem lambdas próprias na versão consolidada |\n| Repositório | `backends/4-order-processing/` (definição do ASL); recursos declarados em `01-appCore/template.yaml` |\n| Criticidade | Alta — é o orquestrador central do pedido |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph order-processing-service\n    SFN[order-processor-state-machine]\n  end\n  BUS[[EventBridge Serverlesspresso]] -->|Validator.NewOrder| SFN\n  SFN --> CFG[(ConfigTable)]\n  SFN --> CNT[(CountingTable)]\n  SFN -->|waitForTaskToken /<br/>putEvents| BUS\n  SFN -->|ListExecutions| SFN\n```\n\n## Expõe\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `OrderProcessor.WorkflowStarted` | Evento | [contrato](./contratos/order-processor-workflow-started.md) |\n| `OrderProcessor.WaitingCompletion` | Evento | [contrato](./contratos/order-processor-waiting-completion.md) |\n| `OrderProcessor.OrderTimeOut` | Evento | [contrato](./contratos/order-processor-order-timeout.md) |\n| `OrderProcessor.ShopUnavailable` | Evento | sem contrato dedicado — payload simples `{userId, eventId}`, sem consumidor identificado |\n| `OrderProcessor.orderFinished` | Evento | [contrato](./contratos/order-processor-order-finished.md) |\n\n## Consome\n| Sistema | Contrato | Tipo |\n|---|---|---|\n| validator-service | `Validator.NewOrder` | Evento (EventBridge, aciona a state machine diretamente) |\n| config-service | Leitura direta de `ConfigTable` (`storeOpen`) | DynamoDB GetItem |\n| order-manager-service | `SendTaskSuccess` (retoma a execução pausada) | Chamada direta à API do Step Functions |\n\n## Dados\nNão tem tabela própria; lê `ConfigTable` e escreve em `CountingTable` (ver `sistemas/counting-service`).\n\n## Estados\n```mermaid\nstateDiagram-v2\n  [*] --> VerificandoLoja\n  VerificandoLoja --> Recusado: loja fechada ou fila cheia\n  VerificandoLoja --> AguardandoCliente: capacidade ok\n  AguardandoCliente --> AguardandoBarista: cliente enviou o pedido\n  AguardandoCliente --> Cancelado: timeout 5 min\n  AguardandoBarista --> Finalizado: barista concluiu ou cancelou\n  AguardandoBarista --> Cancelado: timeout 15 min\n  Recusado --> [*]\n  Cancelado --> [*]\n  Finalizado --> [*]\n```\n(Estados inferidos a partir dos nomes dos states do ASL; não existe uma máquina de estados de negócio nomeada assim no código.)\n\n## Qualidade\n- Capacidade máxima da fila: **20 execuções `RUNNING` simultâneas**, hardcoded em `$.isCapacityAvailable[20]` no ASL (não é uma variável de ambiente) — ver [regra](../../regras-de-negocio/capacidade-maxima-concorrente.md)\n- Timeout de espera do cliente: 5 min (`HeartbeatSeconds: 300`)\n- Timeout de espera do barista: 15 min (`HeartbeatSeconds: 900`)\n- `Sanitize order` (lambda externa, no order-manager) tem retry de 6 tentativas / backoff x2 a partir de 2 s\n"}, {"id": "cmp-publisher-admin", "kind": "component", "camada": 5, "status": "proposed", "titulo": "publisher-admin", "resumo": "Republica eventos de `OrderManager.*`, `OrderProcessor.*`, `Validator.*` e `ConfigService.*` no tópico MQTT do painel administrativo.", "caminho": "sistemas/publisher-service/componentes/publisher-admin.md", "realiza": ["sys-publisher-service"], "realizado_por": ["res-iot-core-realtime"], "extracoes": ["extracted"], "conflito": false, "corpo": "# publisher-admin\nRepublica eventos de `OrderManager.*`, `OrderProcessor.*`, `Validator.*` e `ConfigService.*` no tópico MQTT do painel administrativo.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda |\n| Gatilho | Regra EventBridge com 4 prefixos de `detail-type` |\n| Entrada | Evento completo do EventBridge |\n| Saída | Publica em `serverlesspresso-admin-{eventId}` via `iotdata.publish` (QoS 1) |\n| Timeout / memória / concorrência | 3 s / 128 MB |\n\n## Dependências\n- AWS IoT Core (`iot:Connect`, `iot:Publish`) — endpoint vindo de `IoTRealtimeParameter` (SSM)\n\n## Erros e retentativas\nFalhas de publish são apenas logadas (`console.error`), sem retry nem DLQ — mensagem perdida silenciosamente em caso de erro do IoT Core.\n"}, {"id": "cmp-publisher-config", "kind": "component", "camada": 5, "status": "proposed", "titulo": "publisher-config", "resumo": "Republica `ConfigService.ConfigChanged` no tópico MQTT de configuração, avisando os apps quando o cardápio ou o status da loja mudam.", "caminho": "sistemas/publisher-service/componentes/publisher-config.md", "realiza": ["sys-publisher-service"], "realizado_por": ["res-iot-core-realtime"], "extracoes": ["extracted"], "conflito": false, "corpo": "# publisher-config\nRepublica `ConfigService.ConfigChanged` no tópico MQTT de configuração, avisando os apps quando o cardápio ou o status da loja mudam.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda |\n| Gatilho | Regra EventBridge (`ConfigService.*`) |\n| Entrada | Evento completo do EventBridge |\n| Saída | Publica em `serverlesspresso-config-{eventId}` (o `eventId` é extraído de `event.detail.NewImage.PK.S`, ex.: `config-ABC` → `ABC`) |\n| Timeout / memória / concorrência | 3 s / 128 MB |\n\n## Dependências\n- AWS IoT Core (`iot:Connect`, `iot:Publish`)\n\n## Erros e retentativas\nMesma limitação: erro só logado, sem retry/DLQ.\n"}, {"id": "cmp-publisher-user", "kind": "component", "camada": 5, "status": "proposed", "titulo": "publisher-user", "resumo": "Republica eventos de `OrderManager.*` e `OrderProcessor.*` no tópico MQTT pessoal do cliente dono do pedido.", "caminho": "sistemas/publisher-service/componentes/publisher-user.md", "realiza": ["sys-publisher-service"], "realizado_por": ["res-iot-core-realtime"], "extracoes": ["extracted"], "conflito": false, "corpo": "# publisher-user\nRepublica eventos de `OrderManager.*` e `OrderProcessor.*` no tópico MQTT pessoal do cliente dono do pedido.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda |\n| Gatilho | Duas regras EventBridge (`OrderManager.*`, `OrderProcessor.*`) |\n| Entrada | Evento completo do EventBridge |\n| Saída | Publica em `serverlesspresso-user-{userId}` via `iotdata.publish` (QoS 1) |\n| Timeout / memória / concorrência | 3 s / 128 MB |\n\n## Dependências\n- AWS IoT Core (`iot:Connect`, `iot:Publish`)\n\n## Erros e retentativas\nMesma limitação do `publisher-admin`: erro só logado, sem retry/DLQ.\n"}, {"id": "sys-publisher-service", "kind": "system", "camada": 4, "status": "proposed", "titulo": "publisher-service", "resumo": "Ponte entre o EventBridge e o AWS IoT Core: republica os eventos de negócio como mensagens MQTT em tópicos que os três apps (cliente, barista, admin) assinam para atualização em tempo real.", "caminho": "sistemas/publisher-service/ficha.md", "realiza": ["sub-pedido"], "realizado_por": ["cmp-publisher-admin", "cmp-publisher-user", "cmp-publisher-config", "res-iot-core-realtime"], "extracoes": ["extracted"], "conflito": false, "corpo": "# publisher-service\nPonte entre o EventBridge e o AWS IoT Core: republica os eventos de negócio como mensagens MQTT em tópicos que os três apps (cliente, barista, admin) assinam para atualização em tempo real.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Pedido |\n| Dono | Não identificado |\n| Stack | Node.js 14.x (Lambda) |\n| Repositório | `backends/6-publisher-service/`; recursos em `01-appCore/template.yaml` |\n| Criticidade | Média — afeta só a experiência em tempo real; o estado real do pedido já está gravado antes desta lambda rodar |\n\n## Contêineres\n```mermaid\nflowchart LR\n  BUS[[EventBridge Serverlesspresso]]\n  subgraph publisher-service\n    L1[publisher-admin]\n    L2[publisher-user]\n    L3[publisher-config]\n  end\n  BUS -->|OrderManager.*, OrderProcessor.*,<br/>Validator.*, ConfigService.*| L1\n  BUS -->|OrderManager.*, OrderProcessor.*| L2\n  BUS -->|ConfigService.*| L3\n  L1 --> IOT[[AWS IoT Core]]\n  L2 --> IOT\n  L3 --> IOT\n```\n\n## Expõe\nNenhum contrato de API; publica em tópicos MQTT (não modelados como \"contrato\" formal por não terem schema declarado):\n- `serverlesspresso-admin-{eventId}` (publisher-admin)\n- `serverlesspresso-user-{userId}` (publisher-user)\n- `serverlesspresso-config-{eventId}` (publisher-config)\n\n## Consome\n| Sistema | Contrato | Tipo |\n|---|---|---|\n| validator-service | `Validator.*` | Evento |\n| order-processing-service | `OrderProcessor.*` | Evento |\n| order-manager-service | `OrderManager.*` | Evento |\n| config-service | `ConfigService.*` | Evento |\n\n## Dados\nSem banco próprio; é um encaminhador stateless.\n\n## Estados\nN/A.\n\n## Qualidade\n- Timeout: 3 s em todas as 3 funções\n- `publisher-admin` escuta 4 prefixos de evento numa única regra; `publisher-user` escuta 2 prefixos em duas regras separadas; `publisher-config` escuta 1 prefixo — assimetria não documentada, ver `RELATORIO.md`\n"}, {"id": "cmp-validator-get-qr-code", "kind": "component", "camada": 5, "status": "proposed", "titulo": "get-qr-code", "resumo": "Gera ou recupera o \"bucket\" de tokens da janela de 5 minutos atual e devolve o código para o app do cliente exibir como QR code.", "caminho": "sistemas/validator-service/componentes/get-qr-code.md", "realiza": ["sys-validator-service"], "realizado_por": ["res-ddb-validator-table"], "extracoes": ["extracted"], "conflito": false, "corpo": "# get-qr-code\nGera ou recupera o \"bucket\" de tokens da janela de 5 minutos atual e devolve o código para o app do cliente exibir como QR code.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda |\n| Gatilho | `GET /qr-code` via API Gateway (Cognito authorizer; exige `cognito:groups` conter `admin`) |\n| Entrada | `queryStringParameters.eventId` |\n| Saída | `200 {bucket: {PK, last_code, start_ts, end_ts, availableTokens, eventId}}`, `403` se não-admin, `400` se `eventId` ausente ou não encontrado no config |\n| Timeout / memória / concorrência | 3–15 s (diverge entre templates) / 128 MB / não limitada explicitamente |\n\n## Dependências\n- `serverlesspresso-validator` (DynamoDB) — lê/cria o bucket de tokens da janela atual\n- `ConfigTable` — lê `drinksPerBarcode` para saber quantos tokens a janela deve ter\n\n## Erros e retentativas\nSem `Retry`/DLQ configurados. Erros de leitura no DynamoDB são apenas logados (`console.error`) na função `getConfig`/`getItem` de `ddb.js`, sem propagar exceção — **uma falha do DynamoDB pode retornar `bucket` vazio silenciosamente**. Achado a reportar (ver `RELATORIO.md`).\n"}, {"id": "cmp-validator-verify-qr-code", "kind": "component", "camada": 5, "status": "proposed", "titulo": "verify-qr-code", "resumo": "Confere o token escaneado contra o bucket da janela atual; se válido, gera o `orderId` e publica `Validator.NewOrder`, iniciando o pedido.", "caminho": "sistemas/validator-service/componentes/verify-qr-code.md", "realiza": ["sys-validator-service"], "realizado_por": ["res-ddb-validator-table", "res-event-bus-serverlesspresso"], "extracoes": ["extracted"], "conflito": false, "corpo": "# verify-qr-code\nConfere o token escaneado contra o bucket da janela atual; se válido, gera o `orderId` e publica `Validator.NewOrder`, iniciando o pedido.\n\n| Campo | Valor |\n|---|---|\n| Tipo | lambda |\n| Gatilho | `POST /qr-code` via API Gateway (Cognito authorizer) |\n| Entrada | `queryStringParameters.{eventId, token}`, `requestContext.authorizer.claims.sub` (userId) |\n| Saída | `200 {orderId}`; `400 {error: \"Invalid code\"}` ou `{error: \"No tokens remaining\"}` (este último com `statusCode 200`, ver nota); `422` se faltar parâmetro |\n| Timeout / memória / concorrência | 10 s / 128 MB |\n\n## Dependências\n- `serverlesspresso-validator` (DynamoDB) — lê o bucket e decrementa `availableTokens`\n- EventBridge `Serverlesspresso` — publica `Validator.NewOrder`\n\n## Erros e retentativas\nSem `Retry`/DLQ. Nota de qualidade: a resposta \"sem tokens restantes\" usa `statusCode: 200` em vez de um código de erro (`error` só aparece no corpo) — o cliente HTTP precisa inspecionar o corpo, não o status, para tratar esse caso.\n"}, {"id": "ctr-validator-new-order", "kind": "contract", "camada": 4, "status": "proposed", "titulo": "Validator.NewOrder", "resumo": "{", "caminho": "sistemas/validator-service/contratos/validator-new-order.md", "realiza": ["sys-validator-service"], "realizado_por": [], "extracoes": ["extracted"], "conflito": false, "corpo": "# Validator.NewOrder\n| Campo | Valor |\n|---|---|\n| Tipo | evento (EventBridge) |\n| Produtor | validator-service (`verify-qr-code`) |\n| Consumidores | order-processing-service (regra EventBridge que inicia a state machine diretamente, sem lambda) |\n| Especificação | Sem OpenAPI/AsyncAPI formal; contrato inferido do código |\n\n## Exemplo\n```json\n{\n  \"orderId\": \"V1StGXR8_Z5jdHi6B-myT\",\n  \"userId\": \"cognito-sub-do-cliente\",\n  \"eventId\": \"ABC\",\n  \"Message\": \"A Lambda function is invoked by a POST request...\",\n  \"bucket\": { \"PK\": \"ABC-123456\", \"last_code\": \"9f8a7b6c5d\", \"availableTokens\": 4 }\n}\n```\n"}, {"id": "sys-validator-service", "kind": "system", "camada": 4, "status": "proposed", "titulo": "validator-service", "resumo": "Emite o token de acesso (QR code) por janela de tempo e valida o token escaneado pelo cliente no balcão, iniciando o pedido.", "caminho": "sistemas/validator-service/ficha.md", "realiza": ["sub-pedido"], "realizado_por": ["cmp-validator-get-qr-code", "cmp-validator-verify-qr-code", "res-ddb-validator-table", "res-http-api-validator"], "extracoes": ["extracted"], "conflito": false, "corpo": "# validator-service\nEmite o token de acesso (QR code) por janela de tempo e valida o token escaneado pelo cliente no balcão, iniciando o pedido.\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | Pedido |\n| Dono | Não identificado (sample AWS) |\n| Stack | Node.js 14.x (AWS Lambda), AWS SAM |\n| Repositório | `backends/9-validator/` (implantado dentro da pilha consolidada `01-appCore`; há também um `template.yaml` próprio standalone — ver `infraestrutura/ambientes/modulos-standalone-backends.md`) |\n| Criticidade | Alta — é o único ponto de entrada do pedido (a confirmar com o tech lead) |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph validator-service\n    API[HTTP/REST API]\n    L1[get-qr-code]\n    L2[verify-qr-code]\n  end\n  API --> L1\n  API --> L2\n  L1 --> DB[(serverlesspresso-validator)]\n  L2 --> DB\n  L2 -.publica.-> BUS[[EventBridge Serverlesspresso]]\n```\n\n## Expõe\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `GET /qr-code` | API (Cognito JWT, requer grupo `admin`) | [get-qr-code](./componentes/get-qr-code.md) |\n| `POST /qr-code` | API (Cognito JWT) | [verify-qr-code](./componentes/verify-qr-code.md) |\n| `Validator.NewOrder` | Evento (EventBridge) | [validator-new-order](./contratos/validator-new-order.md) |\n\n## Consome\n| Sistema | Contrato | Tipo |\n|---|---|---|\n| config-service | Leitura direta de `ConfigTable` (`drinksPerBarcode`) | DynamoDB Query |\n\n## Dados\n```mermaid\nerDiagram\n  TOKEN_BUCKET {\n    string PK \"eventId-timeBucketId\"\n    string last_code\n    number availableTokens\n    number start_ts\n    number end_ts\n  }\n```\nFonte: `backends/9-validator/code/ddb.js`, `getCode.js`. Tabela `serverlesspresso-validator` (nome real na pilha consolidada) / `ApplicationTable` (nome no template standalone).\n\n## Estados\nNão há máquina de estados própria; o \"token\" é criado, decrementado e expira implicitamente ao virar a janela de tempo (5 minutos, `TIME_INTERVAL`).\n\n## Qualidade\n- Timeout das lambdas: 3 s (`getCode`) e 3–15 s conforme o template usado (ver componentes)\n- Existem **dois templates divergentes** para este sistema (standalone com HTTP API + Cognito JWT authorizer próprio, e consolidado com REST API + Cognito User Pools authorizer) — ver `RELATORIO.md`\n"}, {"id": "sub-configuracao-da-loja", "kind": "subdomain", "camada": 3, "status": "proposed", "titulo": "Subdomínio Configuração da loja", "resumo": "Mantém o cardápio do evento, o estado \"aberto/fechado\" da loja e o limite de bebidas por token, e avisa o resto do sistema quando essa configuração muda.", "caminho": "subdominios/configuracao-da-loja.md", "realiza": ["dom-serverlesspresso"], "realizado_por": ["sys-config-service"], "extracoes": ["extracted"], "conflito": false, "corpo": "# Subdomínio Configuração da loja\nMantém o cardápio do evento, o estado \"aberto/fechado\" da loja e o limite de bebidas por token, e avisa o resto do sistema quando essa configuração muda.\n\n## Sistemas\n| Sistema | Papel |\n|---|---|\n| config-service | Fonte de verdade do cardápio e do estado da loja; publica `ConfigService.ConfigChanged` via DynamoDB Streams |\n\n## Fluxos executados aqui\nNão há um fluxo de ponta a ponta próprio; este subdomínio é consultado (leitura direta de `ConfigTable`) pelo `order-processing-service` (loja aberta?) e pelo `order-manager-service` (cardápio) durante o [pedido de café](../fluxos/pedido-de-cafe.sequencia.md).\n"}, {"id": "sub-extensoes", "kind": "subdomain", "camada": 3, "status": "proposed", "titulo": "Subdomínio Extensões", "resumo": "Add-ons opcionais que demonstram a extensibilidade da arquitetura orientada a eventos: cada um só cria novas regras do EventBridge sobre o bus `Serverlesspresso` existente, não tem permissão de acessar recursos do core e pode ser implantado", "caminho": "subdominios/extensoes.md", "realiza": ["dom-serverlesspresso"], "realizado_por": ["sys-ext-event-player", "sys-ext-order-robot", "sys-ext-persist-metrics-dynamodb", "sys-ext-wait-times"], "extracoes": ["extracted"], "conflito": false, "corpo": "# Subdomínio Extensões\nAdd-ons opcionais que demonstram a extensibilidade da arquitetura orientada a eventos: cada um só cria novas regras do EventBridge sobre o bus `Serverlesspresso` existente, não tem permissão de acessar recursos do core e pode ser implantado/removido independentemente (regra documentada em `extensions/README.md`).\n\n## Sistemas\n| Sistema | Papel |\n|---|---|\n| extensao-event-player | Simula 15 minutos de operação do balcão, reproduzindo uma sequência de eventos gravada |\n| extensao-order-robot | Simula um robô que faz pedidos e um robô barista que os prepara |\n| extensao-persist-metrics-dynamodb | Consome `OrderManager.WaitingCompletion` via fila SQS e grava em uma tabela DynamoDB própria |\n| extensao-wait-times | Calcula o tempo médio de preparo por bebida a partir dos eventos de início/fim do pedido |\n\n## Fluxos executados aqui\nNenhum fluxo de negócio principal; cada extensão observa eventos do [pedido de café](../fluxos/pedido-de-cafe.sequencia.md) de fora, sem participar da orquestração.\n"}, {"id": "sub-nucleo-e-identidade", "kind": "subdomain", "camada": 3, "status": "proposed", "titulo": "Subdomínio Núcleo e identidade", "resumo": "Recursos fundacionais que todos os outros subdomínios usam: o barramento de eventos, a autenticação sem senha do cliente (Cognito com desafio customizado via SMS) e o endpoint do AWS IoT Core usado para tempo real.", "caminho": "subdominios/nucleo-e-identidade.md", "realiza": ["dom-serverlesspresso"], "realizado_por": ["sys-nucleo-serverlesspresso"], "extracoes": ["extracted"], "conflito": false, "corpo": "# Subdomínio Núcleo e identidade\nRecursos fundacionais que todos os outros subdomínios usam: o barramento de eventos, a autenticação sem senha do cliente (Cognito com desafio customizado via SMS) e o endpoint do AWS IoT Core usado para tempo real.\n\n## Sistemas\n| Sistema | Papel |\n|---|---|\n| nucleo-serverlesspresso | Bus de eventos `Serverlesspresso`, User Pool/Identity Pool do Cognito, fluxo de autenticação customizado, endpoint IoT |\n\n## Fluxos executados aqui\nNão orquestra um fluxo de negócio por si só; é infraestrutura compartilhada consumida por todos os fluxos do domínio (autenticação do cliente/barista, transporte de todos os eventos).\n"}, {"id": "sub-pedido", "kind": "subdomain", "camada": 3, "status": "proposed", "titulo": "Subdomínio Pedido", "resumo": "Do QR code escaneado pelo cliente até a bebida entregue: validação de token, verificação de capacidade, orquestração via Step Functions, persistência do estado do pedido, contagem sequencial, notificação em tempo real e montagem da página d", "caminho": "subdominios/pedido.md", "realiza": ["dom-serverlesspresso"], "realizado_por": ["sys-validator-service", "sys-order-processing-service", "sys-order-manager-service", "sys-counting-service", "sys-publisher-service", "sys-order-journey-service", "sys-metrics-service"], "extracoes": ["inferred"], "conflito": false, "corpo": "# Subdomínio Pedido\nDo QR code escaneado pelo cliente até a bebida entregue: validação de token, verificação de capacidade, orquestração via Step Functions, persistência do estado do pedido, contagem sequencial, notificação em tempo real e montagem da página de jornada do pedido.\n\n## Sistemas\n| Sistema | Papel |\n|---|---|\n| validator-service | Emite e valida o token/QR code; inicia o pedido publicando `Validator.NewOrder` |\n| order-processing-service | Orquestra o pedido de ponta a ponta (Step Functions); controla capacidade da fila e timeouts |\n| order-manager-service | Guarda o estado do pedido; expõe a API que cliente e barista usam; sanitiza o pedido contra o cardápio |\n| counting-service | Gera o número sequencial do pedido (hoje embutido na state machine do order-processing; ver ficha) |\n| publisher-service | Republica os eventos do pedido nos tópicos MQTT (IoT Core) para os apps |\n| order-journey-service | Ao final do pedido, monta uma página HTML com a linha do tempo dos eventos |\n| metrics-service | Publica métricas customizadas no CloudWatch a partir dos eventos do pedido |\n\n## Fluxos executados aqui\n- [Pedido de café](../fluxos/pedido-de-cafe.sequencia.md)\n"}], "relatorio": "# Relatório de documentação — Domínio Serverlesspresso\n\nGerado a partir de `fixtures/serverless-coffee` (repo `aws-samples/serverless-coffee`, commit `9d494a2`, 2026-07-27). Escopo: repositório inteiro (infraestrutura como código SAM/CDK, 3 pilhas + 4 extensões, ~20 lambdas, 5 state machines, EventBridge). Construído de baixo para cima conforme `references/padrao.md` do skill `sinter-documentar`.\n\n## Itens por camada\n\n| Camada | Itens | `extracted` | `inferred` |\n|---|---|---|---|\n| 0 — Transversal (glossário, regras, decisão, padrão) | 10 | 6 | 4 |\n| 1 — Negócio (capacidade, fluxo macro) | 2 | 0 | 2 |\n| 2 — Domínio (README) | 1 | 0 | 1 |\n| 3 — Subdomínio + sequência técnica | 5 | 1 | 4 |\n| 4 — Sistema (fichas + contratos) | 22 | 20 | 2 |\n| 5 — Componente | 28 | 27 | 1 |\n| 6 — Infraestrutura (recursos + ambientes) | 19 | 16 | 3 |\n| **Total** | **87** | **70** | **17** |\n\nA imensa maioria dos fatos técnicos (infra, componentes, contratos de evento) veio direto do código — `template.yaml`, arquivos `.asl.json`, handlers `.js`. As camadas 1 (negócio) e 2 (domínio) são as mais inferidas, como esperado: não há documento de produto no repositório, só READMEs de instalação.\n\n## Sistemas e componentes mapeados\n11 sistemas \"core\" + 4 extensões: `nucleo-serverlesspresso` (5 componentes), `config-service` (3), `validator-service` (2 + 1 contrato), `order-processing-service` (1 + 4 contratos), `order-manager-service` (6 + 3 contratos), `publisher-service` (3), `order-journey-service` (2), `counting-service` (2, **órfãos**), `metrics-service` (4), mais 4 extensões documentadas em nível de ficha (event-player, order-robot, persist-metrics-dynamodb, wait-times).\n\n## Fluxo de pedido de café\nDocumentado de ponta a ponta em `fluxos/pedido-de-cafe.md` (negócio) e `fluxos/pedido-de-cafe.sequencia.md` (técnico, com diagrama `sequenceDiagram` cobrindo os 2 caminhos felizes e 4 caminhos de erro: token inválido, loja/fila indisponível, timeout do cliente, bebida fora do cardápio, timeout do barista).\n\n## Decisões de organização do repositório (para o avaliador entender escolhas)\n- **Sem pastas `mapa/` e `eventos/` na camada 2**: o diagrama de contexto e a tabela de eventos de domínio já estão completos em `README.md`; o contrato técnico de cada evento vive em `sistemas/<produtor>/contratos/`, para não duplicar a mesma informação em dois lugares (princípio \"um lugar por informação\" do skill).\n- Cada state machine (Step Functions) foi modelada como **componente tipo `job`** (camada 5), não como recurso de infraestrutura — ela tem gatilho, entrada e saída bem definidos, como uma lambda.\n- APIs com integração direta API Gateway → DynamoDB/Step Functions (sem lambda) foram modeladas como **um componente tipo `endpoint` por sistema** (agrupando as rotas), em vez de um arquivo por rota, para não fragmentar demais um comportamento simples.\n\n## Conflitos encontrados (não resolvidos sozinho — registrados para decisão humana)\n1. **`OrderProcessor.orderFinished` não distingue conclusão de cancelamento** — o ASL do `order-processing-service` emite o mesmo evento final tanto quando o barista completa quanto quando cancela (`backends/4-order-processing/statemachine/op.asl.json`, states `Pass`→`Emit - order finished`). Ver `sistemas/order-processing-service/contratos/order-processor-order-finished.md`.\n2. **Duas topologias de implantação coexistem**: a pilha consolidada `01-appCore` (caminho oficial do README) e templates standalone completos em `backends/7-metrics-service`, `backends/8-order-journey` e `backends/9-validator` (usam SSM Parameter Store do core). O `validator-service` standalone usa HTTP API + JWT authorizer manual; a versão consolidada usa REST API + Cognito User Pools authorizer — **arquiteturas de autenticação diferentes para o mesmo serviço**. Ver `infraestrutura/ambientes/modulos-standalone-backends.md` e `sistemas/validator-service/ficha.md`.\n3. **`metrics-service` não é implantado pelo caminho documentado** (`01-appCore` não o inclui), então as métricas de CloudWatch dele provavelmente não existem em uma instalação seguindo só o README raiz.\n4. **`counting-service` (`backends/1-counting-service/code/`) é código órfão**: nenhum `template.yaml` no repositório implanta `getOrderId.js`/`resetOrderId.js`. A contagem real acontece dentro do ASL do `order-processing-service`, usando uma chave (`orderID-{eventId}`) diferente da que o código órfão usa (`orderID` fixo).\n5. **`backends/4-order-processing/functions/capacity/isCapacityAvailable.js` e `functions/resumeWF/app.js`** também parecem órfãos: o `op.asl.json` real faz a checagem de capacidade com um state `ListExecutions` direto, não invocando essas lambdas.\n6. **`backends/4-order-processing/api.yaml`** descreve uma HTTP API que publica `OrderProcessor.OrderStarted` direto no bus — mas o `OrderProcessorStateMachine` real é iniciado por `Validator.NewOrder`, e não há recurso `HttpApi` em `01-appCore/template.yaml` usando esse `api.yaml`. Parece um ponto de entrada alternativo/legado, não conectado.\n\n## Segredos encontrados\nNenhum segredo, chave ou senha em texto plano foi encontrado. Notas:\n- `GenerateSecret: false` no `UserPoolClient` (`00-baseCore/template.yaml`) — não há client secret a proteger.\n- O termo `apiKey` aparece como **tipo de security scheme do OpenAPI** em `backends/5-order-manager/RestAPIs/api.yaml` e `backends/2-config-service/RestAPIs/api.yaml`, mas a autorização real é `cognito_user_pools` — não é uma API key literal.\n\n## Perguntas para as pessoas\n\n### Para o PM\n- Quem é o dono/time responsável hoje por este domínio (o repositório é um sample público da AWS)?\n- A capacidade \"Vender café sob demanda\" e os indicadores propostos (tempo médio de preparo, taxa de cancelamento, utilização de capacidade) fazem sentido, ou existem outros indicadores de negócio que devem substituir os propostos?\n- O limite de 20 pedidos simultâneos e as janelas de 5/15 minutos são parâmetros de negócio reais ou apenas valores de demonstração do workshop?\n\n### Para o arquiteto\n- Qual topologia de implantação é a \"oficial\": só `01-appCore`, ou os módulos standalone (`7-metrics-service`, `8-order-journey`, `9-validator`) rodando lado a lado/substituindo partes dela? (conflito 2)\n- `metrics-service` deveria ser incluído em `01-appCore`? Hoje ele não é implantado pelo caminho documentado (conflito 3).\n- O evento `OrderManager.Order{eventId}-COMPLETED`/`-CANCELLED` (com o `eventId` embutido no nome do `detail-type`) é intencional? Isso impede regras EventBridge simples por `prefix` fixo.\n- `backends/4-order-processing/api.yaml` (HTTP API → EventBridge `OrderProcessor.OrderStarted`) ainda é um ponto de entrada válido, ou é código morto a remover? (conflito 6)\n\n### Para o tech lead\n- `backends/1-counting-service/code/*` e `backends/4-order-processing/functions/{capacity,resumeWF}/*` podem ser removidos com segurança (órfãos, sem `template.yaml` que os implante)? (conflitos 4 e 5)\n- `OrderProcessor.ShopUnavailable` não tem consumidor lambda identificado no código — algum front-end trata esse evento, ou ele só é usado pelo `order-journey-service` (que grava todo evento) e pelo `publisher-service`?\n- É aceitável que \"bebida fora do cardápio\" (state `Is Order Valid?` no `om.asl.json`) termine em `Succeed` silencioso, deixando o `order-processing-service` esperando até o timeout de 5 minutos sem avisar o cliente do motivo?\n- As funções `get-qr-code`/`ddb.js` do validator engolem erros de DynamoDB com `console.error` sem propagar exceção — isso é aceitável ou deveria falhar explicitamente (hoje pode devolver um bucket vazio silenciosamente)?\n- O limite de capacidade \"20\" está como índice de array hardcoded no ASL (`$.isCapacityAvailable[20]`) em vez de parâmetro nomeado — vale a pena refatorar para uma variável de ambiente/`DefinitionSubstitutions`?\n\n## Como continuar\n- Repositório em `dominio-serverlesspresso/`, pronto para revisão humana (todo item `status: proposed`).\n- Próxima rodada, se aprovada a abordagem: aprofundar os 4 sistemas de extensão (hoje só fichas) com componentes detalhados, e resolver as perguntas acima antes de promover os itens para `status: approved`.\n", "camadas": {"1": "Negócio", "2": "Domínio", "3": "Subdomínio", "4": "Sistema", "5": "Componente", "6": "Infraestrutura", "0": "Transversal"}, "mapa": "flowchart LR\n  subgraph n_Configura__o_da_loja[\"Configuração da loja\"]\n    n_sys_config_service[\"config-service\"]\n  end\n  subgraph n_Pedido[\"Pedido\"]\n    n_sys_counting_service[\"counting-service\"]\n    n_sys_metrics_service[\"metrics-service\"]\n    n_sys_order_journey_service[\"order-journey-service\"]\n    n_sys_order_manager_service[\"order-manager-service\"]\n    n_sys_order_processing_service[\"order-processing-service\"]\n    n_sys_publisher_service[\"publisher-service\"]\n    n_sys_validator_service[\"validator-service\"]\n  end\n  subgraph n_Extens_es[\"Extensões\"]\n    n_sys_ext_event_player[\"extensao-event-player\"]\n    n_sys_ext_order_robot[\"extensao-order-robot\"]\n    n_sys_ext_persist_metrics_dynamodb[\"extensao-persist-metrics-dynamodb\"]\n    n_sys_ext_wait_times[\"extensao-wait-times\"]\n  end\n  subgraph n_N_cleo_e_identidade[\"Núcleo e identidade\"]\n    n_sys_nucleo_serverlesspresso[\"nucleo-serverlesspresso\"]\n  end\n  n_ext_Evento([\"Evento\"])\n  n_sys_ext_order_robot -->|\"Tipo\"| n_ext_Evento\n  n_ext_ProducerRobot_FulfillOrder([\"ProducerRobot.FulfillOrder\"])\n  n_sys_ext_order_robot -->|\"Evento (EventBridge)\"| n_ext_ProducerRobot_FulfillOrder\n  n_ext_Evento([\"Evento\"])\n  n_sys_e   v.innerHTML = `<p class="crumbs">${D.camadas[i.camada]} · ${esc(i.caminho)}</p>
    <div class="chips"><span class="chip">${esc(i.kind)}</span>${i.status ? `<span class="chip ${i.status==='approved'?'ok':''}">${i.status==='approved'?'aprovado':'proposto'}</span>` : ''}
    ${ex.map(e => `<span class="chip ${e==='inferred'?'inf':'ext'}">${e==='inferred'?'inferido':e==='extracted'?'extraído':'humano'}</span>`).join('')}${i.conflito ? '<span class="chip inf">conflito entre fontes</span>' : ''}</div>
    <div class="doc">${isCanvas(i) ? canvasHTML(i.corpo) : md(i.corpo)}</div>
    <div class="links"><div class="box"><h4>Sobe para</h4>${link(sobe)}</div><div class="box"><h4>Desce para</h4>${link(desce)}</div></div>`;
  v.querySelectorAll('.links a').forEach(a => a.onclick = e => { e.preventDefault(); item(a.dataset.id); });
  window.scrollTo(0,0); desenhar(v);
}
document.getElementById('q').oninput = () => { if (tab === 'geral') abrir('servicos'); else side(gruposPara(tab)); };
tabs(); abrir('geral');
</script></body></html>
