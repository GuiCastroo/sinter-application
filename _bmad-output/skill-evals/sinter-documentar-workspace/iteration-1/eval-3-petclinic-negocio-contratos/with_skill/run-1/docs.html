const F = {"dominio-clinica-veterinaria/infraestrutura/ambientes/env-local-docker.md": "---\nid: env-local-docker\nkind: environment\nsubject: environment:local-docker\ncamada: 6\nstatus: proposed\nrealiza: []\nrealizado-por: [res-tracing-server, res-grafana-prometheus]\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: docker-compose.yml\n    version: aefaf7f\n    extraction: extracted\n---\n\n# Ambiente local via Docker Compose\nSobe toda a stack (serviços de negócio + plataforma + observabilidade) em containers na mesma máquina, para desenvolvimento e demonstração. Não há evidência neste repositório de um ambiente de homologação ou produção real (nuvem, Kubernetes, Terraform) — apenas este compose local. **A confirmar com o time de infraestrutura.**\n\n## Implantação\n```mermaid\nflowchart TB\n  subgraph docker[\"docker-compose (host local)\"]\n    CFG[config-server :8888] --> DISC[discovery-server :8761]\n    DISC --> CUST[customers-service :8081]\n    DISC --> VIS[visits-service :8082]\n    DISC --> VET[vets-service :8083]\n    DISC --> GEN[genai-service :8084]\n    DISC --> GW[api-gateway :8080]\n    DISC --> ADM[admin-server :9090]\n    GW --> CUST\n    GW --> VIS\n    GW --> VET\n    GW --> GEN\n    TRACE[tracing-server :9411]\n    GRAF[grafana-server :3030] --> PROM[prometheus-server :9091]\n  end\n```\n\nOrdem de subida (via `depends_on` + `condition: service_healthy`): `config-server` → `discovery-server` → demais serviços. Cada serviço de negócio expõe uma porta fixa mapeada no host: `customers-service` 8081, `visits-service` 8082, `vets-service` 8083, `genai-service` 8084, `api-gateway` 8080, `admin-server` 9090, `discovery-server` 8761, `config-server` 8888. Todos os containers têm limite de memória de 512M (256M para Grafana/Prometheus).\n", "dominio-clinica-veterinaria/infraestrutura/ambientes/env-local-ide.md": "---\nid: env-local-ide\nkind: environment\nsubject: environment:local-ide\ncamada: 6\nstatus: proposed\nrealiza: []\nrealizado-por: []\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: README.md#Starting-services-locally-without-Docker\n    version: aefaf7f\n    extraction: extracted\n---\n\n# Ambiente local via IDE / Maven\nCada microsserviço roda como processo Java independente (`../mvnw spring-boot:run` ou execução pela IDE), sem containers. `config-server` e `discovery-server` precisam subir antes dos demais. Tracing (Zipkin), Admin Server, Grafana e Prometheus são opcionais nesse modo. Usa banco HSQLDB embutido por padrão (ver `res-hsqldb-embedded`).\n\n## Implantação\n```mermaid\nflowchart TB\n  subgraph local[\"Processos Java locais\"]\n    CFG[config-server] --> DISC[discovery-server]\n    DISC --> CUST[customers-service]\n    DISC --> VIS[visits-service]\n    DISC --> VET[vets-service]\n    DISC --> GW[\"api-gateway :8080\"]\n  end\n```\n\nPortas de negócio não são fixadas em `application.yml` neste modo (nenhum `server.port` explícito nos serviços de negócio) — o README instrui checar a porta real pelo painel do Eureka. **Inferido**: a porta efetiva provavelmente vem de variável de ambiente `SERVER_PORT`, cuja origem (perfil, config externo) não está neste repositório.\n", "dominio-clinica-veterinaria/infraestrutura/recursos/res-grafana-prometheus.md": "---\nid: res-grafana-prometheus\nkind: resource\nsubject: resource:grafana-prometheus\ncamada: 6\nstatus: proposed\nrealiza: [sub-plataforma]\nrealizado-por: []\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: docker-compose.yml#L110-L130; docker/grafana; docker/prometheus\n    version: aefaf7f\n    extraction: extracted\n---\n\n# Grafana + Prometheus (métricas)\n| Campo | Valor |\n|---|---|\n| Tipo | cluster/servidor de observabilidade (métricas e dashboards) |\n| Tecnologia | Prometheus (scrape) + Grafana (dashboards), imagens customizadas em `docker/grafana` e `docker/prometheus` |\n| Ambientes | local via `docker-compose.yml`, portas `3030` (Grafana) e `9091` (Prometheus) |\n| Definido em | `docker-compose.yml` (serviços `grafana-server`, `prometheus-server`) |\n\nTodos os serviços Spring Boot do domínio expõem métricas via `micrometer-registry-prometheus` (dependência presente nos `pom.xml`), consumidas pelo Prometheus e visualizadas no Grafana (há um dashboard de exemplo em `docs/grafana-custom-metrics-dashboard.png`).\n\n## Usado por\n- `sys-customers-service`, `sys-vets-service`, `sys-visits-service`, `sys-api-gateway`, `sys-genai-service` — expõem métricas Micrometer/Prometheus\n", "dominio-clinica-veterinaria/infraestrutura/recursos/res-hsqldb-embedded.md": "---\nid: res-hsqldb-embedded\nkind: resource\nsubject: resource:hsqldb-embedded\ncamada: 6\nstatus: proposed\nrealiza: [sys-customers-service, sys-vets-service, sys-visits-service]\nrealizado-por: []\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-customers-service/pom.xml#hsqldb-dependency; spring-petclinic-customers-service/src/main/resources/db/hsqldb/schema.sql\n    version: aefaf7f\n    extraction: extracted\n---\n\n# Banco HSQLDB embutido (dev/teste)\n| Campo | Valor |\n|---|---|\n| Tipo | banco (relacional, em memória) |\n| Tecnologia | HSQLDB, uma instância por serviço, embutida no processo Java |\n| Ambientes | desenvolvimento local (perfil padrão) e testes automatizados (perfil `test`) |\n| Definido em | `pom.xml` de cada serviço (dependência `org.hsqldb:hsqldb`), scripts `src/main/resources/db/hsqldb/schema.sql` e `data.sql` de cada serviço |\n\nCada serviço de dados (`customers-service`, `vets-service`, `visits-service`) inicializa seu próprio banco HSQLDB em memória ao subir, populado com dados de exemplo (`data.sql`). Não é compartilhado entre serviços nem entre instâncias — é recriado a cada start. Não há configuração explícita de `spring.datasource` neste repositório: a escolha do banco (HSQLDB vs. MySQL) depende de qual driver e schema o ambiente de execução ativa, o que não é decidido dentro deste repositório (ver `res-mysql-customers` e RELATORIO.md).\n\n## Usado por\n- `sys-customers-service` — leitura e escrita das tabelas `owners`, `pets`, `types`\n- `sys-vets-service` — leitura das tabelas `vets`, `specialties`, `vet_specialties`\n- `sys-visits-service` — leitura e escrita da tabela `visits`\n", "dominio-clinica-veterinaria/infraestrutura/recursos/res-mysql-customers.md": "---\nid: res-mysql-customers\nkind: resource\nsubject: resource:mysql-customers\ncamada: 6\nstatus: proposed\nrealiza: [sys-customers-service]\nrealizado-por: []\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-customers-service/src/main/resources/db/mysql/schema.sql\n    version: aefaf7f\n    extraction: extracted\n---\n\n# Banco MySQL — customers-service\n| Campo | Valor |\n|---|---|\n| Tipo | banco (relacional) |\n| Tecnologia | MySQL (banco lógico `petclinic`, tabelas `owners`, `pets`, `types`) |\n| Ambientes | produção (inferido — a conexão real não está neste repositório) |\n| Definido em | `spring-petclinic-customers-service/src/main/resources/db/mysql/schema.sql` e `data.sql` |\n\nO schema e a massa de dados MySQL existem no código (driver `mysql-connector-j` no `pom.xml`), mas **nenhum arquivo deste repositório define host, credenciais ou string de conexão** para MySQL em produção — nem em `docker-compose.yml` (que não sobe um container MySQL), nem em `application.yml`. O Config Server aponta para um repositório Git externo (`spring-petclinic-microservices-config`) que provavelmente contém essas propriedades por ambiente. **Inferido**, a confirmar com o time de infraestrutura (ver RELATORIO.md).\n\n## Usado por\n- `sys-customers-service` — leitura e escrita\n", "dominio-clinica-veterinaria/infraestrutura/recursos/res-mysql-vets.md": "---\nid: res-mysql-vets\nkind: resource\nsubject: resource:mysql-vets\ncamada: 6\nstatus: proposed\nrealiza: [sys-vets-service]\nrealizado-por: []\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-vets-service/src/main/resources/db/mysql/schema.sql\n    version: aefaf7f\n    extraction: extracted\n---\n\n# Banco MySQL — vets-service\n| Campo | Valor |\n|---|---|\n| Tipo | banco (relacional) |\n| Tecnologia | MySQL (banco lógico `petclinic`, tabelas `vets`, `specialties`, `vet_specialties`) |\n| Ambientes | produção (inferido — mesma ressalva de `res-mysql-customers`) |\n| Definido em | `spring-petclinic-vets-service/src/main/resources/db/mysql/schema.sql` e `data.sql` |\n\n## Usado por\n- `sys-vets-service` — leitura (o serviço não expõe escrita de veterinários; a carga inicial vem de `data.sql`)\n", "dominio-clinica-veterinaria/infraestrutura/recursos/res-mysql-visits.md": "---\nid: res-mysql-visits\nkind: resource\nsubject: resource:mysql-visits\ncamada: 6\nstatus: proposed\nrealiza: [sys-visits-service]\nrealizado-por: []\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-visits-service/src/main/resources/db/mysql/schema.sql\n    version: aefaf7f\n    extraction: extracted\n---\n\n# Banco MySQL — visits-service\n| Campo | Valor |\n|---|---|\n| Tipo | banco (relacional) |\n| Tecnologia | MySQL (banco lógico `petclinic`, tabela `visits`) |\n| Ambientes | produção (inferido — mesma ressalva de `res-mysql-customers`) |\n| Definido em | `spring-petclinic-visits-service/src/main/resources/db/mysql/schema.sql` e `data.sql` |\n\nA tabela `visits` declara `FOREIGN KEY (pet_id) REFERENCES pets(id)`, mas `pets` vive no banco do `customers-service`. Em uma topologia de um banco MySQL por serviço, essa FK não pode ser aplicada pelo próprio MySQL entre schemas separados — **inferido** que a integridade referencial entre `visits.pet_id` e o pet real é garantida apenas pela aplicação (via chamada HTTP), não pelo banco. A confirmar com o arquiteto.\n\n## Usado por\n- `sys-visits-service` — leitura e escrita\n", "dominio-clinica-veterinaria/infraestrutura/recursos/res-tracing-server.md": "---\nid: res-tracing-server\nkind: resource\nsubject: resource:tracing-server-zipkin\ncamada: 6\nstatus: proposed\nrealiza: [sub-plataforma]\nrealizado-por: []\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: docker-compose.yml#L100-L108\n    version: aefaf7f\n    extraction: extracted\n---\n\n# Servidor de tracing distribuído (Zipkin)\n| Campo | Valor |\n|---|---|\n| Tipo | cluster/servidor de observabilidade (tracing distribuído) |\n| Tecnologia | Zipkin (`openzipkin/zipkin`), via Micrometer Tracing nos serviços |\n| Ambientes | local via `docker-compose.yml`, porta `9411` |\n| Definido em | `docker-compose.yml` (serviço `tracing-server`) |\n\n## Usado por\n- Todos os sistemas Spring Boot do domínio publicam traces aqui (Micrometer Tracing é citado no README do repositório); não há evidência de qual exportador exato é usado em cada serviço além da menção no README raiz — **inferido**.\n", "dominio-clinica-veterinaria/sistemas/customers-service/componentes/cmp-customers-owner-api.md": "---\nid: cmp-customers-owner-api\nkind: component\nsubject: component:customers-service:owner-resource\ncamada: 5\nstatus: proposed\nrealiza: [sys-customers-service]\nrealizado-por: [res-hsqldb-embedded, res-mysql-customers]\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-customers-service/src/main/java/org/springframework/samples/petclinic/customers/web/OwnerResource.java\n    version: aefaf7f\n    extraction: extracted\n---\n\n# OwnerResource\nEndpoint REST para criar, consultar e atualizar tutores (owners).\n\n| Campo | Valor |\n|---|---|\n| Tipo | endpoint (controller Spring MVC) |\n| Gatilho | HTTP, prefixo `/owners` |\n| Entrada | `OwnerRequest` (JSON validado com Bean Validation) ou `ownerId` de path |\n| Saída | entidade `Owner` (JSON) ou `204 No Content` na atualização |\n| Timeout / memória / concorrência | não configurado explicitamente neste componente |\n\n## Dependências\n- `OwnerRepository` (Spring Data JPA) — leitura e escrita da tabela `owners`\n- `OwnerEntityMapper` — mapeia `OwnerRequest` para a entidade `Owner`\n\n## Erros e retentativas\n- `findOwner` retorna `Optional<Owner>` — se vazio, o Spring serializa `null`/404 conforme configuração padrão (não há tratamento explícito neste método).\n- `updateOwner` lança `ResourceNotFoundException` se o owner não existir.\n- Sem fila de mensagens mortas — este componente não consome filas.\n", "dominio-clinica-veterinaria/sistemas/customers-service/componentes/cmp-customers-pet-api.md": "---\nid: cmp-customers-pet-api\nkind: component\nsubject: component:customers-service:pet-resource\ncamada: 5\nstatus: proposed\nrealiza: [sys-customers-service]\nrealizado-por: [res-hsqldb-embedded, res-mysql-customers]\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-customers-service/src/main/java/org/springframework/samples/petclinic/customers/web/PetResource.java\n    version: aefaf7f\n    extraction: extracted\n---\n\n# PetResource\nEndpoint REST para tipos de pet e para criar/consultar/atualizar pets de um tutor.\n\n| Campo | Valor |\n|---|---|\n| Tipo | endpoint (controller Spring MVC) |\n| Gatilho | HTTP, rotas `/petTypes` e `/owners/{ownerId}/pets/**` |\n| Entrada | `PetRequest` (JSON) ou `ownerId`/`petId` de path |\n| Saída | entidade `Pet`, `PetDetails` ou lista de `PetType` (JSON) |\n| Timeout / memória / concorrência | não configurado explicitamente neste componente |\n\n## Dependências\n- `PetRepository` — leitura/escrita de `pets`, consulta de `types`\n- `OwnerRepository` — para associar o pet criado ao tutor (`owner.addPet(pet)`)\n\n## Erros e retentativas\n- `processCreationForm` lança `ResourceNotFoundException` se o `ownerId` não existir.\n- `findPetById` (usado por `findPet` e `processUpdateForm`) lança `ResourceNotFoundException` se o pet não existir.\n- Sem fila de mensagens mortas.\n", "dominio-clinica-veterinaria/sistemas/customers-service/contratos/ctr-customers-get-owner.md": "---\nid: ctr-customers-get-owner\nkind: contract\nsubject: contract:customers-service:GET-/owners/{ownerId}\ncamada: 4\nstatus: proposed\nrealiza: [cap-cadastro-clientes-pets]\nrealizado-por: [cmp-customers-owner-api]\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-customers-service/src/main/java/org/springframework/samples/petclinic/customers/web/OwnerResource.java#L67-L70\n    version: aefaf7f\n    extraction: extracted\n---\n\n# GET /owners/{ownerId}\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `api-gateway` (`CustomersServiceClient.getOwner`, via Eureka `lb://customers-service`), `genai-service` (indiretamente, via `listOwners`) |\n| Especificação | sem OpenAPI; extraído de `OwnerResource.findOwner` |\n\nRetorna um tutor pelo id, incluindo a lista de pets (`Owner.pets`, carregada `EAGER`). É a chamada base do fluxo [Consulta de histórico do tutor](../../../fluxos/flow-consulta-historico-tutor.md).\n\n## Exemplo\n```json\n// GET /owners/1 -> 200\n{ \"id\": 1, \"firstName\": \"George\", \"lastName\": \"Franklin\", \"address\": \"110 W. Liberty St.\", \"city\": \"Madison\",\n  \"telephone\": \"6085551023\", \"pets\": [ { \"id\": 1, \"name\": \"Leo\", \"birthDate\": \"2010-09-07\", \"type\": { \"id\": 1, \"name\": \"cat\" } } ] }\n```\n", "dominio-clinica-veterinaria/sistemas/customers-service/contratos/ctr-customers-get-owners.md": "---\nid: ctr-customers-get-owners\nkind: contract\nsubject: contract:customers-service:GET-/owners\ncamada: 4\nstatus: proposed\nrealiza: [cap-cadastro-clientes-pets]\nrealizado-por: [cmp-customers-owner-api]\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-customers-service/src/main/java/org/springframework/samples/petclinic/customers/web/OwnerResource.java#L75-L78\n    version: aefaf7f\n    extraction: extracted\n---\n\n# GET /owners\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `genai-service` (tool `listOwners`, via `AIDataProvider.getAllOwners`) |\n| Especificação | sem OpenAPI; extraído de `OwnerResource.findAll` |\n\nLista todos os tutores cadastrados, sem paginação nem filtro.\n\n## Exemplo\n```json\n// GET /owners -> 200\n[ { \"id\": 1, \"firstName\": \"George\", \"lastName\": \"Franklin\", \"pets\": [ /* ... */ ] } ]\n```\n", "dominio-clinica-veterinaria/sistemas/customers-service/contratos/ctr-customers-get-pet.md": "---\nid: ctr-customers-get-pet\nkind: contract\nsubject: contract:customers-service:GET-owners/*/pets/{petId}\ncamada: 4\nstatus: proposed\nrealiza: [cap-cadastro-clientes-pets]\nrealizado-por: [cmp-customers-pet-api]\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-customers-service/src/main/java/org/springframework/samples/petclinic/customers/web/PetResource.java#L86-L90\n    version: aefaf7f\n    extraction: extracted\n---\n\n# GET owners/*/pets/{petId}\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `api-gateway` (tela de detalhe/edição de pet) |\n| Especificação | sem OpenAPI; extraído de `PetResource.findPet` |\n\nRetorna os detalhes de um pet, incluindo o nome completo do tutor (`PetDetails` monta `owner.getFirstName() + \" \" + owner.getLastName()`).\n\n## Exemplo\n```json\n// GET owners/1/pets/15 -> 200\n{ \"id\": 15, \"name\": \"Rex\", \"owner\": \"Ana Souza\", \"birthDate\": \"2022-01-10\", \"type\": {\"id\":2,\"name\":\"dog\"} }\n```\n", "dominio-clinica-veterinaria/sistemas/customers-service/contratos/ctr-customers-get-pettypes.md": "---\nid: ctr-customers-get-pettypes\nkind: contract\nsubject: contract:customers-service:GET-/petTypes\ncamada: 4\nstatus: proposed\nrealiza: [cap-cadastro-clientes-pets]\nrealizado-por: [cmp-customers-pet-api]\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-customers-service/src/main/java/org/springframework/samples/petclinic/customers/web/PetResource.java#L48-L51\n    version: aefaf7f\n    extraction: extracted\n---\n\n# GET /petTypes\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `api-gateway` (formulário de cadastro de pet) |\n| Especificação | sem OpenAPI; extraído de `PetResource.getPetTypes` |\n\nLista os tipos de pet cadastrados (dado de referência), usados para popular o formulário de cadastro de pet.\n\n## Exemplo\n```json\n// GET /petTypes -> 200\n[ {\"id\":1,\"name\":\"cat\"}, {\"id\":2,\"name\":\"dog\"}, {\"id\":3,\"name\":\"lizard\"}, {\"id\":4,\"name\":\"snake\"}, {\"id\":5,\"name\":\"bird\"}, {\"id\":6,\"name\":\"hamster\"} ]\n```\n", "dominio-clinica-veterinaria/sistemas/customers-service/contratos/ctr-customers-post-owners.md": "---\nid: ctr-customers-post-owners\nkind: contract\nsubject: contract:customers-service:POST-/owners\ncamada: 4\nstatus: proposed\nrealiza: [cap-cadastro-clientes-pets]\nrealizado-por: [cmp-customers-owner-api]\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-customers-service/src/main/java/org/springframework/samples/petclinic/customers/web/OwnerResource.java#L57-L62\n    version: aefaf7f\n    extraction: extracted\n---\n\n# POST /owners\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `api-gateway` (frontend AngularJS), `genai-service` (tool `addOwnerToPetclinic`) |\n| Especificação | sem OpenAPI; extraído de `OwnerResource.createOwner` |\n\nCria um novo tutor. Retorna `201 Created` com o owner criado (incluindo `id` gerado).\n\n## Exemplo\n```json\n// request\n{ \"firstName\": \"Ana\", \"lastName\": \"Souza\", \"address\": \"Rua 1\", \"city\": \"Curitiba\", \"telephone\": \"41999990000\" }\n// response 201\n{ \"id\": 11, \"firstName\": \"Ana\", \"lastName\": \"Souza\", \"address\": \"Rua 1\", \"city\": \"Curitiba\", \"telephone\": \"41999990000\", \"pets\": [] }\n```\n", "dominio-clinica-veterinaria/sistemas/customers-service/contratos/ctr-customers-post-pet.md": "---\nid: ctr-customers-post-pet\nkind: contract\nsubject: contract:customers-service:POST-/owners/{ownerId}/pets\ncamada: 4\nstatus: proposed\nrealiza: [cap-cadastro-clientes-pets]\nrealizado-por: [cmp-customers-pet-api]\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-customers-service/src/main/java/org/springframework/samples/petclinic/customers/web/PetResource.java#L53-L61\n    version: aefaf7f\n    extraction: extracted\n---\n\n# POST /owners/{ownerId}/pets\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `api-gateway` (formulário de cadastro de pet), `genai-service` (tool `addPetToOwner`) |\n| Especificação | sem OpenAPI; extraído de `PetResource.processCreationForm` |\n\nCria um novo pet associado a um tutor existente. IDs de tipo de pet válidos: 1=cat, 2=dog, 3=lizard, 4=snake, 5=bird, 6=hamster (conforme descrição da tool `addPetToOwner` do `genai-service`). Retorna `201 Created`.\n\n## Exemplo\n```json\n// POST /owners/1/pets\n{ \"name\": \"Rex\", \"birthDate\": \"2022-01-10\", \"typeId\": 2 }\n// -> 201\n{ \"id\": 15, \"name\": \"Rex\", \"birthDate\": \"2022-01-10\", \"type\": {\"id\":2,\"name\":\"dog\"} }\n```\n", "dominio-clinica-veterinaria/sistemas/customers-service/contratos/ctr-customers-put-owner.md": "---\nid: ctr-customers-put-owner\nkind: contract\nsubject: contract:customers-service:PUT-/owners/{ownerId}\ncamada: 4\nstatus: proposed\nrealiza: [cap-cadastro-clientes-pets]\nrealizado-por: [cmp-customers-owner-api]\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-customers-service/src/main/java/org/springframework/samples/petclinic/customers/web/OwnerResource.java#L83-L89\n    version: aefaf7f\n    extraction: extracted\n---\n\n# PUT /owners/{ownerId}\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `api-gateway` (frontend AngularJS, tela de edição de tutor) |\n| Especificação | sem OpenAPI; extraído de `OwnerResource.updateOwner` |\n\nAtualiza os dados de um tutor existente. Retorna `204 No Content`. Lança `ResourceNotFoundException` (caminho de erro) se `ownerId` não existir.\n\n## Exemplo\n```json\n// PUT /owners/1\n{ \"firstName\": \"George\", \"lastName\": \"Franklin\", \"address\": \"110 W. Liberty St.\", \"city\": \"Madison\", \"telephone\": \"6085551023\" }\n// -> 204 No Content\n```\n", "dominio-clinica-veterinaria/sistemas/customers-service/contratos/ctr-customers-put-pet.md": "---\nid: ctr-customers-put-pet\nkind: contract\nsubject: contract:customers-service:PUT-/owners/*/pets/{petId}\ncamada: 4\nstatus: proposed\nrealiza: [cap-cadastro-clientes-pets]\nrealizado-por: [cmp-customers-pet-api]\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-customers-service/src/main/java/org/springframework/samples/petclinic/customers/web/PetResource.java#L63-L68\n    version: aefaf7f\n    extraction: extracted\n---\n\n# PUT /owners/*/pets/{petId}\n| Campo | Valor |\n|---|---|\n| Tipo | API (síncrona, REST/JSON) |\n| Produtor | `customers-service` |\n| Consumidores | `api-gateway` (formulário de edição de pet) |\n| Especificação | sem OpenAPI; extraído de `PetResource.processUpdateForm` |\n\nAtualiza nome, data de nascimento e tipo de um pet existente. O `ownerId` no path é ignorado (`*`) — o pet é localizado só por `petId`, presente também no corpo (`PetRequest.id`). Retorna `204 No Content`.\n\n## Exemplo\n```json\n// PUT /owners/1/pets/15\n{ \"id\": 15, \"name\": \"Rex\", \"birthDate\": \"2022-01-10\", \"typeId\": 2 }\n// -> 204 No Content\n```\n", "dominio-clinica-veterinaria/sistemas/customers-service/ficha.md": "---\nid: sys-customers-service\nkind: system\nsubject: system:customers-service\ncamada: 4\nstatus: proposed\nrealiza: [sub-cadastro, cap-cadastro-clientes-pets]\nrealizado-por: [cmp-customers-owner-api, cmp-customers-pet-api, res-hsqldb-embedded, res-mysql-customers]\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-customers-service/pom.xml; spring-petclinic-customers-service/src/main/resources/application.yml\n    version: aefaf7f\n    extraction: extracted\n---\n\n# customers-service\nMantém o cadastro de tutores (owners) e de seus pets, incluindo os tipos de pet disponíveis (cat, dog, lizard, snake, bird, hamster).\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | [Cadastro de Clientes e Pets](../../subdominios/sub-cadastro.md) |\n| Dono | não informado (sem `CODEOWNERS` no repositório) — a confirmar |\n| Stack | Java 17+, Spring Boot 4.0.1, Spring Cloud (Eureka Client, Config Client), Spring Data JPA |\n| Repositório | `spring-petclinic-customers-service/` (módulo Maven deste monorepo) |\n| Criticidade | alta (inferido — é a fonte de verdade de owners/pets, usada pelo `api-gateway`, `visits-service` (referência de `pet_id`) e `genai-service`); valor de SLA não confirmado |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph customers-service\n    API[REST API: OwnerResource + PetResource]\n    MAP[OwnerEntityMapper]\n    API --> MAP\n    MAP --> REPO[(JPA Repositories)]\n  end\n  REPO --> DB[(banco: owners, pets, types)]\n  EUREKA[[discovery-server]] -.registra/descobre.-> API\n  CFG[[config-server]] -.configuração.-> API\n```\n\n## Expõe\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `POST /owners` | API REST | [ctr-customers-post-owners](contratos/ctr-customers-post-owners.md) |\n| `GET /owners/{ownerId}` | API REST | [ctr-customers-get-owner](contratos/ctr-customers-get-owner.md) |\n| `GET /owners` | API REST | [ctr-customers-get-owners](contratos/ctr-customers-get-owners.md) |\n| `PUT /owners/{ownerId}` | API REST | [ctr-customers-put-owner](contratos/ctr-customers-put-owner.md) |\n| `GET /petTypes` | API REST | [ctr-customers-get-pettypes](contratos/ctr-customers-get-pettypes.md) |\n| `POST /owners/{ownerId}/pets` | API REST | [ctr-customers-post-pet](contratos/ctr-customers-post-pet.md) |\n| `PUT /owners/*/pets/{petId}` | API REST | [ctr-customers-put-pet](contratos/ctr-customers-put-pet.md) |\n| `GET /owners/*/pets/{petId}` | API REST | [ctr-customers-get-pet](contratos/ctr-customers-get-pet.md) |\n\nNão há OpenAPI/Swagger neste repositório para este serviço — os contratos abaixo foram extraídos diretamente dos controllers (`extracted`).\n\n## Consome\n| Sistema | Contrato | Tipo |\n|---|---|---|\n| discovery-server | registro/descoberta Eureka | infraestrutura |\n| config-server | propriedades externas (`optional:configserver:...`) | infraestrutura |\n\nEste serviço não chama nenhum outro sistema de negócio — é uma folha na topologia de chamadas síncronas.\n\n## Dados\n```mermaid\nerDiagram\n  OWNER ||--o{ PET : possui\n  PET_TYPE ||--o{ PET : classifica\n  OWNER {\n    int id PK\n    string first_name\n    string last_name\n    string address\n    string city\n    string telephone\n  }\n  PET {\n    int id PK\n    string name\n    date birth_date\n    int type_id FK\n    int owner_id FK\n  }\n  PET_TYPE {\n    int id PK\n    string name\n  }\n```\nFonte: `src/main/resources/db/mysql/schema.sql` (tabelas `owners`, `pets`, `types`) e entidades JPA `Owner`, `Pet`, `PetType`. `pets.owner_id` e `pets.type_id` têm `FOREIGN KEY` no MySQL. Tipos de pet são dados de referência carregados por `data.sql` (ex.: cat, dog, lizard, snake, bird, hamster — confirmado também pela descrição da tool `addPetToOwner` do `genai-service`).\n\n## Qualidade\n- Validação de entrada: `@NotBlank` em nome/endereço/cidade/telefone do owner; `@Digits(fraction=0, integer=12)` no telefone (até 12 dígitos, sem fração); `@Min(1)` em ids de path; `@Size(min=1)` no nome do pet.\n- `ResourceNotFoundException` (não mostrado aqui em detalhe) é lançada quando owner ou pet não existem — mapeada presumivelmente para HTTP 404 (`inferred`, o handler de exceção não foi localizado nas fontes lidas).\n- Métricas: todos os endpoints são anotados com `@Timed(\"petclinic.owner\")` / `@Timed(\"petclinic.pet\")` (Micrometer).\n- Sem timeout, retry ou circuit breaker configurado neste serviço (ele é sempre o lado \"servidor\" das chamadas síncronas do domínio).\n", "dominio-clinica-veterinaria/sistemas/vets-service/ficha.md": "---\nid: sys-vets-service\nkind: system\nsubject: system:vets-service\ncamada: 4\nstatus: proposed\nrealiza: [sub-corpo-clinico, cap-gestao-corpo-clinico]\nrealizado-por: [cmp-vets-vet-api, res-hsqldb-embedded, res-mysql-vets]\nprovenance:\n  - source: repo:spring-petclinic-microservices\n    locator: spring-petclinic-vets-service/pom.xml; spring-petclinic-vets-service/src/main/resources/application.yml\n    version: aefaf7f\n    extraction: extracted\n---\n\n# vets-service\nMantém o cadastro de veterinários e suas especialidades. É um serviço somente leitura do ponto de vista da API (não expõe criação/edição de veterinários).\n\n| Campo | Valor |\n|---|---|\n| Subdomínio | [Corpo Clínico](../../subdominios/sub-corpo-clinico.md) |\n| Dono | não informado — a confirmar |\n| Stack | Java 17+, Spring Boot 4.0.1, Spring Cloud (Eureka Client, Config Client), Spring Data JPA, Spring Cache |\n| Repositório | `spring-petclinic-vets-service/` |\n| Criticidade | média (inferido — consultado pelo `api-gateway`/frontend e pelo `genai-service`, mas os dados são estáticos e cacheados) |\n\n## Contêineres\n```mermaid\nflowchart LR\n  subgraph vets-service\n    API[REST API: VetResource] --> CACHE[[cache \"vets\"]]\n    CACHE --> REPO[(VetRepository)]\n  end\n  REPO --> DB[(banco: vets, specialties, vet_specialties)]\n```\n\n## Expõe\n| Contrato | Tipo | Detalhe |\n|---|---|---|\n| `GET /vets` | API REST | [ctr-vets-get-vets](contratos/ctr-vets-get-vets.md) |\n\n## Consome\n| Sistema | Contrato | Tipo |\n|---|---|---|\n| discovery-server | registro/descoberta Eureka | infraestrutura |\n| config-server | propriedades externas | infraestrutura |\n\n## Dados\n```mermaid\nerDiagram\n  VET ||--o{ VET_SPECIALTY : tem\n  SPECIALTY ||--o{ VET_SPECIALTY : classifica\n  VET {\n    int id PK\n    string first_name\n    string last_name\n  }\n  SPECIALTY {\n    int id PK\n    string name\n  }\n  VET_SPECIALTY {\n    int vet_id FK\n    int specialty_id FK\n  }\n```\nFonte: `db/mysql/schema.sql` (tabelas `vets`, `specialties`, `vet_specialties` — tabela de junção many-to-many com `UNIQUE(vet_id, specialty_id)`) e entidades `Vet`, `Specialty`.\n\n## Qualidade\n- `GET /vets` é anotado `@Cacheable(\"vets\")`; o cache só é habilitado no perfil `production` (`CacheConfig`, `@Profile(\"production\")`) e é definido em `application.yml` (`spring.cache.cache-names: vets`) — em testes o cache fica desabilitado.\n- Sem timeout/retry configurado neste serviço (é sempre o lado servidor).\n- Sem paginação nem filtro no endpoint — retorna sempre a lista completa.\n"};
mermaid.initialize({startOnLoad:false, theme:'default'});
const nav = document.getElementById('nav'), doc = document.getElementById('doc');
const keys = Object.keys(F).sort((a,b)=> (a.includes('RELATORIO')?-1:0) - (b.includes('RELATORIO')?-1:0) || a.localeCompare(b));
async function show(k){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.k===k));
  let t = F[k], fm = '';
  const m = t.match(/^---\n([\s\S]*?)\n---\n?/);
  if (m) { fm = '<div class="fm">'+m[1].replace(/</g,'&lt;')+'</div>'; t = t.slice(m[0].length); }
  let h = marked.parse(t);
  h = h.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g, (_, c) => '<div class="mermaid">'+c+'</div>');
  doc.innerHTML = '<p style="color:var(--muted);font-size:12px">'+k+'</p>' + fm + h;
  doc.querySelectorAll('.mermaid').forEach(el => { el.textContent = el.textContent.replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&'); });
  try { await mermaid.run({nodes: doc.querySelectorAll('.mermaid')}); } catch(e) { console.warn(e); }
}
keys.forEach(k => { const a = document.createElement('a'); a.href='#'; a.textContent=k; a.dataset.k=k; a.onclick=e=>{e.preventDefault();show(k)}; nav.appendChild(a); });
show(keys[0]);
